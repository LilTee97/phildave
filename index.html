<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Phildave – Hợp âm màu</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#16181d">
<style>
  :root { --bg:#16181d; --card:#22252c; --tx:#e9e9ee; --mut:#9aa0ab; --lh:#4ea1ff; --rh:#ffa94d; --ok:#3ecf72; --bad:#ff5d5d; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,sans-serif; background:var(--bg); color:var(--tx); display:flex; flex-direction:column; height:100vh; }
  header { display:flex; align-items:center; justify-content:space-between; padding:10px 14px; background:#101216; }
  header b { font-size:16px; }
  #midi { font-size:13px; color:var(--mut); }
  #midi.on { color:var(--ok); }
  nav { display:flex; }
  nav button { flex:1; padding:10px; background:#1c1f25; color:var(--mut); border:0; border-bottom:2px solid transparent; font-size:15px; }
  nav button.act { color:var(--tx); border-color:var(--rh); }
  main { flex:1; overflow:auto; padding:12px 14px; }
  .card { background:var(--card); border-radius:10px; padding:12px; margin-bottom:10px; }
  .card h3 { margin:0 0 6px; font-size:16px; }
  .card p { margin:4px 0; color:#cfd2d8; line-height:1.45; }
  button.b { background:#2f3440; color:var(--tx); border:0; border-radius:8px; padding:9px 12px; font-size:15px; margin:4px 4px 0 0; }
  button.b.pri { background:var(--rh); color:#1a1a1a; font-weight:600; }
  .choices { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:8px; }
  .choices button { padding:14px 6px; font-size:16px; }
  .choices button.right { background:var(--ok); color:#111; font-weight:700; }
  .choices button.wrong { background:var(--bad); color:#111; }
  .playing { outline:3px solid var(--ok); }
  .sug { display:flex; gap:6px; align-items:flex-start; padding:6px; border-radius:8px; border:2px solid transparent; }
  .sug.sel { border-color:var(--rh); background:#2b2a26; }
  .sug div { flex:1; }
  .prog { font-size:20px; letter-spacing:1px; margin:6px 0; }
  .prog .q { color:var(--rh); }
  .mel { margin:4px 0; overflow-wrap:anywhere; }
  input { width:100%; padding:10px; font-size:17px; border-radius:8px; border:1px solid #3a3f4b; background:#111318; color:var(--tx); }
  .ok { color:var(--ok); } .bad { color:var(--bad); } .mut { color:var(--mut); font-size:13px; }
  #practice { background:#101216; padding:8px 10px 10px; border-top:1px solid #2a2e37; }
  #ptitle { font-size:15px; min-height:20px; }
  #phint { font-size:13px; color:var(--mut); min-height:18px; white-space:pre-line; }
  #kbwrap { overflow-x:auto; margin-top:6px; }
  #kb { position:relative; height:110px; }
  .w,.k { position:absolute; top:0; border-radius:0 0 4px 4px; }
  .w { width:28px; height:110px; background:#f4f4f4; border:1px solid #888; }
  .k { width:18px; height:68px; background:#222; z-index:2; border:1px solid #000; }
  .lh { background:var(--lh) !important; } .rh { background:var(--rh) !important; }
  .on { box-shadow: inset 0 -14px 0 var(--ok); }
  .lbl { position:absolute; bottom:3px; width:100%; text-align:center; font-size:10px; color:#555; pointer-events:none; }
  .lbl.c { font-size:13px; font-weight:800; color:#000; }
  .k .lbl { font-size:7.5px; letter-spacing:-.3px; color:#ddd; bottom:4px; }
  #kblabels { position:relative; height:22px; }
  .hand { position:absolute; top:0; transform:translateX(-50%); white-space:nowrap; font-size:13px; font-weight:700; padding:1px 6px; border-radius:6px; color:#111; }
  .lesson { display:block; width:100%; text-align:left; margin-top:6px; }
  .lesson.next { border:1px solid var(--rh); }
  .lhead { margin-bottom:6px; }
  .why { color:var(--mut); font-size:14px; margin:8px 0 0; }
  .remember { padding-left:20px; line-height:1.5; }
  .tip { background:#2b2a26; border-left:3px solid var(--rh); border-radius:6px; padding:8px 10px; margin:8px 0; font-size:15px; line-height:1.45; }
  .term { border-bottom:1px dotted var(--rh); cursor:pointer; }
  .term-pop { position:fixed; left:10px; right:10px; bottom:160px; z-index:20; background:#2b2f38; border:1px solid var(--rh); border-radius:8px; padding:10px 34px 10px 12px; font-size:14px; line-height:1.4; box-shadow:0 4px 16px #0008; }
  .term-pop button { position:absolute; top:4px; right:6px; background:none; border:0; color:var(--mut); font-size:16px; }
  .row { display:flex; gap:6px; align-items:center; flex-wrap:wrap; margin-top:4px; }
  .qlab { display:block; font-size:13px; color:var(--mut); }
  #qmode { display:block; width:100%; max-width:100%; margin-top:4px; padding:9px; font-size:15px; border-radius:8px; border:1px solid #3a3f4b; background:#111318; color:var(--tx); }
  button.b.seg.act { background:var(--rh); color:#1a1a1a; font-weight:600; }
  button.b:disabled { opacity:.55; }
  .choices button.right, .choices button.wrong { opacity:1; }
  .choices button { overflow-wrap:anywhere; }
  #qscore { margin-left:auto; }
  .confirm { background:#2b2a26; border-radius:8px; padding:6px 8px; } .confirm span { flex:1 1 100%; }
  .tbar { flex:1; height:12px; background:#111318; border-radius:6px; overflow:hidden; }
  .tbar i { display:block; height:100%; background:var(--ok); }
  .tbar i.low { background:var(--bad); }
  .tsec { min-width:2ch; text-align:right; font-size:20px; font-variant-numeric:tabular-nums; }
  .bigscore { font-size:44px; font-weight:800; line-height:1.1; }
  .wq { border-top:1px solid #2f3440; padding:8px 0; } .wq p { margin:2px 0; }
  .hchart { height:110px; padding-left:22px; margin:8px 0 22px; }
  .hplot { position:relative; display:flex; align-items:flex-end; gap:4px; height:100%; }
  .hcol { position:relative; flex:1; min-width:0; height:100%; display:flex; align-items:flex-end; justify-content:center; }
  .hbar { width:100%; max-width:30px; background:var(--rh); border-radius:3px 3px 0 0; }
  .hbar.pass { background:var(--ok); }
  .hcol > span { position:absolute; bottom:-16px; font-size:11px; color:var(--mut); }
  .hline { position:absolute; left:-4px; right:0; border-top:1px dashed var(--mut); pointer-events:none; }
  .hline span { position:absolute; left:-18px; top:-8px; font-size:11px; color:var(--mut); }
  .pkroots { display:grid; grid-template-columns:repeat(6, 1fr); gap:4px; margin-top:4px; }
  .pkroots button.b { margin:0; padding:8px 2px; font-size:13px; }
  .pkrow { margin-top:6px; } .pkrow > span { display:block; }
  .pkrow button.b { padding:7px 9px; font-size:14px; }
  .libkeys { display:grid; grid-template-columns:repeat(6, 1fr); gap:4px; margin-top:6px; }
  .libkeys button.b { margin:0; padding:8px 2px; }
  #libshape { display:block; width:100%; margin-top:6px; padding:9px; font-size:15px; border-radius:8px; border:1px solid #3a3f4b; background:#111318; color:var(--tx); }
  .libchips button.b { padding:7px 9px; font-size:14px; }
  .libname { font-size:22px; font-weight:800; }
  .libtypes { display:flex; flex-wrap:wrap; gap:2px 6px; margin-top:4px; }
  .libtypes label { display:inline-flex; align-items:center; gap:5px; padding:6px 8px; background:#2f3440; border-radius:8px; font-size:14px; }
  .libtypes input { width:auto; margin:0; padding:0; }
  #lhaway { position:sticky; left:4px; display:inline-block; transform:none; cursor:pointer; z-index:3; }
  #practice.lib #show, #practice.lib #checkTap, #practice.lib #clearTap { display:none; }   /* Thư viện lúc tra cứu chỉ xem thế bấm; lúc tập thì bỏ class lib để chạm + Kiểm tra */
</style>
</head>
<body>
<header><b>Phildave</b><label style="font-size:12px;margin-left:12px">Mức tay <select id="level"><option>1</option><option>2</option><option selected>3</option><option>4</option></select></label><label style="font-size:12px;margin-left:12px" title="Âm lượng">🔊 <input type="range" id="vol" min="0.4" max="3" step="0.1" style="width:80px;vertical-align:middle"></label><span id="snd" title="Âm piano: FluidR3_GM (Frank Wen), CC BY 3.0" style="font-size:12px;margin-left:12px">♪ tổng hợp</span><span id="midi">● chưa nối đàn</span></header>
<nav>
  <button data-t="learn" class="act">Học</button>
  <button data-t="quiz">Đố</button>
  <button data-t="reharm">Tái hoà âm</button>
  <button data-t="library">Thư viện</button>
</nav>
<main id="main"></main>
<section id="practice">
  <div id="ptitle" class="mut">Mở một bài ở mục Học, hoặc chạm hợp âm ở mục Tái hoà âm để luyện tay</div>
  <div id="phint"></div>
  <div class="row">
    <button class="b" id="show">Hiện cách bấm</button>
    <button class="b" id="checkTap">Kiểm tra (chạm)</button>
    <button class="b" id="clearTap">Xoá</button>
    <span id="pres"></span>
  </div>
  <div id="kbwrap"><div id="kblabels"></div><div id="kb"></div></div>
</section>

<script type="application/json" id="lessons">[
  {"id": "p3-01", "part": 3, "src": "Phildave 3 · Bài 1", "title": "Tritone: cặp nốt bứt rứt trong G7", "teach": [{"text": "Nửa cung là bước nhỏ nhất trên đàn: từ một phím sang phím sát bên nó, tính cả phím đen. Hai nửa cung là một cung. Khoảng cách giữa hai nốt gọi là quãng; cả khoá học sẽ đo quãng để tìm ra những cặp nốt đặc biệt. Ví dụ từ C lên E là hai cung: C lên D một cung, D lên E thêm một cung.", "tip": "Hai phím trắng có phím đen ở giữa (như C–D) cách nhau một cung; hai phím trắng sát nhau không có phím đen ở giữa (E–F, B–C) chỉ cách nửa cung.", "keys": ["C4", "E4"], "play": [["C4"], ["D4"], ["E4"], ["C4", "E4"]], "compare": {"a": {"label": "C–D (một cung)", "play": [["C4"], ["D4"]]}, "b": {"label": "E–F (nửa cung)", "play": [["E4"], ["F4"]]}}}, {"text": "Bây giờ đo từ B lên F: B lên C# là một cung, C# lên D# thêm một cung, D# lên F thêm một cung nữa, tổng cộng ba cung. Quãng rộng đúng ba cung như vậy gọi là tritone (quãng ba cung); sách nhạc còn gọi nó là quãng 4 tăng hay quãng 5 giảm, đó chỉ là tên khác của cùng một quãng. Bấm B và F cùng lúc rồi so với C và G: C–G nghe yên và tròn, còn B–F nghe bứt rứt, như đang chờ đi tiếp. Thầy nói tritone là phần quan trọng nhất của cả khoá học này.", "tip": "Mỗi bước một cung là bỏ qua đúng một phím: B (bỏ C) C#, (bỏ D) D#, (bỏ E) F.", "keys": ["B3", "F4"], "play": [["B4"], ["C#5"], ["D#5"], ["F5"], ["B3", "F4"]], "compare": {"a": {"label": "B–F (tritone)", "play": [["B3", "F4"]]}, "b": {"label": "C–G (yên)", "play": [["C4", "G4"]]}}}, {"text": "Đếm từng cung mỗi lần thì chậm, nên thầy dùng mẹo đọc \"ba-na-na-pa-in-ae-pl\" (chữ banana pineapple đọc theo tiếng Hàn, đủ bảy âm tiết). Đặt ngón vào nốt đầu và đọc âm tiết thứ nhất, rồi mỗi âm tiết tiếp theo bấm phím liền bên phải, tính cả phím đen. Âm tiết thứ bảy rơi đúng vào nốt tạo tritone với nốt đầu: bắt đầu từ B thì đọc qua B, C, C#, D, D#, E, F và rơi vào F. Bảy phím này là sáu bước nửa cung, đúng bằng ba cung như màn trước.", "tip": "Bắt đầu từ C thì âm tiết thứ bảy rơi vào F#; bắt đầu từ F thì rơi vào B, nên F–B cũng là tritone.", "keys": ["B3", "F4"], "play": [["B4"], ["C5"], ["C#5"], ["D5"], ["D#5"], ["E5"], ["F5"]]}, {"text": "G7 gồm bốn nốt G, B, D, F; G là nốt gốc, nốt đặt tên cho hợp âm. Để gọi tên từng nốt, đếm tên nốt từ nốt gốc: G là 1, A là 2, B là 3, C là 4, D là 5, E là 6, F là 7. Vì vậy trong G7, B là bậc 3, D là bậc 5, F là bậc 7: ba nốt G B D chính là hợp âm G trưởng bạn đã biết, thêm F ở trên. Hợp âm ghi số 7 không kèm chữ nào khác, như G7, gọi là hợp âm 7, còn gọi là hợp âm át 7 (dominant 7). Chữ \"át\" (dominant) nghĩa là chi phối: G7 dựng trên nốt thứ năm của giọng C (G) và chi phối cả bài, vì nó luôn kéo về C.", "tip": "Tìm nhanh các nốt của G7 trên phím trắng: bấm G rồi cứ cách một phím bấm một phím (G, bỏ A, B, bỏ C, D, bỏ E, F).", "show": "G7", "play": [["G4"], ["B4"], ["D5"], ["F5"], "G7"]}, {"text": "Hợp âm bốn nốt có nhiều loại, và nốt 7 cho biết là loại nào. Cmaj7 (C E G B) có nốt 7 là B; C7 (C E G Bb) là hợp âm 7, có nốt 7 là Bb, thấp hơn B nửa cung; G7 (G B D F) có nốt 7 là F. Nghe Cmaj7 rồi C7: chỉ khác một nốt mà màu khác hẳn, Cmaj7 nghe sáng và đứng yên, C7 nghe như còn muốn đi tiếp. Vì vậy khi đọc tên hợp âm, nhìn kỹ chữ đi sau tên: maj7, m7 hay chỉ có số 7.", "tip": "Tìm nốt 7 bằng cách lấy nốt gốc ở trên rồi lùi xuống: maj7 lùi nửa cung (Cmaj7: C lùi nửa cung là B), hợp âm 7 lùi một cung (G7: G lùi một cung là F). Hợp âm m7 như Dm7 (D F A C) cũng lùi một cung: D lùi một cung là C.", "keys": ["B4", "C5"], "compare": {"a": {"label": "Cmaj7 (nốt 7 là B)", "play": ["Cmaj7"]}, "b": {"label": "C7 (nốt 7 là Bb)", "play": ["C7"]}}}, {"text": "Trong bốn nốt của hợp âm, bậc 3 và bậc 7 gọi là nốt định hướng (guide tones), vì hai nốt này quyết định tính chất hợp âm. Bậc 3 cho biết trưởng hay thứ: C E G là C trưởng, hạ E xuống Eb thì thành C thứ (Cm). Bậc 7 cho biết là maj7 hay hợp âm 7: Cmaj7 có B, C7 có Bb. Còn bậc 1 và bậc 5 thì giống nhau ở mọi loại (C và G có trong C, Cm, Cmaj7, C7), nên ít nói lên điều gì.", "tip": "Muốn biết một hợp âm thuộc loại nào, chỉ cần nhìn hai nốt: bậc 3 (trưởng hay thứ) và bậc 7 (maj7 hay 7).", "keys": ["E4", "B4"], "play": [["C4", "E4", "G4"], ["C4", "Eb4", "G4"]], "compare": {"a": {"label": "Cmaj7 (bậc 7 là B)", "play": ["Cmaj7"]}, "b": {"label": "C7 (bậc 7 là Bb)", "play": ["C7"]}}}, {"text": "Nốt định hướng của Cmaj7 là E và B: hai nốt này nghe hoà với nhau, nên Cmaj7 đứng yên được. Nốt định hướng của G7 là B và F, chính là cặp tritone ở trên, nên G7 nghe căng. Cái căng này có hướng rõ ràng: B nằm ngay dưới C nửa cung nên muốn đi lên C, F nằm ngay trên E nửa cung nên muốn đi xuống E. C và E là hai nốt của hợp âm C, vì thế G7 muốn đi tiếp về C.", "tip": "Nghe tay phải: B đi lên C, F đi xuống E, mỗi nốt chỉ nhích nửa cung.", "keys": ["B3", "F4"], "play": [["B3", "F4"], ["C4", "E4"]], "compare": {"a": {"label": "Cmaj7 (yên)", "play": ["Cmaj7"]}, "b": {"label": "G7 → C", "play": ["G7", "C"]}}}, {"text": "Giọng (key) gồm hai phần. Phần thứ nhất là hợp âm nhà, gọi là chủ (tonic): chỗ nghe như đã xong. Thử nghe C D E F G A B rồi dừng ở B: thấy còn dở; thêm C ở trên là thấy xong, vì giọng C có nhà là C. Phần thứ hai là bộ 7 nốt chính, giọng C là C D E F G A B, tức mọi phím trắng; giai điệu và hợp âm của bài phần lớn lấy từ bộ nốt này.", "tip": "Bài hát thường kết thúc ở hợp âm nhà: nhìn hợp âm cuối bài là đoán được giọng.", "keys": ["C4"], "compare": {"a": {"label": "Dừng ở B (còn dở)", "play": [["C4"], ["D4"], ["E4"], ["F4"], ["G4"], ["A4"], ["B4"]]}, "b": {"label": "Về C (xong)", "play": [["C4"], ["D4"], ["E4"], ["F4"], ["G4"], ["A4"], ["B4"], ["C5"]]}}}, {"text": "Từ bộ 7 nốt, dựng hợp âm bằng cách lấy một nốt rồi xếp chồng cách một phím trắng: C E G B, D F A C, E G B D, và cứ thế. Ta được 7 hợp âm của giọng C: Cmaj7, Dm7, Em7, Fmaj7, G7, Am7, Bm7b5 (Bm7b5 học ở bài 9). Trong 7 hợp âm đó, chỉ G7 có bậc 3 và bậc 7 tạo thành tritone (B và F). Vì thế chỉ G7 mang cái căng muốn về nhà C; Bm7b5 cũng có B–F nhưng ở bậc 1 và bậc 5 (bài 9 sẽ nói), còn các hợp âm kia nghe yên.", "tip": "Dựng trên phím trắng: bấm một phím, bỏ một phím (D, bỏ E, F, bỏ G, A, bỏ B, C ra Dm7).", "play": ["Cmaj7", "Dm7", "Em7", "Fmaj7", "G7", "Am7", "Bm7b5", "Cmaj7"]}, {"text": "Bài trong giọng C vẫn có thể có hợp âm ngoài giọng, tức hợp âm có nốt nằm ngoài bộ 7 nốt. Ví dụ Am7 (A C E G) nâng C lên C# thành A7 (A C# E G), và C# với G là một cặp tritone. C# nằm ngay dưới D nửa cung nên muốn đi lên D, vì vậy A7 kéo mạnh về Dm, giống G7 kéo về C. Quy luật chung: hợp âm ngoài giọng là đường vòng dẫn vào một trong 7 hợp âm của giọng (các bài sau dạy từng cách), nên nhà vẫn là C.", "tip": "Nâng bậc 3 của hợp âm m7 lên nửa cung là ra hợp âm 7: Am7 (A C E G) thành A7 (A C# E G).", "keys": ["C#4", "G4"], "play": ["Am7", "A7", "Dm"]}], "remember": ["Tritone (quãng ba cung) là cặp nốt bứt rứt, ví dụ B–F; tìm bằng mẹo banana: đọc bảy âm tiết, mỗi âm tiết một phím liền nhau.", "Nốt 7: maj7 = nốt gốc lùi nửa cung (Cmaj7 có B); hợp âm 7 (hợp âm át 7) = nốt gốc lùi một cung (G7 có F).", "Nốt định hướng (guide tones) là bậc 3 và bậc 7; trong giọng C chỉ G7 có cặp này là tritone: B muốn lên C, F muốn xuống E."], "items": [{"chord": "G7", "to": "C"}], "quiz": [{"q": "Trong G7 (G B D F), cặp nốt nào là tritone, cặp bứt rứt?", "choices": ["B và F", "G và D", "G và B", "D và F"], "answer": "B và F", "why": "Đọc mẹo banana từ B, âm tiết thứ bảy rơi đúng vào F (B và F cách nhau ba cung, tức 6 nửa cung)."}, {"q": "Trong 7 hợp âm của giọng C, hợp âm nào có tritone giữa bậc 3 và bậc 7?", "choices": ["G7", "Cmaj7", "Am7", "Dm7"], "answer": "G7", "why": "Bậc 3 và bậc 7 của G7 là B và F, đúng cặp tritone; Cmaj7 có E và B, Am7 có C và G, Dm7 có F và C, đều nghe yên."}, {"q": "Nốt 7 của Cmaj7 là nốt nào?", "choices": ["B", "Bb", "A", "G"], "answer": "B", "why": "Mẹo: nốt 7 của maj7 là nốt gốc lùi nửa cung, C lùi nửa cung là B. Còn C7 thì lùi một cung, ra Bb."}]},

  {"id": "p3-02", "part": 3, "src": "Phildave 3 · Bài 2", "title": "Tritone là quãng bất ổn nhất", "teach": [{"text": "Trong mọi cặp hai nốt vang cùng lúc, tai người thấy tritone (quãng ba cung, như B–F) là bất ổn nhất. Thử với Cmaj7 (C E G B): hạ nốt B xuống nửa cung, tức sang phím đen Bb ngay bên trái, ta được C7 (C E G Bb). Lúc này hai nốt định hướng (bậc 3 và bậc 7) là E và Bb, thành một tritone. Nghe Cmaj7 rồi C7: Cmaj7 đứng yên được, còn C7 nghe như đang \"cần đi đâu đó\".", "tip": "Kiểm tra bằng mẹo banana: bắt đầu từ E, âm tiết thứ bảy rơi đúng vào Bb.", "show": "C7", "compare": {"a": {"label": "Cmaj7", "play": ["Cmaj7"]}, "b": {"label": "C7", "play": ["C7"]}}}, {"text": "Vì có tritone giữa bậc 3 và bậc 7, hợp âm 7 (hợp âm át 7, dominant 7) luôn muốn kéo về một hợp âm yên. Thầy gọi vui hợp âm 7 là \"mẹ\", còn hợp âm nó kéo về là \"con\": mẹ dắt con về nhà. G7 là \"mẹ\" của C: B của G7 đi lên C, F đi xuống E, thành hợp âm C. Cái tên này giúp nhớ nhanh: thấy hợp âm 7 là hỏi ngay \"con\" của nó ở đâu.", "tip": "Nghe ví dụ: tay trái G rồi C; tay phải B lên C, F xuống E.", "show": "G7", "play": [["G2", "B3", "F4"], ["C3", "C4", "E4"]]}, {"text": "Từ \"mẹ\" về \"con\", nốt gốc đi xuống một quãng 5: G xuống C. Quãng 5 nghĩa là đếm được 5 tên nốt, tính cả hai đầu: G, F, E, D, C. Muốn tìm \"mẹ\" của một hợp âm thì làm ngược lại: từ nốt gốc của nó đếm lên 5 tên nốt, nốt thứ năm là nốt gốc của \"mẹ\". Ví dụ con là C: đếm C, D, E, F, G, nên \"mẹ\" là G7; con là F: đếm F, G, A, Bb, C, nên \"mẹ\" là C7.", "tip": "Tìm \"mẹ\" của một hợp âm: từ nốt gốc của nó đếm lên 5 tên nốt, nốt thứ năm là nốt gốc của \"mẹ\" (C, D, E, F, G: \"mẹ\" của C là G7). Nốt thứ năm luôn cùng loại phím với nốt đầu (C–G, D–A, Eb–Bb, F#–C#); chỉ có hai ngoại lệ khác loại phím: B lên F# và Bb lên F (vì B–F là tritone).", "play": ["G7", "C", "C7", "F"]}, {"text": "Vì tritone bất ổn, nó sinh ra một lực muốn tìm chỗ yên, gọi là lực kéo về chủ (dominant motion). Nhắc lại: chủ là hợp âm nhà của giọng; trong giọng C, chủ là C. Nghe C – F – G7 rồi dừng: tai thấy treo lửng; thêm C ở cuối thì cảm giác căng được thả lỏng, như thở ra. Thầy nói mọi tiến hành hợp âm (chuỗi hợp âm nối nhau) thực chất đều nhờ tritone mà có: có chỗ căng thì chuỗi hợp âm mới có chỗ để đi tới.", "play": ["G7", "C"], "compare": {"a": {"label": "Dừng ở G7", "play": ["C", "F", "G7"]}, "b": {"label": "G7 → C", "play": ["C", "F", "G7", "C"]}}}, {"text": "Không chỉ G7 mới là \"mẹ\". A7 = A C# E G cũng có tritone giữa bậc 3 (C#) và bậc 7 (G), nên A7 cũng kéo về hợp âm có nốt gốc thấp hơn nó một quãng 5: đếm xuống A, G, F, E, D, ra D. Trong giọng C, hợp âm dựng trên D là Dm, nên A7 về Dm: C# đi lên D, G đi xuống F. Tương tự, D7 (có F# và C) về G, E7 (có G# và D) về Am.", "tip": "Ngược lại, từ nốt gốc của \"mẹ\" đếm xuống 5 tên nốt là ra đích: A, G, F, E, D, nên A7 về Dm.", "show": "A7", "keys": ["C#4", "G4"], "compare": {"a": {"label": "A7 → Dm", "play": ["A7", "Dm"]}, "b": {"label": "E7 → Am", "play": ["E7", "Am"]}}}, {"text": "Một \"mẹ\" dẫn về hợp âm khác ngoài chủ như vậy gọi là hợp âm át phụ (secondary dominant): \"phụ\" vì nó không dẫn về nhà C mà về một hợp âm khác của giọng. Hợp âm át phụ có nốt nằm ngoài 7 phím trắng của giọng C (A7 có C#, D7 có F#, E7 có G#; riêng B7 có tới hai nốt là D# và F#, bài 12 sẽ nói), nên nghe lạ tai và có lực hơn. Bài vẫn ở giọng C và vẫn về nhà C, chỉ là đi vòng qua các \"mẹ\" phụ này. Nghe C – A7 – Dm – G7 – C: A7 dắt về Dm, rồi G7 dắt về C.", "play": ["C", "A7", "Dm", "G7", "C"]}], "remember": ["Hợp âm 7 có tritone giữa bậc 3 và bậc 7 nên bất ổn, muốn đi về chỗ yên; thầy gọi nó là \"mẹ\", hợp âm nó kéo về là \"con\".", "Hợp âm át 7 (\"mẹ\") kéo về hợp âm có nốt gốc thấp hơn nó một quãng 5: G7 → C (đếm xuống G, F, E, D, C); hai đầu quãng 5 cùng loại phím, trừ B–F# và Bb–F.", "Hợp âm át phụ (secondary dominant) là \"mẹ\" dẫn về một hợp âm khác ngoài chủ: A7 → Dm, D7 → G, E7 → Am."], "items": [{"chord": "G7", "to": "C"}, {"chord": "A7", "to": "Dm"}, {"chord": "E7", "to": "Am"}], "quiz": [{"q": "Hạ nốt B của Cmaj7 xuống nửa cung thì được hợp âm gì?", "choices": ["C7", "Cm7", "Em7", "Am7"], "answer": "C7", "why": "Cmaj7 = C E G B; hạ B xuống Bb thì nốt 7 thành nốt gốc lùi một cung, đúng kiểu hợp âm 7: C E G Bb là C7."}, {"q": "D7 kéo về hợp âm nào?", "choices": ["G", "A", "E", "C"], "answer": "G", "why": "Từ D đếm xuống 5 tên nốt: D, C, B, A, G, nên D7 kéo về G."}]},

  {"id": "p3-03", "part": 3, "src": "Phildave 3 · Bài 3", "title": "Tỉ lệ dao động: đơn giản thì thuận tai", "teach": [{"text": "Mỗi nốt là một dao động: dây đàn rung qua lại rất nhanh. Nốt A4 rung 440 lần mỗi giây (440 Hz), nốt A3 thấp hơn rung 220 lần. Hai nốt cùng tên liền nhau như A3 và A4 cách nhau một quãng 8, và tỉ lệ dao động của chúng là 1:2: A3 rung 1 lần thì A4 rung đúng 2 lần. Hai dao động khớp nhau đều đặn như vậy nên hai nốt hoà vào nhau gần như một nốt.", "tip": "Quãng 8 trên phím: từ một phím đếm lên 8 phím trắng, tính cả hai đầu (A B C D E F G A), là gặp lại đúng tên nốt đó.", "keys": ["A3", "A4"], "play": [["A3", "A4"]]}, {"text": "Tỉ lệ càng đơn giản thì nghe càng thuận tai, tức là êm và hoà vào nhau. Quãng 5 đúng (C–G) là 2:3: C rung 2 lần thì G rung 3 lần; quãng 4 đúng (C–F) là 3:4. Các quãng 1, 4, 5, 8 được gọi là quãng đúng (perfect) chính vì tỉ lệ rất đơn giản. Nghe C–G rồi C–F: hai nốt gần như hoà làm một, rất trong.", "tip": "Tên quãng là số tên nốt đếm từ nốt dưới lên nốt trên, tính cả hai đầu: C D E F G là 5 nốt nên C–G là quãng 5; C D E F là 4 nốt nên C–F là quãng 4.", "keys": ["C4", "G4"], "play": [["C4", "G4"], ["C4", "F4"]]}, {"text": "Quãng 3 trưởng (C–E, rộng hai cung) có tỉ lệ 4:5, quãng 3 thứ (C–Eb, rộng một cung rưỡi) là 5:6. Hai tỉ lệ này phức tạp hơn quãng 5 một chút nhưng vẫn khá êm. Vì vậy hợp âm ba nốt như C E G (C–E là quãng 3, C–G là quãng 5) nghe hoà.", "tip": "Quãng 3 trưởng = hai cung (C, D, E); quãng 3 thứ hẹp hơn nửa cung (C lên Eb).", "keys": ["C4", "E4"], "play": [["C4", "E4"], ["C4", "Eb4"], ["C4", "E4", "G4"]]}, {"text": "Tỉ lệ càng phức tạp thì càng nghịch tai, tức là nghe chọi, cọ xát. Quãng 2 thứ, tức hai phím sát nhau như B–C, có tỉ lệ 15:16, còn tritone B–F là 32:45. Với tỉ lệ như vậy, hai dao động rất hiếm khi khớp nhịp với nhau, nên tai nghe thấy cọ xát. Đó là lý do vật lý khiến tritone bứt rứt và muốn đi tiếp, như G7 muốn về C.", "keys": ["B3", "F4"], "compare": {"a": {"label": "B–C (15:16)", "play": [["B3", "C4"]]}, "b": {"label": "B–F (32:45)", "play": [["B3", "F4"]]}}}, {"text": "Dời tritone đi đâu thì nó vẫn là quãng ba cung: F–B, C–F#, E–Bb đều là tritone. Vì vậy hợp âm nào có một cặp như thế ở bậc 3 và bậc 7 cũng mang cái căng của G7. Ví dụ C7 (C E G Bb) có E–Bb: E nhích lên nửa cung thành F, Bb nhích xuống nửa cung thành A, mà F và A là hai nốt của hợp âm F. Vì thế C7 muốn đi về F, giống G7 về C.", "tip": "Kiểm tra cặp nào cũng được bằng mẹo banana: bắt đầu từ F, âm tiết thứ bảy rơi vào B; bắt đầu từ C thì rơi vào F#.", "keys": ["E4", "Bb4"], "play": [["E4", "Bb4"], ["F4", "A4"], "C7", "F"]}], "remember": ["Tỉ lệ dao động đơn giản thì nghe thuận tai: quãng 8 là 1:2, quãng 5 đúng là 2:3, quãng 4 đúng là 3:4.", "Tritone có tỉ lệ 32:45, rất phức tạp, nên nghe bứt rứt; dời đi đâu (như E–Bb trong C7) nó vẫn muốn đi tiếp."], "items": [{"chord": "G7", "to": "C"}, {"chord": "C7", "to": "F"}], "quiz": [{"q": "Quãng nào có tỉ lệ dao động đơn giản nhất?", "choices": ["Quãng 8 (1:2)", "Quãng 5 đúng (2:3)", "Quãng 3 trưởng (4:5)", "Tritone (32:45)"], "answer": "Quãng 8 (1:2)", "why": "1:2 là tỉ lệ đơn giản nhất, nên hai nốt cách nhau quãng 8 hoà vào nhau gần như một nốt."}, {"q": "Vì sao tritone nghe bứt rứt?", "choices": ["Tỉ lệ dao động 32:45 rất phức tạp", "Vì nó gồm ba nốt", "Vì nó luôn rơi vào phím đen", "Vì hai nốt cách nhau quãng 8"], "answer": "Tỉ lệ dao động 32:45 rất phức tạp", "why": "Tỉ lệ càng phức tạp thì tai càng thấy nghịch; 32:45 phức tạp hơn hẳn 2:3 hay 3:4."}]},

  {"id": "p3-04", "part": 3, "src": "Phildave 3 · Bài 4", "title": "Hợp âm có tritone là hợp âm át 7", "teach": [{"text": "Ở bài 1, ta dựng 7 hợp âm từ chính các nốt của giọng C (chỉ phím trắng, bấm một phím bỏ một phím): Cmaj7, Dm7, Em7, Fmaj7, G7, Am7, Bm7b5. 7 hợp âm này gọi là hợp âm trong giọng (diatonic). Trong số đó, chỉ G7 (G B D F) có tritone B–F giữa bậc 3 và bậc 7. Vì thế G7 là hợp âm át 7 duy nhất của giọng C, và là hợp âm duy nhất trong giọng thật sự muốn kéo về C.", "show": "G7", "play": ["G7", "C"]}, {"text": "Ra ngoài phím trắng, A7, D7, E7, B7 và cả Bb7 đều có tritone. Ví dụ E7 = E G# B D: bậc 3 là G#, bậc 7 là D, và G#–D là một tritone. Vì sao hợp âm 7 nào cũng vậy? Bậc 3 luôn cao hơn nốt gốc hai cung, còn bậc 7 luôn thấp hơn nốt gốc ở trên một cung; từ nốt gốc lên nốt gốc ở trên là sáu cung, nên từ bậc 3 lên bậc 7 còn đúng ba cung. Cứ là hợp âm 7 (ghi số 7 không kèm maj hay m) thì bậc 3 và bậc 7 là tritone, tức là một \"mẹ\".", "tip": "Dựng nhanh hợp âm 7 từ bất kỳ nốt nào: hợp âm trưởng của nốt đó + nốt gốc lùi một cung (E7 = hợp âm E là E G# B, thêm D).", "show": "E7", "play": ["E7", "Am"]}, {"text": "Nốt màu (tension) là nốt xếp thêm lên trên hợp âm 7 cho nghe giàu hơn, mà không đổi vai trò của hợp âm. Tên nốt màu là 9, 11, 13 vì ta đếm tiếp qua nốt gốc ở trên: G là 1, …, G ở trên là 8, A ở trên nữa là 9. Nghĩa là nốt 9 của G7 là A, chính là nốt ngay trên G, chỉ đặt cao lên. G9 vẫn kéo về C như G7, chỉ nghe đầy đặn hơn: khi nghe so sánh, để ý nốt A trong tay phải.", "tip": "Cách tính nhanh: 9 = nốt thứ 2, 11 = nốt thứ 4, 13 = nốt thứ 6 tính từ nốt gốc, chỉ đặt cao lên một quãng 8 (G7: 9 là A, 11 là C, 13 là E).", "show": "G9", "compare": {"a": {"label": "G7 → C", "play": ["G7", "C"]}, "b": {"label": "G9 → C", "play": ["G9", "C"]}}}, {"text": "Thăng hoặc giáng nốt màu đi nửa cung thì ta có màu biến đổi (altered). Hay gặp nhất là ba nốt: b9 (nốt 9 hạ nửa cung), #9 (nốt 9 nâng nửa cung) và b13 (nốt 13 hạ nửa cung). Ví dụ trên E7: nốt 9 là F#, nên b9 là F và #9 là G; nốt 13 là C#, nên b13 là C. Cách đọc: dấu đọc trước số, b9 là \"flat 9\", #9 là \"sharp 9\".", "tip": "b9 là phím ngay trên nốt gốc, đặt cao lên: E nhích lên nửa cung là F.", "keys": ["F4"], "compare": {"a": {"label": "E7 + 9 (F#)", "play": [["E2", "D3", "G#3", "B3", "F#4"]]}, "b": {"label": "E7 + b9 (F)", "play": [["E2", "D3", "G#3", "B3", "F4"]]}}}, {"text": "Màu biến đổi nghe rất căng, nên chỉ hợp với hợp âm vốn đã căng, tức hợp âm có tritone. Đặt lên hợp âm yên như Cmaj7 thì nó phá mất cảm giác yên. Trên E7 thì b9 lại có ích: E7(b9) có nốt F ở trên cùng, và khi về Am, F trượt xuống nửa cung thành E, một nốt của Am. Nghe so sánh, để ý nốt cao nhất: E7 giữ nguyên E, còn E7(b9) có F rồi trượt xuống E.", "tip": "b9 luôn nằm ngay trên nốt gốc của hợp âm 7 nửa cung, nên nó tự muốn trượt xuống.", "keys": ["E2", "D3", "G#3", "B3", "F4"], "compare": {"a": {"label": "E7 → Am", "play": [["E2", "D3", "G#3", "B3", "E4"], ["A2", "A3", "C4", "E4"]]}, "b": {"label": "E7(b9) → Am", "play": [["E2", "D3", "G#3", "B3", "F4"], ["A2", "A3", "C4", "E4"]]}}}], "remember": ["Trong 7 hợp âm trong giọng (diatonic) của C, chỉ G7 có tritone giữa bậc 3 và bậc 7.", "Hợp âm 7, tức hợp âm át 7 (G7, A7, D7, E7, B7, Bb7), đều có tritone giữa bậc 3 và bậc 7.", "Màu biến đổi (b9, #9, b13) chỉ dùng trên hợp âm có tritone, ví dụ E7(b9) về Am: nốt F trượt xuống E."], "items": [{"chord": "G9", "to": "C"}, {"chord": "E7(b9)", "to": "Am"}], "quiz": [{"q": "Màu biến đổi (b9, #9, b13) đặt được lên hợp âm nào?", "choices": ["E7", "Am7", "Cmaj7", "Dm7"], "answer": "E7", "why": "Chỉ hợp âm có tritone như E7 mới hợp với màu biến đổi; Am7, Cmaj7, Dm7 không có tritone."}]},

  {"id": "p3-05", "part": 3, "src": "Phildave 3 · Bài 5", "title": "Nốt định hướng: bậc 3 và bậc 7", "teach": [{"text": "Trong ban nhạc, người chơi bass đã đánh nốt gốc. Nếu piano và guitar cũng đánh nốt gốc thì âm thanh bị lặp, nặng nề. Vì thế piano nên đánh nốt định hướng (bậc 3 và bậc 7, bài 1), hai nốt cho biết tính chất hợp âm. Nghe thử: chỉ nốt gốc G rồi C thì chưa rõ gì; thêm F, B (nốt định hướng của G7) rồi E, B (của Cmaj7) thì nghe ngay G7 về Cmaj7.", "keys": ["F3", "B3"], "compare": {"a": {"label": "Chỉ nốt gốc", "play": [["G2"], ["C3"]]}, "b": {"label": "Có nốt định hướng", "play": [["G2", "F3", "B3"], ["C3", "E3", "B3"]]}}}, {"text": "Ví dụ: bass đánh C, tay phải piano đánh E–G–B. Riêng tay phải trông như hợp âm Em (E G B), nhưng ghép với bass C thì cả ban nhạc vang thành Cmaj7 (C E G B). Bậc 3 (E) và bậc 7 (B) nằm sẵn trong tay phải, nên tai biết ngay đây là Cmaj7, còn nốt gốc C đã có bass lo.", "keys": ["C2", "E4", "G4", "B4"], "play": [["C2"], ["E4", "G4", "B4"], ["C2", "|", "E4", "G4", "B4"]]}, {"text": "Chỉ có nốt gốc thì không biết hợp âm trưởng hay thứ, cũng không biết nó muốn đi đâu; nốt định hướng cho biết cả hai. Cmaj7 có nốt định hướng E–B là quãng 5 đúng, nghe yên nên đứng lại được; C7 có E–Bb là tritone, nghe căng nên muốn đi tiếp về F. Hợp âm đang căng là chỗ hợp nhất để thêm nốt màu. Nốt màu làm nó căng và nhiều màu hơn, nên lúc về đích nghe càng đã tai; ví dụ C7(b9) có thêm Db, và Db trượt xuống C, một nốt của F. Còn hợp âm yên như Cmaj7 mà thêm nốt màu căng (b9, #9, b13) thì mất cảm giác yên và nghe chói, nên chỗ yên chỉ thêm nốt màu không biến đổi, như nốt 9 (Cmaj7 thêm D).", "tip": "Nốt màu căng đặt ở hợp âm có tritone để tăng lực kéo về đích; hợp âm yên chỉ thêm nốt màu không biến đổi như nốt 9.", "compare": {"a": {"label": "Cmaj7 (yên)", "play": [["C3", "E3", "B3"]]}, "b": {"label": "C7 → F, rồi C7(b9) → F", "play": [["C3", "E3", "Bb3"], ["F2", "A3", "C4"], ["C3", "E3", "Bb3", "Db4"], ["F2", "A3", "C4"]]}}}, {"text": "Với các hợp âm 7 ngoài giọng như D7, E7, A7, B7 trong giọng C (gọi là hợp âm át phụ), tay trái không cần bấm đủ 4 nốt. Ví dụ D7 = D F# A C: khi có người chơi bass, tay trái chỉ bấm hai nốt định hướng F# (bậc 3) và C (bậc 7), vì chỉ hai nốt này đã đủ cho tai biết đây là D7 và nó muốn về G. Nốt gốc D để người chơi bass lo; nếu chơi piano một mình thì bấm D thật thấp ở đầu nhịp, đạp bàn đạp vang (bàn đạp phải) cho D còn ngân, rồi tay trái mới nhấc lên bấm F# và C. Nốt 5 (A) bỏ đi được, vì nó có mặt trong rất nhiều hợp âm nên không cho biết gì thêm.", "tip": "Nốt định hướng của hợp âm 7 = bậc 3 của hợp âm trưởng cùng gốc + nốt gốc lùi một cung: D7 có F# (hợp âm D là D F# A) và C (D lùi một cung).", "keys": ["F#3", "C4", "|"], "compare": {"a": {"label": "D7 bấm đủ 4 nốt", "play": [["D3", "F#3", "A3", "C4", "|"]]}, "b": {"label": "D thấp trước (bàn đạp giữ), rồi F# + C", "play": [["D2"], ["F#3", "C4", "|"]]}}}, {"text": "Tay trái chỉ giữ hai nốt thì tay phải được rảnh. Tay phải có thể thêm nốt màu như b9 (với D7 là Eb, phím ngay trên nốt gốc D) cho hợp âm căng hơn, hoặc chơi giai điệu bài hát ở phía trên. Nếu tay trái bấm cả 4 nốt dày đặc ở vùng thấp thì tiếng nghe đục, và hai tay chen chúc không còn chỗ thêm màu; thầy dặn \"tay trái cần tự do hơn\" là vì vậy. Nghe thử nốt định hướng của D7 → G7 → Cmaj7: mỗi bước chỉ trượt nửa cung hoặc giữ nguyên, tay trái gần như không phải di chuyển. Khi tự đệm một mình không có bass, như ở phần bài tập, thì cần cả nốt gốc: app gợi ý tay trái D và C, tay phải D, F#, A; bấm gọn D, F#, C (bỏ nốt 5 là A) cũng được chấm đúng.", "keys": ["F#3", "C4", "|"], "play": [["F#3", "C4", "|"], ["F3", "B3"], ["E3", "B3"]]}], "remember": ["Nốt định hướng là bậc 3 và bậc 7: bậc 3 cho biết trưởng hay thứ, bậc 7 cho biết maj7 hay hợp âm 7.", "Trong ban nhạc, bass đã đánh nốt gốc, nên piano đánh nốt định hướng để không lặp nốt.", "Với hợp âm át phụ như D7, khi có người chơi bass, tay trái chỉ bấm hai nốt định hướng F# và C, để tay phải rảnh thêm nốt màu hoặc chơi giai điệu."], "items": [{"chord": "D7", "to": "G"}, {"chord": "B7", "to": "Em"}], "quiz": [{"q": "Nốt định hướng (guide tones) của Cmaj7 là cặp nào?", "choices": ["E và B", "C và G", "C và E", "G và B"], "answer": "E và B", "why": "Bậc 3 của Cmaj7 là E, bậc 7 là B."}, {"q": "Nốt định hướng của D7 là cặp nào?", "choices": ["F# và C", "D và A", "D và F#", "A và C"], "answer": "F# và C", "why": "D7 = D F# A C: bậc 3 là F#, bậc 7 là C (D lùi một cung), hai nốt tạo thành tritone."}]},

  {"id": "p3-06", "part": 3, "src": "Phildave 3 · Bài 6", "title": "Chỉ một hợp âm có quãng nghịch", "teach": [{"text": "Quãng nghịch là quãng nghe chọi, ngược với quãng thuận là quãng nghe êm. Có hai quãng nghịch chính: quãng 2 thứ (hai phím sát nhau, như B–C) và tritone (quãng ba cung, như B–F). Trong 7 hợp âm trong giọng, chỉ hợp âm át 7 có quãng nghịch giữa hai nốt định hướng (bậc 3 và bậc 7). Giọng C có G7, giọng D có A7, giọng E có B7.", "tip": "Hợp âm át 7 của một giọng nằm ở bậc 5: từ nốt chủ đếm lên 5 tên nốt (D, E, F#, G, A), nên giọng D có A7.", "show": "A7", "compare": {"a": {"label": "B–C", "play": [["B3", "C4"]]}, "b": {"label": "A7 → D", "play": ["A7", "D"]}}}, {"text": "Nốt định hướng của 6 hợp âm còn lại đều là quãng thuận. Ví dụ Cmaj7 có E–B, Dm7 có F–C, đều là quãng 5 đúng (tỉ lệ 2:3, bài 3). Chỉ G7 có B–F, tỉ lệ 32:45. Vì vậy chỉ G7 bứt rứt và đi về C, các hợp âm khác đứng yên được: nghe Dm7 một mình vẫn thấy ổn, còn G7 thì nghe như chưa xong.", "tip": "Quãng 5 đúng rộng ba cung rưỡi (F lên C); B–F cũng đếm được 5 tên nốt nhưng hẹp hơn nửa cung, đó là tritone.", "compare": {"a": {"label": "Dm7", "play": ["Dm7"]}, "b": {"label": "G7 → C", "play": ["G7", "C"]}}}, {"text": "Âm giai (scale) là một dãy nốt đi lên từng bước theo một mẫu cố định: bước nào một cung, bước nào nửa cung. Giai điệu và hợp âm đều lấy nốt từ âm giai, nên thuộc âm giai là thuộc \"kho nốt\" của bài. C trưởng tự nhiên (natural major) là C D E F G A B, tức các phím trắng. C thứ tự nhiên (natural minor) là C D Eb F G Ab Bb: nghe so sánh, âm giai thứ tối và buồn hơn.", "tip": "C thứ tự nhiên = C trưởng hạ bậc 3, 6, 7 xuống nửa cung: E, A, B thành Eb, Ab, Bb.", "compare": {"a": {"label": "C trưởng", "play": [["C4"], ["D4"], ["E4"], ["F4"], ["G4"], ["A4"], ["B4"], ["C5"]]}, "b": {"label": "C thứ tự nhiên", "play": [["C4"], ["D4"], ["Eb4"], ["F4"], ["G4"], ["Ab4"], ["Bb4"], ["C5"]]}}}, {"text": "C thứ hoà âm (harmonic minor) là C thứ tự nhiên nâng bậc 7 từ Bb lên B: C D Eb F G Ab B. Vì sao nâng? B nằm ngay dưới C nửa cung nên kéo về C rất mạnh, còn Bb cách C cả một cung nên kéo yếu; bài 18 sẽ nói kỹ điều này. Nghe đoạn Ab lên B: bước này rộng một cung rưỡi, tạo màu rất riêng của thứ hoà âm.", "tip": "Thứ hoà âm = C thứ tự nhiên, chỉ đổi Bb thành B.", "keys": ["B4"], "compare": {"a": {"label": "Thứ tự nhiên", "play": [["C4"], ["D4"], ["Eb4"], ["F4"], ["G4"], ["Ab4"], ["Bb4"], ["C5"]]}, "b": {"label": "Thứ hoà âm", "play": [["C4"], ["D4"], ["Eb4"], ["F4"], ["G4"], ["Ab4"], ["B4"], ["C5"]]}}}, {"text": "C thứ giai điệu (melodic minor) nâng cả bậc 6 và bậc 7: C D Eb F G A B. Nâng thêm bậc 6 (Ab lên A) để bỏ bước rộng Ab–B, cho giai điệu đi lên mượt, ca sĩ dễ hát. Thầy dặn ôn kỹ bốn âm giai này (trưởng tự nhiên, thứ tự nhiên, thứ hoà âm, thứ giai điệu), vì chúng rất quan trọng khi solo.", "tip": "Thứ giai điệu = C trưởng chỉ hạ E xuống Eb, sáu nốt còn lại giữ nguyên.", "keys": ["A4", "B4"], "compare": {"a": {"label": "Thứ hoà âm", "play": [["C4"], ["D4"], ["Eb4"], ["F4"], ["G4"], ["Ab4"], ["B4"], ["C5"]]}, "b": {"label": "Thứ giai điệu", "play": [["C4"], ["D4"], ["Eb4"], ["F4"], ["G4"], ["A4"], ["B4"], ["C5"]]}}}], "remember": ["Quãng nghịch (nghe chọi) gồm quãng 2 thứ (hai phím sát nhau, như B–C) và tritone (như B–F).", "Trong 7 hợp âm trong giọng, chỉ hợp âm át 7 có tritone ở nốt định hướng.", "4 âm giai cần thuộc: C trưởng, C thứ tự nhiên, thứ hoà âm, thứ giai điệu."], "items": [{"chord": "A7", "to": "D"}, {"chord": "B7", "to": "E"}], "quiz": [{"q": "Trong giọng D, hợp âm nào có quãng nghịch giữa hai nốt định hướng?", "choices": ["A7", "D", "Em7", "Bm7"], "answer": "A7", "why": "Mỗi giọng chỉ có một hợp âm át 7, nằm ở bậc 5; giọng D đếm D, E, F#, G, A nên là A7 (C# và G là tritone)."}, {"q": "C thứ hoà âm (harmonic minor) khác C thứ tự nhiên ở đâu?", "choices": ["Bậc 7 nâng lên B", "Bậc 3 nâng lên E", "Bậc 6 hạ xuống Ab", "Bậc 2 hạ xuống Db"], "answer": "Bậc 7 nâng lên B", "why": "Thứ hoà âm giữ nguyên thứ tự nhiên, chỉ nâng bậc 7 từ Bb lên B."}]},

  {"id": "p3-07", "part": 3, "src": "Phildave 3 · Bài 7", "title": "Lực muốn trở về chỗ yên", "teach": [{"text": "Ở bài 1 ta đã thấy tritone B–F của G7 có hướng đi rõ: mỗi nốt tìm nốt gần nhất trong âm giai C (các phím trắng). B đi lên nửa cung thành C, F đi xuống nửa cung thành E, và C, E chính là hai nốt của hợp âm C. Tính chất muốn đi về C này là lực kéo về chủ (dominant motion); chủ là hợp âm nhà, ở đây là C. Nghe riêng cặp B–F rồi C–E: chỉ hai nốt mà đã nghe như một câu kết.", "keys": ["B3", "F4"], "play": [["B3", "F4"], ["C4", "E4"]]}, {"text": "Thầy ví đây là quy luật tự nhiên của âm giai trưởng, như nước chảy chỗ trũng: không ai đẩy, nước vẫn tự chảy xuống. Cũng giống hai dây điện chênh điện áp thì tự có dòng điện chạy giữa chúng. Ta không phải ép G7 về C; chính cặp tritone trong G7 tự muốn về. Nghe G7: tai tự chờ C xuất hiện.", "show": "G7", "play": ["G7", "C"]}, {"text": "Lực kéo này nối được thành chuỗi. C7 có tritone E–Bb nên về F; nếu thêm Eb vào F (F lùi một cung) thì F thành F7, lại có tritone A–Eb và kéo tiếp về Bb; Bb7 lại kéo về Eb, cứ thế. Mỗi bước, nốt gốc đi xuống một quãng 5, giống G7 về C, và các nốt gốc nối thành vòng quãng 5: C–F–Bb–Eb–Ab–Db–Gb–B. Nghe chuỗi này: mỗi hợp âm vừa là chỗ đến của hợp âm trước, vừa là chỗ đi tiếp.", "tip": "Đi xuống một quãng 5 cũng chính là đi lên một quãng 4: C lên F (C, D, E, F), F lên Bb (F, G, A, Bb), chứ không phải B, vì F–B là tritone.", "play": ["C7", "F7", "Bb7", "Eb"]}, {"text": "Vì thế thầy khuyên luyện mọi thứ theo vòng quãng 5 (C, F, Bb, Eb, …) thay vì theo thứ tự phím C, D, E. Lý do: trong bài thật, hợp âm hay đi đúng đường quãng 5 này, ví dụ D7 → G7 → C (D xuống G, G xuống C). Cách tập: luyện G7 → C xong thì chuyển sang C7 → F, rồi F7 → Bb, cứ theo vòng; tay và tai sẽ quen dần với đường đi tự nhiên của hợp âm.", "play": ["D7", "G7", "C"]}], "remember": ["B lên C, F xuống E: tritone của G7 tự đi về C.", "Lực kéo về chủ (dominant motion) lặp lại theo vòng quãng 5: C7 → F7 → Bb7 → Eb."], "items": [{"chord": "C7", "to": "F"}, {"chord": "F7", "to": "Bb"}, {"chord": "Bb7", "to": "Eb"}], "quiz": [{"q": "Khi G7 về C, nốt B của G7 đi đâu?", "choices": ["Lên C", "Xuống A", "Lên D", "Xuống G"], "answer": "Lên C", "why": "B thấp hơn C nửa cung nên đi lên C, còn F đi xuống E."}, {"q": "Trong vòng quãng 5 C–F–Bb–…, hợp âm tiếp theo sau Bb là gì?", "choices": ["Eb", "C", "F", "D"], "answer": "Eb", "why": "Mỗi bước đi xuống một quãng 5: từ Bb đếm xuống 5 tên nốt (Bb, A, G, F, Eb) là Eb."}]},

  {"id": "p3-08", "part": 3, "src": "Phildave 3 · Bài 8", "title": "Thoát nhạc thiếu nhi nhờ hợp âm át 7", "teach": [{"text": "Vòng hợp âm là một chuỗi hợp âm lặp đi lặp lại trong bài. Vòng Cmaj7 – Am7 – Dm7 – G7 chỉ dùng hợp âm trong giọng C (các hợp âm dựng từ phím trắng), nên nghe đơn giản, như nhạc thiếu nhi. Nó không sai, nhưng thiếu lực đẩy, vì cả vòng chỉ có một chỗ có tritone là G7: ba hợp âm đầu đứng yên được, không cái nào bắt buộc phải đi đâu.", "play": ["Cmaj7", "Am7", "Dm7", "G7", "Cmaj7"]}, {"text": "Giờ đổi Am7 thành A7, chỉ cần nâng C lên C#. A7 có tritone C#–G, nên nó bắt buộc đi xuống quãng 5 về Dm7 (đếm A, G, F, E, D): C# đi lên D, G đi xuống F. Am7 thì tự do: sau Am7 có thể đi Dm7, Fmaj7 hay quay lại Cmaj7 đều được; còn sau A7 thì tai chờ đúng Dm7. Đó là sức mạnh của hợp âm át phụ (hợp âm 7 dẫn về một hợp âm khác ngoài chủ, bài 2).", "tip": "Đổi Am7 (A C E G) thành A7 chỉ cần nâng C lên C#: đúng bậc 3 của hợp âm trưởng A, còn G là A lùi một cung.", "show": "A7", "compare": {"a": {"label": "Có Am7", "play": ["Cmaj7", "Am7", "Dm7"]}, "b": {"label": "Có A7", "play": ["Cmaj7", "A7", "Dm7"]}}}, {"text": "Tương tự, đổi Dm7 thành D7 (nâng F lên F#) thì D7 có tritone F#–C và kéo về G7. Vòng mới Cmaj7 – A7 – D7 – G7 có ba \"mẹ\" liền nhau: A7 kéo về D7, D7 kéo về G7, G7 kéo về Cmaj7, nên cả vòng bị kéo một mạch về nhà. Nghe so sánh: vòng mới hết hẳn chất \"thiếu nhi\". Nhưng đừng đổi mọi chỗ thành hợp âm át 7; bài 10 sẽ nói vì sao.", "tip": "Dm7 (D F A C) thành D7 chỉ cần nâng F lên F#, bậc 3 của hợp âm trưởng D.", "compare": {"a": {"label": "Vòng gốc", "play": ["Cmaj7", "Am7", "Dm7", "G7", "Cmaj7"]}, "b": {"label": "Vòng mới", "play": ["Cmaj7", "A7", "D7", "G7", "Cmaj7"]}}}, {"text": "Bước tiếp theo là thêm nốt màu (nốt 9, 11, 13 xếp thêm lên hợp âm, bài 4), nhưng chỉ thêm vào chỗ là hợp âm át 7. Ví dụ A7 thêm b9 thành A7(b9): b9 của A là Bb, phím ngay trên A nửa cung. Màu biến đổi như b9 nghe căng, nên hợp với A7 vốn đã căng vì có tritone; Cmaj7 hay Dm7 không có tritone, thêm vào chỉ làm chúng chói. Nghe Cmaj7 – A7(b9) – Dm7: nốt Bb ở trên cùng trượt xuống A, một nốt của Dm7.", "show": "A7(b9)", "play": ["Cmaj7", "A7(b9)", "Dm7"]}], "remember": ["Am7 đi đâu cũng được; đổi thành A7 (nâng C lên C#) thì có tritone C#–G, bắt buộc về Dm7.", "Đổi hợp âm thành hợp âm át 7 để có lực đẩy, rồi chỉ thêm nốt màu vào chỗ hợp âm át 7."], "items": [{"chord": "A7(b9)", "to": "Dm7"}, {"chord": "D7", "to": "G7"}], "quiz": [{"q": "Trong vòng Cmaj7 – A7 – Dm7, chỗ nào được thêm màu biến đổi như b9?", "choices": ["A7", "Cmaj7", "Dm7", "Không chỗ nào"], "answer": "A7", "why": "A7 là hợp âm át 7 có tritone; Cmaj7 và Dm7 không có tritone."}]},

  {"id": "p3-09", "part": 3, "src": "Phildave 3 · Bài 9", "title": "Mỗi hợp âm có một \"mẹ\" riêng", "teach": [{"text": "Ở bài 2, \"mẹ\" là hợp âm 7 kéo về hợp âm có nốt gốc thấp hơn nó một quãng 5 (G7 → C). Lật lại: trong giọng C, mỗi hợp âm trưởng hoặc thứ đều có một \"mẹ\" riêng, có nốt gốc cao hơn nó một quãng 5. G7 → Cmaj7, A7 → Dm7, B7 → Em7; C7 → Fmaj7, D7 → G7, E7 → Am7. Nghe B7 → Em7 rồi E7 → Am7: mỗi cặp là một lần \"mẹ\" dắt \"con\" về.", "tip": "Tìm \"mẹ\": từ nốt gốc của hợp âm đích đếm lên 5 tên nốt; ví dụ Em7: E, F, G, A, B, nên \"mẹ\" là B7.", "show": "B7", "play": ["B7", "Em7", "E7", "Am7"]}, {"text": "Riêng Bm7b5 (B D F A) thì không có \"mẹ\" riêng. Nó là hợp âm nửa giảm (m7b5): một hợp âm m7 có nốt 5 bị hạ nửa cung; Bm7 có F#, Bm7b5 hạ F# xuống F. Nốt 5 bị hạ làm hợp âm không vững (B và F lại là một tritone), nên Bm7b5 không làm chỗ dừng được. \"Mẹ\" chỉ để dắt về một chỗ dừng, nên Bm7b5 không có \"mẹ\".", "tip": "Bm7b5 chỉ gồm phím trắng: bấm B rồi cứ cách một phím bấm một phím (B, D, F, A).", "show": "Bm7b5", "compare": {"a": {"label": "Bm7 (có F#)", "play": ["Bm7"]}, "b": {"label": "Bm7b5 (có F)", "play": ["Bm7b5"]}}}, {"text": "Cách dùng: viết ra các hợp âm trong giọng của bài, rồi đặt \"mẹ\" riêng ngay trước hợp âm muốn làm nổi. Ví dụ C – Dm7 – G7 – C: đặt A7 (\"mẹ\" của Dm7) trước Dm7, thành C – A7 – Dm7 – G7 – C; G7 vốn đã là \"mẹ\" của C nên giữ nguyên. Thầy chơi bài ứng dụng hai lần: lần 1 chỉ hợp âm trong giọng, lần 2 thêm hợp âm át phụ, và lực hoà âm tăng lên rõ rệt.", "compare": {"a": {"label": "Lần 1", "play": ["C", "Dm7", "G7", "C"]}, "b": {"label": "Lần 2", "play": ["C", "A7", "Dm7", "G7", "C"]}}}, {"text": "Muốn đặt \"mẹ\" nhanh thì phải thuộc hợp âm trong giọng của các giọng hay gặp: C, D, E, F, G, A. Bậc là số thứ tự của nốt trong âm giai: bậc I là nốt chủ, bậc II là nốt kế tiếp, và cứ thế đến bậc VII (viết số La Mã I–VII để khỏi lẫn với bậc 3, bậc 7 của hợp âm). Trong giọng trưởng, hợp âm dựng trên bậc I, IV, V là trưởng; trên II, III, VI là thứ; trên VII là m7b5. Ví dụ giọng D (D E F# G A B C#): D, Em, F#m, G, A, Bm, C#m7b5.", "tip": "Mẹo nhớ \"1-4-5 trưởng, 2-3-6 thứ\": đích ở bậc I, IV, V thì \"mẹ\" về hợp âm trưởng, ở bậc II, III, VI thì về hợp âm thứ; giọng C: C, F, G trưởng, còn D, E, A thứ.", "play": ["D", "Em", "F#m", "G", "A", "Bm", "C#m7b5"]}, {"text": "\"Mẹ\" luôn là hợp âm 7, dù hợp âm đích (hợp âm nó dẫn về) là trưởng hay thứ. Lý do: nốt 7 của \"mẹ\" (nốt gốc lùi một cung) luôn đi xuống vào bậc 3 của đích. Đích trưởng: G7 = G B D F, nốt 7 là F; C = C E G, bậc 3 là E; F xuống E chỉ nửa cung. Đích thứ: A7 = A C# E G, nốt 7 là G; Dm = D F A, bậc 3 là F; G xuống F một cung.", "tip": "Nghe ví dụ: nốt cao nhất là nốt 7 của \"mẹ\", đi xuống thành bậc 3 của đích.", "compare": {"a": {"label": "G7 → C: F xuống E", "play": [["G2", "B3", "F4"], ["C3", "C4", "E4"]]}, "b": {"label": "A7 → Dm: G xuống F", "play": [["A2", "C#4", "G4"], ["D3", "D4", "F4"]]}}}, {"text": "Thầy gợi ý đi xa hơn với \"mẹ\": thêm b9 cho A7 thành A7(b9). b9 của A là Bb, phím ngay trên A nửa cung; khi về Dm7, Bb trượt xuống A. Màu biến đổi hợp ở đây vì A7 có tritone, vốn đã căng, nên căng thêm một chút rồi về Dm7 nghe càng đã tai.", "show": "A7(b9)", "compare": {"a": {"label": "A7 → Dm7", "play": ["A7", "Dm7"]}, "b": {"label": "A7(b9) → Dm7", "play": ["A7(b9)", "Dm7"]}}}], "remember": ["Mỗi hợp âm trưởng hoặc thứ có một \"mẹ\" cao hơn nó một quãng 5 (Em7: đếm E, F, G, A, B, \"mẹ\" là B7).", "Bm7b5 không có \"mẹ\" riêng: nốt 5 bị hạ làm nó không vững, không làm chỗ dừng được.", "Giọng trưởng: 1-4-5 trưởng, 2-3-6 thứ, 7 là m7b5; \"mẹ\" của bậc 1, 4, 5 về hợp âm trưởng, của bậc 2, 3, 6 về hợp âm thứ."], "items": [{"chord": "B7", "to": "Em7"}, {"chord": "C7", "to": "Fmaj7"}, {"chord": "E7", "to": "Am7"}], "quiz": [{"q": "Hợp âm nào trong giọng C không có \"mẹ\" riêng?", "choices": ["Bm7b5", "Dm7", "Em7", "Fmaj7"], "answer": "Bm7b5", "why": "Bm7b5 có nốt 5 bị hạ nên không vững, không làm đích, vì vậy không có hợp âm át 7 riêng."}, {"q": "Hợp âm bậc III của giọng D là gì?", "choices": ["F#m", "F#", "Em", "G"], "answer": "F#m", "why": "Giọng D: D, Em, F#m, G, A, Bm, C#m7b5; bậc III là F#m."}]},

  {"id": "p3-10", "part": 3, "src": "Phildave 3 · Bài 10", "title": "Hợp âm đi qua và hợp âm át 7", "teach": [{"text": "Hợp âm có bass riêng (slash chord) là hợp âm mà tay trái bấm một nốt khác nốt gốc, ghi bằng dấu gạch chéo: tên hợp âm trước, nốt bass sau. Ví dụ G/B đọc là \"G trên bass B\": tay trái bấm B, tay phải bấm các nốt còn lại của hợp âm G (G và D). Vì sao làm vậy? Đổi bass giúp đường bass đi từng bậc liền nhau thay vì nhảy: Cmaj7 – G – Am7 thì bass C, G, A nhảy lên xuống, còn Cmaj7 – G/B – Am7 thì bass đi C, B, A liền nhau.", "tip": "Nốt bass của hợp âm có bass riêng thường là một nốt của chính hợp âm đó: B là bậc 3 của G.", "keys": ["B2", "D4", "G4"], "compare": {"a": {"label": "Cmaj7 – G – Am7 (bass nhảy)", "play": [["C3", "|", "E4", "G4", "B4"], ["G2", "|", "D4", "G4", "B4"], ["A2", "|", "C4", "E4", "G4"]]}, "b": {"label": "Cmaj7 – G/B – Am7 (bass liền bậc)", "play": [["C3", "|", "E4", "G4", "B4"], ["B2", "|", "D4", "G4"], ["A2", "|", "C4", "E4", "G4"]]}}}, {"text": "Tiến hành này rất hay gặp trong thánh ca Hàn: Cmaj7 – G/B – Am7 – C/G – Fmaj7 – C/E – Dm7 – G7. Bass đi xuống từng bậc C, B, A, G, F, E, D, rồi G7 đưa về lại C. Các hợp âm có gạch chéo (G/B, C/G, C/E) là hợp âm đi qua (passing chord): chúng chỉ đứng thoáng qua để nối hai hợp âm chính, giúp bass không phải nhảy. Ví dụ G/B nằm giữa Cmaj7 và Am7, nên bass C, B, A đi liền nhau.", "tip": "Khi phát cả vòng, app bấm G/B là B | D G A: thêm A (nốt 9) thay cho B ở tay phải, vì B đã có ở bass.", "play": ["Cmaj7", "G/B", "Am7", "C/G", "Fmaj7", "C/E", "Dm7", "G7"]}, {"text": "Có thể đổi hợp âm đi qua thành hợp âm át phụ (\"mẹ\" của hợp âm đứng ngay sau) mà vẫn giữ nguyên bass: G/B thành E7/B, C/G thành C7/G, C/E thành A7/E. Vì sao được? E7 là \"mẹ\" của Am7, C7 là \"mẹ\" của Fmaj7, A7 là \"mẹ\" của Dm7, đúng hợp âm đứng ngay sau. Bass vẫn đi xuống từng bậc như cũ, mà hoà âm có thêm lực kéo; thầy gọi đây là vừa tạo biến hoá vừa giữ đường bass.", "tip": "Hợp âm át phụ thay vào phải chứa sẵn nốt bass: E7 = E G# B D có B, nên viết được E7/B.", "keys": ["B2", "D4", "E4", "G#4"], "compare": {"a": {"label": "Bản gốc", "play": ["Cmaj7", "G/B", "Am7", "C/G", "Fmaj7"]}, "b": {"label": "Đổi thành át phụ", "play": ["Cmaj7", ["B2", "|", "D4", "E4", "G#4"], "Am7", ["G2", "|", "C4", "E4", "Bb4"], "Fmaj7"]}}}, {"text": "Phải chơi bản gốc trước cho tai quen, thì mới cảm được chỗ biến hoá. Biến hoá chỉ hay khi nó khác với cái tai đã quen; chỗ nào cũng đổi thành hợp âm át 7 thì không còn chỗ yên để so, và cả đoạn nghe rối. Ví dụ chỉ đổi một chỗ C/G thành C7/G, phần còn lại giữ nguyên: chỗ đổi nghe nổi hẳn lên.", "compare": {"a": {"label": "Bản gốc", "play": ["Cmaj7", "G/B", "Am7", "C/G", "Fmaj7"]}, "b": {"label": "Chỉ đổi C/G thành C7/G", "play": ["Cmaj7", "G/B", "Am7", ["G2", "|", "C4", "E4", "Bb4"], "Fmaj7"]}}}, {"text": "Thế bấm (voicing) là cách chia các nốt của hợp âm cho hai tay. Ở hợp âm có bass riêng, tay trái lo nốt bass, tay phải lo các nốt phía trên, và tay phải không bấm lại nốt bass cho gọn. Ví dụ C7/G: tay trái bấm G; tay phải bấm C, E, Bb, bỏ G vì tay trái đã có. Hợp âm đi qua chỉ lướt nhanh, nên thầy dặn không cần nhồi nốt màu (nốt 9, 11, 13) vào.", "keys": ["G2", "C4", "E4", "Bb4"], "play": [["G2", "|", "C4", "E4", "Bb4"], ["F2", "|", "C4", "E4", "A4"]]}], "remember": ["Hợp âm có bass riêng (G/B, C/E) giúp bass đi xuống từng bậc.", "Đổi hợp âm đi qua thành át phụ, giữ bass: G/B → E7/B, C/G → C7/G, C/E → A7/E."], "items": [{"chord": "E7/B", "to": "Am7"}, {"chord": "C7/G", "to": "Fmaj7"}, {"chord": "A7/E", "to": "Dm7"}], "quiz": [{"q": "Muốn đổi G/B (đứng trước Am7) thành hợp âm át phụ mà vẫn giữ bass B, ta dùng hợp âm nào?", "choices": ["E7/B", "G7/B", "B7", "D7/A"], "answer": "E7/B", "why": "E7 là \"mẹ\" của Am7, và B là một nốt của E7 nên giữ được bass B."}]},

  {"id": "p3-11", "part": 3, "src": "Phildave 3 · Bài 11", "title": "Hợp âm thay thế", "teach": [{"text": "Hợp âm thay thế (substitute) là hợp âm đặt vào chỗ của hợp âm khác mà vẫn hợp lý, vì cấu tạo giống nhau hoặc chung nhiều nốt. Ví dụ C (C–E–G) và Am (A–C–E) chung hai nốt C và E. Với hợp âm 4 nốt, Cmaj7 (C–E–G–B) và Am7 (A–C–E–G) chung tới ba nốt C, E, G. Vì chung gần hết nốt, đổi hợp âm này sang hợp âm kia thì giai điệu vẫn khớp, chỉ màu thay đổi.", "show": "Am7", "compare": {"a": {"label": "Cmaj7", "play": ["Cmaj7"]}, "b": {"label": "Am7", "play": ["Am7"]}}}, {"text": "Cách nhận quãng 3: quãng 3 trưởng rộng hai cung, như C–E; quãng 3 thứ hẹp hơn quãng 3 trưởng nửa cung, như C–Eb hay B–D. Hợp âm bốn nốt (maj7, m7, hợp âm 7) đều là các quãng 3 xếp chồng lên nhau. Vì vậy hai hợp âm có nốt gốc cách nhau một quãng 3 (như C và A, hay C và E) thường chung nhiều nốt: hợp âm này chỉ là hợp âm kia dời đi một tầng.", "tip": "Trên phím trắng, cứ cách một phím bấm một phím là xếp chồng quãng 3: Am7 = A C E G, Cmaj7 = C E G B, chung ba nốt C, E, G.", "keys": ["C4", "E4"], "play": [["C4", "E4"], ["C4", "Eb4"], ["B3", "D4"]]}, {"text": "Trong giọng C có ba nhóm thay thế: Cmaj7 thay bằng Am7 hoặc Em7; Fmaj7 thay bằng Dm7; G7 thay bằng Bm7b5. Mỗi cặp chung ba nốt: Cmaj7 với Am7 chung C, E, G; Cmaj7 với Em7 chung E, G, B; Fmaj7 với Dm7 chung F, A, C; G7 với Bm7b5 chung B, D, F. Vì chung gần hết nốt, tai vẫn nghe hợp âm thay vào như cùng một vai trò, chỉ đổi màu.", "show": "Dm7", "compare": {"a": {"label": "Fmaj7", "play": ["Fmaj7"]}, "b": {"label": "Dm7", "play": ["Dm7"]}}}, {"text": "Vòng quay lại (turnaround) là vòng 1–6–2–5, tức hợp âm trên bậc I, VI, II, V của giọng: Cmaj7 – Am7 – Dm7 – G7. G7 ở cuối lại dắt về Cmaj7 để quay lại từ đầu, nên vòng này lặp đi lặp lại được mãi, và rất hay gặp trong jazz. Lần lặp thứ hai, thay Cmaj7 bằng Em7: bài vẫn là bài cũ mà nghe có biến hoá. Chọn Em7 chứ không chọn Am7, vì ngay sau đã là Am7; dùng Am7 thì hai hợp âm liền nhau giống hệt, không còn gì đổi.", "compare": {"a": {"label": "Lần 1", "play": ["Cmaj7", "Am7", "Dm7", "G7"]}, "b": {"label": "Lần 2", "play": ["Em7", "Am7", "Dm7", "G7"]}}}], "remember": ["Hợp âm thay thế chung nhiều nốt với hợp âm gốc nên đặt vào chỗ của nó được (Cmaj7 và Am7 chung C, E, G).", "Cmaj7 ↔ Am7, Em7; Fmaj7 ↔ Dm7; G7 ↔ Bm7b5.", "Vòng quay lại (turnaround): Cmaj7 – Am7 – Dm7 – G7."], "items": [{"chord": "Em7", "to": "Cmaj7", "rel": "sub"}, {"chord": "Am7", "to": "Cmaj7", "rel": "sub"}, {"chord": "Dm7", "to": "Fmaj7", "rel": "sub"}], "quiz": [{"q": "Lần lặp thứ hai của vòng quay lại, vì sao thay Cmaj7 bằng Em7 mà không bằng Am7?", "choices": ["Vì ngay sau đã là Am7", "Vì Em7 không chung nốt nào với Cmaj7", "Vì Em7 là hợp âm át 7", "Vì Am7 không có trong giọng C"], "answer": "Vì ngay sau đã là Am7", "why": "Dùng Am7 thì hai ô nhịp liền nhau cùng một hợp âm; Em7 cũng chung ba nốt với Cmaj7 mà tạo được biến hoá."}]},

  {"id": "p3-12", "part": 3, "src": "Phildave 3 · Bài 12", "title": "Cmaj7, Fmaj7, G7: chuẩn để thay thế", "teach": [{"text": "Bậc I, IV, V (Cmaj7, Fmaj7, G7) là ba hợp âm chuẩn để thay: Cmaj7 thay bằng Em7 hoặc Am7, Fmaj7 thay bằng Dm7, G7 thay bằng Bm7b5. Nghĩa là mỗi hợp âm thay thế trong giọng C đều tìm từ một trong ba hợp âm này. G7 và Bm7b5 chung ba nốt B, D, F, nên Bm7b5 giữ được cả tritone B–F (B muốn lên C, F muốn xuống E). Vì thế Bm7b5 cũng kéo về C.", "show": "Bm7b5", "compare": {"a": {"label": "G7 → C", "play": ["G7", "C"]}, "b": {"label": "Bm7b5 → C", "play": ["Bm7b5", "C"]}}}, {"text": "Vòng quay lại lần 2, thầy biến hoá hai bước. Bước 1: đổi Cmaj7 thành Em7 (hợp âm thay thế, bài 11). Bước 2: đổi Am7 thành A7, \"mẹ\" của Dm7, để chèn thêm lực kéo vào giữa vòng. Ta được Em7 – A7 – Dm7 – G7, đa dạng hơn hẳn. Thầy dặn: trước khi biến hoá, phải kiểm tra hợp âm gốc đã đúng chưa, tức là chơi chắc vòng gốc Cmaj7 – Am7 – Dm7 – G7 trước, vì biến hoá nào cũng dựa trên hợp âm gốc.", "compare": {"a": {"label": "Vòng gốc", "play": ["Cmaj7", "Am7", "Dm7", "G7"]}, "b": {"label": "Vòng biến hoá", "play": ["Em7", "A7", "Dm7", "G7"]}}}, {"text": "Hợp âm át 7 mở rộng (extended dominant) là một chuỗi \"mẹ\" nối nhau, không dừng ở hợp âm yên: mỗi hợp âm vừa là đích của hợp âm trước, vừa là \"mẹ\" của hợp âm sau, như B7 → E7 → A7 → D7 (chuỗi dài này chỉ để thấy cách nối). Ví dụ Cmaj7 – A7 – D7 – G7 – C: A7 kéo về D7, D7 kéo về G7, G7 kéo về C. Khi đệm thật, thầy chỉ cho tối đa hai lần biến hoá liên tiếp. Ở ví dụ này, A7 (thay Am7) và D7 (thay Dm7) là hai chỗ biến hoá, còn G7 vốn có sẵn trong giọng nên không tính.", "compare": {"a": {"label": "Vòng gốc", "play": ["Cmaj7", "Am7", "Dm7", "G7", "C"]}, "b": {"label": "Hai chỗ biến hoá", "play": ["Cmaj7", "A7", "D7", "G7", "C"]}}}, {"text": "B7 nghe rất \"khé chát\", vì có tới hai nốt ngoài giọng C (D# và F#), trong khi A7, D7, E7 chỉ có một. Vì thế sau B7 nên về một hợp âm cơ bản là Em7 (hợp âm trong giọng, \"con\" của B7) cho tai nghỉ, rồi mới đi tiếp sang A7. Nghe so sánh: B7 – E7 – A7 – D7 liên tục thì càng lúc càng xa giọng C, còn B7 – Em7 – A7 – Dm7 có chỗ dừng chân ở giữa.", "tip": "Đếm phím đen: B7 = B D# F# A có hai phím đen (D#, F#), còn A7 = A C# E G chỉ có một (C#).", "show": "B7", "compare": {"a": {"label": "B7 – E7 – A7 – D7", "play": ["B7", "E7", "A7", "D7"]}, "b": {"label": "B7 – Em7 – A7 – Dm7", "play": ["B7", "Em7", "A7", "Dm7"]}}}], "remember": ["Cmaj7 → Em7 hoặc Am7, Fmaj7 → Dm7, G7 → Bm7b5.", "Chuỗi \"mẹ\" nối nhau (A7 → D7 → G7): tối đa hai lần biến hoá liên tiếp.", "Sau B7 (có hai nốt ngoài giọng, nghe khé) nên về Em7 rồi mới đi tiếp."], "items": [{"chord": "Bm7b5", "to": "G7", "rel": "sub"}, {"chord": "A7", "to": "D7"}, {"chord": "B7", "to": "Em7"}], "quiz": [{"q": "Vì sao Bm7b5 thay được G7?", "choices": ["Chung ba nốt B, D, F, giữ cả tritone", "Vì cùng nốt gốc G", "Vì Bm7b5 là hợp âm trưởng", "Vì Bm7b5 không có tritone"], "answer": "Chung ba nốt B, D, F, giữ cả tritone", "why": "G7 = G B D F, Bm7b5 = B D F A: chung B, D, F, trong đó có tritone B–F."}, {"q": "Vì sao B7 nghe khé hơn A7 trong giọng C?", "choices": ["B7 có hai nốt ngoài giọng (D#, F#)", "B7 không có tritone", "B7 là hợp âm thứ", "B7 có nốt gốc là phím đen"], "answer": "B7 có hai nốt ngoài giọng (D#, F#)", "why": "A7 chỉ có một nốt ngoài giọng C (C#), còn B7 có tới hai."}]},

  {"id": "p3-13", "part": 3, "src": "Phildave 3 · Bài 13", "title": "Cơ bản trước, biến hoá sau", "teach": [{"text": "Hợp âm trong giọng là phần cơ bản, hợp âm át phụ là phần biến hoá. Chỉ dùng nốt của âm giai C trưởng (các phím trắng) thì dù hay đến đâu vẫn nghe như nhạc thiếu nhi, vì tai không gặp nốt nào lạ. Nốt ngoài âm giai chính là thứ tạo màu \"biến hoá\": ví dụ đổi Am7 thành A7 là thêm C#, một phím đen. Nghe so sánh: chỉ một nốt C# mà vòng đã khác hẳn.", "compare": {"a": {"label": "Cơ bản", "play": ["C", "Am7", "Dm7", "G7", "C"]}, "b": {"label": "Biến hoá", "play": ["C", "A7", "Dm7", "G7", "C"]}}}, {"text": "Mỗi hợp âm át phụ thêm đúng một nốt ngoài âm giai: C7 có Bb, D7 có F#, E7 có G#, A7 có C#. Riêng B7 (B D# F# A) có tới hai nốt ngoài âm giai (D#, F#), nên nghe khé hơn (bài 12). Thầy ký hiệu phần cơ bản bằng hình tròn, phần biến hoá bằng hình tam giác, để nhìn bản nhạc là biết chỗ nào đang biến hoá.", "tip": "Tìm nốt ngoài âm giai: so từng nốt của hợp âm với 7 phím trắng; E7 = E G# B D chỉ có G# là phím đen.", "show": "E7", "play": ["E7", "Am7"]}, {"text": "Nốt màu (nốt 9, 11, 13 thêm lên hợp âm) cũng chia cơ bản và biến hoá. Với G7 trong giọng C, màu cơ bản là 9 (A) và 13 (E), gọi là ưu tiên số 1, vì A và E vẫn nằm trong âm giai C. Màu biến đổi b9 (Ab) và b13 (Eb) là biến hoá, ưu tiên số 2, vì chúng là nốt ngoài âm giai. Hãy chơi quen dạng cơ bản trước rồi mới biến hoá: tai đã quen G13 thì khi nghe G7(b9 b13), chỗ khác mới thành màu.", "tip": "Nốt 9 của G7 là A (G lên một cung), nốt 13 là E (nốt 5 là D, lên một cung); cả hai đều là phím trắng nên nằm trong âm giai C.", "show": "G13", "compare": {"a": {"label": "Ưu tiên 1: G7(9 13) → C", "play": ["G13", "C"]}, "b": {"label": "Ưu tiên 2: G7(b9 b13) → C", "play": ["G7(b9 b13)", "C"]}}}, {"text": "Ở chỗ E7 (trước Am), có nhiều lựa chọn: E7 không thêm màu, hoặc E7 thêm màu biến đổi như b9 (F), #9 (G), b13 (C). Màu biến đổi hợp ở đây vì E7 đi về hợp âm thứ Am; ví dụ b9 của E7 là F, và khi về Am, F trượt xuống nửa cung thành E. Bài 15 và 21 sẽ nói kỹ vì sao đích thứ hợp với màu biến đổi.", "show": "E7(b9)", "compare": {"a": {"label": "E7 → Am", "play": [["E2", "D3", "G#3", "B3", "E4"], ["A2", "A3", "C4", "E4"]]}, "b": {"label": "E7(b9) → Am", "play": [["E2", "D3", "G#3", "B3", "F4"], ["A2", "A3", "C4", "E4"]]}}}, {"text": "Bài tập ở giọng D (D E F# G A B C#): hợp âm trong giọng là D, Em, F#m, G, A, Bm, C#m7b5. \"Mẹ\" dẫn vào từng hợp âm, tìm bằng cách từ hợp âm đích đếm lên 5 tên nốt: A7 → D, B7 → Em, C#7 → F#m, D7 → G, E7 → A, F#7 → Bm. Ví dụ Bm: đếm B, C#, D, E, F#, nên \"mẹ\" là F#7. Thầy nhấn mạnh đây là nền tảng cực kỳ quan trọng: thuộc bảng này thì gặp bài giọng D là đặt được \"mẹ\" ngay.", "play": ["A7", "D", "F#7", "Bm"]}], "remember": ["Hợp âm trong giọng là cơ bản, hợp âm át phụ là biến hoá.", "G7 trong giọng C: màu cơ bản là 9 và 13 (ưu tiên 1); b9, b13 là biến hoá (ưu tiên 2).", "E7 về Am hợp với màu biến đổi (b9, #9, b13)."], "items": [{"chord": "G13", "to": "C"}, {"chord": "E7(b9)", "to": "Am"}, {"chord": "F#7", "to": "Bm"}], "quiz": [{"q": "Nốt nào của A7 nằm ngoài âm giai C?", "choices": ["C#", "F#", "G#", "Bb"], "answer": "C#", "why": "A7 = A C# E G; chỉ C# không có trong âm giai C."}, {"q": "Trong giọng D, \"mẹ\" dẫn vào F#m là hợp âm nào?", "choices": ["C#7", "F#7", "A7", "B7"], "answer": "C#7", "why": "Từ F# đếm lên 5 tên nốt: F#, G#, A, B, C#, nên C#7 kéo về F#m."}]},

  {"id": "p3-14", "part": 3, "src": "Phildave 3 · Bài 14", "title": "Màu biến đổi chỉ dành cho hợp âm át 7", "teach": [{"text": "Đây là nguyên lý quan trọng nhất của Tension Mastering (tên khoá học): làm đẹp hợp âm bằng cách thêm # hoặc b vào nốt màu 9, 11, 13, tức là dùng màu biến đổi. Việc này chỉ làm được trên hợp âm át 7, kể cả hợp âm át phụ (A7, E7…). Theo thầy, ở giai đoạn này Cmaj7, Cm7, Am7, Em7 không thêm #, b cho 9, 11, 13. Nghe so sánh: E7(b9) về Am7 nghe đẹp, còn Am7 mà thêm Bb (b9 của A) thì chói.", "show": "E7(b9)", "compare": {"a": {"label": "E7(b9) → Am7", "play": ["E7(b9)", "Am7"]}, "b": {"label": "Am7 thêm Bb (chói)", "play": [["A2", "G3", "|", "C4", "E4", "Bb4"]]}}}, {"text": "Vì sao? Nốt định hướng (bậc 3 và bậc 7) của Cmaj7 là E–B, của Cm7 là Eb–Bb, đều là quãng 5 đúng (tỉ lệ 2:3), rất ổn định. Hợp âm ổn định mà thêm nốt căng thì cái căng không có chỗ để đi, nên chỉ nghe chói. C7 thì có E–Bb là tritone, vốn đã bất ổn, nên thêm màu biến đổi vào vẫn hợp: nó làm cái căng sẵn có thêm màu, rồi tất cả được thả lỏng khi về F.", "compare": {"a": {"label": "Cmaj7 + Db (chói)", "play": [["C3", "E3", "B3", "Db4"]]}, "b": {"label": "C7 + Db → F", "play": [["C3", "E3", "Bb3", "Db4"], ["F2", "A3", "C4"]]}}}, {"text": "Nốt màu là tiếp tục xếp chồng quãng 3 lên trên hợp âm 7, vượt qua quãng 8: sau bậc 7 là 9, rồi 11, rồi 13. Trên hợp âm át 7, nốt 9 có ba dạng dùng được (9, b9, #9), nốt 11 chỉ có một dạng (#11), nốt 13 có hai dạng (13, b13). Ví dụ trên C7: 9 là D, b9 là Db, #9 là D#; #11 là F#; 13 là A, b13 là Ab.", "tip": "Nốt 9, 11, 13 = nốt thứ 2, 4, 6 tính từ nốt gốc, đặt cao lên một quãng 8 (C7: D, F, A).", "play": [["C3", "E3", "Bb3", "D4"], ["C3", "E3", "Bb3", "Db4"], ["C3", "E3", "Bb3", "D#4"]]}, {"text": "Vì sao nốt 11 không biến đổi (trên C7 là F) thường không dùng? F chỉ cao hơn bậc 3 (E) nửa cung. Dù đặt F cao lên một quãng 8 (E ở dưới, F ở trên, gọi là quãng 9 thứ), hai nốt vẫn chọi nhau và làm mờ bậc 3, nốt cho biết hợp âm là trưởng. Vì vậy trên hợp âm át 7 thường dùng #11 (F#), nghe sáng mà không chọi.", "tip": "Nốt 11 = nốt thứ 4 tính từ nốt gốc, đặt cao một quãng 8 (C7: F); #11 là nốt đó nâng lên nửa cung (F#).", "keys": ["E3", "F4"], "compare": {"a": {"label": "C7 + 11 (chói)", "play": [["C3", "E3", "Bb3", "F4"]]}, "b": {"label": "C7 + #11", "play": [["C3", "E3", "Bb3", "F#4"]]}}}, {"text": "Ví dụ trong giọng C, thầy chia hai nhóm. Nhóm đi về hợp âm trưởng dùng 9, 13 không biến đổi: C7(9 13) về F, G7(9 13) về C, D7(9 #11) về G (D7 thêm #11, dạng dùng được của nốt 11 như màn trên). Nhóm đi về hợp âm thứ dùng màu biến đổi: E7(#9 b13) về Am, A7(b9 b13) về Dm, B7(b9 b13) về Em. Để ý: chọn màu nào là nhìn hợp âm đích, trưởng hay thứ; bài 21 sẽ nói kỹ.", "compare": {"a": {"label": "C13 → Fmaj7", "play": ["C13", "Fmaj7"]}, "b": {"label": "E7(#9 b13) → Am7", "play": ["E7(#9 b13)", "Am7"]}}}, {"text": "Mode là âm giai bắt đầu từ từng bậc của âm giai trưởng, dùng đúng các nốt đó. Trong giọng C (phím trắng): bắt đầu từ C là Ionian, từ D là Dorian, từ E là Phrygian, từ F là Lydian, từ G là Mixolydian, từ A là Aeolian, từ B là Locrian. Ionian chính là âm giai trưởng tự nhiên, Aeolian chính là âm giai thứ tự nhiên.", "tip": "Mỗi mode chỉ là các phím trắng, bắt đầu và kết thúc ở một phím khác: Dorian từ D lên D.", "play": [["D4"], ["E4"], ["F4"], ["G4"], ["A4"], ["B4"], ["C5"], ["D5"]]}, {"text": "Mixolydian (mode 5, bắt đầu từ G) chỉ khác âm giai trưởng ở bậc 7 hạ nửa cung: G mixolydian có F thay vì F# của G trưởng. Bậc 7 hạ đúng bằng nốt 7 của G7 (G lùi một cung là F), nên mixolydian hợp với hợp âm át 7.", "tip": "G mixolydian chính là các phím trắng từ G lên G: G A B C D E F G.", "play": [["G4"], ["A4"], ["B4"], ["C5"], ["D5"], ["E5"], ["F5"], ["G5"]]}, {"text": "Riêng cho hợp âm át 7, jazz dùng 3 âm giai chính: altered (phát triển từ Locrian), lydian dominant (Lydian hạ bậc 7 xuống nửa cung, b7) và mixolydian. Mỗi âm giai cho một bộ nốt màu: mixolydian cho 9 và 13, altered cho b9, #9, b13, lydian dominant cho 9, #11, 13. Ba âm giai này là chủ đề của ba bài kế tiếp; giờ chỉ cần nghe thử hai màu: E7(b9 b13) về Am7 (altered) và G13 về C (mixolydian).", "compare": {"a": {"label": "Altered: E7(b9 b13)", "play": ["E7(b9 b13)", "Am7"]}, "b": {"label": "Mixolydian: G13", "play": ["G13", "C"]}}}], "remember": ["Chỉ hợp âm át 7 mới thêm # hoặc b cho 9, 11, 13.", "Trên hợp âm át 7: 9, b9, #9; #11; 13, b13 (tránh 11 tự nhiên).", "Mixolydian = âm giai trưởng hạ bậc 7, hợp với hợp âm át 7."], "items": [{"chord": "C13", "to": "Fmaj7"}, {"chord": "E7(#9 b13)", "to": "Am7"}, {"chord": "A7(b9 b13)", "to": "Dm7"}], "quiz": [{"q": "Vì sao không thêm b9 vào Cmaj7?", "choices": ["Nốt định hướng của Cmaj7 là quãng 5 đúng, rất ổn định", "Vì Cmaj7 có tritone", "Vì Cmaj7 không có nốt 9", "Vì b9 luôn là phím đen"], "answer": "Nốt định hướng của Cmaj7 là quãng 5 đúng, rất ổn định", "why": "Màu biến đổi chỉ hợp với hợp âm vốn đã bất ổn (có tritone); Cmaj7 thì ổn định."}, {"q": "Trên hợp âm át 7, nốt 11 thường dùng ở dạng nào?", "choices": ["#11", "11", "b11", "Không dạng nào"], "answer": "#11", "why": "11 tự nhiên nằm ngay trên bậc 3, chỉ cách nửa cung, nên chói (C7: F ngay trên E); vì vậy dùng #11."}, {"q": "Mode nào chỉ khác âm giai trưởng ở bậc 7 hạ nửa cung?", "choices": ["Mixolydian", "Dorian", "Lydian", "Locrian"], "answer": "Mixolydian", "why": "Mixolydian là mode 5: giống âm giai trưởng nhưng hạ bậc 7, nên hợp với hợp âm át 7."}]},

  {"id": "p3-15", "part": 3, "src": "Phildave 3 · Bài 15", "title": "Altered scale", "teach": [{"text": "Altered là âm giai cho tiếng \"jazz\" nhất. C altered gồm 1, b2 (b9), #2 (#9), 3, #4 (#11), #5 (b13), b7, tức C Db D# E F# G# Bb. Đọc \"b2 (b9)\" nghĩa là bậc 2 hạ nửa cung, mà bậc 2 đặt cao lên một quãng 8 chính là nốt 9 (bài 4). Vậy mọi nốt màu đều bị biến đổi, chỉ còn nốt gốc, bậc 3 và bậc 7 giữ nguyên để hợp âm vẫn là C7.", "tip": "Cách nhớ: altered giữ ba nốt của C7 là C, E, Bb, còn lại đều là nốt màu biến đổi: Db (b9), D# (#9), F# (#11), G# (b13).", "play": [["C4"], ["Db4"], ["D#4"], ["E4"], ["F#4"], ["G#4"], ["Bb4"], ["C5"]]}, {"text": "Thầy không dùng hết cả âm giai mà rút ra hai bộ màu cơ bản: bộ 1 là #9 + b13, bộ 2 là b9 + b13. Cách bấm: tay trái bấm ba nốt của hợp âm 7 (nốt gốc, bậc 7, bậc 3), tay phải bấm bộ màu ở trên. Ví dụ trên E7 (E G# B D): tay trái E, D, G#; bộ 1 là G (#9) + C (b13), bộ 2 là F (b9) + C (b13). Khi về Am7, nốt C giữ nguyên vì C cũng là nốt của Am7.", "tip": "Tìm trên E7: nốt 9 là F#, hạ thành F (b9), nâng thành G (#9); nốt 13 là C#, hạ thành C (b13).", "compare": {"a": {"label": "Bộ 1: G + C", "play": [["E2", "D3", "G#3", "|", "C4", "G4"], ["A2", "|", "C4", "E4", "G4"]]}, "b": {"label": "Bộ 2: F + C", "play": [["E2", "D3", "G#3", "|", "C4", "F4"], ["A2", "|", "C4", "E4", "G4"]]}}}, {"text": "Trong giọng C, altered hợp nhất với E7, A7, B7, vì chúng là \"mẹ\" của các hợp âm thứ: E7 → Am, A7 → Dm, B7 → Em. Lý do: nốt màu biến đổi của các \"mẹ\" này rơi đúng vào nốt của đích thứ; ví dụ A7(b9 b13) có Bb và F, Bb trượt xuống A, còn F chính là bậc 3 của Dm. Không cần lúc nào cũng đánh luân phiên hai bộ; chọn một bộ rồi dùng luôn cũng được, ví dụ chỉ dùng bộ 2 (F + C trên E7).", "show": "A7(b9 b13)", "play": ["A7(b9 b13)", "Dm7"]}, {"text": "Nốt nên tránh (avoid note) là nốt nằm nửa cung ngay trên một nốt định hướng và làm mờ nó; ví dụ ở bài 14, nốt 11 của C7 là F, ngay trên bậc 3 là E. Trong altered, bậc 4 đã được nâng thành #11 (F#), nên không còn nốt nào đè lên bậc 3 hay bậc 7. b9 (Db) cũng nằm ngay trên nốt gốc C, nhưng nốt gốc không quyết định trưởng hay thứ, và Db có chỗ để đi (trượt xuống), nên trên hợp âm át 7 nó là một màu chứ không phải nốt nên tránh. Vì vậy với altered, chơi giai điệu hay bấm màu kiểu nào cũng hợp.", "compare": {"a": {"label": "C7 + F (chọi)", "play": [["C3", "E3", "Bb3", "F4"]]}, "b": {"label": "C7 + F# (hợp)", "play": [["C3", "E3", "Bb3", "F#4"]]}}}, {"text": "Muốn tìm nhanh altered cho một hợp âm 7, phải thuộc âm giai trưởng của nốt gốc đó, rồi biến đổi các nốt màu. Ví dụ B7: B trưởng là B C# D# E F# G# A#, nên nốt 9 là C# và nốt 13 là G#. Hạ 9 thì b9 là C, nâng 9 thì #9 là D, hạ 13 thì b13 là G. Vì thế B7(#9 b13) có D và G ở trên, mà D và G đều là nốt của Em7, nên về Em7 rất mượt.", "tip": "Cách nhanh: b9 là phím ngay trên nốt gốc (B lên nửa cung là C), #9 cao hơn b9 một cung (C lên D).", "show": "B7(#9 b13)", "play": ["B7(#9 b13)", "Em7"]}], "remember": ["C altered: 1, b9, #9, 3, #11, b13, b7.", "Bộ 1 = #9 + b13; bộ 2 = b9 + b13.", "Altered hợp với E7, A7, B7 (về hợp âm thứ)."], "items": [{"chord": "E7(#9 b13)", "to": "Am7"}, {"chord": "A7(b9 b13)", "to": "Dm7"}, {"chord": "B7(#9 b13)", "to": "Em7"}], "quiz": [{"q": "Bộ 1 (#9 + b13) trên E7 gồm hai nốt nào?", "choices": ["G và C", "F và C", "F# và C#", "G# và D"], "answer": "G và C", "why": "#9 của E là G, b13 của E là C."}, {"q": "Altered hợp nhất với hợp âm át 7 đi về loại hợp âm nào?", "choices": ["Hợp âm thứ", "Hợp âm trưởng", "Hợp âm maj7", "Hợp âm át 7"], "answer": "Hợp âm thứ", "why": "E7 → Am, A7 → Dm, B7 → Em: đích là hợp âm thứ nên hợp màu biến đổi."}]},

  {"id": "p3-16", "part": 3, "src": "Phildave 3 · Bài 16", "title": "Lydian dominant scale", "teach": [{"text": "Lydian là âm giai trưởng nâng bậc 4 lên nửa cung (#4; đặt cao lên một quãng 8 thì gọi là #11). Lydian dominant là Lydian hạ bậc 7 xuống nửa cung (b7), đúng nốt 7 của hợp âm 7. C lydian dominant là 1, 2, 3, #4, 5, 6, b7, tức C D E F# G A Bb. Nốt màu của nó là 9 (D), #11 (F#), 13 (A): 9 và 13 giữ nguyên, chỉ 11 được nâng.", "tip": "C mixolydian là C D E F G A Bb; nâng F lên F# là ra C lydian dominant.", "play": [["C4"], ["D4"], ["E4"], ["F#4"], ["G4"], ["A4"], ["Bb4"], ["C5"]]}, {"text": "Thử với G7: G lydian dominant là G A B C# D E F. Nốt màu 9, #11, 13 của G7 là A, C#, E, và ba nốt này ghép lại chính là hợp âm A trưởng (A C# E). Vì vậy chỉ cần tay trái bấm ba nốt G, B, F của G7 (bỏ D), tay phải bấm hợp âm A là có đủ màu, thành G13(#11).", "tip": "Hợp âm ba nốt tay phải là hợp âm trưởng cao hơn nốt gốc một cung: G lên một cung là A, nên đặt hợp âm A lên G7.", "show": "G13(#11)", "play": ["G13(#11)", "C"]}, {"text": "Một hợp âm ba nốt ở tay phải đặt lên hợp âm 7 ở tay trái như vậy gọi là hợp âm ba nốt phía trên (upper structure). Lợi ích: không phải tính từng nốt 9, #11, 13, chỉ cần tìm hợp âm trưởng cao hơn nốt gốc một cung rồi bấm như hợp âm ba nốt quen thuộc. Ví dụ D7: D lên một cung là E, tay phải bấm hợp âm E (E G# B), thành D13(#11).", "tip": "Kiểm tra trên D7: E là 9, G# là #11, B là 13.", "show": "D13(#11)", "play": ["D13(#11)", "G"]}, {"text": "Altered cũng có #11, nhưng khi #11 đi cùng 9 và 13 không biến đổi thì gọi là lydian dominant. Nói cách khác: altered biến đổi cả 9 và 13 (thành b9, #9, b13), còn lydian dominant giữ nguyên 9 và 13, chỉ nâng 11. Nghe so sánh: E7(#9 b13) tối và gắt, D13(#11) sáng và mở.", "compare": {"a": {"label": "Altered: E7(#9 b13)", "play": ["E7(#9 b13)", "Am7"]}, "b": {"label": "Lydian dominant: D13(#11)", "play": ["D13(#11)", "G"]}}}, {"text": "Lydian dominant dùng cho hợp âm át 7 đi về hợp âm trưởng, như G7 → C, D7 → G, C7 → F; hợp âm át 7 đi về hợp âm thứ (E7, A7, B7) thì dùng altered. Lý do nằm ở âm giai của đích: 9 và 13 của D7 (E và B) đều có trong âm giai G trưởng, nên hợp đích trưởng G. Riêng #11 (G#) là nốt ngoài, nhưng nó chỉ thêm độ sáng và không chọi với bậc 3 (F#) như nốt 11 (G) ở bài 14, nên vẫn dùng được khi về G. Còn b9 và b13 của A7 (Bb và F) đều có trong âm giai D thứ tự nhiên, nên hợp đích thứ Dm.", "compare": {"a": {"label": "D13(#11) → G7", "play": ["D13(#11)", "G7"]}, "b": {"label": "A7(b9 b13) → Dm", "play": ["A7(b9 b13)", "Dm"]}}}], "remember": ["Lydian dominant: 1 2 3 #4 5 6 b7; nốt màu 9, #11, 13.", "G7 + hợp âm A ở tay phải = G13(#11).", "Về hợp âm trưởng: 9, 13 (có thể thêm #11); về hợp âm thứ: altered."], "items": [{"chord": "D13(#11)", "to": "G7"}, {"chord": "G13(#11)", "to": "C"}, {"chord": "A7(b9 b13)", "to": "Dm"}], "quiz": [{"q": "Hợp âm ba nốt nào đặt trên G7 cho đủ 9, #11, 13?", "choices": ["A", "D", "Bb", "F"], "answer": "A", "why": "Hợp âm A = A C# E, tức 9, #11, 13 của G."}, {"q": "Lydian dominant khác altered ở điểm nào?", "choices": ["Giữ 9 và 13 tự nhiên", "Không có #11", "Không có bậc 3", "Không có bậc 7"], "answer": "Giữ 9 và 13 tự nhiên", "why": "Cả hai đều có #11, nhưng altered biến đổi 9 và 13, còn lydian dominant giữ 9, 13 tự nhiên."}]},

  {"id": "p3-17", "part": 3, "src": "Phildave 3 · Bài 17", "title": "Mixolydian scale", "teach": [{"text": "Mixolydian là âm giai trưởng có bậc 7 hạ xuống nửa cung (bài 14). G mixolydian là G A B C D E F, đúng các phím trắng tính từ G, và F chính là nốt 7 của G7. Nốt màu dùng được là 9 (A) và 13 (E), cả hai đều là phím trắng của giọng C. Nhìn bàn phím: G13 bấm tay trái G, F; tay phải E, A, B; nút Nghe phát G mixolydian.", "show": "G13", "play": [["G4"], ["A4"], ["B4"], ["C5"], ["D5"], ["E5"], ["F5"], ["G5"]]}, {"text": "Bậc 4 (nốt 11, trên G7 là C) là nốt nên tránh (nốt nghe chọi, nên bỏ đi), vì nó va với bậc 3: B và C chỉ cách nửa cung. Nghe thử G7 kèm nốt C ở trên: nghe đục, chọi, và làm mờ B, nốt cho biết G7 là hợp âm trưởng. Vì vậy mixolydian chỉ dùng 9 và 13, bỏ 11.", "compare": {"a": {"label": "G7 + C (chọi)", "play": [["G2", "F3", "B3", "C5"]]}, "b": {"label": "G13", "play": ["G13"]}}}, {"text": "Trên G7, thầy hay dùng hợp âm treo (sus4): thay bậc 3 (B) bằng bậc 4 (C), tức là treo nốt đó lên nửa cung. Hợp âm treo nghe lơ lửng, như đang chờ. Sau đó đưa C về B: bước từ chỗ treo, chỗ căng về chỗ yên như vậy gọi là giải quyết (resolve). Đây cũng là cách dùng nốt C mà không bị chọi: C không bấm chung với B mà thay hẳn B, rồi mới nhường chỗ cho B.", "tip": "G(sus4) = G C D; đưa C xuống nửa cung thành B là về hợp âm G.", "keys": ["C4"], "play": [["G2", "F3", "|", "C4", "D4", "G4"], ["G2", "F3", "|", "B3", "D4", "G4"], "C"]}, {"text": "Một cách treo đẹp là G9sus4: tay trái bấm G, tay phải bấm hợp âm F (F A C), viết là F/G (hợp âm F trên bass G). Nhìn từ G thì F là bậc 7, A là nốt 9, C là bậc 4 (chỗ treo), nên hợp âm này vừa treo vừa có màu 9. Giải quyết: tay phải chuyển từ F A C sang các nốt của G7, rồi về C.", "tip": "Tay phải là hợp âm trưởng của nốt gốc lùi một cung: G lùi một cung là F, nên G9sus4 = hợp âm F trên bass G.", "show": "G9sus4", "play": ["G9sus4", "G7", "C"]}, {"text": "Thầy có bảng ứng viên trong giọng C cho từng \"mẹ\": ứng viên 1 là lựa chọn chính, ứng viên 2 là biến hoá. Với \"mẹ\" về hợp âm trưởng, ứng viên 1 là mixolydian (9, 13): C7(9 13) về Fmaj7, G7(9 13) về Cmaj7; riêng D7 về G7 thầy ghi ứng viên 1 là D7(9 #11 13). Ứng viên 2 là màu biến đổi: C7(b9 b13) về Fmaj7, G7(b9 b13) về Cmaj7 (riêng D7 thì ứng viên 2 là D7(9 13)). Nghe G13 rồi G7(b9 b13) trước Cmaj7: ứng viên 1 sáng, ứng viên 2 tối và căng hơn.", "compare": {"a": {"label": "Ứng viên 1: G13 → Cmaj7", "play": ["G13", "Cmaj7"]}, "b": {"label": "Ứng viên 2: G7(b9 b13) → Cmaj7", "play": ["G7(b9 b13)", "Cmaj7"]}}}, {"text": "Với \"mẹ\" về hợp âm thứ, cả hai ứng viên đều là altered: E7 về Am7 có ứng viên 1 là E7(#9 b13), ứng viên 2 là E7(b9 b13); A7 về Dm7 và B7 về Em7 cũng vậy. Dùng thế nào: nhịp dài (hợp âm giữ nhiều phách) thì chơi ứng viên 1 rồi chuyển sang ứng viên 2, cho màu đổi dần trước khi về đích; nhịp ngắn thì chỉ cần ứng viên 1. Nghe E7(#9 b13) – E7(b9 b13) – Am7.", "play": ["E7(#9 b13)", "E7(b9 b13)", "Am7"]}], "remember": ["Mixolydian = âm giai trưởng hạ bậc 7; dùng 9, 13, tránh 11.", "G9sus4 (F/G) treo lên rồi giải quyết về G7.", "Về trưởng: ứng viên 1 mixolydian, ứng viên 2 màu biến đổi; về thứ: altered."], "items": [{"chord": "G9sus4", "to": "C"}, {"chord": "G7(b9 b13)", "to": "Cmaj7"}, {"chord": "E7(#9 b13)", "to": "Am7"}], "quiz": [{"q": "Vì sao nốt 11 (C) là nốt nên tránh trên G7?", "choices": ["Nó va với bậc 3 (B), hai nốt chỉ cách nửa cung", "Nó là phím đen", "Nó không có trong G mixolydian", "Nó là nốt gốc của G7"], "answer": "Nó va với bậc 3 (B), hai nốt chỉ cách nửa cung", "why": "C ngay trên B nửa cung nên nghe chọi; vì vậy mixolydian dùng 9 và 13, bỏ 11."}, {"q": "G9sus4 bấm thế nào?", "choices": ["Bass G, tay phải hợp âm F", "Bass G, tay phải hợp âm D", "Bass F, tay phải hợp âm G", "Bass C, tay phải hợp âm F"], "answer": "Bass G, tay phải hợp âm F", "why": "G9sus4 viết là F/G: hợp âm F (F A C) trên bass G."}]},

  {"id": "p3-18", "part": 3, "src": "Phildave 3 · Bài 18", "title": "Âm giai trưởng và âm giai thứ", "teach": [{"text": "Thay vì nhớ riêng từng nốt màu cho mọi hợp âm (như G7 về Cm dùng Ab, A7 về Dm dùng Bb), thầy dùng 4 âm giai để suy ra: trưởng tự nhiên, thứ tự nhiên, thứ hoà âm, thứ giai điệu. Ví dụ G7 về Cm: âm giai C thứ có Ab, nên Ab (b9 của G7) là màu hợp. Thuộc 4 âm giai này thì tìm nốt màu nhanh hơn nhiều so với tính từng nốt phải hạ hay phải nâng.", "compare": {"a": {"label": "C trưởng", "play": [["C4"], ["D4"], ["E4"], ["F4"], ["G4"], ["A4"], ["B4"], ["C5"]]}, "b": {"label": "C thứ tự nhiên", "play": [["C4"], ["D4"], ["Eb4"], ["F4"], ["G4"], ["Ab4"], ["Bb4"], ["C5"]]}}}, {"text": "C trưởng tự nhiên có hai chỗ nửa cung: giữa bậc 3 và 4 (E–F) và giữa bậc 7 và 8 (B–C); các bước còn lại đều một cung. C thứ tự nhiên là 1, 2, b3, 4, 5, b6, b7 (C D Eb F G Ab Bb), tức C trưởng hạ ba nốt E, A, B. Ba nốt giáng Eb, Ab, Bb giống hệt ba dấu giáng của giọng Eb trưởng, nên ai thuộc giọng Eb trưởng thì đọc được ngay C thứ tự nhiên.", "tip": "Nhìn phím: E–F và B–C là hai chỗ hai phím trắng sát nhau, không có phím đen ở giữa.", "keys": ["E4", "F4", "B4", "C5"], "play": [["E4", "F4"], ["B4", "C5"]]}, {"text": "Dựng hợp âm từ C thứ tự nhiên (bấm một nốt, bỏ một nốt như bài 1) ta được: Cm7, Dm7b5, Ebmaj7, Fm7, Gm7, Abmaj7, Bb7. Bậc V là Gm7 (G Bb D F): bậc 3 Bb và bậc 7 F không phải tritone, nên Gm7 về Cm nghe thiếu lực. Nghe so sánh Gm7 → Cm với G7 → Cm: G7 kéo về rõ hơn hẳn.", "compare": {"a": {"label": "Gm7 → Cm", "play": ["Gm7", "Cm"]}, "b": {"label": "G7 → Cm", "play": ["G7", "Cm"]}}}, {"text": "Cách sửa: nâng bậc 7 của âm giai từ Bb lên B. Bb chính là bậc 3 của Gm7, nên Gm7 thành G7 (G B D F), có tritone B–F. B nằm ngay dưới C nửa cung nên kéo về Cm rất mạnh. Âm giai C thứ có bậc 7 nâng như vậy là thứ hoà âm (bài 6), và hợp âm bậc V của nó là G7.", "tip": "Gm7 thành G7 chỉ cần nâng Bb lên B, đúng bậc 3 của hợp âm trưởng G; B nằm ngay dưới C nửa cung nên kéo về Cm rất mạnh.", "show": "G7", "play": ["G7", "Cm"]}, {"text": "Âm giai thứ giai điệu nâng cả bậc 6 và bậc 7 (C D Eb F G A B), cho ca sĩ dễ hát khi giai điệu đi lên. Khi giai điệu đi xuống, người ta thường dùng lại thứ tự nhiên (C Bb Ab G F Eb D C). Nghe so sánh: đi lên bằng thứ giai điệu, đi xuống bằng thứ tự nhiên.", "tip": "Thứ giai điệu = C trưởng chỉ hạ E xuống Eb.", "compare": {"a": {"label": "Đi lên: thứ giai điệu", "play": [["C4"], ["D4"], ["Eb4"], ["F4"], ["G4"], ["A4"], ["B4"], ["C5"]]}, "b": {"label": "Đi xuống: thứ tự nhiên", "play": [["C5"], ["Bb4"], ["Ab4"], ["G4"], ["F4"], ["Eb4"], ["D4"], ["C4"]]}}}, {"text": "G7 về được cả C trưởng lẫn C thứ, nhưng nốt màu khác nhau tuỳ đích. Về C, dùng 9 (A), vì A có trong âm giai C trưởng; về Cm, dùng b9 (Ab), vì Ab có trong âm giai C thứ (cả thứ tự nhiên lẫn thứ hoà âm). Vì vậy thầy dặn phải thuộc âm giai thứ hoà âm ở đủ 12 giọng: gặp \"mẹ\" về hợp âm thứ nào, nghĩ ra âm giai thứ hoà âm của hợp âm đó là biết màu. Riêng #9 (bộ 1) thì lấy từ thứ tự nhiên: G7 về Cm có #9 là Bb.", "compare": {"a": {"label": "G9 → C", "play": ["G9", "C"]}, "b": {"label": "G7(b9) → Cm", "play": ["G7(b9)", "Cm"]}}}], "remember": ["4 âm giai: trưởng tự nhiên, thứ tự nhiên, thứ hoà âm, thứ giai điệu.", "Thứ hoà âm = thứ tự nhiên nâng bậc 7, nhờ đó có G7 về Cm.", "G7 về C hay về Cm thì nốt màu khác nhau."], "items": [{"chord": "G7(b9)", "to": "Cm"}, {"chord": "G9", "to": "C"}], "quiz": [{"q": "Vì sao trong C thứ, người ta đổi Gm7 thành G7?", "choices": ["Để có tritone (B–F) kéo về Cm", "Để có thêm nốt Bb", "Để bỏ nốt G", "Vì Gm7 không có trong C thứ"], "answer": "Để có tritone (B–F) kéo về Cm", "why": "Nâng Bb lên B thì G7 có tritone B–F nên kéo về Cm mạnh hơn."}, {"q": "C thứ tự nhiên có cùng các dấu giáng với giọng nào?", "choices": ["Eb trưởng", "F trưởng", "G trưởng", "Bb trưởng"], "answer": "Eb trưởng", "why": "C thứ tự nhiên có Eb, Ab, Bb: ba dấu giáng, giống Eb trưởng."}]},
