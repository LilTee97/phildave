<style>

  .prog { font-size:20px; letter-spacing:1px; margin:6px 0; }

  #kb { position:relative; height:110px; }
  .w,.k { position:absolute; top:0; border-radius:0 0 4px 4px; }
  .w { width:28px; height:110px; background:#f4f4f4; border:1px solid #888; }
  .k { width:18px; height:68px; background:#222; z-index:2; border:1px solid #000; }
  .lh { background:var(--lh) !important; } .rh { background:var(--rh) !important; }
  .on { box-shadow: inset 0 -14px 0 var(--ok); }

  .k .lbl { font-size:7.5px; letter-spacing:-.3px; color:#ddd; bottom:4px; }

  .hand { position:absolute; top:0; transform:translateX(-50%); white-space:nowrap; font-size:13px; font-weight:700; padding:1px 6px; border-radius:6px; color:#111; }

  .lhead { margin-bottom:6px; }
  .why { color:var(--mut); font-size:14px; margin:8px 0 0; }
  .remember { padding-left:20px; line-height:1.5; }
  .tip { background:#2b2a26; border-left:3px solid var(--rh); border-radius:6px; padding:8px 10px; margin:8px 0; font-size:15px; line-height:1.45; }
  .term { border-bottom:1px dotted var(--rh); cursor:pointer; }

  { "id": "p3-01", "part": 3, "src": "Phildave 3 · Bài 1", "title": "Tritone: cặp nốt bứt rứt trong G7",

    "remember": ["Tỉ lệ dao động đơn giản (1:2, 2:3, 3:4) thì thuận tai.", "Tritone có tỉ lệ 32:45, rất phức tạp, nên nghe bứt rứt."],
    "items": [{"chord": "G7", "to": "C"}, {"chord": "C7", "to": "F"}],
    "quiz": [
      {"q": "Quãng nào có tỉ lệ dao động đơn giản nhất?", "choices": ["Quãng 8 (1:2)", "Quãng 5 đúng (2:3)", "Quãng 3 trưởng (4:5)", "Tritone (32:45)"], "answer": "Quãng 8 (1:2)", "why": "1:2 là tỉ lệ đơn giản nhất, nên hai nốt cách nhau quãng 8 hoà vào nhau gần như một nốt."},
      {"q": "Vì sao tritone nghe bứt rứt?", "choices": ["Tỉ lệ dao động 32:45 rất phức tạp", "Vì nó gồm ba nốt", "Vì nó luôn rơi vào phím đen", "Vì hai nốt cách nhau quãng 8"], "answer": "Tỉ lệ dao động 32:45 rất phức tạp", "why": "Tỉ lệ càng phức tạp thì tai càng thấy nghịch; 32:45 phức tạp hơn hẳn 2:3 hay 3:4."}
    ] },

  { "id": "p3-04", "part": 3, "src": "Phildave 3 · Bài 4", "title": "Hợp âm có tritone là hợp âm át 7",
    "teach": [
      {"text": "7 hợp âm dựng từ chính các nốt của giọng C (chỉ phím trắng) gọi là hợp âm trong giọng (diatonic): Cmaj7, Dm7, Em7, Fmaj7, G7, Am7, Bm7b5. Trong 7 hợp âm này, chỉ G7 (G–B–D–F) có tritone B–F giữa bậc 3 và bậc 7. Vì thế G7 là hợp âm át 7 duy nhất của giọng C.", "show": "G7", "play": ["G7", "C"]},
      {"text": "Ra ngoài phím trắng, A7, D7, E7, B7 và cả Bb7 đều có tritone. Ví dụ E7 = E G# B D: bậc 3 là G#, bậc 7 là D, và G#–D là một tritone. Cứ là hợp âm 7 (ghi số 7 không kèm maj hay m) thì bậc 3 và bậc 7 luôn là tritone như vậy, tức là một \"mẹ\".", "tip": "Dựng nhanh hợp âm 7 từ bất kỳ nốt nào: hợp âm trưởng của nốt đó + nốt gốc lùi một cung (E7 = hợp âm E là E G# B, thêm D).", "show": "E7", "play": ["E7", "Am"]},
      {"text": "Nốt màu (tension) là các nốt 9, 11, 13 xếp thêm lên hợp âm 7 cho nghe giàu hơn. Ví dụ nốt 9 của G7 là A: chính là nốt ngay trên G (G, A), nhưng đặt cao lên một quãng 8. G9 vẫn kéo về C như G7, chỉ nghe đầy đặn hơn.", "tip": "Cách tính nhanh: 9 = nốt thứ 2, 11 = nốt thứ 4, 13 = nốt thứ 6 tính từ nốt gốc, chỉ đặt cao lên một quãng 8 (G7: 9 là A, 11 là C, 13 là E).", "show": "G9", "compare": {"a": {"label": "G7 → C", "play": ["G7", "C"]}, "b": {"label": "G9 → C", "play": ["G9", "C"]}}},
      {"text": "Thăng hoặc giáng nốt màu đi nửa cung thì ta có màu biến đổi, hay gặp nhất là b9, #9, b13 (gọi chung là màu altered). Màu biến đổi nghe rất căng, nên chỉ hợp với hợp âm vốn đã căng, tức hợp âm có tritone. Ví dụ E7 thêm b9 (nốt F) thành E7(b9), về Am rất đẹp. Cách đọc: dấu đọc trước số, b9 là \"flat 9\", #9 là \"sharp 9\".", "tip": "b9 là phím ngay trên nốt gốc (E7: E nhích lên nửa cung là F), đặt cao lên một quãng 8.", "show": "E7(b9)", "compare": {"a": {"label": "E7 → Am", "play": ["E7", "Am"]}, "b": {"label": "E7(b9) → Am", "play": ["E7(b9)", "Am"]}}}
    ],
    "remember": ["Trong 7 hợp âm trong giọng (diatonic) của C, chỉ G7 có tritone giữa bậc 3 và bậc 7.", "Hợp âm 7, tức hợp âm át 7 (G7, A7, D7, E7, B7, Bb7), đều có tritone giữa bậc 3 và bậc 7.", "Màu biến đổi (b9, #9, b13) chỉ dùng trên hợp âm có tritone."],
    "items": [{"chord": "G9", "to": "C"}, {"chord": "E7(b9)", "to": "Am"}],
    "quiz": [
      {"q": "Màu biến đổi (b9, #9, b13) đặt được lên hợp âm nào?", "choices": ["E7", "Am7", "Cmaj7", "Dm7"], "answer": "E7", "why": "Chỉ hợp âm có tritone như E7 mới hợp với màu biến đổi; Am7, Cmaj7, Dm7 không có tritone."}
    ] },

  { "id": "p3-05", "part": 3, "src": "Phildave 3 · Bài 5", "title": "Nốt định hướng: bậc 3 và bậc 7",
    "teach": [
      {"text": "Trong ban nhạc, người chơi bass đã đánh nốt gốc. Nếu piano và guitar cũng đánh nốt gốc thì âm thanh bị lặp, nặng nề. Vì thế piano nên đánh nốt định hướng, phần cho biết tính chất hợp âm. Nghe thử: chỉ nốt gốc G rồi C thì chưa rõ gì, thêm nốt định hướng vào thì nghe ngay G7 về Cmaj7.", "keys": ["F3", "B3"], "compare": {"a": {"label": "Chỉ nốt gốc", "play": [["G2"], ["C3"]]}, "b": {"label": "Có nốt định hướng", "play": [["G2", "F3", "B3"], ["C3", "E3", "B3"]]}}},
      {"text": "Ví dụ: bass đánh C, tay phải piano đánh E–G–B. Riêng tay phải trông như hợp âm Em, nhưng ghép với bass C thì cả ban nhạc vang thành Cmaj7. Bậc 3 (E) và bậc 7 (B) đã đủ cho tai biết đây là Cmaj7.", "show": "Cmaj7", "play": [["C3"], ["E4", "G4", "B4"], ["C3", "E4", "G4", "B4"]]},
      {"text": "Chỉ có nốt gốc thì không biết hợp âm trưởng hay thứ, cũng không biết nó muốn đi đâu. Nốt định hướng của Cmaj7 (E–B) là quãng 5 đúng nên đứng yên được; của C7 (E–Bb) là tritone nên đẩy hợp âm đi tiếp. Chỗ nào có tritone, chỗ đó đặt nốt màu vào.", "compare": {"a": {"label": "Cmaj7", "play": [["C3", "E3", "B3"]]}, "b": {"label": "C7 → F", "play": [["C3", "E3", "Bb3"], "F"]}}},
      {"text": "Với hợp âm át phụ (D7, E7, A7, B7 trong giọng C), tay trái chỉ cần nốt định hướng, ví dụ D7 là F# và C. Tay trái gọn thì còn chỗ cho nốt màu như b9, #9 và cho tay phải chơi giai điệu. Thầy dặn \"tay trái cần tự do hơn\" là vì vậy. Nghe: nốt định hướng D7 → G7 → Cmaj7, mỗi bước chỉ trượt nửa cung hoặc giữ nguyên.", "tip": "Nốt định hướng của hợp âm 7 = bậc 3 của hợp âm trưởng cùng gốc + nốt gốc lùi một cung: D7 có F# (hợp âm D là D F# A) và C (D lùi một cung).", "keys": ["F#3", "C4"], "play": [["F#3", "C4"], ["F3", "B3"], ["E3", "B3"]]}
    ],
    "remember": ["Nốt định hướng = bậc 3 + bậc 7, cho biết tính chất hợp âm.", "Bass lo nốt gốc, piano lo nốt định hướng.", "D7: tay trái chỉ cần F# + C."],
    "items": [{"chord": "D7", "to": "G"}, {"chord": "B7", "to": "Em"}],
    "quiz": [
      {"q": "Nốt định hướng (guide tones) của Cmaj7 là cặp nào?", "choices": ["E và B", "C và G", "C và E", "G và B"], "answer": "E và B", "why": "Bậc 3 của Cmaj7 là E, bậc 7 là B."},
      {"q": "Nốt định hướng của D7 là cặp nào?", "choices": ["F# và C", "D và A", "D và F#", "A và C"], "answer": "F# và C", "why": "D7 = D F# A C: bậc 3 là F#, bậc 7 là C (D lùi một cung), hai nốt tạo thành tritone."}
    ] },

  { "id": "p3-06", "part": 3, "src": "Phildave 3 · Bài 6", "title": "Chỉ một hợp âm có quãng nghịch",
    "teach": [
      {"text": "Quãng nghịch là quãng nghe chọi: quãng 2 thứ (hai phím sát nhau, như B–C) và tritone. Trong 7 hợp âm trong giọng, chỉ hợp âm át 7 có quãng nghịch giữa hai nốt định hướng. Giọng C có G7, giọng D có A7, giọng E có B7.", "tip": "Hợp âm át 7 của một giọng nằm ở bậc 5: từ nốt chủ đếm lên 5 tên nốt (D, E, F#, G, A), nên giọng D có A7.", "show": "A7", "compare": {"a": {"label": "B–C", "play": [["B3", "C4"]]}, "b": {"label": "A7 → D", "play": ["A7", "D"]}}},
      {"text": "Nốt định hướng của 6 hợp âm còn lại đều là quãng thuận: Cmaj7 có E–B, Dm7 có F–C, đều là quãng 5 đúng (tỉ lệ 2:3). Chỉ G7 có B–F, tỉ lệ 32:45. Vì vậy chỉ G7 bứt rứt và đi về C, các hợp âm khác đứng yên được.", "compare": {"a": {"label": "Dm7", "play": ["Dm7"]}, "b": {"label": "G7 → C", "play": ["G7", "C"]}}},
      {"text": "Âm giai (scale) là dãy nốt xếp theo khoảng cách cố định. C trưởng tự nhiên (natural major) là C D E F G A B. C thứ tự nhiên (natural minor) là C D Eb F G Ab Bb.", "tip": "C thứ tự nhiên = C trưởng hạ bậc 3, 6, 7 xuống nửa cung: E, A, B thành Eb, Ab, Bb.", "compare": {"a": {"label": "C trưởng", "play": [["C4"], ["D4"], ["E4"], ["F4"], ["G4"], ["A4"], ["B4"], ["C5"]]}, "b": {"label": "C thứ tự nhiên", "play": [["C4"], ["D4"], ["Eb4"], ["F4"], ["G4"], ["Ab4"], ["Bb4"], ["C5"]]}}},
      {"text": "C thứ hoà âm (harmonic minor) là C thứ tự nhiên nâng bậc 7 lên B: C D Eb F G Ab B. C thứ giai điệu (melodic minor) nâng cả bậc 6 và 7: C D Eb F G A B. Thầy dặn ôn kỹ bốn âm giai này, vì chúng rất quan trọng khi solo.", "compare": {"a": {"label": "Thứ hoà âm", "play": [["C4"], ["D4"], ["Eb4"], ["F4"], ["G4"], ["Ab4"], ["B4"], ["C5"]]}, "b": {"label": "Thứ giai điệu", "play": [["C4"], ["D4"], ["Eb4"], ["F4"], ["G4"], ["A4"], ["B4"], ["C5"]]}}}
    ],
    "remember": ["Quãng nghịch: quãng 2 thứ và tritone.", "Trong 7 hợp âm trong giọng, chỉ hợp âm át 7 có tritone ở nốt định hướng.", "4 âm giai cần thuộc: C trưởng, C thứ tự nhiên, thứ hoà âm, thứ giai điệu."],
    "items": [{"chord": "A7", "to": "D"}, {"chord": "B7", "to": "E"}],
    "quiz": [
      {"q": "Trong giọng D, hợp âm nào có quãng nghịch giữa hai nốt định hướng?", "choices": ["A7", "D", "Em7", "Bm7"], "answer": "A7", "why": "Mỗi giọng chỉ có một hợp âm át 7, nằm ở bậc 5; giọng D đếm D, E, F#, G, A nên là A7 (C# và G là tritone)."},
      {"q": "C thứ hoà âm (harmonic minor) khác C thứ tự nhiên ở đâu?", "choices": ["Bậc 7 nâng lên B", "Bậc 3 nâng lên E", "Bậc 6 hạ xuống Ab", "Bậc 2 hạ xuống Db"], "answer": "Bậc 7 nâng lên B", "why": "Thứ hoà âm giữ nguyên thứ tự nhiên, chỉ nâng bậc 7 từ Bb lên B."}
    ] },

  { "id": "p3-07", "part": 3, "src": "Phildave 3 · Bài 7", "title": "Lực muốn trở về chỗ yên",
    "teach": [
      {"text": "Tritone B–F của G7 tự tìm nốt gần nhất trong âm giai C: B đi lên nửa cung thành C, F đi xuống nửa cung thành E. C và E chính là hai nốt của hợp âm C. Tính chất muốn đi về C này là lực kéo về chủ (dominant motion).", "keys": ["B3", "F4"], "play": [["B3", "F4"], ["C4", "E4"]]},
      {"text": "Thầy ví đây là quy luật tự nhiên của âm giai trưởng, như nước chảy chỗ trũng. Cũng giống hai dây điện chênh điện áp thì có dòng điện chạy giữa chúng. Ta không ép G7 về C; chính tritone tự muốn về.", "show": "G7", "play": ["G7", "C"]},
      {"text": "Lực kéo này lặp lại được: C7 về F, F7 về Bb, Bb7 về Eb, cứ thế theo vòng quãng 5 (C–F–Bb–Eb–Ab–Db–Gb–B). Mỗi bước, nốt gốc đi xuống một quãng 5, giống G7 về C. Nghe chuỗi này, mỗi hợp âm vừa là chỗ đến, vừa là chỗ đi tiếp.", "tip": "Đi xuống một quãng 5 cũng chính là đi lên một quãng 4: C lên F (C, D, E, F), F lên Bb (F, G, A, Bb), chứ không phải B, vì F–B là tritone.", "play": ["C7", "F7", "Bb7", "Eb"]},
      {"text": "Vì thế thầy khuyên luyện mọi thứ theo vòng quãng 5, thay vì C, D, E theo thứ tự phím. Tập như vậy, tay và tai quen với đúng đường đi tự nhiên của hợp âm.", "play": ["D7", "G7", "C"]}
    ],
    "remember": ["B lên C, F xuống E: tritone của G7 tự đi về C.", "Lực kéo về chủ (dominant motion) lặp lại theo vòng quãng 5: C7 → F7 → Bb7 → Eb."],
    "items": [{"chord": "C7", "to": "F"}, {"chord": "F7", "to": "Bb"}, {"chord": "Bb7", "to": "Eb"}],
    "quiz": [
      {"q": "Khi G7 về C, nốt B của G7 đi đâu?", "choices": ["Lên C", "Xuống A", "Lên D", "Xuống G"], "answer": "Lên C", "why": "B thấp hơn C nửa cung nên đi lên C, còn F đi xuống E."},
      {"q": "Trong vòng quãng 5 C–F–Bb–…, hợp âm tiếp theo sau Bb là gì?", "choices": ["Eb", "C", "F", "D"], "answer": "Eb", "why": "Mỗi bước đi xuống một quãng 5: từ Bb đếm xuống 5 tên nốt (Bb, A, G, F, Eb) là Eb."}
    ] },

  { "id": "p3-08", "part": 3, "src": "Phildave 3 · Bài 8", "title": "Thoát nhạc thiếu nhi nhờ hợp âm át 7",
    "teach": [
      {"text": "Vòng Cmaj7 – Am7 – Dm7 – G7 chỉ dùng hợp âm trong giọng C, nên nghe đơn giản, như nhạc thiếu nhi. Nó không sai, nhưng thiếu lực đẩy, vì cả vòng chỉ có một chỗ có tritone là G7.", "play": ["Cmaj7", "Am7", "Dm7", "G7", "Cmaj7"]},
      {"text": "Giờ đổi Am7 thành A7: tritone xuất hiện (C# và G), nên A7 bắt buộc đi xuống quãng 5 về Dm7. Am7 thì tự do, đi đâu cũng được, còn A7 thì phải về Dm7. Đó là sức mạnh của hợp âm át phụ.", "tip": "Đổi Am7 (A C E G) thành A7 chỉ cần nâng C lên C#: đúng bậc 3 của hợp âm trưởng A, còn G là A lùi một cung.", "show": "A7", "compare": {"a": {"label": "Có Am7", "play": ["Cmaj7", "Am7", "Dm7"]}, "b": {"label": "Có A7", "play": ["Cmaj7", "A7", "Dm7"]}}},
      {"text": "Tương tự, đổi Dm7 thành D7 thì D7 kéo về G7. Vòng mới Cmaj7 – A7 – D7 – G7 có ba \"mẹ\" liền nhau kéo nhau về Cmaj7, nghe hết \"thiếu nhi\". Nhưng đừng đổi mọi chỗ thành hợp âm át 7; bài 10 sẽ nói vì sao.", "compare": {"a": {"label": "Vòng gốc", "play": ["Cmaj7", "Am7", "Dm7", "G7", "Cmaj7"]}, "b": {"label": "Vòng mới", "play": ["Cmaj7", "A7", "D7", "G7", "Cmaj7"]}}},
      {"text": "Bước tiếp theo là thêm nốt màu, nhưng chỉ thêm vào chỗ là hợp âm át 7. Ví dụ A7 thêm b9 thành A7(b9) để về Dm7. Không thêm màu biến đổi vào Cmaj7 hay Dm7, vì chúng không có tritone.", "show": "A7(b9)", "play": ["Cmaj7", "A7(b9)", "Dm7"]}
    ],
    "remember": ["Am7 thì tự do, A7 thì bắt buộc về Dm7.", "Đổi hợp âm thành hợp âm át 7 để có lực đẩy, rồi chỉ thêm nốt màu vào chỗ hợp âm át 7."],
    "items": [{"chord": "A7(b9)", "to": "Dm7"}, {"chord": "D7", "to": "G7"}],
    "quiz": [
      {"q": "Trong vòng Cmaj7 – A7 – Dm7, chỗ nào được thêm màu biến đổi như b9?", "choices": ["A7", "Cmaj7", "Dm7", "Không chỗ nào"], "answer": "A7", "why": "A7 là hợp âm át 7 có tritone; Cmaj7 và Dm7 không có tritone."}
    ] },

  { "id": "p3-09", "part": 3, "src": "Phildave 3 · Bài 9", "title": "Mỗi hợp âm có một \"mẹ\" riêng",
    "teach": [
      {"text": "Trong giọng C, mỗi hợp âm trưởng hoặc thứ đều có một hợp âm át 7 riêng, nốt gốc cao hơn nó một quãng 5. G7 → Cmaj7, A7 → Dm7, B7 → Em7. Tiếp theo là C7 → Fmaj7, D7 → G7, E7 → Am7.", "tip": "Tìm \"mẹ\": từ nốt gốc của hợp âm đích đếm lên 5 tên nốt; ví dụ Em7: E, F, G, A, B, nên \"mẹ\" là B7.", "show": "B7", "play": ["B7", "Em7", "E7", "Am7"]},
      {"text": "Riêng Bm7b5 thì không có \"mẹ\" riêng. Nó là hợp âm nửa giảm (m7b5): hợp âm m7 có nốt 5 bị hạ nửa cung (Bm7 có F#, Bm7b5 có F), nên không vững, không làm chỗ dừng được.", "tip": "Bm7b5 chỉ gồm phím trắng: bấm B rồi cứ cách một phím bấm một phím (B, D, F, A).", "show": "Bm7b5", "compare": {"a": {"label": "Bm7 (có F#)", "play": ["Bm7"]}, "b": {"label": "Bm7b5 (có F)", "play": ["Bm7b5"]}}},
      {"text": "Cách dùng: viết ra các hợp âm trong giọng của bài, rồi đặt \"mẹ\" riêng ngay trước từng hợp âm. Ví dụ C – Dm7 – G7 – C thành C – A7 – Dm7 – G7 – C. Thầy chơi bài ứng dụng hai lần: lần 1 chỉ hợp âm trong giọng, lần 2 thêm hợp âm át phụ, và lực hoà âm tăng lên rõ rệt.", "compare": {"a": {"label": "Lần 1", "play": ["C", "Dm7", "G7", "C"]}, "b": {"label": "Lần 2", "play": ["C", "A7", "Dm7", "G7", "C"]}}},
      {"text": "Phải thuộc hợp âm trong giọng của các giọng hay gặp: C, D, E, F, G, A. Trong giọng trưởng, bậc I, IV, V là trưởng; II, III, VI là thứ; VII là m7b5. Ví dụ giọng D: D, Em, F#m, G, A, Bm, C#m7b5.", "play": ["D", "Em", "F#m", "G", "A", "Bm", "C#m7b5"]},
      {"text": "Thầy gợi ý đi xa hơn với \"mẹ\": thêm b9 cho A7 thành A7(b9), về Dm7 nghe căng và đẹp hơn. Màu biến đổi hợp ở đây vì A7 có tritone.", "show": "A7(b9)", "compare": {"a": {"label": "A7 → Dm7", "play": ["A7", "Dm7"]}, "b": {"label": "A7(b9) → Dm7", "play": ["A7(b9)", "Dm7"]}}}
    ],
    "remember": ["Mỗi hợp âm trưởng hoặc thứ có một \"mẹ\" cao hơn nó một quãng 5 (Em7: đếm E, F, G, A, B, \"mẹ\" là B7).", "Bm7b5 không có \"mẹ\" riêng.", "Giọng trưởng: I, IV, V trưởng; II, III, VI thứ; VII m7b5."],
    "items": [{"chord": "B7", "to": "Em7"}, {"chord": "C7", "to": "Fmaj7"}, {"chord": "E7", "to": "Am7"}],
    "quiz": [
      {"q": "Hợp âm nào trong giọng C không có \"mẹ\" riêng?", "choices": ["Bm7b5", "Dm7", "Em7", "Fmaj7"], "answer": "Bm7b5", "why": "Bm7b5 có nốt 5 bị hạ nên không vững, không làm đích, vì vậy không có hợp âm át 7 riêng."},
      {"q": "Hợp âm bậc III của giọng D là gì?", "choices": ["F#m", "F#", "Em", "G"], "answer": "F#m", "why": "Giọng D: D, Em, F#m, G, A, Bm, C#m7b5; bậc III là F#m."}
    ] },

  { "id": "p3-10", "part": 3, "src": "Phildave 3 · Bài 10", "title": "Hợp âm đi qua và hợp âm át 7",
    "teach": [
      {"text": "Hợp âm có bass riêng là hợp âm mà tay trái bấm một nốt khác nốt gốc, ghi bằng dấu gạch chéo. Ví dụ G/B là hợp âm G, nhưng bass là B. Nhờ đổi bass, đường bass đi xuống từng bậc rất mượt.", "show": "G/B", "compare": {"a": {"label": "G → Am7", "play": ["G", "Am7"]}, "b": {"label": "G/B → Am7", "play": ["G/B", "Am7"]}}},
      {"text": "Tiến hành này rất hay gặp trong thánh ca Hàn: Cmaj7 – G/B – Am7 – C/G – Fmaj7 – C/E – Dm7 – G7. Bass đi xuống từng bậc C, B, A, G, F, E, D. Các hợp âm có dấu gạch chéo là hợp âm đi qua (passing chord), nối hai hợp âm chính.", "play": ["Cmaj7", "G/B", "Am7", "C/G", "Fmaj7", "C/E", "Dm7", "G7"]},
      {"text": "Có thể đổi hợp âm đi qua thành hợp âm át phụ mà vẫn giữ nguyên bass: G/B thành E7/B, C/G thành C7/G, C/E thành A7/E. Vì sao được? E7 kéo về Am7, C7 kéo về Fmaj7, A7 kéo về Dm7, đúng hợp âm đứng ngay sau. Bass vẫn đi xuống từng bậc, mà hoà âm có thêm lực đẩy.", "tip": "Hợp âm át phụ thay vào phải chứa sẵn nốt bass: E7 = E G# B D có B, nên viết được E7/B.", "show": "E7/B", "compare": {"a": {"label": "Bản gốc", "play": ["Cmaj7", "G/B", "Am7", "C/G", "Fmaj7"]}, "b": {"label": "Đổi thành át phụ", "play": ["Cmaj7", "E7/B", "Am7", "C7/G", "Fmaj7"]}}},
      {"text": "Phải chơi bản gốc trước thì mới cảm được chỗ biến hoá. Chỗ nào cũng đổi thành hợp âm át 7 thì không hay nữa, vì cái hay nằm ở chỗ khác với bản gốc.", "play": ["Cmaj7", "G/B", "Am7", "C7/G", "Fmaj7"]},
      {"text": "Thế bấm (voicing) là cách chia các nốt của hợp âm cho hai tay. Ở hợp âm có bass riêng, tay trái lo nốt bass, tay phải lo hợp âm phía trên, hai tay không bấm trùng nốt cho gọn. Hợp âm đi qua chỉ lướt nhanh, nên thầy dặn không cần nhồi nốt màu vào.", "show": "C7/G", "play": ["C7/G", "Fmaj7"]}
    ],
    "remember": ["Hợp âm có bass riêng (G/B, C/E) giúp bass đi xuống từng bậc.", "Đổi hợp âm đi qua thành át phụ, giữ bass: G/B → E7/B, C/G → C7/G, C/E → A7/E."],
    "items": [{"chord": "E7/B", "to": "Am7"}, {"chord": "C7/G", "to": "Fmaj7"}, {"chord": "A7/E", "to": "Dm7"}],
    "quiz": [
      {"q": "Muốn đổi G/B (đứng trước Am7) thành hợp âm át phụ mà vẫn giữ bass B, ta dùng hợp âm nào?", "choices": ["E7/B", "G7/B", "B7", "D7/A"], "answer": "E7/B", "why": "E7 là \"mẹ\" của Am7, và B là một nốt của E7 nên giữ được bass B."}
    ] },

  { "id": "p3-11", "part": 3, "src": "Phildave 3 · Bài 11", "title": "Hợp âm thay thế",
    "teach": [
      {"text": "Hợp âm thay thế (substitute) là hợp âm đặt vào chỗ hợp âm khác mà vẫn hợp lý, vì cấu tạo giống nhau hoặc chung nhiều nốt. Ví dụ C (C–E–G) và Am (A–C–E) chung hai nốt C và E. Với hợp âm 4 nốt, Cmaj7 (C–E–G–B) và Am7 (A–C–E–G) chung tới ba nốt.", "show": "Am7", "compare": {"a": {"label": "Cmaj7", "play": ["Cmaj7"]}, "b": {"label": "Am7", "play": ["Am7"]}}},
      {"text": "Cách nhận quãng 3: quãng 3 trưởng rộng hai cung, như C–E; quãng 3 thứ hẹp hơn quãng 3 trưởng nửa cung, như C–Eb hay B–D. Hợp âm bốn nốt (maj7, m7, hợp âm 7) đều là các quãng 3 xếp chồng, nên hai hợp âm có nốt gốc cách nhau một quãng 3 (như C và A) thường chung nhiều nốt.", "tip": "Trên phím trắng, cứ cách một phím bấm một phím là xếp chồng quãng 3: Am7 = A C E G, Cmaj7 = C E G B, chung ba nốt C, E, G.", "keys": ["C4", "E4"], "play": [["C4", "E4"], ["C4", "Eb4"], ["B3", "D4"]]},
      {"text": "Trong giọng C có ba nhóm thay thế: Cmaj7 thay bằng Am7 hoặc Em7; Fmaj7 thay bằng Dm7; G7 thay bằng Bm7b5. Mỗi cặp chung ba nốt, nên tai vẫn nghe như cùng một vai trò.", "show": "Dm7", "compare": {"a": {"label": "Fmaj7", "play": ["Fmaj7"]}, "b": {"label": "Dm7", "play": ["Dm7"]}}},
      {"text": "Vòng quay lại (turnaround) là vòng 1–6–2–5: Cmaj7 – Am7 – Dm7 – G7, lặp đi lặp lại, rất hay gặp trong jazz. Lần lặp thứ hai, thay Cmaj7 bằng Em7. Chọn Em7 chứ không chọn Am7, vì ngay sau đã là Am7; bài vẫn là bài cũ mà nghe có biến hoá.", "compare": {"a": {"label": "Lần 1", "play": ["Cmaj7", "Am7", "Dm7", "G7"]}, "b": {"label": "Lần 2", "play": ["Em7", "Am7", "Dm7", "G7"]}}}
    ],
    "remember": ["Hợp âm thay thế chung nhiều nốt với hợp âm gốc.", "Cmaj7 ↔ Am7, Em7; Fmaj7 ↔ Dm7; G7 ↔ Bm7b5.", "Vòng quay lại (turnaround): Cmaj7 – Am7 – Dm7 – G7."],
    "items": [{"chord": "Em7", "to": "Cmaj7", "rel": "sub"}, {"chord": "Am7", "to": "Cmaj7", "rel": "sub"}, {"chord": "Dm7", "to": "Fmaj7", "rel": "sub"}],
    "quiz": [
      {"q": "Lần lặp thứ hai của vòng quay lại, vì sao thay Cmaj7 bằng Em7 mà không bằng Am7?", "choices": ["Vì ngay sau đã là Am7", "Vì Em7 không chung nốt nào với Cmaj7", "Vì Em7 là hợp âm át 7", "Vì Am7 không có trong giọng C"], "answer": "Vì ngay sau đã là Am7", "why": "Dùng Am7 thì hai ô nhịp liền nhau cùng một hợp âm; Em7 cũng chung ba nốt với Cmaj7 mà tạo được biến hoá."}
    ] },

  { "id": "p3-12", "part": 3, "src": "Phildave 3 · Bài 12", "title": "Cmaj7, Fmaj7, G7: chuẩn để thay thế",
    "teach": [
      {"text": "Bậc I, IV, V (Cmaj7, Fmaj7, G7) là ba hợp âm chuẩn để thay: Cmaj7 thay bằng Em7 hoặc Am7, Fmaj7 thay bằng Dm7, G7 thay bằng Bm7b5. G7 và Bm7b5 chung ba nốt B, D, F, nên Bm7b5 giữ được cả tritone B–F. Vì thế Bm7b5 cũng kéo về C.", "show": "Bm7b5", "compare": {"a": {"label": "G7 → C", "play": ["G7", "C"]}, "b": {"label": "Bm7b5 → C", "play": ["Bm7b5", "C"]}}},
      {"text": "Vòng quay lại lần 2: đổi Cmaj7 thành Em7, rồi đổi Am7 thành hợp âm át phụ A7. Ta được Em7 – A7 – Dm7 – G7, đa dạng hơn hẳn. Nhưng trước khi biến hoá, phải kiểm tra hợp âm gốc đã đúng chưa.", "compare": {"a": {"label": "Vòng gốc", "play": ["Cmaj7", "Am7", "Dm7", "G7"]}, "b": {"label": "Vòng biến hoá", "play": ["Em7", "A7", "Dm7", "G7"]}}},
      {"text": "Hợp âm át 7 mở rộng (extended dominant) là một chuỗi \"mẹ\" nối nhau, mỗi hợp âm vừa là đích của hợp âm trước vừa là \"mẹ\" của hợp âm sau (như B7 → E7 → A7 → D7). Khi đệm thật, thầy chỉ cho tối đa hai lần biến hoá liên tiếp: ví dụ Cmaj7 – A7 – D7 – G7 – C, thì A7 và D7 là hai chỗ biến hoá, còn G7 vốn có sẵn trong giọng.", "play": ["Cmaj7", "A7", "D7", "G7", "C"]},
      {"text": "B7 nghe rất \"khé chát\", vì có tới hai nốt ngoài giọng C (D# và F#), trong khi A7, D7, E7 chỉ có một. Vì thế sau B7 nên về một hợp âm cơ bản (Em7) rồi mới đi tiếp sang A7.", "tip": "Đếm phím đen: B7 = B D# F# A có hai phím đen (D#, F#), còn A7 = A C# E G chỉ có một (C#).", "show": "B7", "play": ["B7", "Em7", "A7", "Dm7"]}
    ],
    "remember": ["Cmaj7 → Em7 hoặc Am7, Fmaj7 → Dm7, G7 → Bm7b5.", "Chuỗi \"mẹ\" nối nhau (A7 → D7 → G7): tối đa hai lần biến hoá liên tiếp.", "Sau B7 nên về Em7 rồi mới đi tiếp."],
    "items": [{"chord": "Bm7b5", "to": "G7", "rel": "sub"}, {"chord": "A7", "to": "D7"}, {"chord": "B7", "to": "Em7"}],
    "quiz": [
      {"q": "Vì sao Bm7b5 thay được G7?", "choices": ["Chung ba nốt B, D, F, giữ cả tritone", "Vì cùng nốt gốc G", "Vì Bm7b5 là hợp âm trưởng", "Vì Bm7b5 không có tritone"], "answer": "Chung ba nốt B, D, F, giữ cả tritone", "why": "G7 = G B D F, Bm7b5 = B D F A: chung B, D, F, trong đó có tritone B–F."},
      {"q": "Vì sao B7 nghe khé hơn A7 trong giọng C?", "choices": ["B7 có hai nốt ngoài giọng (D#, F#)", "B7 không có tritone", "B7 là hợp âm thứ", "B7 có nốt gốc là phím đen"], "answer": "B7 có hai nốt ngoài giọng (D#, F#)", "why": "A7 chỉ có một nốt ngoài giọng C (C#), còn B7 có tới hai."}
    ] },

  { "id": "p3-13", "part": 3, "src": "Phildave 3 · Bài 13", "title": "Cơ bản trước, biến hoá sau",
    "teach": [
      {"text": "Hợp âm trong giọng là phần cơ bản, hợp âm át phụ là phần biến hoá. Chỉ dùng nốt của âm giai C trưởng thì dù hay đến đâu vẫn nghe như nhạc thiếu nhi. Nốt ngoài âm giai chính là thứ tạo màu \"biến hoá\".", "compare": {"a": {"label": "Cơ bản", "play": ["C", "Am7", "Dm7", "G7", "C"]}, "b": {"label": "Biến hoá", "play": ["C", "A7", "Dm7", "G7", "C"]}}},
      {"text": "Mỗi hợp âm át phụ thêm một nốt ngoài âm giai: C7 có Bb, D7 có F#, E7 có G#, A7 có C#. Riêng B7 có tới hai (D#, F#) nên khé hơn.", "show": "E7", "play": ["E7", "Am7"]},
      {"text": "Nốt màu cơ bản của G7 trong giọng C là 9 và 13 (ưu tiên số 1), vì A và E vẫn nằm trong âm giai C. Màu biến đổi b9, b13 là biến hoá (ưu tiên số 2). Hãy chơi quen dạng cơ bản trước rồi mới biến hoá, thì màu biến hoá mới hợp.", "tip": "Nốt 9 của G7 là A (G lên một cung), nốt 13 là E (nốt 5 là D, lên một cung); cả hai đều là phím trắng nên nằm trong âm giai C.", "show": "G13", "compare": {"a": {"label": "Ưu tiên 1: G7(9 13) → C", "play": ["G13", "C"]}, "b": {"label": "Ưu tiên 2: G7(b9 b13) → C", "play": ["G7(b9 b13)", "C"]}}},
      {"text": "Ở chỗ E7 (trước Am), có nhiều lựa chọn: E7 không thêm màu, hoặc E7 thêm màu biến đổi như b9, #9, b13. Màu biến đổi hợp ở đây vì E7 đi về hợp âm thứ Am.", "show": "E7(b9)", "compare": {"a": {"label": "E7 → Am", "play": ["E7", "Am"]}, "b": {"label": "E7(b9) → Am", "play": ["E7(b9)", "Am"]}}},
      {"text": "Bài tập ở giọng D: hợp âm trong giọng là D, Em, F#m, G, A, Bm, C#m7b5. \"Mẹ\" dẫn vào từng hợp âm: A7 → D, B7 → Em, C#7 → F#m, D7 → G, E7 → A, F#7 → Bm. Thầy nhấn mạnh đây là nền tảng cực kỳ quan trọng.", "play": ["A7", "D", "F#7", "Bm"]}
    ],
    "remember": ["Hợp âm trong giọng là cơ bản, hợp âm át phụ là biến hoá.", "G7 trong giọng C: màu cơ bản là 9 và 13 (ưu tiên 1); b9, b13 là biến hoá (ưu tiên 2).", "E7 về Am hợp với màu biến đổi (b9, #9, b13)."],
    "items": [{"chord": "G13", "to": "C"}, {"chord": "E7(b9)", "to": "Am"}, {"chord": "F#7", "to": "Bm"}],
    "quiz": [
      {"q": "Nốt nào của A7 nằm ngoài âm giai C?", "choices": ["C#", "F#", "G#", "Bb"], "answer": "C#", "why": "A7 = A C# E G; chỉ C# không có trong âm giai C."},
      {"q": "Trong giọng D, \"mẹ\" dẫn vào F#m là hợp âm nào?", "choices": ["C#7", "F#7", "A7", "B7"], "answer": "C#7", "why": "Từ F# đếm lên 5 tên nốt: F#, G#, A, B, C#, nên C#7 kéo về F#m."}
    ] },

  { "id": "p3-14", "part": 3, "src": "Phildave 3 · Bài 14", "title": "Màu biến đổi chỉ dành cho hợp âm át 7",
    "teach": [
      {"text": "Đây là nguyên lý quan trọng nhất của Tension Mastering: làm đẹp hợp âm bằng cách thêm # hoặc b vào nốt màu 9, 11, 13. Việc này chỉ làm được trên hợp âm át 7, kể cả hợp âm át phụ. Cmaj7, Cm7, Am7, Em7 thì không thêm #, b cho 9, 11, 13 được.", "show": "E7(b9)", "compare": {"a": {"label": "E7(b9) → Am7", "play": ["E7(b9)", "Am7"]}, "b": {"label": "Am7", "play": ["Am7"]}}},
      {"text": "Vì sao? Nốt định hướng của Cmaj7 và Cm7 là quãng 5 đúng (2:3), rất ổn định. C7 có E–Bb là tritone, vốn đã bất ổn, nên thêm màu biến đổi vào thì vẫn hợp.", "compare": {"a": {"label": "Cmaj7", "play": ["Cmaj7"]}, "b": {"label": "C7 → F", "play": ["C7", "F"]}}},
      {"text": "Nốt màu là tiếp tục xếp chồng quãng 3 lên trên quãng 8: 9, 11, 13. Trên hợp âm át 7, nốt 9 có ba dạng (9, b9, #9), nốt 11 có một dạng (#11), nốt 13 có hai dạng (13, b13). Trên C7, nốt 11 tự nhiên là F, chỉ cao hơn bậc 3 (E) nửa cung; dù đặt F cao lên một quãng 8 (E ở dưới, F ở trên, gọi là quãng 9 thứ), hai nốt vẫn chọi nhau. Vì vậy trên hợp âm át 7 thường dùng #11.", "tip": "Nốt 11 = nốt thứ 4 tính từ nốt gốc, đặt cao một quãng 8 (C7: F); #11 là nốt đó nâng lên nửa cung (F#).", "keys": ["E3", "F4"], "compare": {"a": {"label": "C7 + 11 (chói)", "play": [["C3", "E3", "Bb3", "F4"]]}, "b": {"label": "C7 + #11", "play": [["C3", "E3", "Bb3", "F#4"]]}}},
      {"text": "Ví dụ trong giọng C: C7(9 13), G7(9 13) và D7(9 #11) đi về hợp âm trưởng, dùng 9, 13 tự nhiên (D7 thì thêm #11, dạng dùng được của nốt 11 như màn trên); E7(#9 b13), A7(b9 b13), B7(b9 b13) dùng màu biến đổi. Để ý nhóm sau đều là \"mẹ\" của hợp âm thứ: Am, Dm, Em.", "compare": {"a": {"label": "C13 → Fmaj7", "play": ["C13", "Fmaj7"]}, "b": {"label": "E7(#9 b13) → Am7", "play": ["E7(#9 b13)", "Am7"]}}},
      {"text": "Mode là âm giai bắt đầu từ từng bậc của âm giai trưởng (Ionian từ bậc 1, rồi Dorian, Phrygian, Lydian, Mixolydian, Aeolian, đến Locrian từ bậc 7). Mixolydian (mode 5) chỉ khác âm giai trưởng ở bậc 7 hạ nửa cung, nên hợp với hợp âm át 7.", "tip": "G mixolydian chính là các phím trắng từ G lên G: G A B C D E F G.", "play": [["G3"], ["A3"], ["B3"], ["C4"], ["D4"], ["E4"], ["F4"], ["G4"]]},
      {"text": "Riêng cho hợp âm át 7, jazz dùng 3 âm giai chính: altered (phát triển từ Locrian), lydian dominant (Lydian có thêm b7) và mixolydian. Ba âm giai này là chủ đề của ba bài kế tiếp.", "compare": {"a": {"label": "Altered: E7(b9 b13)", "play": ["E7(b9 b13)", "Am7"]}, "b": {"label": "Mixolydian: G13", "play": ["G13", "C"]}}}

  { "id": "p3-15", "part": 3, "src": "Phildave 3 · Bài 15", "title": "Altered scale",

      {"text": "Altered là âm giai cho tiếng \"jazz\" nhất. C altered gồm 1, b2 (b9), #2 (#9), 3, #4 (#11), #5 (b13), b7. Nghĩa là mọi nốt màu đều bị biến đổi, chỉ còn gốc, bậc 3 và bậc 7 giữ nguyên để vẫn là C7.", "tip": "Cách nhớ: altered giữ ba nốt của C7 là C, E, Bb, còn lại đều là nốt màu biến đổi: Db (b9), D# (#9), F# (#11), G# (b13).", "play": [["C4"], ["Db4"], ["D#4"], ["E4"], ["F#4"], ["G#4"], ["Bb4"], ["C5"]]},
      {"text": "Thầy dùng hai bộ màu cơ bản: bộ 1 là #9 + b13, bộ 2 là b9 + b13. Tay trái bấm hợp âm 7, tay phải bấm bộ màu. Ví dụ trên E7: bộ 1 là G (#9) + C (b13), bộ 2 là F (b9) + C (b13).", "show": "E7(#9 b13)", "compare": {"a": {"label": "Bộ 1", "play": ["E7(#9 b13)", "Am7"]}, "b": {"label": "Bộ 2", "play": ["E7(b9 b13)", "Am7"]}}},
      {"text": "Trong giọng C, altered hợp nhất với E7, A7, B7, vì chúng là \"mẹ\" của các hợp âm thứ: E7 → Am, A7 → Dm, B7 → Em. Không cần lúc nào cũng đổi qua lại hai bộ; dùng luôn một bộ (ví dụ bộ 2: b9 + b13) cũng được.", "show": "A7(b9 b13)", "play": ["A7(b9 b13)", "Dm7"]},
      {"text": "Nốt nên tránh (avoid note) là nốt nghe chọi với hợp âm, khi chơi nên bỏ đi. Altered không có nốt nên tránh, nên chơi kiểu nào cũng hợp. Muốn tìm nhanh altered, phải thuộc âm giai trưởng của từng nốt gốc (E trưởng, A trưởng), rồi biến đổi các nốt màu.", "show": "B7(#9 b13)", "play": ["B7(#9 b13)", "Em7"]}

      {"text": "G lydian dominant là G A B C# D E F. Đặt hợp âm A (A–C#–E) ở tay phải lên G7 ở tay trái, ta có đủ 9 (A), #11 (C#), 13 (E). Một hợp âm ba nốt tay phải đặt lên hợp âm 7 như vậy gọi là hợp âm ba nốt phía trên (upper structure): màu đẹp mà dễ tìm.", "tip": "Hợp âm ba nốt tay phải là hợp âm trưởng cao hơn nốt gốc một cung: G lên một cung là A, nên đặt hợp âm A lên G7.", "show": "G13(#11)", "play": ["G13(#11)", "C"]},
      {"text": "Altered cũng có #11, nhưng khi #11 đi cùng 9 và 13 tự nhiên thì gọi là lydian dominant. Nói gọn: altered biến đổi cả 9 và 13, còn lydian dominant giữ 9 và 13 tự nhiên.", "compare": {"a": {"label": "Altered: E7(#9 b13)", "play": ["E7(#9 b13)", "Am7"]}, "b": {"label": "Lydian dominant: D13(#11)", "play": ["D13(#11)", "G"]}}},
      {"text": "Lydian dominant dùng cho hợp âm át 7 đi về hợp âm trưởng, như G7 → C, D7 → G, C7 → F. Hợp âm át 7 đi về hợp âm thứ (E7, A7, B7) thì dùng altered. Hai loại nốt màu khác nhau vì đích khác nhau: trưởng hay thứ.", "compare": {"a": {"label": "D13(#11) → G7", "play": ["D13(#11)", "G7"]}, "b": {"label": "A7(b9 b13) → Dm", "play": ["A7(b9 b13)", "Dm"]}}}

    "teach": [
      {"text": "Bài giọng thứ mà chỉ dùng hợp âm thứ thì nặng nề. Ngược lại, trong bài giọng trưởng, thoáng một chút màu thứ lại rất cuốn hút. Bài C trưởng hay lấy hợp âm của C thứ: cùng nốt gốc C, không phải Am.", "compare": {"a": {"label": "Fmaj7 → Cmaj7", "play": ["Fmaj7", "Cmaj7"]}, "b": {"label": "Fmaj7 → Fm7 → Cmaj7", "play": ["Fmaj7", "Fm7", "Cmaj7"]}}},
      {"text": "Hợp âm mượn (modal interchange; thầy gọi là \"mix\") là hợp âm của giọng thứ cùng tên, đem dùng trong bài giọng trưởng. Từ C thứ tự nhiên hay mượn Dm7b5, Ebmaj7, Fm7, Abmaj7, Bb7; G7 thì vừa có trong C trưởng, vừa là bậc V của C thứ hoà âm. Nghe Fmaj7 – Fm7 – Cmaj7: Fm7 là hợp âm mượn, tạo câu kết \"A-men\" (kiểu kết IV – I cuối bài thánh ca) rất ấm.", "tip": "Hợp âm mượn từ C thứ dễ nhận: có nốt Eb, Ab hoặc Bb, ví dụ Fm7 = F Ab C Eb.", "show": "Fm7", "play": ["Fmaj7", "Fm7", "Cmaj7"]},
      {"text": "Một vài tiến hành mẫu: C – Abmaj7 – Bb7 – C, hay C – Ebmaj7 – Dm7 – C. Vì sao trong giọng C lại có Abmaj7, Bb7? Vì chúng là hợp âm trong giọng của C thứ tự nhiên.", "compare": {"a": {"label": "C – Abmaj7 – Bb7 – C", "play": ["C", "Abmaj7", "Bb7", "C"]}, "b": {"label": "C – Ebmaj7 – Dm7 – C", "play": ["C", "Ebmaj7", "Dm7", "C"]}}},
      {"text": "Chơi các nốt C thứ giai điệu (C D Eb F G A B) bắt đầu từ F, ta được đúng F lydian dominant; bắt đầu từ B, ta được B altered. Đó là hai âm giai đã học ở bài 15 và 16, và F7, Bm7b5 là hai hợp âm dựng từ đó.", "show": "F7", "compare": {"a": {"label": "F7", "play": ["F7"]}, "b": {"label": "Bm7b5", "play": ["Bm7b5"]}}},
      {"text": "Thầy nhấn mạnh: hợp âm trong giọng của trưởng tự nhiên và thứ tự nhiên trộn với nhau là cách dùng nhiều nhất trong thực tế. Có cả đoạn dài chỉ có một hợp âm át 7 là G7, còn lại toàn hợp âm trộn, mà vẫn rất đẹp. Dm7b5 là hợp âm bậc II của C thứ, nên đứng trước G7 nó dẫn vào G7 rất tự nhiên (bài 20 và 25 sẽ nói kỹ hơn). Thử nghe Dm7b5 – G7 – Cmaj7, rồi cho G7 thêm b9, b13 (lấy từ C thứ): nhìn nốt màu là biết hợp âm mượn từ âm giai nào.", "compare": {"a": {"label": "Dm7b5 – G7 – Cmaj7", "play": ["Dm7b5", "G7", "Cmaj7"]}, "b": {"label": "Dm7b5 – G7(b9 b13) – Cmaj7", "play": ["Dm7b5", "G7(b9 b13)", "Cmaj7"]}}}
    ],
    "remember": ["Hợp âm mượn: lấy hợp âm của C thứ dùng trong bài C trưởng.", "Hay mượn: Dm7b5, Ebmaj7, Fm7, Abmaj7, Bb7 (và G7).", "Fmaj7 – Fm7 – Cmaj7: câu kết \"Amen\"."],
    "items": [{"chord": "Dm7b5", "to": "G7"}, {"chord": "G7(b9 b13)", "to": "Cmaj7"}],
    "quiz": [
      {"q": "Vì sao trong bài giọng C lại có Abmaj7 và Bb7?", "choices": ["Vì chúng là hợp âm trong giọng của C thứ tự nhiên", "Vì chúng là \"mẹ\" của C", "Vì chúng thuộc âm giai C trưởng", "Vì chúng là hợp âm thay thế của G7"], "answer": "Vì chúng là hợp âm trong giọng của C thứ tự nhiên", "why": "C thứ tự nhiên có Ab và Bb, nên Abmaj7 và Bb7 là hợp âm của C thứ, được mượn sang C trưởng."}
    ] },

  { "id": "p3-20", "part": 3, "src": "Phildave 3 · Bài 20", "title": "Hợp âm thay thế trong giọng thứ",
    "teach": [
      {"text": "Ôn lại: giọng C trưởng có ba nhóm thay thế (Cmaj7 với Am7, Em7; Fmaj7 với Dm7; G7 với Bm7b5). Giọng C thứ cũng có một nhóm: Fm7 thay được bằng Dm7b5, Abmaj7 hoặc Bb7.", "play": ["Fm7", "Dm7b5", "Abmaj7", "Bb7"]},
      {"text": "Vì sao bốn hợp âm này thay được cho nhau? Cả bốn đều chứa nốt Ab: Ab là bậc 3 của Fm7, bậc 5 của Dm7b5, nốt gốc của Abmaj7 và bậc 7 của Bb7. Ngoài Ab, mỗi hợp âm còn chung ít nhất một nốt nữa với Fm7.", "keys": ["Ab4"], "compare": {"a": {"label": "Fm7", "play": ["Fm7"]}, "b": {"label": "Bb7", "play": ["Bb7"]}}},
      {"text": "Mô hình Fm7 – G7 – Cm7 có 4 lựa chọn ở chỗ đầu: Fm7, Dm7b5, Abmaj7, Bb7. Chọn hợp âm nào thì G7 vẫn kéo về Cm7 như cũ, chỉ màu sắc trước đó thay đổi.", "compare": {"a": {"label": "Fm7 – G7 – Cm7", "play": ["Fm7", "G7", "Cm7"]}, "b": {"label": "Abmaj7 – G7 – Cm7", "play": ["Abmaj7", "G7", "Cm7"]}}},
      {"text": "Áp vào bài giọng C: coi mỗi hợp âm thứ (Dm7, Em7, Am7) như một chủ nhỏ (tạm coi như hợp âm chủ trong chốc lát), rồi dùng đúng mô hình đó. Trước Am7 ta có Dm7 – E7 – Am7, Bm7b5 – E7 – Am7, Fmaj7 – E7 – Am7 hay G7 – E7 – Am7. Trước Dm7 cũng vậy: Gm7, Em7b5, Bbmaj7 hoặc C7 rồi tới A7.", "compare": {"a": {"label": "Fmaj7 – E7 – Am7", "play": ["Fmaj7", "E7", "Am7"]}, "b": {"label": "Bm7b5 – E7 – Am7", "play": ["Bm7b5", "E7", "Am7"]}}}
    ],
    "remember": ["Giọng C thứ: Fm7 thay bằng Dm7b5, Abmaj7, Bb7 (cùng có nốt Ab).", "Fm7 – G7 – Cm7: chỗ đầu có 4 lựa chọn."],
    "items": [{"chord": "Dm7b5", "to": "Fm7", "rel": "sub"}, {"chord": "Abmaj7", "to": "Fm7", "rel": "sub"}, {"chord": "Bb7", "to": "Fm7", "rel": "sub"}],
    "quiz": [
      {"q": "Nốt nào có chung trong cả Fm7, Dm7b5, Abmaj7 và Bb7?", "choices": ["Ab", "C", "F", "Eb"], "answer": "Ab", "why": "Ab là bậc 3 của Fm7, bậc 5 của Dm7b5, nốt gốc của Abmaj7, bậc 7 của Bb7."}
    ] },

  { "id": "p3-21", "part": 3, "src": "Phildave 3 · Bài 21", "title": "Nhìn nốt màu là biết hợp âm về đâu",
    "teach": [
      {"text": "G7 có thể về C trưởng hoặc C thứ, và khác nhau ở nốt màu. Về C trưởng, nốt màu lấy từ âm giai C trưởng: 9 (A) và 13 (E), tức mixolydian. Về C thứ, nốt màu lấy từ C thứ hoà âm: b9 (Ab) và b13 (Eb), tức altered.", "compare": {"a": {"label": "G13 → C", "play": ["G13", "C"]}, "b": {"label": "G7(b9 b13) → Cm", "play": ["G7(b9 b13)", "Cm"]}}},
      {"text": "Thầy đánh số các bộ nốt màu của hợp âm át 7: ① mixolydian (9, 13), ② altered b9 + b13, ③ altered #9 + b13 (② chính là bộ 2, ③ là bộ 1 ở bài 15). Bộ ④ (một biến thể cho đích trưởng) và ⑤ (bộ lai b9 + 13) để dành khi đã quen.", "compare": {"a": {"label": "② E7(b9 b13)", "play": ["E7(b9 b13)", "Am7"]}, "b": {"label": "③ E7(#9 b13)", "play": ["E7(#9 b13)", "Am7"]}}},
      {"text": "Quy tắc chọn: hợp âm át 7 về hợp âm trưởng thì chọn ① (hoặc 9, #11, 13 kiểu lydian dominant); về hợp âm thứ thì chọn ② hoặc ③. Ngược lại, nhìn nốt màu là đoán được đích: thấy b9, b13 thì nhiều khả năng đích là hợp âm thứ (về hợp âm trưởng thì đó chỉ là màu biến hoá, ưu tiên 2).", "compare": {"a": {"label": "C13 → Fmaj7", "play": ["C13", "Fmaj7"]}, "b": {"label": "A7(#9 b13) → Dm7", "play": ["A7(#9 b13)", "Dm7"]}}},
      {"text": "Có thể nối các bộ thành một đường nốt ở trên cùng. Chơi ① rồi ③ trên G7, tức G13 rồi G7(#9 b13), thì nốt trên rơi xuống nửa cung (B xuống Bb, E xuống Eb), rất hợp cho đoạn kết về C. Đây là lúc dùng màu biến đổi như một lựa chọn thứ hai khi về hợp âm trưởng.", "play": ["G13", "G7(#9 b13)", "C"]}
    ],
    "remember": ["Về hợp âm trưởng: ① mixolydian (9, 13) hoặc lydian dominant (9, #11, 13).", "Về hợp âm thứ: ② b9 + b13 hoặc ③ #9 + b13 (altered).", "Thấy b9, b13 thì nhiều khả năng đích là hợp âm thứ."],
    "items": [{"chord": "E7(b9 b13)", "to": "Am7"}, {"chord": "G13", "to": "C"}, {"chord": "A7(#9 b13)", "to": "Dm7"}],
    "quiz": [
      {"q": "Thấy E7(b9 b13), bạn đoán hợp âm tiếp theo là gì?", "choices": ["Am", "G", "C", "F"], "answer": "Am", "why": "b9, b13 là màu altered, chủ yếu dùng khi hợp âm át 7 về hợp âm thứ, nên nhiều khả năng E7 về Am."}
    ] },

  { "id": "p3-22", "part": 3, "src": "Phildave 3 · Bài 22", "title": "\"Bạn của mẹ\": hợp âm át thay thế",
    "teach": [
      {"text": "Đến giờ, hợp âm thay thế của G7 là Bm7b5. Giờ có thêm Db7, dù nốt gốc Db không nằm trong giọng C. Db7 cũng về C, nhưng bass trượt xuống nửa cung (Db xuống C) thay vì nhảy quãng 5.", "show": "Db7", "compare": {"a": {"label": "G7 → C", "play": ["G7", "C"]}, "b": {"label": "Db7 → C", "play": ["Db7", "C"]}}},
      {"text": "Vì sao Db7 thay được G7? Hai hợp âm dùng chung một tritone: bậc 3 của Db7 là F (bậc 7 của G7), bậc 7 của Db7 là Cb, tức B (bậc 3 của G7). Cùng tritone nên cùng lực kéo về C.", "keys": ["B3", "F4"], "compare": {"a": {"label": "G + B–F", "play": [["G2", "B3", "F4"], ["C3", "C4", "E4"]]}, "b": {"label": "Db + B–F", "play": [["Db3", "B3", "F4"], ["C3", "C4", "E4"]]}}},
      {"text": "Hợp âm 7 chung tritone với \"mẹ\" và có nốt gốc cao hơn đích nửa cung gọi là hợp âm át thay thế (subV: hợp âm thay cho bậc V), ta gọi vui là \"bạn của mẹ\". G7 và Db7 đều về C. Mẹo tìm: từ nốt gốc của \"mẹ\", đếm một tritone kiểu \"banana\" là ra nốt gốc của \"bạn của mẹ\".", "tip": "Cách nhanh hơn: nốt gốc của \"bạn của mẹ\" là nốt gốc của đích nhích lên nửa cung, đích C thì \"bạn của mẹ\" là Db7.", "play": ["G7", "Db7", "C"]},
      {"text": "Bảng cặp chung tritone: G7 với Db7, C7 với Gb7, D7 với Ab7, E7 với Bb7, A7 với Eb7. Mỗi cặp về cùng một đích, ví dụ C7 và Gb7 đều về F.", "compare": {"a": {"label": "C7 → F", "play": ["C7", "F"]}, "b": {"label": "Gb7 → F", "play": ["Gb7", "F"]}}},
      {"text": "Màu của \"bạn của mẹ\" là lydian dominant: 9, #11, 13. Trên Db7, #11 là nốt G; tay phải bấm hợp âm Eb (Eb–G–Bb) là có đủ 9, #11, 13, thành Db13(#11). Đệm cho ca sĩ thì dùng #11 cho rõ hợp âm; muốn nghe jazz hơn thì chỉ dùng 9 và 13.", "tip": "Tay phải là hợp âm trưởng cao hơn nốt gốc một cung: Db lên một cung là Eb.", "show": "Db13(#11)", "compare": {"a": {"label": "Db13(#11) → C", "play": ["Db13(#11)", "C"]}, "b": {"label": "Không #11: Db13 → C", "play": ["Db13", "C"]}}}
    ],
    "remember": ["Hợp âm át thay thế (subV), \"bạn của mẹ\": chung tritone với \"mẹ\", nốt gốc cao hơn đích nửa cung.", "G7 ↔ Db7, C7 ↔ Gb7, D7 ↔ Ab7, E7 ↔ Bb7, A7 ↔ Eb7.", "Màu của \"bạn của mẹ\": 9, #11, 13 (lydian dominant)."],
    "items": [{"chord": "Db13(#11)", "to": "C"}, {"chord": "Gb13(#11)", "to": "F"}, {"chord": "Ab7", "to": "G7"}],
    "quiz": [
      {"q": "Vì sao Db7 thay được G7 để về C?", "choices": ["Hai hợp âm chung tritone B–F", "Hai hợp âm chung nốt gốc", "Db nằm trong giọng C", "Db7 là hợp âm thứ"], "answer": "Hai hợp âm chung tritone B–F", "why": "Bậc 3 và 7 của Db7 (F, Cb = B) chính là bậc 7 và 3 của G7."},
      {"q": "Hợp âm át thay thế (subV) của A7 là gì?", "choices": ["Eb7", "E7", "D7", "Bb7"], "answer": "Eb7", "why": "Từ A đọc mẹo banana là ra Eb (hoặc lấy đích D nhích lên nửa cung); Eb7 và A7 chung tritone C#–G."}
    ] },

  { "id": "p3-23", "part": 3, "src": "Phildave 3 · Bài 23", "title": "\"Bạn của mẹ\" cho hợp âm át phụ",
    "teach": [
      {"text": "Mỗi hợp âm át phụ cũng có \"bạn của mẹ\" riêng, gọi là hợp âm át thay thế phụ (secondary substitute dominant). Ví dụ A7 về Dm7, thì Eb7 cũng về Dm7; E7 về Am7, thì Bb7 cũng về Am7. Mỗi cặp chung tritone và về cùng một đích.", "tip": "Đích nhích lên nửa cung là ra \"bạn của mẹ\": Dm7 → Eb7, Am7 → Bb7, Em7 → F7.", "show": "Eb7", "compare": {"a": {"label": "A7 → Dm7", "play": ["A7", "Dm7"]}, "b": {"label": "Eb7 → Dm7", "play": ["Eb7", "Dm7"]}}},
      {"text": "Bảng đầy đủ trong giọng C: C7, Gb7 → Fmaj7; D7, Ab7 → G7; E7, Bb7 → Am7; A7, Eb7 → Dm7; B7, F7 → Em7; G7, Db7 → Cmaj7. \"Mẹ\" về đích bằng bước quãng 5 xuống, còn \"bạn của mẹ\" về đích bằng bước nửa cung xuống.", "compare": {"a": {"label": "B7 → Em7", "play": ["B7", "Em7"]}, "b": {"label": "F7 → Em7", "play": ["F7", "Em7"]}}},
      {"text": "Nối \"mẹ\" rồi \"bạn của mẹ\" nghe rất hay: G7 – Db7 – C, hay D7 – Ab7 – G7. Bass nhảy một tritone (G xuống Db) rồi trượt nửa cung vào đích, nên vừa có lực vừa mượt.", "compare": {"a": {"label": "G7 – Db7 – C", "play": ["G7", "Db7", "C"]}, "b": {"label": "D7 – Ab7 – G7", "play": ["D7", "Ab7", "G7"]}}},
      {"text": "Bài tập vòng quay lại: Cmaj7 – A7 – Dm7 – G7 đổi thành Em7 – Eb7 – Dm7 – Db7. Em7 thay Cmaj7, Eb7 thay A7, Db7 thay G7, nên bass đi xuống từng nửa cung: E, Eb, D, Db. Vòng vẫn quay về Cmaj7 như cũ.", "compare": {"a": {"label": "Vòng gốc", "play": ["Cmaj7", "A7", "Dm7", "G7", "Cmaj7"]}, "b": {"label": "Bass đi nửa cung", "play": ["Em7", "Eb7", "Dm7", "Db7", "Cmaj7"]}}},
      {"text": "Màu của \"bạn của mẹ\" là 9, #11, 13 (hoặc chỉ 9 và 13), dù đích là hợp âm trưởng hay thứ: tay phải bấm hợp âm trưởng cao hơn nốt gốc một cung. Ví dụ Eb7 về Dm7: tay phải hợp âm F trên Eb7, thành Eb13(#11). \"Bạn của mẹ\" không dùng b9, #9, b13.", "show": "Eb13(#11)", "compare": {"a": {"label": "Eb13(#11) → Dm7", "play": ["Eb13(#11)", "Dm7"]}, "b": {"label": "Ab13(#11) → G7", "play": ["Ab13(#11)", "G7"]}}}
    ],
    "remember": ["Mỗi hợp âm át phụ có một \"bạn của mẹ\" chung tritone, về cùng đích.", "\"Bạn của mẹ\" về đích bằng bước nửa cung xuống, màu 9, #11, 13 cho mọi đích.", "Em7 – Eb7 – Dm7 – Db7: bass đi xuống từng nửa cung."],
    "items": [{"chord": "Eb13(#11)", "to": "Dm7"}, {"chord": "Bb13(#11)", "to": "Am7"}, {"chord": "Ab13(#11)", "to": "G7"}],
    "quiz": [
      {"q": "Trong vòng Em7 – Eb7 – Dm7 – Db7, Eb7 thay cho hợp âm nào của vòng Cmaj7 – A7 – Dm7 – G7?", "choices": ["A7", "Em7", "G7", "Cmaj7"], "answer": "A7", "why": "Eb7 chung tritone (G và Db) với A7 và cùng về Dm7."}
    ] },

  { "id": "p3-24", "part": 3, "src": "Phildave 3 · Bài 24", "title": "Hợp âm giảm đi qua",
    "teach": [

<script>
// ---------- nhạc lý ----------
const NAMES = ['C','Db','D','Eb','E','F','F#','G','Ab','A','Bb','B'];
const PC = {C:0,'C#':1,Db:1,D:2,'D#':3,Eb:3,E:4,F:5,'F#':6,Gb:6,G:7,'G#':8,Ab:8,A:9,'A#':10,Bb:10,B:11};
const nm = pc => NAMES[((pc % 12) + 12) % 12];

// Thế bấm: lh/rh = khoảng cách (nửa cung) tính từ root. tri = tay phải là hợp âm ba nốt nào (offset, thứ?)
const TYPES = {
  maj:   { suf:'',            lh:[0],    rh:[0,4,7],   tri:[0,false] },
  min:   { suf:'m',           lh:[0],    rh:[0,3,7],   tri:[0,true] },
  dom7:  { suf:'7',           lh:[0,10], rh:[0,4,7],   tri:[0,false] },
  dom9:  { suf:'9',           lh:[0,10], rh:[4,7,14],  tri:null },
  domb9: { suf:'7(b9)',       lh:[0,10], rh:[4,7,13],  tri:null },
  lyd:   { suf:'13(#11)',     lh:[0,4,10], rh:[2,6,9], tri:[2,false] },   // tay trái 1–3–7 (có tritone), tay phải hợp âm trưởng trên nốt 9
  sus9:  { suf:'9sus4',       lh:[0],    rh:[10,14,17],tri:[10,false] },
  sus4b9:{ suf:'7sus4(b9)',   lh:[0],    rh:[10,13,17] },  // tay phải hợp âm thứ trên b7 (Dm/E)
  maj7:  { suf:'maj7',        lh:[0,11], rh:[0,4,7] },
  m7:    { suf:'m7',          lh:[0,10], rh:[0,3,7] },
  m7b5:  { suf:'m7b5',        lh:[0,10], rh:[0,3,6] },
  maj9:  { suf:'maj9',        lh:[0,4],  rh:[7,11,14] },   // tay phải hợp âm trên nốt 5
  maj13s11:{ suf:'maj13(#11)',lh:[0,11], rh:[2,6,9] },     // tay phải hợp âm trưởng trên nốt 9
  m9:    { suf:'m9',          lh:[0,3],  rh:[7,10,14] },   // tay phải hợp âm thứ trên nốt 5
  m11:   { suf:'m11',         lh:[0],    rh:[10,14,17] },  // tay phải hợp âm trưởng trên nốt b7
  dom13: { suf:'13',          lh:[0,10], rh:[2,4,9] },     // G13 = G F + A B E (9, 3, 13)
  dim7:  { suf:'dim7',        lh:[0],    rh:[3,6,9] },     // C#dim7 = nốt C# + hợp âm Edim
  alt1:  { suf:'7(#9 b13)',   lh:[0,4,10], rh:[8,12,15] }, // E7(#9 b13) = E G# D + hợp âm C (tay trái 1–3–7)
  alt2:  { suf:'7(b9 b13)',   lh:[0,10], rh:[8,13,16] },   // E7(b9 b13) = E7 + hợp âm Fm
};
// bass (tuỳ chọn): nốt bass riêng khác gốc (C7/G); bằng gốc thì bỏ qua
// names (tuỳ chọn): { rootName, bassName } = cách viết người dùng gõ (C#, G#...); không có thì dùng tên mặc định
const chord = (root, type, bass, names) => {
  const r = ((root%12)+12)%12, rn = names && names.rootName, c = { root: r, type, name: (rn ?? nm(r)) + TYPES[type].suf };
  if (rn) c.rootName = rn;
  if (bass != null && ((bass%12)+12)%12 !== r) {
    c.bass = ((bass%12)+12)%12; const bn = (names && names.bassName) ?? nm(c.bass);
    if (names && names.bassName) c.bassName = bn;
    c.name += '/' + bn;
  }
  return c;
};

function parseChord(s) {
  const m = s.trim().match(/^([A-G][#b]?)(m(?!aj))?/);
  if (!m || PC[m[1]] == null) return null;
  return chord(PC[m[1]], m[2] ? 'min' : 'maj', null, { rootName: keyRoot(PC[m[1]], m[1], !!m[2]) });
}

// Đọc ký hiệu đầy đủ: gốc dài nhất khớp PC + đúng một hậu tố trong TYPES
function parseSymbol(s) {
  s = String(s).trim().replace('°7', 'dim7');
  const sl = s.lastIndexOf('/');
  if (sl >= 0) {
    const c = parseSymbol(s.slice(0, sl)), b = s.slice(sl + 1);
    return c && !c.bass && Object.prototype.hasOwnProperty.call(PC, b) ? chord(c.root, c.type, PC[b], { rootName: c.rootName, bassName: b }) : null;
  }
  const root = Object.keys(PC).filter(k => s.startsWith(k)).sort((a, b) => b.length - a.length)[0];
  if (root === undefined) return null;
  const rest = s.slice(root.length), t = Object.keys(TYPES).find(k => TYPES[k].suf === rest);
  return t === undefined ? null : chord(PC[root], t, null, { rootName: root });
}

// Tên nốt có quãng tám ("C#4", "Bb3") → số MIDI (C4 = 60); không đọc được → null
function parseNote(s) {
  const m = typeof s === 'string' && s.match(/^([A-G])([#b]?)(-?\d)$/);
  if (!m) return null;
  const oct = +m[3], k = m[1] + m[2]; if (oct < -1 || oct > 8 || !Object.prototype.hasOwnProperty.call(PC, k)) return null;
  return (oct + 1) * 12 + PC[k];
}

// Bài học: đọc JSON nhúng; không bao giờ ném lỗi
function loadLessons(text) {
  let data;
  try {
    if (text === undefined) {
      const el = typeof document !== 'undefined' && document.getElementById('lessons');
      if (!el) throw new Error('không thấy dữ liệu');
      text = el.textContent;
    }
    data = JSON.parse(text);
    if (!Array.isArray(data)) throw new Error('không phải danh sách');
  } catch (e) { return { lessons: [], errors: ['lessons: ' + (e && e.message || e)] }; }
  const lessons = [], errors = [];
  for (const raw of data) {
    if (!isObj(raw)) { errors.push('lessons: mục không hợp lệ'); continue; }
    const items = [];
    for (const it of Array.isArray(raw.items) ? raw.items : []) {
      if (isObj(it) && parseSymbol(it.chord) && (it.to == null || parseSymbol(it.to))) items.push(it);
      else {
        const bad = !isObj(it) || !parseSymbol(it.chord) ? (isObj(it) ? it.chord : null) : it.to;
        errors.push(`${raw.id ?? '?'}: ${bad ?? '?'}`);
      }
    }
    const id = raw.id ?? '?';
    // một bước nghe: ký hiệu hợp âm hoặc mảng tên nốt; trả về ký hiệu hỏng đầu tiên (hoặc null)
    const badStep = st => Array.isArray(st) ? (st.length && st.every(n => parseNote(n) != null) ? null : (st.find(n => parseNote(n) == null) ?? '?'))
      : (typeof st === 'string' && parseSymbol(st) ? null : String(st));
    const badPlay = pl => { if (!Array.isArray(pl)) return String(pl); for (const st of pl) { const b = badStep(st); if (b != null) return b; } return null; };
    const teach = [];
    (Array.isArray(raw.teach) ? raw.teach : []).forEach((t, n) => {
      if (!isObj(t) || typeof t.text !== 'string') { errors.push(`${id} teach${n}: ?`); return; }
      const t2 = { ...t }, fail = (field, bad) => { errors.push(`${id} teach${n}: ${bad}`); delete t2[field]; };
      if ('show' in t2 && !(typeof t2.show === 'string' && parseSymbol(t2.show))) fail('show', t2.show);
      if ('keys' in t2) { const b = Array.isArray(t2.keys) ? t2.keys.find(k => parseNote(k) == null) : t2.keys; if (b !== undefined || !Array.isArray(t2.keys)) fail('keys', b); }
      if ('play' in t2) { const b = badPlay(t2.play); if (b != null) fail('play', b); }
      if ('compare' in t2) {
        const c = t2.compare; let b = null;
        for (const k of ['a', 'b']) if (b == null) b = !isObj(c) || !isObj(c[k]) ? '?' : badPlay(c[k].play);
        if (b != null) fail('compare', b);
      }
      // mẹo: 1 câu ngắn (tối đa 2), hiện dưới lời giảng trong khung «💡 Mẹo: …»
      if ('tip' in t2 && !(typeof t2.tip === 'string' && t2.tip.trim() && (t2.tip.match(/[.!?](\s|$)/g) || []).length <= 2))
        fail('tip', typeof t2.tip === 'string' ? (t2.tip.trim() ? 'mẹo dài quá 2 câu' : 'mẹo rỗng') : String(t2.tip));
      teach.push(t2);
    });
    const quiz = [];
    (Array.isArray(raw.quiz) ? raw.quiz : []).forEach((q, n) => {
      if (isObj(q) && Array.isArray(q.choices) && q.choices.length === 4 && q.choices.includes(q.answer)) quiz.push(q);
      else errors.push(`${id} quiz${n}: ${isObj(q) && Array.isArray(q.choices) && q.choices.length !== 4 ? 'cần đúng 4 lựa chọn' : 'đáp án không nằm trong lựa chọn'}`);
    });
    lessons.push({ ...raw, teach, remember: Array.isArray(raw.remember) ? raw.remember : [], items, quiz });
  }
  return { lessons, errors };
}

const settings = { level: 3, bpm: 72 };
// Nhịp hợp lệ 50–120; giá trị không hợp lệ → 72
function clampBpm(x) { return typeof x === 'number' && Number.isFinite(x) ? Math.min(120, Math.max(50, x)) : 72; }

// ---------- âm piano thật (có dự phòng âm tổng hợp) ----------
// Nguồn mẫu: FluidR3_GM (Frank Wen) qua gleitz/midi-js-soundfonts, giấy phép CC BY 3.0
// (https://creativecommons.org/licenses/by/3.0/). Tên tệp chỉ dùng dấu giáng: Gb4.mp3 (không có F#4.mp3).
const SAMPLE_URL = n => `https://gleitz.github.io/midi-js-soundfonts/FluidR3_GM/acoustic_grand_piano-mp3/${['C','Db','D','Eb','E','F','Gb','G','Ab','A','Bb','B'][n % 12]}${Math.floor(n / 12) - 1}.mp3`;
let ac = null, soundMode = 'synth';
const pianoBufs = {};
function getAC() {
  if (!ac) {
    try { ac = new AudioContext(); } catch (e) { ac = null; }
    // Mọi tiếng (mẫu + tổng hợp) đi chung: gain tổng → nén → loa, để nhiều nốt cùng lúc không bị rè
    if (ac) try {
      const g = ac.createGain(), comp = ac.createDynamicsCompressor();
      g.gain.value = 0.8; comp.threshold.value = -12; comp.knee.value = 10; comp.ratio.value = 4;
      g.connect(comp); comp.connect(ac.destination); ac.master = g;
    } catch (e) { /* AudioContext giả/thiếu nút: nối thẳng ra loa */ }
  }
  return ac;
}
const outOf = ctx => ctx.master || ctx.destination;
function setSoundMode(m) {
  soundMode = m;
  if (typeof document !== 'undefined') { const el = document.getElementById('snd'); if (el) el.textContent = '♪ ' + (m === 'piano' ? 'piano' : 'tổng hợp'); }
}
// Tải mẫu cho nốt 36–84. true khi lô giữa phím đàn đã tải được trong timeoutMs (phần còn lại tải nền);
// lỗi/quá hạn → false và giữ âm tổng hợp. Không bao giờ ném lỗi.
async function loadPiano(fetchFn = fetch, timeoutMs = 3000) {
  try {
    const ctx = getAC();
    if (!ctx) return false;
    const one = n => Promise.resolve().then(() => fetchFn(SAMPLE_URL(n)))
      .then(r => { if (!r || r.ok === false) throw new Error('http'); return r.arrayBuffer(); })
      .then(b => ctx.decodeAudioData(b))
      .then(buf => { pianoBufs[n] = buf; setSoundMode('piano'); return true; });
    const all = []; for (let n = 36; n <= 84; n++) all.push(n);
    const first = all.filter(n => n >= 55 && n <= 76), rest = all.filter(n => n < 55 || n > 76);
    let timer;
    // Luôn tải nền phần còn lại; thành công ngay khi giải mã được nốt đầu tiên của lô giữa
    Promise.allSettled(rest.map(one));
    const firstDone = Promise.any(first.map(one)).then(() => true, () => false);
    const timeout = new Promise(res => { timer = setTimeout(() => res(false), timeoutMs); });

      const names = shared.sort((a, b) => ((a - t.root + 12) % 12) - ((b - t.root + 12) % 12)).map(p => sp(t, p, tab)).join(', ');
      befores.push(mk('before', c, `Hợp âm gì thay được ${it.to}?`, c.name,
        pick(`${c.name} chung ${shared.length} nốt ${names} với ${it.to} nên thay được.`, `${c.name} chung nhiều nốt với ${it.to}.`), uniq(c.name, shuffle(cands))));
    } else if (t) {
      const dt = DOMF.includes(c.type) ? c.type : 'dom7', tdom = isDom(t);
      // chỉ dùng hợp âm không phải cách vào đích: át (đích+7), át thế (đích+1), "chị" (m7 trên đích+7 khi đích là át), dim7 đi qua
      const valid = x => (isDom(x) && [(tr + 7) % 12, (tr + 1) % 12].includes(x.root)) || x.type === 'dim7' ||

      const cands = [mkc(tr + 2, dt), mkc(tr + 7, 'm7'), mkc(tr + 9, dt), mkc(tr + 7, 'maj7'), mkc(tr + 5, 'dom7'), mkc(tr + 4, 'm7')]
        .filter(x => !valid(x) && !same(x, t) && !same(x, c)).map(x => x.name);
      const d = (tr - c.root + 12) % 12, tn = t.rootName ?? nm(tr);
      let why;
      const plain = `${c.name} kéo về ${it.to}.`;
      if (c.type === 'dim7') why = d === 1 ? `${c.name} là hợp âm giảm đi qua (passing diminished): nốt gốc là ${tn} lùi nửa cung, kéo lên ${it.to}.` : `${c.name} là hợp âm giảm đi qua (passing diminished), kéo về ${it.to}.`;
      else if (c.bass != null) { const bd = (tr - c.bass + 12) % 12; why = bd === 1 ? `${c.name} có bass ${c.bassName ?? nm(c.bass)} thấp hơn nốt ${tn} nửa cung nên kéo lên ${it.to}.` : `${c.name} có bass ${c.bassName ?? nm(c.bass)} dẫn về ${it.to}.`; }
      else if (isDom(c) && c.root === (tr + 7) % 12) why = `${c.name} là "mẹ" (${SUS.includes(c.type) ? 'dạng treo, sus4' : 'hợp âm át 7'}) của ${it.to}: nốt gốc ${rn(c)} cao hơn nốt gốc của đích (${tn}) một quãng 5 (từ ${tn} đếm lên 5 tên nốt: ${count5(tn, MINORISH.includes(t.type))}), kéo về ${it.to}.`;
      else if (isDom(c) && c.root === (tr + 1) % 12) why = `${c.name} là "bạn của mẹ" (${SUS.includes(c.type) ? 'dạng treo, sus4' : 'hợp âm át thay thế, subV'}) của ${it.to}: ${SUS.includes(c.type) ? 'bass' : 'chung tritone với "mẹ", nốt'} gốc là nốt gốc của đích nhích lên nửa cung (${tn} lên nửa cung là ${rn(c)}).`;
      else if (tdom && ['m7', 'm7b5'].includes(c.type) && c.root === (tr + 7) % 12) why = pick(`${c.name} là "chị" (II liên quan) của ${it.to}: nốt gốc ${rn(c)} cao hơn nốt gốc của đích (${tn}) một quãng 5 (đếm lên ${count5(tn, MINORISH.includes(t.type))}), kéo về ${it.to}.`,
        `Coi ${it.to} là bậc V thì ${c.name} nằm ở bậc II (nốt gốc ${rn(c)} cao hơn ${tn} một quãng 5: đếm lên ${count5(tn, MINORISH.includes(t.type))}), nên dẫn vào ${it.to} rất tự nhiên.`);
      else why = plain;
      const fifth = isDom(c) && c.root === (tr + 7) % 12 ? `${c.name} kéo về ${it.to}: nốt gốc ${rn(c)} cao hơn nốt gốc của đích (${tn}) một quãng 5 (đếm lên ${count5(tn, MINORISH.includes(t.type))}).` : plain;
      befores.push(mk('before', c, `Hợp âm gì kéo về ${it.to}?`, c.name, pick(why, fifth, plain), uniq(c.name, cands)));
      // chọn màu theo đích
      if (COLF.includes(c.type) && c.bass == null) {
        const minT = MINISH.includes(t.type), mother = c.root === (tr + 7) % 12, friend = c.root === (tr + 1) % 12;
        // một đáp án đúng: "bạn của mẹ" → 13(#11)/9/13 (sai = altered); "mẹ" → thứ: altered (sai = 9/13/13(#11));
        // "mẹ" → trưởng: hỏi màu cơ bản ưu tiên 1 9/13/13(#11) (sai = altered); màu biến đổi về đích trưởng là lựa chọn 2 → không hỏi
        const ALT = ['domb9', 'alt1', 'alt2'], NAT = ['dom9', 'dom13', 'lyd'];
        const kind = friend ? 'sub' : mother ? (minT ? 'min' : 'maj') : null;
        const good = { sub: NAT, min: ALT, maj: NAT }[kind];
        if (good && good.includes(c.type)) {
          const wrong = kind === 'min' ? NAT : ALT;
          const w = pick(...{ min: ['Đi về hợp âm thứ nên dùng nốt màu biến đổi (b9, #9, b13), tức altered.', 'Đi về hợp âm thứ nên dùng b9, #9, b13.'],
            maj: ['Đi về hợp âm trưởng: màu cơ bản là 9, 13 (mixolydian) hoặc 9, #11, 13 (lydian dominant); màu biến đổi là lựa chọn thứ hai.',
                  'Đi về hợp âm trưởng: màu cơ bản là 9, 13; màu biến đổi là lựa chọn thứ hai.', 'Đi về hợp âm trưởng: màu cơ bản là 9, 13.'],
            sub: ['"Bạn của mẹ" (hợp âm át thay thế, subV) dùng nốt màu (tension) 9, #11, 13, không dùng màu biến đổi.', '"Bạn của mẹ" dùng 9, #11, 13, không dùng b9, #9, b13.'] }[kind]);
          const nameOf = ty => chord(c.root, ty, null, { rootName: c.rootName }).name;
          colours.push(mk('colour', c, kind === 'maj' ? pick(`${rn(c)}7 đi về ${it.to}: chọn màu cơ bản (ưu tiên 1)`, `${rn(c)}7 đi về ${it.to}: chọn màu cơ bản`) : `${rn(c)}7 đi về ${it.to}: chọn màu đúng`,

    const v = voicing(c), rhn = nameNotes(v.rh);

      const names = rs.includes('#') ? SHARP_NAMES : rs.includes('b') ? FLAT_NAMES : tab;   // một bảng 12 tên → không có hai tên cùng cao độ
      ans = names[r] + rhn.slice(m.length);
      for (const d of [2, 5, 7, 3, 9, 1, 4]) for (const sf of ['', 'm', 'dim']) pool.push(names[(r + d) % 12] + sf);
      pool.push(...['m', 'dim', ''].map(sf => names[r] + sf));
      const rhNotes = v.rh.map(n => sp(c, n, tab)).join(' '), notesWhy = `Tay phải của ${c.name} là hợp âm ${ans}: các nốt ${rhNotes}.`;
      // chỉ gọi "nốt màu" những nốt thật sự là 9, 11, 13 (kể cả biến đổi); nốt 4 của hợp âm treo không tính
      const TENS = ['b9', '9', '#9', '#11', 'b13', '13', ...(SUS.includes(c.type) ? [] : ['11'])];
      const tens = v.rh.filter(n => TENS.includes(degree(c, n))).map(n => `${degree(c, n)} (${sp(c, n, tab)})`);
      const why = tens.length ? pick(`Tay phải là hợp âm ${ans} (${rhNotes}): có chứa nốt màu ${tens.join(', ')}.`, notesWhy) : notesWhy;
      rhs.push(mk('rh', c, `Tay phải của ${c.name} là hợp âm gì?`, ans, why, uniq(ans, shuffle(pool.filter(x => x !== ans)))));
    }
    plays.push(mk('play', c, `Bấm ${c.name}`, c.name,
      `Tay trái: ${v.lh.map(n => sp(c, n, tab)).join(' + ')} · tay phải: ${ans ? 'hợp âm ' + ans : 'nốt ' + v.rh.map(n => sp(c, n, tab)).join(' ')}`));

  let out = [...concepts, ...befores, ...colours, ...rhs, ...plays].slice(0, 5);
  // giữ chỗ: mỗi dạng còn tồn tại (play, colour, rh) phải có mặt; thế chỗ câu cuối thuộc dạng đang dư,
  // ưu tiên câu thay cùng mục với câu bị thế (hoặc mục chưa có câu nào) để mục nào cũng còn câu
  for (const [kind, list] of [['play', plays], ['colour', colours], ['rh', rhs]]) {
    if (!list.length || out.some(x => x.kind === kind)) continue;
    let at = -1;
    for (let i = out.length - 1; i >= 0 && at < 0; i--)
      if (out.filter(x => x.kind === out[i].kind).length > 1 && !(out[i].item && out.filter(x => x.item === out[i].item).length === 1 && list.every(x => x.item !== out[i].item))) at = i;
    if (at < 0) for (let i = out.length - 1; i >= 0 && at < 0; i--) if (out.filter(x => x.kind === out[i].kind).length > 1) at = i;
    if (at < 0) continue;
    const d = out[at];
    out[at] = list.find(x => x.item === d.item) || list.find(x => x.item && !out.some(o => o !== d && o.item === x.item)) || list[0];
  }
  out.sort((a, b) => QUIZ_KINDS.indexOf(a.kind) - QUIZ_KINDS.indexOf(b.kind));
  for (let i = 0; out.length < 3 && plays.length; i++) out.push(plays[i % plays.length]);
  const seen = {};   // key không trùng trong một quiz (câu đệm, hợp âm lặp)
  out = out.map(x => { const n = seen[x.key] = (seen[x.key] || 0) + 1; return n > 1 ? { ...x, key: `${x.key}#${n}` } : x; });
  return out;
}

// Kiểm nhạc lý cho mục bài tập (thuần): mỗi mục phải khớp một luật, không thì báo "<id>: <chord> → <to>".
// Họ dominant: gốc = đích+7 ("mẹ") hoặc đích+1 ("bạn của mẹ"); sus chỉ ở chỗ "mẹ". Màu theo sổ tay (bài 16, 17, 21, 23, 24):
//   "mẹ" → trưởng: 9/13 (mixolydian) hoặc 13(#11) (lydian dominant), màu biến đổi là lựa chọn 2; "mẹ" → thứ: chỉ altered;
//   "bạn của mẹ" → mọi đích: 13(#11), 9, 13, không bao giờ altered.
// dim7: gốc = đích−1. m7/m7b5 ("chị"): gốc = đích+2, hoặc đích+7 khi đích là hợp âm át. Có bass riêng: bass cách bass đích 1–2 nửa cung.
// rel:'sub': chung ≥ 2 nốt với đích.
const DOM_ALL = [...DOMF, 'alt1', 'alt2'];
function harmonyOk(c, t, rel) {
  if (rel === 'sub') { const tp = theoryPcs(t); return [...theoryPcs(c)].filter(p => tp.has(p)).length >= 2; }
  const d = (c.root - t.root + 12) % 12, dom = DOM_ALL.includes(c.type);
  const colourOk = () => {
    if (!dom) return true;
    if (SUS.includes(c.type) && d !== 7) return false;
    const good = d !== 7 ? ['dom7', 'lyd', 'dom9', 'dom13']
      : MINISH.includes(t.type) ? ['dom7', 'domb9', 'alt1', 'alt2', 'sus4b9'] : ['dom7', 'dom9', 'dom13', 'lyd', 'sus9', 'domb9', 'alt1', 'alt2'];
    return good.includes(c.type);
  };
  if (c.bass != null) { const x = (c.bass - (t.bass ?? t.root) + 12) % 12, step = Math.min(x, 12 - x); return step >= 1 && step <= 2 && colourOk(); }
  if (dom) return (d === 7 || d === 1) && colourOk();
  if (c.type === 'dim7') return d === 11;
  if (['m7', 'm7b5'].includes(c.type)) return d === (DOM_ALL.includes(t.type) ? 7 : 2);
  return false;
}
function checkLessonHarmony(lessons) {
  const bad = [];
  for (const l of Array.isArray(lessons) ? lessons : []) for (const it of (l && Array.isArray(l.items)) ? l.items : []) {
    const c = it && parseSymbol(it.chord), t = it && it.to != null ? parseSymbol(it.to) : null;
    if (!c || !t || !harmonyOk(c, t, it.rel)) bad.push(`${l.id}: ${it && it.chord} → ${it && it.to}`);
  }
  return bad;
}

// Gợi ý tái hoà âm cho ô ngay trước hợp âm đích
function suggest(target) {
  if (target.type === 'lyd' || target.lydDom) {   // đích là "bạn của mẹ" 13(#11): chỉ dẫn vào bằng "chị" của nó
    const t = target.root;
    return [
      { c: chord(t + 7, 'm7'), noChi: true, why: `"Chị" của ${target.name}: ${nm(t + 7)}m7 → ${target.name}. Không dùng "mẹ" vì b7 của nó chọi với #11.` },
      { c: chord(t + 7, 'm9'), noChi: true, why: `Vẫn là "chị" nhưng thêm 9: mềm hơn.` },
      { c: chord(t + 2, 'm7'), noChi: true, why: `${nm(t + 2)}m7: chung nhiều nốt với ${target.name}, nghe liền.` },
    ];
  }
  if (target.lydian) {   // đích có #11: "mẹ" (có b7) sẽ chọi với #11, nên chèn hợp âm cùng âm giai
    const t = target.root;
    return [
      { c: chord(t + 11, 'm7'), noChi: true, why: `${nm(t + 11)}m7 chung 3 nốt với ${target.name}, bass đi lên nửa cung vào ${nm(t)}. Không dùng "mẹ" vì b7 của nó chọi với #11.` },
      { c: chord(t + 9, 'm9'), noChi: true, why: `${nm(t + 9)}m9: mọi nốt đều nằm trong âm giai của ${target.name}, nghe nhẹ và liền.` },
      { c: chord(t + 2, 'maj'), noChi: true, why: `Hợp âm ${nm(t + 2)} chính là tay phải của ${target.name}: bấm trước rồi thêm bass ${nm(t)}.` },
    ];
  }
  const v = target.root + 7, minor = target.type === 'min';
  const tn = keyRoot(target.root, target.rootName, minor), vn = fifthOf(tn, minor) ?? nm(v), vName = { rootName: vn };
  const sec = chord(v, minor ? 'domb9' : 'dom9', null, vName);
  return [
    { c: sec, why: `"Mẹ" (V) của ${target.name}: bass ${vn} (từ ${tn} đếm lên 5 tên nốt: ${count5(tn, minor)}) kéo về ${target.name}. ` +
        (minor ? `${target.name} là hợp âm thứ → dùng b9.` : `${target.name} là hợp âm trưởng → dùng 9.`) },
    { c: chord(target.root + 1, 'lyd'), why: `"Bạn của mẹ" (subV): chung tritone với ${vn}7, bass đi xuống nửa cung vào ${target.name}. Màu 13(#11): thêm 9, #11, 13.` },
    minor
      ? { c: chord(v, 'sus4b9', null, vName), why: `Màu mềm hơn cho đích thứ: bass ${vn}, tay phải hợp âm ${nm(v + 10)}m (sus4 b9).` }
      : { c: chord(v, 'sus9', null, vName), why: `Màu mềm hơn: bass ${vn}, tay phải hợp âm ${nm(v + 10)} (9sus4).` },
  ];
}

// Kiểm tra chọi giữa 2 hợp âm liền nhau: nốt của x không thuộc âm giai của y thì phải đi nửa cung vào y
// (nốt 3 của hợp âm 7 phải lên; b7, b9, b13, 11 của hợp âm 7 phải xuống)
const MAJ = [0,2,4,5,7,9,11], MIN = [0,2,3,5,7,8,9,10], MIXO = [0,2,4,5,7,9,10], ALT = [0,1,3,4,5,7,8,10];
const SCALE = { maj:MAJ, maj7:MAJ, maj9:MAJ, maj13s11:[0,2,4,6,7,9,11], min:MIN, m7:MIN, m9:MIN, m11:MIN,
  m7b5:[0,1,3,5,6,8,10], dom7:MIXO, dom9:MIXO, dom13:MIXO, sus9:MIXO, domb9:ALT, alt1:ALT, alt2:ALT, dim7:[0,2,3,5,6,8,9,11], sus4b9:ALT, lyd:[0,2,4,6,7,9,10] };
const DOMS = ['dom7','dom9','domb9','dom13','lyd','sus9','sus4b9','dim7','alt1','alt2'];
function clashes(x, y) {
  const ypcs = theoryPcs(y), sc = new Set(SCALE[y.type].map(i => (y.root + i) % 12)), bad = [];
  for (const p of theoryPcs(x)) {
    if (sc.has(p)) continue;
    const d = degree(x, p), dom = DOMS.includes(x.type);
    const up = ypcs.has((p + 1) % 12), down = ypcs.has((p + 11) % 12);
    const ok = dom && ['3','#11','#9','7'].includes(d) ? up : dom && ['b7','b9','b13','b5','11'].includes(d) ? down : (up || down);
    if (!ok) bad.push(`${nm(p)}(${d})`);
  }
  return bad;
}

const isV = (a, b) => a.type === 'maj' && a.root === (b.root + 7) % 12;

// Các màu cho chính hợp âm gốc. Phần tử đầu là mặc định.
function baseOptions(c, next, key) {
  const same = ty => chord(c.root, ty, null, c.rootName ? { rootName: c.rootName } : undefined), rn = c.rootName ?? nm(c.root);
  if (isV(c, next)) {
    const dom = chord(c.root, next.type === 'min' ? 'domb9' : 'dom13');
    return [
      { c: dom, why: `Đã là "mẹ" của ${next.name}: chỉ thêm màu (${next.type === 'min' ? 'đích thứ → b9' : 'đích trưởng → 13'}).` },
      { c: same('sus9'), why: `Mềm hơn: nốt ${rn} + hợp âm ${nm(c.root + 10)}, rồi giải về ${dom.name}.` },
      { c: chord(next.root + 1, 'lyd'), why: `Thay hẳn bằng "bạn của mẹ": chung tritone, bass xuống nửa cung vào ${next.name}.` },
    ];
  }
  if (c.type === 'maj' && c.root === (key + 7) % 12) return [   // bậc V nhưng không giải về I (VD: C G Am F)
    { c: same('dom13'), why: `Vẫn là hợp âm 7 bậc V dù không về ${nm(key)}: thêm 13.` },
    { c: same('sus9'), why: `Mềm hơn: nốt ${rn} + hợp âm ${nm(c.root + 10)}.` },
  ];
  if (c.type === 'min') return [
    { c: same('m7'), why: `Màu cơ bản: thêm nốt 7 (${rn} lùi một cung là ${nm(c.root + 10)}).` },
    { c: same('m9'), why: 'Thêm 9: mềm, sang hơn.' },
    { c: same('m11'), why: `Thêm 9 và 11: thoáng, hiện đại (nốt ${rn} + hợp âm ${nm(c.root + 10)}).` },
  ];
  const o = [
    { c: same('maj7'), why: `Màu cơ bản: thêm nốt 7 trưởng (${rn} lùi nửa cung là ${nm(c.root + 11)}).` },
    { c: same('maj9'), why: 'Thêm 9: sáng, mở hơn.' },
  ];
  if (c.root === (key + 5) % 12) o.push({ c: same('maj13s11'), why: 'Thêm 9, #11, 13 (lydian): rất sáng, chỉ hợp ở bậc IV vì #11 trùng nốt của giọng.' });
  if (c.root === (key + 5) % 12) o.push({ c: same('m7'), why: `Hoà âm mượn: ${c.name} thành ${rn}m7 (mượn từ giọng thứ), nghe buồn, ấm.` });
  return o;
}

// Tái hoà âm cả vòng.
// bp[j]  = màu chọn cho hợp âm gốc thứ j (chỉ số trong baseOptions, mặc định 0)
// picks[i] = hợp âm chèn trước gốc thứ i (0 mẹ, 1 bạn của mẹ, 2 sus; mặc định 0)
// Quy tắc: chèn theo hợp âm gốc ĐÃ đổi màu (gốc thành m7 thì "mẹ" trước nó dùng b9, "chị" là m7b5);
// "mẹ"/"bạn của mẹ" có "chị" đứng trước; ô đã là "mẹ" thì không chèn, trừ khi chọn subV, hoặc sus thì giải về 7.
// Hợp âm gốc sau khi đổi màu, và "đích" mà hợp âm chèn phải phục vụ (trưởng/thứ/lydian)
function colored(cs, bp = [], last) {
  const n = cs.length, key = cs[0].type === 'min' ? (cs[0].root + 3) % 12 : cs[0].root;
  const opts = cs.map((c, j) => baseOptions(c, cs[(j + 1) % n], key));
  const bases = cs.map((c, j) => opts[j][bp[j] ?? 0].c);
  bases.forEach((b, j) => {   // hợp âm 7 ngay trước hợp âm #11 sẽ chọi (b7 ↔ #11) → giữ maj7
    const nx = bases[(j + 1) % n];
    if (['dom13','domb9'].includes(b.type) && (bp[j] ?? 0) === 0 && nx.type === 'maj13s11') bases[j] = chord(b.root, 'maj7', null, b.rootName ? { rootName: b.rootName } : undefined);
  });
  // Hai hợp âm gốc liền nhau mà chọi: giữ hợp âm bạn vừa đổi (last), đổi màu hợp âm kia cho hợp
  for (let pass = 0; pass < 2; pass++) for (let j = 0; j < n; j++) {
    const k = (j + 1) % n;
    if (!clashes(bases[j], bases[k]).length) continue;
    const fix = last === j ? k : j, pv = bases[(fix - 1 + n) % n], nx = bases[(fix + 1) % n];
    const cands = [...opts[fix].map(o => o.c), chord(cs[fix].root, cs[fix].type === 'min' ? 'm7' : 'maj7', null, cs[fix].rootName ? { rootName: cs[fix].rootName } : undefined)];
    const good = cands.find(c => !clashes(pv, c).length && !clashes(c, nx).length);
    if (good) bases[fix] = good;
  }
  const tgts = bases.map(b => Object.assign(chord(b.root, MINORISH.includes(b.type) ? 'min' : 'maj', null, b.rootName ? { rootName: b.rootName } : undefined),
                                            { name: b.name, lydian: b.type === 'maj13s11', lydDom: b.type === 'lyd' }));
  return { opts, bases, tgts };
}

function reharmAll(cs, picks, bp = [], last) {
  const n = cs.length, { opts, bases, tgts } = colored(cs, bp, last);
  const bars = cs.map((c, j) => {
    const s = (j + 1) % n, k = picks[s] ?? 0, base = bases[j], tgt = tgts[s];
    if (isV(c, cs[s]) && !tgt.lydian) {
      if (base.type === 'sus9' || (k === 2 && (bp[j] ?? 0) === 0))
        return { base: chord(c.root, 'sus9'), slot: [opts[j][0].c] };
      return { base, slot: k === 1 && base.type !== 'lyd' ? [suggest(tgt)[1].c] : [] };
    }
    const opt = suggest(tgt)[k], x = opt.c, slot = [x];
    if (k < 2 && !opt.noChi) {
      const chi = chord(x.root + 7, k === 0 && tgt.type === 'min' ? 'm7b5' : 'm7');
      if (chi.root !== base.root) slot.unshift(chi);
    }
    return { base, slot };
  });
  // sus: nếu chọi với hợp âm đứng trước thì đổi sang sus4(b9) (cùng họ sus, khác nốt màu)
  const flat = bars.flatMap(b => [b.base, ...b.slot]);
  flat.forEach((x, i) => {
    if (x.type !== 'sus9') return;
    const prev = flat[(i - 1 + flat.length) % flat.length], alt = chord(x.root, 'sus4b9');
    if (clashes(prev, x).length > clashes(prev, alt).length) Object.assign(x, alt);
  });
  return bars;
}

// tại cùng một chỗ chọn chuỗi dài nhất, nên "quãng ba cung" là tritone chứ không phải "quãng".
const TERM_IGNORE = ['extended dominant', 'dominant mở rộng', 'lydian dominant', 'chủ yếu', 'chủ đề'];   // khớp nhưng không gán thuật ngữ nào, để "dominant" bên trong không bị bắt nhầm
const TERM_RE = [...GLOSSARY.map(g => ({ key: g.key, match: g.match })), { key: null, match: TERM_IGNORE }].map(g => ({ key: g.key, re: new RegExp('(?<![\\p{L}\\p{N}])(?:' +
  [...g.match].sort((a, b) => b.length - a.length).map(m => m.normalize('NFC').replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join('|') + ')(?![\\p{L}\\p{N}])', 'giu') }));
function termSpans(text) {
  text = String(text).normalize('NFC'); const all = [];
  TERM_RE.forEach(({ key, re }) => { re.lastIndex = 0; for (let m; (m = re.exec(text));) all.push({ key, start: m.index, end: m.index + m[0].length }); });
  all.sort((a, b) => a.start - b.start || (b.end - b.start) - (a.end - a.start));
  const out = []; let last = 0;
  all.forEach(x => { if (x.start >= last) { if (x.key) out.push(x); last = x.end; } });
  return out;
}
function termsIn(text) { return [...new Set(termSpans(text).map(x => x.key))]; }
const escHtml = x => String(x).replace(/[&<>"]/g, m => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[m]));
// Lời giảng → HTML đã escape; lần đầu mỗi thuật ngữ được bọc <span class="term" data-term>
function renderTeachText(text) {
  text = String(text).normalize('NFC'); const seen = new Set(); let html = '', at = 0;
  termSpans(text).forEach(x => {
    if (seen.has(x.key)) return; seen.add(x.key);
    html += escHtml(text.slice(at, x.start)) + `<span class="term" data-term="${x.key}" tabindex="0" role="button">${escHtml(text.slice(x.start, x.end))}</span>`; at = x.end;
  });
  return html + escHtml(text.slice(at));
}

// Mỗi test có thể trả về Promise; đợi tối đa 5 giây cho mỗi test
async function runTests(list) {
  const out = [];
  for (const t of list) {
    let timer;
    try {
      const info = await Promise.race([Promise.resolve().then(() => t.fn()),
        new Promise((_, rej) => { timer = setTimeout(() => rej(new Error('quá 5 giây')), 5000); })]);
      out.push({ name: t.name, ok: true, info });
    } catch (e) { out.push({ name: t.name, ok: false, info: String(e) }); }
    finally { clearTimeout(timer); }
  }
  return out;
}

// các test đều chạy trong microtask/đợi ngắn, và mức đã lưu luôn được trả lại.
async function runFast() {
  const keep = settings.level; settings.level = 3;
  try { return await runTests(TESTS.filter(t => t.fast)); }
  finally { settings.level = keep; }
}
