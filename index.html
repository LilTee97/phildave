 b9 của A7 phía sau, nên tai đã nghe sẵn và A7(b9) vào rất tự nhiên. Thầy nói Gm/Bb cũng có thể nhìn đơn giản là C/Bb như ở bài 1.", "tip": "Gm/Bb: tay trái Bb, tay phải hợp âm Gm (G Bb D); sang A7(b9), Bb ở tay phải giữ nguyên thành b9.", "play": ["C", "Gm/Bb", "A7(b9)", "Dm7", "Dm(M7)", "Dm7"]}], "remember": ["F/G là hợp âm G: F, A, C là bậc 7, nốt 9 và sus4; đổi sang Fm/G là kết Amen trên bass G.", "G7+ và G7(b13) cùng một phím (D# = Eb), muốn đi lên E của C.", "A7 → Dm: 13 trước, b13 sau; bass C – Bb – A báo trước b9 của A7; chia tới 4 hợp âm một ô nhịp."], "items": [{"chord": "Fm/G", "to": "C", "prog": ["F/G", "Fm/G", "C", "F/G"]}, {"chord": "G7+", "to": "C", "prog": ["F/G", "G7+", "C", "Fm/G"]}, {"chord": "Gm/Bb", "to": "A7(b9)", "prog": ["C", "Gm/Bb", "A7(b9)", "Dm7"]}], "quiz": [{"q": "F/G nhìn từ hợp âm G thì F, A, C là những nốt nào?", "choices": ["Bậc 7, nốt 9 và bậc 4 (sus4)", "Nốt gốc, bậc 3 và bậc 5", "Nốt 9, 11 và 13", "Bậc 3, 5 và 7"], "answer": "Bậc 7, nốt 9 và bậc 4 (sus4)", "why": "F là G lùi một cung (nốt 7), A là G lên một cung (nốt 9), C là nốt 4; ba nốt gom lại thành hợp âm F."}, {"q": "Ở chữ \"vương quốc Chúa\", thầy đánh A7(13) rồi mới A7(b13). Nốt 13 tự nhiên (F#) ở đó nghe thế nào?", "choices": ["Hơi lạ, như một chút khiêu khích, rồi hạ xuống b13 (F)", "Sai luật, nên thầy bỏ ngay", "Là màu chuẩn nhất khi về hợp âm thứ", "Biến A7 thành hợp âm mượn"], "answer": "Hơi lạ, như một chút khiêu khích, rồi hạ xuống b13 (F)", "why": "Về Dm (hợp âm thứ) thì đúng ra là b13; thầy cố ý đánh 13 trước cho hơi lạ tai, rồi hạ F# xuống F, cũng là đổi màu lệch thời điểm."}, {"q": "Trong nhịp 4/4, thầy dặn chia hợp âm thế nào?", "choices": ["Chia càng nhiều càng tốt, tới 4 hợp âm một ô nhịp", "Mỗi ô nhịp chỉ một hợp âm", "Chỉ đổi hợp âm ở cuối câu", "Chỉ chia khi ca sĩ nghỉ"], "answer": "Chia càng nhiều càng tốt, tới 4 hợp âm một ô nhịp", "why": "Nhịp 4/4 có 4 phách nên chia được tới 4 hợp âm, như Dm7 – Dm(M7) – Dm7 qua lại."}]},

  {"id": "p4-13", "part": 4, "src": "Phildave 4 · Bài 13", "title": "9sus4 thực tế, hợp âm theo nốt trên cùng, tên hợp âm giảm", "teach": [{"text": "9sus4 trong thực tế (나인써스포의 생활화): ở chữ \"ngợi khen Chúa\", giai điệu chạy nhanh nhiều nốt nhưng thầy giữ nguyên F/G – F/G – C – F/G. Lý do: nốt F trong giai điệu là nốt chính của hợp âm (nằm trong hợp âm F của 9sus4), còn các nốt khác chỉ lướt qua. Nốt lướt qua thì không cần đổi hợp âm theo.", "play": ["F/G", "F/G", "C", "F/G"]}, {"text": "Thầy dặn học 9sus4 như một hợp âm ba nốt, đừng đếm 7, 9, sus4 từng nốt, vì khi đổi thế đảo là rối. Cách này dùng cho mọi hợp âm 7, kể cả hợp âm át phụ: G7 9sus4 là hợp âm F trên bass G, A7 9sus4 là hợp âm G trên bass A.", "tip": "9sus4 của hợp âm 7 nào cũng là hợp âm trưởng của nốt gốc lùi một cung: G7 bấm hợp âm F, A7 bấm hợp âm G.", "compare": {"a": {"label": "G7 9sus4 = F/G", "play": ["F/G", "G7"]}, "b": {"label": "A7 9sus4 = G/A", "play": ["G/A", "A7"]}}}, {"text": "Augmented (오그먼트 코드): ở chữ \"lời ngợi khen của con\", thầy đi F/G – C – G7+. Sau C, G7+ (bậc 5 nâng lên, cũng là b13) làm câu không dừng hẳn mà muốn đi tiếp về C.", "tip": "Từ C sang G7+: tay phải C E G thành B Eb, C xuống B, E xuống Eb, mỗi ngón lùi nửa cung.", "play": ["F/G", "C", ["G2", "F3", "B3", "Eb4"]]}, {"text": "Hợp âm theo top note (탑노트에 맞는 코드): C – Em7 – G/F – F. Các tập nhạc khác chỉ ghi F, nhưng muốn nốt giai điệu ở chữ \"khen\" nổi lên thì thầy chơi hợp âm G trên bass F (G/F) rồi mới về F. Không có hợp âm nào cố định: miễn là hợp âm trong giọng (C, Dm, F, G…) và nốt giai điệu nằm trên cùng.", "tip": "G/F: tay trái giữ F, tay phải bấm hợp âm G; rồi tay phải về hợp âm F.", "compare": {"a": {"label": "Sách khác: C – Em7 – F", "play": ["C", "Em7", "F"]}, "b": {"label": "Theo nốt trên cùng: C – Em7 – G/F – F", "play": ["C", "Em7", "G/F", "F"]}}}, {"text": "Đảo 1 dùng augmented: C – C+/E – G/F – F. Đảo 1 của C thường thay bậc 3 ở tay phải bằng 9 (bài 3); lần này thầy dùng hợp âm tăng C+ trên bass E; tay phải vẫn không lặp lại E: C G# C. Nốt G# căng cùng nốt giai điệu trên cùng cho một màu rất phức tạp, rồi bass đi lên E, F vào G/F – F.", "tip": "C+ là hợp âm C nâng bậc 5 lên nửa cung: G thành G#.", "play": ["C", "C+/E", "G/F", "F"]}, {"text": "Hướng đi của diminished (디미니쉬의 진행방향): câu lặp lại thì thầy thêm F#°7 sau F (C – C+/E – G/F – F – F#°7) để đổi màu. Với hợp âm giảm, hướng đi rất quan trọng: cùng bốn phím, bass đi lên từ F lên G thì gọi F#dim7, bass đi xuống từ G xuống F thì gọi Gbdim7. Đặt tên như vậy là báo trước bass sẽ đi về đâu.", "tip": "Đi lên dùng dấu thăng (F#), đi xuống dùng dấu giáng (Gb); F# và Gb là cùng một phím đen.", "compare": {"a": {"label": "Đi lên: F – F#°7 – G", "play": ["F", "F#°7", "G"]}, "b": {"label": "Đi xuống: G – Gb°7 – F", "play": ["G", "Gb°7", "F"]}}}], "remember": ["Giai điệu chạy nhanh: nốt nào là nốt chính của hợp âm thì giữ hợp âm, nốt lướt qua thì thôi; học 9sus4 như hợp âm ba nốt (G7 → F/G, A7 → G/A).", "Chọn hợp âm theo nốt trên cùng: G/F thay cho F để nốt giai điệu nổi lên.", "Hợp âm giảm gọi theo hướng bass: đi lên là F#dim7, đi xuống là Gbdim7."], "items": [{"chord": "G/F", "to": "F", "rel": "line", "prog": ["C", "Em7", "G/F", "F"]}, {"chord": "C+/E", "to": "G/F", "prog": ["C", "C+/E", "G/F", "F", "F#°7"]}, {"chord": "Em7", "to": "C", "rel": "sub", "prog": ["C", "Em7", "G/F", "F"]}], "quiz": [{"q": "Bass đi từ G xuống F qua một hợp âm giảm. Gọi tên hợp âm đó thế nào?", "choices": ["Gbdim7", "F#dim7", "Gdim7", "Fdim7"], "answer": "Gbdim7", "why": "Bass đi xuống thì dùng dấu giáng: G xuống Gb rồi F, nên gọi Gbdim7 (cùng phím với F#dim7)."}, {"q": "Giai điệu chạy nhanh trên F/G, vì sao thầy vẫn giữ F/G?", "choices": ["Nốt F là nốt chính của hợp âm, các nốt khác chỉ lướt qua", "Vì F/G là hợp âm chủ", "Vì giai điệu không có nốt F", "Vì đổi hợp âm sẽ sai nhịp"], "answer": "Nốt F là nốt chính của hợp âm, các nốt khác chỉ lướt qua", "why": "F nằm trong hợp âm F của 9sus4; các nốt còn lại chỉ đi ngang qua nên không cần đổi hợp âm."}, {"q": "Từ C sang G7+, tay phải đi thế nào?", "choices": ["C xuống B, E xuống Eb: mỗi ngón lùi nửa cung", "C lên D, E lên F", "Giữ nguyên C E G, chỉ đổi bass", "C xuống A, E xuống D"], "answer": "C xuống B, E xuống Eb: mỗi ngón lùi nửa cung", "why": "G7+ bấm G F | B Eb: từ hợp âm C, C lùi nửa cung thành B (bậc 3 của G7), E lùi nửa cung thành Eb (#5 của G7)."}]},

  {"id": "p4-14", "part": 4, "src": "Phildave 4 · Bài 14", "title": "Hợp âm theo giai điệu, vào đúng phách và 9sus4 đi qua", "teach": [{"text": "Hợp âm theo top note: ở chữ \"Đức Chúa Trời toàn năng\", thầy đi C – G/A – G/F – F. Chỗ này vốn là Am, nhưng nốt giai điệu là B, mà B không phải nốt chính của Am; nên thầy chơi hợp âm G (có B) trên bass A. G/A ở đây không phải 9sus4, chỉ là hợp âm G làm nổi nốt B; bass đi A xuống F mà nốt trên cùng vẫn là B.", "tip": "Tay phải giữ hợp âm G với B trên cùng (D G B); tay trái đổi bass từ A xuống F.", "keys": ["A2", "|", "D4", "G4", "B4"], "play": ["C", ["A2", "|", "D4", "G4", "B4"], ["F2", "|", "D4", "G4", "B4"], "F"]}, {"text": "Giải quyết bằng hợp âm thay thế (대리코드로 해결): C – G/A – A7(b13 #9) – G/F – F – F#°7. Ô nhịp chỉ có một hợp âm C thì thầy đặt hợp âm thay thế ở phách 3 để chia đôi: C rồi G/A (thay cho Am, mà Am là hợp âm thay thế của C). A7 lẽ ra về Dm, nhưng Dm là hợp âm thay thế của F nên đi về F cũng được: thầy gọi Dm là phương án 1, F là phương án 2.", "play": ["C", "G/A", "A7(b13 #9)", "G/F", "F", "F#°7"]}, {"text": "Vì sao chọn A7(b13 #9)? Nốt giai điệu ở đó là C, mà C đứng sát bậc 3 của A7 (C#): bấm A7 thường thì C trong giai điệu và C# trong hợp âm va nhau. Dùng A7(b13 #9) thì C trở thành nốt #9 của A7. C# vẫn còn ở tay trái nên vẫn hơi va, nhưng thầy nói dù va vẫn dùng được: C giờ là #9, đi cùng b13 (F) thành bộ màu biến đổi quen thuộc của \"mẹ\" về hợp âm thứ, nên tai nghe như một màu cố ý chứ không phải nốt sai.", "tip": "A7(b13 #9) dễ bấm: tay trái A C# G, tay phải hợp âm F (F A C).", "play": ["G/A", "A7(b13 #9)", "G/F", "F"]}, {"text": "Đổi tension lệch thời điểm (텐션의 변화로 시간차 공격): F/G – G7(13) – G7(b13) – C – F/G, lại là 13 rồi b13 trên G7 như bài 11. Lần này thầy dặn mỗi hợp âm phải vào đúng phách, và phách 4 là nghỉ. Đánh hợp âm vào nốt móc đơn lướt qua thì nó chỉ thành tiết tấu của giai điệu, nghe không hay.", "tip": "Đếm to 1, 2, 3, 4: mỗi lần đổi hợp âm đặt tay xuống đúng số đếm, tới 4 thì nhấc tay nghỉ.", "play": ["F/G", ["G2", "F3", "B3", "E4"], ["G2", "F3", "B3", "Eb4"], "C", "F/G"]}, {"text": "9sus4 & passing progression (나인써스포와 경과적진행): F/G – G/F – C/E – Am7 – G7+. F/G giải quyết xuống G/F: tay phải về hợp âm G, bass G xuống F, thành G7 đảo 3 (nốt 7 ở bass). Bass F đi tiếp xuống E vào C/E, đảo 1 của hợp âm kế tiếp, nên vừa giải quyết vừa là tiến hành đi qua: bass G, F, E, nghe rất cổ điển.", "tip": "G/F: tay trái F (G lùi một cung, nốt 7 của G7), tay phải hợp âm G; C/E: tay trái E, tay phải C D G.", "play": ["F/G", "G/F", "C/E", "Am7", "G7+"]}], "remember": ["Nốt giai điệu không phải nốt chính của hợp âm thì đổi hợp âm theo nó: giai điệu B trên chỗ Am thì chơi G/A.", "A7 về Dm là phương án 1, về F là phương án 2; giai điệu C trên A7 thì dùng #9.", "Hợp âm vào đúng phách; F/G → G/F → C/E vừa giải quyết vừa cho bass đi xuống G, F, E."], "items": [{"chord": "G/A", "to": "Am", "rel": "sub", "prog": ["C", "G/A", "G/F", "F"]}, {"chord": "G7(b13)", "to": "C", "prog": ["F/G", "G7(13)", "G7(b13)", "C", "F/G"]}, {"chord": "G/F", "to": "C/E", "prog": ["F/G", "G/F", "C/E", "Am7", "G7+"]}], "quiz": [{"q": "Chỗ vốn là Am nhưng nốt giai điệu là B, thầy chơi gì?", "choices": ["G/A: hợp âm G có B, đặt trên bass A", "Am9sus4", "Em/A", "A7(b9)"], "answer": "G/A: hợp âm G có B, đặt trên bass A", "why": "B không phải nốt chính của Am; hợp âm G có B nên thầy đặt hợp âm G trên bass A cho nốt B nổi lên."}, {"q": "Nốt giai điệu C chạm bậc 3 (C#) của A7. Thầy xử lý thế nào?", "choices": ["Dùng A7(b13 #9): C chính là nốt #9", "Bỏ A7, chơi Am", "Đổi bass sang C", "Dùng A7(13)"], "answer": "Dùng A7(b13 #9): C chính là nốt #9", "why": "Nốt #9 của A7 là C (cùng phím với B#), nên giai điệu C trở thành nốt màu của A7."}, {"q": "F/G → G/F → C/E: bass đi thế nào?", "choices": ["Đi xuống liền bậc G, F, E", "Đi lên G, A, B", "Đứng yên ở G", "Nhảy G lên C"], "answer": "Đi xuống liền bậc G, F, E", "why": "F/G giải quyết xuống G/F (G7 đảo 3), rồi bass F xuống E vào C/E: vừa giải quyết vừa đi qua."}]},

  {"id": "p4-15", "part": 4, "src": "Phildave 4 · Bài 15", "title": "II–V về F, Bb/C \"sâu\" và hai \"bạn của mẹ\"", "teach": [{"text": "Top note của minor 7 (마이너쇬븐의 탑노트): ở chữ \"원히 다스리네\", thầy đi Dm7 – F/G – G7 – C – Gm7 – C7. Phần sau bắt đầu bằng F, nên cuối câu thầy làm II–V về F: Gm7 là \"chị\", C7 là \"mẹ\" của F. Thầy cũng nói Dm7 thêm nốt 9 (Dm7(9)) nghe giàu hơn hẳn Dm7.", "tip": "Tìm \"chị\" của C7: từ C đếm lên 5 tên nốt (C, D, E, F, G) ra Gm7.", "play": ["Dm7", "F/G", "G7", "C", "Gm7", "C7", "F"]}, {"text": "9sus4 cảm giác sâu (깊은 느낌의 나인써스포): Dm7(9) – F/G – G7 – C – Bb/C – C7. Bb/C (C7 9sus4, bài 4) thêm nốt A trên cùng thì nghe sâu hơn. Nhìn từ Bb, tay phải là Bbmaj7 (Bb D F A); nhìn từ C, đó là C7 9sus4 có thêm 13 (A).", "tip": "A là nốt 13 của C (C, D, E, F, G, A ra A), cũng là Bb lùi nửa cung, tức nốt 7 của Bbmaj7.", "keys": ["C2", "Bb3", "D4", "F4", "A4"], "compare": {"a": {"label": "Bb/C", "play": ["C", "Bb/C", "C7"]}, "b": {"label": "Bb/C thêm A trên cùng", "play": ["C", ["C2", "Bb3", "D4", "F4", "A4"], "C7"]}}}, {"text": "Minor 9 cảm giác sâu (깊은 느낌의 마이너나인): Dm7(9) – F/G – G7 – C – Gm7(9) – Gb7(#11). Gm7(9) (tức Gm9, Gm7 thêm A) cho màu sâu ở chỗ \"chị\"; rồi Gb7(#11), \"bạn của mẹ\" của C7, đi về F.", "compare": {"a": {"label": "Gm7(9) – Gb7(#11) – F", "play": ["Gm7(9)", "Gb7(#11)", "F"]}, "b": {"label": "Gm7 – C7 – F", "play": ["Gm7", "C7", "F"]}}}, {"text": "Thầy còn chỉ một màu đẹp: màu biến đổi đi cùng nốt màu tự nhiên trên một hợp âm 7, như C7 có cả b9 (Db) và 13 (A). Thường màu biến đổi đi với màu biến đổi (b9 với b13, #9 với b13); cặp b9 với 13 hiếm hơn nhưng rất đẹp, nên hãy tận dụng.", "tip": "C7 có b9 và 13: tay trái C Bb, tay phải hợp âm A (A C# E), với C# chính là Db.", "compare": {"a": {"label": "C7 → F", "play": ["C7", "F"]}, "b": {"label": "C7 có b9 và 13 → F", "play": ["C7(b9 13)", "F"]}}}, {"text": "SubV (썹파이브): Dm7(9) – F/G – Db7 – C – Gm7 – Gb7(#11). Lần này Db7 đứng ở chỗ của G7: Db7 là \"bạn của mẹ\" của G7, chung tritone F–B. Cả câu có hai \"bạn của mẹ\": Db7 về C và Gb7(#11) về F, bass đều đi xuống nửa cung vào đích.", "tip": "Nốt gốc của \"bạn của mẹ\" là đích nhích lên nửa cung: C lên nửa cung là Db, F lên nửa cung là Gb.", "play": ["Dm7(9)", "F/G", "Db7", "C", "Gm7", "Gb7(#11)", "F"]}], "remember": ["Câu sau bắt đầu bằng F thì cuối câu trước làm II–V về F: Gm7 – C7 hoặc Gm7 – Gb7(#11).", "Bb/C thêm A trên cùng = C7 9sus4 có 13; C7 có b9 và 13 = tay trái C Bb, tay phải hợp âm A.", "\"Bạn của mẹ\" thay \"mẹ\": Db7 về C, Gb7(#11) về F; các cách trong bài thay qua lại được."], "items": [{"chord": "Gm7", "to": "C7", "prog": ["C", "Gm7", "C7"]}, {"chord": "Bb/C", "to": "C7", "rel": "line", "prog": ["C", "Bb/C", "C7"]}, {"chord": "Db7", "to": "C", "prog": ["Dm7(9)", "F/G", "Db7", "C"]}], "quiz": [{"q": "Bb/C thêm nốt A trên cùng. Nhìn từ C thì đó là gì?", "choices": ["C7 9sus4 có thêm 13", "Cmaj7", "C7(b9)", "Cm7"], "answer": "C7 9sus4 có thêm 13", "why": "Bb là nốt 7, D là 9, F là 4 của C (C7 9sus4); A là nốt 13 của C."}, {"q": "Vì sao cuối câu thầy làm II–V về F?", "choices": ["Vì phần sau bắt đầu bằng F", "Vì F là hợp âm chủ của bài", "Vì C7 là hợp âm mượn", "Vì Gm7 là hợp âm trong giọng C"], "answer": "Vì phần sau bắt đầu bằng F", "why": "Phần sau mở bằng F, nên Gm7 – C7 (hoặc Gm7 – Gb7(#11)) dẫn thẳng vào F."}, {"q": "Trong Dm7(9) – F/G – Db7 – C, Db7 thay cho hợp âm nào?", "choices": ["G7, vì là \"bạn của mẹ\" của G7", "Dm7, vì là \"chị\"", "C, vì cùng họ thay thế", "F/G, vì cùng bass"], "answer": "G7, vì là \"bạn của mẹ\" của G7", "why": "Db7 chung tritone F–B với G7 nên đứng ở chỗ G7 và về C, bass Db xuống nửa cung vào C."}]},

  {"id": "p4-16", "part": 4, "src": "Phildave 4 · Bài 16", "title": "Bridge: E/G#, bass giữ nguyên và dòng bass căng", "teach": [{"text": "Thử mọi cách (모든것들을 시도하자): ở đoạn bridge \"하늘 높이 올린 깃발처럼\" (Lên thật cao…), thầy đi F – G – E/G# – Am, hợp âm đích là Am. Bass đi lên liền bậc F, G, G#, A. E/G# không chỉ là hợp âm E đảo 1 mà là E7 đảo 1, \"mẹ\" của Am.", "play": ["F", "G", ["G#2", "|", "D4", "E4", "B4"], "Am"]}, {"text": "Vì E/G# là \"mẹ\" của Am với bass G#, nó thay được bằng G#dim7 (G#°7 = G# B D F), như C#°7 thay A7 (bài 1). G#dim7 chính là E7(b9) bỏ nốt gốc E, và vẫn giữ bass G# đi lên A.", "tip": "Đảo 1 của hợp âm 7 thay được bằng hợp âm giảm trên chính nốt bass đó: E7 → G#dim7, A7 → C#dim7, D7 → F#dim7.", "compare": {"a": {"label": "F – G – E/G# – Am", "play": ["F", "G", ["G#2", "|", "D4", "E4", "B4"], "Am"]}, "b": {"label": "F – G – G#°7 – Am", "play": ["F", "G", "G#°7", "Am"]}}}, {"text": "Pedal point (페달포인트): F – G/F – E(sus4) – E/G# – Am. Bass F đứng yên dưới F rồi dưới G/F (pedal point, bài 1); thầy nói bass cứ muốn giữ lại là đến lúc sẽ rơi xuống, và chính lúc rơi đó tạo cảm giác. Rồi bass rơi xuống E (E(sus4)), lên G# (E/G#) vào Am.", "tip": "G/F: tay trái giữ F, tay phải đổi từ hợp âm F sang hợp âm G.", "play": ["F", "G/F", "E(sus4)", "E/G#", "Am"]}, {"text": "Thêm 9sus4 (나인써스포 추가): … Am9 – Bb/C – F. Ở phách cuối, Bb/C (C7 9sus4) dẫn vào F. Không có thời gian đưa sus4 về bậc 3, nên thầy đi thẳng về F; vẫn nghe về đích vì C7 là \"mẹ\" của F, và nốt 7 (Bb) của nó vẫn đi xuống A của F.", "tip": "Bb/C: tay trái C, tay phải hợp âm Bb (C lùi một cung là Bb).", "play": ["Am9", "Bb/C", "F"]}, {"text": "String line kịch tính (극적인 스트링라인): F – G/F – E(sus4)/B – E7 – Am7(9) – C7/G. Bass giữ F rồi rơi xuống B chứ không phải E: bass không phải nốt gốc nên dòng nghe rất căng. Cuối câu, C7/G cho bass đi xuống A, G như tiến hành đi qua, và C7 là \"mẹ\" của F ở câu sau.", "tip": "Dòng bass: F, F, B, E, A, G; thầy dặn tự tìm đường bass trước rồi mới đặt hợp âm lên.", "play": ["F", "G/F", "E(sus4)/B", "E7", "Am7(9)", "C7/G"]}], "remember": ["E/G# là E7 đảo 1, thay được bằng G#dim7; tương tự A7 → C#dim7, D7 → F#dim7.", "Bass giữ nguyên (F dưới F, G/F) rồi rơi xuống; bass không phải nốt gốc (E(sus4)/B) làm dòng căng.", "Bb/C ở phách cuối không cần giải quyết sus4, đi thẳng về F."], "items": [{"chord": "E/G#", "to": "Am", "prog": ["F", "G", "E/G#", "Am"]}, {"chord": "E(sus4)/B", "to": "E7", "rel": "line", "prog": ["F", "G/F", "E(sus4)/B", "E7", "Am7(9)", "C7/G"]}, {"chord": "Bb/C", "to": "F", "prog": ["Am9", "Bb/C", "F"]}], "quiz": [{"q": "E/G# trước Am thay được bằng hợp âm giảm nào?", "choices": ["G#dim7", "C#dim7", "Adim7", "Gm7"], "answer": "G#dim7", "why": "E/G# là E7 đảo 1; hợp âm giảm trên nốt bass G# (G# B D F) nằm sẵn trong E7(b9) nên thay được."}, {"q": "Vì sao Bb/C ở phách cuối đi thẳng về F, không giải quyết sus4?", "choices": ["Không có thời gian; C7 là \"mẹ\" của F nên vẫn về F được", "Vì Bb/C là hợp âm chủ", "Vì sus4 không bao giờ cần giải quyết", "Vì F là \"bạn của mẹ\" của C7"], "answer": "Không có thời gian; C7 là \"mẹ\" của F nên vẫn về F được", "why": "Ở phách cuối không còn chỗ đưa bậc 4 về 3; Bb/C vẫn là C7 9sus4 nên kéo thẳng về F."}, {"q": "Dòng bass F – G/F – E(sus4)/B nghe căng vì sao?", "choices": ["Bass rơi xuống B, không phải nốt gốc E", "Vì bass đứng yên mãi", "Vì có hợp âm mượn", "Vì E(sus4) là hợp âm thứ"], "answer": "Bass rơi xuống B, không phải nốt gốc E", "why": "Bass đi trên nốt không phải nốt gốc (B dưới E(sus4)) tạo đường bass như dòng đàn dây rất căng."}]},

  {"id": "p4-17", "part": 4, "src": "Phildave 4 · Bài 17", "title": "Đảo 3, #9 với b13, và chỉ nghĩ đến hợp âm đích", "teach": [{"text": "Đảo 3 của dominant (도미넌트의 3전위): ở chữ \"cao tận trời\", thầy đi F – G/F – E(sus4)/B – E7(b13 #9) – Am7(9) – C7/G. G/F là G7 đảo 3 (nốt 7 F ở bass): bass F cố giữ lại rồi mới bật đi. Lần này E7 có thêm #9 và b13, cho một cách diễn đạt rất kịch tính.", "tip": "#9 và b13 của E7 là G và C, chính là hai nốt của hợp âm C ở tay phải.", "play": ["F", "G/F", "E(sus4)/B", "E7(b13 #9)", "Am7(9)", "C7/G"]}, {"text": "Thầy dặn: muốn nốt màu có nghĩa thì màu hợp âm 7 phải rõ, tức bậc 3 và 7 (tritone). Có bass đánh nốt gốc thì piano bỏ nốt gốc cũng được: C7 chỉ còn E, Bb cùng #9 (Eb) và b13 (Ab) vẫn nghe ra C7, mà sắc và tinh tế hơn.", "tip": "Bậc 7 của C7 là C lùi một cung (Bb); #9 là D nâng nửa cung (D#, cùng phím Eb), b13 là A hạ nửa cung (Ab).", "keys": ["E3", "Bb3", "|", "Eb4", "Ab4"], "compare": {"a": {"label": "Có nốt gốc C", "play": [["C2", "E3", "Bb3", "|", "Eb4", "Ab4"]]}, "b": {"label": "Bỏ nốt gốc", "play": [["E3", "Bb3", "|", "Eb4", "Ab4"]]}}}, {"text": "Chỉ nghĩ đến hợp âm đích (목적지코드만 생각해라): F – G – E(sus4)/B – Bb7(#11) – Am7(9) – Bb/C. Ở chỗ E7, thầy đặt Bb7(#11), \"bạn của mẹ\" của E7: bậc 3 và 7 của E7 (G#, D) chính là bậc 7 và 3 của Bb7 (Ab, D). Đừng coi Bb7 ở đây là hợp âm mượn; điều quan trọng là đích đến Am7(9). Bass đi F, G, B rồi xuống nửa cung Bb, A, nghe rất êm.", "tip": "Bb7(#11): tay phải hợp âm C, là hợp âm ba nốt cao hơn nốt gốc một cung (Bb lên một cung là C).", "compare": {"a": {"label": "\"Mẹ\": E7 → Am7(9)", "play": ["F", "G", "E(sus4)/B", "E7", "Am7(9)"]}, "b": {"label": "\"Bạn của mẹ\": Bb7(#11) → Am7(9)", "play": ["F", "G", "E(sus4)/B", "Bb7(#11)", "Am7(9)", "Bb/C"]}}}], "remember": ["G/F là G7 đảo 3 (nốt 7 ở bass); E7(b13 #9) cho đoạn cao trào kịch tính.", "Nốt màu chỉ có nghĩa khi bậc 3 và 7 rõ; có bass đánh gốc thì piano bỏ gốc được.", "Chỉ nghĩ đến đích Am: E7 hay Bb7(#11) (\"bạn của mẹ\") đều được, bass B xuống Bb rồi A."], "items": [{"chord": "E7(b13 #9)", "to": "Am7(9)", "prog": ["F", "G/F", "E(sus4)/B", "E7(b13 #9)", "Am7(9)", "C7/G"]}, {"chord": "Bb7(#11)", "to": "Am7(9)", "prog": ["F", "G", "E(sus4)/B", "Bb7(#11)", "Am7(9)", "Bb/C"]}], "quiz": [{"q": "Bb7(#11) đứng ở chỗ E7 trước Am7(9) là gì?", "choices": ["\"Bạn của mẹ\" của E7", "Hợp âm mượn từ C thứ", "\"Chị\" của Am", "Hợp âm giảm đi qua"], "answer": "\"Bạn của mẹ\" của E7", "why": "Bb7 chung tritone với E7 (G#–D) nên thay E7 và cùng về Am; thầy dặn đừng coi nó là hợp âm mượn ở đây."}, {"q": "G/F trong F – G/F – E(sus4)/B là gì?", "choices": ["G7 đảo 3: nốt 7 (F) ở bass", "Fmaj7", "G7 đảo 1", "Hợp âm mượn"], "answer": "G7 đảo 3: nốt 7 (F) ở bass", "why": "Hợp âm G trên bass F: F là nốt 7 của G7, nên đây là G7 đảo 3."}]},

  {"id": "p4-18", "part": 4, "src": "Phildave 4 · Bài 18", "title": "Thực chiến: phối cả bài \"Cha yêu dấu của con\"", "teach": [{"text": "Phối cả bài \"사랑하는 나의 아버지\" (Cha yêu dấu của con): đầu bài, trước Dm có thể dùng C#dim7, A7 hoặc Eb7 đều được, vì cả ba cùng mang tritone C#–G kéo về Dm. Thầy cố ý chơi đơn giản ở phần mở đầu, không vừa vào đã nhồi đầy màu, để các lần sau còn chỗ biến hoá.", "tip": "Ba lựa chọn cùng về Dm: C#dim7 nằm sẵn trong A7(b9), Eb7 là \"bạn của mẹ\" của A7.", "compare": {"a": {"label": "C – C#°7 – Dm", "play": ["C", "C#°7", "Dm"]}, "b": {"label": "C – Eb7 – Dm", "play": ["C", "Eb7", "Dm"]}}}, {"text": "Bass đi xuống chuẩn bị b9 của A7: trong tiến hành đi qua, nốt Bb đến trước chính là b9 của A7 phía sau, như C – C/Bb – A7(b9) ở bài 1 và C – Gm/Bb – A7(b9) ở bài 12.", "tip": "b9 của A7 là A nhích lên nửa cung (Bb): đặt Bb ở bass ngay trước A7.", "play": ["C", "Gm/Bb", "A7(b9)", "Dm"]}, {"text": "Sau A7 lẽ ra về Dm, nhưng thầy \"đổi ý\", thêm một hợp âm 7 nữa: D7, \"mẹ\" của G, rồi tới G7. Hợp âm 7 nối hợp âm 7 như vậy là một chuỗi hợp âm 7 (hợp âm át 7 mở rộng, P3 bài 12): A7 kéo về D7, D7 kéo về G7. Chỉ cần D7 không chọi quá với nốt giai điệu là dùng được.", "tip": "Mỗi hợp âm 7 là \"mẹ\" của hợp âm kế tiếp: A7 → D7 → G7, nốt gốc đi xuống quãng 5 (A, G, F, E, D ra D).", "play": ["A7", "D7", "G7"]}, {"text": "Trong vòng I–VI–II–V (bài 11), chỗ Am có thể đổi thành A7, \"mẹ\" của Dm. Trước G7 lúc nào cũng chèn được Dm, \"chị\" của G7, nên đi Dm rồi mới qua G.", "tip": "Am7 thành A7 chỉ cần nâng C lên C# (bậc 3 trưởng).", "compare": {"a": {"label": "C – Am7 – Dm7 – G7", "play": ["C", "Am7", "Dm7", "G7"]}, "b": {"label": "C – A7 – Dm7 – G7", "play": ["C", "A7", "Dm7", "G7"]}}}, {"text": "Bản nhạc ghi C, nhưng thầy dùng F#m7(b5) ở chỗ đó (F#m7(b5) chung A, C, E với Am, hợp âm thay thế của C) để bass đi lên nửa cung F# về G. Nói chính xác nhất thì bass về G (C/G) là đúng, nhưng về C cũng không sao.", "tip": "F#m7(b5) = F# A C E: bỏ F# là còn đúng hợp âm Am.", "compare": {"a": {"label": "F#m7(b5) → C/G", "play": ["F#m7(b5)", "C/G"]}, "b": {"label": "F#m7(b5) → C", "play": ["F#m7(b5)", "C"]}}}, {"text": "Điệp khúc (chorus) phía sau vào F, nên cuối đoạn thầy tạo một II–V đẹp về F: Gm7 – C7, hoặc Gm7 – Gb7(#11) (\"bạn của mẹ\" của C7, màu #11). Đoạn kết (ending) thì dùng các mẫu có sẵn trong sách.", "tip": "Gb7(#11): tay phải hợp âm Ab, là hợp âm ba nốt cao hơn nốt gốc một cung (Gb lên một cung là Ab).", "compare": {"a": {"label": "Gm7 – C7 – F", "play": ["Gm7", "C7", "F"]}, "b": {"label": "Gm7 – Gb7(#11) – F", "play": ["Gm7", "Gb7(#11)", "F"]}}}], "remember": ["Đầu bài đơn giản: trước Dm chọn C#dim7, A7 hoặc Eb7; bass Bb đi trước báo b9 của A7.", "Đổi ý được: A7 → D7 → G7 (chuỗi hợp âm 7); Am thành A7; trước G7 chèn Dm.", "F#m7(b5) dẫn bass lên G; điệp khúc vào F thì làm Gm7 – C7 hoặc Gm7 – Gb7(#11)."], "items": [{"chord": "A7", "to": "D7", "prog": ["A7", "D7", "G7"]}, {"chord": "Eb7", "to": "Dm", "prog": ["C", "Eb7", "Dm"]}, {"chord": "Gb7(#11)", "to": "F", "prog": ["Gm7", "Gb7(#11)", "F"]}], "quiz": [{"q": "Sau A7, thầy \"đổi ý\" thêm D7. D7 đi về đâu?", "choices": ["Về G (G7), vì D7 là \"mẹ\" của G", "Về Dm, vì D7 là \"chị\" của Dm", "Về C, vì D7 là \"bạn của mẹ\" của C", "Về A, vì cùng nốt gốc"], "answer": "Về G (G7), vì D7 là \"mẹ\" của G", "why": "D7 là hợp âm át phụ của G, nên A7 → D7 → G7 là chuỗi hợp âm 7, mỗi hợp âm là \"mẹ\" của hợp âm sau."}, {"q": "Bản nhạc ghi C, thầy đặt F#m7(b5) ở đó. Sau F#m7(b5), bass đi đâu là chuẩn nhất?", "choices": ["Lên nửa cung về G (C/G)", "Xuống nửa cung về F", "Đứng yên ở F#", "Nhảy xuống Bb"], "answer": "Lên nửa cung về G (C/G)", "why": "Thầy nói chính xác nhất thì bass F# đi lên nửa cung về G; về C cũng không sao."}, {"q": "Vì sao đầu bài thầy cố ý chơi đơn giản?", "choices": ["Phần mở đầu chưa nên nhồi màu; càng về sau càng phức tạp", "Vì đầu bài không có hợp âm", "Vì ca sĩ chưa hát", "Vì hợp âm giảm không dùng được ở đầu bài"], "answer": "Phần mở đầu chưa nên nhồi màu; càng về sau càng phức tạp", "why": "Thầy nói đây là phần mở đầu nên chơi hơi đơn giản; màu tinh tế để dành cho các đoạn sau."}]},

  {"id": "p4-19", "part": 4, "src": "Phildave 4 · Bài 19", "title": "Vào Am: đi qua G/B, \"mẹ\" E7(b13 #9) và \"bạn của mẹ\" Bb7", "teach": [{"text": "Phần 3 là bài \"목마른 사슴\" (Như nai khát nước). Câu đầu đi từ C xuống Am (bản đơn giản: C – G/B – Am), nên hợp âm đích là Am. Cả phần này luyện đi vào Am và vào F bằng bốn đường: tiến hành đi qua, \"mẹ\", \"bạn của mẹ\" và hợp âm mượn.", "tip": "Gặp câu nào cũng tìm hợp âm đích trước, rồi mới chọn đường đi vào.", "compare": {"a": {"label": "Bản gốc: C – G/B – Am", "play": ["C", "G/B", "Am"]}, "b": {"label": "Tái hoà âm: C – E7(b13 #9) – Bb7(#11) – Am", "play": ["C", "E7(b13 #9)", "Bb7(#11)", "Am"]}}}, {"text": "Tiến hành đi qua đi xuống (경과적 하행 진행): C – G/B – Am. Đây là tiến hành tiêu biểu nhất và chỉ dùng hợp âm trong giọng: bass đi liền bậc C, B, A nên tự nó đã dẫn vào Am.", "tip": "G/B: tay trái B, tay phải G A D; bass đã có bậc 3 (B) nên tay phải thay B bằng 9 (G lên một cung là A).", "play": ["C", "G/B", "Am"]}, {"text": "Đi bằng hợp âm 7 (도미넌트 쇬븐진행): C – E7(b13 #9) – Am. Đích là Am nên đặt ngay \"mẹ\" của Am là E7. Về hợp âm thứ nên E7 mang màu biến đổi #9 (G) và b13 (C) (P3 bài 15). Tay phải bấm hợp âm C (C E G); sang Am thì C, E đứng yên, chỉ G đi lên A, nên nghe căng rồi về rất mượt.", "tip": "Tay trái E G# D, tay phải hợp âm C: C là b13, G là #9 của E7.", "play": ["C", "E7(b13 #9)", "Am"]}, {"text": "Kết hợp hai cách (2가지 진행방식 혼용): C – G/B – E7(b13) – Am. Bass đi xuống C, B như tiến hành đi qua, rồi E7(b13) là \"mẹ\" kéo về Am. b13 của E7 cũng chính là #5, nên E7(b13) còn gọi là E7 tăng (augmented).", "tip": "b13 của E7 là C: bậc 5 (B) nhích lên nửa cung là B#, cùng phím với C.", "play": ["C", "G/B", "E7(b13)", "Am"]}, {"text": "\"Bạn của mẹ\" (썹파이브): C – E7(b13 #9) – Bb7(#11) – Am. E7 và Bb7 chung tritone G#–D: bậc 3 và 7 của E7 (G#, D) chính là bậc 7 và 3 của Bb7 (Ab, D). Vì vậy Bb7 cũng kéo về Am, và bass Bb xuống A chỉ nửa cung.", "tip": "Bb7(#11): tay phải hợp âm C, là hợp âm ba nốt cao hơn nốt gốc một cung (Bb lên một cung là C). G# và Ab là cùng một phím đen.", "keys": ["Ab3", "D4"], "play": ["C", "E7(b13 #9)", "Bb7(#11)", "Am"]}], "remember": ["Đích là Am: đi qua C – G/B – Am, hoặc đặt \"mẹ\" E7 (màu #9, b13) ngay trước Am.", "b13 của E7 là C, cũng là #5: E7(b13) là E7 tăng.", "Bb7(#11) là \"bạn của mẹ\" thay E7 (chung G#–D), tay phải bấm hợp âm C."], "items": [{"chord": "G/B", "to": "Am", "prog": ["C", "G/B", "Am"]}, {"chord": "E7(b13)", "to": "Am", "prog": ["C", "G/B", "E7(b13)", "Am"]}, {"chord": "Bb7(#11)", "to": "Am", "prog": ["C", "E7(b13 #9)", "Bb7(#11)", "Am"]}], "quiz": [{"q": "Vì sao Bb7 kéo về Am được như E7?", "choices": ["Bb7 chung tritone G#–D với E7", "Bb7 là hợp âm trong giọng C", "Bb7 là \"chị\" của Am", "Bb7 có đủ ba nốt của Am"], "answer": "Bb7 chung tritone G#–D với E7", "why": "Bậc 3 và 7 của E7 (G#, D) chính là bậc 7 và 3 của Bb7 (Ab, D), nên Bb7 cũng kéo về Am."}, {"q": "Trong E7(b13), nốt b13 là nốt nào?", "choices": ["C", "C#", "B", "G"], "answer": "C", "why": "b13 của E7 là C, cũng là #5: B nhích lên nửa cung là B#, cùng phím với C."}, {"q": "Vì sao C – G/B – Am là tiến hành đi qua?", "choices": ["Bass đi liền bậc C, B, A, chỉ dùng hợp âm trong giọng", "Vì có hợp âm mượn", "Vì G/B là \"mẹ\" của Am", "Vì có hợp âm giảm"], "answer": "Bass đi liền bậc C, B, A, chỉ dùng hợp âm trong giọng", "why": "G/B nằm trong giọng C; bass đi từng bậc C, B, A nên tự nó dẫn vào Am."}]},

  {"id": "p4-20", "part": 4, "src": "Phildave 4 · Bài 20", "title": "Vào F: II–V, chia V làm hai, Fm6 và Bb7 mượn", "teach": [{"text": "Vị trí của II–V–I (투파이브원의 위치): ở chữ \"시냇물을 찾아\" (tìm dòng suối nước), câu đi về F, nên hợp âm đích là F. Thầy đặt II–V của F, tức cặp \"chị\" – \"mẹ\" đứng trước F: Gm7 là II (\"chị\"), C7 là V (\"mẹ\"). Ở đây C7 viết thành Bb/C, tức C7 9sus4.", "tip": "Bb/C: tay trái C, tay phải hợp âm Bb (C lùi một cung là Bb).", "compare": {"a": {"label": "Am7(9) – Gm7 – C7 – F", "play": ["Am7(9)", "Gm7", "C7", "F"]}, "b": {"label": "Am7(9) – Gm7 – Bb/C – F", "play": ["Am7(9)", "Gm7", "Bb/C", "F"]}}}, {"text": "Chia V làm hai (파이브를 둘로 나눈다): Am7(9) – Bb/C – Gb7(#11) – F. Lần này không dùng II, chỉ dùng V nhưng chia làm hai: trước là C7 9sus4 (Bb/C), sau là Gb7, \"bạn của mẹ\" thay C7. Thầy nói cả hai đều là \"C7\": Gb7 chung tritone E–Bb với C7, chỉ đổi nốt gốc.", "tip": "Gb7(#11): tay phải hợp âm Ab, là hợp âm ba nốt cao hơn nốt gốc một cung (Gb lên một cung là Ab).", "play": ["Am7(9)", "Bb/C", "Gb7(#11)", "F"]}, {"text": "Kết Amen xuất hiện (아멘종지 출현): ở chữ \"헤매이듯\" (như đang lang thang), thầy đi F – Fm/G. F đổi sang Fm là bước kết Amen (F → Fm), mượn từ C thứ. Fm/G vừa có màu Fm, vừa có bass G của hợp âm V (G7), nên câu nghe như treo trên G, chờ về C.", "tip": "Từ F sang Fm/G: tay phải chỉ hạ A xuống Ab, tay trái đổi F lên G.", "play": ["F", "Fm/G"]}, {"text": "Hợp âm mượn (모달인터체인지 코드): F – Fm6. Cùng chỗ đó, thầy thử Fm6, một hợp âm mượn khác từ C thứ. Fm6 có nốt Ab của C thứ nên nghe tối và ấm hơn F.", "tip": "Fm6 = F Ab C D: từ F, tay phải hạ A xuống Ab, còn F đổi thành D (nốt 6: C lên một cung là D).", "play": ["F", "Fm6"]}, {"text": "Hợp âm thay thế modal (모달의 대리코드): F – Bb7(#11). Ở đây Bb7 không phải \"bạn của mẹ\" của E7, mà dùng như hợp âm mượn từ C thứ. Bb7 có nốt Ab, nốt đặc trưng của C thứ, nên đứng chung nhóm với Fm.", "tip": "Bb7(#11): tay trái Bb D Ab, tay phải hợp âm C, là hợp âm ba nốt cao hơn nốt gốc một cung (Bb lên một cung là C).", "play": ["F", "Bb7(#11)"]}], "remember": ["Vào F: II–V là Gm7 – C7; C7 viết thành Bb/C (9sus4).", "Chỉ dùng V cũng được: Bb/C rồi Gb7(#11), cả hai đều là \"C7\".", "Ở chỗ F: Fm/G (kết Amen), Fm6 hay Bb7(#11), đều mượn từ C thứ."], "items": [{"chord": "Gb7(#11)", "to": "F", "prog": ["Am7(9)", "Bb/C", "Gb7(#11)", "F"]}, {"chord": "Fm6", "rel": "modal", "prog": ["F", "Fm6"]}, {"chord": "Bb7(#11)", "rel": "modal", "prog": ["F", "Bb7(#11)"]}], "quiz": [{"q": "Trong Am7(9) – Bb/C – Gb7(#11) – F, vì sao nói Bb/C và Gb7 đều là \"C7\"?", "choices": ["Bb/C là C7 9sus4, còn Gb7 chung tritone E–Bb với C7", "Vì cả hai có nốt gốc C", "Vì cả hai là hợp âm mượn", "Vì cả hai là hợp âm trong giọng F"], "answer": "Bb/C là C7 9sus4, còn Gb7 chung tritone E–Bb với C7", "why": "Bb/C là C7 có 9 và sus4; Gb7 là \"bạn của mẹ\" thay C7. Cả hai cùng làm việc của V về F."}, {"q": "F – Fm6: Fm6 làm màu F đổi thế nào, vì sao?", "choices": ["Tối và ấm hơn, vì có nốt Ab của C thứ", "Sáng hơn, vì có nốt A", "Căng như hợp âm 7, vì có tritone", "Không đổi, vì cùng nốt gốc F"], "answer": "Tối và ấm hơn, vì có nốt Ab của C thứ", "why": "Fm6 = F Ab C D: Ab là nốt của C thứ, nên Fm6 là hợp âm mượn, làm màu F tối và ấm đi."}]},

  {"id": "p4-21", "part": 4, "src": "Phildave 4 · Bài 21", "title": "Đoạn A': hợp âm mượn có Ab, Ab/Bb và Abm7 – Db7(#11)", "teach": [{"text": "Các hợp âm thay thế modal (모달코드의 대리코드들): đoạn A' hát lại giai điệu của đoạn A, nên phải đổi màu. Đoạn A đã rơi C – G/B – Am, lần này thầy đi hướng khác: C – Fm/G, theo màu C thứ. Thầy dặn nhớ bốn hợp âm mượn thay nhau được (P3 bài 20): Dm7(b5), Fm, Abmaj7, Bb7; cả bốn đều có nốt Ab, nên đổi qua lại mà vẫn giữ một màu C thứ.", "tip": "Ab là A hạ nửa cung: thấy phím Ab trong hợp âm là biết hợp âm đó mượn từ C thứ.", "compare": {"a": {"label": "Đoạn A: C – G/B – Am", "play": ["C", "G/B", "Am"]}, "b": {"label": "Đoạn A': C – Fm/G", "play": ["C", "Fm/G"]}}}, {"text": "Nốt trên cùng với hợp âm mượn (모달코드의 탑노트 사용법): C – Dbmaj7 – Fm7. Thầy nói đã vào màu Fm thì cứ đi theo âm giai F thứ tự nhiên: Dbmaj7 và Fm7 đều lấy nốt trong âm giai này. Nốt giai điệu trên cùng cũng chọn trong âm giai đó, nên cả câu liền một màu.", "tip": "Âm giai F thứ tự nhiên: F G Ab Bb C Db Eb, tức đi phím trắng từ F nhưng hạ A, B, D, E xuống phím đen.", "play": ["C", "Dbmaj7", "Fm7"]}, {"text": "Hợp âm hai tính chất (두가지 성질의 코드): C – Fm7 – Ab/Bb. Fm7 – Bb7 trông như II–V, nhưng câu không đi về Eb, nên đây chỉ là hai hợp âm mượn. Fm7 đi cặp với Abmaj7 hoặc Bb7; Bb7 viết thành 9sus4 là Ab/Bb.", "tip": "Ab/Bb: tay trái Bb, tay phải hợp âm Ab (Bb lùi một cung là Ab), tức Bb7 9sus4.", "play": ["C", "Fm7", "Ab/Bb"]}, {"text": "Nốt màu quyết định câu kết (텐션에 따라 결론이 다르다): C – Fm7 – Bb7(#11). Cùng Fm7 – Bb7, nhưng đổi nốt màu của Bb7 thì câu nghe khác hẳn: tay trái Bb7, tay phải hợp âm C cho ra 9, #11, 13.", "tip": "Bb7(#11): tay phải hợp âm C, là hợp âm ba nốt cao hơn nốt gốc một cung (Bb lên một cung là C); C, E, G là 9, #11, 13.", "compare": {"a": {"label": "Bb7 9sus4: C – Fm7 – Ab/Bb", "play": ["C", "Fm7", "Ab/Bb"]}, "b": {"label": "Bb7(#11): C – Fm7 – Bb7(#11)", "play": ["C", "Fm7", "Bb7(#11)"]}}}, {"text": "II liên quan (릴레이티드 투 마이너): C – Abm7 – Db7(#11). Db7 là \"bạn của mẹ\" thay G7 (chung tritone F–B). Hợp âm 7 nào cũng có \"chị\" riêng, nên trước Db7 đặt được Abm7, \"chị\" của Db7.", "tip": "Tìm \"chị\": từ Db đếm lên 5 tên nốt (Db, Eb, F, Gb, Ab) ra Ab, nên \"chị\" là Abm7. Db7(#11): tay phải hợp âm Eb, là hợp âm ba nốt cao hơn nốt gốc một cung.", "play": ["C", "Abm7", "Db7(#11)"]}], "remember": ["Đoạn A' phải khác đoạn A: đi theo màu C thứ; Dm7(b5), Fm, Abmaj7, Bb7 đều có Ab và thay nhau được.", "Đã vào Fm thì chọn nốt theo âm giai F thứ tự nhiên (F G Ab Bb C Db Eb).", "Bb7 9sus4 là Ab/Bb; Bb7(#11) là Bb7 + hợp âm C; trước Db7 đặt \"chị\" Abm7."], "items": [{"chord": "Dbmaj7", "rel": "modal", "prog": ["C", "Dbmaj7", "Fm7"]}, {"chord": "Bb7(#11)", "rel": "modal", "prog": ["C", "Fm7", "Bb7(#11)"]}, {"chord": "Abm7", "to": "Db7(#11)", "prog": ["C", "Abm7", "Db7(#11)"]}], "quiz": [{"q": "Mẹo nhận hợp âm mượn từ C thứ trong bài giọng C là gì?", "choices": ["Có nốt Ab", "Có nốt B", "Có nốt gốc C", "Có nốt màu 9"], "answer": "Có nốt Ab", "why": "Ab là màu rõ nhất của C thứ; Dm7(b5), Fm, Abmaj7, Bb7 đều có Ab."}, {"q": "Đã vào màu Fm, thầy chọn hợp âm và nốt trên cùng theo âm giai nào?", "choices": ["Âm giai F thứ tự nhiên (F G Ab Bb C Db Eb)", "Âm giai C trưởng (toàn phím trắng)", "Âm giai F trưởng (F G A Bb C D E)", "Đi từng nửa cung (chromatic)"], "answer": "Âm giai F thứ tự nhiên (F G Ab Bb C Db Eb)", "why": "Thầy nói đã vào màu Fm thì cứ đi theo âm giai F thứ tự nhiên: Dbmaj7, Fm7 và nốt trên cùng đều lấy từ đó, nên cả câu liền một màu."}, {"q": "Vì sao Abm7 đứng trước Db7?", "choices": ["Abm7 là \"chị\" (II liên quan) của Db7", "Abm7 là hợp âm trong giọng C", "Abm7 là \"mẹ\" của Db7", "Abm7 là hợp âm giảm"], "answer": "Abm7 là \"chị\" (II liên quan) của Db7", "why": "Hợp âm 7 nào cũng có \"chị\" riêng; từ Db đếm lên 5 tên nốt ra Ab, nên \"chị\" của Db7 là Abm7."}]},

  {"id": "p4-22", "part": 4, "src": "Phildave 4 · Bài 22", "title": "\"Bạn của mẹ\" mang #11, #9 đi cùng b13 và màu của II–V–I", "teach": [{"text": "Nhìn nốt màu là biết \"bạn của mẹ\" (썹파이브는 텐션을 보면 안다): ở chữ \"내 영혼 주를\" (Linh hồn con… Chúa), thầy đi C – G/B – Bb7(#11) – Am, hợp âm đích là Am. Bb7 là \"bạn của mẹ\" thay E7. Thầy nói \"bạn của mẹ\" luôn mang #11 (màu lydian dominant 9, #11, 13, P3 bài 22), nên thấy hợp âm 7 có #11 là đoán ngay nó là \"bạn của mẹ\". Bass rơi từng nửa cung C, B, Bb, A, nghe rất hay.", "tip": "#11 của Bb7 là E: nốt 4 tính từ Bb (Eb) nâng nửa cung; E cũng là nốt gốc của E7 mà Bb7 thay.", "compare": {"a": {"label": "C – G/B – Am", "play": ["C", "G/B", "Am"]}, "b": {"label": "C – G/B – Bb7(#11) – Am", "play": ["C", "G/B", "Bb7(#11)", "Am"]}}}, {"text": "Một chỗ, nhiều hợp âm (코드를 보면 여러코드가): chỗ trước Am đặt được nhiều hợp âm mà vẫn về Am. Ngoài Bb7(#11), thầy thử E/G# (E7 đảo 1), E7(b13 #9), và cả hợp âm giảm G#°7. Thầy còn nói: sau \"bạn của mẹ\" cũng dùng được hợp âm giảm 7; cái gì cũng được, miễn là về Am.", "tip": "G#°7 = G# B D F, chính là E7(b9) bỏ nốt gốc E; bass G# đi lên A nên viết bằng dấu thăng.", "compare": {"a": {"label": "C – G/B – E7(b13 #9) – Am", "play": ["C", "G/B", "E7(b13 #9)", "Am"]}, "b": {"label": "C – G/B – G#°7 – Am", "play": ["C", "G/B", "G#°7", "Am"]}}}, {"text": "Đổi màu lệch thời điểm (텐션의 시간차 변화): C – E7(b13 #9) – E7(13). Giai điệu là G, nên E7 dùng #9 (chính là G) để khỏi chọi; #9 luôn đi cùng b13 (cặp màu biến đổi: #9 với b13, hoặc b9 với b13). Về hợp âm thứ thì màu biến đổi hợp nhất, nhưng đánh muộn một chút thì 13 tự nhiên (C#) vẫn vào được.", "tip": "C lên C# và G lên G# (mỗi nốt nửa cung), E lên F# (một cung); C thành C# là b13 đổi thành 13.", "play": ["C", "E7(b13 #9)", "E7(13)"]}, {"text": "Nốt màu của II–V–I (투파이브원의 텐션들): ở chữ \"찾기에 갈급\", thầy đi Am7(9) – Gm7(9) – C7(b13) – F. Thêm 9 vào Gm7 nghe giàu hơn hẳn; C7 mang b13, mà b13 cũng là #5 như hợp âm tăng.", "tip": "C7(b13): tay trái C Bb, tay phải E Ab; Ab là G nhích lên nửa cung (#5), rồi đi tiếp lên A, bậc 3 của F.", "compare": {"a": {"label": "Am7(9) – Gm7 – C7 – F", "play": ["Am7(9)", "Gm7", "C7", "F"]}, "b": {"label": "Am7(9) – Gm7(9) – C7(b13) – F", "play": ["Am7(9)", "Gm7(9)", "C7(b13)", "F"]}}}], "remember": ["\"Bạn của mẹ\" luôn mang #11: Bb7(#11) thay E7, bass C, B, Bb, A rơi từng nửa cung.", "Chỗ trước Am đặt được nhiều hợp âm: E/G#, E7(b13 #9), G#°7, Bb7(#11).", "#9 luôn đi cùng b13; đánh muộn một chút thì đổi sang 13 tự nhiên được."], "items": [{"chord": "Bb7(#11)", "to": "Am", "prog": ["C", "G/B", "Bb7(#11)", "Am"]}, {"chord": "E7(b13 #9)", "to": "E7(13)", "rel": "line", "prog": ["C", "E7(b13 #9)", "E7(13)"], "why": "E7(b13 #9) và E7(13) giữ chung nốt gốc E; tay phải C E G nhích lên C# F# G#, nên b13 (C) thành 13 (C#)."}, {"chord": "C7(b13)", "to": "F", "prog": ["Am7(9)", "Gm7(9)", "C7(b13)", "F"]}], "quiz": [{"q": "Vì sao E7 ở đây dùng #9?", "choices": ["Giai điệu là G, mà #9 của E7 chính là G nên không chọi", "Vì E7 về hợp âm trưởng", "Vì #9 đi cùng 13 tự nhiên", "Vì E7 là hợp âm mượn"], "answer": "Giai điệu là G, mà #9 của E7 chính là G nên không chọi", "why": "Nốt giai điệu G nằm sẵn trong E7(b13 #9) (là #9), nên hợp âm và giai điệu không va nhau."}, {"q": "Nốt màu nào luôn có trên \"bạn của mẹ\"?", "choices": ["#11", "b9", "#9", "b13"], "answer": "#11", "why": "\"Bạn của mẹ\" như Bb7 luôn mang #11 (E), cũng là nốt gốc của E7 mà nó thay."}, {"q": "#9 thường đi cặp với nốt màu nào?", "choices": ["b13", "13", "9", "#11"], "answer": "b13", "why": "Màu biến đổi đi với màu biến đổi: #9 đi cùng b13 (hoặc b9 đi cùng b13)."}]},

  {"id": "p4-23", "part": 4, "src": "Phildave 4 · Bài 23", "title": "9sus4, Fm/G đủ ba nốt, sus4 về b9 và chọn Fm6 hay Fm7", "teach": [{"text": "9sus4 (나인써스포): ở chữ \"하나이\" (Con khát khao Ngài), bản gốc ghi F – G(sus4). Vì đây là G7 nên thầy làm thành 9sus4: F – F/G. F/G có thêm nốt 7 (F) và 9 (A) của G7, nên giàu hơn G(sus4) mà vẫn treo.", "tip": "F/G: tay trái G, tay phải hợp âm F (G lùi một cung là F).", "compare": {"a": {"label": "Bản gốc: F – G(sus4)", "play": ["F", "G(sus4)"]}, "b": {"label": "F – F/G (G7 9sus4)", "play": ["F", "F/G"]}}}, {"text": "Những hợp âm có thể nghĩ tới (상상할 수 있는 여러코드들): F – Fm/G, dùng Fm mượn từ C thứ. Thầy dặn Fm phải bấm đủ ba nốt (gốc, bậc 3, bậc 5) rồi đặt nốt giai điệu lên trên cùng; đủ ba nốt thì tai mới nghe rõ màu Fm.", "tip": "Fm/G: tay trái G, tay phải đủ hợp âm Fm (F Ab C); Ab là A hạ nửa cung.", "play": ["F", "Fm/G"]}, {"text": "Trung thành với cơ bản (기본에도 충실하자): F – G(sus4) – G7(b9). Đưa bậc 4 (C) về bậc 3 (B) là cách giải quyết sus4 cơ bản nhất; thêm b9 cho G7 căng hơn: Ab nằm ngay trên G nửa cung, nên khi về C nó trượt xuống G, kéo mạnh hơn.", "tip": "C (bậc 4) xuống B (bậc 3), còn G trên cùng nhích lên nửa cung thành Ab (b9).", "play": ["F", ["G2", "C4", "D4", "G4"], ["G2", "F3", "B3", "D4", "Ab4"]]}, {"text": "\"Bạn của mẹ\" hoặc hợp âm mượn (썹파이브 또는 모달): F – Bb7(#11). Bb7 có thể hiểu là \"bạn của mẹ\" của E7, nhưng ở đây thầy dùng như hợp âm mượn: Fm và Bb7 là một cặp mượn từ C thứ, đi cùng nhau.", "tip": "Bb7(#11): tay trái Bb D Ab, tay phải hợp âm C, là hợp âm ba nốt cao hơn nốt gốc một cung (Bb lên một cung là C).", "play": ["F", "Bb7(#11)"]}, {"text": "Giai điệu quyết định chọn Fm6 hay Fm7: ở đây giai điệu là E. Fm7 có Eb, chỉ cách E nửa cung, nên chọi; Fm6 thay Eb bằng D nên nghe êm. Fm6 = F Ab C D cũng chính là Dm7(b5) (D F Ab C) có F ở bass, nên vẫn là hợp âm mượn.", "tip": "Nốt 6 của Fm6 là D (C lên một cung); nốt 7 của Fm7 là Eb (F lùi một cung).", "compare": {"a": {"label": "Fm7 với giai điệu E", "play": [["F2", "Ab3", "C4", "Eb4", "E5"]]}, "b": {"label": "Fm6 với giai điệu E", "play": [["F2", "Ab3", "C4", "D4", "E5"]]}}}], "remember": ["Bản gốc ghi sus4 mà là G7 thì làm thành 9sus4: F/G.", "Fm/G: bấm đủ ba nốt Fm, nốt giai điệu ở trên; G(sus4) – G7(b9): C xuống B, G lên Ab.", "Fm và Bb7 là cặp mượn từ C thứ; giai điệu E thì chọn Fm6 (D), không chọn Fm7 (Eb)."], "items": [{"chord": "G(sus4)", "to": "G7(b9)", "rel": "line", "prog": ["F", "G(sus4)", "G7(b9)"]}, {"chord": "Fm/G", "rel": "modal", "prog": ["F", "Fm/G"]}, {"chord": "Bb7(#11)", "rel": "modal", "prog": ["F", "Bb7(#11)"]}], "quiz": [{"q": "Giai điệu là E. Vì sao thầy chọn Fm6 thay vì Fm7?", "choices": ["Eb của Fm7 cách E nửa cung nên chọi; Fm6 có D thay Eb", "Vì Fm6 là hợp âm trong giọng C", "Vì Fm7 không phải hợp âm mượn", "Vì Fm6 có nốt E"], "answer": "Eb của Fm7 cách E nửa cung nên chọi; Fm6 có D thay Eb", "why": "Fm6 = F Ab C D không có Eb, nên không va với nốt giai điệu E."}, {"q": "Bản gốc ghi G(sus4). Vì sao thầy chơi F/G?", "choices": ["Đó là G7, nên làm thành 9sus4 (thêm nốt 7 F và 9 A)", "Vì F/G là hợp âm mượn", "Vì G(sus4) bấm sai", "Vì F/G là \"bạn của mẹ\" của C"], "answer": "Đó là G7, nên làm thành 9sus4 (thêm nốt 7 F và 9 A)", "why": "F/G = G + F A C: có nốt 7 và 9 của G7, bậc 4 (C) vẫn treo, nên là G7 9sus4."}]},

  {"id": "p4-24", "part": 4, "src": "Phildave 4 · Bài 24", "title": "II–V vào giọng thứ: Bm7(b5) – E7 màu biến đổi và biến thể", "teach": [{"text": "II–V vào giọng thứ: đoạn \"능력\" (năng lực) là điểm nhấn lớn của bài, phải vào Am thật đẹp bằng II–V, nên hợp âm đích là Am. Nhắc lại: II–V là cặp \"chị\" – \"mẹ\" đứng trước đích. Về giọng trưởng thì II là hợp âm m7 và V mang nốt màu tự nhiên (9, 13), như Dm7 – G7(13) – C.", "compare": {"a": {"label": "Vào C: Dm7 – G7(13) – C", "play": ["Dm7", "G7(13)", "C"]}, "b": {"label": "Chỉ G7 → C", "play": ["G7", "C"]}}}, {"text": "Về giọng thứ thì khác: II là m7(b5) và V mang màu biến đổi, như Bm7(b5) – E7(b9) – Am. Lý do: trong giọng A thứ, hợp âm bậc II là Bm7(b5) (P3 bài 25), và \"mẹ\" về hợp âm thứ hợp màu biến đổi (P3 bài 15). Khung 1–3–7 của V (E, G#, D) vẫn giữ nguyên, chỉ đổi nốt màu.", "tip": "Bm7(b5) là Bm7 hạ bậc 5 nửa cung: F# xuống F, nên chỉ dùng phím trắng B D F A.", "compare": {"a": {"label": "Vào C: Dm7 – G7(13) – C", "play": ["Dm7", "G7(13)", "C"]}, "b": {"label": "Vào Am: Bm7(b5) – E7(b9) – Am", "play": ["Bm7(b5)", "E7(b9)", "Am"]}}}, {"text": "Ba line màu biến đổi (얼터드 텐션 라인 1–3): C – Bm7(b5) rồi E7(b9), E7(b13 #9) hoặc E7(b13); mỗi line đều về Am. Ba line chỉ khác nốt màu của E7; nút Nghe phát ba line nối nhau. Thầy dặn học thuộc cả ba, rồi có thể đổi màu lệch thời điểm.", "tip": "Nốt màu của E7: b9 là F (E nhích lên nửa cung), #9 là G, b13 là C.", "play": ["Bm7(b5)", "E7(b9)", "Am", "Bm7(b5)", "E7(b13 #9)", "Am", "Bm7(b5)", "E7(b13)", "Am"]}, {"text": "Nốt màu tự nhiên (내추럴텐션): C – Bm7(b5) – E7(13) – Am. Lẽ ra E7 mang màu biến đổi, nhưng thầy dùng 13 tự nhiên (C#, màu của mixolydian) và nghe vẫn rất đẹp. Đây là một biến thể, không phải cách chuẩn.", "tip": "13 của E7 là C#: đếm 6 tên nốt từ E theo giọng E (E, F#, G#, A, B, C#).", "play": ["C", "Bm7(b5)", "E7(13)", "Am"]}, {"text": "II là hợp âm m7 (투(마이너쇬븐)): C – Bm7 – E7(b9) – Am. Lần đầu dùng Bm7(b5) là chuẩn; đến lần hát lại sau dấu quay lại, ai cũng chờ câu cũ, nên thầy đổi thành Bm7 cho câu có biến hoá.", "tip": "Bm7 khác Bm7(b5) đúng một nốt: F# thay cho F.", "compare": {"a": {"label": "Lần đầu: C – Bm7(b5) – E7(b9) – Am", "play": ["C", "Bm7(b5)", "E7(b9)", "Am"]}, "b": {"label": "Lần lặp: C – Bm7 – E7(b9) – Am", "play": ["C", "Bm7", "E7(b9)", "Am"]}}}, {"text": "Lực kéo về chủ và tiến hành đi qua (도미넌트모션과 경과적진행): C – Bm7 – Bb7(#11) – Am. Bb7, \"bạn của mẹ\", thay E7, nên bass đi C, B, Bb, A từng nửa cung. Thầy còn thêm dòng blues (blues line): một câu giai điệu ngắn lướt qua nốt Eb (nốt đặc trưng của nhạc blues ở giọng C) rồi rơi xuống, như E, Eb, D, C trên Bb7(#11). Trước \"bạn của mẹ\" dùng m7(b5) hay m7 đều được: \"Có quy tắc, nhưng trong phạm vi quy tắc đó phải thật tự do.\"", "tip": "Bb7(#11): tay phải hợp âm C, là hợp âm ba nốt cao hơn nốt gốc một cung (Bb lên một cung là C).", "play": ["Bb7(#11)", ["E4"], ["Eb4"], ["D4"], ["C4"], "Am"], "compare": {"a": {"label": "C – Bm7(b5) – Bb7(#11) – Am", "play": ["C", "Bm7(b5)", "Bb7(#11)", "Am"]}, "b": {"label": "C – Bm7 – Bb7(#11) – Am", "play": ["C", "Bm7", "Bb7(#11)", "Am"]}}}], "remember": ["Về giọng thứ: II là m7(b5), V mang màu biến đổi (b9, #9 với b13, hoặc b13); khung 1–3–7 của V giữ nguyên.", "E7(13) là biến thể; lần hát lại đổi Bm7(b5) thành Bm7 cho có biến hoá.", "Bb7(#11) thay E7: bass C, B, Bb, A; có quy tắc, nhưng trong quy tắc phải thật tự do."], "items": [{"chord": "Bm7(b5)", "to": "E7(b9)", "prog": ["C", "Bm7(b5)", "E7(b9)", "Am"]}, {"chord": "E7(13)", "to": "Am", "prog": ["C", "Bm7(b5)", "E7(13)", "Am"]}, {"chord": "Bb7(#11)", "to": "Am", "prog": ["C", "Bm7", "Bb7(#11)", "Am"]}], "quiz": [{"q": "II–V vào Am chuẩn nhất là gì?", "choices": ["Bm7(b5) – E7 mang màu biến đổi", "Bm7 – E7(13)", "Dm7 – G7(13)", "Bbmaj7 – E7"], "answer": "Bm7(b5) – E7 mang màu biến đổi", "why": "Về giọng thứ thì II là m7(b5) và V mang màu biến đổi (b9, #9, b13)."}, {"q": "Vì sao lần hát lại thầy đổi Bm7(b5) thành Bm7?", "choices": ["Để câu hát lại có biến hoá", "Vì Bm7(b5) sai", "Vì Bm7 là \"bạn của mẹ\"", "Vì bài đổi sang giọng trưởng"], "answer": "Để câu hát lại có biến hoá", "why": "Lần đầu dùng Bm7(b5) là chuẩn; lần lặp ai cũng chờ câu cũ, nên đổi một nốt là thấy mới."}, {"q": "E7(13) trước Am được xem là gì?", "choices": ["Một biến thể, vì lẽ ra dùng màu biến đổi", "Cách chuẩn nhất vào Am", "Hợp âm mượn từ C thứ", "Hợp âm giảm đi qua"], "answer": "Một biến thể, vì lẽ ra dùng màu biến đổi", "why": "Về hợp âm thứ thì chuẩn là màu biến đổi; 13 tự nhiên vẫn đẹp nhưng là biến thể."}]},

  {"id": "p4-25", "part": 4, "src": "Phildave 4 · Bài 25", "title": "Điệp khúc: Am/G, Am(M7), F#m7(b5) và cliché A–G#–G–F#", "teach": [{"text": "Tiến hành đi qua ở giọng thứ (마이너의 경과적진행): điệp khúc bắt đầu ở chữ \"주님만이\" (Chúa ơi…), và thầy nói dòng bass đi về F, nên hợp âm đích là F. Thầy đi Am – Am/G: tay phải giữ nguyên Am, chỉ tay trái rơi xuống, tai vẫn nghe màu Am.", "tip": "Am/G: tay trái G (A lùi một cung), tay phải vẫn là hợp âm Am (A C E).", "play": ["Am", "Am/G"]}, {"text": "Hợp âm thứ – 7 trưởng (마이너 메이저 쇬븐): Am – Am(M7). Ở chỗ có ghi hợp âm Am, thầy chỉ bấm thêm nốt 7 trưởng (G#) là ra Am(M7), màu thứ nghe căng và đẹp hơn: G# chỉ cách A nửa cung, nên hợp âm đứng yên có thêm một nốt muốn chuyển động.", "tip": "Nốt 7 trưởng là nốt gốc lùi nửa cung: A lùi nửa cung là G#.", "play": ["Am", "Am(M7)"]}, {"text": "Hợp âm thay thế hợp âm I (1도화음의 대리코드들): Am – F#m7(b5). F#m7(b5) = F# A C E: tay phải vẫn là hợp âm Am, chỉ nốt bass đổi thành F#, nên gọi là Am/F# cũng được. Tên trông khó nhưng thực chất đơn giản: Am thay được cho C (hợp âm I), nên F#m7(b5) cũng thay được.", "tip": "F#m7(b5): tay trái F#, tay phải hợp âm Am như cũ.", "play": ["Am", ["F#2", "C4", "E4", "A4"]]}, {"text": "Cliché giọng thứ (마이너의 클리셰진행): Am9 – Am(M7) – Am7 – Am6 (hợp âm đầu, nói chính xác, là Am(add2): xem màn sau). Nốt trên cùng rơi từng nửa cung: A, G#, G, F#, giống cliché Dm ở bài 2.", "tip": "Tay trái giữ A, tay phải giữ C E (hợp âm đầu có thêm B chen giữa); chỉ ngón trên cùng đi xuống từng phím: A, G#, G, F#.", "play": [["A2", "B3", "C4", "E4", "A4"], ["A2", "C4", "E4", "G#4"], ["A2", "C4", "E4", "G4"], ["A2", "C4", "E4", "F#4"]]}, {"text": "Thầy nói chữ Am9 ở đầu cliché, nói chính xác, là add2: add2 là nốt chen vào giữa, 9 là nốt đặt trên bậc 7. Không có bậc 7 thì nốt B chen giữa thế bấm gọi là add2; có bậc 7 (G) rồi B đặt lên trên mới thật sự là 9.", "tip": "Nốt 2 và nốt 9 đều là B (A lên một cung); chỉ khác ở chỗ có bậc 7 hay không.", "compare": {"a": {"label": "Am(add2): B chen vào giữa", "play": [["A2", "B3", "C4", "E4", "A4"]]}, "b": {"label": "Am9: B đặt trên bậc 7 (G)", "play": [["A2", "C4", "E4", "G4", "B4"]]}}}], "remember": ["Am – Am/G: tay phải giữ Am, chỉ bass rơi xuống; Am(M7) thêm G# (A lùi nửa cung).", "F#m7(b5) là Am trên bass F#, thay được hợp âm I như Am.", "Cliché Am: nốt trên cùng A, G#, G, F#; add2 là nốt chen vào giữa, 9 là nốt đặt trên bậc 7."], "items": [{"chord": "Am(M7)", "to": "Am7", "rel": "line", "prog": ["Am9", "Am(M7)", "Am7", "Am6"], "top": ["A", "G#", "G", "F#"]}, {"chord": "F#m7(b5)", "to": "Am", "rel": "sub", "prog": ["Am", "F#m7(b5)"]}], "quiz": [{"q": "F#m7(b5) bấm thế nào cho dễ?", "choices": ["Tay trái F#, tay phải hợp âm Am", "Tay trái F#, tay phải hợp âm F#", "Tay trái A, tay phải hợp âm F", "Tay trái F, tay phải hợp âm Am"], "answer": "Tay trái F#, tay phải hợp âm Am", "why": "F#m7(b5) = F# A C E: ba nốt A C E chính là hợp âm Am, chỉ thêm F# ở bass."}, {"q": "add2 khác 9 ở chỗ nào?", "choices": ["add2 không có bậc 7, nốt chen vào giữa; 9 đặt trên bậc 7", "add2 cao hơn 9 một quãng 8", "Không khác gì", "9 không có bậc 7"], "answer": "add2 không có bậc 7, nốt chen vào giữa; 9 đặt trên bậc 7", "why": "Thầy nói: có bậc 7 thì nốt đó mới thật sự là 9; không có bậc 7 thì gọi là add2."}, {"q": "Trong cliché Am9 – Am(M7) – Am7 – Am6, nốt nào rơi dần?", "choices": ["A, G#, G, F#", "C, B, Bb, A", "E, D#, D, C#", "A, B, C, D"], "answer": "A, G#, G, F#", "why": "Nốt A trên cùng rơi từng nửa cung: A (Am), G# (7 trưởng), G (7), F# (6)."}]},

  {"id": "p4-26", "part": 4, "src": "Phildave 4 · Bài 26", "title": "Đảo 1 của C, A7(b9), C#°7 và sus4 về b9 để vào Dm", "teach": [{"text": "Phần 4 luyện đảo hợp âm (đặt một nốt khác nốt gốc xuống bass, bài 2) và cách đi về hợp âm thứ (Dm, Am). Vì đích là hợp âm thứ, \"mẹ\" dẫn vào nó sẽ mang màu biến đổi (P3 bài 15). Ở chữ \"나의 힘 나\" (Nguồn sức của con), câu đi về Dm.", "compare": {"a": {"label": "A7 → Dm", "play": ["A7", "Dm"]}, "b": {"label": "A7(b9) → Dm (màu biến đổi)", "play": ["A7(b9)", "Dm"]}}}, {"text": "Đảo hợp âm trong giọng (다이어토닉코드의 전위): thầy đi F – C/E, tức C đảo 1 (bậc 3 E ở bass). Trên đảo 1 của C, tay phải không lặp E mà thêm một nốt khác, và có hai sound (1전위의 두가지 사운드): thêm add2 (D) nghe ổn định, thêm maj7 (B) nghe phức tạp hơn.", "tip": "C/E: tay trái E, tay phải C D G (D là C lên một cung); muốn màu maj7 thì đổi D thành B (C lùi nửa cung).", "compare": {"a": {"label": "F – C/E có add2 (D)", "play": ["F", ["E2", "|", "C4", "D4", "G4"]]}, "b": {"label": "F – C/E có maj7 (B)", "play": ["F", ["E2", "|", "B3", "C4", "G4"]]}}}, {"text": "Đảo 1 có tính trung lập (1전위 코드의 중립성): F – Dm7 – C/E – Am7. Có bốn hợp âm nên mỗi hợp âm một phách; giai điệu là nốt chấm dôi nhưng piano vẫn đi đều từng phách. Đảo 1 không vững như thế gốc, nên C/E làm hợp âm nối giữa Dm7 và Am7 rất tự nhiên; bass đi F, D, E, A.", "tip": "Đếm 1, 2, 3, 4: mỗi phách đổi một hợp âm, đừng chờ nốt giai điệu.", "play": ["F", "Dm7", "C/E", "Am7"]}, {"text": "Flat nine (플렛나인): ở chữ \"의 방패 나의\", thầy đi F – A7(b9) rồi về Dm. Hợp âm 7 đi về hợp âm thứ thì dùng màu biến đổi, nên thầy gắn dấu giáng vào nốt màu: b9 (Bb), trượt xuống A, nốt của Dm.", "tip": "b9 của A7 là A nhích lên nửa cung (Bb); trên đàn Bb nằm trên cùng tay phải.", "compare": {"a": {"label": "F – A7 – Dm", "play": ["F", "A7", "Dm"]}, "b": {"label": "F – A7(b9) – Dm", "play": ["F", "A7(b9)", "Dm"]}}}, {"text": "Hợp âm giảm thay cho \"mẹ\" của Dm (세도의 대리코드 디미니쉬): F – C#°7 – Dm. C#°7 là A7(b9) bỏ nốt gốc A (bài 1), nên thay được A7. Thầy nói tay phải đánh nốt giọng trong (nốt nằm giữa) lên một quãng 8 thì thành thế bấm hợp âm giảm đẹp, các nốt trải đều hơn.", "tip": "C#°7: tay trái C#, tay phải hợp âm Edim (E G Bb).", "compare": {"a": {"label": "F – A7(b9) – Dm", "play": ["F", "A7(b9)", "Dm"]}, "b": {"label": "F – C#°7 – Dm, rồi G đưa lên một quãng 8", "play": ["F", "C#°7", "Dm", ["C#3", "|", "E4", "Bb4", "G5"], "Dm"]}}}, {"text": "Ở bass C#, thầy nhắc đừng lẫn hai hợp âm: A/C# là A đảo 1 (C# E A, chưa có nốt 7), còn C#°7 là C# E G Bb. Cả hai cùng bass C# và cùng dẫn lên Dm, nhưng C#°7 có G và Bb nên căng hơn hẳn.", "compare": {"a": {"label": "F – A/C# – Dm", "play": ["F", ["C#2", "A3", "E4", "A4"], "Dm"]}, "b": {"label": "F – C#°7 – Dm", "play": ["F", "C#°7", "Dm"]}}}, {"text": "Giải quyết sus4 và flat nine (써스포의 해결과 플렛나인): F – A(sus4) – A7(b9). Sus4 gọn chỉ làm nổi bậc 4 (D), còn 9sus4 (G/A) hiện cả màu hợp âm G. Khi sus4 giải quyết về A7 thì thêm b9 luôn.", "tip": "D (bậc 4) xuống C# (bậc 3), còn A trên cùng nhích lên nửa cung thành Bb (b9).", "compare": {"a": {"label": "9sus4: F – G/A – A7(b9)", "play": ["F", "G/A", "A7(b9)"]}, "b": {"label": "Sus4 gọn: F – A(sus4) – A7(b9)", "play": ["F", ["A2", "|", "D4", "E4", "A4"], ["A2", "G3", "|", "C#4", "E4", "Bb4"]]}}}], "remember": ["Đảo 1 C/E: add2 (D) nghe ổn định, maj7 (B) phức tạp hơn; F – Dm7 – C/E – Am7 thì mỗi hợp âm một phách.", "Về hợp âm thứ Dm thì A7 mang màu biến đổi: b9 (Bb), đẹp nhất là b9 với b13; C#°7 thay được A7.", "A(sus4) – A7(b9): D xuống C#, A lên Bb; A/C# khác C#°7."], "items": [{"chord": "A7(b9)", "to": "Dm", "prog": ["F", "A7(b9)", "Dm"]}, {"chord": "C#°7", "to": "Dm", "prog": ["F", "C#°7", "Dm"]}, {"chord": "A(sus4)", "to": "A7(b9)", "rel": "line", "prog": ["F", "A(sus4)", "A7(b9)"]}], "quiz": [{"q": "Trên C/E, thêm add2 và thêm maj7 khác nhau thế nào?", "choices": ["add2 (D) nghe ổn định, maj7 (B) nghe phức tạp hơn", "add2 (D) nghe phức tạp, maj7 (B) nghe ổn định", "Cả hai biến C/E thành hợp âm mượn", "maj7 thêm nốt Bb (C lùi một cung)"], "answer": "add2 (D) nghe ổn định, maj7 (B) nghe phức tạp hơn", "why": "Thầy gọi đó là hai sound của đảo 1: thêm D (C lên một cung) nghe ổn định; thêm B (C lùi nửa cung, nốt 7 của Cmaj7) nghe phức tạp hơn."}, {"q": "A/C# và C#°7 khác nhau thế nào?", "choices": ["A/C# là C# E A (A đảo 1), còn C#°7 là C# E G Bb", "Không khác gì, chỉ khác tên", "A/C# là hợp âm giảm, C#°7 là hợp âm trưởng", "C#°7 là hợp âm A có bass C#"], "answer": "A/C# là C# E A (A đảo 1), còn C#°7 là C# E G Bb", "why": "Cùng bass C#, nhưng A/C# là hợp âm A trưởng; C#°7 là hợp âm giảm, tức A7(b9) bỏ nốt A."}, {"q": "Sus4 gọn khác 9sus4 ở chỗ nào?", "choices": ["Sus4 gọn làm nổi bậc 4; 9sus4 hiện cả màu hợp âm ba nốt (G/A có hợp âm G)", "Sus4 gọn có thêm nốt 9", "9sus4 không cần giải quyết", "Không khác gì"], "answer": "Sus4 gọn làm nổi bậc 4; 9sus4 hiện cả màu hợp âm ba nốt (G/A có hợp âm G)", "why": "A(sus4) = A D E chỉ nhấn bậc 4 (D); G/A có cả hợp âm G trên bass A nên màu dày hơn."}]},

  {"id": "p4-27", "part": 4, "src": "Phildave 4 · Bài 27", "title": "A7/E, II–V về hợp âm thay thế, Eb7(#11) và chia Dm", "teach": [{"text": "Hợp âm 7 đổi nốt bass (도미넌트쎄븐의 3전위): tiếp câu \"나의 힘\" (Nguồn sức của con), câu vẫn đi về Dm, thầy đi F – A7/E – Dm. A7/E là A7 với bass E. Sách ghi đảo 3, nhưng bass E là bậc 5 của A7 nên thật ra là đảo 2 (đảo 1 là bậc 3 ở bass, đảo 3 là bậc 7 ở bass).", "compare": {"a": {"label": "F – A7 – Dm", "play": ["F", "A7", "Dm"]}, "b": {"label": "F – A7/E – Dm", "play": ["F", ["E2", "G3", "|", "A3", "C#4"], "Dm"]}}}, {"text": "Vì sao A7/E hay? A7 có lực kéo về Dm nhờ tritone C#–G, còn bass F, E, D đi xuống liền bậc là một lực nữa của tiến hành đi qua; hai lực cộng lại. Thầy dặn bấm đủ bốn nốt E, G, A, C#, trải rộng và không lặp nốt nào thì nghe đẹp hơn.", "tip": "A7/E: tay trái E G (bậc 5 và bậc 7 của A7), tay phải A C#; bốn nốt khác nhau, không nốt nào lặp lại.", "keys": ["E2", "G3", "|", "A3", "C#4"], "play": ["F", ["E2", "G3", "|", "A3", "C#4"], "Dm"]}, {"text": "Giải quyết bằng hợp âm thay thế (대리코드로도 해결한다): F – Gm7 – C7. Gm7 – C7 là II–V của F nên tai chờ về F, nhưng thầy về Dm, \"dự đoán bị đổi\". Không lạ, vì Dm là hợp âm thay thế của F: hai hợp âm chung nhiều nốt.", "tip": "Dm7 = D F A C chứa trọn hợp âm F (F A C), nên Dm thay được F.", "compare": {"a": {"label": "Gm7 – C7 – F (tai chờ)", "play": ["F", "Gm7", "C7", "F"]}, "b": {"label": "Gm7 – C7 – Dm (đổi dự đoán)", "play": ["F", "Gm7", "C7", "Dm"]}}}, {"text": "Nhìn \"bạn của mẹ\" thấy dạng gốc (썹파이브를 보면 원형을): F – Eb7(#11) – Dm. Eb7 chung tritone với A7, nên là \"bạn của mẹ\" của Dm; hai hợp âm chỉ khác nốt màu. A7 dùng màu biến đổi, còn Eb7 dùng #11.", "tip": "Eb7(#11): tay phải hợp âm F, là hợp âm ba nốt cao hơn nốt gốc một cung (Eb lên một cung là F). Tritone chung: A7 có C# và G, Eb7 có G và Db (cùng phím C#).", "compare": {"a": {"label": "F – A7(b9) – Dm", "play": ["F", "A7(b9)", "Dm"]}, "b": {"label": "F – Eb7(#11) – Dm", "play": ["F", "Eb7(#11)", "Dm"]}}}, {"text": "Cách chia hợp âm (코드를 나누는 방법): ở chữ \"참소망\" (Hy vọng thật), thầy đi Dm – Dm(M7) – E(sus4) – E7. Hợp âm thứ đứng yên lâu nghe nhạt, nên chia nhỏ nó bằng hợp âm thứ – 7 trưởng. E(sus4) rồi E7 dẫn về Am, vì E7 là \"mẹ\" của Am.", "tip": "Dm(M7) thêm C# (D lùi nửa cung); E(sus4) → E7: A (bậc 4) xuống G# (bậc 3).", "play": ["Dm", "Dm(M7)", "E(sus4)", "E7"]}, {"text": "Sus4 căng thẳng (긴장감있는 써스포): Dm7 – E(sus4)/B – E7 – E/G#. Treo E(sus4) trên bass B cho căng rồi mới giải quyết về E7. \"Chị\" của E7 ở đây là Bm7(b5), và trên E7 thầy dùng #9 với b13, vì E7 về hợp âm thứ Am.", "tip": "E7(b13 #9): tay trái E G# D, tay phải hợp âm C (C E G); G là #9, C là b13.", "compare": {"a": {"label": "Dm7 – E(sus4)/B – E7 – E/G#", "play": ["Dm7", "E(sus4)/B", "E7", "E/G#"]}, "b": {"label": "Bm7(b5) – E7(b13 #9) – Am", "play": ["Bm7(b5)", "E7(b13 #9)", "Am"]}}}], "remember": ["F – A7/E – Dm: lực của A7 cộng với bass đi xuống F, E, D; bấm đủ A, C#, E, G.", "Gm7 – C7 về Dm thay F cũng được (Dm7 chứa F A C); Eb7(#11) chung tritone với A7, tay phải hợp âm F.", "Hợp âm thứ đứng lâu thì chia bằng Dm(M7); \"chị\" của E7 là Bm7(b5), E7 dùng #9 với b13."], "items": [{"chord": "A7/E", "to": "Dm", "prog": ["F", "A7/E", "Dm"]}, {"chord": "Eb7(#11)", "to": "Dm", "prog": ["F", "Eb7(#11)", "Dm"]}, {"chord": "E(sus4)", "to": "E7", "rel": "line", "prog": ["Dm", "Dm(M7)", "E(sus4)", "E7"]}], "quiz": [{"q": "Vì sao F – A7/E – Dm nghe có lực?", "choices": ["Lực kéo của A7 về Dm cộng với bass đi xuống F, E, D", "Vì A7/E là hợp âm mượn", "Vì bass đứng yên ở E", "Vì A7/E là hợp âm giảm"], "answer": "Lực kéo của A7 về Dm cộng với bass đi xuống F, E, D", "why": "Tritone của A7 kéo về Dm, còn bass liền bậc là lực của tiến hành đi qua; hai lực cùng lúc."}, {"q": "Gm7 – C7 thường về F. Vì sao về Dm cũng không lạ?", "choices": ["Dm là hợp âm thay thế của F: Dm7 chứa F A C", "Vì C7 là \"mẹ\" của Dm", "Vì Dm là hợp âm mượn", "Vì Gm7 là \"chị\" của Dm"], "answer": "Dm là hợp âm thay thế của F: Dm7 chứa F A C", "why": "F và Dm7 chung ba nốt F, A, C, nên về Dm chỉ là \"đổi dự đoán\" chứ không lạ tai."}, {"q": "Vì sao Eb7(#11) thay được A7 trước Dm?", "choices": ["Hai hợp âm chung tritone (G và C#, cùng phím Db)", "Vì Eb7 là hợp âm trong giọng", "Vì Eb là nốt 5 của A", "Vì Eb7 là \"chị\" của Dm"], "answer": "Hai hợp âm chung tritone (G và C#, cùng phím Db)", "why": "Eb7 là \"bạn của mẹ\": chung bậc 3 và bậc 7 với A7, nên cũng kéo về Dm; chỉ khác nốt màu (#11)."}]},

  {"id": "p4-28", "part": 4, "src": "Phildave 4 · Bài 28", "title": "Bb7(#11) về Am, bass chromatic đi xuống và bass Ab giữ", "teach": [{"text": "\"Bạn của mẹ\" (썹파이브): Dm7 – Dm/C – Bm7 – Bb7(#11) rồi về Am, hợp âm đích là Am (trên bản nhạc câu đi về C, mà Am là hợp âm thay thế của C). Bb7 là \"bạn của mẹ\" thay E7 (chung tritone G#–D), nên mang 9, #11, 13: tay phải là hợp âm ba nốt cao hơn nốt gốc một cung. Bass đi D, C, B, Bb, A, rơi dần vào Am.", "tip": "Bb7(#11): tay trái Bb D Ab, tay phải hợp âm C, là hợp âm ba nốt cao hơn nốt gốc một cung (Bb lên một cung là C); C, E, G là 9, #11, 13.", "play": ["Dm7", "Dm/C", "Bm7", "Bb7(#11)", "Am"]}, {"text": "Thầy để ý: Bm7 ở đây lẽ ra là Bm7(b5), vì trong giọng A thứ hợp âm bậc II là Bm7(b5) (\"chị\" đi trước \"mẹ\" về hợp âm thứ, bài 24). Thầy dùng Bm7 (có F#) để có màu khác; như bài 24, trước \"bạn của mẹ\" dùng m7(b5) hay m7 đều được.", "tip": "Bm7 = B D F# A; Bm7(b5) = B D F A: chỉ khác F# và F.", "compare": {"a": {"label": "Bm7(b5) – Bb7(#11) – Am", "play": ["Bm7(b5)", "Bb7(#11)", "Am"]}, "b": {"label": "Bm7 – Bb7(#11) – Am", "play": ["Bm7", "Bb7(#11)", "Am"]}}}, {"text": "Chromatic đi xuống (크로매틱 하행 진행): ở chữ \"나의 몸 정성 다 바쳐서 주님\" (Cả thân con, hết lòng dâng lên…), thầy đi C – Gm/Bb – F/A – Fm/Ab. Bass đã rơi từng nửa cung (Bb, A) thì tai muốn nó rơi tiếp từng nửa cung; bass đi theo âm giai thì tai muốn đi tiếp theo âm giai. Chọn một nhóm cho nhất quán: ở đây là A xuống Ab.", "tip": "Bass C, Bb, A, Ab: từ Bb trở đi mỗi bước là một phím liền kề. Fm/Ab: tay trái Ab, tay phải hợp âm Fm.", "play": ["C", "Gm/Bb", "F/A", "Fm/Ab"]}, {"text": "Chỉ nhìn bass là biết hợp âm (베이스만 보고 코드를 안다): C – G/B – C/Bb – F/A – Fm/Ab. Bass rơi từng nửa cung C, B, Bb, A, Ab; trên mỗi nốt bass, thầy đặt một hợp âm có chứa nốt đó. Fm/Ab cuối câu là Fm mượn từ C thứ.", "tip": "C/Bb: tay trái Bb, tay phải hợp âm C; Bb là nốt 7 của C7 (C lùi một cung).", "play": ["C", "G/B", "C/Bb", "F/A", "Fm/Ab"]}, {"text": "Cuối đoạn thầy dùng hợp âm mượn: Bb, Abmaj7, Bb/Ab, trên nốt bass Ab giữ nguyên (pedal point). Chỉ cần bấm đúng nốt chính của hợp âm (chord tone) là đã nghe như đang chạy âm giai.", "tip": "Tay trái giữ Ab (thêm G cho Abmaj7); tay phải đổi qua lại hợp âm Bb và hợp âm Ab, mỗi ngón chỉ lùi một cung: D xuống C, F xuống Eb, Bb xuống Ab.", "play": [["Ab2", "|", "D4", "F4", "Bb4"], ["Ab2", "G3", "|", "C4", "Eb4", "Ab4"], ["Ab2", "|", "D4", "F4", "Bb4"], ["Ab2", "G3", "|", "C4", "Eb4", "Ab4"]]}], "remember": ["Bb7(#11) thay E7 về Am: tay phải hợp âm C; chỗ Bm7 lẽ ra là Bm7(b5) (bậc II của Am).", "Bass đã rơi nửa cung thì rơi tiếp nửa cung (C – Gm/Bb – F/A – Fm/Ab); chọn một nhóm cho nhất quán.", "Nhìn bass là biết hợp âm; bass Ab giữ nguyên, tay phải đổi Bb và Ab: chỉ bấm nốt chính mà nghe như chạy âm giai."], "items": [{"chord": "Bb7(#11)", "to": "Am", "prog": ["Dm7", "Dm/C", "Bm7", "Bb7(#11)", "Am"]}, {"chord": "Gm/Bb", "to": "F/A", "prog": ["C", "Gm/Bb", "F/A", "Fm/Ab"]}, {"chord": "Fm/Ab", "rel": "modal", "prog": ["C", "G/B", "C/Bb", "F/A", "Fm/Ab"]}], "quiz": [{"q": "C – G/B – C/Bb – F/A – Fm/Ab: trên mỗi nốt bass, thầy chọn hợp âm thế nào?", "choices": ["Đặt một hợp âm có chứa chính nốt bass đó", "Luôn đặt \"mẹ\" của nốt bass", "Giữ nguyên hợp âm C, chỉ đổi bass", "Đặt hợp âm giảm trên mỗi nốt bass"], "answer": "Đặt một hợp âm có chứa chính nốt bass đó", "why": "Bass rơi từng nửa cung C, B, Bb, A, Ab; trên mỗi nốt thầy đặt hợp âm có nốt đó: G có B, C/Bb là C7 đảo 3, F có A, Fm có Ab."}, {"q": "Bass đã rơi Bb rồi A từng nửa cung. Nên đi tiếp thế nào?", "choices": ["Rơi tiếp nửa cung xuống Ab", "Nhảy theo âm giai C trưởng xuống G", "Đứng yên ở A", "Đi lên lại Bb"], "answer": "Rơi tiếp nửa cung xuống Ab", "why": "Bass đã đi chromatic thì tai chờ tiếp chromatic; chọn một nhóm cho nhất quán."}]},

  {"id": "p4-29", "part": 4, "src": "Phildave 4 · Bài 29", "title": "Hai tiến hành cần thuộc, subV liên tiếp và màu lai", "teach": [{"text": "Tiến hành cần thuộc lòng 1 (필수암기 코드진행): ở chữ \"나의 몸 정성 다 바쳐서 주님\" (Cả thân con, hết lòng dâng lên…), thầy đi C – G/B – E7(b13) – Am7(9). Nền là các hợp âm trong giọng đi xuống (C, G/B, rồi Am), và giữa câu có E7(b13), \"mẹ\" của Am, dẫn về Am7(9). Bass đi C, B, E, A.", "tip": "b13 của E7 là C: bậc 5 (B) nhích lên nửa cung, cùng phím với C.", "play": ["C", "G/B", "E7(b13)", "Am7(9)"]}, {"text": "Câu đi tiếp Am7(9) – Gm7 – Gb7(#11) – F. Gm7 là \"chị\" của C7, và Gb7(#11) là \"bạn của mẹ\" thay C7, nên cặp Gm7 – Gb7(#11) dẫn về F; bass đi A, G, Gb, F từng bậc. Thầy dặn thuộc lòng cả tiến hành này vì gặp rất nhiều.", "tip": "Gb7(#11): tay phải hợp âm Ab, là hợp âm ba nốt cao hơn nốt gốc một cung (Gb lên một cung là Ab).", "play": ["C", "G/B", "E7(b13)", "Am7(9)", "Gm7", "Gb7(#11)", "F"]}, {"text": "Tiến hành cần thuộc lòng 2: C – E7(b13 #9) – E/G# – Am7(9) – Gm7 – C7. Trên E7 có thể chơi #9 với b13, b9 với b13, hoặc đổi màu lệch thời điểm. Chỗ E/G# cũng dùng được G#°7; vì đánh cả nốt trên cùng nên G#°7 cho một sound khá lạ.", "tip": "E7(b13 #9): tay trái E G# D, tay phải hợp âm C. G#°7 = E7(b9) bỏ nốt gốc E, bass G# đi lên A.", "compare": {"a": {"label": "… E7(b13 #9) – E/G# – Am7(9) …", "play": ["C", "E7(b13 #9)", "E/G#", "Am7(9)", "Gm7", "C7"]}, "b": {"label": "… E7(b13 #9) – G#°7 – Am7(9) …", "play": ["C", "E7(b13 #9)", "G#°7", "Am7(9)", "Gm7", "C7"]}}}, {"text": "\"Bạn của mẹ\" xuất hiện liên tiếp (썹파이브 연속 출현): C – Bb7(#11) – Am7(9) – Gm7 – Gb7(#11). Bb7 là \"bạn của mẹ\" của E7 (về Am), Gb7 là \"bạn của mẹ\" của C7 (về F). Cũng có thể chơi E7 trước rồi mới chuyển sang Bb7.", "tip": "Hai hợp âm bấm cùng một kiểu, tay phải là hợp âm ba nốt cao hơn nốt gốc một cung: Bb7 bấm hợp âm C, Gb7 bấm hợp âm Ab.", "compare": {"a": {"label": "C – Bb7(#11) – Am7(9) – Gm7 – Gb7(#11) – F", "play": ["C", "Bb7(#11)", "Am7(9)", "Gm7", "Gb7(#11)", "F"]}, "b": {"label": "E7 trước rồi Bb7: C – E7(b13 #9) – Bb7(#11) – Am7(9)", "play": ["C", "E7(b13 #9)", "Bb7(#11)", "Am7(9)"]}}}, {"text": "Màu lai (hybrid tension): ở II–V về F, thầy chơi Gm7 – C7(b9 13) – F. Thường nốt màu biến đổi đi thành cặp gốc: b9 với b13, hoặc #9 với b13. Trộn b9 (màu biến đổi) với 13 tự nhiên, như C7 có cả Db và A đã gặp ở bài 15, gọi là màu lai.", "tip": "C7(b9 13) = hợp âm C7 + hợp âm A: tay phải A C# E, và C# chính là Db, tức b9 (C nhích lên nửa cung).", "compare": {"a": {"label": "Cặp gốc: Gm7 – C7(b9 b13) – F", "play": ["Gm7", "C7(b9 b13)", "F"]}, "b": {"label": "Màu lai: Gm7 – C7(b9 13) – F", "play": ["Gm7", "C7(b9 13)", "F"]}}}], "remember": ["Thuộc lòng: C – G/B – E7(b13) – Am7(9) – Gm7 – Gb7(#11); nền đi xuống, E7 dẫn về Am, Gb7(#11) thay C7.", "E7 trước Am: #9 với b13, b9 với b13, hoặc đổi màu lệch thời điểm; Bb7(#11) thay được E7.", "Màu lai: b9 trộn với 13 tự nhiên, như C7(b9 13) = C7 + hợp âm A."], "items": [{"chord": "E7(b13)", "to": "Am7(9)", "prog": ["C", "G/B", "E7(b13)", "Am7(9)", "Gm7", "Gb7(#11)"]}, {"chord": "E/G#", "to": "Am7(9)", "prog": ["C", "E7(b13 #9)", "E/G#", "Am7(9)", "Gm7", "C7"]}, {"chord": "C7(b9 13)", "to": "F", "prog": ["Gm7", "C7(b9 13)", "F"]}], "quiz": [{"q": "Màu lai (hybrid tension) là gì?", "choices": ["Trộn màu biến đổi với màu tự nhiên, như b9 với 13", "Cặp b9 với b13", "Hợp âm mượn từ giọng thứ", "Hợp âm 7 không có nốt gốc"], "answer": "Trộn màu biến đổi với màu tự nhiên, như b9 với 13", "why": "Cặp gốc là b9 với b13 hoặc #9 với b13; b9 đi cùng 13 tự nhiên là màu lai, như C7(b9 13)."}, {"q": "Trong C7(b9 13), nốt C# ở tay phải là nốt gì của C7?", "choices": ["b9 (chính là Db)", "Bậc 3", "13 tự nhiên", "#11"], "answer": "b9 (chính là Db)", "why": "C nhích lên nửa cung là Db (cùng phím C#), tức b9; A là 13, E là bậc 3."}]},

  {"id": "p4-30", "part": 4, "src": "Phildave 4 · Bài 30", "title": "Ending bằng hợp âm mượn: Fm6, Abmaj7 và Fm/G", "teach": [{"text": "Modal trông như II–V–I (투파이브원 같은 모달): bài \"경배합니다\" (Con thờ phượng Ngài), ở chữ \"Thờ phượng…\", thầy đi Fm7 – Bb7(#11) – C, hợp âm đích là C. Fm7 – Bb7 nhìn như II–V về Eb, nhưng ở đây cả hai là hợp âm mượn từ C thứ. Chúng hợp \"hơi thở\" với nhau nên hay đi chung; sách chỉ ghi Bb7, thầy thêm #11.", "tip": "Bb7(#11): tay trái Bb D Ab, tay phải hợp âm C, là hợp âm ba nốt cao hơn nốt gốc một cung (Bb lên một cung là C).", "compare": {"a": {"label": "Nếu là II–V thật: Fm7 – Bb7 – Eb", "play": ["Fm7", "Bb7", "Eb"]}, "b": {"label": "Hợp âm mượn: Fm7 – Bb7(#11) – C", "play": ["Fm7", "Bb7(#11)", "C"]}}}, {"text": "Cẩn thận va chạm: Fm7 có Eb, mà nốt trên cùng (giai điệu) là E, hai nốt cách nhau nửa cung nên va. Lúc này chơi Fm6 sẽ hợp hơn: D thay cho Eb, hết va mà vẫn là hợp âm mượn, như bài 23.", "tip": "Nốt 6 của Fm6 là D (C lên một cung); nốt 7 của Fm7 là Eb (F lùi một cung).", "compare": {"a": {"label": "Fm7 với giai điệu E (va)", "play": [["F2", "Ab3", "C4", "Eb4", "E5"]]}, "b": {"label": "Fm6 với giai điệu E", "play": [["F2", "Ab3", "C4", "D4", "E5"]]}}}, {"text": "Hợp âm mượn cho ending (엔딩용 모달체인지 코드): F – F/G – Abmaj7 – Bb – C. Abmaj7 dùng nhiều, nhưng đừng bấm hai tay y hệt nhau cách một quãng 8 rồi chạy song song, nghe quê. Hãy đưa nốt trên cùng theo nốt 7 của Abmaj7 (G).", "tip": "Nốt 7 của Abmaj7 là G (Ab lùi nửa cung): đặt G lên trên cùng thay vì lặp lại Ab. Ở bước bấm thử và khi nghe cả câu, app cũng đặt G lên trên cùng.", "compare": {"a": {"label": "Hai tay y hệt cách quãng 8 (nghe quê)", "play": ["F", "F/G", ["Ab2", "C3", "Eb3", "Ab3", "C4", "Eb4"], ["Bb2", "D3", "F3", "Bb3", "D4", "F4"], "C"]}, "b": {"label": "Nốt trên cùng là G (nốt 7)", "play": ["F", "F/G", ["Ab2", "Eb3", "C4", "Eb4", "G4"], "Bb", "C"]}}}, {"text": "Áp hợp âm mượn lên 9sus4 (나인써스포에 모달적용): F – Fm/G – F/A – G/B – C. Thường đi F – F/G rồi mới Fm/G; ở đây thầy bỏ qua 9sus4 (F/G), đi thẳng vào Fm/G: bass G, phía trên là hợp âm Fm. Sau đó bass đi lên A, B, C về chủ.", "tip": "Fm/G: tay trái G, tay phải đủ hợp âm Fm (F Ab C); G/B: tay trái B, tay phải G A D.", "compare": {"a": {"label": "Thường: F – F/G – Fm/G", "play": ["F", "F/G", "Fm/G"]}, "b": {"label": "Bỏ 9sus4: F – Fm/G – F/A – G/B – C", "play": ["F", "Fm/G", "F/A", "G/B", "C"]}}}, {"text": "Hợp âm 7 đổi đích cũng được (목적지가 달라도 괜찮은 V7): F – F/G – Am7 – Bb7 – C. F/G (G7 9sus4) không về C mà sang Am7. G7 là hợp âm 7 bậc V của chính giọng C nên khá tự do; còn A7 trước Dm hay E7 trước Am thì gần như phải về đích.", "tip": "Bb7 trước C là hợp âm mượn từ C thứ (B hạ nửa cung thành Bb), như bài 9.", "compare": {"a": {"label": "F – F/G – C", "play": ["F", "F/G", "C"]}, "b": {"label": "F – F/G – Am7 – Bb7 – C", "play": ["F", "F/G", "Am7", "Bb7", "C"]}}}], "remember": ["Fm7 – Bb7(#11) – C trông như II–V về Eb nhưng là hai hợp âm mượn từ C thứ; nốt trên cùng là E thì dùng Fm6.", "Abmaj7 ở ending: đừng bấm hai tay y hệt cách quãng 8, đặt nốt 7 (G) lên trên cùng.", "Có thể bỏ F/G, vào thẳng Fm/G; G7 khá tự do, không bắt buộc về C (F/G – Am7 – Bb7 – C)."], "items": [{"chord": "Bb7(#11)", "rel": "modal", "prog": ["Fm7", "Bb7(#11)", "C"]}, {"chord": "Abmaj7", "rel": "modal", "prog": ["F", "F/G", "Abmaj7", "Bb", "C"], "top": [null, null, "G", null, null]}, {"chord": "G/B", "to": "C", "prog": ["F", "Fm/G", "F/A", "G/B", "C"]}], "quiz": [{"q": "F – Fm/G – F/A – G/B – C khác cách thường đi ở chỗ nào?", "choices": ["Bỏ qua F/G (9sus4), vào thẳng Fm/G", "Bỏ hợp âm mượn Fm", "Bass đi xuống thay vì đi lên", "Không về C"], "answer": "Bỏ qua F/G (9sus4), vào thẳng Fm/G", "why": "Thường đi F – F/G rồi mới Fm/G; ở đây thầy bỏ 9sus4, đặt ngay Fm trên bass G, rồi bass đi lên A, B, C về chủ."}, {"q": "Chơi Abmaj7 ở ending thế nào cho khỏi quê?", "choices": ["Đặt nốt 7 (G) lên trên cùng, không bấm hai tay y hệt cách quãng 8", "Bấm hai tay y hệt cách một quãng 8", "Bỏ nốt Ab ở bass", "Thay Abmaj7 bằng Ab7"], "answer": "Đặt nốt 7 (G) lên trên cùng, không bấm hai tay y hệt cách quãng 8", "why": "Hai quãng 8 chạy song song y hệt nghe quê; cho nốt trên cùng theo nốt 7 (G) thì hai tay không còn giống nhau."}, {"q": "Vì sao F/G đi sang Am7 thay vì về C vẫn được?", "choices": ["G7 là hợp âm 7 bậc V của chính giọng C nên khá tự do", "Vì F/G là hợp âm mượn", "Vì Am7 là \"mẹ\" của C", "Vì F/G không có nốt G"], "answer": "G7 là hợp âm 7 bậc V của chính giọng C nên khá tự do", "why": "Thầy nói G7 trong giọng C khá tự do, không bắt buộc về bậc I; A7 hay E7 thì gần như phải về đích."}]},

  {"id": "p4-31", "part": 4, "src": "Phildave 4 · Bài 31", "title": "Modal ending: Bb7 thành 9sus4, b9 \"Ai Cập\" và Dbmaj7", "teach": [{"text": "Modal ending (모달 엔딩): bài \"경배합니다\" (Con thờ phượng Ngài), ở chữ \"Thờ phượng…\", thầy đi F – F/G – Fm7 – Bb7 – C, hợp âm đích là C. Fm7 và Bb7 là cặp hợp âm mượn từ C thứ như bài 30; vào thẳng Bb7 là gọn.", "tip": "Fm7 có Ab và Eb, Bb7 có Bb và Ab: đều là A, E, B hạ nửa cung, tức nốt của C thứ.", "play": ["F", "F/G", "Fm7", "Bb7", "C"]}, {"text": "Thay vì vào thẳng, Bb7 có thể làm thành 9sus4: Ab/Bb, và tay phải phải hiện rõ đủ hợp âm Ab thì 9sus4 mới có ý nghĩa. Khi giải quyết sus4, thầy hạ luôn nốt 9 thành b9: Bb7(b9) nghe hơi có màu \"Ai Cập\". Lý do nghe như vậy: Cb (b9) và D (bậc 3) cách nhau một cung rưỡi, một bước nhảy hay gặp trong nhạc Trung Đông.", "tip": "Ab/Bb: tay trái Bb, tay phải đủ hợp âm Ab (Ab C Eb). Giải quyết: Eb (bậc 4) xuống D (bậc 3), C (nốt 9) xuống Cb (cùng phím B, là b9).", "compare": {"a": {"label": "Vào thẳng: Fm7 – Bb7 – C", "play": ["Fm7", "Bb7", "C"]}, "b": {"label": "9sus4 rồi b9: Fm7 – Ab/Bb – Bb7(b9) – C", "play": ["Fm7", ["Bb2", "C4", "Eb4", "Ab4"], ["Bb2", "B3", "D4", "Ab4"], "C"]}}}, {"text": "Top note và hợp âm (탑노트와 코드): F – F/G – Dbmaj7 – Fm7 – Dbmaj7 – Gb7(#11) – C. Dbmaj7 là hợp âm mượn, và nốt trên cùng của nó là C nên vừa nhiều màu vừa đẹp. Gb7(#11) – C ở cuối không theo luật đã học (\"bạn của mẹ\" của C là Db7, không phải Gb7): chỉ nghe nó như một màu kết, không làm bài tập.", "tip": "Nốt 7 của Dbmaj7 là C (Db lùi nửa cung): đặt C lên trên cùng, ở bước bấm thử app cũng bấm như vậy. Gb7(#11): tay phải hợp âm Ab.", "play": ["F", "F/G", ["Db2", "Ab3", "F4", "C5"], "Fm7", ["Db2", "Ab3", "F4", "C5"], "Gb7(#11)", "C"]}], "remember": ["Modal ending: F – F/G – Fm7 – Bb7 – C; Fm7 và Bb7 là cặp mượn từ C thứ.", "Bb7 làm 9sus4 được: Ab/Bb (đủ hợp âm Ab); giải quyết thì hạ 9 thành b9, Bb7(b9) có màu \"Ai Cập\".", "Dbmaj7 đặt nốt 7 (C) trên cùng; Gb7(#11) – C ở cuối là màu kết ngoài luật, chỉ nghe."], "items": [{"chord": "Bb7", "rel": "modal", "prog": ["F", "F/G", "Fm7", "Bb7", "C"]}, {"chord": "Dbmaj7", "rel": "modal", "prog": ["F", "F/G", "Dbmaj7", "Fm7"], "top": [null, null, "C", null]}], "quiz": [{"q": "Muốn Bb7 thành 9sus4, thầy bấm thế nào?", "choices": ["Tay trái Bb, tay phải đủ hợp âm Ab (Ab/Bb)", "Tay trái Bb, tay phải hợp âm Bb", "Tay trái Ab, tay phải hợp âm Bb", "Tay trái Bb, tay phải hợp âm D"], "answer": "Tay trái Bb, tay phải đủ hợp âm Ab (Ab/Bb)", "why": "Ab/Bb = Bb + Ab C Eb: nốt 7, 9 và 11 của Bb7; phải hiện đủ hợp âm Ab thì 9sus4 mới có ý nghĩa."}, {"q": "Vì sao Dbmaj7 ở đây nghe vừa nhiều màu vừa đẹp?", "choices": ["Nốt trên cùng là C, chính là nốt 7 của Dbmaj7", "Vì Dbmaj7 là hợp âm trong giọng C", "Vì Dbmaj7 là \"mẹ\" của C", "Vì bass Db đứng yên"], "answer": "Nốt trên cùng là C, chính là nốt 7 của Dbmaj7", "why": "Thầy nói top note của Dbmaj7 là C nên vừa rất màu sắc vừa rất đẹp."}, {"q": "Nốt màu nào trên Bb7 cho màu \"Ai Cập\"?", "choices": ["b9 (Cb, cùng phím B)", "#11 (E)", "13 (G)", "9 (C)"], "answer": "b9 (Cb, cùng phím B)", "why": "Bb7(b9): nốt 9 (C) hạ nửa cung thành Cb, nghe hơi có màu \"Ai Cập\"."}]},

  {"id": "p4-32", "part": 4, "src": "Phildave 4 · Bài 32", "title": "Thực chiến: ôn cả khoá, mỗi lần lặp biến hoá thêm", "teach": [{"text": "Bài thực chiến: lần đầu chơi thật đơn giản, đúng bản nhạc; có chỗ cứ đi bằng hợp âm G cũng được. Mỗi lần lặp lại thì biến hoá thêm một chút: về C thì dùng G7 hoặc G9sus4 (F/G), hoặc chèn \"chị\" Dm7 trước G7 thành II–V–I.", "tip": "F/G (G9sus4): tay trái G, tay phải hợp âm F (G lùi một cung là F).", "compare": {"a": {"label": "Lần đầu: G – C", "play": ["G", "C"]}, "b": {"label": "Lặp lại: Dm7 – F/G – G7 – C", "play": ["Dm7", "F/G", "G7", "C"]}}}, {"text": "Đến đoạn vào điệp khúc (chorus) thì bắt đầu thêm màu: Fm mượn từ C thứ, rồi Bb7 cũng là hợp âm mượn (như cặp Fm7 – Bb7 ở bài 30–31). Màu mượn làm câu dẫn vào điệp khúc khác hẳn lần đầu.", "tip": "Fm là F có A hạ nửa cung (Ab); nốt 7 của Bb7 là Ab (Bb lùi một cung).", "play": ["F", "Fm", "Bb7", "C"]}, {"text": "Muốn Am buồn hơn, ở ô nhịp 9 thầy chơi Am6, hoặc dùng thế đảo. Phía sau là F, nên có thể cho bass rơi xuống kiểu tiến hành đi qua để về F.", "tip": "Am6 thêm F#, là E lên một cung; Am/G: tay phải giữ Am, tay trái G (A lùi một cung).", "compare": {"a": {"label": "Am → Am6 (buồn hơn)", "play": ["Am", "Am6"]}, "b": {"label": "Bass rơi về F: Am – Am/G – F", "play": ["Am", "Am/G", "F"]}}}, {"text": "C#°7 có gốc là A7: C#°7 chính là A7(b9) bỏ nốt A, nên đặt ở chỗ A7 trước Dm. Đây là cách thay đã học từ bài 26, giờ dùng trong cả bài.", "tip": "C#°7: tay trái C#, tay phải hợp âm Edim (E G Bb); E G Bb cũng nằm trong A7(b9).", "compare": {"a": {"label": "A7(b9) – Dm", "play": ["A7(b9)", "Dm"]}, "b": {"label": "C#°7 – Dm", "play": ["C#°7", "Dm"]}}}, {"text": "Tiến hành đi qua rơi từng nửa cung có thể đi xa hơn: ở ô nhịp 16, sau F/A lẽ ra bass về G, nhưng thầy bỏ qua G mà nghe vẫn không lạ. Kiểu bass rơi từng nửa cung như ở bài 28: C – G/B – C/Bb – F/A – Fm/Ab.", "tip": "Bass C, B, Bb, A, Ab: mỗi bước một phím liền kề, tính cả phím đen.", "play": ["C", "G/B", "C/Bb", "F/A", "Fm/Ab"]}, {"text": "Lần lặp thứ hai, thầy thay \"mẹ\" bằng \"bạn của mẹ\" ở hai chỗ. Trước C: G7(b13) rồi đến lượt Db7, \"bạn của mẹ\" của C. Trước Am: E7(#9 b13) (chính là E7(b13 #9) ở các bài trước) rồi Bb7, \"bạn của mẹ\" của E7. Mỗi chỗ có hai hợp âm cùng một việc, nên tai nghe thêm một bước màu trước khi về đích.", "tip": "Nốt gốc của \"bạn của mẹ\" là đích nhích lên nửa cung: C lên nửa cung là Db, A lên nửa cung là Bb.", "compare": {"a": {"label": "G7(b13) – Db7 – C", "play": ["G7(b13)", "Db7", "C"]}, "b": {"label": "E7(#9 b13) – Bb7 – Am", "play": ["E7(#9 b13)", "Bb7", "Am"]}}}, {"text": "Cũng ở lần lặp thứ hai, A7/E (A7 với bass E, bài 27) đi theo tiến hành đi qua về Dm. E7(#9 b13) cũng là màu thầy dùng cho dòng đàn dây (string line) kịch tính. Thầy dặn đừng chơi khô cứng: cùng một chỗ, chơi kiểu này hay kiểu kia đều được, miễn là về đúng hợp âm đích.", "tip": "A7/E: tay trái E G, tay phải A C#; bass F, E, D đi xuống vào Dm.", "play": ["F", ["E2", "G3", "|", "A3", "C#4"], "Dm"]}], "remember": ["Lần đầu đơn giản, đúng bản nhạc; mỗi lần lặp thêm một chút: G9sus4, II–V–I, Fm, Bb7.", "Am buồn hơn: Am6 hoặc thế đảo; C#°7 có gốc là A7; bass rơi nửa cung có thể đi xa hơn.", "Lần lặp thứ hai: G7(b13) – Db7 – C, E7(#9 b13) – Bb7 – Am, A7/E – Dm; đừng chơi khô cứng."], "items": [{"chord": "Db7", "to": "C", "prog": ["G7(b13)", "Db7", "C"]}, {"chord": "Bb7", "to": "Am", "prog": ["E7(#9 b13)", "Bb7", "Am"]}, {"chord": "A7/E", "to": "Dm", "prog": ["A7/E", "Dm"]}], "quiz": [{"q": "Lần lặp lại, thầy dặn chơi cùng một chỗ thế nào?", "choices": ["Đừng chơi khô cứng: kiểu này hay kiểu kia đều được", "Luôn chơi đúng một cách như lần đầu", "Chỉ được dùng hợp âm trong giọng", "Bỏ hết hợp âm mượn"], "answer": "Đừng chơi khô cứng: kiểu này hay kiểu kia đều được", "why": "Lần lặp thứ hai thầy đổi sang G7(b13) – Db7 – C, E7(#9 b13) – Bb7 – Am; thầy dặn đừng chơi khô cứng, cùng một chỗ chơi kiểu nào cũng được."}, {"q": "Muốn Am ở ô nhịp 9 nghe buồn hơn, thầy làm gì?", "choices": ["Chơi Am6 hoặc dùng thế đảo", "Đổi thành A7", "Đổi thành C", "Bỏ hợp âm, chỉ để giai điệu"], "answer": "Chơi Am6 hoặc dùng thế đảo", "why": "Am6 (thêm F#) hoặc một thế đảo làm Am buồn hơn; bass có thể rơi xuống về F."}]},
