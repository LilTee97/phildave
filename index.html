          // đang xem đáp án: ẩn/hiện không bật lại đồng hồ
          vis(true); vis(false); eq(live.size, 0); click('#cnext'); eq(live.size, 1);
          // dừng màn khi đang ẩn rồi hiện: không có timer
          vis(true); click('#cstop'); click('#cstopyes'); vis(false); eq(live.size, 0); eq(challenge.run, null);
        } finally { hidden = false; delete document.hidden; cancelChallenge(); window.setInterval = realSet; window.clearInterval = realClear; challenge.clock = keepClock; Object.assign(progress, JSON.parse(keep)); Object.assign(quizState, keepQ); clearTarget(); TABS.learn(); } } },
    { name:'Vượt màn D8: màn chọn nhắc khi dạng ở giọng C có dưới 15 câu khác nhau, không tự đổi lựa chọn; lựa chọn được nhớ trong progress nhưng ?test không ghi bộ nhớ', fn() {
        const keep = JSON.stringify(progress), keepQ = { ...quizState }, lsBefore = JSON.stringify(Object.entries(localStorage));
        try {
          progress.done = Object.fromEntries(loadLessons().lessons.map(l => [l.id, true])); Object.assign(quizState, { mode: 'subst', keys: 'C', play: 'run', timer: 'mid' }); TABS.quiz();
          const n = distinctCount('subst', 'C', 'p4-32'); ok(n >= 3 && n < 15, 'N=' + n); ok($('qthin') && $('qthin').textContent === `Dạng này ở giọng C chỉ có ${n} câu khác nhau, màn sẽ lặp lại câu — chọn Nhiều giọng để đa dạng hơn.`, $('qthin') && $('qthin').textContent);
          eq(quizState.keys, 'C'); eq(quizState.mode, 'subst'); eq(distinctCount('subst', 'C', 'p4-32'), n); ok('subst|C|p4-32' in distinctCache, 'chưa nhớ kết quả');
          click('[data-keys="many"]'); ok(!$('qthin'), 'Nhiều giọng mà vẫn nhắc'); eq(quizState.keys, 'many'); click('[data-keys="C"]'); ok($('qthin'));
          $('qmode').value = 'mix'; $('qmode').onchange({ target: $('qmode') }); ok(!$('qthin'), 'Trộn không cần nhắc');
          click('[data-timer="fast"]'); click('[data-keys="many"]'); click('[data-play="free"]');
          eq(JSON.stringify(progress.quiz), JSON.stringify({ play: 'free', mode: 'mix', keys: 'many', timer: 'fast' })); eq(JSON.stringify(Object.entries(localStorage)), lsBefore);
        } finally { cancelChallenge(); Object.assign(progress, JSON.parse(keep)); Object.assign(quizState, keepQ); clearTarget(); TABS.learn(); } } },
    { name:'Vượt màn D9: mode lỗi thời đã lưu về Trộn (hoặc ring nếu chưa học gì) ở cả hai chế độ; bấm trễ sau hết giờ không tính; chạm đúp trúng câu kế bị bỏ qua; Dừng hỏi lại và dừng đồng hồ lúc hỏi', async fn() {
        const keep = JSON.stringify(progress), keepQ = { ...quizState }, keepClock = challenge.clock, keepGuard = challenge.guardMs, realSet = window.setInterval, realClear = window.clearInterval, live = new Set(), wait = ms => new Promise(r => setTimeout(r, ms));
        window.setInterval = (f, ms) => { const id = realSet(f, ms); live.add(id); return id; }; window.clearInterval = id => { live.delete(id); realClear(id); };
        try {
          progress.done = Object.fromEntries(loadLessons().lessons.map(l => [l.id, true]));
          for (const play of ['free', 'run']) { Object.assign(quizState, { mode: 'foo', play, keys: 'C' }); TABS.quiz(); eq(quizState.mode, 'mix'); eq($('qmode').value, 'mix'); ok($('qbody').innerHTML.length > 50, 'tab Đố trống với mode lỗi'); }
          progress.done = {}; Object.assign(quizState, { mode: 'foo', play: 'free' }); TABS.quiz(); eq(quizState.mode, 'ring');
          progress.done = Object.fromEntries(loadLessons().lessons.map(l => [l.id, true]));
          Object.assign(quizState, { mode: 'motherOf', keys: 'C', play: 'run', timer: 'mid' }); let t = 0; challenge.clock = () => t; TABS.quiz(); click('#qstart'); const r = challenge.run, q = r.qs[0];
          t += 12050; document.querySelector(`.choices [data-n="${q.answer}"]`).click();   // đúng nhưng đã quá giờ
          eq(r.res[0].ok, false); eq(r.res[0].ms, 12000); ok($('fb').textContent.includes('Hết giờ'), 'không báo hết giờ');
          // hỏi lại khi Dừng: đồng hồ dừng, Tiếp tục thì chạy lại và không mất giây
          click('#cnext'); t += 3000; challengeTick(); eq($('tsec').textContent, '9'); eq(live.size, 1);
          click('#cstop'); ok($('cconfirm'), 'không hỏi lại'); eq(live.size, 0); eq(challenge.run, r); t += 300000; challengeTick(); eq(r.res.length, 1);
          const q2 = r.qs[1]; document.querySelector(`.choices [data-n="${q2.answer}"]`).click(); eq(r.res.length, 1);   // đang hỏi xác nhận: chạm đáp án không tính
          click('#cstopno'); ok(!$('cconfirm')); eq(live.size, 1); challengeTick(); eq($('tsec').textContent, '9'); ok(challenge.run === r);
          click('#cstop'); click('#cstopyes'); eq(live.size, 0); eq(challenge.run, null); ok($('qstart'), 'Dừng hẳn không về màn chọn');
          // chống chạm đúp: sau khi sang câu mới, chạm trong 300 ms bị bỏ qua
          challenge.guardMs = 300; click('#qstart'); const r2 = challenge.run; await wait(350);
          document.querySelector(`.choices [data-n="${r2.qs[0].answer}"]`).click(); eq(r2.res.length, 1); eq($('cprog').textContent, 'Câu 2/30');
          document.querySelector(`.choices [data-n="${r2.qs[1].answer}"]`).click(); eq(r2.res.length, 1);   // chạm trễ ngay sau khi sang câu
          await wait(350); document.querySelector(`.choices [data-n="${r2.qs[1].answer}"]`).click(); eq(r2.res.length, 2);
        } finally { cancelChallenge(); window.setInterval = realSet; window.clearInterval = realClear; challenge.clock = keepClock; challenge.guardMs = keepGuard; Object.assign(progress, JSON.parse(keep)); Object.assign(quizState, keepQ); clearTarget(); TABS.learn(); } } },
  ];
  if (/[?&]test/.test(location.search)) {
    $('main').innerHTML = '<div class="card"><h3>Đang chạy test…</h3><p class="mut">Bộ rà chọi mất khoảng 10–20 giây.</p></div>';
    setTimeout(async () => {
      const r = [...await runTests(DOMTESTS), ...await runTests(TESTS)], bad = r.filter(x => !x.ok);
      TABS.learn();
      $('main').innerHTML = `<div class="card"><h3 class="${bad.length ? 'bad' : 'ok'}">Test: ${r.length - bad.length}/${r.length} đạt</h3>` +
        r.map(x => `<p>${x.ok ? '<span class="ok">✓</span>' : '<span class="bad">✗</span>'} ${x.name}${x.info ? ` <span class="mut">— ${x.info}</span>` : ''}</p>`).join('') + '</div>';
      document.title = `TEST ${r.length - bad.length}/${r.length}`;
    }, 50);
  }
}
</script>
