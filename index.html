, "quiz": [{"q": "Vì sao Am/F# và F#m7b5 là cùng một hợp âm?", "choices": ["Cả hai đều gồm F# A C E", "Cả hai đều có nốt C#", "Am/F# là hợp âm trưởng", "F#m7b5 không có nốt F#"], "answer": "Cả hai đều gồm F# A C E", "why": "F#m7 là F# A C# E; hạ bậc 5 (C#) xuống C được F# A C E, tức hợp âm Am trên bass F#."}, {"q": "Ở ending 1, chỗ A7 thầy đổi thành hợp âm nào?", "choices": ["Eb7(#11)", "B7(#9)", "Db7", "Fm"], "answer": "Eb7(#11)", "why": "Eb7 là \"bạn\" của A7 (chung tritone), như ở bài dạo đầu; thầy thêm #11, chính là nốt A."}, {"q": "Vì sao ở ending 1 tay phải được tự do hơn?", "choices": ["Vì tay trái đã giữ đủ hoà âm", "Vì ending không có hợp âm", "Vì tay phải chỉ đánh nốt gốc", "Vì ending luôn chuyển sang giọng khác"], "answer": "Vì tay trái đã giữ đủ hoà âm", "why": "Thầy nói \"vì bên dưới đã giữ đầy đủ hòa âm rồi, nên tay phải sẽ tự do hơn nhiều\"."}]},
  {"id": "p2-06", "part": 2, "src": "Phildave 2 · Video 2-6", "title": "Video 2-6: chuyển giọng lên một cung, nửa cung", "teach": [{"text": "Mẹo chuyển giọng (đổi sang giọng khác) dùng ở đoạn nối giữa bài này và bài khác: kết bài hiện tại bằng ending, rồi chuyển. Kết ở giọng C rồi bài sau bắt đầu ở D là lên một cung; kết ở C rồi bắt đầu ở Db là lên nửa cung. Đa số là đẩy key lên; hạ xuống cũng được nhưng không phổ biến, vì \"khi âm nhạc được đẩy cao trào, việc key đi lên sẽ tự nhiên hơn\". Nghe so sánh: C lên D, và C lên Db.", "tip": "Lên một cung: từ C bỏ qua phím đen là D. Lên nửa cung: phím đen ngay bên phải C là Db.", "compare": {"a": {"label": "C → D (lên một cung)", "play": ["C", "D"]}, "b": {"label": "C → Db (lên nửa cung)", "play": ["C", "Db"]}}}, {"text": "Lên một cung có 6 mẫu. Mẫu 2 dùng II–V của giọng D: \"chị\" Em7, \"mẹ\" A7, rồi về D. Nhưng thầy nói Em7 \"hơi kém thú vị\", vì trong giọng C vốn đã có Em, nên tai chưa thấy đang rời giọng C. Vì vậy thầy biến nó thành Em7b5 (E G Bb D): Bb không thuộc giọng C, nên tai nghe ngay là đã rời giọng C. Bb cũng không thuộc D trưởng: Em7b5 là dạng \"chị\" của đích thứ đã học ở Phildave 3, mượn đem trước đích trưởng D cho màu đậm hơn. Nghe so sánh: C – Em7 – A7 – D, rồi C – Em7b5 – A7 – D.", "tip": "\"Mẹ\" của D: đếm D, E, F#, G, A, ra A7. \"Chị\": D lên một cung là E.", "compare": {"a": {"label": "C – Em7 – A7 – D", "play": ["C", "Em7", "A7", "D"]}, "b": {"label": "C – Em7b5 – A7 – D", "play": ["C", "Em7b5", "A7", "D"]}}}, {"text": "Bản nhạc trong sách ghi nhầm \"flat 9\" ở chỗ này; thầy đính chính là lỗi in, \"không phải flat 9, mà là flat 5\". Flat 5 (b5) là nốt 5 hạ nửa cung: nốt 5 của E là B, hạ xuống thành Bb, nên hợp âm là Em7b5. Thầy nói mẫu này \"nghe như đang chuyển sang bài khác\", nên hợp để nối sang bài khác hơn là dùng trong cùng một bài. Các mẫu lên một cung còn lại thầy chỉ chơi, không đọc hợp âm (mẫu 4 kéo dài số ô nhịp, \"kéo dài quá trình chuyển giọng cũng là một ý tưởng hay\"), nên hãy xem sách hoặc video.", "tip": "Em7 thành Em7b5: chỉ hạ B xuống nửa cung thành Bb.", "show": "Em7b5", "compare": {"a": {"label": "Em7", "play": ["Em7"]}, "b": {"label": "Em7b5", "play": ["Em7b5"]}}}, {"text": "Lên nửa cung cũng có 6 mẫu. Mẫu 1 dùng Ebm7 – Ab7, tức II–V–I của giọng Db: \"chị\" Ebm7, \"mẹ\" Ab7, rồi về Db; thầy nói trong giọng Db, đây là \"một tiến hành rất tự nhiên\". Mẫu 2 có cùng tiến hành hợp âm, chỉ khác giai điệu và cách chơi. Nghe: C – Ebm7 – Ab7 – Db.", "tip": "\"Mẹ\" của Db: đếm Db, Eb, F, Gb, Ab, ra Ab7. \"Chị\": Db lên một cung là Eb.", "play": ["C", "Ebm7", "Ab7", "Db"]}, {"text": "Mẫu 3 gần giống mẫu 1, nhưng Ab7 có thêm b9, \"jazz hơn một chút\". Nốt b9 là nốt gốc nhích lên nửa cung: Ab lên nửa cung là phím A (viết theo chữ cái là Bbb, tức B giáng kép). Màu b9 làm \"mẹ\" căng hơn, nên lúc về Db nghe đã tai hơn. Nghe so sánh: Ab7 rồi Ab7(b9), cùng về Db.", "tip": "b9 của Ab7: Ab nhích lên nửa cung, phím A.", "compare": {"a": {"label": "Ab7 → Db", "play": ["Ab7", "Db"]}, "b": {"label": "Ab7(b9) → Db", "play": ["Ab7(b9)", "Db"]}}}, {"text": "Mẫu 4 \"còn jazz hơn nữa\": dùng D7(#11), hợp âm át thay thế (\"bạn của mẹ\") của Ab7. Vì sao thay được: D7 có F# và C, Ab7 có C và Gb, mà F# với Gb là cùng một phím (từ mức tay 2 app bấm đủ các nốt này), nên hai hợp âm chung tritone và cùng về Db. Mẫu 5 gần giống mẫu 4; mẫu 6 \"vừa mang màu sắc classical, vừa có chất pop\", thầy chỉ chơi, không đọc hợp âm. Nghe so sánh: Ebm7 – Ab7 – Db rồi Ebm7 – D7(#11) – Db.", "tip": "Nốt gốc của \"bạn của mẹ\" là đích nhích lên nửa cung: Db lên nửa cung là D. Tay phải của D7(#11) là hợp âm E: D lên một cung là E.", "compare": {"a": {"label": "Ebm7 – Ab7 – Db", "play": ["Ebm7", "Ab7", "Db"]}, "b": {"label": "Ebm7 – D7(#11) – Db", "play": ["Ebm7", "D7(#11)", "Db"]}}}, {"text": "Áp dụng cho giọng khác, ví dụ từ D lên Eb hay từ E lên F: tìm tip trong phần của giọng đó trong sách rồi chơi theo. Thầy nói giai điệu \"đều giống nhau\", mỗi giọng chỉ khác cao độ, \"nên các bạn phải thuộc nhuyễn line này\". Vì sao: lúc biểu diễn không có thời gian tính lại, chỉ line đã thuộc mới dùng kịp. Nghe: D lên Eb, cũng là lên nửa cung như C lên Db.", "tip": "D lên nửa cung là phím đen Eb ngay bên phải.", "keys": ["D4", "Eb4"], "play": [["D4"], ["Eb4"]]}], "remember": ["Chuyển giọng dùng ở đoạn nối hai bài, đa số đi lên: C → D (lên một cung), C → Db (lên nửa cung).", "C → D: Em7b5 – A7 → D (Em7 có sẵn trong C nên hạ B thành Bb; sách in nhầm \"flat 9\", đúng là flat 5).", "C → Db: Ebm7 – Ab7 → Db; jazz hơn: Ab7(b9), rồi D7(#11), \"bạn của mẹ\" của Ab7."], "items": [{"chord": "Em7b5", "to": "A7", "prog": ["C", "Em7b5", "A7", "D"]}, {"chord": "Ab7", "to": "Db", "prog": ["C", "Ebm7", "Ab7", "Db"]}, {"chord": "D7(#11)", "to": "Db", "prog": ["C", "Ebm7", "D7(#11)", "Db"]}], "quiz": [{"q": "Vì sao thầy đổi Em7 thành Em7b5 khi chuyển từ C lên D?", "choices": ["Em7 có sẵn trong giọng C nên hơi kém thú vị", "Em7 không phải \"chị\" của D", "Em7b5 là hợp âm chủ của giọng D", "Em7 có nốt Bb"], "answer": "Em7 có sẵn trong giọng C nên hơi kém thú vị", "why": "Em7 nằm sẵn trong giọng C nên tai chưa thấy rời giọng; hạ B thành Bb (Em7b5) thì nghe rõ là đang đi sang giọng mới."}, {"q": "Khi chuyển từ C lên Db, D7(#11) đứng thay cho hợp âm nào?", "choices": ["Ab7", "Ebm7", "Db", "A7"], "answer": "Ab7", "why": "D7 là \"bạn của mẹ\" của Ab7: chung tritone (C và F#, tức Gb), nên D7(#11) cũng về Db."}, {"q": "Vì sao chuyển giọng thường đẩy key đi lên?", "choices": ["Khi âm nhạc được đẩy cao trào, key đi lên tự nhiên hơn", "Vì hạ key xuống là sai luật", "Vì giọng D không có phím đen", "Vì bài sau luôn ở giọng C"], "answer": "Khi âm nhạc được đẩy cao trào, key đi lên tự nhiên hơn", "why": "Thầy nói hạ xuống cũng được nhưng không phổ biến; \"khi âm nhạc được đẩy cao trào, việc key đi lên sẽ tự nhiên hơn\"."}]},
  {"id": "p2-07", "part": 2, "src": "Phildave 2 · Video 2-7", "title": "Video 2-7: tái hoà âm trước bậc IV (F)", "teach": [{"text": "Từ video này đến 2-11, thầy dạy tái hoà âm (reharmony) theo bậc: trước khi một hợp âm đích xuất hiện, chèn II–V (\"chị\" rồi \"mẹ\") hoặc chỉ V (\"mẹ\"). Hợp âm đích nằm ở phách mạnh, tức phách 1 của ô nhịp; phần chuẩn bị đặt ở các phách yếu ngay trước nó. Nhưng không phải cứ thấy hợp âm đích là chèn II–V: chỉ chèn khi có chỗ trống phía trước và nghe tự nhiên. Video này đích là F, bậc IV của giọng C. Nghe so sánh: C đi thẳng về F, rồi C – Gm7 – C7 – F.", "tip": "Đếm \"một, hai, ba, bốn\" cho mỗi ô nhịp: chữ \"một\" là phách mạnh, F phải rơi đúng chữ \"một\".", "compare": {"a": {"label": "C → F", "play": ["C", "F"]}, "b": {"label": "C – Gm7 – C7 – F", "play": ["C", "Gm7", "C7", "F"]}}}, {"text": "Muốn về F thì tính II–V theo đích F, không theo giọng C. \"Mẹ\" của F (applied V, hợp âm át 7 làm bậc V của F) là C7 = C E G Bb; \"chị\" (bậc II của F) là Gm7 = G Bb D F. Nên trước F có thể chơi Gm7 – C7, hoặc chỉ C7. Vì sao: Bb không thuộc giọng C nhưng thuộc giọng F, nên nghe C7 là tai chờ F như chờ \"về nhà\" (từ mức tay 2 app bấm Bb ở tay trái của C7). Nghe so sánh: C7 → F, rồi Gm7 – C7 → F.", "tip": "\"Mẹ\" của F: đếm F, G, A, Bb, C, ra C7. \"Chị\": F lên một cung là G, ra Gm7.", "compare": {"a": {"label": "C7 → F (chỉ V)", "play": ["C7", "F"]}, "b": {"label": "Gm7 – C7 → F (II–V)", "play": ["Gm7", "C7", "F"]}}}, {"text": "Mẫu IV-2 dùng Gb7 thay cho C7. Thầy gọi Gb7 là dominant thay thế của C7, nói chính xác là \"dominant thay thế bậc hai\", tức hợp âm át thay thế phụ: \"bạn của mẹ\" (hợp âm 7 chung tritone với \"mẹ\") của một hợp âm át phụ, ở đây C7 là \"mẹ\" của F chứ không phải của C. C7 có E và Bb, Gb7 có Bb và Fb, mà Fb là phím E, nên hai hợp âm chung tritone và Gb7 cũng về F (từ mức tay 2 app bấm đủ các nốt này). Thầy nói \"những phần đó các bạn cần học thêm\". Nghe so sánh: C7 → F, rồi Gb7 → F.", "tip": "Nốt gốc của \"bạn của mẹ\" là đích nhích lên nửa cung: F lên nửa cung là phím đen Gb.", "compare": {"a": {"label": "C7 → F", "play": ["C7", "F"]}, "b": {"label": "Gb7 → F", "play": ["Gb7", "F"]}}}, {"text": "Thầy chỉ vị trí phách trên bài \"Đấng sống trong tôi\", ở chỗ trước khi F xuất hiện. Mẫu IV-1 chỉ có V: chơi ở phách 2, rồi phách 3, 4, sau đó vào F. Mẫu IV-2 (Gb7): phách 1, phách 2 nghỉ, rồi phách 3, phách 4 mới vào. Mẫu IV-3 nghỉ ba phách rồi mới vào ở phách 4. Dù vào sớm hay muộn, F vẫn rơi đúng phách mạnh, và \"từ đây thì các bạn cứ chơi theo đúng style của bài\": \"điều quan trọng là quá trình trước khi F xuất hiện\".", "tip": "Vào muộn (phách 4) thì chỉ kịp một hợp âm ngắn; vào sớm (phách 2) thì \"mẹ\" vang lâu hơn.", "compare": {"a": {"label": "Chỉ V (như mẫu IV-1): C7 → F", "play": ["C7", "F"]}, "b": {"label": "Dominant thay thế (như mẫu IV-2): Gb7 → F", "play": ["Gb7", "F"]}}}, {"text": "Mẫu IV-4 chơi trọn cả ô nhịp trước khi F xuất hiện, và có cả II–V: Gm7 đặt ngay ở chữ \"duy nhất\" của câu hát, rồi đến C7, rồi vào F. Thầy nói từ mẫu IV-4 trở đi mới có thêm II (\"chị\") phía trước; mẫu 1 đến 3 chỉ có V. \"Người hát vẫn cứ hát line đó\", còn piano chơi line của mình, không cần đánh đủ giai điệu. Nghe: C – Gm7 – C7 – F.", "tip": "Gm7 = hợp âm Gm (G Bb D) thêm nốt 7: G lùi một cung là F.", "play": ["C", "Gm7", "C7", "F"]}, {"text": "Các mẫu IV-5 (\"khá lạ màu\"), IV-6 (màu \"khá khác biệt\"), IV-7 (một line khác, \"II–V thì đều giống nhau\") và IV-8 (khá giống mẫu 7) thầy chỉ chơi, không đọc hợp âm, nên hãy xem sách hoặc video. Mẫu IV-9 \"rất cơ bản\": giống mẫu IV-1 nhưng \"phía trước có thêm II\", tức có \"chị\" Gm7 trước C7. Thầy dặn học thuộc các mẫu IV-1, 2, 3, 4, vì trong đó \"có cả II–V, chỉ có V\". Nghe hai kiểu cần thuộc: chỉ C7 → F, rồi Gm7 – C7 → F.", "tip": "Chỉ V khi chỗ trống ngắn; II–V khi có gần trọn một ô nhịp.", "compare": {"a": {"label": "Chỉ V", "play": ["C7", "F"]}, "b": {"label": "II–V", "play": ["Gm7", "C7", "F"]}}}, {"text": "Thầy nói đây là phần \"có xác suất áp dụng thành công cao nhất\", vì hợp âm F, tức hợp âm bậc IV, \"xuất hiện rất nhiều trong hầu hết mọi bài\". Ví dụ riêng bài \"Đấng sống trong tôi\" thầy đã chỉ ra nhiều chỗ đi vào F. Thầy dặn: \"Để đi vào hợp âm đó, hãy áp dụng thật tốt những cách xử lý đẹp này nhé.\" Nghe lại: Gm7 – C7 – F.", "tip": "Gặp F ở phách mạnh trong bài giọng C là chỗ thử ngay Gm7 – C7 hoặc C7.", "play": ["Gm7", "C7", "F"]}], "remember": ["Đích ở phách mạnh, phần chuẩn bị (II–V hoặc chỉ V) ở phách yếu ngay trước; không phải cứ thấy đích là chèn.", "Về F: Gm7 – C7 → F, hoặc chỉ C7 → F; Gb7 (hợp âm át thay thế phụ) thay được cho C7.", "Học thuộc mẫu IV-1, 2, 3, 4; bậc IV dễ áp dụng nhất vì bài nào cũng hay có F."], "items": [{"chord": "C7", "to": "F", "prog": ["C7", "F"]}, {"chord": "Gm7", "to": "C7", "prog": ["C", "Gm7", "C7", "F"]}, {"chord": "Gb7", "to": "F", "prog": ["Gb7", "F"]}], "quiz": [{"q": "Vì sao Gb7 dùng được thay cho C7 khi đi về F?", "choices": ["Gb7 chung tritone với C7", "Gb7 là hợp âm trong giọng C", "Gb7 là \"chị\" của F", "Gb7 có nốt F trên cùng"], "answer": "Gb7 chung tritone với C7", "why": "C7 có E và Bb, Gb7 có Bb và Fb (phím E): chung tritone nên Gb7 là \"bạn của mẹ\" của C7, cũng về F."}, {"q": "Mẫu IV-1, 2, 3 chuẩn bị cho F bằng gì?", "choices": ["Chỉ V (C7 hoặc Gb7)", "Đủ II–V (Gm7 – C7)", "Chỉ II (Gm7)", "Hợp âm mượn Fm"], "answer": "Chỉ V (C7 hoặc Gb7)", "why": "Thầy nói từ mẫu IV-4 trở đi mới có thêm II phía trước; mẫu 1 dùng C7, mẫu 2 dùng Gb7."}, {"q": "Vì sao thầy nói tái hoà âm bậc IV có xác suất áp dụng thành công cao nhất?", "choices": ["Vì F xuất hiện trong hầu hết mọi bài", "Vì F không cần phách mạnh", "Vì C7 có sẵn trong giọng C", "Vì chỉ dùng ở cuối bài"], "answer": "Vì F xuất hiện trong hầu hết mọi bài", "why": "Hợp âm bậc IV (F) \"xuất hiện rất nhiều trong hầu hết mọi bài\", nên có nhiều chỗ để chèn Gm7 – C7 hoặc C7."}]},
  {"id": "p2-08", "part": 2, "src": "Phildave 2 · Video 2-8", "title": "Video 2-8: tái hoà âm trước bậc VI (Am)", "teach": [{"text": "Video 2-8 đi về Am, bậc VI của giọng C: đếm C, D, E, F, G, A, nốt thứ sáu là A, dựng hợp âm thứ là Am. Sách ghi II–V–I về Am là Bm7 – E7 → Am. Thầy đính chính: mẫu VI-3 ghi Bm7b5 \"mới đúng. Đó là dạng gốc, còn Bm7 có thể xem là dạng biến thể\". Vì sao: Am là đích thứ, mà \"chị\" của đích thứ là hợp âm m7b5 (đã học ở Phildave 3). Nghe so sánh: Bm7b5 – E7 – Am, rồi Bm7 – E7 – Am.", "tip": "\"Mẹ\" của Am: đếm A, B, C, D, E, ra E7. \"Chị\": A lên một cung là B.", "compare": {"a": {"label": "Bm7b5 – E7 – Am (gốc)", "play": ["Bm7b5", "E7", "Am"]}, "b": {"label": "Bm7 – E7 – Am (biến thể)", "play": ["Bm7", "E7", "Am"]}}}, {"text": "Mẫu VI-1 và VI-3 chỉ khác nhau ở \"chị\": một cái là Bm7 (B D F# A), một cái là Bm7b5 (B D F A), tức hạ nốt 5 là F# xuống nửa cung thành F. Thầy nói: \"Một cái có F#, còn một cái có F tự nhiên. Chỉ khác nhau chỗ đó thôi.\" Bm7b5 là hợp âm có sẵn trong giọng C (dựng trên bậc VII), nên nghe hoà vào bài; F# thì nằm ngoài giọng C. Nghe so sánh: Bm7 rồi Bm7b5, để ý nốt giữa của tay phải.", "tip": "Bm7 thành Bm7b5: hạ F# xuống nửa cung là phím trắng F.", "compare": {"a": {"label": "Bm7 (có F#)", "play": ["Bm7"]}, "b": {"label": "Bm7b5 (có F)", "play": ["Bm7b5"]}}}, {"text": "Vị trí đặt: \"Không phải là đưa reharmony ngay vào phách mạnh.\" Cách dùng chủ yếu là khi Am rơi vào phách mạnh, phần chuẩn bị đặt ở phách yếu trước đó; thầy dặn \"không phải cứ thấy Am là áp dụng II–V ngay\". Trên bài \"Đấng sống trong con\", thầy chỉ chỗ \"sống trong\" và câu \"dù sự chết của con\" là những chỗ hay dùng. Nghe: Bm7b5 – E7 rồi Am ở phách mạnh.", "tip": "Nghe bài, đếm phách: chỗ Am rơi đúng chữ \"một\" là chỗ thử chèn \"chị\" – \"mẹ\".", "play": ["Bm7b5", "E7", "Am"]}, {"text": "Các mẫu trong sách chơi II và V trọn một ô nhịp, hợp với bài có trọn một ô trước Am, như điệp khúc đi về Am của \"Như nai khát nước\" (mẫu VI-4). Nếu chỉ có hai phách trống thì rút gọn: Bm7 một phách, E7 một phách, rồi vào Am. Cũng có thể dùng ngay các mẫu ngắn VI-9, VI-10, VI-11; thầy thử ở câu \"dù sự chết\" và nói \"có lẽ số 9 khá ổn\". Mẫu VI-2 nếu chơi đủ thì thành nốt móc kép (mỗi phách bốn nốt nhanh). Nghe: Bm7 – E7 – Am, mỗi hợp âm chuẩn bị một phách.", "tip": "Hai phách: đếm \"một\" bấm Bm7, \"hai\" bấm E7, chữ \"một\" của ô sau là Am.", "play": ["Bm7", "E7", "Am"]}, {"text": "Mẫu VI-10 có Bb7. Theo luật \"bạn của mẹ\" ở Phildave 3 (hợp âm 7 chung tritone với \"mẹ\", nốt gốc là đích nhích lên nửa cung), Bb7 là \"bạn của mẹ\" của E7; thầy chỉ đọc tên Bb7, phần giải thích này là của app. E7 có G# và D, Bb7 có D và Ab, mà G# với Ab là cùng một phím (từ mức tay 2 app bấm đủ các nốt này). Mẫu VI-7 và VI-8 \"chỉ dùng dominant 7, không có bậc II\": chỉ có \"mẹ\" rồi vào Am. Nghe so sánh: E7 → Am, rồi Bb7 → Am.", "tip": "Nốt gốc của \"bạn của mẹ\": A nhích lên nửa cung là phím đen Bb.", "compare": {"a": {"label": "E7 → Am", "play": ["E7", "Am"]}, "b": {"label": "Bb7 → Am", "play": ["Bb7", "Am"]}}}, {"text": "Ví dụ thầy sắp xếp bài \"Con thờ phượng Ngài\": Bm7b5 chơi một phách, rồi E7 một phách; \"khi rơi đúng vào Am, hãy mở ra một chút, rồi kết bằng C trong hai phách\". Thầy còn lấy line trong sách cho tự nhiên, ví dụ D, F rồi G, F, mỗi cặp một phách. Lời khuyên: học cách lấy chất liệu từ bản nhạc gốc để tạo line riêng, vì nếu sách ghi hết từng phách thì \"cuốn sách này sẽ dày quá mức\". Nghe: Bm7b5 – E7 – Am – C.", "tip": "Bm7b5 ở tay phải app là hợp âm Dm (D F A) đặt trên B ở tay trái.", "play": ["Bm7b5", "E7", "Am", "C"]}], "remember": ["Về Am: Bm7b5 – E7 → Am; Bm7b5 là gốc, Bm7 là biến thể (khác nhau ở F và F#).", "Chỉ chèn khi Am rơi phách mạnh; có hai phách thì Bm7 một phách, E7 một phách.", "Mẫu VI-10 dùng Bb7 (\"bạn của mẹ\" của E7); VI-7, VI-8 chỉ có V."], "items": [{"chord": "Bm7b5", "to": "E7", "prog": ["Bm7b5", "E7", "Am", "C"]}, {"chord": "Bm7", "to": "E7", "prog": ["Bm7", "E7", "Am"]}, {"chord": "Bb7", "to": "Am", "prog": ["Bb7", "Am"]}], "quiz": [{"q": "Theo thầy, \"chị\" dạng gốc của Am là hợp âm nào?", "choices": ["Bm7b5", "Bm7", "Bb7", "Dm7"], "answer": "Bm7b5", "why": "Thầy đính chính: Bm7b5 là bậc II nguyên bản của Am, còn Bm7 sách ghi chỉ là dạng biến thể."}, {"q": "Bm7 và Bm7b5 khác nhau ở nốt nào?", "choices": ["F# và F", "B và Bb", "D và Db", "A và Ab"], "answer": "F# và F", "why": "Bm7 = B D F# A, Bm7b5 = B D F A: chỉ hạ nốt 5 (F#) xuống nửa cung thành F."}, {"q": "Khi nào nên chèn II–V trước Am?", "choices": ["Khi Am rơi vào phách mạnh và có chỗ trống phía trước", "Mỗi lần thấy Am", "Khi Am nằm giữa câu", "Chỉ ở ô nhịp đầu bài"], "answer": "Khi Am rơi vào phách mạnh và có chỗ trống phía trước", "why": "Phần chuẩn bị đặt ở phách yếu trước Am; \"không phải cứ thấy Am là áp dụng II–V ngay\"."}]},
  {"id": "p2-09", "part": 2, "src": "Phildave 2 · Video 2-9", "title": "Video 2-9: tái hoà âm trước bậc III (Em)", "teach": [{"text": "Video 2-9 đi về Em, bậc III của giọng C. \"Chị\" của Em là F#m7b5 (F# A C E): tay trái F#, tay phải hợp âm Am (A C E), nên còn viết là Am/F#; \"mẹ\" là B7. Vì sao là m7b5: Em là đích thứ, mà \"chị\" của đích thứ là hợp âm m7b5, giống Bm7b5 trước Am ở video 2-8. Nghe: F#m7b5 – B7 – Em.", "tip": "\"Mẹ\" của Em: đếm E, F#, G, A, B, ra B7.", "play": ["F#m7b5", "B7", "Em"]}, {"text": "Ví dụ của thầy: bản gốc chỉ dùng hợp âm trong giọng, F rồi G/F (tay trái F, tay phải hợp âm G) rồi về Em. Thầy đổi thành F#m7b5 – B7(b9 b13) → Em, bass là F#, và nói \"cảm giác hoàn toàn khác\". Nốt b9 của B7 là C và nốt b13 là G: hai màu biến đổi này làm \"mẹ\" căng hơn trước khi về Em. Nghe so sánh: F – G/F – Em, rồi F#m7b5 – B7(b9 b13) – Em.", "tip": "b9 của B7: B nhích lên nửa cung là C. b13: nốt 5 (F#) nhích lên nửa cung là G.", "compare": {"a": {"label": "F – G/F – Em (bản gốc)", "play": ["F", "G/F", "Em"]}, "b": {"label": "F#m7b5 – B7(b9 b13) – Em", "play": ["F#m7b5", "B7(b9 b13)", "Em"]}}}, {"text": "Thực tế hiếm khi có hai ô nhịp trước Em như ví dụ trong sách. Nếu chỉ có hai phách: F#m7b5 một phách, B7(#9) một phách, rồi rơi thẳng vào Em. Còn có thể chia tiếp thành nốt móc đơn (mỗi phách hai nốt), bằng cách chọn và gộp các nốt quan trọng trong line. Nốt #9 của B7 là D, cùng phím với bậc 3 của hợp âm thứ Bm. Nghe: F#m7b5 – B7(#9) – Em.", "tip": "#9 của B7 viết đúng là C## (C thăng kép), nhưng bấm đúng phím D.", "play": ["F#m7b5", "B7(#9)", "Em"]}, {"text": "Điều kiện: Em phải rơi vào phách mạnh mới chuẩn bị được. Ví dụ \"Thánh thay\" không dùng được, vì Em quá sát phía trước, nằm giữa câu; bài chậm thì có nhiều chỗ hơn. Thầy thử một chỗ khác rồi hỏi: \"Nghe gượng đúng không? Nếu gượng thì đừng dùng.\" Vì vậy \"thông thường chỉ dùng V\": B7 vào Em, và thầy tận dụng line của B7. Nghe: B7 → Em.", "tip": "B7 = B D# F# A: D# là phím đen ngay bên trái E.", "play": ["B7", "Em"]}, {"text": "Có chỗ vốn là F rồi Em bình thường; thầy dùng F#m7b5 thay cho F, và nói \"thật ra có khá nhiều chỗ áp dụng được\". Vì sao nghe hợp (app giải thích): F#m7b5 giữ hai nốt A và C của F, còn bass F# đi xuống E chỉ một bước. Lời khuyên của thầy: trong nhiều bài, khi thấy Em rơi vào phách mạnh, hãy thử tìm xem dùng được ở đâu. Nghe so sánh: F → Em, rồi F#m7b5 → Em.", "tip": "F thành F#m7b5: tay trái nhích F lên phím đen bên phải, tay phải đổi sang hợp âm Am.", "compare": {"a": {"label": "F → Em", "play": ["F", "Em"]}, "b": {"label": "F#m7b5 → Em", "play": ["F#m7b5", "Em"]}}}], "remember": ["Về Em: F#m7b5 (= Am/F#) – B7(b9 b13) → Em; có hai phách thì F#m7b5 một phách, B7(#9) một phách.", "Em phải rơi đúng phách mạnh; \"nếu gượng thì đừng dùng\"; thường chỉ dùng V (B7).", "Chỗ F rồi Em: có thể thay F bằng F#m7b5."], "items": [{"chord": "B7(b9 b13)", "to": "Em", "prog": ["F#m7b5", "B7(b9 b13)", "Em"]}, {"chord": "B7(#9)", "to": "Em", "prog": ["F#m7b5", "B7(#9)", "Em"]}, {"chord": "F#m7b5", "to": "F", "rel": "sub", "prog": ["F#m7b5", "Em"]}], "quiz": [{"q": "Khi nào thầy nói đừng chèn II–V trước Em?", "choices": ["Khi nghe gượng, như lúc Em nằm giữa câu", "Khi Em rơi vào phách mạnh", "Khi bài hát chậm", "Khi có hai phách trống trước Em"], "answer": "Khi nghe gượng, như lúc Em nằm giữa câu", "why": "Em phải rơi vào phách mạnh mới chuẩn bị được; \"nếu gượng thì đừng dùng\", và thường chỉ dùng V."}, {"q": "Chỉ có hai phách trước Em thì chơi thế nào?", "choices": ["F#m7b5 một phách, B7(#9) một phách", "F rồi G/F, mỗi hợp âm một ô nhịp", "Bỏ Em, chơi B7 hai phách", "Bm7b5 một phách, E7 một phách"], "answer": "F#m7b5 một phách, B7(#9) một phách", "why": "Thầy rút gọn II–V vào hai phách: F#m7b5 một phách, B7(#9) một phách, rồi rơi thẳng vào Em."}, {"q": "F#m7b5 còn được viết thành hợp âm nào?", "choices": ["Am/F#", "F#m7", "Am7", "D/F#"], "answer": "Am/F#", "why": "F#m7b5 = F# A C E: tay trái F#, tay phải hợp âm Am (A C E), nên viết là Am/F#."}]},
  {"id": "p2-10", "part": 2, "src": "Phildave 2 · Video 2-10", "title": "Video 2-10: tái hoà âm trước bậc II (Dm)", "teach": [{"text": "Video 2-10 đi về Dm, bậc II của giọng C; thầy nói Dm \"xuất hiện khá thường xuyên\", ví dụ trong bài \"Cha yêu dấu của con\". Vẫn như các video trước: II–V–I về Dm, hoặc chỉ V; \"mẹ\" của Dm là A7. Thầy nhấn mạnh: \"Dm là chỗ đã được định sẵn\", còn \"phần có nhiều cách xử lý, là ngay phía trước nó\", và các mẫu ở đây thể hiện trong hai phách. Nghe so sánh: chỉ Dm, rồi A7 → Dm.", "tip": "\"Mẹ\" của Dm: đếm D, E, F, G, A, ra A7.", "compare": {"a": {"label": "Chỉ Dm", "play": ["Dm"]}, "b": {"label": "A7 → Dm", "play": ["A7", "Dm"]}}}, {"text": "Mẫu II-1: Asus4 rồi A7, rồi A7(b9). Hợp âm treo (sus4) thay bậc 3 bằng bậc 4: Asus4 = A D E, nghe lơ lửng; đưa D xuống C# là giải quyết thành A7. Thầy nói khi giải quyết từ sus4 thì \"đồng thời tạo ra màu flat 9\": nốt b9 của A7 là Bb, trong app là nốt trên cùng A nhích lên Bb. Dm phía sau \"không quan trọng lắm\": \"Asus4, rồi A7, A7b9, phần đó mới quan trọng\". Nghe: Asus4 – A7 – A7(b9) – Dm.", "tip": "b9 của A7: A nhích lên nửa cung là Bb.", "play": ["Asus4", "A7", "A7(b9)", "Dm"]}, {"text": "Mẫu II-3 là II–V–I: Em7 – A7 về Dm. Nhưng thầy nói \"Em7 không phải dạng gốc\": \"chị\" nguyên bản của Dm là Em7b5 (E G Bb D), có ở mẫu II-4. Vì sao: Dm là đích thứ, mà \"chị\" của đích thứ là hợp âm m7b5, giống Bm7b5 trước Am. Dạng gốc thầy nêu là Em7b5 – A7(b9). Nghe so sánh: Em7 – A7 – Dm, rồi Em7b5 – A7(b9) – Dm.", "tip": "Em7 thành Em7b5: hạ B xuống nửa cung thành Bb.", "compare": {"a": {"label": "Em7 – A7 – Dm", "play": ["Em7", "A7", "Dm"]}, "b": {"label": "Em7b5 – A7(b9) – Dm (gốc)", "play": ["Em7b5", "A7(b9)", "Dm"]}}}, {"text": "Ở mẫu II-4, sau Em7b5, \"mẹ\" xuất hiện dưới dạng Eb7(#11). Thế bấm thầy chỉ: tay trái Eb7 bấm gần nhau (closed voicing) gồm nốt gốc, bậc 3 và bậc 7, tức Eb G Db, còn bậc 5 (Bb) \"có thể bỏ. Thật ra thường bỏ luôn\"; tay phải đánh nguyên hợp âm F (F A C). Sách ký hiệu là F đặt trên Eb7, gạch phân số nằm ngang; từ mức tay 2, app bấm đúng thế này: tay trái Eb G Db, tay phải C F A. Chỗ ngắn thì một phách cho II, một phách cho V, hoặc chia thành nốt móc đơn: Em7b5 rồi Eb7(#11). Nghe: Em7b5 – Eb7(#11) – Dm.", "tip": "Tay phải hợp âm F: Eb lên một cung là F. Nốt A trong hợp âm F là #11 của Eb (nốt 11 là Ab, nâng nửa cung là A).", "play": ["Em7b5", "Eb7(#11)", "Dm"]}, {"text": "Thầy nói F trên Eb7 \"cũng thuộc cùng họ với A7\", nên hợp: Eb7 là \"bạn của mẹ\" của A7 (như thầy gọi ở video 2-3; nhắc: hợp âm 7 chung tritone với \"mẹ\"). A7 có C# và G, Eb7 có G và Db, mà C# với Db là cùng một phím (từ mức tay 2 app bấm đủ các nốt này). Dạng gốc là A7, nên có thể đổi ngược Eb7(#11) thành A7. Nghe so sánh: Em7b5 – A7(b9) – Dm, rồi Em7b5 – Eb7(#11) – Dm.", "tip": "Nốt gốc của \"bạn của mẹ\": D nhích lên nửa cung là phím đen Eb.", "compare": {"a": {"label": "Em7b5 – A7(b9) – Dm", "play": ["Em7b5", "A7(b9)", "Dm"]}, "b": {"label": "Em7b5 – Eb7(#11) – Dm", "play": ["Em7b5", "Eb7(#11)", "Dm"]}}}, {"text": "Mẫu II-6 là C#dim7 (C# E G Bb). Thầy nói \"C#dim7 cũng có thể thay cho A7, nghĩ ngược lại cũng được. Đây là hợp âm thay thế.\" Vì sao (app giải thích): A7(b9) là A C# E G Bb, bỏ nốt gốc A thì còn đúng C# E G Bb, tức C#dim7. Nghe so sánh: A7 → Dm, rồi C#dim7 → Dm.", "tip": "C#dim7 trong app: tay trái C#, tay phải E G Bb.", "compare": {"a": {"label": "A7 → Dm", "play": ["A7", "Dm"]}, "b": {"label": "C#dim7 → Dm", "play": ["C#dim7", "Dm"]}}}, {"text": "Trong \"Cha yêu dấu của con\" có hai chỗ về Dm, và thầy dặn \"không nên chơi giống hệt nhau\": lần đầu thầy dùng mẫu 1, lần sau dùng mẫu 4. Mẫu II-5 cũng theo ý đó: lần một Asus4 giải quyết xuống như mẫu 1, lần hai đổi thành C#dim7, đi lên C# \"rất rõ ràng\". Mẫu II-2 thầy chỉ chơi, không đọc hợp âm, nên hãy xem sách hoặc video. Nghe so sánh: lần đầu (mẫu 1), lần sau (mẫu 4).", "tip": "Cùng một đích lặp lại thì đổi mẫu: lần này sus4, lần sau Eb7(#11) hay C#dim7.", "compare": {"a": {"label": "Lần đầu: mẫu II-1", "play": ["Asus4", "A7", "A7(b9)", "Dm"]}, "b": {"label": "Lần sau: mẫu II-4", "play": ["Em7b5", "Eb7(#11)", "Dm"]}}}], "remember": ["Về Dm: Asus4 → A7 → A7(b9) (treo rồi giải quyết, kèm b9); \"chị\" gốc là Em7b5, Em7 không phải dạng gốc.", "Eb7(#11): tay trái Eb G Db (bỏ nốt 5), tay phải hợp âm F; cùng họ với A7. C#dim7 thay được A7.", "Hai chỗ về Dm trong một bài: không nên chơi giống hệt nhau."], "items": [{"chord": "Asus4", "to": "A7", "rel": "line", "prog": ["Asus4", "A7", "A7(b9)", "Dm"]}, {"chord": "Eb7(#11)", "to": "Dm", "prog": ["Em7b5", "Eb7(#11)", "Dm"]}, {"chord": "C#dim7", "to": "Dm", "prog": ["C#dim7", "Dm"]}], "quiz": [{"q": "Theo thầy, \"chị\" nguyên bản của Dm là hợp âm nào?", "choices": ["Em7b5", "Em7", "Asus4", "C#dim7"], "answer": "Em7b5", "why": "Thầy nói Em7 không phải dạng gốc; Dm là đích thứ nên \"chị\" gốc là Em7b5 (E G Bb D)."}, {"q": "Eb7(#11) ở mẫu II-4 bấm thế nào?", "choices": ["Tay trái Eb G Db, tay phải hợp âm F", "Tay trái Eb, tay phải hợp âm Eb", "Tay trái A, tay phải hợp âm F", "Tay trái Eb Bb, tay phải hợp âm Dm"], "answer": "Tay trái Eb G Db, tay phải hợp âm F", "why": "Tay trái Eb7 gồm nốt gốc, bậc 3, bậc 7 (bỏ nốt 5), tay phải nguyên hợp âm F; nốt A của F là #11 của Eb."}, {"q": "C#dim7 ở mẫu II-6 đứng thay cho hợp âm nào?", "choices": ["A7", "Dm", "Em7b5", "Asus4"], "answer": "A7", "why": "Thầy nói C#dim7 dùng thay cho A7; C# E G Bb chính là A7(b9) bỏ nốt gốc A."}]},
  {"id": "p2-11", "part": 2, "src": "Phildave 2 · Video 2-11", "title": "Video 2-11: tái hoà âm trước bậc I (C)", "teach": [{"text": "Video 2-11 đi về C, bậc I, \"loại xuất hiện nhiều nhất\". II–V–I về C là Dm7 – G7 – C: \"chị\" Dm7 và \"mẹ\" G7 \"cũng chỉ dùng các nốt có sẵn trong scale C\". Vì vậy \"phải chơi thật tốt thì mới tạo được cảm giác tinh tế\": không có nốt lạ nào làm tai chú ý, nên phải nhờ thế bấm và line hay. Nghe so sánh: G7 → C, rồi Dm7 – G7 → C.", "tip": "\"Chị\" của C: C lên một cung là D, ra Dm7. \"Mẹ\": đếm C, D, E, F, G, ra G7.", "compare": {"a": {"label": "G7 → C", "play": ["G7", "C"]}, "b": {"label": "Dm7 – G7 → C", "play": ["Dm7", "G7", "C"]}}}, {"text": "Mẫu I-2 dùng màu biến đổi (altered tension): G7 thêm #9 và b13, tức G7(#9 b13). Nốt #9 của G là Bb (viết đúng là A#), nốt b13 là Eb; cả hai nằm ngoài giọng C, nên \"mẹ\" nghe căng hơn hẳn trước khi về C. Ở mọi mức tay, tay phải app bấm Eb G Bb (hợp âm Eb); từ mức tay 2, tay trái là G B F. Nghe so sánh: Dm7 – G7 – C, rồi Dm7 – G7(#9 b13) – C.", "tip": "b13 của G7: nốt 5 (D) nhích lên nửa cung là Eb. #9: cùng phím với bậc 3 của Gm, là Bb.", "compare": {"a": {"label": "Dm7 – G7 – C", "play": ["Dm7", "G7", "C"]}, "b": {"label": "Dm7 – G7(#9 b13) – C", "play": ["Dm7", "G7(#9 b13)", "C"]}}}, {"text": "Mẫu I-4 dùng Db7(#11), hợp âm át thay thế (\"bạn của mẹ\") của G7; chỗ đó \"có thể là vị trí của G7\", cũng có thể là Db7(#11). Thầy giải thích: nốt định hướng (guide tones) của G7 là B và F; Db7 cũng có hai nốt đó, với Db7 là bậc 7 (viết đúng là Cb, cùng phím B) và bậc 3 (F), với G7 là bậc 3 và bậc 7. \"Vì guide tones giống nhau, chúng có thể thay thế cho nhau.\" Từ mức tay 2, tay trái app bấm Db F B, tay phải hợp âm Eb (Eb G Bb; Db lên một cung là Eb), trong đó G là #11 của Db. Nghe so sánh: Dm7 – G7 – C, rồi Dm7 – Db7(#11) – C.", "tip": "Nốt gốc của \"bạn của mẹ\": C nhích lên nửa cung là Db. Bậc 7 của Db7: Db lùi một cung là Cb, tức phím B.", "compare": {"a": {"label": "Dm7 – G7 – C", "play": ["Dm7", "G7", "C"]}, "b": {"label": "Dm7 – Db7(#11) – C", "play": ["Dm7", "Db7(#11)", "C"]}}}, {"text": "Thầy chỉ thêm: trong bậc V \"đã ẩn sẵn\" II liên quan (\"chị\"). G7 thêm nốt 9 là G B D F A, mà D F A chính là Dm. Tương tự, Db7 thêm nốt 9 là Db F Ab Cb Eb, trong đó Ab Cb Eb là Abm, nên Abm7 là \"chị\" của Db7: Abm7 – Db7 → C. Nếu xem Gb là bậc I thì Db7 phải về Gb, nhưng \"vì ta dùng nó như hợp âm thay thế của G7, nên dù C xuất hiện ở đây vẫn nghe tự nhiên\". Nghe so sánh: G7 thêm 9 (tay trái G B, tay phải Dm), rồi Abm7 – Db7 – C.", "tip": "\"Chị\" của Db7: từ Db đếm lên 5 tên nốt (Db, Eb, F, Gb, Ab) là Ab, nên là Abm7.", "compare": {"a": {"label": "G7 thêm 9: tay phải là Dm", "play": [["G2", "B2", "|", "D4", "F4", "A4"]]}, "b": {"label": "Abm7 – Db7 – C", "play": ["Abm7", "Db7", "C"]}}}, {"text": "Mẫu I-5 dùng hợp âm mượn: Fm (mượn từ C thứ) trên bass G, tức Fm/G; thầy nhắc kết Amen (kiểu kết IV về I) và nói \"rất hay dùng\". Mẫu I-6 giống mẫu 5 nhưng thêm một nốt, và thầy dặn \"đừng nhầm nhé\": thêm B thì thành G7(b9), không có B thì là Fm. Vì sao: B là bậc 3 của G, có B thì tai nghe ra G7 (G B F) với Ab là nốt b9; không có B thì tai nghe Fm. App minh hoạ: bản a tay trái G, tay phải F Ab C; bản b thêm B ở tay trái và bỏ C, vì C nằm ngay trên B là nốt nên tránh (Phildave 3 bài 14–15). Thế bấm đúng của mẫu I-6 xem sách hoặc video.", "tip": "Fm/G: tay trái G, tay phải hợp âm Fm (F Ab C). Có B ở tay trái (và bỏ C) là ra G7(b9).", "compare": {"a": {"label": "Fm/G (mẫu I-5)", "play": [["G2", "|", "F4", "Ab4", "C5"], "C"]}, "b": {"label": "Có B: G7(b9) (mẫu I-6)", "play": [["G2", "B2", "|", "F4", "Ab4"], "C"]}}}, {"text": "Thầy còn nói tới kiểu II–V lặp hai lần: phía trước đã có một II–V, đáng lẽ về bậc I, lại lặp thêm một II–V nữa (thầy không đọc rõ hợp âm của kiểu này, xem sách hoặc video): \"thêm một biểu hiện kịch tính nữa. Như vậy cũng không lạ.\" Các tiến hành về bậc I này dùng nhiều ở turnaround (đoạn quay về đầu bài) và trước đoạn piano solo; thầy nói tái hoà âm bậc I \"hơi giống với turnaround\", vì đều là II–V–I về bậc I. Kiểu lặp này không có hợp âm cụ thể, nên ở đây chỉ nghe lại một II–V về C đã học: Abm7 – Db7 – C.", "tip": "Abm7: Ab lùi một cung là Gb, nốt 7 của Abm7.", "play": ["Abm7", "Db7", "C"]}, {"text": "Ứng dụng trong \"Cha yêu dấu của con\", câu kết \"con tôn cao danh Ngài\" về C: G là V, thêm II liên quan phía trước thành Dm7 – G7. Cũng dùng được Fm/G thay G7, nhưng \"nếu thấy lạ quá thì không dùng cũng được\". Ở chỗ khác thầy dùng mẫu I-6, G7(b9); có chỗ giai điệu đang là C nên thầy tìm chỗ khác. Nghe so sánh: Dm7 – G7 – C, rồi Dm7 – Fm/G – C.", "tip": "Fm/G và G7 cùng bass G, nên đổi qua lại không làm lệch dòng bass.", "compare": {"a": {"label": "Dm7 – G7 – C", "play": ["Dm7", "G7", "C"]}, "b": {"label": "Dm7 – Fm/G – C", "play": ["Dm7", "Fm/G", "C"]}}}], "remember": ["Dm7 – G7 → C chỉ dùng nốt trong giọng nên phải chơi tinh tế; màu hơn: G7(#9 b13), hoặc Db7(#11) (chung nốt định hướng B–F với G7, với Db7 viết Cb–F).", "Fm/G (mẫu I-5) và G7(b9) (mẫu I-6) khác nhau đúng nốt B: đừng nhầm.", "Abm7 – Db7 → C; các tiến hành về bậc I hay dùng ở turnaround và trước đoạn piano solo."], "items": [{"chord": "G7(#9 b13)", "to": "C", "prog": ["Dm7", "G7(#9 b13)", "C"]}, {"chord": "Db7(#11)", "to": "C", "prog": ["Dm7", "Db7(#11)", "C"]}, {"chord": "Fm/G", "rel": "modal", "prog": ["Dm7", "Fm/G", "C"]}], "quiz": [{"q": "Vì sao Db7 thay được G7 khi về C?", "choices": ["Hai hợp âm chung nốt định hướng B và F (với Db7 là Cb và F)", "Db7 là hợp âm trong giọng C", "Db7 có nốt C trên cùng", "Db7 là \"chị\" của G7"], "answer": "Hai hợp âm chung nốt định hướng B và F (với Db7 là Cb và F)", "why": "G7 có B (bậc 3) và F (bậc 7); Db7 có F (bậc 3) và Cb, cùng phím B (bậc 7): \"guide tones giống nhau\" nên thay được."}, {"q": "Mẫu I-5 (Fm/G) và mẫu I-6 (G7(b9)) khác nhau ở nốt nào?", "choices": ["B", "C", "F", "Ab"], "answer": "B", "why": "Thầy dặn \"đừng nhầm\": thêm B (bậc 3 của G) thì thành G7(b9), không có B thì là Fm."}, {"q": "Vì sao Dm7 – G7 – C phải chơi thật tinh tế?", "choices": ["Vì cả hai hợp âm chỉ dùng nốt có sẵn trong giọng C", "Vì G7 có nhiều nốt ngoài giọng C", "Vì Dm7 là hợp âm mượn", "Vì C không phải bậc I"], "answer": "Vì cả hai hợp âm chỉ dùng nốt có sẵn trong giọng C", "why": "Không có nốt lạ nào làm tai chú ý, nên \"phải chơi thật tốt thì mới tạo được cảm giác tinh tế\"."}]},
  {"id": "p2-12", "part": 2, "src": "Phildave 2 · Video 2-12", "title": "Video 2-12: hợp âm mượn theo nốt giai điệu", "teach": [{"text": "Video 2-12 là hợp âm mượn (modal interchange): nhắc lại, đó là hợp âm vốn thuộc giọng khác, chủ yếu là C thứ, đem vào bài giọng C. Điều kiện của thầy rất gọn: \"chỉ cần không cản melody\", thì dùng được tất cả các hợp âm mượn này. Những kiểu này \"rất hay gặp khi ending\", tức đoạn kết bài. Vì sao phải để ý giai điệu: hợp âm mượn có nốt ngoài giọng C (như Bb, Eb, Ab), nếu chọi với nốt người hát đang hát thì nghe sai. Nghe so sánh: chỉ có C, rồi Bbmaj7 về C.", "tip": "Bbmaj7 = Bb D F A: nốt 7 là Bb lùi nửa cung, ra A.", "compare": {"a": {"label": "Chỉ có C", "play": ["C"]}, "b": {"label": "Bbmaj7 → C", "play": ["Bbmaj7", "C"]}}}, {"text": "Chọn hợp âm mượn theo nốt giai điệu: lấy nốt của hợp âm mượn trùng với giọng C làm nốt trên cùng. Với Bbmaj7 (Bb D F A), thầy nêu hai nốt giai điệu dùng được là D và F: \"nếu melody là Rê, là Fa\" đều dùng được. \"Bb7 cũng vậy\": Bb7 = Bb D F Ab, cũng có D và F. Nghe so sánh: Bbmaj7 với D trên cùng, rồi Bb7 với F trên cùng, cùng về C.", "tip": "Bb7 khác Bbmaj7 ở nốt 7: Bb lùi một cung là Ab (Bb7), lùi nửa cung là A (Bbmaj7).", "compare": {"a": {"label": "Bbmaj7, D trên cùng", "play": ["Bbmaj7^D", "C"]}, "b": {"label": "Bb7, F trên cùng", "play": ["Bb7^F", "C"]}}}, {"text": "Abmaj7 (Ab C Eb G): thầy nói dùng được khi nốt trên cùng của giai điệu là G, nốt 7 của Abmaj7; \"cũng có thể là\" C. Vì sao: G và C đều có trong giọng C, còn Ab và Eb là hai nốt mượn từ C thứ tạo màu. Nghe so sánh: Abmaj7 với G trên cùng, rồi với C trên cùng, cùng về C.", "tip": "Nốt 7 của maj7 là nốt gốc lùi nửa cung: Ab lùi nửa cung là G.", "compare": {"a": {"label": "Abmaj7, G trên cùng", "play": ["Abmaj7^G", "C"]}, "b": {"label": "Abmaj7, C trên cùng", "play": ["Abmaj7^C", "C"]}}}, {"text": "Ebmaj7 (Eb G Bb D): \"trong key C, những nốt có thể dùng là Sol và Rê\", nên giai điệu G hoặc D đều dùng được. Modal 5 là Ebmaj7, các dạng Ebmaj7 \"đều cùng kiểu như vậy\". Thầy thử trong một bài và nói: \"Vì melody không bị cản nên nghe tự nhiên.\" Nghe so sánh: Ebmaj7 với G trên cùng, rồi với D trên cùng, cùng về C.", "tip": "Nốt 7 của Ebmaj7: Eb lùi nửa cung là D.", "compare": {"a": {"label": "Ebmaj7, G trên cùng", "play": ["Ebmaj7^G", "C"]}, "b": {"label": "Ebmaj7, D trên cùng", "play": ["Ebmaj7^D", "C"]}}}, {"text": "Modal 7 \"được dùng rất nhiều\": đó là kết Amen (nhắc: kiểu kết IV về I, ở giọng C là F về C), và thầy nói có thể chơi mỗi hợp âm nửa phách. Thầy không đọc hợp âm cụ thể của modal 7, còn modal 8, 9, 10 thầy chỉ nêu qua, nên hãy xem sách hoặc video. Ở câu \"tấm lòng chúng con…\", thầy dặn: \"Lúc này đừng chơi F, mà hãy vào thẳng Fm.\" Fm (F Ab C) chỉ khác F ở một nốt: A hạ xuống Ab, mượn từ C thứ. Nghe so sánh: F rồi Fm.", "tip": "F thành Fm: chỉ hạ A xuống nửa cung thành phím đen Ab.", "compare": {"a": {"label": "F", "play": ["F"]}, "b": {"label": "Fm (vào thẳng)", "play": ["Fm"]}}}, {"text": "Thầy kết: hợp âm mượn dùng nhiều nhất là Abmaj7, Bbmaj7 và Bb7; các mẫu modal 7, modal 4, rồi modal 1, 2 cũng dùng khá đều, \"chỉ cần làm tốt khoảng đó là được\". Ví dụ câu \"Con yêu Hội Thánh của con\" thầy dùng Bbmaj7, và cuối bài thầy cũng dùng Bbmaj7. Thầy dặn trộn hợp lý II–V–I cho bậc II, III, IV, VI (video 2-7 đến 2-10) với hợp âm mượn thì \"âm nhạc sẽ trở nên rất đa dạng và hay hơn\". Nghe: Abmaj7, Bbmaj7, Bb7, mỗi hợp âm về C.", "tip": "Ba hợp âm hay dùng nhất đều có nốt gốc là phím đen: Ab, Bb, Bb.", "play": ["Abmaj7^G", "C", "Bbmaj7^D", "C", "Bb7^D", "C"]}], "remember": ["Hợp âm mượn dùng được \"chỉ cần không cản melody\": chọn theo nốt giai điệu.", "Bbmaj7, Bb7: giai điệu D hoặc F; Abmaj7: G hoặc C; Ebmaj7: G hoặc D.", "Kết Amen (modal 7) dùng rất nhiều; \"đừng chơi F, mà hãy vào thẳng Fm\"; hay dùng nhất: Abmaj7, Bbmaj7, Bb7."], "items": [{"chord": "Bbmaj7", "rel": "modal", "prog": ["Bbmaj7", "C"], "mel": "D"}, {"chord": "Ebmaj7", "rel": "modal", "prog": ["Ebmaj7", "C"], "mel": "G"}, {"chord": "Abmaj7", "rel": "modal", "prog": ["Abmaj7", "C"], "mel": "C"}], "quiz": [{"q": "Theo thầy, điều kiện để dùng hợp âm mượn là gì?", "choices": ["Chỉ cần không cản giai điệu", "Chỉ dùng ở đầu bài", "Phải có II–V phía trước", "Giai điệu phải là nốt ngoài giọng C"], "answer": "Chỉ cần không cản giai điệu", "why": "Thầy nói \"chỉ cần không cản melody\" là dùng được; vì vậy chọn hợp âm mượn theo nốt giai điệu."}, {"q": "Giai điệu đang là G. Trong các hợp âm mượn dưới đây, hợp âm nào thầy nêu là hợp?", "choices": ["Ebmaj7", "Bbmaj7", "Bb7", "Fm"], "answer": "Ebmaj7", "why": "Ebmaj7 = Eb G Bb D có G; Bbmaj7, Bb7 hợp giai điệu D hoặc F, còn Fm (F Ab C) không có G."}, {"q": "Theo thầy, ba hợp âm mượn dùng nhiều nhất là?", "choices": ["Abmaj7, Bbmaj7, Bb7", "Ebmaj7, Fm, Bb7", "Bbmaj7, Ebmaj7, Fm", "Abmaj7, Ebmaj7, Fm"], "answer": "Abmaj7, Bbmaj7, Bb7", "why": "Thầy kết video: Abmaj7, Bbmaj7, Bb7 \"được dùng nhiều\"; làm tốt khoảng đó là được."}]}

<script>

// Tên hợp âm trong đề, để nhận ra hai câu "cùng ý": cùng đáp án và đề chung ít nhất một tên hợp âm
const CHORD_TOK = /(?<![\p{L}\p{N}#])[A-G][#b]?(?:[a-zA-Z0-9+°#]*(?:\([^)]*\))?)?(?:\/[A-G][#b]?)?(?![\p{L}\p{N}])/gu;

// Dạng câu tự sinh gần với bài: dạng bài dạy + dạng ứng với mục bài tập (dim7 → hợp âm giảm, "mẹ" → hợp âm nào hút về X, mượn, thay thế…)

  if (kc && kc.root !== 0) f.add('degree');   // bài giọng khác C: bậc trong giọng

  { key: "root", vi: "nốt gốc", en: "root", explain: "Nốt gốc là nốt đặt tên cho hợp âm: C7 có nốt gốc là C.", lesson: "p3-01", match: ["nốt gốc", "root"] },
  { key: "guide", vi: "nốt định hướng (guide tones)", en: "guide tones", explain: "Nốt định hướng là bậc 3 và bậc 7 của hợp âm. Hai nốt này quyết định hợp âm là trưởng hay thứ, là hợp âm 7 hay maj7 (G7 có B và F, Cmaj7 có E và B).", lesson: "p3-01", match: ["nốt định hướng", "nốt dẫn hướng", "guide tones", "guide tone"] },
  { key: "diatonic", vi: "hợp âm trong giọng (diatonic)", en: "diatonic chord", explain: "Hợp âm trong giọng là 7 hợp âm dựng từ chính các nốt của giọng; giọng C dùng các phím trắng.", lesson: "p3-04", match: ["hợp âm trong giọng", "diatonic"] },
  { key: "scale", vi: "âm giai (scale)", en: "scale", explain: "Âm giai là dãy nốt sắp xếp theo những khoảng cách cố định. Ví dụ âm giai C trưởng là C D E F G A B.", lesson: "p3-06", match: ["âm giai", "scale", "altered scale"] },
  { key: "dominant", vi: "hợp âm át 7 (dominant 7)", en: "dominant 7", explain: "Hợp âm át 7, gọi ngắn là hợp âm 7 (như G7 = G B D F), có bậc 3 và bậc 7 tạo thành tritone (B–F), nên muốn đi về chỗ yên (G7 muốn về C). Mẹo: nốt 7 của nó là nốt gốc lùi một cung (G lùi một cung là F).", lesson: "p3-01", match: ["hợp âm át 7", "hợp âm át", "dominant 7", "dominant"] },
  { key: "motion", vi: "lực kéo về chủ (dominant motion)", en: "dominant motion", explain: "Lực kéo về chủ là cách tritone của hợp âm át tự đi về nốt yên gần nhất. Nhờ vậy ta nghe được cảm giác \"về nhà\".", lesson: "p3-02", match: ["lực kéo về chủ", "dominant motion"] },
  { key: "secondary", vi: "hợp âm át phụ (secondary dominant)", en: "secondary dominant", explain: "Hợp âm át phụ là hợp âm át 7 làm \"mẹ\" của một hợp âm khác trong giọng, không phải của hợp âm chủ. Ví dụ trong giọng C, A7 là \"mẹ\" của Dm.", lesson: "p3-02", match: ["hợp âm át phụ", "secondary dominant", "applied V"] },
  { key: "sub", vi: "hợp âm thay thế (substitute)", en: "substitute chord", explain: "Hợp âm thay thế là hợp âm chung nhiều nốt với hợp âm gốc nên đặt vào chỗ đó vẫn nghe hợp lý. Ví dụ Em7 và Am7 có thể thay Cmaj7.", lesson: "p3-11", match: ["hợp âm thay thế", "substitute chord", "substitute"] },
  { key: "subV", vi: "hợp âm át thay thế (subV) — \"bạn của mẹ\"", en: "substitute dominant", explain: "Hợp âm át thay thế chung tritone với \"mẹ\", và nốt gốc của nó là nốt gốc của hợp âm đích nhích lên nửa cung. Ví dụ đích là C thì \"bạn của mẹ\" là Db7, thay cho G7.", lesson: "p3-22", match: ["hợp âm át thay thế", "substitute dominant", "subV"] },
  { key: "related", vi: "II liên quan (related II) — \"chị\"", en: "related II", explain: "II liên quan là hợp âm m7 (hợp âm thứ có thêm bậc 7, như Dm7) dựng trên bậc II khi coi \"mẹ\" là bậc V. Nó đứng trước \"mẹ\" thành cặp II–V, ví dụ Dm7 – G7.", lesson: "p3-25", match: ["II liên quan", "related II"] },
  { key: "tension", vi: "nốt màu (tension)", en: "tension", explain: "Nốt màu là các nốt 9, 11, 13 xếp thêm lên hợp âm 7 cho nghe giàu hơn. Mẹo: 9, 11, 13 là nốt thứ 2, 4, 6 tính từ nốt gốc, đặt cao lên một quãng 8 (G7: 9 là A, 13 là E).", lesson: "p3-04", match: ["nốt màu", "tension"] },
  { key: "altered", vi: "màu biến đổi (altered)", en: "altered tension", explain: "Màu biến đổi là nốt màu bị thăng hoặc giáng nửa cung, chủ yếu b9, #9, b13 (gọi chung là màu altered). Chúng nghe căng và chỉ hợp với hợp âm có tritone (#11 sẽ học ở bài 16).", lesson: "p3-04", match: ["màu biến đổi", "tension biến đổi", "altered"] },
  { key: "passing", vi: "hợp âm giảm đi qua (passing diminished)", en: "passing diminished", explain: "Hợp âm giảm đi qua là hợp âm giảm 7 (dim7) nối hai hợp âm cách nhau một cung. Mẹo: nốt gốc của nó là nốt gốc của hợp âm sau lùi nửa cung, như Cmaj7 – C#dim7 – Dm7.", lesson: "p3-24", match: ["hợp âm giảm đi qua", "passing diminished"] },
  { key: "slash", vi: "hợp âm có bass riêng (C/E…)", en: "slash chord", explain: "Hợp âm có bass riêng là hợp âm mà tay trái bấm một nốt khác nốt gốc. Ví dụ C/E đọc là C với bass là E.", lesson: "p3-10", match: ["hợp âm có bass riêng", "slash chord"] },
  { key: "voicing", vi: "thế bấm (voicing)", en: "voicing", explain: "Thế bấm là cách chia các nốt của hợp âm cho hai tay. Cùng một hợp âm có thể có nhiều thế bấm khác nhau.", lesson: "p3-10", match: ["thế bấm", "voicing"] },
  { key: "resolve", vi: "giải quyết", en: "resolve", explain: "Giải quyết là đi từ hợp âm bứt rứt về hợp âm yên ổn. Giống như một câu hỏi được trả lời.", lesson: "p3-17", match: ["giải quyết", "resolve"] },
  { key: "turnaround", vi: "vòng quay lại (turnaround)", en: "turnaround", explain: "Vòng quay lại là vòng hợp âm 1–6–2–5 lặp đi lặp lại, ví dụ C – Am – Dm – G. Hết vòng này là quay về đầu vòng kế tiếp.", lesson: "p3-11", match: ["vòng quay lại", "turnaround"] },
  { key: "upper", vi: "hợp âm ba nốt phía trên (upper structure)", en: "upper structure triad", explain: "Hợp âm ba nốt phía trên là một hợp âm ba nốt tay phải đặt lên trên hợp âm 7 của tay trái. Cách này cho nốt màu đẹp mà dễ tìm, dễ bấm.", lesson: "p3-16", match: ["hợp âm ba nốt phía trên", "upper structure"] },
  { key: "mode", vi: "mode (Ionian, Dorian…)", en: "mode", explain: "Mode là âm giai bắt đầu từ từng bậc của âm giai trưởng (Ionian từ bậc 1, Dorian từ bậc 2…). Mỗi mode có một màu sắc riêng.", lesson: "p3-14", match: ["mode", "modes"] },
  { key: "avoid", vi: "nốt nên tránh (avoid note)", en: "avoid note", explain: "Nốt nên tránh là nốt nghe chọi với hợp âm. Khi bấm, ta nên bỏ nốt này đi.", lesson: "p3-15", match: ["nốt nên tránh", "nốt tránh", "avoid note"] },
  { key: "interchange", vi: "hợp âm mượn (từ giọng thứ)", en: "modal interchange", explain: "Hợp âm mượn là hợp âm của giọng thứ cùng tên, dùng trong bài giọng trưởng. Ví dụ bài giọng C có thể mượn Fm từ C thứ.", lesson: "p3-19", match: ["hợp âm mượn", "modal interchange"] },
  { key: "target", vi: "hợp âm đích", en: "destination chord", explain: "Hợp âm đích là hợp âm mà một câu nhạc muốn đi tới, nơi câu dừng lại. Ví dụ trong G7 → C, C là hợp âm đích và G7 là \"mẹ\" của nó.", lesson: "p3-09", match: ["hợp âm đích", "destination chord"] },
  { key: "amen", vi: "kết Amen (Amen cadence)", en: "Amen cadence", explain: "Kết Amen là kiểu kết IV – I như chữ \"A-men\" cuối bài thánh ca, ví dụ F → C trong giọng C. Thầy hay đổi F thành Fm (mượn từ C thứ) cho ấm hơn: F – Fm – C.", lesson: "p3-19", match: ["kết Amen", "Amen cadence", "Amen", "A-men"] },
  { key: "sus", vi: "hợp âm treo (sus4)", en: "suspended chord", explain: "Hợp âm treo (sus4) thay bậc 3 bằng bậc 4, nghe lơ lửng, rồi giải quyết bằng cách đưa bậc 4 về bậc 3. Ví dụ G(sus4) = G C D: đưa C xuống B là về G.", lesson: "p3-17", match: ["hợp âm treo", "sus4"] },
  { key: "natural", vi: "nốt màu tự nhiên (natural tension)", en: "natural tension", explain: "Nốt màu tự nhiên là nốt màu lấy ngay từ các nốt của giọng, như 9 và 13 trên G7 (A và E trong giọng C). Ngược lại là màu biến đổi, như b9 (Ab) trên G7.", lesson: "p4-01", match: ["nốt màu tự nhiên", "natural tension"] },
  { key: "topnote", vi: "nốt trên cùng (top note)", en: "top note", explain: "Nốt trên cùng là nốt cao nhất của thế bấm, tai nghe rõ nhất, thường là nốt giai điệu. Thầy chọn hợp âm sao cho có nốt giai điệu ở trên cùng, ví dụ giai điệu F trên bass C thì dùng Dm/C.", lesson: "p4-01", match: ["nốt trên cùng", "top note"] },
  { key: "add2", vi: "hợp âm thêm nốt 2 (add2)", en: "add2", explain: "Hợp âm thêm nốt 2 (add2) là hợp âm ba nốt có thêm nốt 2, tức nốt gốc lên một cung; ví dụ Cadd2 (sổ tay ghi C2) = C D E G. Nó không có nốt 7, nên khác với C9.", lesson: "p4-01", match: ["add2"] },
  { key: "passingProg", vi: "tiến hành đi qua (passing progression)", en: "passing progression", explain: "Tiến hành đi qua là chuỗi hợp âm có bass đi liền bậc, nối hai hợp âm chính của câu. Ví dụ C – C/Bb – A7(b9): bass đi C, Bb, A.", lesson: "p4-01", match: ["tiến hành đi qua", "passing progression"] },
  { key: "pedal", vi: "nốt bass giữ nguyên (pedal point)", en: "pedal point", explain: "Nốt bass giữ nguyên (pedal point) là một nốt bass đứng yên trong khi hợp âm phía trên thay đổi. Ví dụ F/G → Fm/G: bass G giữ nguyên, tay phải đổi từ hợp âm F sang Fm.", lesson: "p4-01", match: ["pedal point", "pedal"] },
  { key: "inversion", vi: "đảo hợp âm (inversion)", en: "inversion", explain: "Đảo hợp âm là đưa một nốt khác nốt gốc xuống bass. Đảo 1 đặt bậc 3 ở bass, như G/B; đảo 3 đặt bậc 7 ở bass, như C7/Bb.", lesson: "p4-02", match: ["đảo hợp âm", "đảo 1", "đảo 3", "inversion"] },
  { key: "augmented", vi: "hợp âm tăng (augmented)", en: "augmented", explain: "Hợp âm tăng là hợp âm trưởng có bậc 5 nâng lên nửa cung, ví dụ C+ = C E G#. G7+ là G7 có bậc 5 nâng lên (D thành D#), mà D# cùng phím với Eb, tức b13.", lesson: "p4-02", match: ["hợp âm tăng", "augmented"] },
  { key: "mM7", vi: "hợp âm thứ – 7 trưởng (minor-major 7)", en: "minor-major 7", explain: "Hợp âm thứ – 7 trưởng là hợp âm thứ thêm nốt 7 trưởng, tức nốt gốc lùi nửa cung. Ví dụ Dm(M7) = D F A C#.", lesson: "p4-02", match: ["minor-major 7", "minor major 7", "thứ – 7 trưởng"] },
  { key: "cliche", vi: "cliché (một nốt rơi dần từng nửa cung)", en: "cliché", explain: "Cliché là chuỗi hợp âm mà một nốt rơi dần từng nửa cung, còn các nốt khác đứng yên. Ví dụ Dm – Dm(M7) – Dm7 – Dm6: nốt D đi xuống C#, C, B.", lesson: "p4-02", match: ["cliché", "cliche"] },
  { key: "chromatic", vi: "đi từng nửa cung (chromatic)", en: "chromatic", explain: "Đi từng nửa cung (chromatic) là đi qua từng phím liền nhau, tính cả phím đen. Ví dụ bass F – F# – G.", lesson: "p4-02", match: ["chromatic"] },
  { key: "stringline", vi: "dòng đàn dây (string line)", en: "string line", explain: "Dòng đàn dây là một đường nốt đi liền, chậm rãi, như tiếng violin, cello trong nhạc cổ điển. Cliché Dm – Dm(M7) – Dm7 – Dm6 là một dòng như vậy.", lesson: "p4-02", match: ["string line", "dòng đàn dây"] },
  { key: "m6", vi: "hợp âm thứ thêm 6 (m6)", en: "minor 6", explain: "Hợp âm thứ thêm 6 là hợp âm thứ có thêm nốt 6, tức nốt 5 lên một cung. Ví dụ Fm6 = F Ab C D (C lên một cung là D).", lesson: "p4-03", match: ["hợp âm thứ thêm 6", "minor 6"] },
  { key: "nashville", vi: "Nashville IV", en: "Nashville IV", explain: "Nashville IV là khối hợp âm C trên bass F (C/F), chính là Fmaj7 bỏ bậc 3 (A). Khối âm này mở, nghe hiện đại.", lesson: "p4-03", match: ["Nashville"] },
  { key: "approach", vi: "nốt nối (approach note)", en: "approach note", explain: "Nốt nối là nốt đứng ngay trước một nốt chính, cách nó nửa cung hoặc một cung, để dẫn vào nốt đó cho mượt. Ví dụ đi từ Bb về Ab qua nốt A.", lesson: "p4-07", match: ["nốt nối", "approach note"] },
  { key: "chordtone", vi: "nốt chính của hợp âm (chord tone)", en: "chord tone", explain: "Nốt chính của hợp âm là các nốt tính đến bậc 7: nốt gốc, bậc 3, bậc 5, bậc 7. Ví dụ G7 có nốt chính G B D F; các nốt 9, 11, 13 (như A, E trên G7) là nốt màu.", lesson: "p4-11", match: ["nốt chính của hợp âm", "chord tone"] },
  { key: "timeshift", vi: "đổi màu lệch thời điểm", en: "time-shifted tension", explain: "Đổi màu lệch thời điểm là trên cùng một hợp âm 7, đánh một nốt màu trước rồi đổi sang nốt màu khác ngay sau, thay vì chỉ chọn một. Ví dụ G7(13) rồi G7(b13): nốt trên cùng E hạ xuống Eb.", lesson: "p4-11", match: ["lệch thời điểm"] },
  { key: "blues", vi: "dòng blues (blues line)", en: "blues line", explain: "Dòng blues là một câu giai điệu ngắn lướt qua nốt Eb (nốt đặc trưng của nhạc blues khi chơi ở giọng C) rồi rơi xuống. Ví dụ trên Bb7(#11), thầy cho nốt E lướt qua Eb rồi đi xuống.", lesson: "p4-24", match: ["dòng blues", "blues line"] },
  { key: "hybrid", vi: "màu lai (hybrid tension)", en: "hybrid tension", explain: "Màu lai là trộn một nốt màu biến đổi với một nốt màu tự nhiên trên cùng hợp âm 7, thay vì cặp gốc b9 với b13 (hoặc #9 với b13). Ví dụ C7(b9 13) trong II–V về F có b9 là Db và 13 là A, tay phải bấm hợp âm A.", lesson: "p4-29", match: ["màu lai", "hybrid"] },
  { key: "starNote", vi: "nốt sao (nốt giai điệu nằm ngoài hợp âm)", en: "star note", explain: "Nốt sao là nốt giai điệu nằm ngoài hợp âm mà thầy đánh dấu sao trong sách vì nghe hấp dẫn nhất, thường là nốt màu 9, 11, 13. Ví dụ C7 có C E G Bb: D (nốt 9) và A (nốt 13) là nốt sao; F cũng nằm ngoài C7 nhưng ở ngay trên E (bậc 3) nên chọi, không được đánh dấu.", lesson: "p1-02", match: ["nốt sao"] },
  { key: "parallel6", vi: "song hành quãng 6 (parallel sixths)", en: "parallel sixths", explain: "Song hành quãng 6 là đánh mỗi nốt giai điệu kèm một nốt thấp hơn nó một quãng 6, cả hai đều là phím trắng của giọng C, rồi cả cặp đi theo giai điệu. Ví dụ giai điệu A, G, F thì nốt dưới là C, B, A.", lesson: "p1-02", match: ["song hành quãng 6", "parallel sixths"] },
  { key: "targetNote", vi: "nốt đích của giai điệu (target note)", en: "target note", explain: "Nốt đích của giai điệu là nốt rơi đúng lúc hợp âm vang lên; chỉ nốt này cần thế bấm đúng, các nốt theo sau đánh tự do. Ví dụ giai điệu G – F trên E7 về Am: G là nốt đích, F chỉ là nốt nối.", lesson: "p1-03", match: ["nốt đích của giai điệu", "target note"] },
  { key: "beat", vi: "phách mạnh, phách yếu", en: "strong / weak beat", explain: "Phách mạnh là phách đầu của mỗi ô nhịp, chỗ hợp âm thường được ghi; phách yếu là các phách đến sau nó trong ô. Ví dụ ở giọng C, F ghi ở phách mạnh thì Gm7 – C7 chèn vào các phách yếu ngay trước F.", lesson: "p1-09", match: ["phách mạnh", "phách yếu"] },
  { key: "intro", vi: "dạo đầu (intro)", en: "intro", explain: "Dạo đầu (intro) là đoạn đàn ngắn trước khi người hát vào, để người nghe nhận ra giọng và không khí của bài. Ví dụ bài ở giọng C thì đoạn dạo đầu thường kết về hợp âm C, với nốt C trên cùng, rồi người hát mới vào.", lesson: "p2-00", match: ["dạo đầu", "intro"] },
  { key: "modulation", vi: "chuyển giọng (modulation)", en: "modulation", explain: "Chuyển giọng là đổi sang một giọng khác, thường ở đoạn nối bài này sang bài khác. Ví dụ kết bài ở giọng C rồi bài sau bắt đầu ở giọng D (lên một cung) hoặc Db (lên nửa cung).", lesson: "p2-00", match: ["chuyển giọng", "modulation", "change key"] },
  { key: "fermata", vi: "dấu ngân (fermata)", en: "fermata", explain: "Dấu ngân (fermata) là ký hiệu hình vòng cung có chấm ở giữa, đặt trên một nốt hay hợp âm: giữ nó lâu hơn bình thường, bao lâu tuỳ người chơi. Ví dụ ngân G7 một lúc rồi mới về C, cho người nghe chờ.", lesson: "p2-03", match: ["dấu ngân", "fermata"] },
  { key: "glissando", vi: "vuốt phím (glissando)", en: "glissando", explain: "Vuốt phím (glissando) là lướt nhanh một ngón tay qua liền nhiều phím, nghe như một chuỗi nốt trượt. Ví dụ vuốt các phím trắng từ C4 lên C5 ở cuối đoạn dạo đầu, rồi bài hát bắt đầu.", lesson: "p2-03", match: ["vuốt phím", "glissando"] },

  // Lỗi #18 chia 16 phần chạy async (GĐ5-T5 sửa 1: lựa chọn mới làm số tổ hợp tăng ~5 lần, chạy một mạch thì trang đứng lâu); phủ đúng như cũ
  ...(() => {
    const PROGS = ['C Am F G','C G Am F','C F G C','Am F C G','C Em F G','Dm G C Am','F G Em Am','C Am Dm G','C E Am F','G D Em C',
                   'D A Bm G','Bb F Gm Eb','C Dm Em F','Am Dm E Am','C Fm C G','F Dm Bb C','G Em C D','E A B E','C A Dm G','Eb Cm Ab Bb'];
    const tick = () => new Promise(r => setTimeout(r, 0));
    // chia theo số tổ hợp thật cho đều (CL-T2): mỗi (vòng, màu gốc bp) là một đơn vị 3^n × (1 + số last) tổ hợp; lần lượt giao mỗi đơn vị
    // cho phần đang nhẹ nhất, nên phần nào cũng có đủ 20 vòng (vòng nặng nhẹ khác nhau không dồn vào một phần); phủ đúng như cũ.
    // Danh sách đơn vị tính một lần, lúc chạy phần đầu (không tính khi mở app)
    const PARTS = 16, all = m => m.reduce((acc, k) => acc.flatMap(a => [...Array(k).keys()].map(q => [...a, q])), [[]]);
    let UNITS = null;
    const units = () => { if (UNITS) return UNITS; UNITS = []; const load = Array(PARTS).fill(0);
      for (const p of PROGS) { const cs = p.split(' ').map(parseChord), n = cs.length, key = cs[0].type === 'min' ? (cs[0].root + 3) % 12 : cs[0].root;
        for (const bp of all(cs.map((c, j) => baseOptions(c, cs[(j + 1) % n], key).length))) { const lasts = [undefined, ...bp.map((q, j) => q ? j : -1).filter(j => j >= 0)];
          const part = load.indexOf(Math.min(...load)); load[part] += 3 ** n * lasts.length; UNITS.push({ p, cs, bp, lasts, part }); } }
      return UNITS; };
    const part = async k => {
      let combos = 0, t0 = Date.now(); const bad = [], us = units().filter(u => u.part === k), PK = all([3, 3, 3, 3]);
      for (const { p, cs, bp, lasts } of us) { if (Date.now() - t0 > 40) { await tick(); t0 = Date.now(); }
        for (const pk of (cs.length === 4 ? PK : all(cs.map(() => 3)))) for (const last of lasts) {
          combos++;
          const seq = reharmAll(cs, pk, bp, last).flatMap(b => [b.base, ...b.slot]);
          seq.forEach((x, i) => { const y = seq[(i + 1) % seq.length];
            if (x.name !== y.name && clashes(x, y).length && bad.length < 5) bad.push(`${p}: ${x.name} → ${y.name} (${clashes(x, y)})`); });
        } }
      if (bad.length) throw bad.join('; ');
      return `${combos} tổ hợp`;
    };
    return [...Array(PARTS).keys()].map(k => ({ name:`Lỗi #18: rà mọi cách đổi màu × mọi cách chèn trên 20 vòng: không có cặp chọi (phần ${k + 1}/${PARTS})`, timeout: 30000, fn: () => part(k) }));
  })(),

    for (const l of LS.filter(x => x.part === 4)) for (const it of l.items) { const one = loadLessons(JSON.stringify([{ id: l.id, key: l.key, items: [it] }])).lessons[0];
      for (let s = 1; s <= 10; s++) { const q = makeQuiz(one, seededRng(s * 31)).find(x => x.kind === 'slot');
        if (q) q.choices.forEach(n => { const ty = parseSymbol(n).type; if (!(lk(AT[ty]) <= lk(l.id))) bad.push(`${l.id}: ${n} (${ty})`); }); } }
    if (bad.length) throw [...new Set(bad)].slice(0, 20).join('; '); } },

{ name:'GĐ5-T4: lời giải thích màu đã gõ và thẻ "không chèn" dùng thuật ngữ đã dạy, tối đa 3 câu; tên nốt theo chữ cái (E7 ghi G#... Db9 ghi Eb)', fn() {

      for (const k of [null, 0, 5]) { const cs = parseProg(p).chords, key = reharmKey(cs, k), n = cs.length;
        const texts = cs.flatMap((c, j) => baseOptions(c, cs[(j + 1) % n], key).map(o => o.why)).concat(cs.map((c, j) => noInsWhy(c, cs[(j + 1) % n])));
        for (const t of texts) { const lt = lateTerms(t, 'p4-32'); if (lt.length) bad.push(`${t}: ${lt}`); if (t.split(/[.!?](\s|$)/).filter(x => x && x.trim()).length > 3) bad.push('quá 3 câu: ' + t); } }

    ok(!baseOptions(P('E7'), P('Am'), 0).some(o => o.why.includes('Ab')), 'E7 ghi Ab');
    ok(noInsWhy(P('Bm7b5'), P('E7')).includes('E7'), 'thẻ không chèn thiếu hợp âm sau');

{ name:'CL-T1: mặc định theo bậc: IV, VI đủ chị – mẹ; II, III (thứ) chỉ mẹ; I, V như cũ; "Không chèn" làm ô rỗng', fn() {
    const P = s => parseProg(s).chords || s.split(' ').map(parseChord), S = (cs, picks, key) => reharmAll(P(cs), picks || P(cs).map(() => null), [], undefined, key).map(b => b.slot.map(c => c.name).join(' – '));
    const a = S('C Am F G', null, 0);
    eq(a[0], 'Bm7b5 – E7(b9)'); eq(a[1], 'Gm7 – C9');               // trước Am (VI), trước F (IV)
    const b = S('C Dm Em F', null, 0); eq(b[0], 'A7(b9)'); eq(b[1], 'B7(b9)');   // trước Dm (II), Em (III): chỉ mẹ
    ok(!/m7/.test(b[0]) && !/m7/.test(b[1]), 'bậc II/III không được có chị');
    eq(S('C Dm Em F', [null, 6, 6, null], 0)[0].split(' – ').length, 2);   // chọn 6 = có chị
    eq(S('C Dm Em F', [null, 1, 1, null], 0).slice(0, 2).join('|'), 'Eb13(#11)|F13(#11)');   // "bạn của mẹ" trước bậc II/III cũng không có chị (final review I1)
    // thẻ ghi đúng cái vòng phát: ô chèn = [...pre, c] của lựa chọn đang dùng (final review I1, M1)
    for (const p of ['C Dm Em F', 'C Am F G', 'F Gm Am Bb', 'Am Dm E7 Am', 'C E7 Am F', 'Dm7 G7 Cmaj7 A7']) for (const k of [0, 1, 6]) for (const key of [undefined, 0, 7]) {
      const cs = P(p), R = reharmAll(cs, cs.map(() => k), [], undefined, key ?? reharmKey(cs, null));
      R.forEach((b, j) => { const s = (j + 1) % cs.length, o = R.sugs[s][R.used[s]];
        const got = b.slot.map(c => c.name).join(' – '), want = o ? [...(o.pre || []), o.c].map(c => c.name).join(' – ') : '';
        if (o && b.slot.length) ok(got === want, `${p} [${key}] lựa chọn ${k} ô ${s}: phát ${got}, thẻ ${want}`); }); }
    eq(S('C Am F G', [null, -1, null, null], 0)[0], '');            // Không chèn trước Am
    eq(degreeOf(parseChord('Am'), 0), 6); eq(degreeOf(parseChord('Bb'), 0), null);
    eq(S('F Gm Am Bb', null, 5)[0], 'D7(b9)');                            // giọng F chọn tay: Gm là bậc II → chỉ mẹ
    eq(S('C E7 F G', null, 0)[0].includes('m7'), true);              // E7 (họ át) không áp "chỉ mẹ"
    eq(S('G7 C', [null, -1], 0).join('|'), '|' + S('G7 C', [null, -1], 0)[1]);   // ô sau bậc V: rỗng, không thành sus
    ok(!reharmAll(P('G7 C'), [null, -1], [], undefined, 0)[0].base.type.startsWith('sus'), 'bậc V thành sus');
    eq(S('C D7 E7 F', null, 0)[0], 'Em7 – A9');                      // đích bậc II họ át (D7 gõ vào): vẫn đủ chị – mẹ
    eq(S('C Am F G', null, 7)[0], 'E7(b9)');                          // giọng G chọn tay: Am là bậc II → chỉ mẹ
    S('C', null, 0); S('C G', null, 0);
    // lời thẻ mới: thuật ngữ đã dạy, tối đa 3 câu
    const bad = [];
    for (const [p, k] of [['C Dm Em F', 0], ['C Am F G', 7], ['Bb Cm Dm Eb', 10], ['F Gm Am Bb', 5]]) {
      const cs = P(p), R = reharmAll(cs, cs.map(() => null), [], undefined, k);
      ok(R.sugs.some(x => x[6]), p + ': không có lựa chọn 6');
      for (const t of R.sugs.flat().filter(Boolean).map(o => o.why)) { const lt = lateTerms(t, 'p4-32'); if (lt.length) bad.push(`${t}: ${lt}`); if (t.split(/[.!?](\s|$)/).filter(x => x && x.trim()).length > 3) bad.push('quá 3 câu: ' + t); } }
    if (bad.length) throw bad.slice(0, 4).join('; '); } },
...(() => {
  // Rà chọi vòng gõ hợp âm 7, chia nhiều test có nghỉ (await) để trang không đứng lâu.
  // Giọng tự nhận và giọng chọn tay (lấy mẫu cố định: giọng của hợp âm đầu, hợp âm cuối, và giọng một quãng 5 trên giọng tự nhận): mọi màu × cách chèn (xem PK) × mọi last.
  const all = m => m.reduce((acc, k) => acc.flatMap(a => [...Array(k).keys()].map(q => [...a, q])), [[]]);
  const tick = () => new Promise(r => setTimeout(r, 0));
  const sweep = async (progs, manual) => {
    const bad = []; let combos = 0;
    for (const p of progs) {
      const cs = parseProg(p).chords, n = cs.length;
      const keys = manual ? [...new Set([cs[0].root, cs[n - 1].root, (reharmKey(cs, null) + 7) % 12])] : [null];   // giọng một quãng 5 trên giọng tự nhận: hợp âm chủ thành bậc IV (chỗ có maj13(#11))
      for (const key of keys) {
        await tick();
        const kk = reharmKey(cs, key), O = colored(cs, [], undefined, kk).opts;
        // chọi ở ô chèn j chỉ phụ thuộc gốc j, đích j+1 và cách chèn j → 3 cách chèn đều + từng ô đổi sang 1, 2, -1 (Không chèn) hoặc 6 (chị – mẹ) phủ mọi tổ hợp cục bộ;
        // màu mặc định (giọng tự nhận) thì vẫn chạy mọi cách chèn
        const PKF = all(cs.map(() => 3)), PKS = [0, 1, 2].map(k => cs.map(() => k)).concat(cs.flatMap((_, j) => [1, 2, -1, 6].map(k => cs.map((_, i) => i === j ? k : 0))));   // -1, 6: final review M5
        for (const bp of all(O.map(o => o.length))) {
          const PK = !manual && bp.every(q => !q) ? PKF : PKS;
          if (bp.some((q, j) => !O[j][q])) continue;   // màu không đưa ra thì người dùng không chọn được
          const lasts = [undefined, ...bp.map((q, j) => q ? j : -1).filter(j => j >= 0)];
          for (const pk of PK) for (const last of lasts) {
            combos++;
            const seq = reharmAll(cs, pk, bp, last, kk).flatMap(b => [b.base, ...b.slot]);
            seq.forEach((x, i) => { const y = seq[(i + 1) % seq.length];
              if (x.name !== y.name && clashes(x, y).length && bad.length < 5) bad.push(`${p} (giọng ${kk}) bp ${bp} chèn ${pk} last ${last}: ${x.name} → ${y.name} (${clashes(x, y)})`); });
          } } } }
    if (bad.length) throw bad.join('; ');
    return `${combos} tổ hợp`;
  };
  const A = ['Dm7 G7 Cmaj7 A7', 'Cmaj7 Am7 Dm7 G7', 'Am7 D9 Gmaj7 E7', 'C Bm7b5 E7 Am', 'Fmaj7 Bb7 Am7 D7', 'Cmaj7 C/E F G7'],
        B = ['Em7 A7 Dm7 Db9', 'Dm7 G7 Cmaj7', 'Gm7 C9 Fmaj7 D7(b9)', 'C Am7 Dm7 G7', 'Cmaj7 A7 Dm9 G13'],
        R = ['C/E F G7 C', 'C G/B Am F', 'F C/E Dm Bbmaj7 C7', 'C Ebdim7 Dm G'];
  return [
    { name:'GĐ5-T4: rà chọi vòng gõ hợp âm 7, giọng tự nhận (phần 1)', timeout: 30000, fn: () => sweep(A, false) },
    { name:'GĐ5-T4: rà chọi vòng gõ hợp âm 7, giọng tự nhận (phần 2)', timeout: 30000, fn: () => sweep(B, false) },
    { name:'GĐ5-T4: rà chọi vòng gõ hợp âm 7, giọng chọn tay (phần 1)', timeout: 30000, fn: () => sweep(A, true) },
    { name:'GĐ5-T4: rà chọi vòng gõ hợp âm 7, giọng chọn tay (phần 2)', timeout: 30000, fn: () => sweep([...B, ...R], true) },
    { name:'GĐ5-T4 sửa 3: hợp âm đã gõ chỉ "giữ nguyên" bên cạnh (C/E, G/B, Ebdim7): mặc định, không chạm, mọi giọng, kể cả last còn sót lại → không chọi', timeout: 30000, fn() {
      const bad = [];
      for (const [p, key] of [['C/E F G7 C', 5], ['C G/B Am F', 5], ['F C/E Dm Bbmaj7 C7', 10], ['C Ebdim7 Dm G', 5], ['C G/B Am F', 10]]) {
        const cs = parseProg(p).chords, n = cs.length;
        for (const k of [key, null, ...Array(12).keys()]) for (const last of [undefined, ...cs.keys()]) {
          const seq = reharmAll(cs, cs.map(() => null), [], last, reharmKey(cs, k)).flatMap(b => [b.base, ...b.slot]);
          seq.forEach((x, i) => { const y = seq[(i + 1) % seq.length]; if (x.name !== y.name && clashes(x, y).length && bad.length < 5) bad.push(`${p} giọng ${k} last ${last}: ${x.name} → ${y.name}`); });
          if (k === key && last === undefined) for (let j = 0; j < n; j++) { const O = colored(cs, [], undefined, reharmKey(cs, k)).opts[j];   // chọn một màu rồi last = ô đó (giọng review nêu)
            O.forEach((o, q) => { if (!o) return; const bp = []; bp[j] = q;
              const b = colored(cs, bp, j, reharmKey(cs, k)).bases;
              b.forEach((x, i) => { const y = b[(i + 1) % n]; if (clashes(x, y).length && bad.length < 5) bad.push(`${p} giọng ${k} bp[${j}]=${q}: ${x.name} → ${y.name}`); }); }); }
        } }
      if (bad.length) throw bad.join('; '); } },
  ];
})(),

{ fast:1, name:'GĐ5-T5: hợp âm giảm đi qua gọi tên theo hướng bass', fn() {

async function runTests(list) {
  const out = [];
  for (const t of list) {
    let timer; const t0 = Date.now();
    try {
      const info = await Promise.race([Promise.resolve().then(() => t.fn()),
        new Promise((_, rej) => { timer = setTimeout(() => rej(new Error(`quá ${(t.timeout ?? 5000) / 1000} giây`)), t.timeout ?? 5000); })]);
      out.push({ name: t.name, ok: true, info, ms: Date.now() - t0 });
    } catch (e) { out.push({ name: t.name, ok: false, info: String(e), ms: Date.now() - t0 }); }
    finally { clearTimeout(timer); }
    await new Promise(r => setTimeout(r, 0));   // nhường trang giữa hai test: nhiều test đồng bộ liền nhau không làm trang đứng một mạch (GĐ5-T6)
  }
  return out;
}

  function cancelLib() { const r = libRun; libRun = null; libQ = null; if (r && r.timerId != null) clearInterval(r.timerId); }
  // o = { mode: 'free' | 'score', group, types, white, timer }; kiểu bấm lấy từ settings.libStyle (hình 6–13: thế cố định, ghi 'phil')

  // đặt câu đang hỏi lên bảng luyện: thế đáp án theo kiểu của lượt; chấm bằng libGrade (judge), chạm phím + Kiểm tra cũng chấm
  function libSetQ() {

  // hỏi lại trong trang; đồng hồ dừng trong lúc hỏi, phím bấm không được chấm
