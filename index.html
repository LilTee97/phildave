  {"id": "p3-19", "part": 3, "src": "Phildave 3 · Bài 19", "title": "Trộn hợp âm của 4 âm giai", "teach": [{"text": "Bài giọng thứ mà chỉ dùng hợp âm thứ thì nặng nề. Ngược lại, trong bài giọng trưởng, thoáng một chút màu thứ lại rất cuốn hút. Trong thực tế, bài C trưởng hay lấy hợp âm của C thứ, giọng thứ có cùng nốt chủ C, chứ không phải của Am. Nghe Fmaj7 → Cmaj7, rồi chèn Fm7 vào giữa: chỉ một hợp âm của C thứ mà câu kết ấm hẳn. Thầy nhấn mạnh: trộn hợp âm trong giọng của trưởng tự nhiên và thứ tự nhiên là cách dùng nhiều nhất trong thực tế, có cả đoạn dài chỉ có một hợp âm át 7 là G7 mà vẫn rất đẹp.", "compare": {"a": {"label": "Fmaj7 → Cmaj7", "play": ["Fmaj7", "Cmaj7"]}, "b": {"label": "Fmaj7 → Fm7 → Cmaj7", "play": ["Fmaj7", "Fm7", "Cmaj7"]}}}, {"text": "Hợp âm mượn (modal interchange; thầy gọi là \"mix\") là hợp âm của giọng thứ cùng tên, đem dùng trong bài giọng trưởng. Từ C thứ tự nhiên (C D Eb F G Ab Bb), thầy hay mượn Dm7b5, Ebmaj7, Fm7, Abmaj7, Bb7; G7 thì vừa có trong C trưởng, vừa là bậc V của C thứ hoà âm (bài 18). Các hợp âm mượn nghe lạ trong giọng C vì có Eb, Ab hoặc Bb, ba nốt giáng của C thứ.", "tip": "Hợp âm mượn từ C thứ dễ nhận: có nốt Eb, Ab hoặc Bb, ví dụ Fm7 = F Ab C Eb.", "show": "Fm7", "play": ["Ebmaj7", "Abmaj7", "Bb7", "Cmaj7"]}, {"text": "Kết Amen (Amen cadence) là kiểu kết IV – I, tức từ hợp âm bậc IV (F) về chủ (C), như chữ \"A-men\" cuối bài thánh ca. Thầy hay đổi F thành Fm, mượn từ C thứ: chỉ cần hạ A xuống Ab. Ab lại trượt xuống nửa cung thành G, một nốt của C, nên câu kết vừa ấm vừa mượt. Nghe F → C, rồi F → Fm → C.", "tip": "Từ F sang Fm chỉ hạ A xuống Ab; sang C thì Ab xuống tiếp nửa cung thành G.", "keys": ["F2", "|", "F3", "Ab3", "C4"], "play": ["Fmaj7", "Fm7", "Cmaj7"], "compare": {"a": {"label": "F → C", "play": [["F2", "|", "F3", "A3", "C4"], ["C2", "|", "E3", "G3", "C4"]]}, "b": {"label": "F → Fm → C", "play": [["F2", "|", "F3", "A3", "C4"], ["F2", "|", "F3", "Ab3", "C4"], ["C2", "|", "E3", "G3", "C4"]]}}}, {"text": "Một vài tiến hành mẫu: C – Abmaj7 – Bb7 – C, hay C – Ebmaj7 – Dm7 – C. Vì sao trong giọng C lại có Abmaj7, Bb7? Vì chúng là hợp âm trong giọng của C thứ tự nhiên: Abmaj7 = Ab C Eb G, Bb7 = Bb D F Ab, toàn nốt của C thứ tự nhiên. Ở đây Bb7 không phải \"mẹ\" dắt về Eb; nó chỉ là màu mượn, nên về thẳng C vẫn nghe tự nhiên.", "compare": {"a": {"label": "C – Abmaj7 – Bb7 – C", "play": ["C", "Abmaj7", "Bb7", "C"]}, "b": {"label": "C – Ebmaj7 – Dm7 – C", "play": ["C", "Ebmaj7", "Dm7", "C"]}}}, {"text": "Âm giai C thứ giai điệu (C D Eb F G A B) cũng cho mượn. Chơi đúng các nốt đó nhưng bắt đầu từ F, ta được F G A B C D Eb: đó là F lydian dominant (bài 16), nên F7 (nghe đủ màu là F13(#11), có B là #11) là hợp âm mượn từ đây. Bắt đầu từ B, ta được B C D Eb F G A: đó là B altered (bài 15), dùng cho B7 (Eb cùng phím với D#, bậc 3 của B7); còn xếp chồng cách một nốt từ B thì ra Bm7b5.", "tip": "F lydian dominant: F trưởng có Bb, nâng thành B (#11); có Eb là b7.", "show": "F13(#11)", "compare": {"a": {"label": "F13(#11)", "play": ["F13(#11)"]}, "b": {"label": "Bm7b5", "play": ["Bm7b5"]}}}, {"text": "Dm7b5 là hợp âm bậc II của C thứ, nên đứng trước G7 nó dẫn vào G7 rất tự nhiên (bài 20 và 25 sẽ nói kỹ hơn). Thử nghe Dm7b5 – G7 – Cmaj7, rồi cho G7 thêm b9 (Ab) và b13 (Eb), hai nốt lấy từ C thứ. Thầy dặn: nhìn nốt màu là biết hợp âm lấy màu từ âm giai nào; G7(b9 b13) có Ab và Eb nên màu của nó lấy từ C thứ, dù đích vẫn là Cmaj7.", "compare": {"a": {"label": "Dm7b5 – G7 – Cmaj7", "play": ["Dm7b5", "G7", "Cmaj7"]}, "b": {"label": "Dm7b5 – G7(b9 b13) – Cmaj7", "play": ["Dm7b5", "G7(b9 b13)", "Cmaj7"]}}}], "remember": ["Hợp âm mượn: lấy hợp âm của C thứ dùng trong bài C trưởng.", "Hay mượn: Dm7b5, Ebmaj7, Fm7, Abmaj7, Bb7 (và G7).", "Kết Amen là F → C; đổi F thành Fm (hạ A xuống Ab) cho ấm: Fmaj7 – Fm7 – Cmaj7."], "items": [{"chord": "Dm7b5", "to": "G7"}, {"chord": "G7(b9 b13)", "to": "Cmaj7"}], "quiz": [{"q": "Vì sao trong bài giọng C lại có Abmaj7 và Bb7?", "choices": ["Vì chúng là hợp âm trong giọng của C thứ tự nhiên", "Vì chúng là \"mẹ\" của C", "Vì chúng thuộc âm giai C trưởng", "Vì chúng là hợp âm thay thế của G7"], "answer": "Vì chúng là hợp âm trong giọng của C thứ tự nhiên", "why": "C thứ tự nhiên có Ab và Bb, nên Abmaj7 và Bb7 là hợp âm của C thứ, được mượn sang C trưởng."}]},

  {"id": "p3-20", "part": 3, "src": "Phildave 3 · Bài 20", "title": "Hợp âm thay thế trong giọng thứ", "teach": [{"text": "Ôn lại: hợp âm thay thế là hợp âm chung nhiều nốt với hợp âm gốc nên đặt vào chỗ của nó được (bài 11). Giọng C trưởng có ba nhóm thay thế: Cmaj7 với Am7, Em7; Fmaj7 với Dm7; G7 với Bm7b5. Giọng C thứ cũng có một nhóm quan trọng: Fm7 (hợp âm bậc IV của C thứ) thay được bằng Dm7b5, Abmaj7 hoặc Bb7. Cả bốn đều là hợp âm của C thứ tự nhiên.", "play": ["Fm7", "Dm7b5", "Abmaj7", "Bb7"]}, {"text": "Vì sao bốn hợp âm này thay được cho nhau? Cả bốn đều chứa nốt Ab: Ab là bậc 3 của Fm7 (F Ab C Eb), bậc 5 của Dm7b5 (D F Ab C), nốt gốc của Abmaj7 (Ab C Eb G) và bậc 7 của Bb7 (Bb D F Ab). Ngoài Ab, mỗi hợp âm còn chung ít nhất một nốt nữa với Fm7: Dm7b5 chung F và C, Abmaj7 chung C và Eb, Bb7 chung F. Nghe so sánh: đổi hợp âm mà nốt Ab vẫn vang.", "keys": ["Ab4"], "compare": {"a": {"label": "Fm7", "play": ["Fm7"]}, "b": {"label": "Bb7", "play": ["Bb7"]}}}, {"text": "Mô hình Fm7 – G7 – Cm7 (bậc IV – V – I của C thứ) có 4 lựa chọn ở chỗ đầu: Fm7, Dm7b5, Abmaj7, Bb7. Chọn hợp âm nào thì G7 vẫn kéo về Cm7 như cũ, vì G7 là \"mẹ\" của Cm7; chỉ màu sắc trước G7 thay đổi. Nghe so sánh hai lựa chọn: Fm7 – G7 – Cm7 và Abmaj7 – G7 – Cm7.", "compare": {"a": {"label": "Fm7 – G7 – Cm7", "play": ["Fm7", "G7", "Cm7"]}, "b": {"label": "Abmaj7 – G7 – Cm7", "play": ["Abmaj7", "G7", "Cm7"]}}}, {"text": "Áp vào bài giọng C: coi mỗi hợp âm thứ trong giọng (Dm7, Em7, Am7) như một chủ nhỏ, tức tạm coi nó là hợp âm nhà của một giọng thứ trong chốc lát. Ví dụ coi Am7 là chủ của giọng A thứ: \"mẹ\" của Am7 là E7 (đóng vai G7 trong mô hình), và chỗ đầu (vai Fm7) là hợp âm bậc IV của A thứ, tức Dm7. Ta được Dm7 – E7 – Am7, cùng khuôn với Fm7 – G7 – Cm7.", "play": ["Dm7", "E7", "Am7"]}, {"text": "Bốn lựa chọn của Fm7 cũng dời theo: trước E7 – Am7 có thể dùng Dm7, Bm7b5, Fmaj7 hoặc G7. Trước Dm7 cũng vậy, với \"mẹ\" là A7: Gm7, Em7b5, Bbmaj7 hoặc C7, rồi tới A7 – Dm7. Nghe so sánh Fmaj7 – E7 – Am7 với Bm7b5 – E7 – Am7: chỗ đầu đổi màu, còn E7 vẫn dắt về Am7.", "tip": "Trong A thứ: Dm7 ở bậc IV, Bm7b5 bậc II, Fmaj7 bậc VI, G7 bậc VII, đúng vai của Fm7, Dm7b5, Abmaj7, Bb7 trong C thứ.", "compare": {"a": {"label": "Fmaj7 – E7 – Am7", "play": ["Fmaj7", "E7", "Am7"]}, "b": {"label": "Bm7b5 – E7 – Am7", "play": ["Bm7b5", "E7", "Am7"]}}}], "remember": ["Giọng C thứ: Fm7 thay bằng Dm7b5, Abmaj7, Bb7 (cùng có nốt Ab).", "Fm7 – G7 – Cm7: chỗ đầu có 4 lựa chọn."], "items": [{"chord": "Dm7b5", "to": "Fm7", "rel": "sub"}, {"chord": "Abmaj7", "to": "Fm7", "rel": "sub"}, {"chord": "Bb7", "to": "Fm7", "rel": "sub"}], "quiz": [{"q": "Nốt nào có chung trong cả Fm7, Dm7b5, Abmaj7 và Bb7?", "choices": ["Ab", "C", "F", "Eb"], "answer": "Ab", "why": "Ab là bậc 3 của Fm7, bậc 5 của Dm7b5, nốt gốc của Abmaj7, bậc 7 của Bb7."}]},

  {"id": "p3-21", "part": 3, "src": "Phildave 3 · Bài 21", "title": "Nhìn nốt màu là biết hợp âm về đâu", "teach": [{"text": "G7 có thể về C trưởng hoặc C thứ, và hai đường khác nhau ở nốt màu. Về C trưởng, nốt màu lấy từ âm giai C trưởng: 9 (A) và 13 (E), tức mixolydian (bài 17). Về C thứ, nốt màu lấy từ âm giai C thứ: b9 (Ab) và b13 (Eb), hai nốt có trong cả thứ tự nhiên lẫn thứ hoà âm, tức altered (bài 15). Nghe so sánh: cùng G7 nhưng màu đã báo trước đích sáng hay tối.", "compare": {"a": {"label": "G13 → C", "play": ["G13", "C"]}, "b": {"label": "G7(b9 b13) → Cm", "play": ["G7(b9 b13)", "Cm"]}}}, {"text": "Thầy đánh số các bộ nốt màu của hợp âm át 7 để gọi cho nhanh: ① mixolydian (9, 13); ② altered b9 + b13; ③ altered #9 + b13. Bộ ② chính là bộ 2, bộ ③ là bộ 1 ở bài 15. Còn bộ ④ (một biến thể cho đích trưởng) thầy chỉ nhắc qua, khoá này chưa dùng; bộ ⑤ pha b9 với 13 không biến đổi. Nghe ② rồi ③ trên E7 về Am7.", "compare": {"a": {"label": "② E7(b9 b13)", "play": ["E7(b9 b13)", "Am7"]}, "b": {"label": "③ E7(#9 b13)", "play": ["E7(#9 b13)", "Am7"]}}}, {"text": "Quy tắc chọn: hợp âm át 7 về hợp âm trưởng thì chọn ① (hoặc 9, #11, 13 kiểu lydian dominant); về hợp âm thứ thì chọn ② hoặc ③. Ví dụ C7 về Fmaj7 dùng C13: 9 là D, 13 là A, đều có trong âm giai F trưởng. A7 về Dm7 dùng A7(#9 b13): #9 là C, b13 là F, đều có trong âm giai D thứ.", "compare": {"a": {"label": "C13 → Fmaj7", "play": ["C13", "Fmaj7"]}, "b": {"label": "A7(#9 b13) → Dm7", "play": ["A7(#9 b13)", "Dm7"]}}}, {"text": "Đọc ngược lại cũng được: nhìn nốt màu là đoán được đích. Thấy E7(b9 b13), nhiều khả năng hợp âm tiếp theo là Am, một hợp âm thứ. Chỉ là \"nhiều khả năng\" thôi, vì hợp âm át 7 về hợp âm trưởng đôi khi cũng dùng b9, b13 như một màu biến hoá (ưu tiên 2, bài 13), ví dụ G7(b9 b13) về Cmaj7.", "compare": {"a": {"label": "E7(b9 b13) → Am7", "play": ["E7(b9 b13)", "Am7"]}, "b": {"label": "G7(b9 b13) → Cmaj7 (biến hoá)", "play": ["G7(b9 b13)", "Cmaj7"]}}}, {"text": "Có thể nối các bộ thành một đường nốt ở tay phải. Chơi ① rồi ③ trên G7, tức G13 rồi G7(#9 b13), rồi về C: tay phải có B xuống Bb, E xuống Eb, nghe như các nốt rơi dần xuống, rất hợp cho đoạn kết. Đây là lúc màu biến đổi được dùng như lựa chọn thứ hai khi về hợp âm trưởng: nó không thay ①, mà nối tiếp ngay sau ①.", "tip": "G13 tay phải E A B; G7(#9 b13) tay phải Eb G Bb.", "play": ["G13", "G7(#9 b13)", "C"]}], "remember": ["Về hợp âm trưởng: ① mixolydian (9, 13) hoặc lydian dominant (9, #11, 13).", "Về hợp âm thứ: ② b9 + b13 hoặc ③ #9 + b13 (altered).", "Thấy b9, b13 thì nhiều khả năng đích là hợp âm thứ."], "items": [{"chord": "E7(b9 b13)", "to": "Am7"}, {"chord": "G13", "to": "C"}, {"chord": "A7(#9 b13)", "to": "Dm7"}], "quiz": [{"q": "Thấy E7(b9 b13), bạn đoán hợp âm tiếp theo là gì?", "choices": ["Am", "G", "C", "F"], "answer": "Am", "why": "b9, b13 là màu altered, chủ yếu dùng khi hợp âm át 7 về hợp âm thứ, nên nhiều khả năng E7 về Am."}]},

  {"id": "p3-22", "part": 3, "src": "Phildave 3 · Bài 22", "title": "\"Bạn của mẹ\": hợp âm át thay thế", "teach": [{"text": "Đến giờ, hợp âm thay thế của G7 là Bm7b5 (chung ba nốt B, D, F, bài 12). Giờ có thêm Db7, dù nốt gốc Db không nằm trong giọng C. Db7 cũng về C, nhưng bass trượt xuống nửa cung (Db xuống C) thay vì nhảy quãng 5 (G xuống C). Nghe so sánh hai đường về C.", "show": "Db7", "compare": {"a": {"label": "G7 → C", "play": ["G7", "C"]}, "b": {"label": "Db7 → C", "play": ["Db7", "C"]}}}, {"text": "Vì sao Db7 thay được G7? Db7 = Db F Ab Cb, mà Cb chính là phím B. Bậc 3 của Db7 là F, đúng bậc 7 của G7; bậc 7 của Db7 là Cb tức B, đúng bậc 3 của G7. Hai hợp âm dùng chung một tritone B–F, chỉ đổi vai cho nhau, nên cùng lực kéo về C: B lên C, F xuống E.", "tip": "Db7 = hợp âm Db (Db F Ab) + nốt gốc lùi một cung (Db lùi một cung là Cb, tức phím B).", "keys": ["B3", "F4"], "compare": {"a": {"label": "G + B–F", "play": [["G2", "B3", "F4"], ["C3", "C4", "E4"]]}, "b": {"label": "Db + B–F", "play": [["Db3", "B3", "F4"], ["C3", "C4", "E4"]]}}}, {"text": "Hợp âm 7 chung tritone với \"mẹ\" như Db7 gọi là hợp âm át thay thế (subV: hợp âm thay cho bậc V), ta gọi vui là \"bạn của mẹ\": cùng dắt \"con\" về nhà như \"mẹ\". G7 là \"mẹ\" của C, Db7 là \"bạn của mẹ\" của C. Nốt gốc của \"bạn của mẹ\" luôn cao hơn đích nửa cung (Db cao hơn C nửa cung), nên nó về đích bằng một bước trượt nửa cung xuống.", "tip": "Cách nhanh nhất: nốt gốc của đích nhích lên nửa cung, đích C thì \"bạn của mẹ\" là Db7.", "play": ["G7", "Db7", "C"]}, {"text": "Nếu đang có \"mẹ\" mà muốn tìm \"bạn của mẹ\", dùng mẹo banana ở bài 1: từ nốt gốc của \"mẹ\", đọc bảy âm tiết ba-na-na-pa-in-ae-pl, mỗi âm tiết một phím liền nhau, tính cả phím đen. Âm tiết thứ bảy là nốt gốc của \"bạn của mẹ\", vì hai nốt gốc này cách nhau đúng một tritone. Ví dụ từ G: G, Ab, A, Bb, B, C, Db, nên \"bạn của mẹ\" của G7 là Db7.", "keys": ["G4", "Db5"], "play": [["G4"], ["Ab4"], ["A4"], ["Bb4"], ["B4"], ["C5"], ["Db5"], "Db7", "C"]}, {"text": "Bảng cặp chung tritone: G7 với Db7, C7 với Gb7, D7 với Ab7, E7 với Bb7, A7 với Eb7. Mỗi cặp về cùng một đích. Ví dụ C7 có tritone E–Bb, còn Gb7 = Gb Bb Db Fb, mà Fb chính là phím E, nên cũng có Bb và E; cả hai đều về F.", "compare": {"a": {"label": "C7 → F", "play": ["C7", "F"]}, "b": {"label": "Gb7 → F", "play": ["Gb7", "F"]}}}, {"text": "Màu của \"bạn của mẹ\" là lydian dominant (bài 16): 9, #11, 13. Trên Db7, 9 là Eb, #11 là G, 13 là Bb, ba nốt ghép lại là hợp âm Eb trưởng (Eb G Bb). Vậy tay trái bấm Db7, tay phải bấm hợp âm Eb, thành Db13(#11).", "tip": "Tay phải là hợp âm trưởng cao hơn nốt gốc một cung: Db lên một cung là Eb.", "show": "Db13(#11)", "play": ["Db13(#11)", "C"]}, {"text": "Thầy dặn: đệm cho ca sĩ thì dùng #11, vì #11 của Db7 chính là G, nốt gốc của G7 mà nó thay: tai vẫn nghe thấy G nên rõ hợp âm đang dẫn về C, ca sĩ không bị lạc. Muốn nghe jazz hơn thì chỉ dùng 9 và 13, bỏ #11 cho màu mơ hồ hơn. Tóm lại: G7 (\"mẹ\") dùng màu mixolydian 9, 13; Db7 (\"bạn của mẹ\") dùng lydian dominant 9, #11, 13. Nốt gốc đổi hẳn sang Db mà vẫn là \"chơi G7\", nên nghe rất tinh tế.", "compare": {"a": {"label": "Db13(#11) → C", "play": ["Db13(#11)", "C"]}, "b": {"label": "Không #11: Db13 → C", "play": ["Db13", "C"]}}}], "remember": ["Hợp âm át thay thế (subV), \"bạn của mẹ\": chung tritone với \"mẹ\", nốt gốc cao hơn đích nửa cung.", "G7 ↔ Db7, C7 ↔ Gb7, D7 ↔ Ab7, E7 ↔ Bb7, A7 ↔ Eb7.", "Màu của \"bạn của mẹ\": 9, #11, 13 (lydian dominant)."], "items": [{"chord": "Db13(#11)", "to": "C"}, {"chord": "Gb13(#11)", "to": "F"}, {"chord": "Ab7", "to": "G7"}], "quiz": [{"q": "Vì sao Db7 thay được G7 để về C?", "choices": ["Hai hợp âm chung tritone B–F", "Hai hợp âm chung nốt gốc", "Db nằm trong giọng C", "Db7 là hợp âm thứ"], "answer": "Hai hợp âm chung tritone B–F", "why": "Bậc 3 và 7 của Db7 (F, Cb = B) chính là bậc 7 và 3 của G7."}, {"q": "Hợp âm át thay thế (subV) của A7 là gì?", "choices": ["Eb7", "E7", "D7", "Bb7"], "answer": "Eb7", "why": "Từ A đọc mẹo banana là ra Eb (hoặc lấy đích D nhích lên nửa cung); Eb7 và A7 chung tritone C#–G."}]},

  {"id": "p3-23", "part": 3, "src": "Phildave 3 · Bài 23", "title": "\"Bạn của mẹ\" cho hợp âm át phụ", "teach": [{"text": "Ở bài 22, \"bạn của mẹ\" (hợp âm át thay thế) là hợp âm 7 chung tritone với \"mẹ\", có nốt gốc cao hơn đích nửa cung. Mỗi hợp âm át phụ (\"mẹ\" của một hợp âm khác ngoài chủ) cũng có \"bạn của mẹ\" riêng, gọi là hợp âm át thay thế phụ (secondary substitute dominant). Ví dụ A7 về Dm7, thì Eb7 cũng về Dm7: A7 có C#–G, Eb7 có G–Db, và Db cùng phím với C#. Tương tự E7 về Am7, thì Bb7 cũng về Am7.", "tip": "Đích nhích lên nửa cung là ra \"bạn của mẹ\": Dm7 → Eb7, Am7 → Bb7, Em7 → F7.", "show": "Eb7", "compare": {"a": {"label": "A7 → Dm7", "play": ["A7", "Dm7"]}, "b": {"label": "Eb7 → Dm7", "play": ["Eb7", "Dm7"]}}}, {"text": "Bảng đầy đủ trong giọng C, mỗi nhóm là \"mẹ\", \"bạn của mẹ\" và đích chung: C7, Gb7 → Fmaj7; D7, Ab7 → G7; E7, Bb7 → Am7; A7, Eb7 → Dm7; B7, F7 → Em7; G7, Db7 → Cmaj7. \"Mẹ\" về đích bằng bước quãng 5 xuống (A xuống D), còn \"bạn của mẹ\" về đích bằng bước nửa cung xuống (Eb xuống D). Nghe so sánh B7 → Em7 và F7 → Em7.", "compare": {"a": {"label": "B7 → Em7", "play": ["B7", "Em7"]}, "b": {"label": "F7 → Em7", "play": ["F7", "Em7"]}}}, {"text": "Nối \"mẹ\" rồi \"bạn của mẹ\" nghe rất hay: G7 – Db7 – C, hay D7 – Ab7 – G7. Hai hợp âm chung tritone, nên cái căng được giữ thêm một nhịp mà không đổi hướng. Bass nhảy một tritone (G xuống Db) rồi trượt nửa cung vào đích, nên vừa có lực vừa mượt.", "compare": {"a": {"label": "G7 – Db7 – C", "play": ["G7", "Db7", "C"]}, "b": {"label": "D7 – Ab7 – G7", "play": ["D7", "Ab7", "G7"]}}}, {"text": "Bài tập vòng quay lại (Cmaj7 – A7 – Dm7 – G7, bài 11–12): đổi thành Em7 – Eb7 – Dm7 – Db7. Từng chỗ: Em7 thay Cmaj7 (hợp âm thay thế, chung ba nốt E, G, B), Eb7 thay A7 (\"bạn của mẹ\" của Dm7), Db7 thay G7 (\"bạn của mẹ\" của C). Nhờ vậy bass đi xuống từng nửa cung: E, Eb, D, Db, rồi về C. Vòng vẫn quay về Cmaj7 như cũ.", "compare": {"a": {"label": "Vòng gốc", "play": ["Cmaj7", "A7", "Dm7", "G7", "Cmaj7"]}, "b": {"label": "Bass đi nửa cung", "play": ["Em7", "Eb7", "Dm7", "Db7", "Cmaj7"]}}}, {"text": "Thầy còn một phiên bản dày hơn: Em7 – E7 – Bb7 – A7 – Dm7 – D7 – Ab7 – G7 – Cmaj7. Mỗi cặp \"mẹ\" và \"bạn của mẹ\" đứng liền nhau: E7 với Bb7 (cùng về A), D7 với Ab7 (cùng về G). Bài 12 dặn chỉ nên biến hoá tối đa hai lần liên tiếp để tai không lạc giọng. Ở đây chuỗi dài hơn vẫn nghe ổn, vì mỗi cặp \"mẹ\" và \"bạn của mẹ\" dùng chung một tritone (E7 và Bb7 cùng có G#–D, D7 và Ab7 cùng có F#–C): tai nghe mỗi cặp như một hợp âm kéo dài, chỉ đổi bass.", "play": ["Em7", "E7", "Bb7", "A7", "Dm7", "D7", "Ab7", "G7", "Cmaj7"]}, {"text": "Màu của \"bạn của mẹ\" là 9, #11, 13 (hoặc chỉ 9 và 13), dù đích là hợp âm trưởng hay thứ: tay phải bấm hợp âm trưởng cao hơn nốt gốc một cung (bài 16). Ví dụ Eb7 về Dm7: Eb lên một cung là F, tay phải bấm hợp âm F (F A C) trên Eb7, thành Eb13(#11). Khác với \"mẹ\" về hợp âm thứ (dùng altered), \"bạn của mẹ\" không dùng b9, #9, b13.", "show": "Eb13(#11)", "compare": {"a": {"label": "Eb13(#11) → Dm7", "play": ["Eb13(#11)", "Dm7"]}, "b": {"label": "Ab13(#11) → G7", "play": ["Ab13(#11)", "G7"]}}}], "remember": ["Mỗi hợp âm át phụ có một \"bạn của mẹ\" chung tritone, về cùng đích.", "\"Bạn của mẹ\" về đích bằng bước nửa cung xuống, màu 9, #11, 13 cho mọi đích.", "Em7 – Eb7 – Dm7 – Db7: bass đi xuống từng nửa cung."], "items": [{"chord": "Eb13(#11)", "to": "Dm7"}, {"chord": "Bb13(#11)", "to": "Am7"}, {"chord": "Ab13(#11)", "to": "G7"}], "quiz": [{"q": "Trong vòng Em7 – Eb7 – Dm7 – Db7, Eb7 thay cho hợp âm nào của vòng Cmaj7 – A7 – Dm7 – G7?", "choices": ["A7", "Em7", "G7", "Cmaj7"], "answer": "A7", "why": "Eb7 chung tritone (G và Db) với A7 và cùng về Dm7."}]},

  {"id": "p3-24", "part": 3, "src": "Phildave 3 · Bài 24", "title": "Hợp âm giảm đi qua", "teach": [{"text": "Hợp âm giảm 7 (dim7) gồm bốn nốt cách đều nhau, mỗi bước một cung rưỡi. Ví dụ C#dim7 = C# E G Bb: C# lên E, E lên G, G lên Bb đều một cung rưỡi. Vì các bước đều nhau, dim7 nghe căng và lơ lửng, không có nốt nào đứng yên làm chỗ dựa.", "tip": "Bấm dim7 từ nốt gốc: tính cả phím đen, cứ bỏ qua hai phím rồi bấm phím thứ ba, như C#, (bỏ D, D#) E, (bỏ F, F#) G, (bỏ G#, A) Bb.", "show": "C#dim7", "play": [["C#4"], ["E4"], ["G4"], ["Bb4"], "C#dim7"]}, {"text": "Hợp âm giảm đi qua (passing diminished) là hợp âm dim7 chen giữa hai hợp âm cách nhau một cung, để bass đi lên từng nửa cung. Ví dụ Cmaj7 – C#dim7 – Dm7: bass đi C, C#, D thay vì bước thẳng C lên D. Kiểu nối này rất hay gặp trong gospel.", "tip": "Tìm hợp âm giảm đi qua: lấy nốt gốc của đích lùi nửa cung, D lùi nửa cung là C#, nên C#dim7 dẫn vào Dm7.", "compare": {"a": {"label": "Cmaj7 → Dm7", "play": ["Cmaj7", "Dm7"]}, "b": {"label": "Cmaj7 → C#dim7 → Dm7", "play": ["Cmaj7", "C#dim7", "Dm7"]}}}, {"text": "Cả chuỗi: Cmaj7 – C#dim7 – Dm7 – D#dim7 – Em7 – Edim7 – Fmaj7 – F#dim7 – G7 – G#dim7 – Am7. Mỗi hợp âm dim7 có nốt gốc thấp hơn hợp âm sau nửa cung, nên kéo lên rất tự nhiên. Riêng Em7 và Fmaj7 vốn chỉ cách nửa cung (E–F), không còn phím nào để chen, nên Edim7 giữ nguyên bass E, chỉ đổi màu trước khi lên F. Edim7 (E G Bb Db) chính là C7(b9) bỏ nốt C, tức \"mẹ\" trá hình của F (màn sau giải thích cách này).", "tip": "Tên của dim7 đi qua chính là nốt bass của nó: C#dim7 có bass C#, D#dim7 có bass D#.", "play": ["Cmaj7", "C#dim7", "Dm7", "D#dim7", "Em7"]}, {"text": "Vì sao C#dim7 kéo về Dm7? Lấy A7(b9) = A C# E G Bb (A7 thêm b9 là Bb), bỏ nốt gốc A đi, còn lại C# E G Bb, đúng C#dim7. Tức C#dim7 là một \"mẹ\" của Dm7 trá hình: vẫn có tritone C#–G của A7, nên vẫn kéo về Dm7. Thầy viết nó là A7(b9)/C#, tức A7(b9) với bass C#.", "compare": {"a": {"label": "A7(b9) → Dm7", "play": ["A7(b9)", "Dm7"]}, "b": {"label": "C#dim7 → Dm7", "play": ["C#dim7", "Dm7"]}}}, {"text": "Hợp âm dim7 lại đối xứng: vì bốn nốt cách đều nhau, đặt nốt nào xuống bass thì vẫn là một hợp âm dim7. C#dim7 (C# E G Bb) có cùng bốn nốt với Edim7, Gdim7, Bbdim7; chỉ đổi nốt nằm ở bass. Vì vậy thuộc một thế bấm dim7 là dùng được cho bốn tên.", "compare": {"a": {"label": "C#dim7", "play": ["C#dim7"]}, "b": {"label": "Edim7 (cùng bốn nốt)", "play": ["Edim7"]}}}, {"text": "Về Dm7 giờ có ba lựa chọn: A7 (\"mẹ\", thêm màu altered thành A7(#9 b13) hay A7(b9 b13)), C#dim7 (hợp âm giảm đi qua) và Eb7 (\"bạn của mẹ\", thêm 9, #11, 13 thành Eb13(#11)). Cả ba đều mang cặp tritone C#–G (Eb7 có Db, cùng phím với C#), nên cùng kéo về Dm7. Tương tự, trước Em7 thì B7 đổi được thành D#dim7 hoặc F7.", "play": ["A7(b9 b13)", "Dm7", "C#dim7", "Dm7", "Eb13(#11)", "Dm7"], "compare": {"a": {"label": "C#dim7 → Dm7", "play": ["C#dim7", "Dm7"]}, "b": {"label": "Eb13(#11) → Dm7", "play": ["Eb13(#11)", "Dm7"]}}}, {"text": "Thầy dặn: với dim7, tay trái bấm hai nốt ngoài, tay phải bấm hai nốt trong, không bấm trùng nốt nào. Với C#dim7 (C# E G Bb): tay trái C# và Bb, tay phải E và G. Cách gọn hơn: tay trái chỉ C#, tay phải E, G, Bb (hợp âm ba nốt giảm Edim). Sang Dm7, các nốt tay phải đều bước xuống gần: E xuống D, G xuống F, Bb xuống A.", "keys": ["C#3", "Bb3", "|", "E4", "G4"], "compare": {"a": {"label": "Thầy: C# Bb | E G", "play": [["C#3", "Bb3", "|", "E4", "G4"], "Dm7"]}, "b": {"label": "Gọn: C# | E G Bb", "play": ["C#dim7", "Dm7"]}}}, {"text": "Ví dụ của thầy: C – A7 – Dm – B7 – Em, rồi đi thẳng sang Gb7 → F. Gb7 là \"bạn của mẹ\" của F (chung tritone E–Bb với C7), nên từ Em nhảy sang Gb7 vẫn dẫn về F được. Khi có giai điệu hát, thầy nói chỉ thêm #11 cho Gb7 sẽ hay hơn là thêm đủ màu. #11 của Gb7 là C, cũng là nốt 5 của F, nên khi về F nốt C đứng yên và giai điệu hát nghe vững.", "play": ["C", "A7", "Dm", "B7", "Em", "Gb7", "F"], "compare": {"a": {"label": "Gb7 → F", "play": ["Gb7", "F"]}, "b": {"label": "Gb7 chỉ thêm #11 (C) → F", "play": [["Gb2", "E3", "|", "Bb3", "C4", "Gb4"], "F"]}}}], "remember": ["Hợp âm giảm đi qua: dim7 thấp hơn đích nửa cung (C#dim7 → Dm7).", "C#dim7 = A7(b9) bỏ nốt A, nên nó là \"mẹ\" trá hình của Dm7.", "Về Dm7: A7, C#dim7 hoặc Eb7."], "items": [{"chord": "C#dim7", "to": "Dm7"}, {"chord": "D#dim7", "to": "Em7"}, {"chord": "G#dim7", "to": "Am7"}], "quiz": [{"q": "Vì sao C#dim7 kéo về Dm7?", "choices": ["Nó là A7(b9) bỏ nốt A", "Nó là hợp âm trong giọng C", "Nó có cùng nốt gốc với Dm7", "Nó là Dm7 hạ bậc 5"], "answer": "Nó là A7(b9) bỏ nốt A", "why": "A7(b9) = A C# E G Bb; bỏ A còn C# E G Bb, chính là C#dim7, một \"mẹ\" trá hình của Dm7."}, {"q": "C#dim7 có cùng bốn nốt với hợp âm nào?", "choices": ["Edim7", "Ddim7", "Cdim7", "Ebdim7"], "answer": "Edim7", "why": "Dim7 đối xứng: C#dim7, Edim7, Gdim7, Bbdim7 có cùng 4 nốt."}]},

  {"id": "p3-25", "part": 3, "src": "Phildave 3 · Bài 25", "title": "II liên quan: \"chị\"", "teach": [{"text": "II liên quan (related II) là hợp âm m7 (hợp âm thứ có thêm bậc 7, như Dm7 = D F A C) đứng ngay trước \"mẹ\", ta gọi vui là \"chị\": chị đi trước, dắt đường cho mẹ. Coi \"mẹ\" là bậc V thì \"chị\" nằm ở bậc II, nên cặp này gọi là II–V, ví dụ Dm7 – G7 trong giọng C. Thầy dặn: hãy coi Dm7 – G7 là một bộ, thấy G7 là nghĩ ngay tới Dm7 đi trước.", "tip": "Nốt 7 của m7 cũng là nốt gốc lùi một cung: Dm7 = hợp âm Dm (D F A) + C.", "show": "Dm7", "play": ["Dm7", "G7", "C"]}, {"text": "Vì sao Dm7 với G7 hợp nhau? Nhớ lại G9sus4 (bài 17): tay trái G, tay phải hợp âm F (F A C). Hợp âm F chính là Dm7 (D F A C) bỏ nốt D, nên trong G treo đã có sẵn bóng của Dm7. Chơi Dm7 rồi G7 giống như tách G9sus4 ra làm hai bước: phần trên đến trước (Dm7), rồi mới tới G7.", "compare": {"a": {"label": "G9sus4 → C", "play": ["G9sus4", "C"]}, "b": {"label": "Dm7 → G7 → C", "play": ["Dm7", "G7", "C"]}}}, {"text": "Điểm mạnh lớn nhất của \"chị\": đặt được cặp II–V ở nhiều chỗ, không chỉ trước G7. Trước mỗi hợp âm át phụ hay \"bạn của mẹ\", ta chèn \"chị\" của nó vào, thành một cặp II–V mới. \"Chị\" có sẵn trong giọng (Dm7 trước G7, Em7 trước A7) thì không hấp dẫn lắm, vì tai đã quen các hợp âm đó. Nghe thử với \"chị\" trong giọng (Em7 trước A7): đúng nhưng còn quen tai; màn sau là \"chị\" ngoài giọng.", "play": ["Em7", "A7", "Dm7", "G7", "C"]}, {"text": "\"Chị\" nằm ngoài giọng C mới hay, vì nó mang thêm nốt lạ: Gm7 – C7 về F (Gm7 có Bb), Bbm7 – Eb7 về Dm, Abm7 – Db7 về Cmaj7. Abm7 – Db7 là cặp II–V dẫn vào \"bạn của mẹ\" Db7, nên bass đi Ab, Db rồi trượt nửa cung xuống C. Nghe so sánh hai cặp: Gm7 – C7 – Fmaj7 và Abm7 – Db7 – Cmaj7.", "compare": {"a": {"label": "Gm7 – C7 – Fmaj7", "play": ["Gm7", "C7", "Fmaj7"]}, "b": {"label": "Abm7 – Db7 – Cmaj7", "play": ["Abm7", "Db7", "Cmaj7"]}}}, {"text": "Đích là hợp âm thứ thì \"chị\" dùng m7b5 và \"mẹ\" dùng màu altered. Lý do: trong giọng thứ, hợp âm bậc II là m7b5 (như Dm7b5 trong C thứ, bài 18), và \"mẹ\" về hợp âm thứ hợp màu altered (bài 15). Ví dụ về Em: \"mẹ\" là B7, \"chị\" là F#m7b5 (F# A C E), thành F#m7b5 – B7(b9) – Em7.", "show": "F#m7b5", "play": ["F#m7b5", "B7(b9)", "Em7"]}, {"text": "Mẹo tìm \"chị\": coi \"mẹ\" là bậc 5 rồi đếm lùi theo âm giai trưởng, ba bước: bậc 5 xuống bậc 4 một cung, xuống bậc 3 thêm nửa cung, xuống bậc 2 thêm một cung. Ví dụ \"mẹ\" là Eb7: Eb lùi một cung là Db, lùi tiếp nửa cung là C, lùi tiếp một cung là Bb, nên \"chị\" là Bbm7.", "tip": "Hoặc đếm lên: từ nốt gốc của \"mẹ\" đếm lên 5 tên nốt (Eb, F, G, Ab, Bb) là ra nốt gốc của \"chị\".", "play": [["Eb5"], ["Db5"], ["C5"], ["Bb4"], "Bbm7", "Eb7", "Dm7"]}, {"text": "Ví dụ của thầy: Fmaj7 – G7 – Cmaj7 – C7 – Fmaj7 được đổi thành Dm7 – G7 – Dbm7 – Gb7 – Fmaj7. Từng chỗ: Fmaj7 đầu nhường cho Dm7, \"chị\" của G7 (Dm7 cũng là hợp âm thay thế của Fmaj7, bài 11); C7 đổi thành \"bạn của mẹ\" Gb7; và Cmaj7 nhường chỗ cho Dbm7, \"chị\" của Gb7. G7 không về Cmaj7 nữa mà nối thẳng sang Dbm7 (Db E Ab B): nốt B của G7 giữ nguyên, F xuống E, D xuống Db, nên tay vẫn đi rất gần dù bỏ bước \"mẹ\" về \"con\". Mỗi \"mẹ\" hay \"bạn của mẹ\" đều có \"chị\" đi trước, nên cả vòng chảy thành từng cặp II–V.", "tip": "Kiểm tra \"chị\" của Gb7 bằng mẹo đếm lên: Gb, Ab, Bb, Cb, Db, nên là Dbm7.", "compare": {"a": {"label": "Bản gốc", "play": ["Fmaj7", "G7", "Cmaj7", "C7", "Fmaj7"]}, "b": {"label": "Có \"chị\"", "play": ["Dm7", "G7", "Dbm7", "Gb7", "Fmaj7"]}}}], "remember": ["II liên quan (related II), \"chị\": hợp âm m7 đứng trước \"mẹ\", thành cặp II–V.", "Đích thứ: \"chị\" m7b5 + \"mẹ\" altered (F#m7b5 – B7(b9) – Em7).", "Tìm \"chị\": từ nốt gốc của \"mẹ\" đếm lên 5 tên nốt (Eb7: Eb, F, G, Ab, Bb → Bbm7)."], "items": [{"chord": "F#m7b5", "to": "B7(b9)"}, {"chord": "B7(b9)", "to": "Em7"}, {"chord": "Abm7", "to": "Db7"}], "quiz": [{"q": "Dùng mẹo đếm, \"chị\" (related II) của Eb7 là gì?", "choices": ["Bbm7", "Fm7", "Abm7", "Cm7"], "answer": "Bbm7", "why": "Từ Eb đếm lên 5 tên nốt: Eb, F, G, Ab, Bb, nên \"chị\" là Bbm7 (đếm xuống theo cách của thầy cũng ra Bb: Db, C, Bb)."}, {"q": "Đích là hợp âm thứ (Em) thì \"chị\" dùng loại hợp âm nào?", "choices": ["m7b5", "maj7", "7", "m7"], "answer": "m7b5", "why": "Đích thứ thì \"chị\" dùng m7b5 và \"mẹ\" dùng màu altered: F#m7b5 – B7(b9) – Em7."}]},

  {"id": "p4-01", "part": 4, "src": "Phildave 4 · Bài 1", "title": "Flat nine, Fm mượn và nốt trên cùng", "teach": [{"text": "Cả khoá Phildave 4 xoay quanh một ý: tìm hợp âm đích của câu hát (hợp âm mà câu muốn dừng tới), rồi chọn cách đi vào đích đó. Có hai đường chính. Đường 1 là tiến hành đi qua (passing progression): chèn hợp âm sao cho bass đi liền bậc vào đích, như C – C/Bb – A7(b9), bass C, Bb, A. Đường 2 là đặt hợp âm 7 (\"mẹ\") ngay trước đích, như G7 trước C. Bài này lấy bài thánh ca \"입술의 모든 말\" (Mọi lời trên môi con), giọng C.", "compare": {"a": {"label": "Đi qua: C – C/Bb – A7(b9)", "play": ["C", "C/Bb", "A7(b9)"]}, "b": {"label": "Hợp âm 7: F/G – G7(b9) – C", "play": ["F/G", "G7(b9)", "C"]}}}, {"text": "Flat nine (플렛나인): ở chữ \"나의\", câu đi vào đích C, và thầy đặt trước C hai hợp âm F/G rồi G7(b9). F/G là G9sus4 ở P3 bài 17: hợp âm F (F A C) trên bass G, tức G treo có thêm nốt 9. Thầy bấm G2 F3 | A3 C4: tay trái G và F (nốt 7 của G7), tay phải A (nốt 9) và C (bậc 4, nốt treo).", "tip": "Nhìn từ G: F là G lùi một cung (nốt 7), A là G lên một cung (nốt 9), C là bậc 4.", "keys": ["G2", "F3", "|", "A3", "C4"], "play": [["G2", "F3", "|", "A3", "C4"]]}, {"text": "Rồi thầy giải quyết sang G7(b9), bấm G2 F3 | Ab3 B3 D4: tay trái giữ nguyên G và F; tay phải hạ A xuống Ab, đưa C xuống B (về bậc 3), thêm D. Ab là b9 của G (G nhích lên nửa cung), một màu biến đổi (altered tension). Màu biến đổi khác nốt màu tự nhiên (natural tension) như 9 (A) hay 13 (E): nốt màu tự nhiên lấy từ chính các nốt của giọng C, còn Ab nằm ngoài giọng. Ab muốn trượt xuống G (nốt 5 của C), nên G7(b9) kéo rất mạnh về C.", "tip": "Từ F/G sang G7(b9): tay trái giữ nguyên G và F; tay phải đưa A xuống Ab, C xuống B, rồi thêm D.", "keys": ["G2", "F3", "|", "Ab3", "B3", "D4"], "play": [["G2", "F3", "|", "A3", "C4"], ["G2", "F3", "|", "Ab3", "B3", "D4"], "C"]}, {"text": "Modal (모달): cũng ở chỗ đó, thầy đổi F/G thành Fm/G: tay trái giữ G, tay phải hạ A xuống Ab, nên hợp âm F thành Fm. Fm là hợp âm bậc IV của C thứ, mượn sang giọng C (hợp âm mượn, P3 bài 19), và F → Fm chính là kiểu kết Amen (P3 bài 19). Ở đây kết Amen diễn ra trên nốt bass G đứng yên: nốt bass giữ nguyên trong khi hợp âm phía trên đổi gọi là pedal point.", "tip": "Từ F/G sang Fm/G chỉ cần hạ A xuống Ab ở tay phải, bass G đứng yên.", "compare": {"a": {"label": "F/G → Fm/G", "play": ["F/G", "Fm/G"]}, "b": {"label": "F/G → Fm/G → C", "play": ["F/G", "Fm/G", "C"]}}}, {"text": "Modal 2: Fm7 → Bb7, thầy bấm F2 Eb3 | Ab3 C4 rồi Bb2 Ab3 | C4 D4. Nhìn tên thì giống cặp \"chị\" – \"mẹ\" (II–V) về Eb: Fm7 là \"chị\", Bb7 là \"mẹ\" của Eb. Nhưng thầy không về Eb mà vẫn nghe tự nhiên, vì Fm7 và Bb7 đều là hợp âm mượn từ C thứ (có Ab, Eb). Hợp âm mượn chỉ để tô màu, không bắt buộc giải quyết như \"mẹ\".", "tip": "Tay trái F Eb sang Bb Ab; tay phải Ab C sang C D.", "play": [["F2", "Eb3", "|", "Ab3", "C4"], ["Bb2", "Ab3", "|", "C4", "D4"], "C"]}, {"text": "Top note (탑노트 4음): ở câu \"입술의 모든 말\", hợp âm là C nhưng nốt giai điệu là F, mà F không thuộc hợp âm C (C E G). Nốt trên cùng (top note) là nốt cao nhất của tay phải, thường chính là nốt giai điệu, và thầy chọn hợp âm sao cho có nốt đó. Dm (D F A) có F, và Dm là hợp âm thay thế của F (P3 bài 11), nên thầy đặt Dm trên bass C: C – Dm/C – C. Nghe: nốt cao nhất đi E, F, E, đúng giai điệu.", "tip": "Dm/C: tay trái C, tay phải A D F, để F nằm trên cùng.", "keys": ["F4"], "play": [["C2", "C3", "|", "G3", "D4", "E4"], ["C2", "C3", "|", "A3", "D4", "F4"], ["C2", "C3", "|", "G3", "D4", "E4"]]}, {"text": "Ở hai hợp âm C hai bên, thầy dùng C thêm nốt 2 (add2) cho sáng hơn: tay trái C2 C3, tay phải G3 D4 E4. Hợp âm thêm nốt 2 là hợp âm ba nốt có thêm nốt gốc lên một cung (C lên một cung là D). So với C thường (tay phải C E G), Cadd2 có D chen vào nên nghe trong và mở hơn.", "tip": "Hợp âm thêm nốt 2 (add2): thêm nốt gốc lên một cung vào hợp âm, C lên một cung là D, nên Cadd2 (sổ tay ghi C2) = C D E G.", "keys": ["C2", "C3", "|", "G3", "D4", "E4"], "compare": {"a": {"label": "C thường", "play": [["C2", "C3", "|", "G3", "C4", "E4"]]}, "b": {"label": "Cadd2", "play": [["C2", "C3", "|", "G3", "D4", "E4"]]}}}, {"text": "Modal, lần lặp: câu này hát lại thì phải đổi màu, để người nghe không thấy lặp y hệt. Lần 1 Dm/C nghe màu cổ điển (classical); lần 2 thầy dùng C – Dm7(b5)/C – C, bấm C2 C3 | Ab3 D4 F4. Dm7(b5) (D F Ab C, P3 ghi Dm7b5) là hợp âm mượn từ C thứ: vẫn giữ F trên cùng cho khớp giai điệu, nhưng nốt Ab làm màu tối đi.", "tip": "Từ Dm/C sang Dm7(b5)/C: giữ D và F, chỉ hạ A xuống Ab.", "keys": ["C2", "C3", "|", "Ab3", "D4", "F4"], "compare": {"a": {"label": "Lần 1: Dm/C", "play": [["C2", "C3", "|", "G3", "D4", "E4"], ["C2", "C3", "|", "A3", "D4", "F4"], ["C2", "C3", "|", "G3", "D4", "E4"]]}, "b": {"label": "Lần 2: Dm7(b5)/C", "play": [["C2", "C3", "|", "G3", "D4", "E4"], ["C2", "C3", "|", "Ab3", "D4", "F4"], ["C2", "C3", "|", "G3", "D4", "E4"]]}}}, {"text": "Tiến hành đi qua dẫn vào hợp âm 7 (도미넌트를 위한 경과적진행): C – C/Bb – A7(b9), bass đi xuống C, Bb, A. C/Bb là hợp âm C trên bass Bb. Bb ở bass báo trước b9 của A7 (A nhích lên nửa cung là Bb), nên khi A7(b9) vang lên thì tai đã quen nốt Bb, vào rất mượt. A7(b9) là \"mẹ\" của Dm.", "tip": "Nốt b9 của A7 là nốt gốc A nhích lên nửa cung, tức Bb: đặt Bb ở bass ngay trước là đã chuẩn bị sẵn.", "keys": ["Bb2"], "play": ["C", "C/Bb", "A7(b9)"]}, {"text": "C#dim7 (sổ tay ghi C#°7) nằm sẵn trong A7(b9): A7(b9) = A C# E G Bb, bỏ nốt A là còn C# E G Bb, đúng C#dim7 (P3 bài 24). Vì vậy thầy nói hai hợp âm này thay cho nhau được: ở chỗ A7(b9) trước Dm7 có thể đặt C#dim7.", "compare": {"a": {"label": "C – C/Bb – A7(b9) – Dm7", "play": ["C", "C/Bb", "A7(b9)", "Dm7"]}, "b": {"label": "C – C/Bb – C#°7 – Dm7", "play": ["C", "C/Bb", "C#°7", "Dm7"]}}}], "remember": ["Tìm hợp âm đích của câu rồi chọn đường vào: tiến hành đi qua (bass liền bậc) hoặc hợp âm 7 đặt ngay trước đích.", "F/G → G7(b9): tay trái giữ G F, tay phải A C xuống Ab B rồi thêm D; Fm/G, Fm7, Bb7, Dm7(b5) là hợp âm mượn từ C thứ.", "Nốt giai điệu không thuộc hợp âm thì chọn hợp âm theo nốt trên cùng (C – Dm/C – C); hát lại thì đổi màu."], "items": [{"chord": "G7(b9)", "to": "C", "prog": ["F/G", "G7(b9)", "C"]}, {"chord": "Fm/G", "rel": "modal", "prog": ["F/G", "Fm/G"]}, {"chord": "C/Bb", "to": "A7(b9)", "prog": ["C", "C/Bb", "A7(b9)"]}], "quiz": [{"q": "Vì sao C/Bb dẫn vào A7(b9) rất mượt?", "choices": ["Bass Bb báo trước nốt b9 của A7", "C/Bb là \"mẹ\" của A7", "Bb là nốt gốc của A7", "C/Bb có cùng bốn nốt với A7"], "answer": "Bass Bb báo trước nốt b9 của A7", "why": "Nốt b9 của A7 là Bb (A nhích lên nửa cung); bass Bb đứng trước nên tai đã nghe sẵn nốt này, rồi bass đi tiếp xuống A."}, {"q": "Câu \"입술의 모든 말\" có nốt giai điệu F trên hợp âm C. Thầy xử lý thế nào?", "choices": ["Đổi sang Dm trên bass C (Dm/C), vì Dm có nốt F", "Bỏ nốt F khỏi giai điệu", "Đổi sang G7 trên bass C", "Giữ C và thêm b9"], "answer": "Đổi sang Dm trên bass C (Dm/C), vì Dm có nốt F", "why": "F không thuộc hợp âm C; Dm có F và là hợp âm thay thế của F, nên đặt Dm trên bass C để nốt giai điệu nằm trên cùng."}, {"q": "Fm7 → Bb7 trông như II–V về Eb nhưng không về Eb. Vì sao vẫn nghe tự nhiên?", "choices": ["Vì đó là hợp âm mượn: tô màu, không bắt buộc giải quyết", "Vì Bb7 là \"bạn của mẹ\" của C", "Vì Fm7 là hợp âm trong giọng C", "Vì Eb là hợp âm chủ của bài"], "answer": "Vì đó là hợp âm mượn: tô màu, không bắt buộc giải quyết", "why": "Fm7 và Bb7 đều mượn từ C thứ; hợp âm mượn chỉ để tô màu nên không cần về Eb."}]},

  {"id": "p4-02", "part": 4, "src": "Phildave 4 · Bài 2", "title": "Át phụ, C#°7, G7+, cliché và \"bạn của mẹ\"", "teach": [{"text": "Secondary dominant 7 (세컨더리 도미넌트 쎄븐): ở chữ \"과 나의\", thầy đi G(sus4) – G7(9) – A7(b9), và A7(b9) dẫn vào Dm. Nhắc lại: G7 là hợp âm 7 gốc của giọng C (\"mẹ\" của C); A7, D7, E7, B7 là hợp âm át phụ, tức \"mẹ\" của một hợp âm khác (A7 là \"mẹ\" của Dm). Nghe cả câu: G treo, rồi G7(9), rồi A7(b9) kéo sang Dm.", "play": ["G(sus4)", "G7(9)", ["A2", "G3", "|", "Bb3", "C#4", "E4"], "Dm"]}, {"text": "G(sus4) = G C D: hợp âm treo thay bậc 3 (B) bằng bậc 4 (C), nên sus4 không đi chung với bậc 3; bấm cả B lẫn C thì hai nốt cách nửa cung va nhau. Giải quyết là đưa C xuống B. G7(9) là G9 ở P3 (G7 thêm A). A7(b9) thầy bấm A2 G3 | Bb3 C#4 E4: tay trái A và G (nốt 7), tay phải Bb (b9), C# (bậc 3), E (bậc 5).", "tip": "A7(b9): nốt 7 là A lùi một cung (G), nốt b9 là A nhích lên nửa cung (Bb).", "keys": ["A2", "G3", "|", "Bb3", "C#4", "E4"], "play": ["G(sus4)", "G7(9)", ["A2", "G3", "|", "Bb3", "C#4", "E4"]]}, {"text": "Thay thế V7 thứ cấp (세컨더리 V7의 대리코드): F/G – C#°7 – Dm7. C#°7 thay cho A7 vì nó nằm sẵn trong A7(b9) (A7(b9) bỏ nốt A, bài 1). Thầy cũng dặn về F/G (9sus4): nó là hợp âm ba nốt F đặt ngay dưới nốt giai điệu, nên nốt trên cùng quyết định màu nghe.", "tip": "Bấm C#dim7: tay trái C#, tay phải hợp âm Edim (E G Bb).", "play": ["F/G", "C#°7", "Dm7"]}, {"text": "Đảo V7 thứ cấp (세컨더리 V7의 전위): G/B – A/C#, bass đi liền bậc B lên C#. Đảo hợp âm (inversion) là đặt một nốt khác nốt gốc xuống bass; đặt bậc 3 xuống bass gọi là đảo 1. G/B là G đảo 1 (B là bậc 3 của G), A/C# là A đảo 1 (C# là bậc 3 của A), và A ở đây là \"mẹ\" của Dm.", "tip": "Bậc 3 của hợp âm trưởng là nốt gốc đếm lên 3 tên nốt: G, A, B ra B, nên G/B có B ở bass.", "play": ["G/B", "A/C#"]}, {"text": "Đảo 1 của hợp âm trưởng thì tay phải tránh bấm lại bậc 3, vì nốt đó đã vang ở bass; thay nó bằng 9 (nốt gốc lên một cung). G/B: tay trái B, tay phải D G A (A là 9 của G). A/C#: tay trái C#, tay phải E A B (B là 9 của A).", "tip": "Khi phát ký hiệu G/B, A/C#, app bấm đúng như vậy.", "keys": ["B2", "|", "D4", "G4", "A4"], "play": [["B2", "|", "D4", "G4", "A4"], ["C#3", "|", "E4", "A4", "B4"]]}, {"text": "Augmented dominant (도미넌트쎄븐의 오그먼트): Dm7 – G7+, thầy bấm G2 F3 | B3 Eb4. G7+ là G7 có bậc 5 nâng lên nửa cung: D thành D#. Hợp âm có bậc 5 nâng như vậy gọi là hợp âm tăng (augmented). Sổ tay viết Eb vì #5 và b13 là cùng một phím (D# = Eb), chỉ khác tên; nốt này căng và muốn đi tiếp lên E, bậc 3 của C.", "tip": "#5 là nốt 5 nhích lên nửa cung: G7 có D, nhích lên nửa cung là phím đen D#, cũng là Eb.", "keys": ["G2", "F3", "|", "B3", "Eb4"], "compare": {"a": {"label": "Dm7 – G7", "play": ["Dm7", "G7"]}, "b": {"label": "Dm7 – G7+", "play": ["Dm7", ["G2", "F3", "|", "B3", "Eb4"]]}}}, {"text": "Cliché là chuỗi hợp âm mà một nốt rơi dần từng nửa cung (chromatic, đi từng phím liền nhau), còn các nốt khác đứng yên. Ví dụ Dm – Dm(M7) – Dm7 – Dm6: tay trái giữ D, tay phải giữ F A, chỉ một nốt đi xuống D, C#, C, B. Dm(M7) là hợp âm thứ – 7 trưởng (minor-major 7): Dm thêm C# (D lùi nửa cung). Kiểu rơi này giống dòng đàn dây (string line) trong nhạc cổ điển.", "tip": "Tay trái giữ D, tay phải giữ F A; chỉ một ngón đi xuống từng phím: D, C#, C, B. Nốt 7 của Dm(M7) là D lùi nửa cung (C#).", "compare": {"a": {"label": "Dm – Dm(M7) – Dm7 – Dm6", "play": [["D2", "|", "D4", "F4", "A4"], ["D2", "|", "C#4", "F4", "A4"], ["D2", "|", "C4", "F4", "A4"], ["D2", "|", "B3", "F4", "A4"]]}, "b": {"label": "Chỉ nốt rơi: D C# C B", "play": [["D4"], ["C#4"], ["C4"], ["B3"]]}}}, {"text": "Cliché chromatic (반음씩 움직이는 클리셰): thầy dùng ý đó ở bài: Dm – Dm(M7) – F/G – Fm/G. Nốt thấp nhất của tay phải rơi D, C#, rồi C (nằm trong F/G); sau đó nốt trên cùng A xuống Ab, đó là bước kết Amen F → Fm trên bass G (bài 1).", "tip": "Nghe tay phải: D4 → C#4 → C4, rồi A4 → Ab4.", "play": ["Dm", "Dm(M7)", "F/G", "Fm/G"]}, {"text": "SubV (도미넌트의 대리코드 썹파이브): Dm7 – Bb7(9 #11 13) – Am, thầy bấm Bb2 D3 | Ab3 C4 E4 G4. Bb7 là \"bạn của mẹ\" (subV) của E7: chung tritone G#–D (Ab cùng phím với G#), nên về cùng đích Am, mà Am lại là hợp âm thay thế của C. Màu 9, #11, 13 của Bb7 là C, E, G, ghép thành hợp âm C (hợp âm ba nốt phía trên, P3 bài 16); Bb7(9 #11 13) là cách sổ tay ghi Bb13(#11) ở P3.", "tip": "Tay trái Bb D (gốc, bậc 3); tay phải Ab (nốt 7) rồi hợp âm C, cao hơn nốt gốc một cung.", "keys": ["Bb2", "D3", "|", "Ab3", "C4", "E4", "G4"], "play": ["Dm7", ["Bb2", "D3", "|", "Ab3", "C4", "E4", "G4"], "Am"]}], "remember": ["Vào Dm: A7(b9) (\"mẹ\"), hoặc C#°7 nằm sẵn trong A7(b9); đảo 1 hợp âm trưởng thì thay bậc 3 ở tay phải bằng 9.", "G7+ = G7 nâng bậc 5 lên nửa cung: #5 và b13 cùng một phím (D# = Eb).", "Cliché: Dm – Dm(M7) – Dm7 – Dm6, một ngón đi xuống D, C#, C, B; Bb7(9 #11 13) đi về Am."], "items": [{"chord": "C#°7", "to": "Dm7", "prog": ["F/G", "C#°7", "Dm7"]}, {"chord": "Dm(M7)", "to": "Dm7", "rel": "line", "prog": ["Dm", "Dm(M7)", "Dm7", "Dm6"], "top": ["D", "C#", "C", "B"]}, {"chord": "Bb7(9 #11 13)", "to": "Am", "prog": ["Dm7", "Bb7(9 #11 13)", "Am"]}], "quiz": [{"q": "Vì sao C#°7 thay được A7 trước Dm7?", "choices": ["C#°7 nằm sẵn trong A7(b9): C#, E, G, Bb", "C#°7 là hợp âm trong giọng C", "C#°7 có cùng nốt gốc với A7", "C#°7 là \"bạn của mẹ\" của Dm7"], "answer": "C#°7 nằm sẵn trong A7(b9): C#, E, G, Bb", "why": "A7(b9) = A C# E G Bb; bỏ nốt A còn C# E G Bb, chính là C#°7, nên nó kéo về Dm7 như A7."}, {"q": "Sổ tay bấm G7+ là G F | B Eb. Vì sao viết Eb mà vẫn gọi là #5?", "choices": ["#5 (D#) và b13 (Eb) là cùng một phím, chỉ khác tên", "Eb là nốt 9 của G7", "Eb là nốt gốc của hợp âm", "Eb là bậc 3 của G7"], "answer": "#5 (D#) và b13 (Eb) là cùng một phím, chỉ khác tên", "why": "Nốt 5 của G7 là D; nhích lên nửa cung là phím đen D#, cũng là Eb, tức b13."}, {"q": "Bb7(9 #11 13) sau Dm7 đi về đâu, vì sao?", "choices": ["Về Am, vì Bb7 là \"bạn của mẹ\" của E7", "Về Eb, vì Bb7 là \"mẹ\" của Eb", "Về C, vì Bb7 là \"mẹ\" của C", "Về F, vì Bb7 có nốt F"], "answer": "Về Am, vì Bb7 là \"bạn của mẹ\" của E7", "why": "Bb7 chung tritone với E7 (\"bạn của mẹ\"), nên về cùng đích Am, hợp âm thay thế của C."}]},

  {"id": "p4-03", "part": 4, "src": "Phildave 4 · Bài 3", "title": "Đảo hợp âm trong giọng, Fm6 và Nashville IV", "teach": [{"text": "Đảo diatonic (다이어토닉의 전위): ở chữ \"이 주께\", thầy đi C – F/A – G/B. F và G là hợp âm trong giọng C, nhưng thầy đặt bậc 3 của chúng xuống bass (đảo 1, bài 2): F/A có bass A, G/B có bass B. Nhờ vậy bass đi lên liền bậc A, B, nghe như một dòng nhạc thay vì nhảy F, G.", "compare": {"a": {"label": "C – F – G", "play": ["C", "F", "G"]}, "b": {"label": "C – F/A – G/B", "play": ["C", "F/A", ["B2", "|", "G3", "A3", "D4"]]}}}, {"text": "Đảo 1 hợp âm trưởng thì bỏ bậc 3 bị nhân đôi ở tay phải, thêm 9 (như bài 2): G/B thầy bấm B2 | G3 A3 D4, F/A thì tay phải C F G (G là 9 của F). Thầy nói hợp âm thứ thì khác: đảo 1 hợp âm thứ được nhân đôi bậc 3, ví dụ Am/C có thể bấm C ở cả hai tay.", "tip": "G/B: tay trái B, tay phải G A D; A là nốt 9 của G (G lên một cung).", "keys": ["B2", "|", "G3", "A3", "D4"], "play": ["F/A", ["B2", "|", "G3", "A3", "D4"]]}, {"text": "Cliché & modal (클리셰와 모달): C – F#m7(b5) – Fm6. F#m7(b5) (F# A C E) chung ba nốt A, C, E với Am, mà Am là hợp âm thay thế của C, nên nó đứng được ở chỗ C. Bass đi từng nửa cung F# xuống F (như cliché ở bài 2), rồi vào Fm6, một hợp âm mượn từ C thứ.", "tip": "F#m7(b5) = F# A C E: bỏ F# là còn đúng hợp âm Am.", "keys": ["A3", "C4", "E4"], "play": ["C", "F#m7(b5)", "Fm6"]}, {"text": "Fm6 là hợp âm thứ thêm 6 (minor 6): Fm (F Ab C) thêm D, nốt 6 của F. Fm6 có Ab của C thứ nên nghe tối và ấm, hợp chỗ kết. Thầy còn giải thích về âm bồi: mỗi nốt đàn ngoài âm chính còn vang nhỏ nhiều âm cao hơn, và các hợp âm chung nốt thì chung nhiều âm bồi, đó là cơ sở của hợp âm thay thế.", "tip": "Nốt 6 là nốt 5 lên một cung: Fm6 có C, lên một cung là D.", "keys": ["F2", "|", "C4", "D4", "Ab4"], "compare": {"a": {"label": "Fm", "play": ["Fm"]}, "b": {"label": "Fm6", "play": ["Fm6"]}}}, {"text": "Modal & pedal point (모달과 페달포인트): C/G – Fm6/G. Tay trái giữ G suốt (pedal point, bài 1), chỉ tay phải đổi từ hợp âm C sang Fm6. Fm6 mượn từ C thứ, nên đây cũng là màu kết Amen (F thành Fm), đặt trên bass G đứng yên.", "tip": "Tay trái giữ G suốt; tay phải đổi từ C E G sang F Ab C D (Fm6).", "keys": ["G2"], "play": [["G2", "|", "C4", "E4", "G4"], ["G2", "|", "F3", "Ab3", "C4", "D4"]]}, {"text": "Nashville IV maj7 (내슐빌 4도 메이저쎄븐): C/G – Dm7 – C/F. C/F là tay trái F, tay phải hợp âm C (C E G), tức F C E G: nốt gốc F, bậc 5 C, bậc 7 E, nốt 9 G. So với Fmaj7 (F A C E) thì thiếu bậc 3 (A) và có thêm G, nên thầy gọi đây là Fmaj7 bỏ bậc 3, kiểu Nashville IV.", "tip": "Tay phải là hợp âm trưởng của nốt 5: từ F đếm lên 5 tên nốt (F, G, A, Bb, C) ra C, nên bấm hợp âm C trên bass F.", "play": ["C/G", "Dm7", "C/F"], "compare": {"a": {"label": "Fmaj7", "play": ["Fmaj7"]}, "b": {"label": "C/F (Nashville IV)", "play": ["C/F"]}}}, {"text": "Khối âm C/F không gọi tên rõ theo hoà âm cổ điển, vì thiếu bậc 3 nên không nói rõ trưởng hay thứ, nhưng nghe rất mở và đẹp. Thầy nói cách này áp dụng được cho C, F, G: hợp âm trưởng của nốt 5 đặt trên bass, ví dụ G/C trên C, D/G trên G.", "tip": "Nốt 5 của F là C, của C là G, của G là D: bấm hợp âm trưởng đó trên bass.", "keys": ["F2", "|", "C4", "E4", "G4"], "compare": {"a": {"label": "C/F", "play": ["C/F"]}, "b": {"label": "G/C", "play": [["C2", "|", "D4", "G4", "B4"]]}}}], "remember": ["Đảo 1 hợp âm trưởng (F/A, G/B): bỏ bậc 3 bị nhân đôi, thay bằng 9; hợp âm thứ thì nhân đôi bậc 3 được.", "F#m7(b5) chung A, C, E với Am (hợp âm thay thế của C), bass F# xuống F vào Fm6; Fm6/G đặt trên bass G đứng yên.", "Nashville IV: C/F = Fmaj7 bỏ bậc 3, tay phải hợp âm C trên bass F."], "items": [{"chord": "F/A", "to": "G/B", "prog": ["C", "F/A", "G/B"]}, {"chord": "F#m7(b5)", "to": "C", "rel": "sub", "prog": ["C", "F#m7(b5)", "Fm6"], "why": "F#m7(b5) chung ba nốt A, C, E với Am, mà Am là hợp âm thay thế của C, nên đứng được ở chỗ C."}, {"chord": "C/F", "to": "F", "rel": "sub", "prog": ["C/G", "Dm7", "C/F"], "why": "C/F là Fmaj7 bỏ bậc 3 (A), vẫn giữ bass F, nên đứng được ở chỗ F."}], "quiz": [{"q": "Khi bấm G/B, vì sao tay phải không bấm thêm B?", "choices": ["B là bậc 3 đã nằm ở bass, nên thay nốt đó bằng 9 (A)", "B không thuộc hợp âm G", "B là nốt gốc của G/B", "Vì G/B là hợp âm thứ"], "answer": "B là bậc 3 đã nằm ở bass, nên thay nốt đó bằng 9 (A)", "why": "Đảo 1 hợp âm trưởng tránh nhân đôi bậc 3: B đã ở bass, tay phải bấm G A D, với A là nốt 9."}, {"q": "Vì sao F#m7(b5) thay được cho C hay Am?", "choices": ["Chung ba nốt A, C, E với Am", "Cùng nốt gốc với C", "F#m7(b5) là \"mẹ\" của C", "F#m7(b5) là hợp âm trong giọng C"], "answer": "Chung ba nốt A, C, E với Am", "why": "F#m7(b5) = F# A C E, chung A, C, E với Am; Am lại là hợp âm thay thế của C, nên F#m7(b5) đứng được ở chỗ của C."}, {"q": "C/F chính là hợp âm nào bỏ bậc 3?", "choices": ["Fmaj7", "F7", "Cmaj7", "Fm7"], "answer": "Fmaj7", "why": "C/F gồm F, C, E, G: nốt gốc F, bậc 5 C, bậc 7 E và nốt 9 G, tức Fmaj7 không có bậc 3 (A)."}]},

  {"id": "p4-04", "part": 4, "src": "Phildave 4 · Bài 4", "title": "Sus4, II–V về F và \"bạn của mẹ\" của C7", "teach": [{"text": "Sus4 (써스포): ở chữ \"를 원하\", thầy đi G(sus4) – G7. G(sus4) = G C D: hợp âm treo, thay bậc 3 (B) bằng bậc 4 (C), nghe lơ lửng như đang chờ. Đưa C xuống B và thêm F là về G7. Treo trước rồi mới giải quyết thì câu có chỗ chờ, nghe có hướng hơn.", "tip": "Từ G(sus4) sang G7: đưa C xuống B, thêm F (G lùi một cung là F).", "play": ["G(sus4)", "G7", "C"]}, {"text": "Thầy phát triển dần cùng chỗ treo đó: sus4 (G C D) → 9sus4 (F/G: hợp âm F trên bass G, có thêm nốt 9) → thêm b9. Bản đủ màu thầy bấm G2 F3 | Ab3 B3 E4: tay trái G và F, tay phải Ab (b9), B (bậc 3) và E (nốt 13). Tức là G7(b9) có thêm nốt 13, đã giải quyết khỏi chỗ treo.", "tip": "Mỗi bước thêm một màu: sus4 chỉ treo, 9sus4 treo có 9, rồi b9 + 13 khi đã về bậc 3.", "keys": ["G2", "F3", "|", "Ab3", "B3", "E4"], "play": ["G(sus4)", "G9sus4", ["G2", "F3", "|", "Ab3", "B3", "E4"]]}, {"text": "Sus4 + modal (써스포 모달): G(sus4) – Bb7(9 #11 13). Bb7 ở đây có hai vai. Vai 1: \"bạn của mẹ\" (subV) của E7, vì chung tritone G#–D. Vai 2: hợp âm 7 trên bậc bVII mượn từ C thứ; bVII là bậc VII (B) hạ nửa cung thành Bb, và trong C thứ hợp âm trên Bb là Bb7 (P3 bài 19). Vì có cả hai vai, nó vào được ngay sau chỗ treo mà vẫn nghe hợp lý.", "tip": "Bb7 mượn từ C thứ dễ nhận: nốt gốc Bb và nốt 7 Ab đều là phím đen không có trong giọng C.", "play": ["G(sus4)", "Bb7(9 #11 13)"]}, {"text": "II–V về bậc IV (4도를 위한 투파이브원): C – Gm7 – Bb/C – F. Mục tiêu của chỗ phối lại này là đi vào F thật hay. Gm7 – C7 là \"chị\" và \"mẹ\" của F; ở đây C7 viết thành Bb/C, tức C7 9sus4 (C9sus4): hợp âm Bb trên bass C, giống F/G là G9sus4.", "tip": "Giống G9sus4 = F/G: tay phải là hợp âm trưởng của nốt gốc lùi một cung (C lùi một cung là Bb).", "play": ["C", "Gm7", "Bb/C", "F"]}, {"text": "SubV của C7 (C7의 썹파이브): C – Gm7 – Gb7(#11) – F. Gb7 thay C7 vì hai hợp âm chung tritone: C7 có E–Bb, Gb7 = Gb Bb Db Fb cũng có Bb và Fb (cùng phím với E). Tìm bằng mẹo \"banana pineapple\" (P3 bài 1): từ C đọc bảy âm tiết, mỗi âm tiết bấm một phím liền nhau, tính cả phím đen; âm tiết thứ bảy rơi vào Gb. Gb7(#11) là hợp âm 7 thêm #11; khi phát ký hiệu, app bấm đủ 9, #11, 13 như Gb13(#11) ở P3.", "tip": "Gb7(#11): tay phải hợp âm Ab, là hợp âm ba nốt cao hơn nốt gốc một cung (Gb lên một cung là Ab).", "compare": {"a": {"label": "Gm7 – C7 – F", "play": ["Gm7", "C7", "F"]}, "b": {"label": "Gm7 – Gb7(#11) – F", "play": ["Gm7", "Gb7(#11)", "F"]}}}, {"text": "Tiến hành đi qua đi lên (상행 경과적진행): C – Bb/D – C/E, bass đi lên liền bậc C, D, E. Thầy dặn nốt trên cùng (nốt giai điệu) nên được đánh cùng hợp âm: giai điệu và hợp âm vang cùng nhau tạo ra màu mà tên hợp âm không ghi hết. Ví dụ Bb/D có F ở trên cùng, nghe khác hẳn khi chỉ đệm hợp âm và để ca sĩ hát F.", "tip": "Bb/D: tay trái D, tay phải Bb C F; C/E: tay trái E, tay phải C D G. Bass đã có bậc 3 nên tay phải thay nốt đó bằng 9 (nốt gốc lên một cung).", "play": ["C", ["D2", "|", "Bb3", "C4", "F4"], "C/E"]}], "remember": ["Sus4 → 9sus4 → thêm b9: G(sus4) treo, đưa C xuống B là về G7.", "Đi vào F: C – Gm7 – Bb/C (Bb/C = C9sus4), hoặc Gm7 – Gb7(#11) (\"bạn của mẹ\" của C7, chung tritone E–Bb).", "Đánh nốt trên cùng cùng với hợp âm: C – Bb/D – C/E, bass đi lên liền bậc."], "items": [{"chord": "G(sus4)", "to": "G7", "rel": "line", "prog": ["G(sus4)", "G7"]}, {"chord": "Gb7(#11)", "to": "F", "prog": ["C", "Gm7", "Gb7(#11)", "F"]}, {"chord": "Bb/D", "to": "C/E", "prog": ["C", "Bb/D", "C/E"]}], "quiz": [{"q": "Vì sao Gb7 thay được C7 để đi vào F?", "choices": ["Hai hợp âm chung tritone E–Bb", "Hai hợp âm chung nốt gốc", "Gb nằm trong giọng C", "Gb7 là hợp âm thứ"], "answer": "Hai hợp âm chung tritone E–Bb", "why": "Bậc 3 và 7 của C7 là E và Bb; của Gb7 là Bb và Fb (tức E): cùng tritone nên cùng kéo về F."}, {"q": "Bb/C là hợp âm nào viết theo cách khác?", "choices": ["C9sus4 (C7 9sus4)", "Bbmaj7", "C7(b9)", "Cm7"], "answer": "C9sus4 (C7 9sus4)", "why": "Hợp âm Bb (Bb D F) trên bass C: Bb là nốt 7, D là 9, F là 4 của C, đúng C9sus4, giống F/G = G9sus4."}, {"q": "Bb7 sau G(sus4) được thầy giải thích thế nào?", "choices": ["Vừa là \"bạn của mẹ\" của E7, vừa là hợp âm mượn từ C thứ", "Là \"mẹ\" của Eb", "Là hợp âm trong giọng C", "Là hợp âm giảm đi qua"], "answer": "Vừa là \"bạn của mẹ\" của E7, vừa là hợp âm mượn từ C thứ", "why": "Bb7 chung tritone với E7 nên là \"bạn của mẹ\" của E7; nó cũng là hợp âm bậc bVII của C thứ, mượn sang giọng C."}]},

  {"id": "p4-05", "part": 4, "src": "Phildave 4 · Bài 5", "title": "Ba cách vào Dm7(9): thay thế, nốt màu, Db7", "teach": [{"text": "Hợp âm thay thế diatonic (다이어토닉 대리코드): ở chữ \"이 되신\", thầy có ba cách phối, cách nào cũng đi vào hợp âm đích Dm7(9), tức Dm7 thêm nốt 9 (E). Cách 1: Fmaj7 – C/E – Dm7(9) – G7(#5); sổ tay ghi FM7, chính là Fmaj7, còn G7(#5) là G7+ ở bài 2. C/E đứng giữa Fmaj7 và Dm7(9) cho bass đi xuống liền bậc F, E, D.", "tip": "Nốt 9 của D là E (D lên một cung); khi phát Dm7(9), app bấm D F | C E A.", "play": ["Fmaj7", "C/E", "Dm7(9)", "G7(#5)"]}, {"text": "Vì sao phải chèn C/E? Bản gốc để Fmaj7 đứng suốt 2 ô nhịp. Nếu chỉ đánh thêm tiết tấu trên cùng một hợp âm thì nghe vẫn đều đều; thầy dặn chỗ một hợp âm đứng 2 ô nhịp phải đổi hợp âm, để ô thứ hai có một điểm nhấn mới. Đổi sang C/E vừa tạo điểm nhấn, vừa giữ bass đi liền bậc.", "compare": {"a": {"label": "Fmaj7 đứng 2 ô nhịp", "play": ["Fmaj7", "Fmaj7", "Dm7(9)"]}, "b": {"label": "Fmaj7 – C/E", "play": ["Fmaj7", "C/E", "Dm7(9)"]}}}, {"text": "Tension của dominant 7 (도미넌트쎄븐의 텐션), cách 2: Fmaj7 – A7(b13 #9) – Dm7(9) – G7(9 #11 13). A7 là \"mẹ\" của Dm; đích Dm là hợp âm thứ nên A7 dùng màu biến đổi (P3 bài 15). A7(b13 #9) chính là A7(#9 b13) ở P3: #9 là C, b13 là F, cả hai đều là nốt của Dm7.", "tip": "Khi phát A7(b13 #9), app bấm tay trái A C# G, tay phải hợp âm F (C F A).", "play": ["Fmaj7", "A7(b13 #9)", "Dm7(9)"]}, {"text": "Sau Dm7(9), G7(9 #11 13) dựng bằng hợp âm ba nốt phía trên (upper structure, P3 bài 16): thầy bấm tay trái G7 (G2 F3 B3), tay phải hợp âm A (C# E A). A, C#, E là nốt 9, #11, 13 của G. Nghe cả cách 2: Fmaj7 – A7(b13 #9) – Dm7(9) – G7(9 #11 13).", "tip": "G7(9 #11 13): tay phải hợp âm A, là hợp âm ba nốt cao hơn nốt gốc một cung (G lên một cung là A).", "keys": ["G2", "F3", "B3", "|", "C#4", "E4", "A4"], "play": ["Fmaj7", "A7(b13 #9)", "Dm7(9)", ["G2", "F3", "B3", "|", "C#4", "E4", "A4"]]}, {"text": "Hợp âm thay thế dominant (도미넌트의 대리코드), cách 3: Fmaj7 – D#°7 – Dm7(9) – Db7(9 #11 13) – C. D#°7 (D#dim7) đứng ngay trên Dm7(9) nửa cung, nên bass đi D# xuống D. Db7 thay G7 vì bậc 3 và 7 của Db7 (F và Cb, tức B) chính là bậc 7 và 3 của G7 (P3 bài 22).", "tip": "Db7(9 #11 13): tay phải hợp âm Eb, là hợp âm ba nốt cao hơn nốt gốc một cung (Db lên một cung là Eb).", "play": ["Fmaj7", "D#°7", "Dm7(9)", "Db7(9 #11 13)", "C"]}, {"text": "Ở cách 3, thầy cũng nhắc: piano không bắt buộc đánh nốt giai điệu. Ca sĩ hát giai điệu, còn piano lo hợp âm; nhờ vậy tay phải được tự do chọn màu như Db7(9 #11 13) mà không phải giữ nốt giai điệu trên cùng. Nghe so sánh G7 → C với Db7(9 #11 13) → C.", "compare": {"a": {"label": "G7 → C", "play": ["G7", "C"]}, "b": {"label": "Db7(9 #11 13) → C", "play": ["Db7(9 #11 13)", "C"]}}}], "remember": ["Một hợp âm đứng 2 ô nhịp thì đổi hợp âm để có điểm nhấn (Fmaj7 – C/E – Dm7(9)).", "Về Dm7(9): A7(b13 #9) màu biến đổi; G7(9 #11 13) = tay trái G7 + tay phải hợp âm A.", "Db7 thay G7: bậc 3, 7 của Db7 là bậc 7, 3 của G7; piano không bắt buộc đánh giai điệu."], "items": [{"chord": "A7(b13 #9)", "to": "Dm7(9)", "prog": ["Fmaj7", "A7(b13 #9)", "Dm7(9)", "G7(9 #11 13)"]}, {"chord": "Db7(9 #11 13)", "to": "C", "prog": ["Fmaj7", "D#°7", "Dm7(9)", "Db7(9 #11 13)", "C"]}, {"chord": "C/E", "to": "Dm7(9)", "prog": ["Fmaj7", "C/E", "Dm7(9)", "G7(#5)"]}], "quiz": [{"q": "G7(9 #11 13) theo sổ tay bấm thế nào?", "choices": ["Tay trái G7 (G F B), tay phải hợp âm A", "Tay trái G, tay phải hợp âm F", "Tay trái G7, tay phải hợp âm Db", "Tay trái G B, tay phải hợp âm Dm"], "answer": "Tay trái G7 (G F B), tay phải hợp âm A", "why": "Hợp âm A (C# E A) trên G7 cho đủ 9 (A), #11 (C#), 13 (E)."}, {"q": "Chỗ một hợp âm đứng 2 ô nhịp, thầy làm gì?", "choices": ["Đổi hợp âm để tạo điểm nhấn nhịp", "Chỉ thêm tiết tấu", "Đánh to hơn", "Để trống cho ca sĩ"], "answer": "Đổi hợp âm để tạo điểm nhấn nhịp", "why": "Thầy dặn phải đổi hợp âm (như Fmaj7 – C/E), chứ không chỉ thêm tiết tấu."}]},

  {"id": "p4-06", "part": 4, "src": "Phildave 4 · Bài 6", "title": "Chèn hợp âm giữa C, Am, F", "teach": [{"text": "Passing progression + 9sus4 (경과적진행과 나인써스포): ở chữ \"주 반석\", câu gốc đi C – Am – F, ba hợp âm trong giọng C. Thầy nói giữa các hợp âm đó có thể chèn hợp âm đẹp: C – G/B – Am7(9) – Bb/C – F. G/B cho bass đi xuống C, B, A vào Am7(9) (Am7 thêm nốt 9 là B), còn Bb/C (C9sus4, bài 4) dẫn vào F.", "tip": "Bb/C: tay trái C, tay phải hợp âm Bb, là hợp âm trưởng của nốt gốc lùi một cung (C lùi một cung là Bb).", "compare": {"a": {"label": "C – Am – F", "play": ["C", "Am", "F"]}, "b": {"label": "C – G/B – Am7(9) – Bb/C – F", "play": ["C", "G/B", "Am7(9)", "Bb/C", "F"]}}}, {"text": "Dominant 7 trước hợp âm đích (목적지앞에 도미넌트쎄븐을): C – E7(b13 #9) – Am7(9) – A7(b13 #9) – F. E7 là \"mẹ\" của Am, và đích thứ nên dùng màu biến đổi. A7 lẽ ra về Dm nhưng lại đi về F. Được, vì Dm và F cùng họ thay thế: Dm7 (D F A C) chung ba nốt F, A, C với F (P3 bài 11).", "tip": "E7(b13 #9) dễ bấm: tay trái E G# D, tay phải hợp âm C (C E G).", "play": ["C", "E7(b13 #9)", "Am7(9)", "A7(b13 #9)", "F"]}, {"text": "SubV + altered tension (썹파이브와 얼터드텐션): C – Bb7(9 #11 13) – Am7(9) – Eb7(9 #11 13). Thầy đổi hai hợp âm 7 ở màn trước thành \"bạn của mẹ\": Bb7 thay E7 (cùng về Am), Eb7 thay A7. Màu 9, #11, 13 trên \"bạn của mẹ\" nghe giống màu biến đổi của \"mẹ\": C và G trên Bb7 chính là b13 và #9 của E7, nên tên mục gọi là altered tension.", "tip": "Tay phải là hợp âm ba nốt cao hơn nốt gốc một cung: Bb7 bấm hợp âm C, Eb7 bấm hợp âm F.", "compare": {"a": {"label": "\"Mẹ\": E7, A7", "play": ["C", "E7(b13 #9)", "Am7(9)", "A7(b13 #9)"]}, "b": {"label": "\"Bạn của mẹ\": Bb7, Eb7", "play": ["C", "Bb7(9 #11 13)", "Am7(9)", "Eb7(9 #11 13)"]}}}], "remember": ["Giữa các hợp âm trong giọng C, Am, F có thể chèn hợp âm: G/B nối C xuống Am, Bb/C dẫn vào F.", "Trước Am7(9): E7(b13 #9) (\"mẹ\", màu biến đổi) hoặc Bb7(9 #11 13) (\"bạn của mẹ\").", "A7 về F vẫn được, vì Dm và F cùng họ thay thế."], "items": [{"chord": "E7(b13 #9)", "to": "Am7(9)", "prog": ["C", "E7(b13 #9)", "Am7(9)", "A7(b13 #9)"]}, {"chord": "Bb7(9 #11 13)", "to": "Am7(9)", "prog": ["C", "Bb7(9 #11 13)", "Am7(9)", "Eb7(9 #11 13)"]}, {"chord": "Bb/C", "to": "F", "prog": ["C", "G/B", "Am7(9)", "Bb/C", "F"]}], "quiz": [{"q": "A7 lẽ ra về Dm, vì sao đi về F vẫn được?", "choices": ["Dm và F cùng họ thay thế", "A7 là \"mẹ\" của F", "F là hợp âm thứ", "A7 có nốt F"], "answer": "Dm và F cùng họ thay thế", "why": "Dm (D F A) và F (F A C) chung F và A, nên F đứng được ở chỗ của Dm."}, {"q": "Eb7(9 #11 13) là \"bạn của mẹ\" của hợp âm nào?", "choices": ["A7", "E7", "Bb7", "G7"], "answer": "A7", "why": "Eb7 chung tritone với A7 và cùng về Dm; đích Dm nhích lên nửa cung là Eb."}]},

  {"id": "p4-07", "part": 4, "src": "Phildave 4 · Bài 7", "title": "Giảm đi qua, G7(13) và giai điệu riêng", "teach": [{"text": "Diminished (디미니쉬): Fmaj7 – F#°7 – G, bass đi từng nửa cung F, F#, G. F#°7 (F#dim7 = F# A C Eb) là hợp âm giảm đi qua (P3 bài 24): nốt gốc F# là G lùi nửa cung, nên kéo lên G rất tự nhiên.", "tip": "Bấm F#dim7: tay trái F#, tay phải hợp âm Adim (A C Eb).", "play": ["Fmaj7", "F#°7", "G"]}, {"text": "Passing progression (경과적진행): Fmaj7 – C/E – Dm7 – G7(13) – C, bass đi xuống F, E, D rồi sang G. G7(13) chính là G13 ở P3. Thầy nói chỉ cần nốt 13 tự nhiên là đã rất jazz: giữa bậc 3 (B) và nốt 13 (E) là một quãng 4 đúng, nghe hơi \"gai gai\" mà đẹp.", "tip": "Nốt 13 là nốt 6 tính từ nốt gốc, đặt cao lên: G, A, B, C, D, E ra E.", "keys": ["G2", "F3", "|", "B3", "E4"], "compare": {"a": {"label": "G7 → C", "play": ["Fmaj7", "C/E", "Dm7", "G7", "C"]}, "b": {"label": "G7(13) → C", "play": ["Fmaj7", "C/E", "Dm7", ["G2", "F3", "|", "B3", "E4"], "C"]}}}, {"text": "Dominant & subV (도미넌트와 썹파이브): Fmaj7 – B7 – Dm7(9) – Db7(9 #11 13) – C. B7 không phải \"mẹ\" của Dm7 (\"mẹ\" của Dm là A7), và thầy không giải thích chỗ này. Nhìn đường đi của các nốt thì thấy vì sao vẫn nghe mượt: B lên C, D# lên E, F# xuống F, A giữ nguyên, toàn là nốt của Dm7(9). Sau đó Db7 là \"bạn của mẹ\" của C (chung tritone B–F với G7), nên về C bằng bước nửa cung Db xuống C.", "compare": {"a": {"label": "B7 → Dm7(9): các nốt trượt gần", "play": [["B2", "|", "A3", "B3", "D#4", "F#4"], ["D2", "|", "A3", "C4", "E4", "F4"]]}, "b": {"label": "Cả câu", "play": ["Fmaj7", "B7", "Dm7(9)", "Db7(9 #11 13)", "C"]}}}, {"text": "Ở câu này thầy dặn: nếu không đánh giai điệu gốc thì piano phải có giai điệu riêng đẹp ở tay phải. Ví dụ của thầy: hai nốt Bb và Ab cách nhau một cung; thầy nối chúng bằng nốt ở giữa, Bb – A – Ab, đi liền từng phím. Nốt chen vào để nối hai nốt giai điệu như vậy gọi là nốt nối (approach note).", "tip": "Bb và Ab cách nhau một cung; phím A nằm ngay giữa, nên đi Bb → A → Ab là liền từng phím.", "compare": {"a": {"label": "Hai nốt: Bb – Ab", "play": [["Bb4"], ["Ab4"]]}, "b": {"label": "Có nốt nối: Bb – A – Ab", "play": [["Bb4"], ["A4"], ["Ab4"]]}}}], "remember": ["Hợp âm giảm đi qua: F#°7 nối Fmaj7 lên G, bass F, F#, G.", "Chỉ cần nốt 13 tự nhiên (G7(13) = G13) là đã rất jazz.", "Không đánh giai điệu gốc thì tay phải phải có giai điệu riêng đẹp."], "items": [{"chord": "F#°7", "to": "G", "prog": ["Fmaj7", "F#°7", "G"]}, {"chord": "G7(13)", "to": "C", "prog": ["Fmaj7", "C/E", "Dm7", "G7(13)", "C"]}, {"chord": "Db7(9 #11 13)", "to": "C", "prog": ["Fmaj7", "B7", "Dm7(9)", "Db7(9 #11 13)", "C"]}], "quiz": [{"q": "Vì sao F#°7 đặt được giữa Fmaj7 và G?", "choices": ["Bass đi từng nửa cung F, F#, G và F#°7 kéo lên G", "F#°7 là hợp âm trong giọng C", "F#°7 có cùng nốt gốc với G", "F#°7 là \"bạn của mẹ\" của G"], "answer": "Bass đi từng nửa cung F, F#, G và F#°7 kéo lên G", "why": "F#°7 là hợp âm giảm đi qua: nốt gốc F# là G lùi nửa cung, nên kéo lên G."}, {"q": "Nếu piano không đánh giai điệu gốc thì thầy dặn gì?", "choices": ["Tay phải phải có một giai điệu riêng đẹp", "Chỉ đánh nốt bass", "Đánh to hơn ca sĩ", "Bỏ hết nốt màu"], "answer": "Tay phải phải có một giai điệu riêng đẹp", "why": "Piano không đánh giai điệu gốc thì phải tự có đường nốt riêng, như cây cầu giai điệu Bb – A – Ab."}]},

  {"id": "p4-08", "part": 4, "src": "Phildave 4 · Bài 8", "title": "Chia hợp âm dài, \"chị\" và hợp âm mượn kiểu 2", "teach": [{"text": "Đảo Amen cadence (아멘종지의 전위): ở chữ \"주 나의\", bản gốc để G7sus4 đứng suốt 8 phách. Một hợp âm đứng lâu như vậy nghe đều đều, nên thầy chia ra: G(sus4) – Dm7 – Fm/Ab. Dm7 là \"chị\" của G7 (cặp II–V), nên chen vào chỗ G đứng lâu được.", "compare": {"a": {"label": "Bản gốc: G7sus4 cả 8 phách", "play": [["G2", "F3", "C4", "D4"]]}, "b": {"label": "Chia ra: G(sus4) – Dm7 – Fm/Ab", "play": ["G(sus4)", "Dm7", "Fm/Ab"]}}}, {"text": "Fm/Ab là Fm đảo 1 (bậc 3 Ab ở bass, bài 2). Fm mượn từ C thứ, nên F → Fm là kết Amen; ở đây thầy dùng Fm đảo 1, nên gọi là kết Amen đảo. Bass đi G, D, Ab thay vì đứng yên ở G.", "tip": "Fm/Ab: tay trái Ab, tay phải hợp âm Fm (F Ab C).", "keys": ["Ab2", "|", "C4", "F4", "Ab4"], "play": ["G(sus4)", "Dm7", "Fm/Ab"]}, {"text": "Related II minor (릴레이티드 투마이너): G(sus4) – Abm7 – Db7(9 #11 13) – F/G. Thầy dặn: hợp âm 7 nào cũng có một II thứ đi kèm (\"chị\", P3 bài 25), kéo ra dùng lúc nào cũng được. Ở đây Db7 là \"bạn của mẹ\" của C, và Abm7 là \"chị\" của Db7. Db7 không về C mà đi sang F/G, để G treo tiếp ở câu sau.", "tip": "Tìm \"chị\": từ nốt gốc của \"mẹ\" đếm lên 5 tên nốt, Db, Eb, F, Gb, Ab ra Abm7.", "play": ["G(sus4)", "Abm7", "Db7(9 #11 13)", "F/G"]}, {"text": "Modal interchange kiểu 2 (모달인터체인지): Ebmaj7 – Abmaj7 – Dbmaj7 – F/G. Ebmaj7 và Abmaj7 lấy từ C thứ tự nhiên (C D Eb F G Ab Bb); Dbmaj7 có Db, nốt không có trong C thứ tự nhiên, mà có trong C Phrygian (C Db Eb F G Ab Bb). Thầy nói còn mượn được cả từ thứ hoà âm (harmonic minor) và thứ giai điệu (jazz minor).", "play": ["Ebmaj7", "Abmaj7", "Dbmaj7", "F/G"]}, {"text": "Vì sao Ebmaj7 nghe hợp trong bài giọng C? Ebmaj7 = Eb G Bb D: bậc 3 (G) và bậc 7 (D) của nó là hai nốt định hướng, và cả hai đều nằm trong giọng C. Chỉ nốt gốc Eb và Bb là nốt mượn, nên tai vẫn thấy quen mà có màu lạ.", "tip": "Nốt 7 của maj7 là nốt gốc lùi nửa cung: Eb lùi nửa cung là D.", "keys": ["G4", "D5"], "compare": {"a": {"label": "Ebmaj7", "play": ["Ebmaj7"]}, "b": {"label": "Cmaj7", "play": ["Cmaj7"]}}}], "remember": ["Hợp âm đứng lâu (8 phách G7sus4) thì chia ra: G(sus4) – Dm7 – Fm/Ab.", "Hợp âm 7 nào cũng có \"chị\" đi kèm: Abm7 – Db7.", "Ebmaj7, Abmaj7, Dbmaj7 là hợp âm mượn; Ebmaj7 có bậc 3, 7 (G, D) nằm trong giọng C."], "items": [{"chord": "Abm7", "to": "Db7(9 #11 13)", "prog": ["G(sus4)", "Abm7", "Db7(9 #11 13)", "F/G"]}, {"chord": "Dbmaj7", "rel": "modal", "prog": ["Ebmaj7", "Abmaj7", "Dbmaj7", "F/G"]}], "quiz": [{"q": "Vì sao Ebmaj7 nghe hợp trong bài giọng C?", "choices": ["Bậc 3 (G) và bậc 7 (D) của nó nằm trong giọng C", "Nốt gốc Eb nằm trong giọng C", "Nó là \"mẹ\" của C", "Nó là hợp âm giảm đi qua"], "answer": "Bậc 3 (G) và bậc 7 (D) của nó nằm trong giọng C", "why": "Ebmaj7 = Eb G Bb D; hai nốt định hướng G và D đều là phím trắng của giọng C."}, {"q": "Abm7 đứng trước Db7 là gì của Db7?", "choices": ["\"Chị\" (II liên quan)", "\"Mẹ\"", "\"Bạn của mẹ\"", "Hợp âm giảm đi qua"], "answer": "\"Chị\" (II liên quan)", "why": "Coi Db7 là bậc V thì Abm7 nằm ở bậc II: từ Db đếm lên 5 tên nốt ra Ab."}]},

  {"id": "p4-09", "part": 4, "src": "Phildave 4 · Bài 9", "title": "Thực chiến: phối cả bài \"Mọi lời trên môi con\"", "teach": [{"text": "Phối cả bài \"입술의 모든 말\" (Mọi lời trên môi con), thầy dùng hai cách tiến hành lớn: tiến hành đi qua (bass liền bậc nối C, Am, F) và hợp âm 7 trước đích. Hai cách kết hợp được, ví dụ C – E7/B – Am: bass đi liền bậc C, B, A, mà E7 lại là \"mẹ\" của Am.", "tip": "E7/B giữ được bass B vì B có sẵn trong E7 (E G# B D).", "compare": {"a": {"label": "C – Am", "play": ["C", "Am"]}, "b": {"label": "C – E7/B – Am", "play": ["C", "E7/B", "Am"]}}}, {"text": "Thầy chơi cả bài theo nguyên tắc: đầu bài dùng hợp âm trong giọng đơn giản, càng về sau càng phức tạp. Ô nhịp (một khung nhịp trong bản nhạc) 17–20 có số hợp âm gấp đôi lần đầu. Cùng một chỗ lặp lại thì phải đổi màu hợp âm, như câu \"입술의 모든 말\" ở bài 1: lần đầu Dm/C, lần sau Dm7(b5)/C.", "compare": {"a": {"label": "Lần đầu: Dm/C", "play": ["C", ["C2", "C3", "|", "A3", "D4", "F4"], "C"]}, "b": {"label": "Lặp lại: Dm7(b5)/C", "play": ["C", ["C2", "C3", "|", "Ab3", "D4", "F4"], "C"]}}}, {"text": "F#m7(b5) cùng họ với Am, vì có ba nốt A, C, E của Am, mà Am là hợp âm thay thế của C. Vì vậy sau F#m7(b5), bass không bắt buộc về C. Bass F# đi lên nửa cung về G (C/G, hợp âm C trên bass G) cũng được, và đường bass nghe liền hơn.", "tip": "F#m7(b5) = F# A C E: bỏ F# là còn đúng hợp âm Am.", "keys": ["A3", "C4", "E4"], "compare": {"a": {"label": "F#m7(b5) → C", "play": ["F#m7(b5)", "C"]}, "b": {"label": "F#m7(b5) → C/G", "play": ["F#m7(b5)", "C/G"]}}}, {"text": "Thầy nhắc: hợp âm 7 không cần nốt gốc, chỉ cần bậc 3 và bậc 7 (nốt định hướng). Hai nốt này là tritone, quyết định hợp âm, nên một mình chúng đã kéo về đích; nốt gốc thì người chơi bass lo. Ví dụ E7 chỉ cần G# và D: nghe G# D rồi Am.", "tip": "E7: bậc 3 là G#, bậc 7 là E lùi một cung (D).", "keys": ["G#3", "D4", "|"], "compare": {"a": {"label": "E7 → Am", "play": ["E7", "Am"]}, "b": {"label": "Chỉ G# và D → Am", "play": [["G#3", "D4", "|"], "Am"]}}}, {"text": "Bb7 trước C là hợp âm mượn (modal) từ C thứ, không phải \"bạn của mẹ\" (subV) của E7. \"Bạn của mẹ\" của E7 phải đi về Am, còn ở đây Bb7 đi thẳng về C.", "tip": "Nhìn hợp âm đứng sau: Bb7 → Am là \"bạn của mẹ\", Bb7 → C là hợp âm mượn.", "compare": {"a": {"label": "Bb7 → C (mượn)", "play": ["Bb7", "C"]}, "b": {"label": "Bb7 → Am (\"bạn của mẹ\" của E7)", "play": ["Bb7", "Am"]}}}, {"text": "Đoạn kết (ending) thầy chơi tự do. Thầy khuyên viết ra giấy các phương án cho từng ô nhịp rồi chọn, để lúc đệm thật không phải nghĩ tại chỗ. Ví dụ cùng chữ \"나의\" có thể là F/G – G7(b9) – C (đi qua hợp âm 7) hoặc F/G – Fm/G (đi qua hợp âm mượn).", "compare": {"a": {"label": "Phương án 1", "play": ["F/G", "G7(b9)", "C"]}, "b": {"label": "Phương án 2", "play": ["F/G", "Fm/G"]}}}], "remember": ["Hai đường lớn: tiến hành đi qua (bass liền bậc) và hợp âm 7 trước đích; kết hợp được: C – E7/B – Am.", "Đầu bài đơn giản, về sau phức tạp; chỗ lặp lại phải đổi màu; viết ra giấy phương án cho từng ô nhịp.", "Hợp âm 7 chỉ cần bậc 3 và 7; Bb7 trước C là hợp âm mượn, không phải \"bạn của mẹ\" của E7."], "items": [{"chord": "E7/B", "to": "Am", "prog": ["C", "E7/B", "Am"]}, {"chord": "Bb7", "rel": "modal", "prog": ["Bb7", "C"]}], "quiz": [{"q": "Bb7 đứng ngay trước C trong bài là gì?", "choices": ["Hợp âm mượn từ C thứ", "\"Bạn của mẹ\" của E7", "\"Mẹ\" của C", "Hợp âm trong giọng C"], "answer": "Hợp âm mượn từ C thứ", "why": "\"Bạn của mẹ\" của E7 phải về Am; Bb7 đi về C nên đây là hợp âm mượn từ C thứ."}, {"q": "Khi đệm hợp âm 7, piano cần giữ những nốt nào?", "choices": ["Bậc 3 và bậc 7", "Nốt gốc và bậc 5", "Chỉ nốt gốc", "Bậc 5 và nốt 9"], "answer": "Bậc 3 và bậc 7", "why": "Bậc 3 và 7 là tritone quyết định hợp âm 7; nốt gốc có thể bỏ."}, {"q": "C – E7/B – Am kết hợp hai cách nào?", "choices": ["Bass đi liền bậc và hợp âm 7 trước đích", "Hợp âm mượn và hợp âm giảm", "Hai hợp âm treo liền nhau", "\"Bạn của mẹ\" và \"chị\""], "answer": "Bass đi liền bậc và hợp âm 7 trước đích", "why": "Bass C, B, A đi liền bậc (tiến hành đi qua), và E7 là \"mẹ\" của Am."}]},

  {"id": "p4-10", "part": 4, "src": "Phildave 4 · Bài 10", "title": "C#°7, A7 treo và Eb7: các đường vào Dm7", "teach": [{"text": "Gốc của diminished (디미니쉬의 원형을 알자): phần 2 là bài \"사랑하는 나의 아버지\" (Cha yêu dấu của con), giọng C. Ở chữ \"Yêu dấu…\", thầy đi C – C#°7 – Dm7: C#°7 là cây cầu nối C với Dm7, hợp âm đích của câu, bass đi C, C#, D. Dạng gốc của C#°7 là A7: A7(b9) bỏ nốt gốc A còn C# E G Bb (bài 1), nên chỗ này chơi A7(b9) cũng được.", "compare": {"a": {"label": "C – C#°7 – Dm7", "play": ["C", "C#°7", "Dm7"]}, "b": {"label": "C – A7(b9) – Dm7", "play": ["C", "A7(b9)", "Dm7"]}}}, {"text": "C#dim7, Edim7, Gdim7, Bbdim7 là cùng một họ: cùng bốn phím C# E G Bb, cùng một âm thanh, chỉ đổi nốt nằm ở bass (P3 bài 24). Còn m7(b5) (nửa giảm, như Bm7b5 = B D F A) là hợp âm khác hẳn: bậc 7 của nó cao hơn dim7 nửa cung. Đừng lẫn hai loại này khi đọc tên.", "tip": "C#dim7, Edim7, Gdim7, Bbdim7 bấm chung bốn phím C# E G Bb, chỉ đổi nốt nằm dưới.", "compare": {"a": {"label": "C#dim7", "play": ["C#dim7"]}, "b": {"label": "Bm7b5 (nửa giảm)", "play": ["Bm7b5"]}}}, {"text": "Các hợp âm thay thế dominant (도미넌트의 대리코드들): A7 trước Dm7 làm được rất nhiều kiểu: A7(b9), A7 có #9 và b13, hay A7sus4 rồi giải quyết. Cùng một chỗ \"mẹ\" của Dm7, mỗi kiểu cho một màu khác; đích vẫn là Dm7. Nghe ba kiểu trước Dm7; cách giải quyết A7sus4 nói kỹ ở màn sau.", "play": ["A7(b9)", "Dm7", "A7(b13 #9)", "Dm7", ["A2", "|", "A3", "B3", "D4"], ["A2", "|", "G3", "Bb3", "C#4"], "Dm7"]}, {"text": "Khi giải quyết A7sus4, mỗi nốt treo đi xuống một bước: bậc 4 về 3, bậc 8 (nốt gốc ở trên) về 7, nốt 9 về b9. Tay phải A B D đi xuống G Bb C#: A xuống G một cung, B xuống Bb và D xuống C# nửa cung. Ba nốt cùng đi xuống một bước nên vào A7(b9) rất mượt, rồi về Dm7.", "tip": "Tay phải A B D đi xuống G Bb C#: A xuống G (8 về 7), B xuống Bb (9 về b9), D xuống C# (4 về 3).", "keys": ["A2", "|", "A3", "B3", "D4"], "play": ["C", ["A2", "|", "A3", "B3", "D4"], ["A2", "|", "G3", "Bb3", "C#4"], "Dm7"]}, {"text": "9sus4 và giải quyết (나인써스포와 해결): C – G/A – A7(b9) – Dm7. G/A chính là A7 9sus4 (tay trái A, tay phải hợp âm G), giống F/G là G7 9sus4; treo trước rồi mới giải quyết về A7(b9) thì câu có chỗ chờ.", "tip": "G/A: tay trái A, tay phải hợp âm G (A lùi một cung là G).", "play": ["C", "G/A", "A7(b9)", "Dm7"]}, {"text": "Sau Dm7, thầy thêm Dm(M7) (hợp âm thứ – 7 trưởng, bài 2: Dm thêm C#). Thầy nói Dm(M7) dùng được cho mọi hợp âm thứ, kể cả trong giọng thứ: nó làm hợp âm thứ đứng lâu có thêm chuyển động. Nghe Dm7 – Dm(M7): chỉ C đổi thành C#.", "play": ["Dm7", "Dm(M7)", "Dm7"]}, {"text": "Hai cách hiểu (두가지 경우의 해석): C – Eb7 – Dm7 – Dm(M7). Chỗ trước Dm7 hiểu được hai cách: A7 là \"mẹ\" của Dm, còn Eb7 là \"bạn của mẹ\" của A7 (thầy gọi là secondary substitute dominant, P3 bài 23), vì hai hợp âm chung tritone C#–G (Eb7 có G và Db). Màu đúng cho Eb7 là hợp âm F đặt trên Eb7, cho đủ 9, #11, 13.", "tip": "Eb7: tay trái Eb Db G (nốt gốc, 7, 3), tay phải hợp âm F, là hợp âm ba nốt cao hơn nốt gốc một cung (Eb lên một cung là F).", "keys": ["Eb2", "Db3", "G3", "|", "F4", "A4", "C5"], "compare": {"a": {"label": "C – A7 – Dm7", "play": ["C", "A7", "Dm7"]}, "b": {"label": "C – Eb7 – Dm7 – Dm(M7)", "play": ["C", ["Eb2", "Db3", "G3", "|", "F4", "A4", "C5"], "Dm7", "Dm(M7)"]}}}], "remember": ["Vào Dm7: C#°7 (nằm sẵn trong A7(b9)), A7, hoặc Eb7 (\"bạn của mẹ\" của A7, tay phải hợp âm F).", "A7sus4 giải quyết: bậc 4 về 3, 8 về 7, 9 về b9; G/A là A7 9sus4.", "C#dim7, Edim7, Gdim7, Bbdim7 cùng bốn phím; Dm(M7) dùng được cho mọi hợp âm thứ."], "items": [{"chord": "C#°7", "to": "Dm7", "prog": ["C", "C#°7", "Dm7"]}, {"chord": "G/A", "to": "A7(b9)", "rel": "line", "prog": ["C", "G/A", "A7(b9)", "Dm7", "Dm(M7)"]}, {"chord": "Eb7", "to": "Dm7", "prog": ["C", "Eb7", "Dm7", "Dm(M7)"]}], "quiz": [{"q": "Khi giải quyết A7sus4 về A7(b9), các nốt treo đi thế nào?", "choices": ["Bậc 4 về 3, 8 về 7, 9 về b9", "Bậc 4 lên 5, 9 lên 3", "Chỉ đổi nốt bass", "Bậc 3 lên bậc 4"], "answer": "Bậc 4 về 3, 8 về 7, 9 về b9", "why": "Mỗi nốt đi xuống một bước: D về C# (4 về 3), A về G (8 về 7), B về Bb (9 về b9)."}, {"q": "Eb7 trước Dm7 lấy màu đúng bằng cách nào?", "choices": ["Tay phải hợp âm F trên Eb7, cho đủ 9, #11, 13", "Tay phải hợp âm Eb, cho b9 và b13", "Tay phải hợp âm Dm, vì đích là Dm", "Tay phải hợp âm Bb, cho 9sus4"], "answer": "Tay phải hợp âm F trên Eb7, cho đủ 9, #11, 13", "why": "Eb7 là \"bạn của mẹ\", nên dùng 9, #11, 13: hợp âm F (F A C) là hợp âm ba nốt cao hơn nốt gốc một cung."}, {"q": "C#dim7, Edim7, Gdim7, Bbdim7 có gì chung?", "choices": ["Cùng bốn phím C# E G Bb, cùng một âm thanh", "Cùng nốt gốc C#", "Đều là hợp âm nửa giảm m7(b5)", "Đều đi về C"], "answer": "Cùng bốn phím C# E G Bb, cùng một âm thanh", "why": "Hợp âm giảm 7 xếp đều nhau, nên bốn tên này chỉ là bốn cách đảo của cùng bốn phím C# E G Bb."}]},

  {"id": "p4-11", "part": 4, "src": "Phildave 4 · Bài 11", "title": "Nốt chính, nốt màu và đổi 13 sang b13 lệch thời điểm", "teach": [{"text": "Nhìn tension là biết bản chất (텐션을 보면 정체를 안다): C – Bb7(13) – Dm7 – A7(b13). Để đọc được màu, trước hết tách hai loại nốt. Nốt chính của hợp âm (chord tone) là các nốt tính đến bậc 7: nốt gốc, bậc 3, bậc 5, bậc 7; Bb7 có Bb, D, F, Ab. Các nốt 9, 11, 13 xen thêm là nốt màu, như G là 13 của Bb7.", "tip": "Nốt 13 là nốt 6 tính từ nốt gốc, đặt cao lên: Bb, C, D, Eb, F, G ra G.", "keys": ["Bb2", "D3", "F3", "Ab3", "|", "G4"], "play": [["Bb2", "D3", "F3", "Ab3", "|", "G4"]]}, {"text": "Nốt màu nằm sẵn trong âm giai của hợp âm là nốt màu tự nhiên (như 13 của Bb7 là G); hạ hay nâng nửa cung ra khỏi âm giai thì thành màu biến đổi (như b13 của A7 là F). Nhìn loại nốt màu là đoán được hợp âm đang làm gì, như màn sau.", "compare": {"a": {"label": "Bb7(13): màu tự nhiên", "play": ["Bb7(13)"]}, "b": {"label": "A7(b13): màu biến đổi", "play": ["A7(b13)"]}}}, {"text": "Cũng câu đó, nhìn nốt màu và đích là biết từng hợp âm làm gì. Bb7 nếu là \"bạn của mẹ\" của E7 thì phải về Am, nhưng ở đây đích là Dm, nên Bb7 chỉ là hợp âm mượn (modal) từ C thứ. A7 đi về Dm, mà Dm là hợp âm thứ, nên A7 dùng màu biến đổi b13. Nốt màu cũng cho thấy điều đó: Bb7 ở đây mang 13 tự nhiên (G) chứ không mang #11 (E), màu đặc trưng của \"bạn của mẹ\" (P3 bài 22).", "tip": "b13 của A7 là F (nốt 6 tính từ A là F#, hạ nửa cung ra F), cũng chính là bậc 3 của Dm.", "play": ["C", "Bb7(13)", "Dm7", "A7(b13)", "Dm7"]}, {"text": "Tiến hành I–VI–II–V (1-6-2-5 진행): F/G – F/G – C – Am7 – Dm7 – G7. Ô nhịp thứ hai chia 4 hợp âm C – Am7 – Dm7 – G7, chỉ ghép các hợp âm trong giọng mà vẫn rất dễ nghe. Am thay thế cho C, rồi nốt gốc rơi theo vòng quãng 5: A xuống D, D xuống G. Đây là nền để các bài sau phát triển tiếp.", "tip": "Từ A đếm xuống 5 tên nốt (A, G, F, E, D) ra D; từ D đếm xuống 5 tên nốt ra G.", "play": ["F/G", "F/G", "C", "Am7", "Dm7", "G7"]}, {"text": "Tension & subV (텐션과 썹파이브): F/G – G7(13) – G7(b13) – C. Nốt trên cùng ở chữ \"danh\" là nốt 13 của G7 (E). Thường chỉ chọn một: E (13 tự nhiên) hoặc Eb (b13); thầy dùng cả hai, đánh E trước rồi hạ xuống Eb. Đổi một nốt màu ngay trên cùng một hợp âm, sau một nhịp, gọi là đổi màu lệch thời điểm (time-shifted tension): nốt trên cùng đi từng nửa cung E rồi Eb, nghe rất đẹp.", "tip": "Giữ G F B, chỉ hạ ngón trên cùng từ E xuống Eb.", "keys": ["G2", "F3", "|", "B3", "E4"], "compare": {"a": {"label": "G7(13) → G7(b13) → C", "play": ["F/G", ["G2", "F3", "B3", "E4"], ["G2", "F3", "B3", "Eb4"], "C"]}, "b": {"label": "Chỉ G7 → C", "play": ["F/G", "G7", "C"]}}}, {"text": "Câu đầy đủ đi tiếp C – Am7 – Dm7 – Db7(#11). Db7(#11) ở cuối là \"bạn của mẹ\" của G7 (chung tritone B–F), đứng ở chỗ G7 để dẫn về C lần sau. Nghe cả câu.", "play": ["F/G", ["G2", "F3", "B3", "E4"], ["G2", "F3", "B3", "Eb4"], "C", "Am7", "Dm7", "Db7(#11)"]}], "remember": ["Nốt chính của hợp âm tính đến bậc 7; 9, 11, 13 là nốt màu (tự nhiên nếu nằm trong âm giai, biến đổi nếu bị hạ/nâng).", "Nhìn đích: Bb7 về Dm là hợp âm mượn; A7 về Dm (thứ) dùng b13 (F, bậc 3 của Dm).", "Đổi màu lệch thời điểm: G7(13) rồi G7(b13), nốt 13 (E) hạ xuống Eb."], "items": [{"chord": "Bb7(13)", "rel": "modal", "prog": ["C", "Bb7(13)", "Dm7", "A7(b13)"]}, {"chord": "G7(13)", "to": "G7(b13)", "rel": "line", "prog": ["F/G", "G7(13)", "G7(b13)", "C"], "why": "G7(13) và G7(b13) giữ chung G, B, F; chỉ nốt 13 (E) hạ nửa cung xuống b13 (Eb), tức đổi màu lệch thời điểm."}, {"chord": "G7(b13)", "to": "C", "prog": ["F/G", "G7(13)", "G7(b13)", "C"]}], "quiz": [{"q": "Nốt chính của hợp âm (chord tone) của G7 gồm những nốt nào?", "choices": ["G, B, D, F", "G, A, B, D", "B, F, A, E", "G, D, A, E"], "answer": "G, B, D, F", "why": "Nốt chính tính đến bậc 7: nốt gốc G, bậc 3 B, bậc 5 D, bậc 7 F; A, E là nốt màu 9, 13."}, {"q": "G7(13) → G7(b13) trước C là làm gì?", "choices": ["Đánh 13 tự nhiên (E) trước rồi hạ xuống b13 (Eb)", "Đổi nốt bass G sang Gb", "Bỏ nốt 7 của G7", "Đổi G7 thành \"bạn của mẹ\""], "answer": "Đánh 13 tự nhiên (E) trước rồi hạ xuống b13 (Eb)", "why": "Đây là đổi màu lệch thời điểm: dùng cả 13 và b13 nối tiếp, nốt trên cùng đi E xuống Eb."}]},

  {"id": "p4-12", "part": 4, "src": "Phildave 4 · Bài 12", "title": "Kết Amen trên 9sus4, G7+ và chia hợp âm tối đa", "teach": [{"text": "Amen cadence trên 9sus4 (나인써스포에 아멘종지적용): ở chữ \"Con nâng cao danh Ngài\", thầy đi F/G – Fm/G – C – F/G. F/G trông như hợp âm F nhưng thật ra là hợp âm G: F là bậc 7, A là nốt 9, C là bậc 4 (sus4) của G. Lẽ ra sus4 phải giải quyết, nhưng thầy đổi F thành Fm trên bass G theo kiểu kết Amen rồi mới về C.", "tip": "Nhìn từ G: F là G lùi một cung (nốt 7), A là G lên một cung (nốt 9), C là nốt 4.", "play": ["F/G", "Fm/G", "C", "F/G"]}, {"text": "Augmented & flat 13 (오그먼트와 플렛썰틴): F/G – G7+ – C – Fm/G. Như bài 2, G7+ nâng bậc 5 lên nửa cung (D thành D#); còn hạ nốt 13 (E) xuống nửa cung thì gọi là b13 (Eb). Hai tên khác nhau nhưng cùng một phím, cùng một màu âm, và nốt này muốn đi tiếp lên E của hợp âm C.", "tip": "G7+: tay trái G F, tay phải B Eb; sang C thì Eb nhích lên nửa cung thành E, bậc 3 của C.", "compare": {"a": {"label": "F/G – G7 – C", "play": ["F/G", "G7", "C"]}, "b": {"label": "F/G – G7+ – C – Fm/G", "play": ["F/G", "G7+", "C", "Fm/G"]}}}, {"text": "Chia hợp âm tối đa (코드는 최대한 많이 나눈다): C – A7(13) – A7(b13) – Dm7. A7 đi về Dm (hợp âm thứ) nên đúng ra dùng b13 (F). Ở chữ \"vương quốc Chúa\" thầy cố ý đánh 13 tự nhiên (F#) trước, nghe hơi lạ như một chút khiêu khích, rồi mới hạ xuống b13: cũng là đổi màu lệch thời điểm (bài 11).", "tip": "Giữ A G C#, chỉ hạ ngón trên cùng từ F# xuống F; F lại là bậc 3 của Dm.", "keys": ["A2", "G3", "|", "C#4", "F#4"], "play": ["C", ["A2", "G3", "|", "C#4", "F#4"], ["A2", "G3", "|", "C#4", "F4"], "Dm7"]}, {"text": "Sau đó thầy chia tiếp: Dm7 – Dm(M7) – Dm7. Nhịp 4/4 có 4 phách, nên một ô nhịp chia được tới 4 hợp âm; Dm7 và Dm(M7) qua lại (C, C#, C) như nhạc cổ điển. Thầy dặn chia hợp âm càng nhiều càng tốt khi chỗ đó đứng lâu.", "play": ["Dm7", "Dm(M7)", "Dm7"]}, {"text": "Báo trước tension (뒤에 나올 텐션의 예비음): C – Gm/Bb – A7(b9) – Dm7 – Dm(M7) – Dm7, bass đi xuống C, Bb, A. Nốt Bb đến trước chính là
