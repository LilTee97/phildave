mẹ\", thay E7, nên bass đi C, B, Bb, A từng nửa cung; thầy còn thêm dòng blues (blues line). Trước \"bạn của mẹ\" dùng m7(b5) hay m7 đều được: \"Có quy tắc, nhưng trong phạm vi quy tắc đó phải thật tự do.\"", "tip": "Bb7(#11): tay phải hợp âm C, là hợp âm ba nốt cao hơn nốt gốc một cung (Bb lên một cung là C).", "compare": {"a": {"label": "C – Bm7(b5) – Bb7(#11) – Am", "play": ["C", "Bm7(b5)", "Bb7(#11)", "Am"]}, "b": {"label": "C – Bm7 – Bb7(#11) – Am", "play": ["C", "Bm7", "Bb7(#11)", "Am"]}}}], "remember": ["Về giọng thứ: II là m7(b5), V mang màu biến đổi (b9, #9 với b13, hoặc b13); khung 1–3–7 của V giữ nguyên.", "E7(13) là biến thể; lần hát lại đổi Bm7(b5) thành Bm7 cho có biến hoá.", "Bb7(#11) thay E7: bass C, B, Bb, A; có quy tắc, nhưng trong quy tắc phải thật tự do."], "items": [{"chord": "Bm7(b5)", "to": "E7(b9)", "prog": ["C", "Bm7(b5)", "E7(b9)", "Am"]}, {"chord": "E7(13)", "to": "Am", "prog": ["C", "Bm7(b5)", "E7(13)", "Am"]}, {"chord": "Bb7(#11)", "to": "Am", "prog": ["C", "Bm7", "Bb7(#11)", "Am"]}], "quiz": [{"q": "II–V vào Am chuẩn nhất là gì?", "choices": ["Bm7(b5) – E7 mang màu biến đổi", "Bm7 – E7(13)", "Dm7 – G7(13)", "Bbmaj7 – E7"], "answer": "Bm7(b5) – E7 mang màu biến đổi", "why": "Về giọng thứ thì II là m7(b5) và V mang màu biến đổi (b9, #9, b13)."}, {"q": "Vì sao lần hát lại thầy đổi Bm7(b5) thành Bm7?", "choices": ["Để câu hát lại có biến hoá", "Vì Bm7(b5) sai", "Vì Bm7 là \"bạn của mẹ\"", "Vì bài đổi sang giọng trưởng"], "answer": "Để câu hát lại có biến hoá", "why": "Lần đầu dùng Bm7(b5) là chuẩn; lần lặp ai cũng chờ câu cũ, nên đổi một nốt là thấy mới."}, {"q": "E7(13) trước Am được xem là gì?", "choices": ["Một biến thể, vì lẽ ra dùng màu biến đổi", "Cách chuẩn nhất vào Am", "Hợp âm mượn từ C thứ", "Hợp âm giảm đi qua"], "answer": "Một biến thể, vì lẽ ra dùng màu biến đổi", "why": "Về hợp âm thứ thì chuẩn là màu biến đổi; 13 tự nhiên vẫn đẹp nhưng là biến thể."}]},

  {"id": "p4-25", "part": 4, "src": "Phildave 4 · Bài 25", "title": "Điệp khúc: Am/G, Am(M7), F#m7(b5) và cliché A–G#–G–F#", "teach": [{"text": "Tiến hành đi qua ở giọng thứ (마이너의 경과적진행): điệp khúc bắt đầu ở chữ \"주님만이\" (Chúa ơi…), và thầy nói dòng bass đi về F, nên hợp âm đích là F. Thầy đi Am – Am/G: tay phải giữ nguyên Am, chỉ tay trái rơi xuống, tai vẫn nghe màu Am.", "tip": "Am/G: tay trái G (A lùi một cung), tay phải vẫn là hợp âm Am (A C E).", "play": ["Am", "Am/G"]}, {"text": "Hợp âm thứ – 7 trưởng (마이너 메이저 쇬븐): Am – Am(M7). Ở chỗ có ghi hợp âm Am, thầy chỉ bấm thêm nốt 7 trưởng (G#) là ra Am(M7), màu thứ nghe căng và đẹp hơn.", "tip": "Nốt 7 trưởng là nốt gốc lùi nửa cung: A lùi nửa cung là G#.", "play": ["Am", "Am(M7)"]}, {"text": "Hợp âm thay thế hợp âm I (1도화음의 대리코드들): Am – F#m7(b5). F#m7(b5) = F# A C E: tay phải vẫn là hợp âm Am, chỉ nốt bass đổi thành F#, nên gọi là Am/F# cũng được. Tên trông khó nhưng thực chất đơn giản: Am thay được cho C (hợp âm I), nên F#m7(b5) cũng thay được.", "tip": "F#m7(b5): tay trái F#, tay phải hợp âm Am như cũ.", "play": ["Am", ["F#2", "C4", "E4", "A4"]]}, {"text": "Cliché giọng thứ (마이너의 클리셰진행): Am9 – Am(M7) – Am7 – Am6 (hợp âm đầu, nói chính xác, là Am(add2): xem màn sau). Nốt trên cùng rơi từng nửa cung: A, G#, G, F#, giống cliché Dm ở bài 2.", "tip": "Tay trái giữ A, tay phải giữ C E (hợp âm đầu có thêm B chen giữa); chỉ ngón trên cùng đi xuống từng phím: A, G#, G, F#.", "play": [["A2", "B3", "C4", "E4", "A4"], ["A2", "C4", "E4", "G#4"], ["A2", "C4", "E4", "G4"], ["A2", "C4", "E4", "F#4"]]}, {"text": "Thầy nói chữ Am9 ở đầu cliché, nói chính xác, là add2: add2 là nốt chen vào giữa, 9 là nốt đặt trên bậc 7. Không có bậc 7 thì nốt B chen giữa thế bấm gọi là add2; có bậc 7 (G) rồi B đặt lên trên mới thật sự là 9.", "tip": "Nốt 2 và nốt 9 đều là B (A lên một cung); chỉ khác ở chỗ có bậc 7 hay không.", "compare": {"a": {"label": "Am(add2): B chen vào giữa", "play": [["A2", "B3", "C4", "E4", "A4"]]}, "b": {"label": "Am9: B đặt trên bậc 7 (G)", "play": [["A2", "C4", "E4", "G4", "B4"]]}}}], "remember": ["Am – Am/G: tay phải giữ Am, chỉ bass rơi xuống; Am(M7) thêm G# (A lùi nửa cung).", "F#m7(b5) là Am trên bass F#, thay được hợp âm I như Am.", "Cliché Am: nốt trên cùng A, G#, G, F#; add2 là nốt chen vào giữa, 9 là nốt đặt trên bậc 7."], "items": [{"chord": "Am(M7)", "to": "Am7", "rel": "line", "prog": ["Am9", "Am(M7)", "Am7", "Am6"]}, {"chord": "F#m7(b5)", "to": "Am", "rel": "sub", "prog": ["Am", "F#m7(b5)"]}], "quiz": [{"q": "F#m7(b5) bấm thế nào cho dễ?", "choices": ["Tay trái F#, tay phải hợp âm Am", "Tay trái F#, tay phải hợp âm F#", "Tay trái A, tay phải hợp âm F", "Tay trái F, tay phải hợp âm Am"], "answer": "Tay trái F#, tay phải hợp âm Am", "why": "F#m7(b5) = F# A C E: ba nốt A C E chính là hợp âm Am, chỉ thêm F# ở bass."}, {"q": "add2 khác 9 ở chỗ nào?", "choices": ["add2 không có bậc 7, nốt chen vào giữa; 9 đặt trên bậc 7", "add2 cao hơn 9 một quãng 8", "Không khác gì", "9 không có bậc 7"], "answer": "add2 không có bậc 7, nốt chen vào giữa; 9 đặt trên bậc 7", "why": "Thầy nói: có bậc 7 thì nốt đó mới thật sự là 9; không có bậc 7 thì gọi là add2."}, {"q": "Trong cliché Am9 – Am(M7) – Am7 – Am6, nốt nào rơi dần?", "choices": ["A, G#, G, F#", "C, B, Bb, A", "E, D#, D, C#", "A, B, C, D"], "answer": "A, G#, G, F#", "why": "Nốt A trên cùng rơi từng nửa cung: A (Am), G# (7 trưởng), G (7), F# (6)."}]},

  {"id": "p4-26", "part": 4, "src": "Phildave 4 · Bài 26", "title": "Đảo 1 của C, A7(b9), C#°7 và sus4 về b9 để vào Dm", "teach": [{"text": "Đảo hợp âm trong giọng (다이어토닉코드의 전위): phần 4 luyện đảo hợp âm và cách đi về hợp âm thứ (Dm, Am), nên \"mẹ\" mang màu biến đổi. Ở chữ \"나의 힘 나\" (Nguồn sức của con), câu đi về Dm, thầy đi F – C/E. Trên đảo 1 của C, thêm add2 nghe ổn định, thêm maj7 nghe phức tạp hơn; đó là hai sound của đảo 1 (1전위의 두가지 사운드).", "tip": "C/E: tay trái E, tay phải C D G (D là C lên một cung); muốn màu maj7 thì đổi D thành B (C lùi nửa cung).", "compare": {"a": {"label": "F – C/E có add2 (D)", "play": ["F", ["E2", "C4", "D4", "G4"]]}, "b": {"label": "F – C/E có maj7 (B)", "play": ["F", ["E2", "B3", "C4", "G4"]]}}}, {"text": "Đảo 1 có tính trung lập (1전위 코드의 중립성): F – Dm7 – C/E – Am7. Có bốn hợp âm nên mỗi hợp âm một phách; giai điệu là nốt chấm dôi nhưng piano vẫn đi đều từng phách. Đảo 1 không vững như thế gốc, nên C/E làm hợp âm nối giữa Dm7 và Am7 rất tự nhiên; bass đi F, D, E, A.", "tip": "Đếm 1, 2, 3, 4: mỗi phách đổi một hợp âm, đừng chờ nốt giai điệu.", "play": ["F", "Dm7", "C/E", "Am7"]}, {"text": "Flat nine (플렛나인): ở chữ \"의 방패 나의\", thầy đi F – A7(b9) rồi về Dm. Hợp âm 7 đi về hợp âm thứ thì dùng màu biến đổi, nên thầy gắn dấu giáng vào nốt màu: b9, và b9 đi cùng b13 nghe rất hay.", "tip": "b9 của A7 là A nhích lên nửa cung (Bb); trên đàn Bb nằm trên cùng tay phải.", "compare": {"a": {"label": "F – A7 – Dm", "play": ["F", "A7", "Dm"]}, "b": {"label": "F – A7(b9) – Dm", "play": ["F", "A7(b9)", "Dm"]}}}, {"text": "Hợp âm giảm thay cho \"mẹ\" của Dm (세도의 대리코드 디미니쉬): F – C#°7 – Dm. C#°7 là A7(b9) bỏ nốt gốc A, nên thay được A7; tay phải đánh các nốt giọng trong lên một quãng 8 là thành thế bấm hợp âm giảm đẹp. Bass C# cũng có thể là A/C#, nhưng A/C# (A đảo 1, nốt C# E A) khác C#°7 (C# E G Bb).", "tip": "C#°7: tay trái C#, tay phải hợp âm Edim (E G Bb).", "compare": {"a": {"label": "F – C#°7 – Dm", "play": ["F", "C#°7", "Dm"]}, "b": {"label": "F – A/C# – Dm", "play": ["F", ["C#2", "A3", "E4", "A4"], "Dm"]}}}, {"text": "Giải quyết sus4 và flat nine (써스포의 해결과 플렛나인): F – A(sus4) – A7(b9). Sus4 gọn chỉ làm nổi bậc 4 (D), còn 9sus4 (G/A) hiện cả màu hợp âm G. Khi sus4 giải quyết về A7 thì thêm b9 luôn.", "tip": "D (bậc 4) xuống C# (bậc 3), còn A trên cùng nhích lên nửa cung thành Bb (b9).", "compare": {"a": {"label": "9sus4: F – G/A – A7(b9)", "play": ["F", "G/A", "A7(b9)"]}, "b": {"label": "Sus4 gọn: F – A(sus4) – A7(b9)", "play": ["F", ["A2", "D4", "E4", "A4"], ["A2", "G3", "C#4", "E4", "Bb4"]]}}}], "remember": ["Đảo 1 C/E: add2 (D) nghe ổn định, maj7 (B) phức tạp hơn; F – Dm7 – C/E – Am7 thì mỗi hợp âm một phách.", "Về hợp âm thứ Dm thì A7 mang màu biến đổi: b9 (Bb), đẹp nhất là b9 với b13; C#°7 thay được A7.", "A(sus4) – A7(b9): D xuống C#, A lên Bb; A/C# khác C#°7."], "items": [{"chord": "A7(b9)", "to": "Dm", "prog": ["F", "A7(b9)", "Dm"]}, {"chord": "C#°7", "to": "Dm", "prog": ["F", "C#°7", "Dm"]}, {"chord": "A(sus4)", "to": "A7(b9)", "rel": "line", "prog": ["F", "A(sus4)", "A7(b9)"]}], "quiz": [{"q": "Trên C/E, thêm add2 và thêm maj7 khác nhau thế nào?", "choices": ["add2 (D) nghe ổn định, maj7 (B) nghe phức tạp hơn", "add2 (D) nghe phức tạp, maj7 (B) nghe ổn định", "Cả hai biến C/E thành hợp âm mượn", "maj7 thêm nốt Bb (C lùi một cung)"], "answer": "add2 (D) nghe ổn định, maj7 (B) nghe phức tạp hơn", "why": "Thầy gọi đó là hai sound của đảo 1: thêm D (C lên một cung) nghe ổn định; thêm B (C lùi nửa cung, nốt 7 của Cmaj7) nghe phức tạp hơn."}, {"q": "A/C# và C#°7 khác nhau thế nào?", "choices": ["A/C# là C# E A (A đảo 1), còn C#°7 là C# E G Bb", "Không khác gì, chỉ khác tên", "A/C# là hợp âm giảm, C#°7 là hợp âm trưởng", "C#°7 là hợp âm A có bass C#"], "answer": "A/C# là C# E A (A đảo 1), còn C#°7 là C# E G Bb", "why": "Cùng bass C#, nhưng A/C# là hợp âm A trưởng; C#°7 là hợp âm giảm, tức A7(b9) bỏ nốt A."}, {"q": "Sus4 gọn khác 9sus4 ở chỗ nào?", "choices": ["Sus4 gọn làm nổi bậc 4; 9sus4 hiện cả màu hợp âm ba nốt (G/A có hợp âm G)", "Sus4 gọn có thêm nốt 9", "9sus4 không cần giải quyết", "Không khác gì"], "answer": "Sus4 gọn làm nổi bậc 4; 9sus4 hiện cả màu hợp âm ba nốt (G/A có hợp âm G)", "why": "A(sus4) = A D E chỉ nhấn bậc 4 (D); G/A có cả hợp âm G trên bass A nên màu dày hơn."}]},

  {"id": "p4-27", "part": 4, "src": "Phildave 4 · Bài 27", "title": "A7/E, II–V về hợp âm thay thế, Eb7(#11) và chia Dm", "teach": [{"text": "Hợp âm 7 đổi nốt bass (도미넌트쇬븐의 3전위; sách ghi đảo 3, nhưng bass E là bậc 5 của A7 nên thật ra là đảo 2): tiếp câu \"나의 힘\" (Nguồn sức của con), câu vẫn đi về Dm, thầy đi F – A7/E – Dm. A7 có lực kéo về Dm nhờ tritone, còn bass F, E, D đi xuống liền bậc là một lực nữa của tiến hành đi qua; hai lực cộng lại. Thầy dặn bấm đủ bốn nốt E, G, A, C#, trải rộng và không lặp nốt nào thì nghe đẹp hơn.", "tip": "A7/E: tay trái E G (bậc 5 và bậc 7 của A7), tay phải A C#; bốn nốt khác nhau, không nốt nào lặp lại.", "compare": {"a": {"label": "F – A7 – Dm", "play": ["F", "A7", "Dm"]}, "b": {"label": "F – A7/E – Dm", "play": ["F", ["E2", "G3", "A3", "C#4"], "Dm"]}}}, {"text": "Giải quyết bằng hợp âm thay thế (대리코드로도 해결한다): F – Gm7 – C7. Gm7 – C7 là II–V của F nên tai chờ về F, nhưng thầy về Dm, \"dự đoán bị đổi\". Không lạ, vì Dm là hợp âm thay thế của F: hai hợp âm chung nhiều nốt.", "tip": "Dm7 = D F A C chứa trọn hợp âm F (F A C), nên Dm thay được F.", "compare": {"a": {"label": "Gm7 – C7 – F (tai chờ)", "play": ["F", "Gm7", "C7", "F"]}, "b": {"label": "Gm7 – C7 – Dm (đổi dự đoán)", "play": ["F", "Gm7", "C7", "Dm"]}}}, {"text": "Nhìn \"bạn của mẹ\" thấy dạng gốc (썹파이브를 보면 원형을): F – Eb7(#11) – Dm. Eb7 chung tritone với A7, nên là \"bạn của mẹ\" của Dm; hai hợp âm chỉ khác nốt màu. A7 dùng màu biến đổi, còn Eb7 dùng #11.", "tip": "Eb7(#11): tay phải hợp âm F, là hợp âm ba nốt cao hơn nốt gốc một cung (Eb lên một cung là F). Tritone chung: A7 có C# và G, Eb7 có G và Db (cùng phím C#).", "compare": {"a": {"label": "F – A7(b9) – Dm", "play": ["F", "A7(b9)", "Dm"]}, "b": {"label": "F – Eb7(#11) – Dm", "play": ["F", "Eb7(#11)", "Dm"]}}}, {"text": "Cách chia hợp âm (코드를 나누는 방법): ở chữ \"참소망\" (Hy vọng thật), thầy đi Dm – Dm(M7) – E(sus4) – E7. Hợp âm thứ đứng yên lâu nghe nhạt, nên chia nhỏ nó bằng hợp âm thứ – 7 trưởng. E(sus4) rồi E7 dẫn về Am, vì E7 là \"mẹ\" của Am.", "tip": "Dm(M7) thêm C# (D lùi nửa cung); E(sus4) → E7: A (bậc 4) xuống G# (bậc 3).", "play": ["Dm", "Dm(M7)", "E(sus4)", "E7"]}, {"text": "Sus4 căng thẳng (긴장감있는 써스포): Dm7 – E(sus4)/B – E7 – E/G#. Treo E(sus4) trên bass B cho căng rồi mới giải quyết về E7. \"Chị\" của E7 ở đây là Bm7(b5), và trên E7 thầy dùng #9 với b13, vì E7 về hợp âm thứ Am.", "tip": "E7(b13 #9): tay trái E G# D, tay phải hợp âm C (C E G); G là #9, C là b13.", "compare": {"a": {"label": "Dm7 – E(sus4)/B – E7 – E/G#", "play": ["Dm7", "E(sus4)/B", "E7", "E/G#"]}, "b": {"label": "Bm7(b5) – E7(b13 #9) – Am", "play": ["Bm7(b5)", "E7(b13 #9)", "Am"]}}}], "remember": ["F – A7/E – Dm: lực của A7 cộng với bass đi xuống F, E, D; bấm đủ A, C#, E, G.", "Gm7 – C7 về Dm thay F cũng được (Dm7 chứa F A C); Eb7(#11) chung tritone với A7, tay phải hợp âm F.", "Hợp âm thứ đứng lâu thì chia bằng Dm(M7); \"chị\" của E7 là Bm7(b5), E7 dùng #9 với b13."], "items": [{"chord": "A7/E", "to": "Dm", "prog": ["F", "A7/E", "Dm"]}, {"chord": "Eb7(#11)", "to": "Dm", "prog": ["F", "Eb7(#11)", "Dm"]}, {"chord": "E(sus4)", "to": "E7", "rel": "line", "prog": ["Dm", "Dm(M7)", "E(sus4)", "E7"]}], "quiz": [{"q": "Vì sao F – A7/E – Dm nghe có lực?", "choices": ["Lực kéo của A7 về Dm cộng với bass đi xuống F, E, D", "Vì A7/E là hợp âm mượn", "Vì bass đứng yên ở E", "Vì A7/E là hợp âm giảm"], "answer": "Lực kéo của A7 về Dm cộng với bass đi xuống F, E, D", "why": "Tritone của A7 kéo về Dm, còn bass liền bậc là lực của tiến hành đi qua; hai lực cùng lúc."}, {"q": "Gm7 – C7 thường về F. Vì sao về Dm cũng không lạ?", "choices": ["Dm là hợp âm thay thế của F: Dm7 chứa F A C", "Vì C7 là \"mẹ\" của Dm", "Vì Dm là hợp âm mượn", "Vì Gm7 là \"chị\" của Dm"], "answer": "Dm là hợp âm thay thế của F: Dm7 chứa F A C", "why": "F và Dm7 chung ba nốt F, A, C, nên về Dm chỉ là \"đổi dự đoán\" chứ không lạ tai."}, {"q": "Vì sao Eb7(#11) thay được A7 trước Dm?", "choices": ["Hai hợp âm chung tritone (G và C#, cùng phím Db)", "Vì Eb7 là hợp âm trong giọng", "Vì Eb là nốt 5 của A", "Vì Eb7 là \"chị\" của Dm"], "answer": "Hai hợp âm chung tritone (G và C#, cùng phím Db)", "why": "Eb7 là \"bạn của mẹ\": chung bậc 3 và bậc 7 với A7, nên cũng kéo về Dm; chỉ khác nốt màu (#11)."}]},

  {"id": "p4-28", "part": 4, "src": "Phildave 4 · Bài 28", "title": "Bb7(#11) về Am, bass chromatic đi xuống và bass Ab giữ", "teach": [{"text": "\"Bạn của mẹ\" (썹파이브): Dm7 – Dm/C – Bm7 – Bb7(#11) rồi về Am, hợp âm đích là Am (trên bản nhạc câu đi về C, mà Am là hợp âm thay thế của C). Bm7 lẽ ra là Bm7(b5), vì nó là bậc II của Am, nhưng ở đây thầy dùng Bm7. Bb7 là \"bạn của mẹ\" thay E7 (chung tritone), nên mang 9, #11, 13: tay phải là hợp âm ba nốt cao hơn nốt gốc một cung.", "tip": "Bb7(#11): tay trái Bb D Ab, tay phải hợp âm C, là hợp âm ba nốt cao hơn nốt gốc một cung (Bb lên một cung là C); C, E, G là 9, #11, 13.", "play": ["Dm7", "Dm/C", "Bm7", "Bb7(#11)", "Am"]}, {"text": "Chromatic đi xuống (크로매틱 하행 진행): ở chữ \"나의 몸 정성 다 바쳐서 주님\" (Cả thân con, hết lòng dâng lên…), thầy đi C – Gm/Bb – F/A – Fm/Ab. Bass đã rơi từng nửa cung (Bb, A) thì tai muốn nó rơi tiếp từng nửa cung; bass đi theo âm giai thì tai muốn đi tiếp theo âm giai. Chọn một nhóm cho nhất quán: ở đây là A xuống Ab.", "tip": "Bass C, Bb, A, Ab: từ Bb trở đi mỗi bước là một phím liền kề. Fm/Ab: tay trái Ab, tay phải hợp âm Fm.", "play": ["C", "Gm/Bb", "F/A", "Fm/Ab"]}, {"text": "Chỉ nhìn bass là biết hợp âm (베이스만 보고 코드를 안다): C – G/B – C/Bb – F/A – Fm/Ab. Bass rơi từng nửa cung C, B, Bb, A, Ab; trên mỗi nốt bass, thầy đặt một hợp âm có chứa nốt đó. Fm/Ab cuối câu là Fm mượn từ C thứ.", "tip": "C/Bb: tay trái Bb, tay phải hợp âm C; Bb là nốt 7 của C7 (C lùi một cung).", "play": ["C", "G/B", "C/Bb", "F/A", "Fm/Ab"]}, {"text": "Cuối đoạn thầy dùng hợp âm mượn: Bb, Abmaj7, Bb/Ab, trên nốt bass Ab giữ nguyên (pedal point). Chỉ cần bấm đúng nốt chính của hợp âm (chord tone) là đã nghe như đang chạy âm giai.", "tip": "Tay trái giữ Ab (thêm G cho Abmaj7); tay phải đổi qua lại hợp âm Bb và hợp âm Ab, mỗi ngón chỉ đi một phím: D–C, F–Eb, Bb–Ab.", "play": [["Ab2", "D4", "F4", "Bb4"], ["Ab2", "G3", "C4", "Eb4", "Ab4"], ["Ab2", "D4", "F4", "Bb4"], ["Ab2", "G3", "C4", "Eb4", "Ab4"]]}], "remember": ["Bb7(#11) thay E7 về Am: tay phải hợp âm C; chỗ Bm7 lẽ ra là Bm7(b5) (bậc II của Am).", "Bass đã rơi nửa cung thì rơi tiếp nửa cung (C – Gm/Bb – F/A – Fm/Ab); chọn một nhóm cho nhất quán.", "Nhìn bass là biết hợp âm; bass Ab giữ nguyên, tay phải đổi Bb và Ab: chỉ bấm nốt chính mà nghe như chạy âm giai."], "items": [{"chord": "Bb7(#11)", "to": "Am", "prog": ["Dm7", "Dm/C", "Bm7", "Bb7(#11)", "Am"]}, {"chord": "Gm/Bb", "to": "F/A", "prog": ["C", "Gm/Bb", "F/A", "Fm/Ab"]}, {"chord": "Fm/Ab", "rel": "modal", "prog": ["C", "G/B", "C/Bb", "F/A", "Fm/Ab"]}], "quiz": [{"q": "C – G/B – C/Bb – F/A – Fm/Ab: trên mỗi nốt bass, thầy chọn hợp âm thế nào?", "choices": ["Đặt một hợp âm có chứa chính nốt bass đó", "Luôn đặt \"mẹ\" của nốt bass", "Giữ nguyên hợp âm C, chỉ đổi bass", "Đặt hợp âm giảm trên mỗi nốt bass"], "answer": "Đặt một hợp âm có chứa chính nốt bass đó", "why": "Bass rơi từng nửa cung C, B, Bb, A, Ab; trên mỗi nốt thầy đặt hợp âm có nốt đó: G có B, C/Bb là C7 đảo 3, F có A, Fm có Ab."}, {"q": "Bass đã rơi Bb rồi A từng nửa cung. Nên đi tiếp thế nào?", "choices": ["Rơi tiếp nửa cung xuống Ab", "Nhảy theo âm giai C trưởng xuống G", "Đứng yên ở A", "Đi lên lại Bb"], "answer": "Rơi tiếp nửa cung xuống Ab", "why": "Bass đã đi chromatic thì tai chờ tiếp chromatic; chọn một nhóm cho nhất quán."}]},

  {"id": "p4-29", "part": 4, "src": "Phildave 4 · Bài 29", "title": "Hai tiến hành cần thuộc, subV liên tiếp và màu lai", "teach": [{"text": "Tiến hành cần thuộc lòng 1 (필수암기 코드진행): ở chữ \"나의 몸 정성 다 바쳐서 주님\" (Cả thân con, hết lòng dâng lên…), thầy đi C – G/B – E7(b13) – Am7(9) – Gm7 – Gb7(#11). Nền là các hợp âm trong giọng đi xuống; giữa câu có E7(b13) dẫn về Am, hợp âm đích của E7. Gm7 theo sau là \"chị\" của C7, và Gb7(#11) là \"bạn của mẹ\" thay C7, đi về F.", "tip": "b13 của E7 là C: bậc 5 (B) nhích lên nửa cung, cùng phím với C. Gb7(#11): tay phải hợp âm Ab, là hợp âm ba nốt cao hơn nốt gốc một cung (Gb lên một cung là Ab).", "play": ["C", "G/B", "E7(b13)", "Am7(9)", "Gm7", "Gb7(#11)", "F"]}, {"text": "Tiến hành cần thuộc lòng 2: C – E7(b13 #9) – E/G# – Am7(9) – Gm7 – C7. Trên E7 có thể chơi #9 với b13, b9 với b13, hoặc đổi màu lệch thời điểm. Chỗ E/G# cũng dùng được G#°7; vì đánh cả nốt trên cùng nên G#°7 cho một sound khá lạ.", "tip": "E7(b13 #9): tay trái E G# D, tay phải hợp âm C. G#°7 = E7(b9) bỏ nốt gốc E, bass G# đi lên A.", "compare": {"a": {"label": "… E7(b13 #9) – E/G# – Am7(9) …", "play": ["C", "E7(b13 #9)", "E/G#", "Am7(9)", "Gm7", "C7"]}, "b": {"label": "… E7(b13 #9) – G#°7 – Am7(9) …", "play": ["C", "E7(b13 #9)", "G#°7", "Am7(9)", "Gm7", "C7"]}}}, {"text": "\"Bạn của mẹ\" xuất hiện liên tiếp (썹파이브 연속 출현): C – Bb7(#11) – Am7(9) – Gm7 – Gb7(#11). Bb7 là \"bạn của mẹ\" của E7 (về Am), Gb7 là \"bạn của mẹ\" của C7 (về F). Cũng có thể chơi E7 trước rồi mới chuyển sang Bb7.", "tip": "Hai hợp âm bấm cùng một kiểu, tay phải là hợp âm ba nốt cao hơn nốt gốc một cung: Bb7 bấm hợp âm C, Gb7 bấm hợp âm Ab.", "compare": {"a": {"label": "C – Bb7(#11) – Am7(9) – Gm7 – Gb7(#11) – F", "play": ["C", "Bb7(#11)", "Am7(9)", "Gm7", "Gb7(#11)", "F"]}, "b": {"label": "E7 trước rồi Bb7: C – E7(b13 #9) – Bb7(#11) – Am7(9)", "play": ["C", "E7(b13 #9)", "Bb7(#11)", "Am7(9)"]}}}, {"text": "Màu lai (hybrid tension): ở II–V về F, thầy chơi Gm7 – C7(b9 13) – F. Thường nốt màu biến đổi đi thành cặp gốc: b9 với b13, hoặc #9 với b13. Trộn b9 (màu biến đổi) với 13 tự nhiên, như C7 có cả Db và A đã gặp ở bài 15, gọi là màu lai.", "tip": "C7(b9 13) = hợp âm C7 + hợp âm A: tay phải A C# E, và C# chính là Db, tức b9 (C nhích lên nửa cung).", "compare": {"a": {"label": "Cặp gốc: Gm7 – C7(b9 b13) – F", "play": ["Gm7", "C7(b9 b13)", "F"]}, "b": {"label": "Màu lai: Gm7 – C7(b9 13) – F", "play": ["Gm7", "C7(b9 13)", "F"]}}}], "remember": ["Thuộc lòng: C – G/B – E7(b13) – Am7(9) – Gm7 – Gb7(#11); nền đi xuống, E7 dẫn về Am, Gb7(#11) thay C7.", "E7 trước Am: #9 với b13, b9 với b13, hoặc đổi màu lệch thời điểm; Bb7(#11) thay được E7.", "Màu lai: b9 trộn với 13 tự nhiên, như C7(b9 13) = C7 + hợp âm A."], "items": [{"chord": "E7(b13)", "to": "Am7(9)", "prog": ["C", "G/B", "E7(b13)", "Am7(9)", "Gm7", "Gb7(#11)"]}, {"chord": "E/G#", "to": "Am7(9)", "prog": ["C", "E7(b13 #9)", "E/G#", "Am7(9)", "Gm7", "C7"]}, {"chord": "C7(b9 13)", "to": "F", "prog": ["Gm7", "C7(b9 13)", "F"]}], "quiz": [{"q": "Màu lai (hybrid tension) là gì?", "choices": ["Trộn màu biến đổi với màu tự nhiên, như b9 với 13", "Cặp b9 với b13", "Hợp âm mượn từ giọng thứ", "Hợp âm 7 không có nốt gốc"], "answer": "Trộn màu biến đổi với màu tự nhiên, như b9 với 13", "why": "Cặp gốc là b9 với b13 hoặc #9 với b13; b9 đi cùng 13 tự nhiên là màu lai, như C7(b9 13)."}, {"q": "Trong C7(b9 13), nốt C# ở tay phải là nốt gì của C7?", "choices": ["b9 (chính là Db)", "Bậc 3", "13 tự nhiên", "#11"], "answer": "b9 (chính là Db)", "why": "C nhích lên nửa cung là Db (cùng phím C#), tức b9; A là 13, E là bậc 3."}]},

  {"id": "p4-30", "part": 4, "src": "Phildave 4 · Bài 30", "title": "Ending bằng hợp âm mượn: Fm6, Abmaj7 và Fm/G", "teach": [{"text": "Modal trông như II–V–I (투파이브원 같은 모달): bài \"경배합니다\" (Con thờ phượng Ngài), ở chữ \"Thờ phượng…\", thầy đi Fm7 – Bb7(#11) – C, hợp âm đích là C. Fm7 – Bb7 nhìn như II–V về Eb, nhưng ở đây cả hai là hợp âm mượn từ C thứ. Chúng hợp \"hơi thở\" với nhau nên hay đi chung; sách chỉ ghi Bb7, thầy thêm #11.", "tip": "Bb7(#11): tay trái Bb D Ab, tay phải hợp âm C, là hợp âm ba nốt cao hơn nốt gốc một cung (Bb lên một cung là C).", "compare": {"a": {"label": "Nếu là II–V thật: Fm7 – Bb7 – Eb", "play": ["Fm7", "Bb7", "Eb"]}, "b": {"label": "Hợp âm mượn: Fm7 – Bb7(#11) – C", "play": ["Fm7", "Bb7(#11)", "C"]}}}, {"text": "Cẩn thận va chạm: Fm7 có Eb, mà nốt trên cùng (giai điệu) là E, hai nốt cách nhau nửa cung nên va. Lúc này chơi Fm6 sẽ hợp hơn: D thay cho Eb, hết va mà vẫn là hợp âm mượn, như bài 23.", "tip": "Nốt 6 của Fm6 là D (C lên một cung); nốt 7 của Fm7 là Eb (F lùi một cung).", "compare": {"a": {"label": "Fm7 với giai điệu E (va)", "play": [["F2", "Ab3", "C4", "Eb4", "E5"]]}, "b": {"label": "Fm6 với giai điệu E", "play": [["F2", "Ab3", "C4", "D4", "E5"]]}}}, {"text": "Hợp âm mượn cho ending (엔딩용 모달체인지 코드): F – F/G – Abmaj7 – Bb – C. Abmaj7 dùng nhiều, nhưng đừng bấm hai tay y hệt nhau cách một quãng 8 rồi chạy song song, nghe quê. Hãy đưa nốt trên cùng theo nốt 7 của Abmaj7 (G).", "tip": "Nốt 7 của Abmaj7 là G (Ab lùi nửa cung): đặt G lên trên cùng thay vì lặp lại Ab. Ở bước bấm thử, app gợi ý thế cơ bản (tay phải hợp âm Ab); bấm thế có G trên cùng như màn này cũng được chấm đúng.", "compare": {"a": {"label": "Hai tay y hệt cách quãng 8 (nghe quê)", "play": ["F", "F/G", ["Ab2", "C3", "Eb3", "Ab3", "C4", "Eb4"], ["Bb2", "D3", "F3", "Bb3", "D4", "F4"], "C"]}, "b": {"label": "Nốt trên cùng là G (nốt 7)", "play": ["F", "F/G", ["Ab2", "Eb3", "C4", "Eb4", "G4"], "Bb", "C"]}}}, {"text": "Áp hợp âm mượn lên 9sus4 (나인써스포에 모달적용): F – Fm/G – F/A – G/B – C. Thường đi F – F/G rồi mới Fm/G; ở đây thầy bỏ qua 9sus4 (F/G), đi thẳng vào Fm/G: bass G, phía trên là hợp âm Fm. Sau đó bass đi lên A, B, C về chủ.", "tip": "Fm/G: tay trái G, tay phải đủ hợp âm Fm (F Ab C); G/B: tay trái B, tay phải G A D.", "compare": {"a": {"label": "Thường: F – F/G – Fm/G", "play": ["F", "F/G", "Fm/G"]}, "b": {"label": "Bỏ 9sus4: F – Fm/G – F/A – G/B – C", "play": ["F", "Fm/G", "F/A", "G/B", "C"]}}}, {"text": "Hợp âm 7 đổi đích cũng được (목적지가 달라도 괜찮은 V7): F – F/G – Am7 – Bb7 – C. F/G (G7 9sus4) không về C mà sang Am7. G7 là hợp âm 7 bậc V của chính giọng C nên khá tự do; còn A7 trước Dm hay E7 trước Am thì gần như phải về đích.", "tip": "Bb7 trước C là hợp âm mượn từ C thứ (B hạ nửa cung thành Bb), như bài 9.", "compare": {"a": {"label": "F – F/G – C", "play": ["F", "F/G", "C"]}, "b": {"label": "F – F/G – Am7 – Bb7 – C", "play": ["F", "F/G", "Am7", "Bb7", "C"]}}}], "remember": ["Fm7 – Bb7(#11) – C trông như II–V về Eb nhưng là hai hợp âm mượn từ C thứ; nốt trên cùng là E thì dùng Fm6.", "Abmaj7 ở ending: đừng bấm hai tay y hệt cách quãng 8, đặt nốt 7 (G) lên trên cùng.", "Có thể bỏ F/G, vào thẳng Fm/G; G7 khá tự do, không bắt buộc về C (F/G – Am7 – Bb7 – C)."], "items": [{"chord": "Bb7(#11)", "rel": "modal", "prog": ["Fm7", "Bb7(#11)", "C"]}, {"chord": "Abmaj7", "rel": "modal", "prog": ["F", "F/G", "Abmaj7", "Bb", "C"]}, {"chord": "G/B", "to": "C", "prog": ["F", "Fm/G", "F/A", "G/B", "C"]}], "quiz": [{"q": "F – Fm/G – F/A – G/B – C khác cách thường đi ở chỗ nào?", "choices": ["Bỏ qua F/G (9sus4), vào thẳng Fm/G", "Bỏ hợp âm mượn Fm", "Bass đi xuống thay vì đi lên", "Không về C"], "answer": "Bỏ qua F/G (9sus4), vào thẳng Fm/G", "why": "Thường đi F – F/G rồi mới Fm/G; ở đây thầy bỏ 9sus4, đặt ngay Fm trên bass G, rồi bass đi lên A, B, C về chủ."}, {"q": "Chơi Abmaj7 ở ending thế nào cho khỏi quê?", "choices": ["Đặt nốt 7 (G) lên trên cùng, không bấm hai tay y hệt cách quãng 8", "Bấm hai tay y hệt cách một quãng 8", "Bỏ nốt Ab ở bass", "Thay Abmaj7 bằng Ab7"], "answer": "Đặt nốt 7 (G) lên trên cùng, không bấm hai tay y hệt cách quãng 8", "why": "Hai quãng 8 chạy song song y hệt nghe quê; cho nốt trên cùng theo nốt 7 (G) thì hai tay không còn giống nhau."}, {"q": "Vì sao F/G đi sang Am7 thay vì về C vẫn được?", "choices": ["G7 là hợp âm 7 bậc V của chính giọng C nên khá tự do", "Vì F/G là hợp âm mượn", "Vì Am7 là \"mẹ\" của C", "Vì F/G không có nốt G"], "answer": "G7 là hợp âm 7 bậc V của chính giọng C nên khá tự do", "why": "Thầy nói G7 trong giọng C khá tự do, không bắt buộc về bậc I; A7 hay E7 thì gần như phải về đích."}]},

  {"id": "p4-31", "part": 4, "src": "Phildave 4 · Bài 31", "title": "Modal ending: Bb7 thành 9sus4, b9 \"Ai Cập\" và Dbmaj7", "teach": [{"text": "Modal ending (모달 엔딩): bài \"경배합니다\" (Con thờ phượng Ngài), ở chữ \"Thờ phượng…\", thầy đi F – F/G – Fm7 – Bb7 – C, hợp âm đích là C. Fm7 và Bb7 là cặp hợp âm mượn từ C thứ như bài 30; vào thẳng Bb7 là gọn.", "tip": "Fm7 có Ab và Eb, Bb7 có Bb và Ab: đều là A, E, B hạ nửa cung, tức nốt của C thứ.", "play": ["F", "F/G", "Fm7", "Bb7", "C"]}, {"text": "Thay vì vào thẳng, Bb7 có thể làm thành 9sus4: Ab/Bb, và tay phải phải hiện rõ đủ hợp âm Ab thì 9sus4 mới có ý nghĩa. Khi giải quyết sus4, thầy hạ luôn nốt 9 thành b9: Bb7(b9) nghe hơi có màu \"Ai Cập\".", "tip": "Ab/Bb: tay trái Bb, tay phải đủ hợp âm Ab (Ab C Eb). Giải quyết: Eb (bậc 4) xuống D (bậc 3), C (nốt 9) xuống Cb (cùng phím B, là b9).", "compare": {"a": {"label": "Vào thẳng: Fm7 – Bb7 – C", "play": ["Fm7", "Bb7", "C"]}, "b": {"label": "9sus4 rồi b9: Fm7 – Ab/Bb – Bb7(b9) – C", "play": ["Fm7", ["Bb2", "C4", "Eb4", "Ab4"], ["Bb2", "B3", "D4", "Ab4"], "C"]}}}, {"text": "Top note và hợp âm (탑노트와 코드): F – F/G – Dbmaj7 – Fm7 – Dbmaj7 – Gb7(#11) – C. Dbmaj7 là hợp âm mượn, và nốt trên cùng của nó là C nên vừa nhiều màu vừa đẹp. Gb7(#11) – C ở cuối không theo luật đã học (\"bạn của mẹ\" của C là Db7, không phải Gb7): chỉ nghe nó như một màu kết, không làm bài tập.", "tip": "Nốt 7 của Dbmaj7 là C (Db lùi nửa cung): đặt C lên trên cùng; ở bước bấm thử app để C ở tay trái, bấm C trên cùng cũng được chấm đúng. Gb7(#11): tay phải hợp âm Ab.", "play": ["F", "F/G", ["Db2", "Ab3", "F4", "C5"], "Fm7", ["Db2", "Ab3", "F4", "C5"], "Gb7(#11)", "C"]}], "remember": ["Modal ending: F – F/G – Fm7 – Bb7 – C; Fm7 và Bb7 là cặp mượn từ C thứ.", "Bb7 làm 9sus4 được: Ab/Bb (đủ hợp âm Ab); giải quyết thì hạ 9 thành b9, Bb7(b9) có màu \"Ai Cập\".", "Dbmaj7 đặt nốt 7 (C) trên cùng; Gb7(#11) – C ở cuối là màu kết ngoài luật, chỉ nghe."], "items": [{"chord": "Bb7", "rel": "modal", "prog": ["F", "F/G", "Fm7", "Bb7", "C"]}, {"chord": "Dbmaj7", "rel": "modal", "prog": ["F", "F/G", "Dbmaj7", "Fm7"]}], "quiz": [{"q": "Muốn Bb7 thành 9sus4, thầy bấm thế nào?", "choices": ["Tay trái Bb, tay phải đủ hợp âm Ab (Ab/Bb)", "Tay trái Bb, tay phải hợp âm Bb", "Tay trái Ab, tay phải hợp âm Bb", "Tay trái Bb, tay phải hợp âm D"], "answer": "Tay trái Bb, tay phải đủ hợp âm Ab (Ab/Bb)", "why": "Ab/Bb = Bb + Ab C Eb: nốt 7, 9 và 11 của Bb7; phải hiện đủ hợp âm Ab thì 9sus4 mới có ý nghĩa."}, {"q": "Vì sao Dbmaj7 ở đây nghe vừa nhiều màu vừa đẹp?", "choices": ["Nốt trên cùng là C, chính là nốt 7 của Dbmaj7", "Vì Dbmaj7 là hợp âm trong giọng C", "Vì Dbmaj7 là \"mẹ\" của C", "Vì bass Db đứng yên"], "answer": "Nốt trên cùng là C, chính là nốt 7 của Dbmaj7", "why": "Thầy nói top note của Dbmaj7 là C nên vừa rất màu sắc vừa rất đẹp."}, {"q": "Nốt màu nào trên Bb7 cho màu \"Ai Cập\"?", "choices": ["b9 (Cb, cùng phím B)", "#11 (E)", "13 (G)", "9 (C)"], "answer": "b9 (Cb, cùng phím B)", "why": "Bb7(b9): nốt 9 (C) hạ nửa cung thành Cb, nghe hơi có màu \"Ai Cập\"."}]},

  {"id": "p4-32", "part": 4, "src": "Phildave 4 · Bài 32", "title": "Thực chiến: ôn cả khoá, mỗi lần lặp biến hoá thêm", "teach": [{"text": "Bài thực chiến: lần đầu chơi thật đơn giản, đúng bản nhạc; có chỗ cứ đi bằng hợp âm G cũng được. Mỗi lần lặp lại thì biến hoá thêm một chút: về C thì dùng G7 hoặc G9sus4 (F/G), hoặc chèn \"chị\" Dm7 trước G7 thành II–V–I.", "tip": "F/G (G9sus4): tay trái G, tay phải hợp âm F (G lùi một cung là F).", "compare": {"a": {"label": "Lần đầu: G – C", "play": ["G", "C"]}, "b": {"label": "Lặp lại: Dm7 – F/G – G7 – C", "play": ["Dm7", "F/G", "G7", "C"]}}}, {"text": "Đến đoạn vào điệp khúc (chorus) thì bắt đầu thêm màu: Fm mượn từ C thứ, rồi Bb7 cũng là hợp âm mượn (như cặp Fm7 – Bb7 ở bài 30–31). Màu mượn làm câu dẫn vào điệp khúc khác hẳn lần đầu.", "tip": "Fm là F có A hạ nửa cung (Ab); nốt 7 của Bb7 là Ab (Bb lùi một cung).", "play": ["F", "Fm", "Bb7", "C"]}, {"text": "Muốn Am buồn hơn, ở ô nhịp 9 thầy chơi Am6, hoặc dùng thế đảo. Phía sau là F, nên có thể cho bass rơi xuống kiểu tiến hành đi qua để về F.", "tip": "Am6 thêm F#, là E lên một cung; Am/G: tay phải giữ Am, tay trái G (A lùi một cung).", "compare": {"a": {"label": "Am → Am6 (buồn hơn)", "play": ["Am", "Am6"]}, "b": {"label": "Bass rơi về F: Am – Am/G – F", "play": ["Am", "Am/G", "F"]}}}, {"text": "C#°7 có gốc là A7: C#°7 chính là A7(b9) bỏ nốt A, nên đặt ở chỗ A7 trước Dm. Đây là cách thay đã học từ bài 26, giờ dùng trong cả bài.", "tip": "C#°7: tay trái C#, tay phải hợp âm Edim (E G Bb); E G Bb cũng nằm trong A7(b9).", "compare": {"a": {"label": "A7(b9) – Dm", "play": ["A7(b9)", "Dm"]}, "b": {"label": "C#°7 – Dm", "play": ["C#°7", "Dm"]}}}, {"text": "Tiến hành đi qua rơi từng nửa cung có thể đi xa hơn: ở ô nhịp 16, sau F/A lẽ ra bass về G, nhưng thầy bỏ qua G mà nghe vẫn không lạ. Kiểu bass rơi từng nửa cung như ở bài 28: C – G/B – C/Bb – F/A – Fm/Ab.", "tip": "Bass C, B, Bb, A, Ab: mỗi bước một phím liền kề, tính cả phím đen.", "play": ["C", "G/B", "C/Bb", "F/A", "Fm/Ab"]}, {"text": "Lần lặp thứ hai: G7(b13) rồi đến lượt Db7, \"bạn của mẹ\" của C; E7(#9 b13) (chính là E7(b13 #9) ở các bài trước) rồi Bb7, \"bạn của mẹ\" của E7, về Am; A7/E đi theo tiến hành đi qua về Dm. E7(#9 b13) cũng là màu thầy dùng cho dòng đàn dây (string line) kịch tính. Thầy dặn đừng chơi khô cứng: cùng một chỗ, chơi kiểu này hay kiểu kia đều được.", "tip": "Nốt gốc của \"bạn của mẹ\" là đích nhích lên nửa cung: C lên nửa cung là Db, A lên nửa cung là Bb.", "compare": {"a": {"label": "G7(b13) – Db7 – C", "play": ["G7(b13)", "Db7", "C"]}, "b": {"label": "E7(#9 b13) – Bb7 – Am", "play": ["E7(#9 b13)", "Bb7", "Am"]}}}], "remember": ["Lần đầu đơn giản, đúng bản nhạc; mỗi lần lặp thêm một chút: G9sus4, II–V–I, Fm, Bb7.", "Am buồn hơn: Am6 hoặc thế đảo; C#°7 có gốc là A7; bass rơi nửa cung có thể đi xa hơn.", "Lần lặp thứ hai: G7(b13) – Db7 – C, E7(#9 b13) – Bb7 – Am, A7/E – Dm; đừng chơi khô cứng."], "items": [{"chord": "Db7", "to": "C", "prog": ["G7(b13)", "Db7", "C"]}, {"chord": "Bb7", "to": "Am", "prog": ["E7(#9 b13)", "Bb7", "Am"]}, {"chord": "A7/E", "to": "Dm", "prog": ["A7/E", "Dm"]}], "quiz": [{"q": "Lần lặp lại, thầy dặn chơi cùng một chỗ thế nào?", "choices": ["Đừng chơi khô cứng: kiểu này hay kiểu kia đều được", "Luôn chơi đúng một cách như lần đầu", "Chỉ được dùng hợp âm trong giọng", "Bỏ hết hợp âm mượn"], "answer": "Đừng chơi khô cứng: kiểu này hay kiểu kia đều được", "why": "Lần lặp thứ hai thầy đổi sang G7(b13) – Db7 – C, E7(#9 b13) – Bb7 – Am; thầy dặn đừng chơi khô cứng, cùng một chỗ chơi kiểu nào cũng được."}, {"q": "Muốn Am ở ô nhịp 9 nghe buồn hơn, thầy làm gì?", "choices": ["Chơi Am6 hoặc dùng thế đảo", "Đổi thành A7", "Đổi thành C", "Bỏ hợp âm, chỉ để giai điệu"], "answer": "Chơi Am6 hoặc dùng thế đảo", "why": "Am6 (thêm F#) hoặc một thế đảo làm Am buồn hơn; bass có thể rơi xuống về F."}]}

<script>
// ---------- nhạc lý ----------
const NAMES = ['C','Db','D','Eb','E','F','F#','G','Ab','A','Bb','B'];
const PC = {C:0,'C#':1,Db:1,D:2,'D#':3,Eb:3,E:4,F:5,'F#':6,Gb:6,G:7,'G#':8,Ab:8,A:9,'A#':10,Bb:10,B:11};
const nm = pc => NAMES[((pc % 12) + 12) % 12];

// Thế bấm: lh/rh = khoảng cách (nửa cung) tính từ root. tri = tay phải là hợp âm ba nốt nào (offset, thứ?)
const TYPES = {
  maj:   { suf:'',            lh:[0],    rh:[0,4,7],   tri:[0,false] },
  min:   { suf:'m',           lh:[0],    rh:[0,3,7],   tri:[0,true] },
  dom7:  { suf:'7',           lh:[0,10], rh:[0,4,7],   tri:[0,false] },
  dom9:  { suf:'9',           lh:[0,10], rh:[4,7,14],  tri:null },
  domb9: { suf:'7(b9)',       lh:[0,10], rh:[4,7,13],  tri:null },
  lyd:   { suf:'13(#11)',     lh:[0,4,10], rh:[2,6,9], tri:[2,false] },   // tay trái 1–3–7 (có tritone), tay phải hợp âm trưởng trên nốt 9
  sus9:  { suf:'9sus4',       lh:[0],    rh:[10,14,17],tri:[10,false] },
  sus4b9:{ suf:'7sus4(b9)',   lh:[0],    rh:[10,13,17] },  // tay phải hợp âm thứ trên b7 (Dm/E)
  maj7:  { suf:'maj7',        lh:[0,11], rh:[0,4,7] },
  m7:    { suf:'m7',          lh:[0,10], rh:[0,3,7] },
  m7b5:  { suf:'m7b5',        lh:[0],    rh:[3,6,10] },   // như thầy: tay phải hợp âm thứ trên bậc b3 (F#m7(b5) = F# + Am)
  maj9:  { suf:'maj9',        lh:[0,4],  rh:[7,11,14] },   // tay phải hợp âm trên nốt 5
  maj13s11:{ suf:'maj13(#11)',lh:[0,11], rh:[2,6,9] },     // tay phải hợp âm trưởng trên nốt 9
  m9:    { suf:'m9',          lh:[0,3],  rh:[7,10,14] },   // tay phải hợp âm thứ trên nốt 5
  m11:   { suf:'m11',         lh:[0],    rh:[10,14,17] },  // tay phải hợp âm trưởng trên nốt b7
  dom13: { suf:'13',          lh:[0,10], rh:[2,4,9] },     // G13 = G F + A B E (9, 3, 13)
  dim7:  { suf:'dim7',        lh:[0],    rh:[3,6,9] },     // C#dim7 = nốt C# + hợp âm Edim
  alt1:  { suf:'7(#9 b13)',   lh:[0,4,10], rh:[8,12,15] }, // E7(#9 b13) = E G# D + hợp âm C (tay trái 1–3–7)
  alt2:  { suf:'7(b9 b13)',   lh:[0,10], rh:[8,13,16] },   // E7(b9 b13) = E7 + hợp âm Fm
  dom7b13:{ suf:'7(b13)',     lh:[0,10], rh:[4,8] },       // G7+ = G F + B Eb (#5 và b13 đồng âm khác tên)
  hyb:   { suf:'7(b9 13)',    lh:[0,10], rh:[4,9,13] },    // C7(b9 13) = C7 + hợp âm A (Db là b9)
  mM7:   { suf:'m(M7)',       lh:[0],    rh:[3,7,11] },     // Dm(M7) = nốt D + hợp âm F+
  m6:    { suf:'m6',          lh:[0],    rh:[3,7,9] },      // Fm6 = nốt F + nốt C D Ab
  add2:  { suf:'2',           lh:[0],    rh:[2,4,7] },      // C2 = nốt C + nốt D E G
  aug:   { suf:'+',           lh:[0],    rh:[0,4,8] },      // C+ = nốt C + hợp âm C+
  sus4:  { suf:'(sus4)',      lh:[0],    rh:[0,5,7] },      // G(sus4) = nốt G + nốt G C D
};
// Hậu tố viết khác của cùng một loại (tên hiện giữ đúng như gõ)
const ALIASES = { '7(9)':'dom9', '7(13)':'dom13', '7(b13 #9)':'alt1', '7(#11)':'lyd', '7(9 #11 13)':'lyd', '7+':'dom7b13', '7(#5)':'dom7b13',
  'm7(b5)':'m7b5', 'm7(9)':'m9', 'M7':'maj7', 'mM7':'mM7', 'add2':'add2', 'sus4':'sus4' };
// bass (tuỳ chọn): nốt bass riêng khác gốc (C7/G); bằng gốc thì bỏ qua
// names (tuỳ chọn): { rootName, bassName } = cách viết người dùng gõ (C#, G#...); không có thì dùng tên mặc định
// names.suf (tuỳ chọn): hậu tố đã viết (7+, 7(#11)...), giữ nguyên làm tên
const chord = (root, type, bass, names) => {
  const r = ((root%12)+12)%12, rn = names && names.rootName, sf = names && names.suf, c = { root: r, type, name: (rn ?? nm(r)) + (sf ?? TYPES[type].suf) };
  if (rn) c.rootName = rn;
  if (sf != null) c.suf = sf;
  if (bass != null && ((bass%12)+12)%12 !== r) {
    c.bass = ((bass%12)+12)%12; const bn = (names && names.bassName) ?? nm(c.bass);
    if (names && names.bassName) c.bassName = bn;
    c.name += '/' + bn;
  }
  return c;
};

function parseChord(s) {
  const m = s.trim().match(/^([A-G][#b]?)(m(?!aj))?/);
  if (!m || PC[m[1]] == null) return null;
  return chord(PC[m[1]], m[2] ? 'min' : 'maj', null, { rootName: keyRoot(PC[m[1]], m[1], !!m[2]) });
}

// Đọc ký hiệu đầy đủ: gốc dài nhất khớp PC + đúng một hậu tố trong TYPES
function parseSymbol(s) {
  s = String(s).trim().replace('°7', 'dim7');
  const sl = s.lastIndexOf('/');
  if (sl >= 0) {
    const c = parseSymbol(s.slice(0, sl)), b = s.slice(sl + 1);
    return c && !c.bass && Object.prototype.hasOwnProperty.call(PC, b) ? chord(c.root, c.type, PC[b], { rootName: c.rootName, bassName: b, suf: c.suf }) : null;
  }
  const root = Object.keys(PC).filter(k => s.startsWith(k)).sort((a, b) => b.length - a.length)[0];
  if (root === undefined) return null;
  const rest = s.slice(root.length), t = Object.keys(TYPES).find(k => TYPES[k].suf === rest), al = Object.prototype.hasOwnProperty.call(ALIASES, rest) ? ALIASES[rest] : undefined;
  return t !== undefined ? chord(PC[root], t, null, { rootName: root }) : al !== undefined ? chord(PC[root], al, null, { rootName: root, suf: rest }) : null;
}

// Tên nốt có quãng tám ("C#4", "Bb3") → số MIDI (C4 = 60); không đọc được → null
function parseNote(s) {
  const m = typeof s === 'string' && s.match(/^([A-G])([#b]?)(-?\d)$/);
  if (!m) return null;
  const oct = +m[3], k = m[1] + m[2]; if (oct < -1 || oct > 8 || !Object.prototype.hasOwnProperty.call(PC, k)) return null;
  return (oct + 1) * 12 + PC[k];
}

// Mục bài tập: rel hợp lệ; prog (tuỳ chọn) 2–8 ký hiệu đọc được, chord đúng một lần, before/line thì ngay sau chord là to → gắn slot;
// prog sai thì bỏ prog (mục vẫn giữ) và báo "<id> prog: <lý do>"; why tối đa 2 câu
const REL_KINDS = ['before', 'sub', 'line', 'modal'];
function readItem(it, id, errors) {
  const out = { ...it }, c = parseSymbol(it.chord), t = it.to != null ? parseSymbol(it.to) : null, rel = it.rel ?? 'before';
  if ('prog' in out) {
    const p = out.prog, cs = Array.isArray(p) ? p.map(x => typeof x === 'string' ? parseSymbol(x) : null) : [];
    const fail = why => { errors.push(`${id} prog: ${why}`); delete out.prog; };
    if (!Array.isArray(p) || p.length < 2 || p.length > 8) fail('cần 2–8 hợp âm');
    else if (cs.includes(null)) fail(`không đọc được ${p[cs.indexOf(null)]}`);
    else {
      const at = cs.map((x, k) => x.name === c.name ? k : -1).filter(k => k >= 0);
      if (at.length !== 1) fail(`${it.chord} xuất hiện ${at.length} lần`);
      else if ((rel === 'before' || rel === 'line') && !(t && cs[at[0] + 1] && cs[at[0] + 1].name === t.name)) fail(`sau ${it.chord} phải là ${it.to}`);
      else out.slot = at[0];
    }
  }
  if ('why' in out && !(typeof out.why === 'string' && out.why.trim() && (out.why.match(/[.!?](\s|$)/g) || []).length <= 2)) {
    errors.push(`${id} why: ${typeof out.why === 'string' && out.why.trim() ? 'dài quá 2 câu' : 'rỗng'}`); delete out.why; }
  return out;
}
// Bài học: đọc JSON nhúng; không bao giờ ném lỗi
function loadLessons(text) {
  let data;
  try {
    if (text === undefined) {
      const el = typeof document !== 'undefined' && document.getElementById('lessons');
      if (!el) throw new Error('không thấy dữ liệu');
      text = el.textContent;
    }
    data = JSON.parse(text);
    if (!Array.isArray(data)) throw new Error('không phải danh sách');
  } catch (e) { return { lessons: [], errors: ['lessons: ' + (e && e.message || e)] }; }
  const lessons = [], errors = [];
  for (const raw of data) {
    if (!isObj(raw)) { errors.push('lessons: mục không hợp lệ'); continue; }
    const items = [];
    for (const it of Array.isArray(raw.items) ? raw.items : []) {
      if (isObj(it) && it.rel != null && !REL_KINDS.includes(it.rel)) errors.push(`${raw.id ?? '?'}: rel ${it.rel}`);
      else if (isObj(it) && parseSymbol(it.chord) && (it.to == null || parseSymbol(it.to))) items.push(readItem(it, raw.id ?? '?', errors));
      else {
        const bad = !isObj(it) || !parseSymbol(it.chord) ? (isObj(it) ? it.chord : null) : it.to;
        errors.push(`${raw.id ?? '?'}: ${bad ?? '?'}`);
      }
    }
    const id = raw.id ?? '?';
    if ('key' in raw && !(typeof raw.key === 'string' && parseSymbol(raw.key))) { errors.push(`${id} key: ${raw.key}`); delete raw.key; }

function dedupKeys(xs) { const seen = {}; return xs.map(x => { const n = seen[x.key] = (seen[x.key] || 0) + 1; return n > 1 ? { ...x, key: `${x.key}#${n}` } : x; }); }

// Kiểm nhạc lý cho mục bài tập (thuần): mỗi mục phải khớp một luật, không thì báo "<id>: <chord> → <to>".
// Họ dominant: gốc = đích+7 ("mẹ") hoặc đích+1 ("bạn của mẹ"); sus chỉ ở chỗ "mẹ". Màu theo sổ tay (bài 16, 17, 21, 23, 24):
//   "mẹ" → trưởng: 9/13 (mixolydian) hoặc 13(#11) (lydian dominant), màu biến đổi là lựa chọn 2; "mẹ" → thứ: chỉ altered;
//   "bạn của mẹ" → mọi đích: 13(#11), 9, 13, không bao giờ altered.
// dim7: gốc = đích−1. m7/m7b5 ("chị"): gốc = đích+2, hoặc đích+7 khi đích là hợp âm át. Có bass riêng: bass cách bass đích 1–2 nửa cung.
// rel:'sub': chung ≥ 2 nốt với đích.
const DOM_ALL = [...DOMF, 'alt1', 'alt2', 'sus4'];
// Hợp âm có bass riêng mà bộ nốt trùng 9sus4 / 7sus4(b9) trên bass đó (F/G, Fm/G, Bb/C, G/A) thì xét như hợp âm treo ấy
function funcOf(c) {
  if (c.bass == null) return c;
  const pc = theoryPcs(c);
  for (const ty of ['sus9', 'sus4b9']) { const f = chord(c.bass, ty), fp = theoryPcs(f); if (fp.size === pc.size && [...pc].every(p => fp.has(p))) return f; }
  return c;
}
// Nốt chính của hợp âm (tính đến bậc 7): bỏ nốt màu b9, 9, #9, 11, #11, b13, 13 (m6 giữ bậc 6), cộng nốt bass
const TENSION_DEG = ['b9', '9', '#9', '11', '#11', 'b13', '13'], MAJ_PCS = [0, 2, 4, 5, 7, 9, 11];
function chordTones(c) {
  const out = new Set([...theoryPcs(c)].filter(p => !TENSION_DEG.includes(degree(c, p))));
  if (c.bass != null) out.add(c.bass);
  return out;
}
// Âm giai cùng tên giọng thứ: thứ tự nhiên, Dorian, Phrygian, thứ hoà âm, thứ giai điệu
const MINOR_SCALES = [[0, 2, 3, 5, 7, 8, 10], [0, 2, 3, 5, 7, 9, 10], [0, 1, 3, 5, 7, 8, 10], [0, 2, 3, 5, 7, 8, 11], [0, 2, 3, 5, 7, 9, 11]];
const keyOf = l => { const k = l && l.key != null ? parseSymbol(l.key) : null; return k ? k.root : 0; };
// Hợp âm mượn: mọi nốt chính nằm trong một âm giai thứ cùng tên giọng, và có ít nhất một nốt ngoài giọng trưởng
function modalOk(c, key = 0) {
  const ps = [...chordTones(c)].map(p => ((p - key) % 12 + 12) % 12);
  return ps.some(p => !MAJ_PCS.includes(p)) && MINOR_SCALES.some(sc => ps.every(p => sc.includes(p)));
}
// Đi liền mạch: cùng nốt gốc hoặc cùng nốt bass, mỗi nốt của c không có trong t cách một nốt của t 1–2 nửa cung
function lineOk(c, t) {
  if (!(c.root === t.root || (c.bass ?? c.root) === (t.bass ?? t.root))) return false;
  const tp = theoryPcs(t);
  return [...theoryPcs(c)].every(p => tp.has(p) || [...tp].some(q => { const d = Math.abs(p - q) % 12; return Math.min(d, 12 - d) <= 2; }));
}
function harmonyOk(c, t, rel, key = 0) {
  if (rel === 'modal') return modalOk(c, key);
  if (rel === 'line') return lineOk(c, t);
  if (rel === 'sub') { const tp = theoryPcs(t); return [...theoryPcs(c)].filter(p => tp.has(p)).length >= 2 || (c.bass ?? c.root) === (t.bass ?? t.root); }
  c = funcOf(c);
  const d = (c.root - t.root + 12) % 12, dom = DOM_ALL.includes(c.type);
  const colourOk = () => {
    if (!dom) return true;
    if (SUS.includes(c.type) && d !== 7) return false;
    const good = d !== 7 ? ['dom7', 'lyd', 'dom9', 'dom13']
      : MINISH.includes(t.type) ? ['dom7', 'domb9', 'alt1', 'alt2', 'sus4b9', 'dom7b13', 'hyb', 'dom13', 'sus4']
      : ['dom7', 'dom9', 'dom13', 'lyd', 'sus9', 'domb9', 'alt1', 'alt2', 'sus4b9', 'dom7b13', 'hyb', 'sus4'];
    return good.includes(c.type);
  };
  if (c.bass != null) { const x = (c.bass - (t.bass ?? t.root) + 12) % 12, step = Math.min(x, 12 - x); return step >= 1 && step <= 2 && colourOk(); }
  if (dom) return (d === 7 || d === 1) && colourOk();
  if (c.type === 'dim7') return d === 11 || d === 1;   // đi lên (đích−1) hoặc đi xuống (đích+1)
  if (['m7', 'm7b5'].includes(c.type)) return d === (DOM_ALL.includes(t.type) ? 7 : 2);
  return false;
}
function checkLessonHarmony(lessons) {
  const bad = [];
  for (const l of Array.isArray(lessons) ? lessons : []) for (const it of (l && Array.isArray(l.items)) ? l.items : []) {
    const c = it && parseSymbol(it.chord), t = it && it.to != null ? parseSymbol(it.to) : null, modal = it && it.rel === 'modal';
    if (!c || (!t && !modal) || !harmonyOk(c, t, it.rel, keyOf(l))) bad.push(`${l.id}: ${it && it.chord}${it && it.to != null ? ' → ' + it.to : ''}`);
  }
  return bad;
}
// Chỗ "?" trong một tiến hành: hợp lệ nếu là hợp âm mượn, hoặc hợp lệ với đích theo luật trước/thay/đi liền mạch
const fitsSlot = (x, t, key = 0) => modalOk(x, key) || !!(t && (harmonyOk(x, t) || harmonyOk(x, t, 'sub') || harmonyOk(x, t, 'line')));

// Gợi ý tái hoà âm cho ô ngay trước hợp âm đích
function suggest(target) {
  if (target.type === 'lyd' || target.lydDom) {   // đích là "bạn của mẹ" 13(#11): chỉ dẫn vào bằng "chị" của nó
    const t = target.root;
    return [
      { c: chord(t + 7, 'm7'), noChi: true, why: `"Chị" của ${target.name}: ${nm(t + 7)}m7 → ${target.name}. Không dùng "mẹ" vì b7 của nó chọi với #11.` },
      { c: chord(t + 7, 'm9'), noChi: true, why: `Vẫn là "chị" nhưng thêm 9: mềm hơn.` },
      { c: chord(t + 2, 'm7'), noChi: true, why: `${nm(t + 2)}m7: chung nhiều nốt với ${target.name}, nghe liền.` },
    ];
  }
  if (target.lydian) {   // đích có #11: "mẹ" (có b7) sẽ chọi với #11, nên chèn hợp âm cùng âm giai
    const t = target.root;
    return [
      { c: chord(t + 11, 'm7'), noChi: true, why: `${nm(t + 11)}m7 chung 3 nốt với ${target.name}, bass đi lên nửa cung vào ${nm(t)}. Không dùng "mẹ" vì b7 của nó chọi với #11.` },
      { c: chord(t + 9, 'm9'), noChi: true, why: `${nm(t + 9)}m9: mọi nốt đều nằm trong âm giai của ${target.name}, nghe nhẹ và liền.` },
      { c: chord(t + 2, 'maj'), noChi: true, why: `Hợp âm ${nm(t + 2)} chính là tay phải của ${target.name}: bấm trước rồi thêm bass ${nm(t)}.` },
    ];
  }
  const v = target.root + 7, minor = target.type === 'min';
  const tn = keyRoot(target.root, target.rootName, minor), vn = fifthOf(tn, minor) ?? nm(v), vName = { rootName: vn };
  const sec = chord(v, minor ? 'domb9' : 'dom9', null, vName);
  return [
    { c: sec, why: `"Mẹ" (V) của ${target.name}: bass ${vn} (từ ${tn} đếm lên 5 tên nốt: ${count5(tn, minor)}) kéo về ${target.name}. ` +
        (minor ? `${target.name} là hợp âm thứ → dùng b9.` : `${target.name} là hợp âm trưởng → dùng 9.`) },
    { c: chord(target.root + 1, 'lyd'), why: `"Bạn của mẹ" (subV): chung tritone với ${vn}7, bass đi xuống nửa cung vào ${target.name}. Màu 13(#11): thêm 9, #11, 13.` },
    minor
      ? { c: chord(v, 'sus4b9', null, vName), why: `Màu mềm hơn cho đích thứ: bass ${vn}, tay phải hợp âm ${nm(v + 10)}m (sus4 b9).` }
      : { c: chord(v, 'sus9', null, vName), why: `Màu mềm hơn: bass ${vn}, tay phải hợp âm ${nm(v + 10)} (9sus4).` },
  ];
}

// Kiểm tra chọi giữa 2 hợp âm liền nhau: nốt của x không thuộc âm giai của y thì phải đi nửa cung vào y
// (nốt 3 của hợp âm 7 phải lên; b7, b9, b13, 11 của hợp âm 7 phải xuống)
const MAJ = [0,2,4,5,7,9,11], MIN = [0,2,3,5,7,8,9,10], MIXO = [0,2,4,5,7,9,10], ALT = [0,1,3,4,5,7,8,10];
const SCALE = { maj:MAJ, maj7:MAJ, maj9:MAJ, maj13s11:[0,2,4,6,7,9,11], min:MIN, m7:MIN, m9:MIN, m11:MIN,
  m7b5:[0,1,3,5,6,8,10], dom7:MIXO, dom9:MIXO, dom13:MIXO, sus9:MIXO, domb9:ALT, alt1:ALT, alt2:ALT, dim7:[0,2,3,5,6,8,9,11], sus4b9:ALT, lyd:[0,2,4,6,7,9,10],
  dom7b13:[0,2,4,5,7,8,10], hyb:[0,1,3,4,6,7,9,10], mM7:[0,2,3,5,7,9,11], m6:[0,2,3,5,7,9,10], add2:MAJ, aug:[0,2,4,6,8,10], sus4:MIXO };
const DOMS = ['dom7','dom9','domb9','dom13','lyd','sus9','sus4b9','dim7','alt1','alt2','dom7b13','hyb','sus4'];
function clashes(x, y) {
  const ypcs = theoryPcs(y), sc = new Set(SCALE[y.type].map(i => (y.root + i) % 12)), bad = [];
  for (const p of theoryPcs(x)) {
    if (sc.has(p)) continue;
    const d = degree(x, p), dom = DOMS.includes(x.type);
    const up = ypcs.has((p + 1) % 12), down = ypcs.has((p + 11) % 12);
    const ok = dom && ['3','#11','#9','7'].includes(d) ? up : dom && ['b7','b9','b13','b5','11'].includes(d) ? down : (up || down);
    if (!ok) bad.push(`${nm(p)}(${d})`);
  }
  return bad;
}

const isV = (a, b) => a.type === 'maj' && a.root === (b.root + 7) % 12;

// Các màu cho chính hợp âm gốc. Phần tử đầu là mặc định.
function baseOptions(c, next, key) {
  const same = ty => chord(c.root, ty, null, c.rootName ? { rootName: c.rootName } : undefined), rn = c.rootName ?? nm(c.root);
  if (isV(c, next)) {
    const dom = chord(c.root, next.type === 'min' ? 'domb9' : 'dom13');
    return [
      { c: dom, why: `Đã là "mẹ" của ${next.name}: chỉ thêm màu (${next.type === 'min' ? 'đích thứ → b9' : 'đích trưởng → 13'}).` },
      { c: same('sus9'), why: `Mềm hơn: nốt ${rn} + hợp âm ${nm(c.root + 10)}, rồi giải về ${dom.name}.` },
      { c: chord(next.root + 1, 'lyd'), why: `Thay hẳn bằng "bạn của mẹ": chung tritone, bass xuống nửa cung vào ${next.name}.` },
    ];
  }
  if (c.type === 'maj' && c.root === (key + 7) % 12) return [   // bậc V nhưng không giải về I (VD: C G Am F)
    { c: same('dom13'), why: `Vẫn là hợp âm 7 bậc V dù không về ${nm(key)}: thêm 13.` },
    { c: same('sus9'), why: `Mềm hơn: nốt ${rn} + hợp âm ${nm(c.root + 10)}.` },
  ];
  if (c.type === 'min') return [
    { c: same('m7'), why: `Màu cơ bản: thêm nốt 7 (${rn} lùi một cung là ${nm(c.root + 10)}).` },
    { c: same('m9'), why: 'Thêm 9: mềm, sang hơn.' },
    { c: same('m11'), why: `Thêm 9 và 11: thoáng, hiện đại (nốt ${rn} + hợp âm ${nm(c.root + 10)}).` },
  ];
  const o = [
    { c: same('maj7'), why: `Màu cơ bản: thêm nốt 7 trưởng (${rn} lùi nửa cung là ${nm(c.root + 11)}).` },
    { c: same('maj9'), why: 'Thêm 9: sáng, mở hơn.' },
  ];
  if (c.root === (key + 5) % 12) o.push({ c: same('maj13s11'), why: 'Thêm 9, #11, 13 (lydian): rất sáng, chỉ hợp ở bậc IV vì #11 trùng nốt của giọng.' });
  if (c.root === (key + 5) % 12) o.push({ c: same('m7'), why: `Hoà âm mượn: ${c.name} thành ${rn}m7 (mượn từ giọng thứ), nghe buồn, ấm.` });
  return o;
}

// Tái hoà âm cả vòng.
// bp[j]  = màu chọn cho hợp âm gốc thứ j (chỉ số trong baseOptions, mặc định 0)
// picks[i] = hợp âm chèn trước gốc thứ i (0 mẹ, 1 bạn của mẹ, 2 sus; mặc định 0)
// Quy tắc: chèn theo hợp âm gốc ĐÃ đổi màu (gốc thành m7 thì "mẹ" trước nó dùng b9, "chị" là m7b5);
// "mẹ"/"bạn của mẹ" có "chị" đứng trước; ô đã là "mẹ" thì không chèn, trừ khi chọn subV, hoặc sus thì giải về 7.
// Hợp âm gốc sau khi đổi màu, và "đích" mà hợp âm chèn phải phục vụ (trưởng/thứ/lydian)
function colored(cs, bp = [], last) {
  const n = cs.length, key = cs[0].type === 'min' ? (cs[0].root + 3) % 12 : cs[0].root;
  const opts = cs.map((c, j) => baseOptions(c, cs[(j + 1) % n], key));
  const bases = cs.map((c, j) => opts[j][bp[j] ?? 0].c);
  bases.forEach((b, j) => {   // hợp âm 7 ngay trước hợp âm #11 sẽ chọi (b7 ↔ #11) → giữ maj7
    const nx = bases[(j + 1) % n];
    if (['dom13','domb9'].includes(b.type) && (bp[j] ?? 0) === 0 && nx.type === 'maj13s11') bases[j] = chord(b.root, 'maj7', null, b.rootName ? { rootName: b.rootName } : undefined);
  });
  // Hai hợp âm gốc liền nhau mà chọi: giữ hợp âm bạn vừa đổi (last), đổi màu hợp âm kia cho hợp
  for (let pass = 0; pass < 2; pass++) for (let j = 0; j < n; j++) {
    const k = (j + 1) % n;
    if (!clashes(bases[j], bases[k]).length) continue;
    const fix = last === j ? k : j, pv = bases[(fix - 1 + n) % n], nx = bases[(fix + 1) % n];
    const cands = [...opts[fix].map(o => o.c), chord(cs[fix].root, cs[fix].type === 'min' ? 'm7' : 'maj7', null, cs[fix].rootName ? { rootName: cs[fix].rootName } : undefined)];
    const good = cands.find(c => !clashes(pv, c).length && !clashes(c, nx).length);
    if (good) bases[fix] = good;
  }
  const tgts = bases.map(b => Object.assign(chord(b.root, MINORISH.includes(b.type) ? 'min' : 'maj', null, b.rootName ? { rootName: b.rootName } : undefined),
                                            { name: b.name, lydian: b.type === 'maj13s11', lydDom: b.type === 'lyd' }));
  return { opts, bases, tgts };
}

function reharmAll(cs, picks, bp = [], last) {
  const n = cs.length, { opts, bases, tgts } = colored(cs, bp, last);
  const bars = cs.map((c, j) => {
    const s = (j + 1) % n, k = picks[s] ?? 0, base = bases[j], tgt = tgts[s];
    if (isV(c, cs[s]) && !tgt.lydian) {
      if (base.type === 'sus9' || (k === 2 && (bp[j] ?? 0) === 0))
        return { base: chord(c.root, 'sus9'), slot: [opts[j][0].c] };
      return { base, slot: k === 1 && base.type !== 'lyd' ? [suggest(tgt)[1].c] : [] };
    }
    const opt = suggest(tgt)[k], x = opt.c, slot = [x];
    if (k < 2 && !opt.noChi) {
      const chi = chord(x.root + 7, k === 0 && tgt.type === 'min' ? 'm7b5' : 'm7');
      if (chi.root !== base.root) slot.unshift(chi);
    }
    return { base, slot };
  });
  // sus: nếu chọi với hợp âm đứng trước thì đổi sang sus4(b9) (cùng họ sus, khác nốt màu)
  const flat = bars.flatMap(b => [b.base, ...b.slot]);
  flat.forEach((x, i) => {
    if (x.type !== 'sus9') return;
    const prev = flat[(i - 1 + flat.length) % flat.length], alt = chord(x.root, 'sus4b9');
    if (clashes(prev, x).length > clashes(prev, alt).length) Object.assign(x, alt);
  });
  return bars;
}

const TERM_IGNORE = ['extended dominant', 'dominant mở rộng', 'lydian dominant', 'chủ yếu', 'chủ đề'];   // khớp nhưng không gán thuật ngữ nào, để "dominant" bên trong không bị bắt nhầm
const TERM_RE = [...GLOSSARY.map(g => ({ key: g.key, match: g.match })), { key: null, match: TERM_IGNORE }].map(g => ({ key: g.key, re: new RegExp('(?<![\\p{L}\\p{N}])(?:' +
  [...g.match].sort((a, b) => b.length - a.length).map(m => m.normalize('NFC').replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join('|') + ')(?![\\p{L}\\p{N}])', 'giu') }));
function termSpans(text) {
  text = String(text).normalize('NFC'); const all = [];
  TERM_RE.forEach(({ key, re }) => { re.lastIndex = 0; for (let m; (m = re.exec(text));) all.push({ key, start: m.index, end: m.index + m[0].length }); });
  all.sort((a, b) => a.start - b.start || (b.end - b.start) - (a.end - a.start));
  const out = []; let last = 0;
  all.forEach(x => { if (x.start >= last) { if (x.key) out.push(x); last = x.end; } });
  return out;
}
function termsIn(text) { return [...new Set(termSpans(text).map(x => x.key))]; }
const escHtml = x => String(x).replace(/[&<>"]/g, m => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[m]));
// Lời giảng → HTML đã escape; lần đầu mỗi thuật ngữ được bọc <span class="term" data-term>
function renderTeachText(text) {
  text = String(text).normalize('NFC'); const seen = new Set(); let html = '', at = 0;
  termSpans(text).forEach(x => {
    if (seen.has(x.key)) return; seen.add(x.key);
    html += escHtml(text.slice(at, x.start)) + `<span class="term" data-term="${x.key}" tabindex="0" role="button">${escHtml(text.slice(x.start, x.end))}</span>`; at = x.end;
  });
  return html + escHtml(text.slice(at));
}

      const PROGS = ['C Am F G','C G Am F','C F G C','Am F C G','C Em F G','Dm G C Am','F G Em Am','C Am Dm G','C E Am F','G D Em C',
                     'D A Bm G','Bb F Gm Eb','C Dm Em F','Am Dm E Am','C Fm C G','F Dm Bb C','G Em C D','E A B E','C A Dm G','Eb Cm Ab Bb'];
      let combos = 0; const bad = [];
      for (const p of PROGS) {

        const nOpt = cs.map((c, j) => baseOptions(c, cs[(j + 1) % n], key).length);
        const all = m => m.reduce((acc, k) => acc.flatMap(a => [...Array(k).keys()].map(q => [...a, q])), [[]]);
        for (const bp of all(nOpt)) for (const pk of all(cs.map(() => 3)))
          for (const last of [undefined, ...bp.map((q, j) => q ? j : -1).filter(j => j >= 0)]) {

// Mỗi test có thể trả về Promise; đợi tối đa 5 giây cho mỗi test
async function runTests(list) {
  const out = [];
  for (const t of list) {
    let timer;
    try {
      const info = await Promise.race([Promise.resolve().then(() => t.fn()),
        new Promise((_, rej) => { timer = setTimeout(() => rej(new Error('quá 5 giây')), 5000); })]);
      out.push({ name: t.name, ok: true, info });
    } catch (e) { out.push({ name: t.name, ok: false, info: String(e) }); }
    finally { clearTimeout(timer); }
  }
  return out;
}

        const nl = $('main').querySelector('[data-next-lesson]'); if (nl) nl.onclick = () => openLesson(nl.dataset.nextLesson);
        return;
      }
      const st = steps[i]; skip = advance; if (st.k === 'q') noteRecent();
      if (st.k === 'card') {
        resetPanel(); const t = st.t;
        const btn = (attr, label) => `<button class="b" ${attr}>▶ ${esc(label)}</button>`;
        const demoBtns = (t.play ? btn('data-play', 'Nghe') : '') +
          (t.compare ? btn('data-play-a', t.compare.a.label) + btn('data-play-b', t.compare.b.label) : '');
        frame(`<p>${renderTeachText(t.text)}</p>${t.tip ? `<div class="tip">💡 Mẹo: ${renderTeachText(t.tip)}</div>` : ''}${demoBtns ? `<div class="row">${demoBtns}</div>` : ''}${bk()}<button class="b pri" data-next>Tiếp →</button>`); wire();
        const go = pl => () => { if (run === lessonRun) playSeq(demoSeq(pl)); };
        const bind = (sel, pl) => { const e = $('main').querySelector(sel); if (e) e.onclick = go(pl); };
        if (t.play) bind('[data-play]', t.play);
        if (t.compare) { bind('[data-play-a]', t.compare.a.play); bind('[data-play-b]', t.compare.b.play); }
        if (t.show) showChord(parseSymbol(t.show), 'Ví dụ');
        else if (t.keys) showNotes(notesChord(t.keys), 'Ví dụ');
      } else if (st.k === 'rem') {
        resetPanel();
        frame(`<h3>Ghi nhớ</h3><ul class="remember">${lesson.remember.map(r => `<li>${renderTeachText(r)}</li>`).join('')}</ul>${bk()}<button class="b pri" data-next>Tiếp →</button>`); wire();
      } else if (st.k === 'try') {
        resetPanel();
        const pg = st.it.prog && Number.isInteger(st.it.slot) ? st.it.prog : null;
        frame(`<h3>${esc(st.c.name)}</h3>${pg ? `<div class="prog">${pg.map((x, k) => k === st.it.slot ? `<b>${esc(parseSymbol(x).name)}</b>` : esc(parseSymbol(x).name)).join(' – ')}</div>` : ''}
          <p>Bấm thử trên đàn hoặc chạm phím rồi nhấn Kiểm tra.</p>
          ${pg ? '<div class="row"><button class="b" data-play-prog>▶ Nghe cả câu</button></div>' : ''}${bk()}<button class="b" data-skip>Bỏ qua</button>`); wire();
        const r = lessonRun, at = i, cb = () => { if (r === lessonRun && i === at) advance(); };
        setTarget(st.c, cb);
        // nghe xong thì trả bàn phím về hợp âm cần bấm (nếu vẫn đang ở đúng bài, đúng bước)
        const pb = $('main').querySelector('[data-play-prog]');
        if (pb) pb.onclick = () => { if (r === lessonRun) playSeq(demoSeq(pg), () => { if (r === lessonRun && i === at) setTarget(st.c, cb); }); };
      } else if (st.q.choices) {
        const q = st.q; resetPanel();
        frame(`<h3>${renderTeachText(q.prompt)}</h3><div class="choices">${q.choices.map(c =>
          `<button class="b" data-n="${esc(c)}" data-answer="${esc(q.answer)}">${esc(c)}</button>`).join('')}</div><div id="qnext"></div>${i > 0 ? `<div id="qback" style="margin-top:10px">${bk()}</div>` : ''}`);
        const markDone = (b) => {
          b.classList.add('right'); answered.add(i);
          $('main').querySelectorAll('.choices [data-n]').forEach(x => { x.disabled = true; x.removeAttribute('data-answer'); });
          $('qnext').innerHTML = `<p class="why">${renderTeachText(q.why || '')}</p>${q.prog ? '<div class="row"><button class="b" data-play-prog>▶ Nghe cả câu</button></div>' : ''}${bk()}<button class="b pri" data-next style="margin-top:10px">Tiếp →</button>`;
          const qb = $('qback'); if (qb) qb.remove(); wire();
          const pb = $('qnext').querySelector('[data-play-prog]'); if (pb) pb.onclick = () => { if (run === lessonRun) playSeq(demoSeq(q.prog)); };
        };
        wire();
        (wrongs.get(i) || []).forEach(n => { const w = [...$('main').querySelectorAll('.choices [data-n]')].find(x => x.dataset.n === n); if (w) { w.classList.add('wrong'); w.disabled = true; } });
        if (answered.has(i)) markDone([...$('main').querySelectorAll('.choices [data-n]')].find(x => x.dataset.n === q.answer));
        $('main').querySelectorAll('.choices [data-n]').forEach(b => b.onclick = () => {
          if (b.disabled) return;
          stopPlay();
          if (b.dataset.n === q.answer) markDone(b);
          else {
            b.classList.add('wrong'); b.disabled = true;   // bấm lại nút sai không đếm thêm lỗi
            wrongs.set(i, [...(wrongs.get(i) || []), b.dataset.n]);
            progress.wrong[wrongKey(q)] = (Number(progress.wrong[wrongKey(q)]) || 0) + 1; persist();
          }
        });
      } else {
        const q = st.q; resetPanel();
        frame(`<h3>${renderTeachText(q.prompt)}</h3><p class="why">${renderTeachText(q.why || '')}</p><p>Bấm trên đàn hoặc chạm phím rồi nhấn Kiểm tra.</p>${bk()}<button class="b" data-skip>Bỏ qua</button>`);
        skip = () => { if (!resolved.has(i)) { resolved.add(i); progress.wrong[wrongKey(q)] = (Number(progress.wrong[wrongKey(q)]) || 0) + 1; persist(); } advance(); };
        wire();
        const r = lessonRun, at = i; setTarget(q.chord, () => { if (r === lessonRun && i === at) { resolved.add(at); advance(); } });
      }
    }
    show();
  }

  // ---- Tab Đố ----
  // Menu dạng câu (thiết kế mục 10.4): mỗi dạng mở khi đã học xong bài dạy nó; "Trộn" lấy các dạng đã mở;
  // "Vòng hợp âm" là dạng cũ (luôn mở). Giọng: Chỉ C / Nhiều giọng (C G F D Bb A Eb). Điểm đúng/sai đếm trong phiên.
  let prog = ['C','Am','F','G'];
  const quizState = { ok: 0, bad: 0, q: null, ...progress.quiz };   // play: 'free' = Luyện tự do, 'run' = Vượt màn
  const saveQuizPrefs = () => { progress.quiz = { play: quizState.play, mode: quizState.mode, keys: quizState.keys, timer: quizState.timer }; persist(); };   // ?test: persist() không ghi
  const openSkills = () => SKILLS.filter(s => progress.done[s.lesson]);
  function quiz() {
    cancelChallenge();   // vào/đổi/vẽ lại tab Đố thì bỏ màn đang chơi (không lưu)
    const open = openSkills(), st = quizState, runMode = st.play === 'run';
    if (runMode && st.mode === 'ring' && open.length) st.mode = 'mix';   // Vòng hợp âm không có trong Vượt màn
    if (!st.mode || !(st.mode === 'mix' || st.mode === 'ring' || SKILL_IDS.includes(st.mode)) || (st.mode === 'mix' && !open.length) || (SKILL_IDS.includes(st.mode) && !open.some(s => s.id === st.mode))) st.mode = open.length ? 'mix' : 'ring';
    const opt = (v, label, on) => `<option value="${v}"${on ? '' : ' disabled'}${st.mode === v ? ' selected' : ''}>${esc(label)}</option>`;
    const ring = st.mode === 'ring';
    $('main').innerHTML = `<div class="card qbar"><div class="row" style="margin:0 0 6px"><button class="b seg${runMode ? '' : ' act'}" data-play="free">Luyện tự do</button><button class="b seg${runMode ? ' act' : ''}" data-play="run">Vượt màn</button></div><label class="qlab">Dạng câu <select id="qmode">${opt('mix', open.length ? 'Trộn (các dạng đã học)' : '🔒 Trộn — học xong một bài để mở', open.length > 0)}` +
      SKILLS.map(s => opt(s.id, progress.done[s.lesson] ? `${s.label} · ${lessonTag(s.lesson)}` : `🔒 ${s.label} — học ở ${lessonTag(s.lesson)}`, !!progress.done[s.lesson])).join('') +
      opt('ring', runMode ? 'Vòng hợp âm — chỉ có ở Luyện tự do' : `Vòng hợp âm (${prog.join(' ')})`, !runMode) + `</select></label>
      <div class="row"><button class="b seg${st.keys === 'C' ? ' act' : ''}" data-keys="C"${ring ? ' disabled' : ''}>Chỉ C</button><button class="b seg${st.keys === 'many' ? ' act' : ''}" data-keys="many"${ring ? ' disabled' : ''}>Nhiều giọng</button>
      ${runMode ? '' : `<span id="qscore" class="mut">Đúng ${st.ok} · Sai ${st.bad}</span>`}</div>
      ${open.length ? '' : `<p class="mut" id="qhint">Học xong bài ở mục Học để mở thêm dạng câu: dạng đầu tiên (${esc(SKILLS[0].label)}) mở sau ${lessonTag(SKILLS[0].lesson)}.</p>`}</div><div id="qbody"></div>`;
    $('qmode').onchange = e => { st.mode = e.target.value; saveQuizPrefs(); clearTarget(); quiz(); };
    $('main').querySelectorAll('[data-keys]').forEach(b => b.onclick = () => { st.keys = b.dataset.keys; saveQuizPrefs(); clearTarget(); quiz(); });
    $('main').querySelectorAll('[data-play]').forEach(b => b.onclick = () => { st.play = b.dataset.play; saveQuizPrefs(); clearTarget(); quiz(); });
    if (runMode) return challengeSetup(!ring);
    (ring ? ringQuestion : skillRound)();
  }
  // ---- Vượt màn (thiết kế mục 11): 30 câu, đếm ngược mỗi câu, ≥ 27 là qua ----
  // challenge.clock / sec / history là chỗ để test cắm đồng hồ giả, số giây ngắn và lịch sử có sẵn
  const challenge = { run: null, clock: () => performance.now(), sec: null, history: null, guardMs: TEST_MODE ? 0 : 300 };   // guardMs: sau khi sang câu mới, bỏ qua chạm trong ngần này ms (tránh chạm đúp trúng câu kế); test đặt 0
  const timerOf = () => TIMER_LEVELS.find(t => t.id === quizState.timer) || TIMER_LEVELS[1];
  const challengeHistory = () => challenge.history || progress.history;
  function cancelChallenge() {
    const r = challenge.run; challenge.run = null;
    if (r && r.timerId != null) clearInterval(r.timerId);
  }
  const selOf = () => ({ kind: quizState.mode, keys: quizState.keys, timer: quizState.timer });
  // biểu đồ cột: 10 lần gần nhất của lựa chọn, vạch ngang ở 27
  function historyChart(history, sel) {
    const h = selectionHistory(history, sel).slice(-10);
    if (!h.length) return '<p class="mut">Chưa có lần làm nào với lựa chọn này (dạng + giọng + mốc giờ).</p>';
    return `<div class="hchart" aria-label="Điểm ${h.length} lần gần nhất"><div class="hplot"><div class="hline" style="bottom:${PASS_MARK / ROUND_LEN * 100}%"><span>${PASS_MARK}</span></div>` +
      h.map(a => `<div class="hcol" title="${esc(new Date(a.at).toLocaleDateString('vi-VN'))} · ${esc(fmtDur(a.ms))}"><div class="hbar${a.score >= PASS_MARK ? ' pass' : ''}" style="height:${a.score / ROUND_LEN * 100}%"></div><span>${a.score}</span></div>`).join('') + '</div></div>';
  }
  function challengeSetup(canRun) {
    const st = quizState, sel = selOf();
    const order = loadLessons().lessons.map(l => l.id).filter(id => progress.done[id]), thinN = canRun && st.keys === 'C' && st.mode !== 'mix' ? distinctCount(st.mode, 'C', order[order.length - 1] || null) : 99;
    const thin = thinN < 15 ? thinN : 0;
    $('qbody').innerHTML = `<div class="card"><h3>Vượt màn: ${ROUND_LEN} câu, đúng ≥ ${PASS_MARK} là qua</h3>
      <div class="qlab">Giờ mỗi câu</div><div class="row">${TIMER_LEVELS.map(t => `<button class="b seg${st.timer === t.id ? ' act' : ''}" data-timer="${t.id}">${t.label} ${t.sec}s</button>`).join('')}</div>
      <div class="row"><button class="b pri" id="qstart"${canRun ? '' : ' disabled'}>Bắt đầu màn</button></div>
      <p class="mut">Mỗi câu có đồng hồ đếm ngược, hết giờ tính sai. Không có bước bấm thử.</p>
      ${thin ? `<p class="mut" id="qthin">Dạng này ở giọng C chỉ có ${thin} câu khác nhau, màn sẽ lặp lại câu — chọn Nhiều giọng để đa dạng hơn.</p>` : ''}
</div>
      <div class="card"><div class="qlab">Điểm 10 lần gần nhất (cùng dạng, giọng, mốc giờ)</div>${canRun ? historyChart(challengeHistory(), sel) : '<p class="mut">Học xong một bài để mở dạng câu.</p>'}</div>`;
    $('qbody').querySelectorAll('[data-timer]').forEach(b => b.onclick = () => { st.timer = b.dataset.timer; saveQuizPrefs(); quiz(); });
    $('qstart').onclick = startChallenge;
  }
  function startChallenge() {
    const st = quizState, open = openSkills(), order = loadLessons().lessons.map(l => l.id).filter(id => progress.done[id]);
    const kinds = st.mode === 'mix' ? open.map(s => s.id) : [st.mode]; if (!kinds.length || st.mode === 'ring') return;
    const { qs, dup } = buildRound(kinds, st.keys, order[order.length - 1] || null, Math.random);
    if (qs.length < ROUND_LEN) { $('qbody').insertAdjacentHTML('afterbegin', '<p class="bad">Chưa sinh đủ câu hỏi, chọn dạng khác.</p>'); return; }
    cancelChallenge();
    challenge.run = { qs, dup, sel: selOf(), i: 0, res: [], wrong: [], timerId: null, limit: 0, t0: 0, answered: false };
    askChallenge();
  }
  function askChallenge() {
    const r = challenge.run, q = r.qs[r.i], s = SKILLS.find(x => x.id === q.kind);
    r.limit = (challenge.sec != null ? challenge.sec : timerOf().sec) * 1000; r.answered = false;
    $('main').innerHTML = `<div class="card"><div class="row" style="justify-content:space-between;margin:0"><b id="cprog">Câu ${r.i + 1}/${ROUND_LEN}</b><span id="cscore" class="mut">Đúng ${r.res.filter(x => x.ok).length} · Sai ${r.res.filter(x => !x.ok).length}</span><button class="b" id="cstop" style="margin:0">Dừng</button></div>
      <div class="row" style="flex-wrap:nowrap;margin:8px 0 2px"><div class="tbar"><i id="tfill" style="width:100%"></i></div><b id="tsec" class="tsec">${Math.ceil(r.limit / 1000)}</b></div>
      <div class="mut">${esc(s.label.replace(/ X$/, ''))} · giọng ${esc(q.keyName)}</div>
      <h3>${renderTeachText(q.prompt)}</h3><div class="choices">${q.choices.map(c => `<button class="b" data-n="${esc(c)}">${esc(c)}</button>`).join('')}</div><div id="fb"></div></div>`;
    $('cstop').onclick = () => {   // hỏi lại trong trang, đồng hồ dừng trong lúc hỏi
      if (challenge.run !== r || $('cconfirm')) return; r.confirming = true; pauseChallenge();
      $('cprog').closest('.card').querySelector('.row').insertAdjacentHTML('afterend', '<div id="cconfirm" class="row confirm"><span>Dừng màn này? Điểm không được lưu.</span><button class="b" id="cstopyes">Dừng hẳn</button><button class="b pri" id="cstopno">Tiếp tục</button></div>');
      $('cstopyes').onclick = () => { if (challenge.run === r) { cancelChallenge(); quiz(); } };
      $('cstopno').onclick = () => { if (challenge.run !== r) return; r.confirming = false; $('cconfirm').remove(); resumeChallenge(); };
    };
    r.armedAt = performance.now() + challenge.guardMs;
    $('main').querySelectorAll('.choices [data-n]').forEach(b => b.onclick = () => { if (r.confirming || performance.now() < r.armedAt) return; answerChallenge(b.dataset.n); });
    r.t0 = challenge.clock(); r.timerId = setInterval(challengeTick, 100);
  }
  // Tab trình duyệt bị ẩn: dừng đồng hồ câu đang hỏi; hiện lại thì chạy tiếp, phần đã trôi qua lúc ẩn không tính
  function pauseChallenge() { const r = challenge.run; if (r && !r.answered && r.timerId != null) { clearInterval(r.timerId); r.timerId = null; r.hiddenAt = challenge.clock(); } }
  function resumeChallenge() {   // chạy lại khi không còn lý do dừng (tab hiện, không đang hỏi xác nhận Dừng)
    const r = challenge.run; if (!r || r.answered || document.hidden || r.confirming || r.timerId != null || r.hiddenAt == null) return;
    r.t0 += challenge.clock() - r.hiddenAt; r.hiddenAt = null; r.timerId = setInterval(challengeTick, 100);
  }
  function onVisibility() { if (document.hidden) pauseChallenge(); else resumeChallenge(); }
  document.addEventListener('visibilitychange', onVisibility);
  // Gọi mỗi 100 ms; test gọi tay với đồng hồ giả. Chỉ chạy khi đang chờ trả lời.
  function challengeTick() {
    const r = challenge.run; if (!r || r.answered || r.hiddenAt != null) return;
    const left = r.limit - (challenge.clock() - r.t0);
    if (left <= 0) { answerChallenge(null); return; }
    const f = $('tfill'), t = $('tsec'); if (!f || !t) return;
    f.style.width = (left / r.limit * 100) + '%'; f.classList.toggle('low', left / r.limit <= 0.25); t.textContent = Math.ceil(left / 1000);
  }
  function answerChallenge(pick) {   // pick = null: hết giờ
    const r = challenge.run; if (!r || r.answered) return;
    if (pick !== null && challenge.clock() - r.t0 >= r.limit) pick = null;   // bấm trễ sau khi đã hết giờ không tính
    r.answered = true; clearInterval(r.timerId); r.timerId = null;   // đồng hồ dừng suốt lúc xem đáp án
    const q = r.qs[r.i], good = pick === q.answer, ms = Math.min(r.limit, Math.max(0, challenge.clock() - r.t0));
    r.res.push({ ok: good, ms });
    if (good) { nextChallenge(); return; }
    r.wrong.push({ prompt: q.prompt, answer: q.answer, why: q.why, pick });
    $('main').querySelectorAll('.choices [data-n]').forEach(b => { b.disabled = true; if (b.dataset.n === q.answer) b.classList.add('right'); else if (b.dataset.n === pick) b.classList.add('wrong'); });
    const f = $('tfill'); if (f) f.style.width = '0%'; if ($('tsec')) $('tsec').textContent = pick === null ? '0' : $('tsec').textContent;
    $('cscore').textContent = `Đúng ${r.res.filter(x => x.ok).length} · Sai ${r.res.filter(x => !x.ok).length}`;
    $('fb').innerHTML = `<p class="why"><span class="bad">${pick === null ? 'Hết giờ.' : 'Chưa đúng.'}</span> Đáp án: <span class="ok">${esc(q.answer)}</span> — ${renderTeachText(q.why)}</p>
      <div class="row"><button class="b pri" id="cnext">${r.i + 1 >= ROUND_LEN ? 'Xem kết quả' : 'Câu tiếp →'}</button></div>`;
    $('cnext').onclick = () => { if (challenge.run === r) nextChallenge(); };
  }
  function nextChallenge() {
    const r = challenge.run; r.i++;
    if (r.i >= ROUND_LEN) finishChallenge(); else askChallenge();
  }
  function finishChallenge() {
    const r = challenge.run, g = gradeRound(r.res), att = { ...r.sel, score: g.score, ms: Math.round(g.totalMs), at: Date.now() };
    const before = challengeHistory(), cmp = compareAttempt(before, att), after = addAttempt(before, att);
    if (!TEST_MODE && !challenge.history) { progress.history = after; persist(); }   // ?test không ghi gì
    cancelChallenge();
    const sc = SKILLS.find(x => x.id === r.sel.kind), kindLabel = r.sel.kind === 'mix' ? 'Trộn' : sc ? sc.label.replace(/ X$/, '') : r.sel.kind;
    const diff = cmp.prev && (cmp.vsPrev === 0 ? 'y hệt lần trước'
      : g.score !== cmp.prev.score ? `${g.score > cmp.prev.score ? 'cao hơn' : 'thấp hơn'} lần trước ${Math.abs(g.score - cmp.prev.score)} điểm`
      : `bằng điểm, ${att.ms < cmp.prev.ms ? 'nhanh hơn' : 'chậm hơn'} ${fmtDur(Math.abs(att.ms - cmp.prev.ms))}`);
    const line = a => `${a.score}/${ROUND_LEN} · ${fmtDur(a.ms)}`;
    $('main').innerHTML = `<div class="card"><h3 class="${g.passed ? 'ok' : 'bad'}" id="cresult">${g.passed ? 'Qua màn!' : `Chưa qua — cần ${PASS_MARK}`}</h3>
      <div class="bigscore" id="cfinal">${g.score}/${g.total}</div>
      <p class="mut">${esc(kindLabel)} · ${r.sel.keys === 'C' ? 'chỉ C' : 'nhiều giọng'} · ${TIMER_LEVELS.find(t => t.id === r.sel.timer).label}</p>
      <p>Tổng thời gian trả lời: <b>${esc(fmtDur(att.ms))}</b> · trung bình mỗi câu: <b>${esc(fmtSec(g.avgMs))}</b></p>
      <p id="ccmp">${cmp.prev ? `So với lần trước (${line(cmp.prev)}): <b>${diff}</b>.` : 'Lần đầu với lựa chọn này.'}
      ${cmp.isRecord ? (cmp.best ? ' <span class="ok">Kỷ lục mới!</span>' : ' <span class="ok">Đây là kỷ lục đầu tiên.</span>') : ` Kỷ lục: <b>${line(cmp.best)}</b>.`}</p>
      <div class="row"><button class="b pri" id="cagain">Làm màn mới</button><button class="b" id="cfree">Về luyện tự do</button></div></div>
      <div class="card"><div class="qlab">Điểm 10 lần gần nhất (vạch ${PASS_MARK} là mốc qua màn)</div>${historyChart(after, r.sel)}</div>` +
      (r.wrong.length ? `<div class="card"><h3>Câu sai (${r.wrong.length})</h3>${r.wrong.map(w => `<div class="wq"><div>${renderTeachText(w.prompt)}</div><p>Đáp án: <span class="ok">${esc(w.answer)}</span>${w.pick === null ? ' · <span class="bad">hết giờ</span>' : ` · bạn chọn: <span class="bad">${esc(w.pick)}</span>`}</p><p class="why">${renderTeachText(w.why)}</p></div>`).join('')}</div>` : '<div class="card"><p class="ok">Không sai câu nào.</p></div>');
    $('cagain').onclick = () => { quizState.mode = r.sel.kind; quizState.keys = r.sel.keys; quizState.timer = r.sel.timer; saveQuizPrefs(); startChallenge(); };
    $('cfree').onclick = () => { quizState.play = 'free'; saveQuizPrefs(); quiz(); };
  }
