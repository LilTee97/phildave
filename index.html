  {"id": "p1-02", "part": 1, "src": "Phildave 1 · Video 1-2", "title": "Video 1-2: II–V–I về F, chọn thế bấm theo nốt giai điệu", "teach": [{"text": "Phần này học theo cuốn sách voicing của thầy: mỗi cặp trang là một II–V–I đi về một hợp âm đích trong giọng C. Trong giọng C ta dùng bậc I đến VI (C, Dm, Em, F, G7, Am) làm đích; bậc VII (Bm7b5) không đứng yên lâu được nên không làm đích. Bài này đi về F: F là \"tôi\" (hợp âm đích), trước F có \"chị\" Gm7 (bậc II của F) rồi \"mẹ\" C7 (hợp âm 7 trên bậc V của F). Xét riêng thì F tự coi mình là nhân vật chính, nên có cả một II–V của riêng nó. Nghe so sánh: chỉ có F, rồi Gm7 – C7 – F.", "tip": "\"Mẹ\" của F: từ F đếm lên 5 tên nốt (F, G, A, Bb, C) là C, nên \"mẹ\" là C7.", "compare": {"a": {"label": "Chỉ có F", "play": ["F"]}, "b": {"label": "Gm7 – C7 – F", "play": ["Gm7", "C7", "F"]}}}, {"text": "Sách ghi nốt giai điệu theo Đô Rê Mi: Đô = C, Rê = D, Mi = E, Fa = F, Sol = G, La = A, Si = B. Mỗi bậc (\"chị\", \"mẹ\", \"tôi\") có một dòng cho từng nốt giai điệu; ô để trống là không có thế bấm nên dùng. Cách dùng sách có 4 bước: (1) xác định hợp âm đích sắp tới; (2) nghe ca sĩ hát nốt nào ở chỗ \"chị\" và \"mẹ\"; (3) tìm dòng có đúng nốt đó; (4) tay trái và tay phải bấm thế ở dòng đó, nốt giai điệu nằm trên cùng. Thầy nói ở chỗ cần II–V mà chỉ đánh Gm7 không thêm gì thì \"sẽ rất chán\": phải vừa đánh hợp âm vừa đánh giai điệu.", "tip": "Bảy phím trắng từ C lên là Đô, Rê, Mi, Fa, Sol, La, Si.", "keys": ["C4", "D4", "E4", "F4", "G4", "A4", "B4"]}, {"text": "\"Chị\" Gm7, giai điệu C: C là nốt 11 của Gm (đếm G, A, Bb, C: nốt thứ tư, đặt cao lên một quãng 8). Thầy giải thích: trên hợp âm trưởng G thì nốt 4 (C) đi cùng bậc 3 (B) là nốt nên tránh, vì C và B chọi nhau. Gm là hợp âm thứ, bậc 3 là Bb, nên C không chọi, \"mình còn khuyên dùng màu âm này\". Nghe so sánh: tay trái G B F rồi G Bb F, cùng tay phải A C, C trên cùng. Ở bài tập, app gợi ý thế gọn: tay trái G, tay phải hợp âm F (F A C), C trên cùng. Thế gọn này chưa có Bb nên nghe giống F/G (G9sus4, đã gặp ở Phildave 4); muốn nghe rõ màu Gm thì tay trái bấm G Bb, app vẫn chấm đúng.", "tip": "Hợp âm F ở tay phải: G lùi một cung là F, nên F là nốt 7 của Gm7, và A, C là nốt 9, 11.", "compare": {"a": {"label": "G trưởng, C trên cùng (chọi)", "play": [["G2", "B2", "F3", "|", "A3", "C4"], "C7", "F"]}, "b": {"label": "Gm, C trên cùng (Gm11)", "play": [["G2", "Bb2", "F3", "|", "A3", "C4"], "C7", "F"]}}}, {"text": "Giai điệu G trên Gm7: G là nốt gốc, đánh nguyên Gm7 thì \"hơi quá hiển nhiên\". Nên thầy thêm nốt 9 (A) cho phức tạp hơn một chút: đó là Gm9 = G Bb D F A, nốt G đặt trên cùng. Sách còn có dòng Bb, nhưng Bb không thuộc các phím trắng của giọng C: \"rất hiếm khi giai điệu rơi vào nốt này\", nó chủ yếu dành cho lúc piano tự làm giai điệu. Thầy tóm lại: bậc II \"không có gì quá phức tạp\", chỉ cần đi theo giai điệu.", "tip": "Nốt 9 là nốt gốc lên một cung: G lên một cung là A.", "play": ["Gm9^G", "C7", "F"]}, {"text": "\"Mẹ\" C7, giai điệu A: đây là nốt thầy \"rất thích\", có nhiều lựa chọn nhất. Lựa chọn đầu: sách ghi C7, nhưng giai điệu A là nốt 13 của C7 nên gọi đủ là C13 (C E Bb, thêm D và A), A nằm trên cùng. Xuống dòng dưới là hợp âm ba nốt phía trên (upper structure): tay trái C7 (từ mức tay 2), tay phải hợp âm D (D F# A), cho ba nốt màu 9, #11, 13 (D, F#, A), A vẫn trên cùng; đó là C13(#11). Sách còn một dòng Bb/C cho giai điệu A; Bb/C (C + Bb D F) không có sẵn A, nên thế bấm cụ thể hãy xem sách.", "tip": "Nốt 13 là nốt 5 lên một cung: G lên một cung là A. Tay phải hợp âm D: C lên một cung là D.", "compare": {"a": {"label": "Gm7 – C13 – F (A trên cùng)", "play": ["Gm7", "C13^A", "F"]}, "b": {"label": "Gm7 – C13(#11) – F (A trên cùng)", "play": ["Gm7", "C13(#11)^A", "F"]}}}, {"text": "\"Mẹ\" C7, giai điệu C: sách cho ba lựa chọn từ trên xuống. Một là Bb/C (C 9sus4): tay trái C, tay phải hợp âm Bb (Bb D F), giai điệu C nằm trên cùng. Hai là C(sus4), \"một sus4 rất gọn gàng\": C F G. Ba là Gb7(#11), \"bạn của mẹ\" của F: Gb7 cách C7 một tritone (thầy đếm \"chuối – dứa\", chính là mẹo banana đã học), tay phải hợp âm Ab (Ab C Eb) có sẵn nốt C. Thầy dặn chỉ dùng Gb7 \"khi giai điệu là Đô… khi giai điệu nghe đẹp thì mới dùng\", và không cần nghĩ nó tên là gì, \"nghe hay thì dùng\".", "tip": "Bb/C: C lùi một cung là Bb. Gb7(#11): Gb lên một cung là Ab, tay phải hợp âm Ab.", "play": ["Bb/C^C", "F", "C(sus4)^C", "F", "Gb7(#11)^C", "F"]}, {"text": "Nốt sao (star note) là nốt giai điệu nằm ngoài hợp âm đang đánh mà thầy đánh dấu sao trong sách, vì chúng nghe hấp dẫn nhất. Gm7 có G Bb D F, nên nốt sao là A, C, E (nốt 9, 11, 13). C7 có C E G Bb, nên nốt sao là D và A (thầy tự sửa: C không phải, vì C đã có trong hợp âm); F cũng nằm ngoài C7 nhưng thầy không đánh dấu (app giải thích: F ở ngay trên E, bậc 3, giống C trên G trưởng ở màn 3). Thầy khuyên để ý những câu giai điệu có các nốt sao và cho chúng làm nốt bắt đầu câu. Nghe: Gm9 với A trên cùng, rồi C13 với D trên cùng, về F.", "tip": "Nốt sao trên C7: D là nốt 9 (C lên một cung), A là nốt 13 (G lên một cung).", "play": ["Gm9^A", "C13^D", "F"]}, {"text": "Thầy nhấn mạnh: bậc V quan trọng hơn bậc II, \"các bạn hãy làm chủ bậc V thật tốt\". Lý do: \"mẹ\" là hợp âm kéo về F, nên đổi màu ở bậc V là đổi cả cảm giác trước khi về đích, còn bậc II chỉ cần theo giai điệu. Mỗi hợp âm đích sẽ có dạng bậc V khác nhau, các bài sau lần lượt đi qua. Nghe so sánh: cùng Gm7, chỉ đổi C7 thành C13 với A trên cùng.", "compare": {"a": {"label": "Gm7 – C7 – F", "play": ["Gm7", "C7", "F"]}, "b": {"label": "Gm7 – C13 – F", "play": ["Gm7", "C13^A", "F"]}}}, {"text": "Bậc I, F, có dòng cho đủ bảy nốt. F A C là nốt chính của F, nghe rất chắc; các nốt không có sẵn trong F như D, E (nốt 7 của Fmaj7, \"nghe xa hơn một chút nhưng cũng rất ổn\") và G cho thế bấm rất hay. Giai điệu B trên bass F thì \"tạo cảm giác hơi lơ lửng\". Rơi về I cũng có thể đơn giản đánh Fmaj7, \"không sao\". Nghe: bass F, tay phải A C rồi B trên cùng, sau đó là Fmaj7.", "tip": "Nốt 7 của Fmaj7 là F lùi nửa cung: E.", "play": [["F2", "|", "A3", "C4", "B4"], "Fmaj7"]}, {"text": "Song hành quãng 6 (parallel sixths): \"khi không rõ phải làm gì\" ở bậc I, tay phải đánh mỗi nốt giai điệu kèm một nốt thấp hơn nó một quãng 6, cả hai đều là phím trắng của giọng C, rồi cả cặp đi theo giai điệu; tay trái giữ bass F. Vì hai nốt luôn cách nhau một quãng 6 nên nghe êm, và nốt giai điệu nào cũng dùng được. Ví dụ giai điệu A, G, F: nốt dưới lần lượt là C, B, A. Thầy nói trộn thêm II–V–I và song hành quãng 6 vào cách đệm đơn giản là âm thanh đã rất hay.", "tip": "Tìm nốt dưới: từ nốt giai điệu đếm xuống 6 tên nốt, như A, G, F, E, D, C.", "play": [["F2", "|", "C4", "A4"], ["F2", "|", "B3", "G4"], ["F2", "|", "A3", "F4"]]}], "remember": ["Tra sách 4 bước: xác định hợp âm đích, nghe nốt giai điệu ở chỗ \"chị\", \"mẹ\", tìm dòng có nốt đó, bấm thế đó với giai điệu trên cùng.", "Về F: Gm7 – C7 – F. Giai điệu A trên C7: C13 hoặc C13(#11); giai điệu C: Bb/C, C(sus4) hoặc Gb7(#11).", "Nốt sao (ngoài hợp âm) nghe hay nhất: A, C, E trên Gm7; D, A trên C7. Bậc I chưa biết làm gì thì dùng song hành quãng 6."], "items": [{"chord": "Gm11", "to": "C7", "prog": ["Gm11", "C7", "F"], "mel": "C"}, {"chord": "C13", "to": "F", "prog": ["Gm7", "C13", "F"], "mel": "A"}, {"chord": "Bb/C", "to": "F", "prog": ["Gm7", "Bb/C", "F"], "mel": "C"}], "quiz": [{"q": "Trong II–V về F, vì sao D và A được đánh dấu sao ở chỗ \"mẹ\" C7?", "choices": ["Vì D và A là nốt màu (9, 13) nằm ngoài C7, nghe hấp dẫn nhất", "Vì D và A là nốt gốc và nốt 5 của C7", "Vì D và A là nốt nên tránh trên C7", "Vì D và A không thuộc giọng C"], "answer": "Vì D và A là nốt màu (9, 13) nằm ngoài C7, nghe hấp dẫn nhất", "why": "Nốt sao là nốt màu ngoài hợp âm mà thầy đánh dấu: trên C7, D là nốt 9 và A là nốt 13 (F cũng ngoài hợp âm nhưng thầy không đánh dấu; app giải thích: F chọi với E)."}, {"q": "Giai điệu C ở chỗ \"chị\" Gm7: vì sao thầy khuyên dùng Gm11?", "choices": ["C là nốt 11 của Gm; trên hợp âm thứ nốt này không chọi mà còn đẹp", "C là nốt gốc của Gm nên nghe chắc", "Trên hợp âm trưởng G, nốt C cũng luôn đẹp như vậy", "Gm11 không có nốt C nên không trùng giai điệu"], "answer": "C là nốt 11 của Gm; trên hợp âm thứ nốt này không chọi mà còn đẹp", "why": "Trên G trưởng, C chọi với bậc 3 B nên là nốt nên tránh; Gm có bậc 3 là Bb nên C không chọi, thầy còn khuyên dùng."}, {"q": "Ở bậc I mà chưa biết đánh gì, thầy khuyên làm gì?", "choices": ["Song hành quãng 6: mỗi nốt giai điệu kèm một nốt thấp hơn một quãng 6 trong giọng C", "Chỉ đánh nốt gốc F bằng cả hai tay", "Đổi F thành F7", "Bỏ giai điệu, chỉ đánh hợp âm F"], "answer": "Song hành quãng 6: mỗi nốt giai điệu kèm một nốt thấp hơn một quãng 6 trong giọng C", "why": "Thầy nói: khi không rõ phải làm gì thì dùng song hành quãng 6; mọi nốt giai điệu đều dùng được cách này."}]},
  {"id": "p1-03", "part": 1, "src": "Phildave 1 · Video 1-3", "title": "Video 1-3: II–V–I về Am, \"mẹ\" tối màu và nốt đích", "teach": [{"text": "Am là \"một hợp âm rất quan trọng trong giọng C\": đoạn vào điệp khúc đi về Am xuất hiện khá nhiều, nhất là nhạc CCM, gospel và những bài có câu chuyện, vì Am mang màu tối. Ở đây Am là \"tôi\", Bm7b5 là \"chị\", E7 là \"mẹ\". Đây là cách dẫn về bậc VI \"một cách kịch tính\", nên trong sách cả bậc II lẫn bậc V đều được năm sao. Nghe so sánh: chỉ có Am, rồi Bm7b5 – E7(b9) – Am.", "tip": "\"Mẹ\" của Am: từ A đếm lên 5 tên nốt (A, B, C, D, E) là E, nên \"mẹ\" là E7.", "compare": {"a": {"label": "Chỉ có Am", "play": ["Am"]}, "b": {"label": "Bm7b5 – E7(b9) – Am", "play": ["Bm7b5", "E7(b9)", "Am"]}}}, {"text": "\"Bạn của mẹ\" ở đây là Bb7: cùng cấu trúc với E7, cách E7 một tritone (chuối – dứa), \"chỉ khác cao độ thôi\". Ví dụ đầu video, thầy đánh Bb7 với tay phải là hợp âm C (C E G): đó là Bb7(#11): tay phải C E G là ba nốt màu 9, #11, 13 của Bb7. Trong sách, các \"bạn của mẹ\" nằm ở dưới cùng trang E7, bass là Bb chứ không phải E; có thể đánh \"mẹ\" rồi mới đến \"bạn của mẹ\" (E7 rồi Bb7), nhưng thầy nói \"phần này khó\".", "tip": "Nốt gốc của \"bạn của mẹ\" là đích nhích lên nửa cung: A lên nửa cung là Bb. Tay phải hợp âm C: Bb lên một cung là C.", "play": ["Bm7b5", "Bb7(#11)", "Am"]}, {"text": "\"Chị\" nguyên mẫu là Bm7b5 (hợp âm thứ trên B có thêm nốt 7, nốt 5 hạ nửa cung): B D F A. Thầy viết nó thành Dm/B: tay trái bass B, tay phải hợp âm Dm (D F A). Đích là hợp âm thứ nên \"chị\" dùng m7b5, như đã học ở phần II liên quan (\"chị\" đi trước \"mẹ\" về hợp âm thứ là m7b5). Sách có dòng cơ bản cho đủ bảy nốt giai điệu, từ C đến B.", "tip": "Dm/B: B lên một quãng 3 là D, tay phải hợp âm Dm.", "show": "Dm/B", "play": ["Bm7b5", "E7(b9)", "Am"]}, {"text": "Bậc II về hợp âm thứ \"có thể biến đổi\": biến thể là Bm7 (B D F# A), chỉ nâng F lên F#. Thầy dùng Bm7 khi giai điệu là D hoặc A, hai nốt có trong cả Bm7b5 và Bm7. Trong II–V về F thì không có biến thể kiểu này. Nghe so sánh, giai điệu D trên cùng: Bm7b5 rồi Bm7.", "tip": "Từ Bm7b5 sang Bm7: tay phải chỉ đưa F lên nửa cung thành F#.", "compare": {"a": {"label": "Bm7b5 – E7(b9) – Am (D trên cùng)", "play": ["Bm7b5^D", "E7(b9)", "Am"]}, "b": {"label": "Bm7 – E7(b9) – Am (D trên cùng)", "play": ["Bm7^D", "E7(b9)", "Am"]}}}, {"text": "\"Mẹ\" E7 về cơ bản có b9, vì đích Am là hợp âm thứ, tối màu, nên màu của \"mẹ\" cũng phải tối. Nhớ lại: về F, \"mẹ\" dùng nốt màu tự nhiên 9, 13; về Am, \"mẹ\" dùng màu biến đổi b9, #9, b13. Trên trang E7 dòng nào cũng mang màu b9, nên thầy nói \"chỉ cần đánh tốt dòng trên cùng là đã rất hay rồi\" (dòng cơ bản đầu trang), nghe đã rất jazz. Giai điệu F chính là b9: E7(b9) = E G# B D F, F trên cùng.", "tip": "Nốt b9 là nốt gốc lên nửa cung: E lên nửa cung là F.", "compare": {"a": {"label": "Bm7b5 – E7 – Am", "play": ["Bm7b5", "E7", "Am"]}, "b": {"label": "Bm7b5 – E7(b9) – Am (F trên cùng)", "play": ["Bm7b5", "E7(b9)^F", "Am"]}}}, {"text": "Giai điệu A trên \"mẹ\" E7: A là nốt 4 của E, nên sách dùng E(sus4): E A B, A trên cùng, rồi về Am. Vì sao được: hợp âm treo không có bậc 3, nên nốt A không chọi với G#. Với giai điệu D, sách có thêm dòng D/E: lấy thế cơ bản có b9 rồi nâng nốt b9 (F) lên F#; dòng này hãy xem trong sách.", "tip": "Nốt 4 của E: đếm E, F#, G#, A, nốt thứ tư là A.", "play": ["Bm7b5", "E(sus4)^A", "Am"]}, {"text": "Giai điệu G trên E7: G là #9 của E7, và sách có hợp âm ba nốt phía trên: tay trái E7 (E G# D, từ mức tay 2), tay phải nguyên hợp âm C (C E G). Đó là E7(#9 b13): C là b13, G là #9, và G nằm trên cùng đúng bằng giai điệu. Hợp âm C là hợp âm quen tay trong giọng C, nên đây là cách dễ bấm mà ra màu rất căng.", "tip": "#9 cùng phím với bậc 3 của hợp âm thứ: Em có G, nên #9 của E7 là G. b13 là nốt 5 lên nửa cung: B lên nửa cung là C.", "play": ["Bm7b5", "E7(#9 b13)^G", "Am"]}, {"text": "Ý chính của video là nốt đích của giai điệu (target note): nốt rơi đúng lúc hợp âm vang lên. Nốt theo sau chỉ là nốt nối, \"gần như không liên quan trực tiếp\" đến hợp âm. Vì vậy chỉ nốt đích cần đúng thế bấm, các nốt sau đánh tự do. Sách luyện từng cặp nốt đích – nốt nối: E–D, F–E, G–F, A–G, B–A; ví dụ \"nốt bắt buộc phải chơi là Sol, thì chơi Sol–Fa\". Nghe: E7(#9 b13) với G trên cùng, rồi nốt F lướt theo.", "tip": "Cặp nốt đích – nốt nối đi xuống liền bậc: G xuống F, A xuống G.", "play": ["E7(#9 b13)^G", ["F4"], "Am"]}, {"text": "Ví dụ thầy chơi: giai điệu F rồi G trước khi về Am. Ở chỗ \"chị\", tìm dòng giai điệu F: Bm7b5 với F trên cùng, F lướt xuống E. Ở chỗ \"mẹ\", tìm dòng giai điệu G: E7(#9 b13) với G trên cùng, G lướt xuống F. \"Khi hợp âm đó xuất hiện, hợp âm phải vang lên đúng lúc\"; nốt nối có thể đi trước để lướt vào nốt chính, và \"vì nền đã đẹp, đánh lơi một chút vẫn nghe hay\". Nghe: F trên cùng lướt xuống E, rồi G trên cùng lướt xuống F, về Am.", "tip": "Bm7b5 bấm như Dm/B: tay phải D F A, đưa F lên trên cùng.", "play": [["B2", "|", "A3", "D4", "F4"], ["E4"], ["E2", "G#2", "D3", "|", "C4", "E4", "G4"], ["F4"], "Am"]}, {"text": "Bậc I, Am: sách có dòng cho đủ bảy nốt, có chỗ thêm nốt 9 (B) như Am9 = A C E G B. \"Dù các bạn thấy không hay, tôi vẫn thấy hay.\" Các nốt còn lại dùng song hành quãng 6 như bài trước (mỗi nốt giai điệu kèm một nốt thấp hơn nó một quãng 6 trong giọng C). Thầy kết: hãy biến các thế này thành mẫu của mình, và ở chỗ giai điệu chính xuất hiện thì dùng thế bấm thật chính xác.", "tip": "Nốt 9 của Am là A lên một cung: B.", "play": ["E7(b9)", "Am9"]}], "remember": ["Về Am: Bm7b5 (= Dm/B) – E7(b9) – Am; giai điệu D hoặc A thì \"chị\" đổi được thành Bm7.", "Đích thứ nên \"mẹ\" dùng màu biến đổi, cơ bản là b9 (E lên nửa cung là F); giai điệu G: E7(#9 b13), tay phải hợp âm C.", "Chỉ nốt đích của giai điệu (rơi đúng lúc hợp âm vang) cần đúng thế bấm; nốt nối theo sau đánh tự do."], "items": [{"chord": "E7(b9)", "to": "Am", "prog": ["Bm7b5", "E7(b9)", "Am"], "mel": "F"}, {"chord": "Bm7", "to": "E7(b9)", "prog": ["Bm7", "E7(b9)", "Am"], "mel": "D"}, {"chord": "E7(#9 b13)", "to": "Am", "prog": ["Bm7b5", "E7(#9 b13)", "Am"], "mel": "G"}], "quiz": [{"q": "Vì sao \"mẹ\" E7 trước Am về cơ bản có b9?", "choices": ["Đích Am là hợp âm thứ, tối màu, nên màu của \"mẹ\" cũng phải tối", "Vì b9 là nốt gốc của E7", "Vì Am là hợp âm trưởng", "Vì E7 không có nốt 3"], "answer": "Đích Am là hợp âm thứ, tối màu, nên màu của \"mẹ\" cũng phải tối", "why": "Đích trưởng thì \"mẹ\" dùng 9, 13; đích thứ thì dùng màu biến đổi b9, #9, b13, cơ bản là b9, tức nốt F của E7."}, {"q": "Giai điệu G – F trên E7 về Am: nốt nào cần đúng thế bấm?", "choices": ["G, nốt rơi đúng lúc E7 vang lên", "F, nốt theo sau", "Cả hai nốt như nhau", "Không nốt nào, cứ đánh E7 không thêm màu"], "answer": "G, nốt rơi đúng lúc E7 vang lên", "why": "G là nốt đích của giai điệu nên chọn thế có G trên cùng (E7(#9 b13)); F chỉ là nốt nối, đánh tự do."}, {"q": "Khi nào thầy đổi \"chị\" Bm7b5 thành Bm7?", "choices": ["Khi giai điệu là D hoặc A", "Khi giai điệu là F", "Khi đích là F", "Luôn luôn đổi"], "answer": "Khi giai điệu là D hoặc A", "why": "Bm7 chỉ khác Bm7b5 ở F#; giai điệu D hoặc A có trong cả hai, còn giai điệu F thì chọi với F# của Bm7."}]},
  {"id": "p1-04", "part": 1, "src": "Phildave 1 · Video 1-4", "title": "Video 1-4: II–V–I về Em, thiếu chỗ thì chỉ đánh \"mẹ\"", "teach": [{"text": "Về Em: Em là \"tôi\", F#m7b5 là \"chị\", B7 là \"mẹ\" — vẫn là \"chị, mẹ, tôi\" như về F, về Am. Em cũng là hợp âm thứ như Am, nên mọi thứ \"có tính chất giống\" II–V về Am, \"chỉ khác cao độ\": màu đã dùng trên E7 thì dùng tương tự trên B7. Nốt gốc F# không thuộc các phím trắng của giọng C, nên \"chị\" nghe \"rất tinh tế và thời thượng\". Nghe so sánh: chỉ có Em, rồi F#m7b5 – B7(b9) – Em.", "tip": "\"Mẹ\" của Em: từ E đếm lên 5 tên nốt (E, F#, G, A, B) là B, nên \"mẹ\" là B7.", "compare": {"a": {"label": "Chỉ có Em", "play": ["Em"]}, "b": {"label": "F#m7b5 – B7(b9) – Em", "play": ["F#m7b5", "B7(b9)", "Em"]}}}, {"text": "\"Chị\" F#m7b5 (F# A C E) viết thành Am/F#: tay trái bass F#, tay phải hợp âm Am (A C E). Sách có dòng cho giai điệu C, D, E, G, A. Ví dụ giai điệu A ở bậc II: tìm dòng A, tay phải đưa A lên trên cùng. \"Phải nhìn kỹ: melody nào thì nên dùng voicing nào.\"", "tip": "Am/F#: F# lên một quãng 3 là A, tay phải hợp âm Am.", "show": "Am/F#", "play": ["F#m7b5^A", "B7(b9)", "Em"]}, {"text": "Ô giai điệu F trên F#m7b5 bị để trống. Lý do: F nằm sát F# (nốt gốc của hợp âm), hai nốt liền nhau \"đụng nhau\", nên khó dùng hoặc không dùng được. Bấm thử F# và F cùng lúc để nghe tiếng chọi. Gặp giai điệu F ở chỗ này thì đừng cố dùng \"chị\" F#m7b5.", "tip": "F# và F là hai phím liền nhau (phím đen F# ngay trên phím trắng F).", "keys": ["F4", "F#4"]}, {"text": "\"Mẹ\" B7 về cơ bản có b9, vì đích Em là hợp âm thứ nên màu phải tối. Thầy bấm nốt 1, 3, 7 của B (B D# A) rồi thêm b9 (C); đủ tên là B7(b9) = B D# F# A C. \"Miễn là flat 9 thì đều hợp\", \"rất jazz\"; bên trong trang còn có b13, #9 và các màu tương tự. Giai điệu C chính là b9, nên C nằm trên cùng.", "tip": "Nốt b9 là nốt gốc lên nửa cung: B lên nửa cung là C.", "play": ["F#m7b5", "B7(b9)^C", "Em"]}, {"text": "Giai điệu B trên \"mẹ\" B7: sách có dòng b13, tức B7(b13) = B D# A G, thêm B trên cùng. G là b13 của B7, đúng màu tối hợp với đích thứ Em. Xuống dưới sách còn có sus4 rồi giải quyết sus4, và dòng A/B; hai dòng này hãy xem trong sách.", "tip": "Nốt b13 là nốt 5 lên nửa cung: F# lên nửa cung là G.", "play": ["F#m7b5", "B7(b13)^B", "Em"]}, {"text": "\"Bạn của mẹ\" của B7 là F7: đếm chuối – dứa từ B ra F, F7 cùng tritone với B7 (A và D#, viết là Eb trong F7). Thầy dùng F7 thay hẳn cho B7. Ví dụ thầy chơi: F#m7b5, đáng lẽ đến B7 thì thay bằng F7, rồi về Em; F7 trượt nửa cung xuống Em.", "tip": "Nốt gốc của \"bạn của mẹ\" là đích nhích lên nửa cung: E lên nửa cung là F.", "compare": {"a": {"label": "F#m7b5 – B7(b9) – Em", "play": ["F#m7b5", "B7(b9)", "Em"]}, "b": {"label": "F#m7b5 – F7 – Em", "play": ["F#m7b5", "F7", "Em"]}}}, {"text": "\"Không nhất thiết lúc nào cũng phải chơi đủ II–V–I.\" II–V dùng khi có đủ chỗ, \"ví dụ có hai phách cho mỗi hợp âm\": trước F là Gm7 hai phách, C7 hai phách. Thiếu chỗ thì bỏ \"chị\", chỉ đánh \"mẹ\": về F là C7, về Am là E7, về Em là B7. Lý do: đa số các đoạn đi rất nhanh, \"chỉ cần xử lý tốt bậc V là đã rất ổn\"; \"không cần nhìn bậc II, hãy nhìn bậc V\".", "compare": {"a": {"label": "Đủ chỗ: F#m7b5 – B7(b9) – Em", "play": ["F#m7b5", "B7(b9)", "Em"]}, "b": {"label": "Thiếu chỗ: B7(b9) – Em", "play": ["B7(b9)", "Em"]}}}, {"text": "Bậc I, Em: sách có dòng cho giai điệu C, D, E, G, A, B; những nốt còn lại dùng song hành quãng 6, \"không khó lắm\". Song hành quãng 6 nhắc lại: tay phải đánh nốt giai điệu kèm một nốt thấp hơn nó một quãng 6 trong giọng C, tay trái giữ bass E. Ví dụ giai điệu B, A, G: nốt dưới là D, C, B.", "tip": "Tìm nốt dưới: từ nốt giai điệu đếm xuống 6 tên nốt, như B, A, G, F, E, D.", "play": [["E2", "|", "D4", "B4"], ["E2", "|", "C4", "A4"], ["E2", "|", "B3", "G4"]]}], "remember": ["Về Em: F#m7b5 (= Am/F#) – B7(b9) – Em; dùng lại các màu của E7 về Am, chỉ khác cao độ.", "Giai điệu F chọi với F# nên ô đó để trống; \"bạn của mẹ\" của B7 là F7.", "Mỗi hợp âm cần khoảng hai phách; thiếu chỗ thì bỏ \"chị\", chỉ đánh B7."], "items": [{"chord": "F#m7b5", "to": "B7(b9)", "prog": ["F#m7b5", "B7(b9)", "Em"], "mel": "A"}, {"chord": "B7(b9)", "to": "Em", "prog": ["B7(b9)", "Em"], "mel": "C"}], "quiz": [{"q": "Vì sao trong sách, ô giai điệu F ở \"chị\" F#m7b5 để trống?", "choices": ["F nằm sát nốt gốc F# nên hai nốt chọi nhau", "F là nốt gốc của F#m7b5", "F không thuộc giọng C", "F là nốt sao nên phải đánh bằng tay trái"], "answer": "F nằm sát nốt gốc F# nên hai nốt chọi nhau", "why": "F và F# là hai phím liền nhau; thầy nói \"Fa và F# đụng nhau\", nên không có thế bấm nên dùng cho ô đó."}, {"q": "Câu nhạc đi rất nhanh, không đủ khoảng hai phách cho mỗi hợp âm trước Em. Thầy khuyên gì?", "choices": ["Bỏ \"chị\", chỉ đánh B7", "Bỏ B7, chỉ đánh F#m7b5", "Đánh cả hai, mỗi hợp âm nửa phách", "Không đánh gì, giữ nguyên Em"], "answer": "Bỏ \"chị\", chỉ đánh B7", "why": "Bậc V quan trọng hơn bậc II: thiếu chỗ thì chỉ đánh \"mẹ\" (về Em là B7) mà vẫn giữ được không khí."}]},
  {"id": "p1-06", "part": 1, "src": "Phildave 1 · Video 1-6", "title": "Video 1-6: II–V–I về G7, hợp âm 7 về hợp âm 7", "teach": [{"text": "Đích lần này là G7, một hợp âm 7, và \"mẹ\" của nó là D7, cũng là hợp âm 7: hai hợp âm \"cùng dạng\". Các đích khác thì khác dạng với \"mẹ\": G7 về Cmaj7, C7 về F, B7 về Em (một trưởng, một thứ). Hợp âm 7 dẫn đến hợp âm 7 (extended dominant 7) nên đây là II–V \"mơ hồ nhất\": tai không chắc đâu là chỗ dừng. Nghe so sánh: G7 về Cmaj7, rồi D7 về G7.", "tip": "\"Mẹ\" của G7: từ G đếm lên 5 tên nốt (G, A, B, C, D) là D, nên \"mẹ\" là D7.", "compare": {"a": {"label": "G7 – Cmaj7", "play": ["G7", "Cmaj7"]}, "b": {"label": "D7 – G7", "play": ["D7", "G7"]}}}, {"text": "\"Chị\" của G7 là Am7, nhưng Am7 có sẵn trong giọng C (bậc VI) nên \"không lạ tai\", vì vậy bậc II ở đây thường không dùng nhiều. \"Không có nghĩa là tuyệt đối không được dùng\", nhưng muốn bậc II có ý nghĩa hơn thì dùng Am7b5 (hạ E xuống Eb): nó tạo cảm giác hơi mơ hồ. Giai điệu cho bậc II chọn trong C, D, G, A, B. \"Trong trường hợp này, chỉ cần chơi D7 thật tốt là được.\"", "tip": "Từ Am7 sang Am7b5: chỉ hạ nốt 5 (E) xuống nửa cung thành Eb.", "compare": {"a": {"label": "Am7 – D7 – G7", "play": ["Am7", "D7", "G7"]}, "b": {"label": "Am7b5 – D7 – G7", "play": ["Am7b5", "D7", "G7"]}}}, {"text": "Nốt sao của \"mẹ\" D7: D7 có D F# A C, nên nốt ngoài hợp âm bắt đầu từ E; E và B là hai nốt nên đánh dấu sao. Giai điệu E là nốt 9 của D7: thầy dùng D9 \"rất nhiều\", dù sách \"hình như chưa ghi\" dòng này, nên thầy dặn ghi thêm vào sách. Giai điệu B là nốt 13 (\"ta không gọi là bậc VI mà gọi là 13\"): D13, nốt thầy dùng nhiều nhất. C là bậc 7 của D7, dùng cũng không lạ, nhưng \"đừng dùng chord tone làm melody quá nhiều\".", "tip": "Nốt 9 là nốt gốc lên một cung: D lên một cung là E. Nốt 13 là nốt 5 lên một cung: A lên một cung là B.", "compare": {"a": {"label": "Am7 – D9 – G7 (E trên cùng)", "play": ["Am7", "D9^E", "G7"]}, "b": {"label": "D13 – G7 (B trên cùng)", "play": ["D13^B", "G7"]}}}, {"text": "Trên D7 thầy hay đổi màu lệch thời điểm: đánh 13 trước, \"sau một chút\" hạ 13 xuống b13, tạo màu altered. Line thầy chơi: D7 với giai điệu E trên cùng và nốt 13 (B) ở bên dưới, rồi hạ B xuống Bb (D7(b13)) trong khi giai điệu rơi về D, rồi đến F/G. \"Cách này cũng được dùng khá nhiều.\"", "tip": "Nốt b13 là nốt 5 lên nửa cung: A lên nửa cung là Bb, tức B hạ nửa cung.", "play": ["D7(13)^E", ["D2", "C3", "|", "F#4", "Bb4", "D5"], "F/G^C"]}, {"text": "\"Bạn của mẹ\" của D7 là Ab7: đếm chuối – dứa từ D ra Ab. Ab7 trượt nửa cung xuống G7, dùng thay cho D7. Trong sách các dòng Ab7 nằm ở dưới cùng: chọn dòng có nốt giai điệu tương ứng rồi chơi.", "tip": "Nốt gốc của \"bạn của mẹ\" là đích nhích lên nửa cung: G lên nửa cung là Ab.", "play": ["Am7", "Ab7", "G7"]}, {"text": "Bậc I, G7: \"không nên đánh G7 nguyên dạng… không nên đưa bậc 3 ra ngay\". Phần lớn thầy đánh F/G: tay trái bass G, tay phải hợp âm F (F A C), rồi thêm nốt giai điệu. Giai điệu D, E, F, G, A đều có hợp âm F ở phía trên. Chỉ khi giai điệu là B, bậc 3 của G, thì \"đương nhiên\" phải đánh G7 cho lộ bậc 3.", "tip": "F/G: G lùi một cung là F, tay phải hợp âm F.", "compare": {"a": {"label": "D7 – G7", "play": ["D7", "G7"]}, "b": {"label": "D7 – F/G", "play": ["D7", "F/G"]}}}, {"text": "Biến đổi lệch thời điểm ở bậc I: đánh F/G rồi \"chỉ cần thêm một dấu giáng nữa vào nốt La\": A xuống Ab, thành Fm/G. Làm được khi giai điệu là D, E, F, G; giai điệu A thì không đổi được, vì A chính là giai điệu. Fm là hợp âm bậc IV của C thứ, mượn sang dùng, \"nghe hay thì dùng\", như kiểu kết Amen.", "tip": "Từ F/G sang Fm/G: tay trái giữ G, tay phải chỉ hạ A xuống nửa cung thành Ab.", "play": ["D7", "F/G^F", "Fm/G^F"]}, {"text": "Giai điệu C ở bậc I thì \"ngay từ đầu có thể đánh Fm/G\": C có sẵn trong Fm (F Ab C), nên tay phải hợp âm Fm, C trên cùng. Vì sao hay: không cần đợi đổi màu, màu mượn từ C thứ vang ngay khi về G. Thầy dặn \"thay đổi hợp âm càng nhiều càng tốt\".", "tip": "Fm/G: tay trái G, tay phải hợp âm Fm (F Ab C), đưa C lên trên cùng.", "play": ["D7", "F/G", "Fm/G^C"]}], "remember": ["Về G7: hợp âm 7 về hợp âm 7 nên mơ hồ nhất; \"chị\" Am7 ít dùng, Am7b5 có ý nghĩa hơn; chơi D7 thật tốt là đủ.", "Nốt sao của D7: E (D9, D lên một cung) và B (D13, A lên một cung); có thể đổi 13 thành b13 ngay sau.", "Bậc I: F/G thay cho G7, giáng A thành Fm/G; giai điệu B mới đánh G7 lộ bậc 3, giai điệu C dùng Fm/G ngay."], "items": [{"chord": "D9", "to": "G7", "prog": ["Am7", "D9", "G7"], "mel": "E"}, {"chord": "D13", "to": "G7", "prog": ["D13", "G7"], "mel": "B"}, {"chord": "Fm/G", "rel": "modal", "prog": ["D7", "F/G", "Fm/G"], "mel": "C"}], "quiz": [{"q": "Vì sao II–V về G7 được thầy gọi là \"mơ hồ nhất\"?", "choices": ["Vì \"mẹ\" D7 và đích G7 đều là hợp âm 7", "Vì G7 là hợp âm thứ", "Vì D7 không có tritone", "Vì G7 nằm ngoài giọng C"], "answer": "Vì \"mẹ\" D7 và đích G7 đều là hợp âm 7", "why": "Các đích khác đều khác dạng với \"mẹ\" (maj7, trưởng, thứ); D7 về G7 là hợp âm 7 về hợp âm 7, nên tai khó biết đâu là chỗ dừng."}, {"q": "Ở bậc I, từ F/G hạ A thành Ab để có Fm/G. Giai điệu nào thì không làm được?", "choices": ["A", "D", "F", "G"], "answer": "A", "why": "A chính là nốt bị hạ xuống Ab; giai điệu A thì A phải vang, nên không đổi sang Fm/G được."}, {"q": "Vì sao thầy thường đánh F/G thay cho G7 nguyên dạng ở bậc I?", "choices": ["Để không đưa bậc 3 (B) của G ra ngay", "Vì F/G có nhiều tritone hơn G7", "Vì G7 không có trong giọng C", "Vì F/G là hợp âm thứ"], "answer": "Để không đưa bậc 3 (B) của G ra ngay", "why": "Thầy nói không nên đưa bậc 3 ra ngay; chỉ khi giai điệu là B (bậc 3 của G) mới đánh G7 cho lộ bậc 3."}]},
  {"id": "p1-07", "part": 1, "src": "Phildave 1 · Video 1-7", "title": "Video 1-7: tổng kết sáu II–V và II–V–I về C", "teach": [{"text": "Tổng kết các II–V trong giọng C: về F là Gm7 – C7; về Am là Bm7b5 – E7; về Em là F#m7b5 – B7; về Dm là Em7b5 – A7; về G7 là Am7 – D7; về C là Dm7 – G7. Thầy nói hấp dẫn nhất là về F và về Am, khó hơn một chút là về Em. Về Dm thì bậc II \"cũng không dùng nhiều\", \"chỉ riêng A7 thôi đã có rất nhiều thứ để làm\": màu altered, \"rất lãng mạn\". Nghe so sánh hai II–V hấp dẫn nhất: về F (sáng) và về Am (tối).", "compare": {"a": {"label": "Gm7 – C7 – F", "play": ["Gm7", "C7", "F"]}, "b": {"label": "Bm7b5 – E7 – Am", "play": ["Bm7b5", "E7", "Am"]}}}, {"text": "Nguồn gốc của cả phần này là C, bậc I gốc, và G7 giữ vai trò rất lớn. \"Chị\" về C là Dm7. Dm là hợp âm thay thế của F; F giáng A thành Fm được, nên Dm7 cũng giáng A được, thành Dm7b5 (D F Ab C), \"cách này dùng nhiều lắm\". Giai điệu C, D, E thì được; giai điệu A thì không, vì A và Ab không cùng vang được. Nghe so sánh: Dm7 rồi Dm7b5 với C trên cùng.", "tip": "Từ Dm7 sang Dm7b5: chỉ hạ A xuống nửa cung thành Ab.", "compare": {"a": {"label": "Dm7 – G7 – C", "play": ["Dm7", "G7", "C"]}, "b": {"label": "Dm7b5 – G7 – C (C trên cùng)", "play": ["Dm7b5^C", "G7", "C"]}}}, {"text": "\"Mẹ\" G7 trong đoạn kết II–V–I: \"không để G rơi xuống một cách quá đơn giản\". Fm/G có thể xuất hiện ngay: tay trái G, tay phải hợp âm Fm (F Ab C); Fm là hợp âm bậc IV của C thứ, mượn sang, nhưng \"chủ thể ở đây là G\". So với G7(b9) (G B D F Ab): G7(b9) có B, bậc 3 của G, còn Fm/G thì không có B. Vì vậy Fm/G \"giống như một cảm giác kết câu… kiểu kết thúc rồi\", còn G7(b9) \"jazz hơn\".", "tip": "Nốt b9 của G7 là G lên nửa cung: Ab, có trong cả hai hợp âm.", "compare": {"a": {"label": "Dm7 – Fm/G – C", "play": ["Dm7", "Fm/G", "C"]}, "b": {"label": "Dm7 – G7(b9) – C", "play": ["Dm7", "G7(b9)", "C"]}}}, {"text": "Cách thứ ba là F/G, hợp âm đã gặp ở bài trước: tay trái G, tay phải hợp âm F (F A C), không có B nên G nghe treo, nhẹ hơn. Ba cách cho \"mẹ\" về C trong đoạn kết là F/G, Fm/G và G7(b9), mỗi cách một màu. Nghe lần lượt cả ba, cùng về C.", "tip": "F/G: tay trái G, tay phải hợp âm F (G lùi một cung là F).", "play": ["F/G", "C", "Fm/G", "C", "G7(b9)", "C"]}, {"text": "\"Bạn của mẹ\" của G7 là Db7 (\"Nhớ nhé, Db7 này\"): có dạng đi thẳng Db7 về C, và có dạng II–V–I. Thầy còn có thế Db7 với nốt Bb trên cùng, nhưng sách không ghi vì Bb không thuộc các phím trắng của giọng C, nên hãy xem video. Db7 trượt nửa cung xuống C, nghe rất jazz ở đoạn kết.", "tip": "Nốt gốc của \"bạn của mẹ\" là đích nhích lên nửa cung: C lên nửa cung là Db.", "play": ["Dm7", "Db7", "C"]}, {"text": "Db7 vốn đã là hợp âm thay thế, \"nó có II không? Và nó vẫn có II\": Abm7 – Db7 – C. Abm7 – Db7 bình thường là II–V về Gb, \"nhưng kỳ lạ là nó lại rơi về C\". Lý do: như G7 tách ra được thành Dm7 – G7, \"bạn của mẹ\" cũng tách ra được thành \"chị\" của nó rồi đến nó. Thầy nói Abm7 – Db7 rất hợp với bậc I.", "tip": "\"Chị\" của Db7: từ Db đếm lên 5 tên nốt (Db, Eb, F, Gb, Ab) là Ab, nên là Abm7.", "play": ["Abm7", "Db7", "C"]}, {"text": "Cách này áp dụng cho đích khác: về F, \"mẹ\" là C7, \"bạn của mẹ\" là Gb7; coi Gb7 là bậc V thì \"chị\" là Dbm7, thành Dbm7 – Gb7 – F. Nhưng thầy nói \"có chỗ hợp, không hợp\", nên nghe thử rồi mới dùng. Phần này không đưa vào sách thành lý thuyết chính vì \"nhu cầu quá ít\"; hãy thỉnh thoảng tận dụng, vì kiểu \"bạn của mẹ\" là phong cách Phildave hay dùng.", "tip": "\"Chị\" của Gb7: từ Gb đếm lên 5 tên nốt (Gb, Ab, Bb, Cb, Db) là Db, nên là Dbm7.", "compare": {"a": {"label": "Abm7 – Db7 – C", "play": ["Abm7", "Db7", "C"]}, "b": {"label": "Dbm7 – Gb7 – F", "play": ["Dbm7", "Gb7", "F"]}}}, {"text": "Bậc I, C: giai điệu D, E, F, G, A, B \"các bạn cứ đánh như vậy\", phần song hành quãng 6 giữ nguyên như các bài trước: tay phải nốt giai điệu kèm một nốt thấp hơn một quãng 6, tay trái bass C. Ví dụ giai điệu C, B, A: nốt dưới là E, D, C. Đến đây là hết phần II–V cho sáu hợp âm trong giọng (C, Dm, Em, F, G, Am); bài kế của thầy là hợp âm mượn (video đó không có trong bộ này), nên app đi tiếp sang giọng D.", "tip": "Tìm nốt dưới: từ nốt giai điệu đếm xuống 6 tên nốt, như C, B, A, G, F, E.", "play": [["C3", "|", "E4", "C5"], ["C3", "|", "D4", "B4"], ["C3", "|", "C4", "A4"]]}], "remember": ["Sáu đích trong giọng C: F (Gm7–C7), Am (Bm7b5–E7), Em (F#m7b5–B7), Dm (Em7b5–A7), G7 (Am7–D7), C (Dm7–G7); hay nhất là về F và Am.", "Về C: Dm7 giáng A thành Dm7b5 (giai điệu C, D, E; không được với A); \"mẹ\" có thể là F/G, Fm/G (kết hẳn) hay G7(b9) (jazz hơn).", "\"Bạn của mẹ\" Db7 cũng có \"chị\": Abm7 – Db7 – C."], "items": [{"chord": "Dm7b5", "to": "G7", "prog": ["Dm7b5", "G7", "C"], "mel": "C"}, {"chord": "Fm/G", "to": "C", "prog": ["Dm7", "Fm/G", "C"]}, {"chord": "Abm7", "to": "Db7", "prog": ["Abm7", "Db7", "C"]}], "quiz": [{"q": "Vì sao Dm7 giáng A thành Dm7b5 không dùng được khi giai điệu là A?", "choices": ["Vì A và Ab không cùng vang được", "Vì A không thuộc giọng C", "Vì Dm7b5 là hợp âm trưởng", "Vì A là nốt gốc của Dm7"], "answer": "Vì A và Ab không cùng vang được", "why": "Dm7b5 có Ab thay cho A; giai điệu A sẽ chọi với Ab, nên chỉ dùng Dm7b5 với giai điệu C, D, E."}, {"q": "Abm7 – Db7 bình thường là II–V về đâu, và thầy cho nó về đâu?", "choices": ["Bình thường về Gb, thầy cho về C", "Bình thường về C, thầy cho về Gb", "Bình thường về Ab, thầy cho về F", "Bình thường về Db, thầy cho về G7"], "answer": "Bình thường về Gb, thầy cho về C", "why": "Db7 là \"bạn của mẹ\" của C (thay G7), và Abm7 là \"chị\" của Db7, nên cặp này trượt nửa cung xuống C."}, {"q": "Ở đoạn kết về C, Fm/G và G7(b9) khác nhau thế nào?", "choices": ["Fm/G không có B nên nghe như kết hẳn; G7(b9) có B nên nghe jazz hơn", "Fm/G có B, G7(b9) thì không", "Hai hợp âm giống hệt nhau", "G7(b9) không có nốt Ab"], "answer": "Fm/G không có B nên nghe như kết hẳn; G7(b9) có B nên nghe jazz hơn", "why": "G7(b9) = G B D F Ab có bậc 3 B; Fm/G = G F Ab C không có B, thầy tả là cảm giác \"kết thúc rồi\"."}]},
  {"id": "p1-09", "part": 1, "src": "Phildave 1 · Video 1-9", "key": "D", "title": "Video 1-9: giọng D, chèn II–V về G ở phách yếu", "teach": [{"text": "Giọng D có hai dấu thăng: F# và C#. Bảy hợp âm trong giọng D là D, Em, F#m, G, A7, Bm và C#m7b5, theo mẹo quen thuộc: bậc 1, 4, 5 là hợp âm trưởng (D, G, A), bậc 2, 3, 6 là hợp âm thứ (Em, F#m, Bm), bậc 7 là m7b5; bậc V viết thành hợp âm 7 là A7. Biết bảy hợp âm này thì mới biết đích nào nằm trong giọng để dẫn II–V về. Nghe bảy hợp âm của giọng D.", "tip": "Âm giai D: đi từ D lên theo phím trắng, chỉ đổi F thành F# và C thành C#.", "play": ["D", "Em", "F#m", "G", "A7", "Bm", "C#m7b5"]}, {"text": "Thầy dặn: \"Đừng xem giọng D trước\". Phải nắm kỹ phần giọng C (trang 4, II–V về F) rồi mới sang, vì ở giọng D \"chỉ là key được nâng lên thôi\", cách làm không khác gì. Trong mỗi giọng, trang được đánh dấu năm sao đứng đầu tiên: ở giọng D đó là II–V về G. G là bậc IV của D, giống F là bậc IV của C, nên làm y như video 1-2: G là \"tôi\", Am7 là \"chị\", D7 là \"mẹ\". Nghe so sánh: chỉ có G, rồi Am7 – D7 – G.", "tip": "\"Mẹ\" của G: đếm G, A, B, C, D, nốt thứ năm là D, nên \"mẹ\" là D7. \"Chị\" Am7: G lên một cung là A.", "compare": {"a": {"label": "Chỉ có G", "play": ["G"]}, "b": {"label": "Am7 – D7 – G", "play": ["Am7", "D7", "G"]}}}, {"text": "Chèn II–V vào bài ở đâu: trong bản nhạc, hợp âm thường được ghi ở phách mạnh, tức phách đầu của mỗi ô nhịp; các phách đến sau nó trong ô là phách yếu. Ví dụ thầy chụp màn hình: bài ở giọng D đi D, rồi G, rồi Bm, sang dòng hai là Em, rồi lại G. Ngay trước mỗi chỗ có G, ta chèn \"chị\" Am7 rồi \"mẹ\" D7 vào các phách yếu ở giữa. Vì sao được: hợp âm ghi sẵn vẫn rơi đúng phách mạnh, II–V chỉ lấp khoảng trống trước đó để kéo về G. Nghe: D, rồi Am7 – D7 chen vào trước G.", "play": ["D", "Am7", "D7", "G"]}, {"text": "Thầy nói \"chị\" Am7 thì không khó, còn \"mẹ\" D7 có nhiều dạng: trang D7 có thế bấm cơ bản cho mọi nốt giai điệu C, D, E, F#, G, A, B. Vì bậc V quan trọng hơn bậc II, hãy tập kỹ trang D7: nghe ca sĩ hát nốt nào ở chỗ \"mẹ\" thì tìm đúng dòng có nốt đó. Ví dụ giai điệu F#: F# là bậc 3 của D7 (D F# A C), có sẵn trong hợp âm, nên D7 với F# trên cùng. Nghe: Am7 – D7 (F# trên cùng) – G.", "tip": "D7 bấm từ D: D, F#, A, rồi C (D lùi một cung là C).", "play": ["Am7", "D7^F#", "G"]}, {"text": "\"Bạn của mẹ\" (hợp âm 7 cách \"mẹ\" một tritone) của D7 là Ab7: đếm chuối – dứa từ D ra Ab. Ab7 có cùng tritone với D7 (C và F#, trong Ab7 viết là C và Gb), nên thay được D7, rồi trượt nửa cung xuống G. Trong sách, các dòng Ab7 nằm ở phía dưới trang D7. Nghe so sánh: Am7 – D7 – G, rồi Am7 – Ab7 – G.", "tip": "Nốt gốc của \"bạn của mẹ\" là đích nhích lên nửa cung: G lên nửa cung là Ab.", "compare": {"a": {"label": "Am7 – D7 – G", "play": ["Am7", "D7", "G"]}, "b": {"label": "Am7 – Ab7 – G", "play": ["Am7", "Ab7", "G"]}}}, {"text": "Thầy nói để đánh mà không cản trở giai điệu thì Ab7 chỉ có ba ô; hai ô đọc được là giai điệu F# và giai điệu B. Ô để trống nghĩa là không có thế bấm được khuyến nghị. Giai điệu F# là nốt 7 của Ab7 (viết Gb, cùng phím F#), có sẵn trong hợp âm nên đặt trên cùng được. Ô giai điệu B hãy xem trong sách. Nghe: Am7 – Ab7 (F# trên cùng) – G.", "tip": "Nốt 7 của hợp âm 7 là nốt gốc lùi một cung: Ab lùi một cung là Gb, cùng phím với F#.", "play": ["Am7", "Ab7^F#", "G"]}], "remember": ["Giọng D (F#, C#): D, Em, F#m, G, A7, Bm, C#m7b5. Học giọng C trước, giọng D \"chỉ là nâng key\".", "Về G (bậc IV, trang năm sao): Am7 – D7 – G; hợp âm ghi ở phách mạnh, Am7 – D7 chèn vào phách yếu ngay trước G.", "\"Bạn của mẹ\" của D7 là Ab7 (G lên nửa cung); Ab7 chỉ có ba ô, như giai điệu F# (trong Ab7 viết Gb, cùng phím) và B; ô trống là không có thế bấm nên dùng."], "items": [{"chord": "Am7", "to": "D7", "prog": ["Am7", "D7", "G"]}, {"chord": "Ab7", "to": "G", "prog": ["Am7", "Ab7", "G"], "mel": "F#"}], "quiz": [{"q": "Trong một bài giọng D, vì sao chèn Am7 – D7 vào phách yếu ngay trước G?", "choices": ["G được ghi ở phách mạnh; Am7 – D7 lấp các phách yếu trước đó để kéo về G", "Vì Am7 – D7 phải thay hẳn cho G ở phách mạnh", "Vì phách yếu là phách đầu của ô nhịp", "Vì Am7 và D7 là hợp âm chủ của giọng D"], "answer": "G được ghi ở phách mạnh; Am7 – D7 lấp các phách yếu trước đó để kéo về G", "why": "Hợp âm thường được ghi ở phách mạnh (phách đầu ô nhịp); II–V của G chèn vào các phách yếu ngay trước nó, nên G vẫn rơi đúng phách mạnh."}, {"q": "Vì sao thầy dặn đừng xem giọng D trước giọng C?", "choices": ["Giọng D chỉ là giọng C được nâng key, cách làm giống hệt", "Vì giọng D không có II–V", "Vì giọng D không có hợp âm thay thế", "Vì giọng D dùng hợp âm khác hẳn giọng C"], "answer": "Giọng D chỉ là giọng C được nâng key, cách làm giống hệt", "why": "Thầy nói ở giọng D \"chỉ là key được nâng lên thôi\": II–V về G làm y như II–V về F ở giọng C, nên phải hiểu kỹ giọng C trước."}, {"q": "Ô giai điệu bị để trống ở dòng Ab7 nghĩa là gì?", "choices": ["Không có thế bấm Ab7 được khuyến nghị cho nốt giai điệu đó", "Đánh Ab7 mà không cần giai điệu", "Thế bấm giống hệt ô bên cạnh", "Nốt đó là nốt sao của Ab7"], "answer": "Không có thế bấm Ab7 được khuyến nghị cho nốt giai điệu đó", "why": "Thầy nói ô bị để trống là không có thế bấm được khuyến nghị; Ab7 chỉ có ba ô dùng được mà không cản giai điệu, như giai điệu F# và B."}]},
  {"id": "p1-10", "part": 1, "src": "Phildave 1 · Video 1-10", "key": "E", "title": "Video 1-10: giọng E, sáu đích theo thứ tự trang", "teach": [{"text": "Giọng E có bốn dấu thăng: F#, C#, G#, D#. Thầy nói \"giọng E khó hơn các bạn tưởng đấy\". Bảy hợp âm trong giọng E là E, F#m, G#m, A, B7, C#m và D#m7b5, theo mẹo quen thuộc: bậc 1, 4, 5 trưởng, bậc 2, 3, 6 thứ, bậc 7 là m7b5. Biết bảy hợp âm này thì mới biết đích nào để dẫn II–V về. Nghe bảy hợp âm của giọng E.", "tip": "Âm giai E: đi từ E lên theo phím trắng, đổi F, C, G, D thành F#, C#, G#, D#.", "play": ["E", "F#m", "G#m", "A", "B7", "C#m", "D#m7b5"]}, {"text": "Thầy dặn ít nhất phải nắm: bậc I, IV, V là hợp âm trưởng (E, A và B, viết thành hợp âm 7 là B7), bậc II, III, VI là hợp âm thứ (F#m, G#m, C#m). Đó là sáu hợp âm làm đích được trong giọng E, giống C, Dm, Em, F, G7, Am trong giọng C; bậc VII (D#m7b5) không làm đích. Mỗi cặp trang trong sách dẫn II–V về một trong sáu đích này, nên chưa thuộc chúng thì chưa tra sách được. Nghe sáu đích: E, F#m, G#m, A, B7, C#m.", "play": ["E", "F#m", "G#m", "A", "B7", "C#m"]}, {"text": "Trang đầu của giọng E là II–V về A. A là bậc IV, giống F trong giọng C, nên \"chị\" là Bm7, \"mẹ\" là E7, rồi về A. Thầy dặn lại: phải xem kỹ trang 4 đầu tiên của giọng C (II–V về F); hiểu thật kỹ giọng C thì sang giọng E mới dễ hiểu. Nghe so sánh: chỉ có A, rồi Bm7 – E7 – A.", "tip": "\"Mẹ\" của A: đếm A, B, C#, D, E, nốt thứ năm là E, nên \"mẹ\" là E7. \"Chị\" Bm7: A lên một cung là B.", "compare": {"a": {"label": "Chỉ có A", "play": ["A"]}, "b": {"label": "Bm7 – E7 – A", "play": ["Bm7", "E7", "A"]}}}, {"text": "Các trang tiếp theo đi theo thứ tự: về C#m (bậc VI), về G#m (bậc III), về F#m (bậc II), về B7 (bậc V), cuối cùng về E (bậc I). Thứ tự này giống các video giọng C, nơi ta cũng đi về F (IV), Am (VI), Em (III) trước, rồi G7 (V) và C (I); riêng trang về bậc II (ở giọng C là Dm) không có video riêng trong bộ này. Thầy nói C#m là bậc VI, \"màu tối hơn\", giống khi trong giọng C ta đi về Am. Nghe sáu đích theo thứ tự trang: A, C#m, G#m, F#m, B7, E.", "play": ["A", "C#m", "G#m", "F#m", "B7", "E"]}, {"text": "Ở các trang về C#m, G#m, F#m và B7, cứ dùng cùng công thức đã học ở giọng C: trước đích là \"chị\" (bậc II của đích), rồi \"mẹ\" (hợp âm 7 trên bậc V của đích); đích thứ thì \"chị\" là m7b5 và \"mẹ\" mang màu tối. Giọng E không có mã QR riêng, nên thầy dặn \"cứ áp dụng giống như những gì đã hiểu trong giọng C\". Ví dụ đích C#m: đây là \"tôi\", màu tối như Am trong giọng C, nên trước nó là \"chị\" m7b5 và \"mẹ\" màu tối. Bấm thử C#m.", "tip": "Tìm \"mẹ\" của đích nào cũng vậy: từ nốt gốc của đích đếm lên 5 tên nốt.", "show": "C#m"}, {"text": "Trang cuối là II–V về E, bậc I: \"chị\" F#m7, \"mẹ\" B7, rồi E. Đây là II–V về hợp âm chủ, giống Dm7 – G7 – C trong giọng C, nên nghe như về nhà, kết bài. Nghe so sánh: chỉ có E, rồi F#m7 – B7 – E.", "tip": "\"Mẹ\" của E: đếm E, F#, G#, A, B, nốt thứ năm là B, nên \"mẹ\" là B7.", "compare": {"a": {"label": "Chỉ có E", "play": ["E"]}, "b": {"label": "F#m7 – B7 – E", "play": ["F#m7", "B7", "E"]}}}], "remember": ["Giọng E (F#, C#, G#, D#): E, F#m, G#m, A, B7, C#m, D#m7b5; ít nhất nắm I, IV, V trưởng và II, III, VI thứ.", "Thứ tự trang: về A, C#m, G#m, F#m, B7, E. Về A: Bm7 – E7 – A; về E: F#m7 – B7 – E.", "Các đích khác dùng cùng công thức như giọng C (giọng E không có mã QR riêng)."], "items": [{"chord": "E7", "to": "A", "prog": ["Bm7", "E7", "A"]}, {"chord": "B7", "to": "E", "prog": ["F#m7", "B7", "E"]}], "quiz": [{"q": "Giọng E không có mã QR riêng. Thầy dặn làm gì ở các trang về C#m, G#m, F#m, B7?", "choices": ["Áp dụng cùng công thức \"chị\" – \"mẹ\" – \"tôi\" đã hiểu ở giọng C", "Bỏ qua, các đích đó không dùng được", "Chỉ đánh hợp âm đích, không bao giờ có II–V", "Dùng nguyên các hợp âm của giọng C, không đổi cao độ"], "answer": "Áp dụng cùng công thức \"chị\" – \"mẹ\" – \"tôi\" đã hiểu ở giọng C", "why": "Thầy nói \"cứ áp dụng giống như những gì đã hiểu trong giọng C\": trước mỗi đích là \"chị\" rồi \"mẹ\", chỉ khác cao độ."}, {"q": "Vì sao II–V về A ở giọng E là Bm7 – E7?", "choices": ["A là đích; Bm7 là bậc II của A, E7 là hợp âm 7 trên bậc V của A", "Bm7, E7 là bậc II, V của giọng E", "E7 là hợp âm chủ của giọng E", "Bm7 và E7 đều là hợp âm trong giọng E"], "answer": "A là đích; Bm7 là bậc II của A, E7 là hợp âm 7 trên bậc V của A", "why": "II–V tính theo đích, không theo giọng: A là \"tôi\", từ A đếm lên 2 tên nốt là B (\"chị\" Bm7), lên 5 tên nốt là E (\"mẹ\" E7)."}]},
  {"id": "p1-11", "part": 1, "src": "Phildave 1 · Video 1-11", "key": "F", "title": "Video 1-11: giọng F, II–V về Bb, Dm, Am, Gm và F", "teach": [{"text": "Giọng F có một dấu giáng: Bb. Viết dưới dạng hợp âm bốn nốt (hợp âm ba nốt thêm nốt 7), bảy hợp âm trong giọng F là Fmaj7, Gm7, Am7, Bbmaj7, C7, Dm7 và Em7b5: bậc 1, 4 là maj7, bậc 5 là hợp âm 7, bậc 2, 3, 6 là m7, bậc 7 là m7b5. Thầy dặn: muốn hiểu rõ giọng này thì phải xem hết các mã QR ở phần giọng C, vì các trang ở đây lặp lại đúng cách làm đó. Nghe bảy hợp âm của giọng F.", "tip": "Âm giai F: đi từ F lên theo phím trắng, chỉ đổi B thành Bb.", "play": ["Fmaj7", "Gm7", "Am7", "Bbmaj7", "C7", "Dm7", "Em7b5"]}, {"text": "Trang đầu là II–V về Bb, bậc IV của F, giống về F trong giọng C: \"chị\" Cm7, \"mẹ\" F7. Thầy đánh F7 theo dạng Eb/F: tay trái F, tay phải hợp âm Eb (Eb G Bb); sách ghi F7sus, tức F 9sus4. Đây cùng loại với Bb/C ở video 1-2 (tay trái C, tay phải hợp âm Bb), chỉ khác cao độ. Nghe so sánh: Cm7 – F7 – Bb, rồi Cm7 – Eb/F – Bb.", "tip": "Eb/F: F lùi một cung là Eb, tay phải hợp âm Eb.", "compare": {"a": {"label": "Cm7 – F7 – Bb", "play": ["Cm7", "F7", "Bb"]}, "b": {"label": "Cm7 – Eb/F – Bb", "play": ["Cm7", "Eb/F", "Bb"]}}}, {"text": "Trang 49 là về Dm, bậc VI của F, màu tối giống về Am trong giọng C. II–V về Dm là Em7b5 – A7, nhưng thầy nói \"chỉ cần đánh V cũng được\". Lý do như video 1-4: bậc V quan trọng hơn bậc II, thiếu chỗ thì bỏ \"chị\", chỉ đánh \"mẹ\". Nghe so sánh: Em7b5 – A7 – Dm, rồi chỉ A7 – Dm.", "tip": "\"Mẹ\" của Dm: đếm D, E, F, G, A, nốt thứ năm là A, nên \"mẹ\" là A7.", "compare": {"a": {"label": "Em7b5 – A7 – Dm", "play": ["Em7b5", "A7", "Dm"]}, "b": {"label": "A7 – Dm", "play": ["A7", "Dm"]}}}, {"text": "Về Am, bậc III của F: \"chị\" Bm7b5, \"mẹ\" E7, rồi Am. Đây đúng là các hợp âm của II–V về Am ở giọng C (video 1-3), vì đích vẫn là Am; chỉ có tên bậc đổi: ở giọng C, Am là bậc VI, ở giọng F là bậc III. Nghe: Bm7b5 – E7 – Am.", "tip": "\"Mẹ\" của Am: đếm A, B, C, D, E, nốt thứ năm là E, nên \"mẹ\" là E7.", "play": ["Bm7b5", "E7", "Am"]}, {"text": "Về Gm, bậc II của F: \"chị\" Am7b5, \"mẹ\" D7, rồi Gm. Gm là hợp âm thứ nên \"chị\" dùng m7b5, giống Bm7b5 đi trước Am. Nghe: Am7b5 – D7 – Gm.", "tip": "\"Mẹ\" của Gm: đếm G, A, Bb, C, D, nốt thứ năm là D, nên \"mẹ\" là D7.", "play": ["Am7b5", "D7", "Gm"]}, {"text": "Về C7, bậc V, thầy nói \"cũng làm II–V như vậy\", theo cùng công thức. Cuối cùng về F, bậc I: \"chị\" Gm7, \"mẹ\" C7, rồi F. Đây đúng là ba hợp âm của video 1-2, nhưng ở giọng F thì F là hợp âm chủ, nên câu này nghe như về nhà, kết bài. Nghe so sánh: chỉ có F, rồi Gm7 – C7 – F.", "tip": "\"Mẹ\" của F: đếm F, G, A, Bb, C, nốt thứ năm là C, nên \"mẹ\" là C7.", "compare": {"a": {"label": "Chỉ có F", "play": ["F"]}, "b": {"label": "Gm7 – C7 – F", "play": ["Gm7", "C7", "F"]}}}], "remember": ["Giọng F (Bb): Fmaj7, Gm7, Am7, Bbmaj7, C7, Dm7, Em7b5.", "Về Bb: Cm7 – F7, F7 đánh dạng Eb/F (F 9sus4, như Bb/C ở giọng C). Về Dm: chỉ cần A7.", "Về Am: Bm7b5 – E7; về Gm: Am7b5 – D7; về F: Gm7 – C7."], "items": [{"chord": "Eb/F", "to": "Bb", "prog": ["Cm7", "Eb/F", "Bb"]}, {"chord": "E7", "to": "Am", "prog": ["Bm7b5", "E7", "Am"]}, {"chord": "D7", "to": "Gm", "prog": ["Am7b5", "D7", "Gm"]}], "quiz": [{"q": "Ở trang về Bb, thầy đánh F7 dạng Eb/F. Vì sao đó là cùng loại với Bb/C ở giọng C?", "choices": ["Cả hai là 9sus4: tay trái là nốt gốc của \"mẹ\", tay phải là hợp âm trưởng thấp hơn nó một cung", "Cả hai đều là hợp âm chủ của giọng", "Cả hai đều có bậc 3 của \"mẹ\" ở trên cùng", "Cả hai đều là \"bạn của mẹ\""], "answer": "Cả hai là 9sus4: tay trái là nốt gốc của \"mẹ\", tay phải là hợp âm trưởng thấp hơn nó một cung", "why": "Eb/F = F 9sus4 (sách ghi F7sus), Bb/C = C 9sus4: F lùi một cung là Eb, C lùi một cung là Bb; chỉ khác cao độ."}, {"q": "Về Dm ở giọng F, thầy nói \"chỉ cần đánh V cũng được\". Nghĩa là gì?", "choices": ["Chỉ đánh A7 rồi về Dm, bỏ \"chị\" Em7b5", "Chỉ đánh Em7b5 rồi về Dm", "Đánh Dm7 thay cho A7", "Bỏ cả II–V, chỉ đánh Dm"], "answer": "Chỉ đánh A7 rồi về Dm, bỏ \"chị\" Em7b5", "why": "Bậc V quan trọng hơn bậc II: \"mẹ\" của Dm là A7, nên thiếu chỗ thì chỉ đánh A7 – Dm."}, {"q": "Vì sao II–V về Am ở giọng F dùng đúng các hợp âm như về Am ở giọng C?", "choices": ["Đích vẫn là Am; II–V tính theo đích, chỉ tên bậc đổi (bậc III thay cho bậc VI)", "Vì giọng F và giọng C có cùng bảy hợp âm", "Vì Am là hợp âm chủ của giọng F", "Vì E7 là bậc V của giọng F"], "answer": "Đích vẫn là Am; II–V tính theo đích, chỉ tên bậc đổi (bậc III thay cho bậc VI)", "why": "\"Chị\" và \"mẹ\" tính từ đích: về Am thì luôn là Bm7b5 – E7, dù Am là bậc VI của C hay bậc III của F."}]},
  {"id": "p1-13", "part": 1, "src": "Phildave 1 · Video 1-13", "key": "G", "title": "Video 1-13: giọng G, hợp âm mượn thay bậc IV", "teach": [{"text": "Video này ôn hợp âm mượn (modal interchange) ở giọng G: hợp âm mượn là hợp âm của giọng thứ cùng tên, đem dùng trong giọng trưởng. Ở Phần 3 ta mượn từ C thứ cho giọng C; giờ ở giọng G thì mượn từ G thứ (G A Bb C D Eb F). Thầy nói phần này không liên quan trực tiếp đến các II–V đã học: hợp âm mượn không kéo về đích như \"mẹ\", nó chỉ đổi màu. Phần giọng C giảng kỹ hơn, hãy mở mã QR đó xem lại. Nghe so sánh: G – C – G, rồi G – Cm7 – G.", "tip": "G thứ khác G trưởng ở ba nốt: B hạ xuống Bb, E xuống Eb, F# xuống F.", "compare": {"a": {"label": "G – C – G", "play": ["G", "C", "G"]}, "b": {"label": "G – Cm7 – G", "play": ["G", "Cm7", "G"]}}}, {"text": "Ở giọng G, hợp âm bậc IV thông thường là C, nhưng có thể đổi thành Cm7, Cm6 (hợp âm thứ thêm 6: C Eb G A), Am7b5 hoặc Ebmaj7. Vì sao (thầy không giải thích, đây là cách dễ nhớ): đây đều là hợp âm của G thứ, nâng lên từ những hợp âm mượn đã học ở giọng C: Fm7 thành Cm7, Dm7b5 thành Am7b5, Abmaj7 thành Ebmaj7. Chúng có Eb hoặc Bb, nốt giáng của G thứ, nên nghe lạ tai trong giọng G. Nghe: G, rồi Cm7, Cm6, Am7b5, Ebmaj7, về G.", "tip": "Từ C sang Cm: chỉ hạ E xuống nửa cung thành Eb.", "play": ["G", "Cm7", "Cm6", "Am7b5", "Ebmaj7", "G"]}, {"text": "Hợp âm mượn còn có F7 về G: F7 = F A C Eb, toàn nốt của G thứ, là hợp âm 7 trên bậc VII giáng. F7 không phải \"mẹ\" của G (\"mẹ\" của G là D7), nên nó không kéo về G bằng tritone mà chỉ mang màu mượn; về thẳng G vẫn nghe tự nhiên, giống Bb7 về C ở giọng C. Nghe so sánh: D7 – G, rồi F7 – G.", "tip": "F7: G lùi một cung là F; nốt 7 của F7 là F lùi một cung: Eb.", "compare": {"a": {"label": "D7 – G (\"mẹ\")", "play": ["D7", "G"]}, "b": {"label": "F7 – G (mượn)", "play": ["F7", "G"]}}}, {"text": "Thầy chốt: \"Miễn là không làm vướng giai điệu thì đều có thể dùng được.\" Ví dụ thầy đưa: giai điệu G thì dùng được Cm7, Ebmaj7, Cm6 và Am7b5. Vì sao: cả bốn hợp âm đều có sẵn nốt G: Cm7 (C Eb G Bb), Ebmaj7 (Eb G Bb D), Cm6 (C Eb G A), Am7b5 (A C Eb G), nên G đặt trên cùng không chọi gì. Nghe: Cm7, Ebmaj7, Cm6, Am7b5, mỗi hợp âm có G trên cùng, rồi về G.", "tip": "G là nốt 5 của Cm7, Cm6, nốt 3 của Ebmaj7, nốt 7 của Am7b5 (A lùi một cung là G).", "play": ["Cm7^G", "Ebmaj7^G", "Cm6^G", "Am7b5^G", "G"]}], "remember": ["Hợp âm mượn ở giọng G lấy từ G thứ (Bb, Eb, F): bậc IV C đổi được thành Cm7, Cm6, Am7b5 hoặc Ebmaj7; F7 về thẳng G.", "\"Miễn là không làm vướng giai điệu\": giai điệu G dùng được Cm7, Ebmaj7, Cm6, Am7b5 vì cả bốn đều có nốt G."], "items": [{"chord": "Cm6", "rel": "modal", "prog": ["G", "Cm6", "G"], "mel": "G"}, {"chord": "Ebmaj7", "rel": "modal", "prog": ["G", "Ebmaj7", "G"], "mel": "G"}, {"chord": "F7", "rel": "modal", "prog": ["F7", "G"]}], "quiz": [{"q": "Giai điệu đang là G ở chỗ bậc IV của giọng G. Vì sao dùng được Cm7, Ebmaj7, Cm6 hay Am7b5?", "choices": ["Cả bốn đều có sẵn nốt G nên không vướng giai điệu", "Cả bốn đều là \"mẹ\" của G", "Cả bốn đều là hợp âm trong giọng G trưởng", "Cả bốn đều có nốt F#"], "answer": "Cả bốn đều có sẵn nốt G nên không vướng giai điệu", "why": "Thầy nói \"miễn là không làm vướng giai điệu\": G là nốt 5 của Cm7, Cm6, nốt 3 của Ebmaj7, nốt 7 của Am7b5."}, {"q": "Ở giọng G, các hợp âm Cm7, Ebmaj7, F7 được mượn từ đâu?", "choices": ["Từ G thứ, giọng thứ cùng tên với G", "Từ giọng C trưởng", "Từ giọng D trưởng", "Từ E thứ"], "answer": "Từ G thứ, giọng thứ cùng tên với G", "why": "Hợp âm mượn lấy từ giọng thứ cùng tên: G thứ có Bb, Eb, F, nên có Cm7, Ebmaj7, F7."}, {"q": "Vì sao F7 về G không phải là \"mẹ\" về \"tôi\"?", "choices": ["\"Mẹ\" của G là D7; F7 chỉ là màu mượn từ G thứ", "Vì F7 chính là \"mẹ\" của G", "Vì F7 là \"bạn của mẹ\" của G", "Vì F7 là hợp âm chủ của giọng G"], "answer": "\"Mẹ\" của G là D7; F7 chỉ là màu mượn từ G thứ", "why": "\"Mẹ\" của G là D7 và \"bạn của mẹ\" là Ab7; F7 là hợp âm 7 mượn từ G thứ, về thẳng G vẫn nghe tự nhiên."}]},
  {"id": "p1-14", "part": 1, "src": "Phildave 1 · Video 1-14", "key": "A", "title": "Video 1-14: giọng A, tổng kết II–V", "teach": [{"text": "Đây là phần cuối về II–V, ở giọng A; sau đó còn giọng B và nhiều giọng khác, nhưng thầy chốt lại ở giọng A để hệ thống khái niệm. Giọng A có ba dấu thăng: C#, F#, G#. Bảy hợp âm trong giọng A là A, Bm, C#m, D, E7, F#m và G#m7b5 (bậc 1, 4, 5 trưởng, bậc 2, 3, 6 thứ, bậc 7 là m7b5). Sáu hợp âm đầu làm đích được; G#m7b5 thì không, vì giống Bm7b5 ở giọng C, nó không đứng yên lâu được. Nghe bảy hợp âm của giọng A.", "tip": "Âm giai A: đi từ A lên theo phím trắng, đổi C, F, G thành C#, F#, G#.", "play": ["A", "Bm", "C#m", "D", "E7", "F#m", "G#m7b5"]}, {"text": "Về D, bậc IV của A, giống về F trong giọng C: \"chị\" Em7, \"mẹ\" A7, rồi D. Đích D là hợp âm trưởng nên \"chị\" là m7 và \"mẹ\" là hợp âm 7, như Gm7 – C7 trước F. Nghe so sánh: chỉ có D, rồi Em7 – A7 – D.", "tip": "\"Mẹ\" của D: đếm D, E, F#, G, A, nốt thứ năm là A, nên \"mẹ\" là A7. \"Chị\" Em7: D lên một cung là E.", "compare": {"a": {"label": "Chỉ có D", "play": ["D"]}, "b": {"label": "Em7 – A7 – D", "play": ["Em7", "A7", "D"]}}}, {"text": "Về F#m, bậc VI, màu tối giống Am trong giọng C: \"chị\" G#m7b5, \"mẹ\" C#7, rồi F#m. Đích là hợp âm thứ nên \"chị\" dùng m7b5, như Bm7b5 trước Am. Lưu ý: G#m7b5 không làm đích được, nhưng làm \"chị\" đi trước F#m thì được. Nghe so sánh: chỉ có F#m, rồi G#m7b5 – C#7 – F#m.", "tip": "\"Mẹ\" của F#m: đếm F#, G#, A, B, C#, nốt thứ năm là C#, nên \"mẹ\" là C#7.", "compare": {"a": {"label": "Chỉ có F#m", "play": ["F#m"]}, "b": {"label": "G#m7b5 – C#7 – F#m", "play": ["G#m7b5", "C#7", "F#m"]}}}, {"text": "Hai đích thứ còn lại làm cùng công thức. Về C#m (bậc III): D#m7b5 – G#7 – C#m. Về Bm (bậc II): C#m7b5 – F#7 – Bm. Cả hai đều là \"chị\" m7b5 rồi \"mẹ\" hợp âm 7, vì đích là hợp âm thứ. Nghe: D#m7b5 – G#7 – C#m, rồi C#m7b5 – F#7 – Bm.", "tip": "\"Mẹ\" của C#m: đếm C#, D#, E, F#, G#, ra G#7. \"Mẹ\" của Bm: đếm B, C#, D, E, F#, ra F#7.", "play": ["D#m7b5", "G#7", "C#m", "C#m7b5", "F#7", "Bm"]}, {"text": "Về E7 (bậc V) rồi về A (bậc I), thầy chỉ nói \"thì làm như vậy\", theo cùng công thức. Ở giọng này cũng dùng \"bạn của mẹ\" (hợp âm 7 cách \"mẹ\" một tritone) như ở giọng C. Thầy kết: từ giọng B trở đi tất cả đều giống nhau, \"chỉ cần các bạn hiểu thật chính xác khái niệm trong giọng C\", phần còn lại cứ áp dụng theo cách đó. Nghe: \"mẹ\" E7 về A, hợp âm chủ.", "tip": "\"Mẹ\" của A: đếm A, B, C#, D, E, nốt thứ năm là E, nên \"mẹ\" là E7.", "play": ["E7", "A"]}], "remember": ["Giọng A (C#, F#, G#): A, Bm, C#m, D, E7, F#m, G#m7b5; G#m7b5 không làm đích.", "Về D: Em7 – A7. Đích thứ: G#m7b5 – C#7 → F#m, D#m7b5 – G#7 → C#m, C#m7b5 – F#7 → Bm.", "Giọng nào cũng vậy: hiểu thật chính xác giọng C rồi áp dụng cùng công thức."], "items": [{"chord": "A7", "to": "D", "prog": ["Em7", "A7", "D"]}, {"chord": "C#7", "to": "F#m", "prog": ["G#m7b5", "C#7", "F#m"]}, {"chord": "F#7", "to": "Bm", "prog": ["C#m7b5", "F#7", "Bm"]}], "quiz": [{"q": "Ở giọng A, vì sao G#m7b5 không làm đích?", "choices": ["Nó là bậc VII, không đứng yên lâu được, giống Bm7b5 ở giọng C", "Vì nó không thuộc giọng A", "Vì nó là hợp âm trưởng", "Vì nó là \"mẹ\" của A"], "answer": "Nó là bậc VII, không đứng yên lâu được, giống Bm7b5 ở giọng C", "why": "Sáu hợp âm bậc I đến VI làm đích được; bậc VII (m7b5) không phải hợp âm để dừng lại, nhưng vẫn làm \"chị\" trước F#m được."}, {"q": "Về F#m ở giọng A, vì sao \"chị\" là G#m7b5 mà không phải G#m7?", "choices": ["Đích F#m là hợp âm thứ nên \"chị\" dùng m7b5, như Bm7b5 trước Am", "Vì G#m7 là hợp âm chủ của giọng A", "Vì F#m là hợp âm trưởng", "Vì G#m7b5 là \"mẹ\" của F#m"], "answer": "Đích F#m là hợp âm thứ nên \"chị\" dùng m7b5, như Bm7b5 trước Am", "why": "Đích thứ thì \"chị\" là m7b5 (như phần II liên quan đã học); \"mẹ\" của F#m là C#7."}, {"q": "Thầy kết phần II–V ở giọng A thế nào?", "choices": ["Chỉ cần hiểu thật chính xác giọng C, các giọng khác áp dụng cùng cách", "Mỗi giọng phải học một công thức riêng", "Chỉ giọng A mới dùng được \"bạn của mẹ\"", "Từ giọng B trở đi không dùng II–V nữa"], "answer": "Chỉ cần hiểu thật chính xác giọng C, các giọng khác áp dụng cùng cách", "why": "Thầy nói từ giọng B trở đi tất cả đều giống nhau: \"chỉ cần hiểu thật chính xác khái niệm trong giọng C\"."}]},
  {"id": "p2-00", "part": 2, "src": "Phildave 2 · Index", "title": "Index: năm nhóm mẹo của Tip Book 1", "teach": [{"text": "Phildave 2 là sách mẹo (Tip Book 1) \"cho phần trình tấu hay hơn\", viết cho người đệm đàn và người phối nhạc, dùng được cho bài nào cũng được: dân ca, thánh ca, CCM, pop Hàn. Thầy chia các mẹo theo chỗ dùng trong bài: dạo đầu, vòng quay lại, chuyển giọng, tái hoà âm và ending. Nhóm đầu là dạo đầu (intro): đoạn đàn ngắn trước khi người hát vào, để người nghe nhận ra giọng và không khí của bài. Ví dụ ở giọng C, đoạn dạo đầu thường kết về hợp âm C (bậc I) rồi người hát mới vào; các mẫu cụ thể học ở video 2-3.", "tip": "Đoạn dạo đầu ở giọng C kết về hợp âm C: tay trái C, tay phải C E G.", "show": "C"}, {"text": "Nhóm thứ hai là vòng quay lại (turnaround), dùng ở chỗ \"dodori\" (tiếng Hàn: dấu quay lại), nơi bài trở về đầu để hát lại. Vì sao cần mẹo: nếu cuối bài dừng hẳn ở C thì nghe như đã xong, còn muốn quay lại thì vài hợp âm cuối phải nghe \"chưa xong\". Ví dụ: dừng ở G7 thì tai còn chờ, rồi quay về C ở đầu bài. Nghĩa của chữ này ở đây rộng hơn vòng 1–6–2–5 đã học ở Phildave 3; video 2-4 sẽ nói rõ.", "tip": "G7 nghe \"chưa xong\" vì có tritone B–F muốn về C.", "compare": {"a": {"label": "Dừng ở C (đã xong)", "play": ["G7", "C"]}, "b": {"label": "Dừng ở G7 (còn chờ quay lại)", "play": ["C", "G7"]}}}, {"text": "Nhóm thứ ba là chuyển giọng (modulation, thầy gọi là change keys): đổi sang một giọng khác, thường ở chỗ nối bài này sang bài khác. Ví dụ bài trước kết ở giọng C, bài sau bắt đầu ở giọng D, tức nốt chủ đi lên một cung. Vì sao cần mẹo: nhảy thẳng sang giọng mới thì nghe hụt hẫng, còn mẹo cho một đoạn nối để tai đi theo; video 2-6 dạy các đoạn nối đó. Nghe: hợp âm C rồi hợp âm D (D F# A).", "tip": "Lên một cung: từ C bỏ qua phím đen C# là đến D.", "keys": ["C4", "D4"], "play": [["C3", "|", "C4", "E4", "G4"], ["D3", "|", "D4", "F#4", "A4"]]}, {"text": "Nhóm thứ tư là tái hoà âm (reharmony): thêm hợp âm hay, tinh tế, hoặc thay hợp âm có sẵn, kể cả xử lý chỗ nối giữa ô nhịp này với ô nhịp kia. Vì sao: cùng một giai điệu, đổi hay thêm hợp âm là bài nghe mới hơn mà người hát vẫn hát như cũ. Ví dụ đơn giản đã học ở Phildave 1: thêm \"chị\" Dm7 trước \"mẹ\" G7 khi về C. Nghe so sánh: G7 – C rồi Dm7 – G7 – C.", "compare": {"a": {"label": "G7 – C", "play": ["G7", "C"]}, "b": {"label": "Thêm Dm7: Dm7 – G7 – C", "play": ["Dm7", "G7", "C"]}}}, {"text": "Nhóm thứ năm là ending, tức đoạn kết. Ending không chỉ ở cuối bài: khi chơi từng câu nhạc, cứ khoảng bốn ô nhịp lại có một \"ending nhỏ\", vì mọi chỗ đi về bậc I giữa bài đều là một ending. Thầy dặn mỗi chỗ như vậy cần có cảm giác khác nhau: lúc xử lý nhẹ nhàng, lúc là ending thật sự, để bài không nhàm chán. Ví dụ ở giọng C: lần này chỉ G7 về C, lần sau Dm7 – G7 – C; bài tập của bài này cho bấm G7 ngay trước chỗ về C như vậy.", "tip": "Ending nhỏ là chỗ câu nhạc về hợp âm bậc I (ở giọng C là C).", "compare": {"a": {"label": "Nhẹ: G7 – C", "play": ["G7", "C"]}, "b": {"label": "Đầy hơn: Dm7 – G7 – C", "play": ["Dm7", "G7", "C"]}}}, {"text": "Sách chuẩn bị sẵn mẫu cho nhiều giọng; quyển 1 có giọng C, D, E, F, G, gần 200 trang. Mục có dấu sao là có mã QR, video bài giảng và phần phát nhạc đi kèm. Phần lớn video giảng ở giọng C; các giọng khác thầy nói \"khái niệm giống key C, chỉ cần xem bản nhạc\". Vì vậy app dạy ở giọng C: hiểu kỹ giọng C rồi thì sang giọng khác chỉ là đổi cao độ. Năm nốt sáng trên phím là nốt chủ của năm giọng trong quyển 1.", "keys": ["C4", "D4", "E4", "F4", "G4"], "play": [["C4"], ["D4"], ["E4"], ["F4"], ["G4"]]}, {"text": "Thầy nói người chơi giỏi xử lý tốt mọi tình huống biểu diễn vì họ \"sở hữu rất nhiều tip\" trong đầu, đã luyện rất nhiều. Họ không phải thiên tài; họ say mê, và với họ bản thân việc luyện đã vui. Thầy khuyên bỏ ngay suy nghĩ \"mình phải học cái này để chơi thật chuyên nghiệp\": hãy học thuộc từng tip và \"biến nó thành của mình\", đừng chỉ chơi đúng bản nhạc. Mẹo đầu tiên nên thuộc là chính ending nhỏ Dm7 – G7 – C ở trên.", "play": ["Dm7", "G7", "C"]}], "remember": ["Năm nhóm mẹo: dạo đầu (intro), vòng quay lại (turnaround, chỗ dấu quay lại \"dodori\"), chuyển giọng, tái hoà âm, ending.", "Cứ khoảng bốn ô nhịp có một ending nhỏ (mọi chỗ về bậc I giữa bài); mỗi chỗ cần cảm giác khác nhau.", "Quyển 1 có giọng C, D, E, F, G; mục có dấu sao có video. Người chơi giỏi sở hữu rất nhiều tip: \"hãy biến nó thành của mình\"."], "items": [{"chord": "G7", "to": "C", "prog": ["Dm7", "G7", "C"]}], "quiz": [{"q": "Theo thầy, \"ending nhỏ\" nằm ở đâu?", "choices": ["Ở mọi chỗ câu nhạc đi về bậc I giữa bài, khoảng mỗi bốn ô nhịp", "Chỉ ở ô nhịp cuối cùng của bài", "Chỉ ở chỗ có dấu quay lại", "Chỉ ở đoạn dạo đầu"], "answer": "Ở mọi chỗ câu nhạc đi về bậc I giữa bài, khoảng mỗi bốn ô nhịp", "why": "Thầy nói mọi chỗ đi về bậc I giữa bài đều là ending; vì có nhiều chỗ như vậy nên mỗi chỗ cần một cảm giác khác."}, {"q": "Vì sao app học các mẹo ở giọng C?", "choices": ["Phần lớn video giảng ở giọng C; các giọng khác cùng khái niệm, chỉ cần xem bản nhạc", "Vì quyển 1 chỉ có giọng C", "Vì giọng C không dùng được chuyển giọng", "Vì các giọng khác không có mẹo dạo đầu"], "answer": "Phần lớn video giảng ở giọng C; các giọng khác cùng khái niệm, chỉ cần xem bản nhạc", "why": "Quyển 1 có giọng C, D, E, F, G; thầy nói các giọng khác \"khái niệm giống key C\", nên hiểu kỹ giọng C là đủ."}, {"q": "Thầy nói người chơi giỏi khác người khác ở điểm nào?", "choices": ["Họ sở hữu rất nhiều tip đã luyện thuộc", "Họ là thiên tài bẩm sinh", "Họ chỉ chơi đúng theo bản nhạc", "Họ không cần luyện tập"], "answer": "Họ sở hữu rất nhiều tip đã luyện thuộc", "why": "Thầy nói họ không phải thiên tài: họ có rất nhiều tip trong đầu, luyện rất nhiều và thấy việc luyện là vui."}]},
  {"id": "p2-03", "part": 2, "src": "Phildave 2 · Video 2-3", "title": "Video 2-3: mẹo dạo đầu (intro)", "teach": [{"text": "Dạo đầu (intro) là đoạn đàn trước khi bài hát bắt đầu; thầy chơi theo phong cách của mình, và bài có thể là pop Hàn, CCM hay thánh ca. Quy tắc chung: nốt trên cùng (nốt cao nhất, tai nghe rõ nhất) thường nằm trong âm giai của hợp âm đó và kết về nốt bậc I, ở giọng C là nốt C. Vì sao: C ở trên cùng cho cảm giác đã về nhà, đúng lúc người hát vào. Nghe so sánh hợp âm C với E trên cùng (còn mở) và với C trên cùng (về nhà). Sách có 21 intro; intro 1–5 và 9–11 thầy chỉ chơi, không đọc hợp âm, nên hãy xem sách hoặc video.", "tip": "Hợp âm C với C trên cùng: tay phải E G C, ngón út ở C.", "compare": {"a": {"label": "C, E trên cùng", "play": ["C^E"]}, "b": {"label": "C, C trên cùng (về nhà)", "play": ["C^C"]}}}, {"text": "Ở cuối đoạn dạo đầu thầy thường dùng vuốt phím (glissando), rồi bài hát bắt đầu. Vuốt phím là lướt nhanh một ngón tay qua liền nhiều phím, thường là phím trắng, nghe như một chuỗi nốt trượt. Cách làm: tay phải úp mặt móng ngón 2 hoặc 3 xuống phím, kéo nhẹ từ trái sang phải. Vì sao: tiếng trượt như một tín hiệu \"vào bài\" cho người hát. App đánh chậm từng nốt từ C4 lên C5; khi vuốt thật thì lướt rất nhanh.", "tip": "Vuốt nhẹ, không ấn mạnh: chỉ cần mỗi phím kêu một chút.", "keys": ["C4", "C5"], "play": [["C4"], ["D4"], ["E4"], ["F4"], ["G4"], ["A4"], ["B4"], ["C5"]]}, {"text": "Intro 6 dùng hợp âm mượn (modal interchange): nhắc lại, đó là hợp âm lấy từ C thứ, hoặc từ âm giai của giọng khác, đem vào bài giọng C. Thầy dùng Abmaj7 (Ab C Eb G), dựng hoàn toàn từ nốt của C thứ, nên nghe như một màu tối hơn lướt qua. Điều kiện: \"miễn là top note không bị vướng melody\", tức nốt trên cùng của hợp âm mượn không chọi với nốt giai điệu đang hát. Đánh ở quãng tám nào cũng được, \"chỉ cần giữ màu hợp âm\". Nghe so sánh: chỉ có C, rồi Abmaj7 (G trên cùng) về C.", "tip": "Abmaj7 = hợp âm Ab (Ab C Eb) thêm nốt 7: Ab lùi nửa cung là G.", "compare": {"a": {"label": "Chỉ có C", "play": ["C"]}, "b": {"label": "Abmaj7 rồi C", "play": ["Abmaj7^G", "C"]}}}, {"text": "Nốt trên cùng của Abmaj7 chọn thế nào? Nốt 7 của Abmaj7 là G, mà G thuộc giọng C, nên nốt trên cùng có thể là G; cũng có thể là C, nốt bậc 3 của Abmaj7 và là nốt chủ của giọng. Thầy nói \"tốt nhất là dùng các nốt trong C key làm melody\", vì nốt trong giọng thì hợp với giai điệu của bài. Nghe so sánh: Abmaj7 với G trên cùng, rồi với C trên cùng.", "tip": "Nốt 7 của maj7 là nốt gốc lùi nửa cung: Ab lùi nửa cung là G.", "compare": {"a": {"label": "Abmaj7, G trên cùng", "play": ["Abmaj7^G"]}, "b": {"label": "Abmaj7, C trên cùng", "play": ["Abmaj7^C"]}}}, {"text": "Intro 7 thầy chỉ chơi, và dặn \"giữ fermata ở đó\". Dấu ngân (fermata) là ký hiệu hình vòng cung có chấm ở giữa, đặt trên một nốt hay hợp âm: giữ nó lâu hơn bình thường, bao lâu tuỳ người chơi, rồi mới đi tiếp. Vì sao: ngân một chút làm người nghe chờ, và người hát có thời gian chuẩn bị vào. Ví dụ để nghe (không phải hợp âm của intro 7): G7 rồi về C ngay, và G7 ngân lâu hơn (app đánh G7 hai lần) rồi mới về C.", "tip": "Ngân bằng cách giữ phím (hoặc giữ bàn đạp vang) rồi đếm chậm trong đầu.", "compare": {"a": {"label": "Không ngân", "play": ["G7", "C"]}, "b": {"label": "Ngân ở G7", "play": ["G7", "G7", "C"]}}}, {"text": "Intro 8 mang màu C thứ: Dm7b5 – Abmaj7 – Bb7. Cả ba hợp âm đều dựng từ nốt của C thứ (Dm7b5 = D F Ab C, Bb7 = Bb D F Ab), nên nghe \"như sắp chuyển sang một giọng khác\" nhưng vẫn ở C, chỉ \"lướt qua một màu khác\". Thầy nói cũng có thể xem nó như một II–V–I, và khi chơi bài ở giọng C sẽ dùng cái này rất nhiều, không chỉ cho intro. Nghe: Dm7b5 – Abmaj7 (G trên cùng) – Bb7.", "tip": "Dm7b5 là Dm7 hạ A xuống nửa cung thành Ab; Bb7: Bb lùi một cung là Ab.", "play": ["Dm7b5", "Abmaj7^G", "Bb7"]}, {"text": "Thầy phân tích tiếp intro 8: A7 là \"mẹ\" (bậc V) về Dm. Eb7 là \"bạn\" của A7, giống \"bạn của mẹ\" ở Phildave 1 (hợp âm 7 chung tritone với \"mẹ\"), nên đánh thay A7 được: bass thành Eb mà \"cảm giác khá giống nhau… là những hợp âm tương đương\". Vì sao giống: A7 có C# và G, Eb7 có G và Db, mà C# với Db là cùng một phím (từ mức tay 2 app bấm đủ các nốt này). Nghe so sánh: A7 về Dm, rồi Eb7 về Dm.", "tip": "\"Bạn của mẹ\" có nốt gốc là đích nhích lên nửa cung: D lên nửa cung là Eb.", "compare": {"a": {"label": "A7 → Dm", "play": ["A7", "Dm"]}, "b": {"label": "Eb7 → Dm", "play": ["Eb7", "Dm"]}}}, {"text": "Intro 18 dùng II liên quan (\"chị\" đi trước \"mẹ\"). Sau Dm, \"mẹ\" trong II–V vốn là G7 rồi về C; thay G7 bằng \"bạn của mẹ\" Db7. Db7 cũng là một hợp âm 7 nên có \"chị\" riêng là Abm7; Db7 vốn đi về Gb, nhưng vì nó thay cho G7 nên về C. Tiến hành: Dm7 – Abm7 – Db7 – C. Thầy nói \"nếu hiểu được cái này thì trình của các bạn khá tốt rồi\". Nghe so sánh với Dm7 – G7 – C.", "tip": "\"Chị\" của Db7: từ Db đếm lên 5 tên nốt (Db, Eb, F, Gb, Ab) là Ab, nên là Abm7.", "compare": {"a": {"label": "Dm7 – G7 – C", "play": ["Dm7", "G7", "C"]}, "b": {"label": "Dm7 – Abm7 – Db7 – C", "play": ["Dm7", "Abm7", "Db7", "C"]}}}, {"text": "Thầy nói chỉ trong các tip intro \"đã ẩn chứa rất nhiều lý thuyết\". Không cần dùng cả một intro: \"lấy một ô nhịp ở giữa ra dùng cũng được\", ví dụ ở cuối một câu, và không nhất thiết đúng tiết tấu trong sách, \"chỉ cần chèn line đó vào\". Ví dụ lấy riêng Abm7 – Db7 của intro 18 chèn vào cuối câu, ngay trước C. \"Đừng chỉ chơi đúng theo bản nhạc\": học kỹ tiến hành hợp âm, học thuộc, rồi biến nó thành của mình.", "play": ["Abm7", "Db7", "C"]}], "remember": ["Dạo đầu: nốt trên cùng nằm trong âm giai, kết về nốt bậc I (C); cuối đoạn hay vuốt phím (glissando), có chỗ giữ dấu ngân (fermata).", "Hợp âm mượn: Abmaj7 với G hoặc C trên cùng, miễn không vướng giai điệu; intro 8: Dm7b5 – Abmaj7 – Bb7 (màu C thứ).", "Eb7 đánh thay A7 về Dm; intro 18: Dm7 – Abm7 – Db7 – C (Db7 thay G7, Abm7 là \"chị\" của Db7)."], "items": [{"chord": "Abmaj7", "rel": "modal", "prog": ["Dm7b5", "Abmaj7", "Bb7"], "mel": "G"}, {"chord": "Eb7", "to": "Dm", "prog": ["Eb7", "Dm"]}, {"chord": "Abm7", "to": "Db7", "prog": ["Dm7", "Abm7", "Db7", "C"]}], "quiz": [{"q": "Ở intro 6, vì sao nốt trên cùng của Abmaj7 có thể là G?", "choices": ["G là nốt 7 của Abmaj7 và thuộc giọng C", "G là nốt gốc của Abmaj7", "G không thuộc giọng C nên nghe lạ", "G là nốt bass của Abmaj7"], "answer": "G là nốt 7 của Abmaj7 và thuộc giọng C", "why": "Nốt 7 của Abmaj7 là Ab lùi nửa cung, tức G; thầy nói tốt nhất là nốt trên cùng thuộc giọng C, nên G (hoặc C) là hợp."}, {"q": "Ở intro 8, Eb7 được đánh thay cho hợp âm nào?", "choices": ["A7, \"mẹ\" về Dm", "Dm, hợp âm đích", "Bb7", "G7, \"mẹ\" về C"], "answer": "A7, \"mẹ\" về Dm", "why": "Eb7 là \"bạn\" của A7: hai hợp âm chung tritone (G và C#, tức Db), nên Eb7 về Dm thay cho A7."}, {"q": "Trong Dm7 – Abm7 – Db7 – C, Abm7 đóng vai trò gì?", "choices": ["\"Chị\" (II liên quan) của Db7", "\"Mẹ\" của C", "Hợp âm chủ của giọng", "\"Bạn của mẹ\" của Dm"], "answer": "\"Chị\" (II liên quan) của Db7", "why": "Db7 thay cho G7; nó cũng là hợp âm 7 nên có \"chị\" riêng là Abm7 (từ Db đếm lên 5 tên nốt là Ab)."}]},
  {"id": "p2-04", "part": 2, "src": "Phildave 2 · Video 2-4", "title": "Video 2-4: mẹo turnaround, quay về đầu bài", "teach": [{"text": "Ở Phildave 3, vòng quay lại (turnaround) là vòng hợp âm 1–6–2–5 lặp lại, như C – Am – Dm – G7, hết vòng là về đầu vòng kế tiếp. Ở video này thầy dùng chữ turnaround cho mẹo ở cuối bài: vài hợp âm cuối tạo cảm giác \"cần trở lại phần đầu\". Không chỉ ở chỗ có dấu quay lại: bài nào cũng có đoạn kết; kết hẳn thì là ending, còn quay về đầu để bắt đầu lại thì dùng turnaround cho chỗ bắt đầu lại hay hơn. Hai nghĩa giống nhau ở chỗ hợp âm cuối không đứng yên mà kéo về C ở đầu. Nghe vòng 1–6–2–5 rồi về C.", "tip": "Vòng 1–6–2–5 ở giọng C: C, Am, Dm, G7 (đếm bậc từ C: C là 1, A là 6, D là 2, G là 5).", "play": ["C", "Am", "Dm", "G7", "C"]}, {"text": "Turnaround 1 kết bằng G7. Turnaround 2 giống vậy nhưng đoạn cuối là F thứ, \"kịch tính hơn một chút\", và có thể thêm nhẹ dấu ngân (fermata: giữ lâu hơn bình thường). Turnaround 3 dùng hợp âm mượn, chỉ khác ở phần cuối. Vì sao F thứ kịch tính hơn: Fm mượn từ C thứ, có Ab nên nghe tối hơn G7. Nghe so sánh: G7 rồi về C ở đầu bài, và Fm7 rồi về C.", "tip": "Fm7 = F Ab C Eb: hai nốt Ab và Eb mượn từ C thứ.", "compare": {"a": {"label": "Kết G7 → C", "play": ["G7", "C"]}, "b": {"label": "Kết Fm7 → C", "play": ["Fm7", "C"]}}}, {"text": "Thầy dặn \"các bạn cần nhớ bốn kiểu này\": kết bằng G7, Fm7, Bb7 hoặc Db7, rồi quay về C ở đầu bài. G7 là \"mẹ\" của C; Fm7 và Bb7 là hợp âm mượn từ C thứ; Db7 là \"bạn của mẹ\" thay cho G7. Bốn kiểu cho bốn màu khác nhau ở cùng một chỗ quay lại, nên mỗi lần quay lại có thể chơi khác. Nghe lần lượt cả bốn, mỗi kiểu về C.", "tip": "Db7: C nhích lên nửa cung là Db. Bb7: C lùi một cung là Bb.", "play": ["G7", "C", "Fm7", "C", "Bb7", "C", "Db7", "C"]}, {"text": "Phân tích kiểu Db7: thay G7 bằng hợp âm át thay thế Db7 (\"bạn của mẹ\"). Nếu xem Db7 là bậc V thì \"chị\" (II liên quan) của nó là Abm7: \"chúng cùng một họ\", và tất cả hướng về C. Nghe như hợp âm đến từ một giọng hoàn toàn khác \"nhưng lại tạo cảm giác rất tinh tế\"; thầy nói đây là \"cái thú vị của hợp âm jazz\". Nghe so sánh: Dm7 – G7 – C rồi Abm7 – Db7 – C.", "tip": "\"Chị\" của Db7: từ Db đếm lên 5 tên nốt (Db, Eb, F, Gb, Ab) là Ab, nên là Abm7.", "compare": {"a": {"label": "Dm7 – G7 – C", "play": ["Dm7", "G7", "C"]}, "b": {"label": "Abm7 – Db7 – C", "play": ["Abm7", "Db7", "C"]}}}, {"text": "Turnaround 7 là Fm7 – Bb7: thầy nói nó \"vốn dĩ là vòng II–V–I để đi về Eb\" (Fm7 là \"chị\", Bb7 là \"mẹ\" của Eb). Nhưng cuối cùng nó vẫn về C, \"rất tự nhiên\", nên ở đây ta gọi nó là hợp âm mượn: hai hợp âm lấy từ C thứ rồi trở về C trưởng. Nghe: Fm7 – Bb7 – C.", "tip": "\"Mẹ\" của Eb: đếm Eb, F, G, Ab, Bb, ra Bb7; \"chị\": Eb lên một cung là F, ra Fm7.", "play": ["Fm7", "Bb7", "C"]}, {"text": "Turnaround 9 hơi dài: C … F → Fm7 → Fm6, \"rất kịch tính\". Hợp âm F được chuyển thành Fm7 (A hạ xuống Ab, thêm nốt 7 là Eb: F lùi một cung), rồi thành Fm6 (Eb đổi thành nốt 6 là D). Vì sao kịch tính: nốt A đi xuống Ab làm màu đổi từ sáng sang tối ngay trên cùng nốt bass F. Nghe: C – F – Fm7 – Fm6.", "tip": "F thành Fm: hạ A xuống nửa cung thành Ab. Nốt 6 của Fm6: nốt 5 (C) lên một cung là D.", "play": ["C", "F", "Fm7", "Fm6"]}, {"text": "Turnaround 10: \"chỉ cần thêm fermata\" (dấu ngân); lúc đầu là F, và nên chơi hơi chậm lại một chút, \"như thế sẽ hay hơn\". Vì sao: chậm lại và ngân ở F cho người nghe biết bài sắp quay về đầu; ví dụ để nghe: F rồi về C, và F ngân lâu hơn rồi về C. Các turnaround 6, 8, 11, 12, 13 thầy chỉ chơi, không đọc hợp âm (số 6 giống mẫu ngay trước nó trong sách nhưng không có phần sau, số 8 là kiểu \"chúng ta vẫn thường dùng\"), nên hãy xem sách hoặc video. Lời khuyên cuối: học thuộc các mẹo và biến nó thành của mình.", "tip": "Ngân ở F: giữ hợp âm lâu hơn rồi mới đi tiếp.", "show": "F", "compare": {"a": {"label": "F rồi về C", "play": ["F", "C"]}, "b": {"label": "F ngân lâu hơn rồi về C", "play": ["F", "F", "C"]}}}], "remember": ["Turnaround ở đây: vài hợp âm cuối bài tạo cảm giác cần quay về đầu (C); nhớ bốn kiểu kết G7, Fm7, Bb7, Db7.", "Abm7 – Db7 → C (Db7 thay G7, Abm7 là \"chị\" của nó); Fm7 – Bb7 → C (vốn là II–V về Eb, ở đây là hợp âm mượn).", "F → Fm7 → Fm6 rất kịch tính; turnaround 10: thêm dấu ngân ở F, chơi hơi chậm lại."], "items": [{"chord": "Db7", "to": "C", "prog": ["Abm7", "Db7", "C"]}, {"chord": "Bb7", "rel": "modal", "prog": ["Fm7", "Bb7", "C"]}, {"chord": "Fm6", "rel": "modal", "prog": ["F", "Fm7", "Fm6"]}], "quiz": [{"q": "Ở video này, mẹo turnaround dùng ở đâu?", "choices": ["Ở cuối bài, khi quay về đầu bài để bắt đầu lại", "Ở đầu bài, trước khi người hát vào", "Ở chỗ nối sang một bài khác giọng", "Ở ô nhịp cuối cùng khi bài kết hẳn"], "answer": "Ở cuối bài, khi quay về đầu bài để bắt đầu lại", "why": "Thầy nói kết hẳn thì là ending; còn quay về đầu bắt đầu lại thì dùng turnaround cho chỗ bắt đầu lại hay hơn."}, {"q": "Fm7 – Bb7 vốn là II–V về hợp âm nào?", "choices": ["Eb", "C", "F", "Bb"], "answer": "Eb", "why": "Bb7 là \"mẹ\" của Eb và Fm7 là \"chị\"; ở turnaround 7 nó lại về C, nên ta coi là hợp âm mượn từ C thứ."}, {"q": "Thầy dặn nhớ bốn kiểu kết turnaround nào?", "choices": ["G7, Fm7, Bb7, Db7", "G7, Dm7, Em7, Am7", "C, F, G, Am", "A7, D7, E7, B7"], "answer": "G7, Fm7, Bb7, Db7", "why": "G7 là \"mẹ\" của C, Fm7 và Bb7 mượn từ C thứ, Db7 là \"bạn của mẹ\"; cả bốn đều quay về C."}]},
  {"id": "p2-05", "part": 2, "src": "Phildave 2 · Video 2-5", "title": "Video 2-5: mẹo ending, kết bài", "teach": [{"text": "Mẹo ending dùng ở đoạn kết của bài. Thầy nói: \"vì đây là phần kết của âm nhạc, nên các bạn có thể chơi thoải mái theo ý mình… không ai bắt bẻ gì cả\". Nhưng kết bài cho thật hay cũng quan trọng như cách bắt đầu bài, nên cần chuẩn bị. Ví dụ ending đơn giản nhất ở giọng C là \"mẹ\" G7 về C; các mẫu dưới đây làm cho đoạn này giàu màu hơn.", "tip": "G7 về C: B lên C, F xuống E.", "play": ["G7", "C"]}, {"text": "Ending 1 thầy chơi rồi phân tích. Trong đó có Am/F#: tay trái F#, tay phải hợp âm Am (A C E). Thầy nói nó \"thực chất là hợp âm F#m7b5\": từ F#m7 (F# A C# E) hạ bậc 5 C# xuống C, được F# A C E, đúng các nốt của Am/F#. Ký hiệu nào cũng được, \"người ta cũng ký hiệu như vậy\". Nghe: Am/F# rồi F#m7b5, hai tên nhưng cùng nốt.", "tip": "Bậc 5 của F# là C# (đếm F#, G#, A#, B, C#); hạ nửa cung là C.", "compare": {"a": {"label": "Am/F#", "play": ["Am/F#"]}, "b": {"label": "F#m7b5", "play": ["F#m7b5"]}}}, {"text": "Trong ending 1, chỗ F7(#11) có thể thay bằng B7; thầy đánh B7(#9) và thêm cả 13. Vì sao thay được: F và B cách nhau một tritone, và hai hợp âm chung hai nốt định hướng (bậc 3, bậc 7): F7 có A và Eb, B7 có D# và A, mà D# với Eb là cùng một phím (từ mức tay 2 app bấm đủ các nốt này). Đây cũng là kiểu \"bạn\" như A7 với Eb7 ở bài dạo đầu. Nghe so sánh F7(#11) và B7(#9) (app chưa thêm 13).", "tip": "Đọc mẹo banana từ F: bảy âm tiết, mỗi âm tiết một phím, âm tiết thứ bảy rơi vào B. Tay phải của F7(#11) là hợp âm G: F lên một cung là G.", "compare": {"a": {"label": "F7(#11)", "play": ["F7(#11)"]}, "b": {"label": "B7(#9)", "play": ["B7(#9)"]}}}, {"text": "Chỗ A7 trong ending 1 có thể đổi thành Eb7, và Eb7 thêm #11. Thầy nói: \"chúng ta cũng đã gặp vòng hợp âm kiểu này\" ở tip intro, nơi Eb7 đánh thay A7 về Dm. Nốt #11 của Eb7 là A, chính là nốt gốc của A7, nên trong Eb7(#11) vẫn nghe thấy nốt A. Nghe so sánh A7 và Eb7(#11).", "tip": "Tay phải hợp âm F: Eb lên một cung là F. Nốt A trong hợp âm F là #11 của Eb (nốt 11 là Ab, nâng nửa cung là A).", "compare": {"a": {"label": "A7", "play": ["A7"]}, "b": {"label": "Eb7(#11)", "play": ["Eb7(#11)"]}}}, {"text": "Ở ending 1, tay phải mở rộng tới quãng 10 (từ C lên E ở quãng tám trên) là tốt; thầy đùa \"không với được thì chắc phải phẫu thuật\" rồi nói rõ là đùa. Vì tay trái đã giữ đủ hoà âm (nốt bass cùng bậc 3, bậc 7), \"tay phải sẽ tự do hơn nhiều\": nó có thể chơi nốt màu hay giai điệu tuỳ ý. Ví dụ Eb7(#11) từ mức tay 2: tay trái Eb, G, Db giữ hợp âm, tay phải C, F, A là màu. Hai nốt sáng là quãng 10 từ C4 lên E5.", "tip": "Quãng 10 là quãng 8 cộng thêm quãng 3: C lên C ở trên, rồi lên tiếp đến E.", "keys": ["C4", "E5"], "play": [["C4", "E5"], "Eb7(#11)"]}, {"text": "Ending 2 có âm hưởng kết Amen (nhắc: kết IV – I như chữ \"A-men\", ở giọng C là F về C): lần một là F, rồi Fm, rồi về C. Fm mượn từ C thứ, chỉ khác F ở một nốt (A hạ xuống Ab), nên đoạn kết nghe ấm và sâu hơn. Thầy nói đây là \"kiểu ending được dùng rất nhiều\", rất cơ bản. Ending 3–7 thầy chơi bằng tiếng pad strings (âm sắc dàn dây êm, ngân dài của đàn điện tử), không đọc hợp âm, nên hãy xem sách hoặc video. Nghe so sánh: F – C rồi F – Fm – C.", "tip": "F thành Fm: chỉ hạ A xuống nửa cung thành Ab.", "compare": {"a": {"label": "F – C", "play": ["F", "C"]}, "b": {"label": "F – Fm – C", "play": ["F", "Fm", "C"]}}}, {"text": "Sau các ending, sách có bảy pattern để luyện ending, có nhạc phát qua mã QR. Pattern 1 đi theo âm giai blues: khi đánh E thì lướt qua Eb rồi vào E. Đây là ý của dòng blues đã học (lướt qua Eb, nốt đặc trưng của blues khi chơi ở giọng C). Vì sao: Eb cách E nửa cung, nên lướt qua nó làm nốt E nghe mềm và có chất blues. Nghe: Eb rồi E.", "tip": "Eb là phím đen ngay bên trái E.", "keys": ["Eb4", "E4"], "play": [["Eb4"], ["E4"], ["C3", "|", "Eb4"], ["C3", "|", "E4", "G4", "C5"]]}, {"text": "Mỗi pattern thầy luyện qua mọi giọng theo vòng quãng 5, rồi cuối cùng quay lại C. Vòng quãng 5 là đổi giọng mỗi lần một quãng 5, giống \"mẹ\" về \"con\": thầy đọc … Bb, Eb, Ab … rồi về C. Vì sao: thầy nói chăm luyện cả bảy pattern theo vòng quãng 5 thì gặp tình huống ending bất chợt ở giọng nào cũng ứng biến được. Nghe nốt chủ Bb, Eb, Ab.", "tip": "Từ Bb đếm xuống 5 tên nốt (Bb, Ab, G, F, Eb) là Eb; từ Eb đếm xuống tiếp là Ab.", "keys": ["Bb3", "Eb4", "Ab3"], "play": [["Bb3"], ["Eb4"], ["Ab3"]]}, {"text": "Pattern 2, 3, 4 thầy chỉ chơi, không đọc hợp âm, nên chỉ nêu ý: pattern 2 đi lên, có cả nốt bậc 3; pattern 3 giống pattern 2 nhưng thêm flat 7, \"cũng rất tốt để luyện rhythm\". Flat 7 (b7) là nốt 7 hạ nửa cung: ở giọng C là Bb thay cho B, nên nghe hơi blues. Pattern 4 có bass đi lên và dùng hợp âm tăng (hợp âm trưởng có bậc 5 nâng nửa cung) để đẩy tiến lên phía trước. Muốn bấm đúng các pattern này thì xem sách hoặc nghe nhạc qua mã QR.", "tip": "b7 ở giọng C: B lùi nửa cung là Bb.", "keys": ["Bb4", "B4"], "compare": {"a": {"label": "B (nốt 7 trong giọng C)", "play": [["B4"]]}, "b": {"label": "Bb (flat 7)", "play": [["Bb4"]]}}}, {"text": "Pattern 5 đi vào II–V, có G7(b9); ở giọng C, II–V đó là Dm7 – G7(b9) rồi về C. Nốt b9 của G7 là Ab, làm \"mẹ\" căng hơn trước khi về C. Pattern 6 là kết Amen (nhắc: IV về I, ở giọng C là F về C), còn pattern 7 thầy chỉ chơi; thầy không đọc hợp âm của hai pattern này, nên hãy xem sách hoặc nghe nhạc qua mã QR. Thầy dặn: khi chơi có ending nhỏ và ending lớn, cả hai đều cần chuẩn bị và luyện. Nghe: Dm7 – G7(b9) – C.", "tip": "b9 là nốt gốc nhích lên nửa cung: G lên nửa cung là Ab.", "play": ["Dm7", "G7(b9)", "C"]}], "remember": ["Ending chơi thoải mái theo ý mình; tay trái giữ đủ hoà âm nên tay phải tự do.", "Ending 1: Am/F# = F#m7b5; F7(#11) thay bằng B7; A7 đổi thành Eb7(#11).", "Kết Amen F → Fm → C (ending 2); pattern 6 cũng là kết Amen. Luyện bảy pattern qua mọi giọng theo vòng quãng 5."], "items": [{"chord": "Fm", "rel": "modal", "prog": ["F", "Fm", "C"]}, {"chord": "G7(b9)", "to": "C", "prog": ["Dm7", "G7(b9)", "C"]}]
