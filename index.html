<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Phildave – Hợp âm màu</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#16181d">
<style>
  :root { --bg:#16181d; --card:#22252c; --tx:#e9e9ee; --mut:#9aa0ab; --lh:#4ea1ff; --rh:#ffa94d; --ok:#3ecf72; --bad:#ff5d5d; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,sans-serif; background:var(--bg); color:var(--tx); display:flex; flex-direction:column; height:100vh; }
  header { display:flex; align-items:center; justify-content:space-between; padding:10px 14px; background:#101216; }
  header b { font-size:16px; }
  #midi { font-size:13px; color:var(--mut); }
  #midi.on { color:var(--ok); }
  nav { display:flex; }
  nav button { flex:1; padding:10px; background:#1c1f25; color:var(--mut); border:0; border-bottom:2px solid transparent; font-size:15px; }
  nav button.act { color:var(--tx); border-color:var(--rh); }
  main { flex:1; overflow:auto; padding:12px 14px; }
  .card { background:var(--card); border-radius:10px; padding:12px; margin-bottom:10px; }
  .card h3 { margin:0 0 6px; font-size:16px; }
  .card p { margin:4px 0; color:#cfd2d8; line-height:1.45; }
  button.b { background:#2f3440; color:var(--tx); border:0; border-radius:8px; padding:9px 12px; font-size:15px; margin:4px 4px 0 0; }
  button.b.pri { background:var(--rh); color:#1a1a1a; font-weight:600; }
  .choices { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:8px; }
  .choices button { padding:14px 6px; font-size:16px; }
  .choices button.right { background:var(--ok); color:#111; font-weight:700; }
  .choices button.wrong { background:var(--bad); color:#111; }
  .playing { outline:3px solid var(--ok); }
  .sug { display:flex; gap:6px; align-items:flex-start; padding:6px; border-radius:8px; border:2px solid transparent; }
  .sug.sel { border-color:var(--rh); background:#2b2a26; }
  .sug div { flex:1; }
  .prog { font-size:20px; letter-spacing:1px; margin:6px 0; }
  .prog .q { color:var(--rh); }
  input { width:100%; padding:10px; font-size:17px; border-radius:8px; border:1px solid #3a3f4b; background:#111318; color:var(--tx); }
  .ok { color:var(--ok); } .bad { color:var(--bad); } .mut { color:var(--mut); font-size:13px; }
  #practice { background:#101216; padding:8px 10px 10px; border-top:1px solid #2a2e37; }
  #ptitle { font-size:15px; min-height:20px; }
  #phint { font-size:13px; color:var(--mut); min-height:18px; white-space:pre-line; }
  #kbwrap { overflow-x:auto; margin-top:6px; }
  #kb { position:relative; height:110px; }
  .w,.k { position:absolute; top:0; border-radius:0 0 4px 4px; }
  .w { width:28px; height:110px; background:#f4f4f4; border:1px solid #888; }
  .k { width:18px; height:68px; background:#222; z-index:2; border:1px solid #000; }
  .lh { background:var(--lh) !important; } .rh { background:var(--rh) !important; }
  .on { box-shadow: inset 0 -14px 0 var(--ok); }
  .lbl { position:absolute; bottom:3px; width:100%; text-align:center; font-size:10px; color:#555; pointer-events:none; }
  .lbl.c { font-size:13px; font-weight:800; color:#000; }
  .k .lbl { font-size:7.5px; letter-spacing:-.3px; color:#ddd; bottom:4px; }
  #kblabels { position:relative; height:22px; }
  .hand { position:absolute; top:0; transform:translateX(-50%); white-space:nowrap; font-size:13px; font-weight:700; padding:1px 6px; border-radius:6px; color:#111; }
  .lesson { display:block; width:100%; text-align:left; margin-top:6px; }
  .lesson.next { border:1px solid var(--rh); }
  .lhead { margin-bottom:6px; }
  .why { color:var(--mut); font-size:14px; margin:8px 0 0; }
  .remember { padding-left:20px; line-height:1.5; }
  .tip { background:#2b2a26; border-left:3px solid var(--rh); border-radius:6px; padding:8px 10px; margin:8px 0; font-size:15px; line-height:1.45; }
  .term { border-bottom:1px dotted var(--rh); cursor:pointer; }
  .term-pop { position:fixed; left:10px; right:10px; bottom:160px; z-index:20; background:#2b2f38; border:1px solid var(--rh); border-radius:8px; padding:10px 34px 10px 12px; font-size:14px; line-height:1.4; box-shadow:0 4px 16px #0008; }
  .term-pop button { position:absolute; top:4px; right:6px; background:none; border:0; color:var(--mut); font-size:16px; }
  .row { display:flex; gap:6px; align-items:center; flex-wrap:wrap; margin-top:4px; }
  .qlab { display:block; font-size:13px; color:var(--mut); }
  #qmode { display:block; width:100%; max-width:100%; margin-top:4px; padding:9px; font-size:15px; border-radius:8px; border:1px solid #3a3f4b; background:#111318; color:var(--tx); }
  button.b.seg.act { background:var(--rh); color:#1a1a1a; font-weight:600; }
  button.b:disabled { opacity:.55; }
  .choices button.right, .choices button.wrong { opacity:1; }
  .choices button { overflow-wrap:anywhere; }
  #qscore { margin-left:auto; }
  .confirm { background:#2b2a26; border-radius:8px; padding:6px 8px; } .confirm span { flex:1 1 100%; }
  .tbar { flex:1; height:12px; background:#111318; border-radius:6px; overflow:hidden; }
  .tbar i { display:block; height:100%; background:var(--ok); }
  .tbar i.low { background:var(--bad); }
  .tsec { min-width:2ch; text-align:right; font-size:20px; font-variant-numeric:tabular-nums; }
  .bigscore { font-size:44px; font-weight:800; line-height:1.1; }
  .wq { border-top:1px solid #2f3440; padding:8px 0; } .wq p { margin:2px 0; }
  .hchart { height:110px; padding-left:22px; margin:8px 0 22px; }
  .hplot { position:relative; display:flex; align-items:flex-end; gap:4px; height:100%; }
  .hcol { position:relative; flex:1; min-width:0; height:100%; display:flex; align-items:flex-end; justify-content:center; }
  .hbar { width:100%; max-width:30px; background:var(--rh); border-radius:3px 3px 0 0; }
  .hbar.pass { background:var(--ok); }
  .hcol > span { position:absolute; bottom:-16px; font-size:11px; color:var(--mut); }
  .hline { position:absolute; left:-4px; right:0; border-top:1px dashed var(--mut); pointer-events:none; }
  .hline span { position:absolute; left:-18px; top:-8px; font-size:11px; color:var(--mut); }
</style>
</head>
<body>
<header><b>Phildave</b><label style="font-size:12px;margin-left:12px">Mức tay <select id="level"><option>1</option><option>2</option><option selected>3</option><option>4</option></select></label><label style="font-size:12px;margin-left:12px" title="Âm lượng">🔊 <input type="range" id="vol" min="0.4" max="3" step="0.1" style="width:80px;vertical-align:middle"></label><span id="snd" title="Âm piano: FluidR3_GM (Frank Wen), CC BY 3.0" style="font-size:12px;margin-left:12px">♪ tổng hợp</span><span id="midi">● chưa nối đàn</span></header>
<nav>
  <button data-t="learn" class="act">Học</button>
  <button data-t="quiz">Đố</button>
  <button data-t="reharm">Tái hoà âm</button>
</nav>
<main id="main"></main>
<section id="practice">
  <div id="ptitle" class="mut">Mở một bài ở mục Học, hoặc chạm hợp âm ở mục Tái hoà âm để luyện tay</div>
  <div id="phint"></div>
  <div class="row">
    <button class="b" id="show">Hiện cách bấm</button>
    <button class="b" id="checkTap">Kiểm tra (chạm)</button>
    <button class="b" id="clearTap">Xoá</button>
    <span id="pres"></span>
  </div>
  <div id="kbwrap"><div id="kblabels"></div><div id="kb"></div></div>
</section>

<script type="application/json" id="lessons">[
  {"id": "p3-01", "part": 3, "src": "Phildave 3 · Bài 1", "title": "Tritone: cặp nốt bứt rứt trong G7", "teach": [{"text": "Nửa cung là bước nhỏ nhất trên đàn: từ một phím sang phím sát bên, tính cả phím đen; hai nửa cung là một cung. Khoảng cách giữa hai nốt gọi là quãng. Ví dụ từ C lên E là hai cung: C lên D một cung, D lên E thêm một cung.", "tip": "Hai phím trắng có phím đen ở giữa (như C–D) cách nhau một cung; hai phím trắng sát nhau không có phím đen ở giữa (E–F, B–C) chỉ cách nửa cung.", "keys": ["C4", "E4"], "play": [["C4"], ["D4"], ["E4"], ["C4", "E4"]], "compare": {"a": {"label": "C–D (một cung)", "play": [["C4"], ["D4"]]}, "b": {"label": "E–F (nửa cung)", "play": [["E4"], ["F4"]]}}}, {"text": "Từ B lên F là ba cung, nên quãng này tên là tritone (quãng ba cung); sách còn gọi là quãng 4 tăng hay quãng 5 giảm. Bấm B và F cùng lúc, rồi so với C và G để nghe nó bứt rứt thế nào. Mẹo của thầy để tìm tritone: đọc \"ba-na-na-pa-in-ae-pl\" (chữ banana pineapple trong tiếng Hàn), mỗi âm tiết bấm một phím liền nhau, tính cả phím đen, bắt đầu từ B; âm tiết thứ bảy rơi đúng vào F.", "tip": "Không cần đếm nửa cung: đọc đủ bảy âm tiết \"banana pineapple\", phím cuối là nốt tạo tritone với phím đầu; bắt đầu từ C thì rơi vào F#.", "keys": ["B3", "F4"], "play": [["B3"], ["C4"], ["C#4"], ["D4"], ["D#4"], ["E4"], ["F4"]], "compare": {"a": {"label": "B–F (tritone)", "play": [["B3", "F4"]]}, "b": {"label": "C–G (yên)", "play": [["C4", "G4"]]}}}, {"text": "G7 gồm bốn nốt G, B, D, F; G là nốt gốc (nốt đặt tên cho hợp âm). Đếm từ G thì B là bậc 3, D là bậc 5, F là bậc 7. Hợp âm ghi số 7 không kèm chữ nào khác, như G7, gọi là hợp âm 7, còn gọi là hợp âm át 7 (dominant 7); bài sau sẽ nói vì sao nó có tên này.", "tip": "Tìm nhanh các nốt của G7 trên phím trắng: bấm G rồi cứ cách một phím bấm một phím (G, bỏ A, B, bỏ C, D, bỏ E, F).", "show": "G7", "play": [["G3"], ["B3"], ["D4"], ["F4"], "G7"]}, {"text": "Hợp âm bốn nốt có nhiều loại, và nốt 7 cho biết là loại nào. Cmaj7 (C E G B) có nốt 7 là B; C7 (C E G Bb) là hợp âm 7, có nốt 7 là Bb, thấp hơn B nửa cung; G7 (G B D F) có nốt 7 là F. Nghe Cmaj7 rồi C7: chỉ khác một nốt mà màu khác hẳn.", "tip": "Tìm nốt 7 bằng cách lấy nốt gốc ở trên rồi lùi xuống: maj7 lùi nửa cung (Cmaj7: C lùi nửa cung là B), hợp âm 7 lùi một cung (G7: G lùi một cung là F). Hợp âm m7 như Dm7 (D F A C) cũng lùi một cung: D lùi một cung là C.", "keys": ["B4", "C5"], "compare": {"a": {"label": "Cmaj7 (nốt 7 là B)", "play": ["Cmaj7"]}, "b": {"label": "C7 (nốt 7 là Bb)", "play": ["C7"]}}}, {"text": "Bậc 3 và bậc 7 gọi là nốt định hướng (guide tones), vì chúng quyết định tính chất hợp âm; bậc 1 và bậc 5 ít nói lên điều gì. Bậc 3 cho biết trưởng hay thứ: C E G là hợp âm C trưởng, hạ E xuống Eb thì thành C thứ (Cm); bậc 7 cho biết là maj7 hay hợp âm 7. Nốt định hướng của Cmaj7 là E và B, nghe yên; của G7 là B và F, chính là cặp tritone, nên nghe căng và muốn đi tiếp về C.", "tip": "Trong G7, hai nốt B và F là cặp bứt rứt: B muốn đi lên C, F muốn đi xuống E, mà C và E chính là hai nốt của hợp âm C.", "keys": ["B3", "F4"], "play": [["C4", "E4", "G4"], ["C4", "Eb4", "G4"], ["B3", "F4"], ["C4", "E4"]], "compare": {"a": {"label": "Cmaj7", "play": ["Cmaj7"]}, "b": {"label": "G7 → C", "play": ["G7", "C"]}}}, {"text": "Giọng (key) gồm hai phần: hợp âm nhà, gọi là chủ (tonic), là chỗ nghe như đã xong (nghe C D E F G A B dừng ở B thấy còn dở, về C mới xong); và bộ 7 nốt chính, giọng C là C D E F G A B, tức mọi phím trắng. Bộ nốt này dùng để làm giai điệu và để dựng hợp âm: lấy một nốt rồi xếp chồng cách một phím trắng (C E G B, D F A C, …) là ra 7 hợp âm của giọng C: Cmaj7, Dm7, Em7, Fmaj7, G7, Am7, Bm7b5 (Bm7b5 học ở bài 9); trong đó chỉ G7 có bậc 3 và bậc 7 tạo thành tritone, nên G7 muốn về C. Bài vẫn có thể có hợp âm ngoài giọng, tức hợp âm có nốt nằm ngoài bộ 7 nốt: Am7 (A C E G) nâng C lên C# thành A7 (A C# E G); C# nằm ngay dưới D nửa cung nên A7 kéo mạnh về Dm, giống G7 kéo về C. Quy luật chung: hợp âm ngoài giọng là đường vòng dẫn vào một trong 7 hợp âm của giọng (các bài sau dạy từng cách), nên nhà vẫn là C.", "play": ["Am7", "A7", "Dm"], "tip": "Bài hát thường kết thúc ở hợp âm nhà: nhìn hợp âm cuối bài là đoán được giọng.", "keys": ["C4"], "compare": {"a": {"label": "Dừng ở B (còn dở)", "play": [["C4"], ["D4"], ["E4"], ["F4"], ["G4"], ["A4"], ["B4"]]}, "b": {"label": "Về C (xong)", "play": [["C4"], ["D4"], ["E4"], ["F4"], ["G4"], ["A4"], ["B4"], ["C5"]]}}}], "remember": ["Tritone (quãng ba cung) là cặp nốt bứt rứt, ví dụ B–F; tìm bằng mẹo banana: đọc bảy âm tiết, mỗi âm tiết một phím liền nhau.", "Nốt 7: maj7 = nốt gốc lùi nửa cung (Cmaj7 có B); hợp âm 7 (hợp âm át 7) = nốt gốc lùi một cung (G7 có F).", "Nốt định hướng (guide tones) là bậc 3 và bậc 7; trong giọng C chỉ G7 có cặp này là tritone: B muốn lên C, F muốn xuống E."], "items": [{"chord": "G7", "to": "C"}], "quiz": [{"q": "Trong G7 (G B D F), cặp nốt nào là tritone, cặp bứt rứt?", "choices": ["B và F", "G và D", "G và B", "D và F"], "answer": "B và F", "why": "Đọc mẹo banana từ B, âm tiết thứ bảy rơi đúng vào F (B và F cách nhau ba cung, tức 6 nửa cung)."}, {"q": "Trong 7 hợp âm của giọng C, hợp âm nào có tritone giữa bậc 3 và bậc 7?", "choices": ["G7", "Cmaj7", "Am7", "Dm7"], "answer": "G7", "why": "Bậc 3 và bậc 7 của G7 là B và F, đúng cặp tritone; Cmaj7 có E và B, Am7 có C và G, Dm7 có F và C, đều nghe yên."}, {"q": "Nốt 7 của Cmaj7 là nốt nào?", "choices": ["B", "Bb", "A", "G"], "answer": "B", "why": "Mẹo: nốt 7 của maj7 là nốt gốc lùi nửa cung, C lùi nửa cung là B. Còn C7 thì lùi một cung, ra Bb."}]},

  {"id": "p3-02", "part": 3, "src": "Phildave 3 · Bài 2", "title": "Tritone là quãng bất ổn nhất", "teach": [{"text": "Trong mọi cặp hai nốt vang cùng lúc, tai người thấy tritone là bất ổn nhất. Thử với Cmaj7: hạ nốt B xuống nửa cung thành Bb, ta được C7. Lúc này E và Bb thành một tritone, và hợp âm nghe như đang \"cần đi đâu đó\".", "tip": "Kiểm tra bằng mẹo banana: bắt đầu từ E, âm tiết thứ bảy rơi đúng vào Bb.", "show": "C7", "compare": {"a": {"label": "Cmaj7", "play": ["Cmaj7"]}, "b": {"label": "C7", "play": ["C7"]}}}, {"text": "Vì có tritone giữa bậc 3 và bậc 7, hợp âm 7 (hợp âm át 7, dominant 7) được thầy gọi vui là \"mẹ\": nó kéo \"con\" về nhà. G7 là \"mẹ\" của C. Từ \"mẹ\" về \"con\", nốt gốc đi xuống một quãng 5: G xuống C.", "tip": "Tìm \"mẹ\" của một hợp âm: từ nốt gốc của nó đếm lên 5 tên nốt, nốt thứ năm là nốt gốc của \"mẹ\" (C, D, E, F, G: \"mẹ\" của C là G7). Nốt thứ năm luôn cùng loại phím với nốt đầu (C–G, D–A, Eb–Bb, F#–C#); chỉ có hai ngoại lệ khác loại phím: B lên F# và Bb lên F (vì B–F là tritone).", "show": "G7", "play": ["G7", "C"]}, {"text": "Vì tritone bất ổn, nó sinh ra một lực muốn tìm chỗ yên, gọi là lực kéo về chủ (dominant motion). \"Chủ\" là hợp âm nhà của giọng; trong giọng C, chủ là C. Nghe G7 rồi C: cảm giác căng được thả lỏng. Thầy nói mọi tiến hành hợp âm thực chất đều nhờ tritone mà có.", "play": ["G7", "C"]}, {"text": "Không chỉ G7 mới là \"mẹ\": A7, D7, E7 cũng có tritone, nên cũng kéo về hợp âm có nốt gốc thấp hơn nó một quãng 5. A7 về Dm, D7 về G, E7 về Am. Một \"mẹ\" dẫn về hợp âm khác ngoài chủ như vậy gọi là hợp âm át phụ (secondary dominant).", "tip": "Ngược lại, từ nốt gốc của \"mẹ\" đếm xuống 5 tên nốt là ra đích: A, G, F, E, D, nên A7 về Dm.", "show": "A7", "compare": {"a": {"label": "A7 → Dm", "play": ["A7", "Dm"]}, "b": {"label": "E7 → Am", "play": ["E7", "Am"]}}}], "remember": ["Tritone làm hợp âm bất ổn, muốn đi về chỗ yên.", "Hợp âm át 7 (\"mẹ\") kéo về hợp âm có nốt gốc thấp hơn nó một quãng 5: G7 → C (đếm xuống G, F, E, D, C); hai đầu quãng 5 cùng loại phím, trừ B–F# và Bb–F.", "A7 → Dm, D7 → G, E7 → Am là hợp âm át phụ (secondary dominant)."], "items": [{"chord": "G7", "to": "C"}, {"chord": "A7", "to": "Dm"}, {"chord": "E7", "to": "Am"}], "quiz": [{"q": "Hạ nốt B của Cmaj7 xuống nửa cung thì được hợp âm gì?", "choices": ["C7", "Cm7", "Em7", "Am7"], "answer": "C7", "why": "Cmaj7 = C E G B; hạ B xuống Bb thì nốt 7 thành nốt gốc lùi một cung, đúng kiểu hợp âm 7: C E G Bb là C7."}, {"q": "D7 kéo về hợp âm nào?", "choices": ["G", "A", "E", "C"], "answer": "G", "why": "Từ D đếm xuống 5 tên nốt: D, C, B, A, G, nên D7 kéo về G."}]},

  {"id": "p3-03", "part": 3, "src": "Phildave 3 · Bài 3", "title": "Tỉ lệ dao động: đơn giản thì thuận tai", "teach": [{"text": "Mỗi nốt là một dao động: nốt A4 rung 440 lần mỗi giây (440 Hz), nốt A3 thấp hơn rung 220 lần. Hai nốt cùng tên liền nhau như A3 và A4 cách nhau một quãng 8, và tỉ lệ dao động của chúng là 1:2, đơn giản nhất. Vì vậy hai nốt này hoà vào nhau gần như một nốt.", "tip": "Quãng 8 trên phím: từ một phím đếm lên 8 phím trắng, tính cả hai đầu (A B C D E F G A), là gặp lại đúng tên nốt đó.", "keys": ["A3", "A4"], "play": [["A3", "A4"]]}, {"text": "Tỉ lệ càng đơn giản thì nghe càng thuận tai: quãng 5 đúng (C–G) là 2:3, quãng 4 đúng (C–F) là 3:4. Quãng 3 trưởng (C–E) là 4:5, quãng 3 thứ (C–Eb) là 5:6, vẫn khá êm. Các quãng 1, 4, 5, 8 được gọi là quãng đúng (perfect) chính vì tỉ lệ rất đơn giản.", "tip": "Tên quãng là số tên nốt đếm từ nốt dưới lên nốt trên, tính cả hai đầu: C D E F G là 5 nốt nên C–G là quãng 5; C D E F là 4 nốt nên C–F là quãng 4.", "keys": ["C4", "G4"], "play": [["C4", "G4"], ["C4", "F4"], ["C4", "E4"]]}, {"text": "Tỉ lệ càng phức tạp thì càng nghịch tai. Quãng 2 thứ (hai phím sát nhau, như B–C) là 15:16, còn tritone B–F là 32:45. Đó là lý do vật lý khiến tritone bứt rứt và muốn đi tiếp.", "keys": ["B3", "F4"], "compare": {"a": {"label": "B–C (15:16)", "play": [["B3", "C4"]]}, "b": {"label": "B–F (32:45)", "play": [["B3", "F4"]]}}}, {"text": "Dời tritone đi đâu thì nó vẫn là quãng ba cung: F–B, C–F#, E–Bb đều là tritone. Vì vậy hợp âm nào chứa một cặp như thế cũng mang cảm giác căng của G7. Ví dụ C7 có E–Bb, nên C7 muốn đi về F.", "tip": "Kiểm tra cặp nào cũng được bằng mẹo banana: bắt đầu từ F, âm tiết thứ bảy rơi vào B; bắt đầu từ C thì rơi vào F#.", "keys": ["E4", "Bb4"], "play": [["B3", "F4"], ["E4", "Bb4"], "C7", "F"]}], "remember": ["Tỉ lệ dao động đơn giản (1:2, 2:3, 3:4) thì thuận tai.", "Tritone có tỉ lệ 32:45, rất phức tạp, nên nghe bứt rứt."], "items": [{"chord": "G7", "to": "C"}, {"chord": "C7", "to": "F"}], "quiz": [{"q": "Quãng nào có tỉ lệ dao động đơn giản nhất?", "choices": ["Quãng 8 (1:2)", "Quãng 5 đúng (2:3)", "Quãng 3 trưởng (4:5)", "Tritone (32:45)"], "answer": "Quãng 8 (1:2)", "why": "1:2 là tỉ lệ đơn giản nhất, nên hai nốt cách nhau quãng 8 hoà vào nhau gần như một nốt."}, {"q": "Vì sao tritone nghe bứt rứt?", "choices": ["Tỉ lệ dao động 32:45 rất phức tạp", "Vì nó gồm ba nốt", "Vì nó luôn rơi vào phím đen", "Vì hai nốt cách nhau quãng 8"], "answer": "Tỉ lệ dao động 32:45 rất phức tạp", "why": "Tỉ lệ càng phức tạp thì tai càng thấy nghịch; 32:45 phức tạp hơn hẳn 2:3 hay 3:4."}]},

  {"id": "p3-04", "part": 3, "src": "Phildave 3 · Bài 4", "title": "Hợp âm có tritone là hợp âm át 7", "teach": [{"text": "7 hợp âm dựng từ chính các nốt của giọng C (chỉ phím trắng) gọi là hợp âm trong giọng (diatonic): Cmaj7, Dm7, Em7, Fmaj7, G7, Am7, Bm7b5. Trong 7 hợp âm này, chỉ G7 (G–B–D–F) có tritone B–F giữa bậc 3 và bậc 7. Vì thế G7 là hợp âm át 7 duy nhất của giọng C.", "show": "G7", "play": ["G7", "C"]}, {"text": "Ra ngoài phím trắng, A7, D7, E7, B7 và cả Bb7 đều có tritone. Ví dụ E7 = E G# B D: bậc 3 là G#, bậc 7 là D, và G#–D là một tritone. Cứ là hợp âm 7 (ghi số 7 không kèm maj hay m) thì bậc 3 và bậc 7 luôn là tritone như vậy, tức là một \"mẹ\".", "tip": "Dựng nhanh hợp âm 7 từ bất kỳ nốt nào: hợp âm trưởng của nốt đó + nốt gốc lùi một cung (E7 = hợp âm E là E G# B, thêm D).", "show": "E7", "play": ["E7", "Am"]}, {"text": "Nốt màu (tension) là các nốt 9, 11, 13 xếp thêm lên hợp âm 7 cho nghe giàu hơn. Ví dụ nốt 9 của G7 là A: chính là nốt ngay trên G (G, A), nhưng đặt cao lên một quãng 8. G9 vẫn kéo về C như G7, chỉ nghe đầy đặn hơn.", "tip": "Cách tính nhanh: 9 = nốt thứ 2, 11 = nốt thứ 4, 13 = nốt thứ 6 tính từ nốt gốc, chỉ đặt cao lên một quãng 8 (G7: 9 là A, 11 là C, 13 là E).", "show": "G9", "compare": {"a": {"label": "G7 → C", "play": ["G7", "C"]}, "b": {"label": "G9 → C", "play": ["G9", "C"]}}}, {"text": "Thăng hoặc giáng nốt màu đi nửa cung thì ta có màu biến đổi, hay gặp nhất là b9, #9, b13 (gọi chung là màu altered). Màu biến đổi nghe rất căng, nên chỉ hợp với hợp âm vốn đã căng, tức hợp âm có tritone. Ví dụ E7 thêm b9 (nốt F) thành E7(b9), về Am rất đẹp. Cách đọc: dấu đọc trước số, b9 là \"flat 9\", #9 là \"sharp 9\".", "tip": "b9 là phím ngay trên nốt gốc (E7: E nhích lên nửa cung là F), đặt cao lên một quãng 8. Khi nghe so sánh, để ý nốt cao nhất: E7 giữ E, còn E7(b9) có F rồi trượt xuống E của Am.", "show": "E7(b9)", "compare": {"a": {"label": "E7 → Am", "play": [["E2", "D3", "G#3", "B3", "E4"], ["A2", "A3", "C4", "E4"]]}, "b": {"label": "E7(b9) → Am", "play": [["E2", "D3", "G#3", "B3", "F4"], ["A2", "A3", "C4", "E4"]]}}}], "remember": ["Trong 7 hợp âm trong giọng (diatonic) của C, chỉ G7 có tritone giữa bậc 3 và bậc 7.", "Hợp âm 7, tức hợp âm át 7 (G7, A7, D7, E7, B7, Bb7), đều có tritone giữa bậc 3 và bậc 7.", "Màu biến đổi (b9, #9, b13) chỉ dùng trên hợp âm có tritone."], "items": [{"chord": "G9", "to": "C"}, {"chord": "E7(b9)", "to": "Am"}], "quiz": [{"q": "Màu biến đổi (b9, #9, b13) đặt được lên hợp âm nào?", "choices": ["E7", "Am7", "Cmaj7", "Dm7"], "answer": "E7", "why": "Chỉ hợp âm có tritone như E7 mới hợp với màu biến đổi; Am7, Cmaj7, Dm7 không có tritone."}]},

  {"id": "p3-05", "part": 3, "src": "Phildave 3 · Bài 5", "title": "Nốt định hướng: bậc 3 và bậc 7", "teach": [{"text": "Trong ban nhạc, người chơi bass đã đánh nốt gốc. Nếu piano và guitar cũng đánh nốt gốc thì âm thanh bị lặp, nặng nề. Vì thế piano nên đánh nốt định hướng, phần cho biết tính chất hợp âm. Nghe thử: chỉ nốt gốc G rồi C thì chưa rõ gì, thêm nốt định hướng vào thì nghe ngay G7 về Cmaj7.", "keys": ["F3", "B3"], "compare": {"a": {"label": "Chỉ nốt gốc", "play": [["G2"], ["C3"]]}, "b": {"label": "Có nốt định hướng", "play": [["G2", "F3", "B3"], ["C3", "E3", "B3"]]}}}, {"text": "Ví dụ: bass đánh C, tay phải piano đánh E–G–B. Riêng tay phải trông như hợp âm Em, nhưng ghép với bass C thì cả ban nhạc vang thành Cmaj7. Bậc 3 (E) và bậc 7 (B) đã đủ cho tai biết đây là Cmaj7.", "show": "Cmaj7", "play": [["C3"], ["E4", "G4", "B4"], ["C3", "E4", "G4", "B4"]]}, {"text": "Chỉ có nốt gốc thì không biết hợp âm trưởng hay thứ, cũng không biết nó muốn đi đâu; nốt định hướng cho biết cả hai. Cmaj7 có nốt định hướng E–B là quãng 5 đúng, nghe yên nên đứng lại được; C7 có E–Bb là tritone, nghe căng nên muốn đi tiếp về F. Hợp âm đang căng là chỗ hợp nhất để thêm nốt màu: nốt màu làm nó căng hơn và nhiều màu hơn, nên lúc về đích nghe càng đã tai, ví dụ C7(b9) có thêm Db trượt xuống C của F, thành thêm một đường dẫn về đích. Còn hợp âm yên như Cmaj7 mà thêm nốt màu căng (b9, #9, b13) thì mất cảm giác yên và nghe chói, nên chỗ yên chỉ thêm màu nhẹ.", "tip": "Nốt màu căng đặt ở hợp âm có tritone để tăng lực kéo về đích; hợp âm yên chỉ thêm màu nhẹ.", "compare": {"a": {"label": "Cmaj7 (yên)", "play": [["C3", "E3", "B3"]]}, "b": {"label": "C7 → F, rồi C7(b9) → F", "play": [["C3", "E3", "Bb3"], ["F2", "A3", "C4"], ["C3", "E3", "Bb3", "Db4"], ["F2", "A3", "C4"]]}}}, {"text": "Với hợp âm át phụ (D7, E7, A7, B7 trong giọng C), tay trái chỉ cần nốt định hướng, ví dụ D7 là F# và C. Tay trái gọn thì còn chỗ cho nốt màu như b9, #9 và cho tay phải chơi giai điệu. Thầy dặn \"tay trái cần tự do hơn\" là vì vậy. Nghe: nốt định hướng D7 → G7 → Cmaj7, mỗi bước chỉ trượt nửa cung hoặc giữ nguyên.", "tip": "Nốt định hướng của hợp âm 7 = bậc 3 của hợp âm trưởng cùng gốc + nốt gốc lùi một cung: D7 có F# (hợp âm D là D F# A) và C (D lùi một cung).", "keys": ["F#3", "C4"], "play": [["F#3", "C4"], ["F3", "B3"], ["E3", "B3"]]}], "remember": ["Nốt định hướng = bậc 3 + bậc 7, cho biết tính chất hợp âm.", "Bass lo nốt gốc, piano lo nốt định hướng.", "D7: tay trái chỉ cần F# + C."], "items": [{"chord": "D7", "to": "G"}, {"chord": "B7", "to": "Em"}], "quiz": [{"q": "Nốt định hướng (guide tones) của Cmaj7 là cặp nào?", "choices": ["E và B", "C và G", "C và E", "G và B"], "answer": "E và B", "why": "Bậc 3 của Cmaj7 là E, bậc 7 là B."}, {"q": "Nốt định hướng của D7 là cặp nào?", "choices": ["F# và C", "D và A", "D và F#", "A và C"], "answer": "F# và C", "why": "D7 = D F# A C: bậc 3 là F#, bậc 7 là C (D lùi một cung), hai nốt tạo thành tritone."}]},

  {"id": "p3-06", "part": 3, "src": "Phildave 3 · Bài 6", "title": "Chỉ một hợp âm có quãng nghịch", "teach": [{"text": "Quãng nghịch là quãng nghe chọi: quãng 2 thứ (hai phím sát nhau, như B–C) và tritone. Trong 7 hợp âm trong giọng, chỉ hợp âm át 7 có quãng nghịch giữa hai nốt định hướng. Giọng C có G7, giọng D có A7, giọng E có B7.", "tip": "Hợp âm át 7 của một giọng nằm ở bậc 5: từ nốt chủ đếm lên 5 tên nốt (D, E, F#, G, A), nên giọng D có A7.", "show": "A7", "compare": {"a": {"label": "B–C", "play": [["B3", "C4"]]}, "b": {"label": "A7 → D", "play": ["A7", "D"]}}}, {"text": "Nốt định hướng của 6 hợp âm còn lại đều là quãng thuận: Cmaj7 có E–B, Dm7 có F–C, đều là quãng 5 đúng (tỉ lệ 2:3). Chỉ G7 có B–F, tỉ lệ 32:45. Vì vậy chỉ G7 bứt rứt và đi về C, các hợp âm khác đứng yên được.", "compare": {"a": {"label": "Dm7", "play": ["Dm7"]}, "b": {"label": "G7 → C", "play": ["G7", "C"]}}}, {"text": "Âm giai (scale) là dãy nốt xếp theo khoảng cách cố định. C trưởng tự nhiên (natural major) là C D E F G A B. C thứ tự nhiên (natural minor) là C D Eb F G Ab Bb.", "tip": "C thứ tự nhiên = C trưởng hạ bậc 3, 6, 7 xuống nửa cung: E, A, B thành Eb, Ab, Bb.", "compare": {"a": {"label": "C trưởng", "play": [["C4"], ["D4"], ["E4"], ["F4"], ["G4"], ["A4"], ["B4"], ["C5"]]}, "b": {"label": "C thứ tự nhiên", "play": [["C4"], ["D4"], ["Eb4"], ["F4"], ["G4"], ["Ab4"], ["Bb4"], ["C5"]]}}}, {"text": "C thứ hoà âm (harmonic minor) là C thứ tự nhiên nâng bậc 7 lên B: C D Eb F G Ab B. C thứ giai điệu (melodic minor) nâng cả bậc 6 và 7: C D Eb F G A B. Thầy dặn ôn kỹ bốn âm giai này, vì chúng rất quan trọng khi solo.", "compare": {"a": {"label": "Thứ hoà âm", "play": [["C4"], ["D4"], ["Eb4"], ["F4"], ["G4"], ["Ab4"], ["B4"], ["C5"]]}, "b": {"label": "Thứ giai điệu", "play": [["C4"], ["D4"], ["Eb4"], ["F4"], ["G4"], ["A4"], ["B4"], ["C5"]]}}}], "remember": ["Quãng nghịch: quãng 2 thứ và tritone.", "Trong 7 hợp âm trong giọng, chỉ hợp âm át 7 có tritone ở nốt định hướng.", "4 âm giai cần thuộc: C trưởng, C thứ tự nhiên, thứ hoà âm, thứ giai điệu."], "items": [{"chord": "A7", "to": "D"}, {"chord": "B7", "to": "E"}], "quiz": [{"q": "Trong giọng D, hợp âm nào có quãng nghịch giữa hai nốt định hướng?", "choices": ["A7", "D", "Em7", "Bm7"], "answer": "A7", "why": "Mỗi giọng chỉ có một hợp âm át 7, nằm ở bậc 5; giọng D đếm D, E, F#, G, A nên là A7 (C# và G là tritone)."}, {"q": "C thứ hoà âm (harmonic minor) khác C thứ tự nhiên ở đâu?", "choices": ["Bậc 7 nâng lên B", "Bậc 3 nâng lên E", "Bậc 6 hạ xuống Ab", "Bậc 2 hạ xuống Db"], "answer": "Bậc 7 nâng lên B", "why": "Thứ hoà âm giữ nguyên thứ tự nhiên, chỉ nâng bậc 7 từ Bb lên B."}]},

  {"id": "p3-07", "part": 3, "src": "Phildave 3 · Bài 7", "title": "Lực muốn trở về chỗ yên", "teach": [{"text": "Tritone B–F của G7 tự tìm nốt gần nhất trong âm giai C: B đi lên nửa cung thành C, F đi xuống nửa cung thành E. C và E chính là hai nốt của hợp âm C. Tính chất muốn đi về C này là lực kéo về chủ (dominant motion).", "keys": ["B3", "F4"], "play": [["B3", "F4"], ["C4", "E4"]]}, {"text": "Thầy ví đây là quy luật tự nhiên của âm giai trưởng, như nước chảy chỗ trũng. Cũng giống hai dây điện chênh điện áp thì có dòng điện chạy giữa chúng. Ta không ép G7 về C; chính tritone tự muốn về.", "show": "G7", "play": ["G7", "C"]}, {"text": "Lực kéo này lặp lại được: C7 về F, F7 về Bb, Bb7 về Eb, cứ thế theo vòng quãng 5 (C–F–Bb–Eb–Ab–Db–Gb–B). Mỗi bước, nốt gốc đi xuống một quãng 5, giống G7 về C. Nghe chuỗi này, mỗi hợp âm vừa là chỗ đến, vừa là chỗ đi tiếp.", "tip": "Đi xuống một quãng 5 cũng chính là đi lên một quãng 4: C lên F (C, D, E, F), F lên Bb (F, G, A, Bb), chứ không phải B, vì F–B là tritone.", "play": ["C7", "F7", "Bb7", "Eb"]}, {"text": "Vì thế thầy khuyên luyện mọi thứ theo vòng quãng 5, thay vì C, D, E theo thứ tự phím. Tập như vậy, tay và tai quen với đúng đường đi tự nhiên của hợp âm.", "play": ["D7", "G7", "C"]}], "remember": ["B lên C, F xuống E: tritone của G7 tự đi về C.", "Lực kéo về chủ (dominant motion) lặp lại theo vòng quãng 5: C7 → F7 → Bb7 → Eb."], "items": [{"chord": "C7", "to": "F"}, {"chord": "F7", "to": "Bb"}, {"chord": "Bb7", "to": "Eb"}], "quiz": [{"q": "Khi G7 về C, nốt B của G7 đi đâu?", "choices": ["Lên C", "Xuống A", "Lên D", "Xuống G"], "answer": "Lên C", "why": "B thấp hơn C nửa cung nên đi lên C, còn F đi xuống E."}, {"q": "Trong vòng quãng 5 C–F–Bb–…, hợp âm tiếp theo sau Bb là gì?", "choices": ["Eb", "C", "F", "D"], "answer": "Eb", "why": "Mỗi bước đi xuống một quãng 5: từ Bb đếm xuống 5 tên nốt (Bb, A, G, F, Eb) là Eb."}]},

  {"id": "p3-08", "part": 3, "src": "Phildave 3 · Bài 8", "title": "Thoát nhạc thiếu nhi nhờ hợp âm át 7", "teach": [{"text": "Vòng Cmaj7 – Am7 – Dm7 – G7 chỉ dùng hợp âm trong giọng C, nên nghe đơn giản, như nhạc thiếu nhi. Nó không sai, nhưng thiếu lực đẩy, vì cả vòng chỉ có một chỗ có tritone là G7.", "play": ["Cmaj7", "Am7", "Dm7", "G7", "Cmaj7"]}, {"text": "Giờ đổi Am7 thành A7: tritone xuất hiện (C# và G), nên A7 bắt buộc đi xuống quãng 5 về Dm7. Am7 thì tự do, đi đâu cũng được, còn A7 thì phải về Dm7. Đó là sức mạnh của hợp âm át phụ.", "tip": "Đổi Am7 (A C E G) thành A7 chỉ cần nâng C lên C#: đúng bậc 3 của hợp âm trưởng A, còn G là A lùi một cung.", "show": "A7", "compare": {"a": {"label": "Có Am7", "play": ["Cmaj7", "Am7", "Dm7"]}, "b": {"label": "Có A7", "play": ["Cmaj7", "A7", "Dm7"]}}}, {"text": "Tương tự, đổi Dm7 thành D7 thì D7 kéo về G7. Vòng mới Cmaj7 – A7 – D7 – G7 có ba \"mẹ\" liền nhau kéo nhau về Cmaj7, nghe hết \"thiếu nhi\". Nhưng đừng đổi mọi chỗ thành hợp âm át 7; bài 10 sẽ nói vì sao.", "compare": {"a": {"label": "Vòng gốc", "play": ["Cmaj7", "Am7", "Dm7", "G7", "Cmaj7"]}, "b": {"label": "Vòng mới", "play": ["Cmaj7", "A7", "D7", "G7", "Cmaj7"]}}}, {"text": "Bước tiếp theo là thêm nốt màu, nhưng chỉ thêm vào chỗ là hợp âm át 7. Ví dụ A7 thêm b9 thành A7(b9) để về Dm7. Không thêm màu biến đổi vào Cmaj7 hay Dm7, vì chúng không có tritone.", "show": "A7(b9)", "play": ["Cmaj7", "A7(b9)", "Dm7"]}], "remember": ["Am7 thì tự do, A7 thì bắt buộc về Dm7.", "Đổi hợp âm thành hợp âm át 7 để có lực đẩy, rồi chỉ thêm nốt màu vào chỗ hợp âm át 7."], "items": [{"chord": "A7(b9)", "to": "Dm7"}, {"chord": "D7", "to": "G7"}], "quiz": [{"q": "Trong vòng Cmaj7 – A7 – Dm7, chỗ nào được thêm màu biến đổi như b9?", "choices": ["A7", "Cmaj7", "Dm7", "Không chỗ nào"], "answer": "A7", "why": "A7 là hợp âm át 7 có tritone; Cmaj7 và Dm7 không có tritone."}]},

  {"id": "p3-09", "part": 3, "src": "Phildave 3 · Bài 9", "title": "Mỗi hợp âm có một \"mẹ\" riêng", "teach": [{"text": "Trong giọng C, mỗi hợp âm trưởng hoặc thứ đều có một hợp âm át 7 riêng, nốt gốc cao hơn nó một quãng 5. G7 → Cmaj7, A7 → Dm7, B7 → Em7. Tiếp theo là C7 → Fmaj7, D7 → G7, E7 → Am7.", "tip": "Tìm \"mẹ\": từ nốt gốc của hợp âm đích đếm lên 5 tên nốt; ví dụ Em7: E, F, G, A, B, nên \"mẹ\" là B7.", "show": "B7", "play": ["B7", "Em7", "E7", "Am7"]}, {"text": "Riêng Bm7b5 thì không có \"mẹ\" riêng. Nó là hợp âm nửa giảm (m7b5): hợp âm m7 có nốt 5 bị hạ nửa cung (Bm7 có F#, Bm7b5 có F), nên không vững, không làm chỗ dừng được.", "tip": "Bm7b5 chỉ gồm phím trắng: bấm B rồi cứ cách một phím bấm một phím (B, D, F, A).", "show": "Bm7b5", "compare": {"a": {"label": "Bm7 (có F#)", "play": ["Bm7"]}, "b": {"label": "Bm7b5 (có F)", "play": ["Bm7b5"]}}}, {"text": "Cách dùng: viết ra các hợp âm trong giọng của bài, rồi đặt \"mẹ\" riêng ngay trước từng hợp âm. Ví dụ C – Dm7 – G7 – C thành C – A7 – Dm7 – G7 – C. Thầy chơi bài ứng dụng hai lần: lần 1 chỉ hợp âm trong giọng, lần 2 thêm hợp âm át phụ, và lực hoà âm tăng lên rõ rệt.", "compare": {"a": {"label": "Lần 1", "play": ["C", "Dm7", "G7", "C"]}, "b": {"label": "Lần 2", "play": ["C", "A7", "Dm7", "G7", "C"]}}}, {"text": "Phải thuộc hợp âm trong giọng của các giọng hay gặp: C, D, E, F, G, A. Trong giọng trưởng, bậc I, IV, V là trưởng; II, III, VI là thứ; VII là m7b5. Ví dụ giọng D: D, Em, F#m, G, A, Bm, C#m7b5.", "tip": "Mẹo nhớ \"1-4-5 trưởng, 2-3-6 thứ\": đích ở bậc 1, 4, 5 thì \"mẹ\" về hợp âm trưởng, ở bậc 2, 3, 6 thì về hợp âm thứ; giọng C: C, F, G trưởng, còn D, E, A thứ.", "play": ["D", "Em", "F#m", "G", "A", "Bm", "C#m7b5"]}, {"text": "\"Mẹ\" luôn là hợp âm 7, dù đích trưởng hay thứ, vì nốt 7 của \"mẹ\" (nốt gốc lùi một cung) luôn đi xuống vào bậc 3 của đích. Đích trưởng: G7 = G B D F, nốt 7 là F; C = C E G, bậc 3 là E; F xuống E chỉ nửa cung. Đích thứ: A7 = A C# E G, nốt 7 là G; Dm = D F A, bậc 3 là F; G xuống F một cung. Thầy gợi ý đi xa hơn với \"mẹ\": thêm b9 cho A7 thành A7(b9), về Dm7 nghe căng và đẹp hơn; màu biến đổi hợp ở đây vì A7 có tritone.", "show": "A7(b9)", "compare": {"a": {"label": "A7 → Dm7", "play": ["A7", "Dm7"]}, "b": {"label": "A7(b9) → Dm7", "play": ["A7(b9)", "Dm7"]}}}], "remember": ["Mỗi hợp âm trưởng hoặc thứ có một \"mẹ\" cao hơn nó một quãng 5 (Em7: đếm E, F, G, A, B, \"mẹ\" là B7).", "Bm7b5 không có \"mẹ\" riêng.", "Giọng trưởng: 1-4-5 trưởng, 2-3-6 thứ, 7 là m7b5; \"mẹ\" của bậc 1, 4, 5 về hợp âm trưởng, của bậc 2, 3, 6 về hợp âm thứ."], "items": [{"chord": "B7", "to": "Em7"}, {"chord": "C7", "to": "Fmaj7"}, {"chord": "E7", "to": "Am7"}], "quiz": [{"q": "Hợp âm nào trong giọng C không có \"mẹ\" riêng?", "choices": ["Bm7b5", "Dm7", "Em7", "Fmaj7"], "answer": "Bm7b5", "why": "Bm7b5 có nốt 5 bị hạ nên không vững, không làm đích, vì vậy không có hợp âm át 7 riêng."}, {"q": "Hợp âm bậc III của giọng D là gì?", "choices": ["F#m", "F#", "Em", "G"], "answer": "F#m", "why": "Giọng D: D, Em, F#m, G, A, Bm, C#m7b5; bậc III là F#m."}]},

  {"id": "p3-10", "part": 3, "src": "Phildave 3 · Bài 10", "title": "Hợp âm đi qua và hợp âm át 7", "teach": [{"text": "Hợp âm có bass riêng là hợp âm mà tay trái bấm một nốt khác nốt gốc, ghi bằng dấu gạch chéo. Ví dụ G/B là hợp âm G, nhưng bass là B. Nhờ đổi bass, đường bass đi xuống từng bậc rất mượt.", "show": "G/B", "compare": {"a": {"label": "G → Am7", "play": ["G", "Am7"]}, "b": {"label": "G/B → Am7", "play": ["G/B", "Am7"]}}}, {"text": "Tiến hành này rất hay gặp trong thánh ca Hàn: Cmaj7 – G/B – Am7 – C/G – Fmaj7 – C/E – Dm7 – G7. Bass đi xuống từng bậc C, B, A, G, F, E, D. Các hợp âm có dấu gạch chéo là hợp âm đi qua (passing chord), nối hai hợp âm chính.", "play": ["Cmaj7", "G/B", "Am7", "C/G", "Fmaj7", "C/E", "Dm7", "G7"]}, {"text": "Có thể đổi hợp âm đi qua thành hợp âm át phụ mà vẫn giữ nguyên bass: G/B thành E7/B, C/G thành C7/G, C/E thành A7/E. Vì sao được? E7 kéo về Am7, C7 kéo về Fmaj7, A7 kéo về Dm7, đúng hợp âm đứng ngay sau. Bass vẫn đi xuống từng bậc, mà hoà âm có thêm lực đẩy.", "tip": "Hợp âm át phụ thay vào phải chứa sẵn nốt bass: E7 = E G# B D có B, nên viết được E7/B.", "show": "E7/B", "compare": {"a": {"label": "Bản gốc", "play": ["Cmaj7", "G/B", "Am7", "C/G", "Fmaj7"]}, "b": {"label": "Đổi thành át phụ", "play": ["Cmaj7", "E7/B", "Am7", "C7/G", "Fmaj7"]}}}, {"text": "Phải chơi bản gốc trước thì mới cảm được chỗ biến hoá. Chỗ nào cũng đổi thành hợp âm át 7 thì không hay nữa, vì cái hay nằm ở chỗ khác với bản gốc.", "play": ["Cmaj7", "G/B", "Am7", "C7/G", "Fmaj7"]}, {"text": "Thế bấm (voicing) là cách chia các nốt của hợp âm cho hai tay. Ở hợp âm có bass riêng, tay trái lo nốt bass, tay phải lo hợp âm phía trên, hai tay không bấm trùng nốt cho gọn. Hợp âm đi qua chỉ lướt nhanh, nên thầy dặn không cần nhồi nốt màu vào.", "show": "C7/G", "play": ["C7/G", "Fmaj7"]}], "remember": ["Hợp âm có bass riêng (G/B, C/E) giúp bass đi xuống từng bậc.", "Đổi hợp âm đi qua thành át phụ, giữ bass: G/B → E7/B, C/G → C7/G, C/E → A7/E."], "items": [{"chord": "E7/B", "to": "Am7"}, {"chord": "C7/G", "to": "Fmaj7"}, {"chord": "A7/E", "to": "Dm7"}], "quiz": [{"q": "Muốn đổi G/B (đứng trước Am7) thành hợp âm át phụ mà vẫn giữ bass B, ta dùng hợp âm nào?", "choices": ["E7/B", "G7/B", "B7", "D7/A"], "answer": "E7/B", "why": "E7 là \"mẹ\" của Am7, và B là một nốt của E7 nên giữ được bass B."}]},

  {"id": "p3-11", "part": 3, "src": "Phildave 3 · Bài 11", "title": "Hợp âm thay thế", "teach": [{"text": "Hợp âm thay thế (substitute) là hợp âm đặt vào chỗ hợp âm khác mà vẫn hợp lý, vì cấu tạo giống nhau hoặc chung nhiều nốt. Ví dụ C (C–E–G) và Am (A–C–E) chung hai nốt C và E. Với hợp âm 4 nốt, Cmaj7 (C–E–G–B) và Am7 (A–C–E–G) chung tới ba nốt.", "show": "Am7", "compare": {"a": {"label": "Cmaj7", "play": ["Cmaj7"]}, "b": {"label": "Am7", "play": ["Am7"]}}}, {"text": "Cách nhận quãng 3: quãng 3 trưởng rộng hai cung, như C–E; quãng 3 thứ hẹp hơn quãng 3 trưởng nửa cung, như C–Eb hay B–D. Hợp âm bốn nốt (maj7, m7, hợp âm 7) đều là các quãng 3 xếp chồng, nên hai hợp âm có nốt gốc cách nhau một quãng 3 (như C và A) thường chung nhiều nốt.", "tip": "Trên phím trắng, cứ cách một phím bấm một phím là xếp chồng quãng 3: Am7 = A C E G, Cmaj7 = C E G B, chung ba nốt C, E, G.", "keys": ["C4", "E4"], "play": [["C4", "E4"], ["C4", "Eb4"], ["B3", "D4"]]}, {"text": "Trong giọng C có ba nhóm thay thế: Cmaj7 thay bằng Am7 hoặc Em7; Fmaj7 thay bằng Dm7; G7 thay bằng Bm7b5. Mỗi cặp chung ba nốt, nên tai vẫn nghe như cùng một vai trò.", "show": "Dm7", "compare": {"a": {"label": "Fmaj7", "play": ["Fmaj7"]}, "b": {"label": "Dm7", "play": ["Dm7"]}}}, {"text": "Vòng quay lại (turnaround) là vòng 1–6–2–5: Cmaj7 – Am7 – Dm7 – G7, lặp đi lặp lại, rất hay gặp trong jazz. Lần lặp thứ hai, thay Cmaj7 bằng Em7. Chọn Em7 chứ không chọn Am7, vì ngay sau đã là Am7; bài vẫn là bài cũ mà nghe có biến hoá.", "compare": {"a": {"label": "Lần 1", "play": ["Cmaj7", "Am7", "Dm7", "G7"]}, "b": {"label": "Lần 2", "play": ["Em7", "Am7", "Dm7", "G7"]}}}], "remember": ["Hợp âm thay thế chung nhiều nốt với hợp âm gốc.", "Cmaj7 ↔ Am7, Em7; Fmaj7 ↔ Dm7; G7 ↔ Bm7b5.", "Vòng quay lại (turnaround): Cmaj7 – Am7 – Dm7 – G7."], "items": [{"chord": "Em7", "to": "Cmaj7", "rel": "sub"}, {"chord": "Am7", "to": "Cmaj7", "rel": "sub"}, {"chord": "Dm7", "to": "Fmaj7", "rel": "sub"}], "quiz": [{"q": "Lần lặp thứ hai của vòng quay lại, vì sao thay Cmaj7 bằng Em7 mà không bằng Am7?", "choices": ["Vì ngay sau đã là Am7", "Vì Em7 không chung nốt nào với Cmaj7", "Vì Em7 là hợp âm át 7", "Vì Am7 không có trong giọng C"], "answer": "Vì ngay sau đã là Am7", "why": "Dùng Am7 thì hai ô nhịp liền nhau cùng một hợp âm; Em7 cũng chung ba nốt với Cmaj7 mà tạo được biến hoá."}]},

  {"id": "p3-12", "part": 3, "src": "Phildave 3 · Bài 12", "title": "Cmaj7, Fmaj7, G7: chuẩn để thay thế", "teach": [{"text": "Bậc I, IV, V (Cmaj7, Fmaj7, G7) là ba hợp âm chuẩn để thay: Cmaj7 thay bằng Em7 hoặc Am7, Fmaj7 thay bằng Dm7, G7 thay bằng Bm7b5. G7 và Bm7b5 chung ba nốt B, D, F, nên Bm7b5 giữ được cả tritone B–F. Vì thế Bm7b5 cũng kéo về C.", "show": "Bm7b5", "compare": {"a": {"label": "G7 → C", "play": ["G7", "C"]}, "b": {"label": "Bm7b5 → C", "play": ["Bm7b5", "C"]}}}, {"text": "Vòng quay lại lần 2: đổi Cmaj7 thành Em7, rồi đổi Am7 thành hợp âm át phụ A7. Ta được Em7 – A7 – Dm7 – G7, đa dạng hơn hẳn. Nhưng trước khi biến hoá, phải kiểm tra hợp âm gốc đã đúng chưa.", "compare": {"a": {"label": "Vòng gốc", "play": ["Cmaj7", "Am7", "Dm7", "G7"]}, "b": {"label": "Vòng biến hoá", "play": ["Em7", "A7", "Dm7", "G7"]}}}, {"text": "Hợp âm át 7 mở rộng (extended dominant) là một chuỗi \"mẹ\" nối nhau, mỗi hợp âm vừa là đích của hợp âm trước vừa là \"mẹ\" của hợp âm sau (như B7 → E7 → A7 → D7). Khi đệm thật, thầy chỉ cho tối đa hai lần biến hoá liên tiếp: ví dụ Cmaj7 – A7 – D7 – G7 – C, thì A7 và D7 là hai chỗ biến hoá, còn G7 vốn có sẵn trong giọng.", "play": ["Cmaj7", "A7", "D7", "G7", "C"]}, {"text": "B7 nghe rất \"khé chát\", vì có tới hai nốt ngoài giọng C (D# và F#), trong khi A7, D7, E7 chỉ có một. Vì thế sau B7 nên về một hợp âm cơ bản (Em7) rồi mới đi tiếp sang A7.", "tip": "Đếm phím đen: B7 = B D# F# A có hai phím đen (D#, F#), còn A7 = A C# E G chỉ có một (C#).", "show": "B7", "play": ["B7", "Em7", "A7", "Dm7"]}], "remember": ["Cmaj7 → Em7 hoặc Am7, Fmaj7 → Dm7, G7 → Bm7b5.", "Chuỗi \"mẹ\" nối nhau (A7 → D7 → G7): tối đa hai lần biến hoá liên tiếp.", "Sau B7 nên về Em7 rồi mới đi tiếp."], "items": [{"chord": "Bm7b5", "to": "G7", "rel": "sub"}, {"chord": "A7", "to": "D7"}, {"chord": "B7", "to": "Em7"}], "quiz": [{"q": "Vì sao Bm7b5 thay được G7?", "choices": ["Chung ba nốt B, D, F, giữ cả tritone", "Vì cùng nốt gốc G", "Vì Bm7b5 là hợp âm trưởng", "Vì Bm7b5 không có tritone"], "answer": "Chung ba nốt B, D, F, giữ cả tritone", "why": "G7 = G B D F, Bm7b5 = B D F A: chung B, D, F, trong đó có tritone B–F."}, {"q": "Vì sao B7 nghe khé hơn A7 trong giọng C?", "choices": ["B7 có hai nốt ngoài giọng (D#, F#)", "B7 không có tritone", "B7 là hợp âm thứ", "B7 có nốt gốc là phím đen"], "answer": "B7 có hai nốt ngoài giọng (D#, F#)", "why": "A7 chỉ có một nốt ngoài giọng C (C#), còn B7 có tới hai."}]},

  {"id": "p3-13", "part": 3, "src": "Phildave 3 · Bài 13", "title": "Cơ bản trước, biến hoá sau", "teach": [{"text": "Hợp âm trong giọng là phần cơ bản, hợp âm át phụ là phần biến hoá. Chỉ dùng nốt của âm giai C trưởng thì dù hay đến đâu vẫn nghe như nhạc thiếu nhi. Nốt ngoài âm giai chính là thứ tạo màu \"biến hoá\".", "compare": {"a": {"label": "Cơ bản", "play": ["C", "Am7", "Dm7", "G7", "C"]}, "b": {"label": "Biến hoá", "play": ["C", "A7", "Dm7", "G7", "C"]}}}, {"text": "Mỗi hợp âm át phụ thêm một nốt ngoài âm giai: C7 có Bb, D7 có F#, E7 có G#, A7 có C#. Riêng B7 có tới hai (D#, F#) nên khé hơn.", "show": "E7", "play": ["E7", "Am7"]}, {"text": "Nốt màu cơ bản của G7 trong giọng C là 9 và 13 (ưu tiên số 1), vì A và E vẫn nằm trong âm giai C. Màu biến đổi b9, b13 là biến hoá (ưu tiên số 2). Hãy chơi quen dạng cơ bản trước rồi mới biến hoá, thì màu biến hoá mới hợp.", "tip": "Nốt 9 của G7 là A (G lên một cung), nốt 13 là E (nốt 5 là D, lên một cung); cả hai đều là phím trắng nên nằm trong âm giai C.", "show": "G13", "compare": {"a": {"label": "Ưu tiên 1: G7(9 13) → C", "play": ["G13", "C"]}, "b": {"label": "Ưu tiên 2: G7(b9 b13) → C", "play": ["G7(b9 b13)", "C"]}}}, {"text": "Ở chỗ E7 (trước Am), có nhiều lựa chọn: E7 không thêm màu, hoặc E7 thêm màu biến đổi như b9, #9, b13. Màu biến đổi hợp ở đây vì E7 đi về hợp âm thứ Am.", "show": "E7(b9)", "compare": {"a": {"label": "E7 → Am", "play": [["E2", "D3", "G#3", "B3", "E4"], ["A2", "A3", "C4", "E4"]]}, "b": {"label": "E7(b9) → Am", "play": [["E2", "D3", "G#3", "B3", "F4"], ["A2", "A3", "C4", "E4"]]}}}, {"text": "Bài tập ở giọng D: hợp âm trong giọng là D, Em, F#m, G, A, Bm, C#m7b5. \"Mẹ\" dẫn vào từng hợp âm: A7 → D, B7 → Em, C#7 → F#m, D7 → G, E7 → A, F#7 → Bm. Thầy nhấn mạnh đây là nền tảng cực kỳ quan trọng.", "play": ["A7", "D", "F#7", "Bm"]}], "remember": ["Hợp âm trong giọng là cơ bản, hợp âm át phụ là biến hoá.", "G7 trong giọng C: màu cơ bản là 9 và 13 (ưu tiên 1); b9, b13 là biến hoá (ưu tiên 2).", "E7 về Am hợp với màu biến đổi (b9, #9, b13)."], "items": [{"chord": "G13", "to": "C"}, {"chord": "E7(b9)", "to": "Am"}, {"chord": "F#7", "to": "Bm"}], "quiz": [{"q": "Nốt nào của A7 nằm ngoài âm giai C?", "choices": ["C#", "F#", "G#", "Bb"], "answer": "C#", "why": "A7 = A C# E G; chỉ C# không có trong âm giai C."}, {"q": "Trong giọng D, \"mẹ\" dẫn vào F#m là hợp âm nào?", "choices": ["C#7", "F#7", "A7", "B7"], "answer": "C#7", "why": "Từ F# đếm lên 5 tên nốt: F#, G#, A, B, C#, nên C#7 kéo về F#m."}]},

  {"id": "p3-14", "part": 3, "src": "Phildave 3 · Bài 14", "title": "Màu biến đổi chỉ dành cho hợp âm át 7", "teach": [{"text": "Đây là nguyên lý quan trọng nhất của Tension Mastering: làm đẹp hợp âm bằng cách thêm # hoặc b vào nốt màu 9, 11, 13. Việc này chỉ làm được trên hợp âm át 7, kể cả hợp âm át phụ. Cmaj7, Cm7, Am7, Em7 thì không thêm #, b cho 9, 11, 13 được.", "show": "E7(b9)", "compare": {"a": {"label": "E7(b9) → Am7", "play": ["E7(b9)", "Am7"]}, "b": {"label": "Am7", "play": ["Am7"]}}}, {"text": "Vì sao? Nốt định hướng của Cmaj7 và Cm7 là quãng 5 đúng (2:3), rất ổn định. C7 có E–Bb là tritone, vốn đã bất ổn, nên thêm màu biến đổi vào thì vẫn hợp.", "compare": {"a": {"label": "Cmaj7", "play": ["Cmaj7"]}, "b": {"label": "C7 → F", "play": ["C7", "F"]}}}, {"text": "Nốt màu là tiếp tục xếp chồng quãng 3 lên trên quãng 8: 9, 11, 13. Trên hợp âm át 7, nốt 9 có ba dạng (9, b9, #9), nốt 11 có một dạng (#11), nốt 13 có hai dạng (13, b13). Trên C7, nốt 11 tự nhiên là F, chỉ cao hơn bậc 3 (E) nửa cung; dù đặt F cao lên một quãng 8 (E ở dưới, F ở trên, gọi là quãng 9 thứ), hai nốt vẫn chọi nhau. Vì vậy trên hợp âm át 7 thường dùng #11.", "tip": "Nốt 11 = nốt thứ 4 tính từ nốt gốc, đặt cao một quãng 8 (C7: F); #11 là nốt đó nâng lên nửa cung (F#).", "keys": ["E3", "F4"], "compare": {"a": {"label": "C7 + 11 (chói)", "play": [["C3", "E3", "Bb3", "F4"]]}, "b": {"label": "C7 + #11", "play": [["C3", "E3", "Bb3", "F#4"]]}}}, {"text": "Ví dụ trong giọng C: C7(9 13), G7(9 13) và D7(9 #11) đi về hợp âm trưởng, dùng 9, 13 tự nhiên (D7 thì thêm #11, dạng dùng được của nốt 11 như màn trên); E7(#9 b13), A7(b9 b13), B7(b9 b13) dùng màu biến đổi. Để ý nhóm sau đều là \"mẹ\" của hợp âm thứ: Am, Dm, Em.", "compare": {"a": {"label": "C13 → Fmaj7", "play": ["C13", "Fmaj7"]}, "b": {"label": "E7(#9 b13) → Am7", "play": ["E7(#9 b13)", "Am7"]}}}, {"text": "Mode là âm giai bắt đầu từ từng bậc của âm giai trưởng (Ionian từ bậc 1, rồi Dorian, Phrygian, Lydian, Mixolydian, Aeolian, đến Locrian từ bậc 7). Mixolydian (mode 5) chỉ khác âm giai trưởng ở bậc 7 hạ nửa cung, nên hợp với hợp âm át 7.", "tip": "G mixolydian chính là các phím trắng từ G lên G: G A B C D E F G.", "play": [["G3"], ["A3"], ["B3"], ["C4"], ["D4"], ["E4"], ["F4"], ["G4"]]}, {"text": "Riêng cho hợp âm át 7, jazz dùng 3 âm giai chính: altered (phát triển từ Locrian), lydian dominant (Lydian có thêm b7) và mixolydian. Ba âm giai này là chủ đề của ba bài kế tiếp.", "compare": {"a": {"label": "Altered: E7(b9 b13)", "play": ["E7(b9 b13)", "Am7"]}, "b": {"label": "Mixolydian: G13", "play": ["G13", "C"]}}}], "remember": ["Chỉ hợp âm át 7 mới thêm # hoặc b cho 9, 11, 13.", "Trên hợp âm át 7: 9, b9, #9; #11; 13, b13 (tránh 11 tự nhiên).", "Mixolydian = âm giai trưởng hạ bậc 7, hợp với hợp âm át 7."], "items": [{"chord": "C13", "to": "Fmaj7"}, {"chord": "E7(#9 b13)", "to": "Am7"}, {"chord": "A7(b9 b13)", "to": "Dm7"}], "quiz": [{"q": "Vì sao không thêm b9 vào Cmaj7?", "choices": ["Nốt định hướng của Cmaj7 là quãng 5 đúng, rất ổn định", "Vì Cmaj7 có tritone", "Vì Cmaj7 không có nốt 9", "Vì b9 luôn là phím đen"], "answer": "Nốt định hướng của Cmaj7 là quãng 5 đúng, rất ổn định", "why": "Màu biến đổi chỉ hợp với hợp âm vốn đã bất ổn (có tritone); Cmaj7 thì ổn định."}, {"q": "Trên hợp âm át 7, nốt 11 thường dùng ở dạng nào?", "choices": ["#11", "11", "b11", "Không dạng nào"], "answer": "#11", "why": "11 tự nhiên nằm ngay trên bậc 3, chỉ cách nửa cung, nên chói (C7: F ngay trên E); vì vậy dùng #11."}, {"q": "Mode nào chỉ khác âm giai trưởng ở bậc 7 hạ nửa cung?", "choices": ["Mixolydian", "Dorian", "Lydian", "Locrian"], "answer": "Mixolydian", "why": "Mixolydian là mode 5: giống âm giai trưởng nhưng hạ bậc 7, nên hợp với hợp âm át 7."}]},

  {"id": "p3-15", "part": 3, "src": "Phildave 3 · Bài 15", "title": "Altered scale", "teach": [{"text": "Altered là âm giai cho tiếng \"jazz\" nhất. C altered gồm 1, b2 (b9), #2 (#9), 3, #4 (#11), #5 (b13), b7. Nghĩa là mọi nốt màu đều bị biến đổi, chỉ còn gốc, bậc 3 và bậc 7 giữ nguyên để vẫn là C7.", "tip": "Cách nhớ: altered giữ ba nốt của C7 là C, E, Bb, còn lại đều là nốt màu biến đổi: Db (b9), D# (#9), F# (#11), G# (b13).", "play": [["C4"], ["Db4"], ["D#4"], ["E4"], ["F#4"], ["G#4"], ["Bb4"], ["C5"]]}, {"text": "Thầy dùng hai bộ màu cơ bản: bộ 1 là #9 + b13, bộ 2 là b9 + b13. Tay trái bấm hợp âm 7, tay phải bấm bộ màu. Ví dụ trên E7: bộ 1 là G (#9) + C (b13), bộ 2 là F (b9) + C (b13).", "show": "E7(#9 b13)", "compare": {"a": {"label": "Bộ 1", "play": ["E7(#9 b13)", "Am7"]}, "b": {"label": "Bộ 2", "play": ["E7(b9 b13)", "Am7"]}}}, {"text": "Trong giọng C, altered hợp nhất với E7, A7, B7, vì chúng là \"mẹ\" của các hợp âm thứ: E7 → Am, A7 → Dm, B7 → Em. Không cần lúc nào cũng đổi qua lại hai bộ; dùng luôn một bộ (ví dụ bộ 2: b9 + b13) cũng được.", "show": "A7(b9 b13)", "play": ["A7(b9 b13)", "Dm7"]}, {"text": "Nốt nên tránh (avoid note) là nốt nghe chọi với hợp âm, khi chơi nên bỏ đi. Altered không có nốt nên tránh, nên chơi kiểu nào cũng hợp. Muốn tìm nhanh altered, phải thuộc âm giai trưởng của từng nốt gốc (E trưởng, A trưởng), rồi biến đổi các nốt màu.", "show": "B7(#9 b13)", "play": ["B7(#9 b13)", "Em7"]}], "remember": ["C altered: 1, b9, #9, 3, #11, b13, b7.", "Bộ 1 = #9 + b13; bộ 2 = b9 + b13.", "Altered hợp với E7, A7, B7 (về hợp âm thứ)."], "items": [{"chord": "E7(#9 b13)", "to": "Am7"}, {"chord": "A7(b9 b13)", "to": "Dm7"}, {"chord": "B7(#9 b13)", "to": "Em7"}], "quiz": [{"q": "Bộ 1 (#9 + b13) trên E7 gồm hai nốt nào?", "choices": ["G và C", "F và C", "F# và C#", "G# và D"], "answer": "G và C", "why": "#9 của E là G, b13 của E là C."}, {"q": "Altered hợp nhất với hợp âm át 7 đi về loại hợp âm nào?", "choices": ["Hợp âm thứ", "Hợp âm trưởng", "Hợp âm maj7", "Hợp âm át 7"], "answer": "Hợp âm thứ", "why": "E7 → Am, A7 → Dm, B7 → Em: đích là hợp âm thứ nên hợp màu biến đổi."}]},

  {"id": "p3-16", "part": 3, "src": "Phildave 3 · Bài 16", "title": "Lydian dominant scale", "teach": [{"text": "Lydian dominant là Lydian (âm giai trưởng nâng bậc 4 thành #4 = #11) ghép với hợp âm át 7 (hạ bậc 7). C lydian dominant là 1, 2, 3, #4, 5, 6, b7, tức C D E F# G A Bb. Nốt màu của nó là 9, #11, 13.", "tip": "C mixolydian là C D E F G A Bb; nâng F lên F# là ra C lydian dominant.", "play": [["C4"], ["D4"], ["E4"], ["F#4"], ["G4"], ["A4"], ["Bb4"], ["C5"]]}, {"text": "G lydian dominant là G A B C# D E F. Đặt hợp âm A (A–C#–E) ở tay phải lên G7 ở tay trái, ta có đủ 9 (A), #11 (C#), 13 (E). Một hợp âm ba nốt tay phải đặt lên hợp âm 7 như vậy gọi là hợp âm ba nốt phía trên (upper structure): màu đẹp mà dễ tìm.", "tip": "Hợp âm ba nốt tay phải là hợp âm trưởng cao hơn nốt gốc một cung: G lên một cung là A, nên đặt hợp âm A lên G7.", "show": "G13(#11)", "play": ["G13(#11)", "C"]}, {"text": "Altered cũng có #11, nhưng khi #11 đi cùng 9 và 13 tự nhiên thì gọi là lydian dominant. Nói gọn: altered biến đổi cả 9 và 13, còn lydian dominant giữ 9 và 13 tự nhiên.", "compare": {"a": {"label": "Altered: E7(#9 b13)", "play": ["E7(#9 b13)", "Am7"]}, "b": {"label": "Lydian dominant: D13(#11)", "play": ["D13(#11)", "G"]}}}, {"text": "Lydian dominant dùng cho hợp âm át 7 đi về hợp âm trưởng, như G7 → C, D7 → G, C7 → F. Hợp âm át 7 đi về hợp âm thứ (E7, A7, B7) thì dùng altered. Hai loại nốt màu khác nhau vì đích khác nhau: trưởng hay thứ.", "compare": {"a": {"label": "D13(#11) → G7", "play": ["D13(#11)", "G7"]}, "b": {"label": "A7(b9 b13) → Dm", "play": ["A7(b9 b13)", "Dm"]}}}], "remember": ["Lydian dominant: 1 2 3 #4 5 6 b7; nốt màu 9, #11, 13.", "G7 + hợp âm A ở tay phải = G13(#11).", "Về hợp âm trưởng: 9, 13 (có thể thêm #11); về hợp âm thứ: altered."], "items": [{"chord": "D13(#11)", "to": "G7"}, {"chord": "G13(#11)", "to": "C"}, {"chord": "A7(b9 b13)", "to": "Dm"}], "quiz": [{"q": "Hợp âm ba nốt nào đặt trên G7 cho đủ 9, #11, 13?", "choices": ["A", "D", "Bb", "F"], "answer": "A", "why": "Hợp âm A = A C# E, tức 9, #11, 13 của G."}, {"q": "Lydian dominant khác altered ở điểm nào?", "choices": ["Giữ 9 và 13 tự nhiên", "Không có #11", "Không có bậc 3", "Không có bậc 7"], "answer": "Giữ 9 và 13 tự nhiên", "why": "Cả hai đều có #11, nhưng altered biến đổi 9 và 13, còn lydian dominant giữ 9, 13 tự nhiên."}]},

  {"id": "p3-17", "part": 3, "src": "Phildave 3 · Bài 17", "title": "Mixolydian scale", "teach": [{"text": "Mixolydian là âm giai trưởng hạ bậc 7. G mixolydian là G A B C D E F, đúng các phím trắng tính từ G. Nốt màu dùng được là 9 (A) và 13 (E).", "show": "G13", "play": [["G3"], ["A3"], ["B3"], ["C4"], ["D4"], ["E4"], ["F4"], ["G4"]]}, {"text": "Bậc 4 (nốt 11, trên G7 là C) là nốt nên tránh, vì nó va với bậc 3 (B và C chỉ cách nửa cung). Nghe thử G7 kèm nốt C ở trên: nghe đục, chọi. Vì vậy mixolydian chỉ dùng 9 và 13.", "compare": {"a": {"label": "G7 + C (chọi)", "play": [["G2", "F3", "B3", "C5"]]}, "b": {"label": "G13", "play": ["G13"]}}}, {"text": "Trên G7, thầy hay dùng hợp âm treo (sus4): thay nốt B bằng nốt C (treo lên), rồi đưa C về B. Bước từ chỗ treo, chỗ căng về chỗ yên như vậy gọi là giải quyết (resolve). Một cách treo đẹp là bấm hợp âm F ở tay phải trên bass G (viết F/G), tên gọi là G9sus4.", "tip": "Tay phải là hợp âm trưởng của nốt gốc lùi một cung: G lùi một cung là F, nên G9sus4 = hợp âm F trên bass G.", "show": "G9sus4", "play": ["G9sus4", "G7", "C"]}, {"text": "Bảng ứng viên trong giọng C, phần về hợp âm trưởng: ứng viên 1 là mixolydian (9, 13), ví dụ C7(9 13) về Fmaj7, G7(9 13) về Cmaj7; riêng D7 về G7 thầy ghi ứng viên 1 là D7(9 #11 13). Ứng viên 2 là biến hoá bằng màu biến đổi: C7(b9 b13) về Fmaj7, G7(b9 b13) về Cmaj7. Nghe G13 rồi G7(b9 b13) trước Cmaj7 để thấy khác biệt.", "compare": {"a": {"label": "Ứng viên 1: G13 → Cmaj7", "play": ["G13", "Cmaj7"]}, "b": {"label": "Ứng viên 2: G7(b9 b13) → Cmaj7", "play": ["G7(b9 b13)", "Cmaj7"]}}}, {"text": "Phần về hợp âm thứ chỉ dùng altered: E7 về Am7 có ứng viên 1 là E7(#9 b13), ứng viên 2 là E7(b9 b13); A7 về Dm7 và B7 về Em7 cũng vậy. Nhịp dài thì chơi ứng viên 1 rồi ứng viên 2; nhịp ngắn thì chỉ cần ứng viên 1.", "play": ["E7(#9 b13)", "E7(b9 b13)", "Am7"]}], "remember": ["Mixolydian = âm giai trưởng hạ bậc 7; dùng 9, 13, tránh 11.", "G9sus4 (F/G) treo lên rồi giải quyết về G7.", "Về trưởng: ứng viên 1 mixolydian, ứng viên 2 màu biến đổi; về thứ: altered."], "items": [{"chord": "G9sus4", "to": "C"}, {"chord": "G7(b9 b13)", "to": "Cmaj7"}, {"chord": "E7(#9 b13)", "to": "Am7"}], "quiz": [{"q": "Vì sao nốt 11 (C) là nốt nên tránh trên G7?", "choices": ["Nó va với bậc 3 (B), hai nốt chỉ cách nửa cung", "Nó là phím đen", "Nó không có trong G mixolydian", "Nó là nốt gốc của G7"], "answer": "Nó va với bậc 3 (B), hai nốt chỉ cách nửa cung", "why": "C ngay trên B nửa cung nên nghe chọi; vì vậy mixolydian dùng 9 và 13, bỏ 11."}, {"q": "G9sus4 bấm thế nào?", "choices": ["Bass G, tay phải hợp âm F", "Bass G, tay phải hợp âm D", "Bass F, tay phải hợp âm G", "Bass C, tay phải hợp âm F"], "answer": "Bass G, tay phải hợp âm F", "why": "G9sus4 viết là F/G: hợp âm F (F A C) trên bass G."}]},

  {"id": "p3-18", "part": 3, "src": "Phildave 3 · Bài 18", "title": "Âm giai trưởng và âm giai thứ", "teach": [{"text": "Thay vì nhớ từng nốt màu cho mọi hợp âm (như G7 về Cm dùng Ab, D7 về G dùng G#), thầy dùng 4 âm giai để suy ra: trưởng tự nhiên, thứ tự nhiên, thứ hoà âm, thứ giai điệu. Thuộc 4 âm giai này thì tìm nốt màu nhanh hơn nhiều.", "compare": {"a": {"label": "C trưởng", "play": [["C4"], ["D4"], ["E4"], ["F4"], ["G4"], ["A4"], ["B4"], ["C5"]]}, "b": {"label": "C thứ tự nhiên", "play": [["C4"], ["D4"], ["Eb4"], ["F4"], ["G4"], ["Ab4"], ["Bb4"], ["C5"]]}}}, {"text": "C trưởng tự nhiên có nửa cung ở bậc 3–4 (E–F) và bậc 7–8 (B–C), còn lại cách nhau một cung. C thứ tự nhiên là 1, 2, b3, 4, 5, b6, b7 (C D Eb F G Ab Bb), có ba dấu giáng giống Eb trưởng.", "tip": "Nhìn phím: E–F và B–C là hai chỗ hai phím trắng sát nhau, không có phím đen ở giữa.", "keys": ["E4", "F4", "B4", "C5"], "play": [["E4", "F4"], ["B4", "C5"]]}, {"text": "Hợp âm trong giọng C thứ tự nhiên: Cm7, Dm7b5, Ebmaj7, Fm7, Gm7, Abmaj7, Bb7. Bậc V là Gm7, nhưng Gm7 không có tritone nên về Cm chưa đủ lực. Nâng bậc 7 của âm giai (Bb lên B), mà Bb chính là bậc 3 của Gm7, thì Gm7 thành G7, và ta có âm giai thứ hoà âm.", "tip": "Gm7 thành G7 chỉ cần nâng Bb lên B, đúng bậc 3 của hợp âm trưởng G; B nằm ngay dưới C nửa cung nên kéo về Cm rất mạnh.", "show": "G7", "compare": {"a": {"label": "Gm7 → Cm", "play": ["Gm7", "Cm"]}, "b": {"label": "G7 → Cm", "play": ["G7", "Cm"]}}}, {"text": "Âm giai thứ giai điệu nâng cả bậc 6 và bậc 7 (C D Eb F G A B), cho ca sĩ dễ hát khi đi lên. Khi đi xuống, người ta thường dùng lại thứ tự nhiên.", "play": [["C4"], ["D4"], ["Eb4"], ["F4"], ["G4"], ["A4"], ["B4"], ["C5"]]}, {"text": "G7 về được cả C trưởng lẫn C thứ, nhưng nốt màu khác nhau tuỳ đích. Về C dùng 9 (A), về Cm dùng b9 (Ab), vì Ab nằm trong âm giai C thứ. Vì vậy thầy dặn phải thuộc âm giai thứ hoà âm ở đủ 12 giọng.", "compare": {"a": {"label": "G9 → C", "play": ["G9", "C"]}, "b": {"label": "G7(b9) → Cm", "play": ["G7(b9)", "Cm"]}}}], "remember": ["4 âm giai: trưởng tự nhiên, thứ tự nhiên, thứ hoà âm, thứ giai điệu.", "Thứ hoà âm = thứ tự nhiên nâng bậc 7, nhờ đó có G7 về Cm.", "G7 về C hay về Cm thì nốt màu khác nhau."], "items": [{"chord": "G7(b9)", "to": "Cm"}, {"chord": "G9", "to": "C"}], "quiz": [{"q": "Vì sao trong C thứ, người ta đổi Gm7 thành G7?", "choices": ["Để có tritone (B–F) kéo về Cm", "Để có thêm nốt Bb", "Để bỏ nốt G", "Vì Gm7 không có trong C thứ"], "answer": "Để có tritone (B–F) kéo về Cm", "why": "Nâng Bb lên B thì G7 có tritone B–F nên kéo về Cm mạnh hơn."}, {"q": "C thứ tự nhiên có cùng các dấu giáng với giọng nào?", "choices": ["Eb trưởng", "F trưởng", "G trưởng", "Bb trưởng"], "answer": "Eb trưởng", "why": "C thứ tự nhiên có Eb, Ab, Bb: ba dấu giáng, giống Eb trưởng."}]},

  {"id": "p3-19", "part": 3, "src": "Phildave 3 · Bài 19", "title": "Trộn hợp âm của 4 âm giai", "teach": [{"text": "Bài giọng thứ mà chỉ dùng hợp âm thứ thì nặng nề. Ngược lại, trong bài giọng trưởng, thoáng một chút màu thứ lại rất cuốn hút. Bài C trưởng hay lấy hợp âm của C thứ: cùng nốt gốc C, không phải Am.", "compare": {"a": {"label": "Fmaj7 → Cmaj7", "play": ["Fmaj7", "Cmaj7"]}, "b": {"label": "Fmaj7 → Fm7 → Cmaj7", "play": ["Fmaj7", "Fm7", "Cmaj7"]}}}, {"text": "Hợp âm mượn (modal interchange; thầy gọi là \"mix\") là hợp âm của giọng thứ cùng tên, đem dùng trong bài giọng trưởng. Từ C thứ tự nhiên hay mượn Dm7b5, Ebmaj7, Fm7, Abmaj7, Bb7; G7 thì vừa có trong C trưởng, vừa là bậc V của C thứ hoà âm. Nghe Fmaj7 – Fm7 – Cmaj7: Fm7 là hợp âm mượn, tạo câu kết \"A-men\" (kiểu kết IV – I cuối bài thánh ca) rất ấm.", "tip": "Hợp âm mượn từ C thứ dễ nhận: có nốt Eb, Ab hoặc Bb, ví dụ Fm7 = F Ab C Eb.", "show": "Fm7", "play": ["Fmaj7", "Fm7", "Cmaj7"]}, {"text": "Một vài tiến hành mẫu: C – Abmaj7 – Bb7 – C, hay C – Ebmaj7 – Dm7 – C. Vì sao trong giọng C lại có Abmaj7, Bb7? Vì chúng là hợp âm trong giọng của C thứ tự nhiên.", "compare": {"a": {"label": "C – Abmaj7 – Bb7 – C", "play": ["C", "Abmaj7", "Bb7", "C"]}, "b": {"label": "C – Ebmaj7 – Dm7 – C", "play": ["C", "Ebmaj7", "Dm7", "C"]}}}, {"text": "Chơi các nốt C thứ giai điệu (C D Eb F G A B) bắt đầu từ F, ta được đúng F lydian dominant; bắt đầu từ B, ta được B altered. Đó là hai âm giai đã học ở bài 15 và 16, và F7, Bm7b5 là hai hợp âm dựng từ đó.", "show": "F7", "compare": {"a": {"label": "F7", "play": ["F7"]}, "b": {"label": "Bm7b5", "play": ["Bm7b5"]}}}, {"text": "Thầy nhấn mạnh: hợp âm trong giọng của trưởng tự nhiên và thứ tự nhiên trộn với nhau là cách dùng nhiều nhất trong thực tế. Có cả đoạn dài chỉ có một hợp âm át 7 là G7, còn lại toàn hợp âm trộn, mà vẫn rất đẹp. Dm7b5 là hợp âm bậc II của C thứ, nên đứng trước G7 nó dẫn vào G7 rất tự nhiên (bài 20 và 25 sẽ nói kỹ hơn). Thử nghe Dm7b5 – G7 – Cmaj7, rồi cho G7 thêm b9, b13 (lấy từ C thứ): nhìn nốt màu là biết hợp âm mượn từ âm giai nào.", "compare": {"a": {"label": "Dm7b5 – G7 – Cmaj7", "play": ["Dm7b5", "G7", "Cmaj7"]}, "b": {"label": "Dm7b5 – G7(b9 b13) – Cmaj7", "play": ["Dm7b5", "G7(b9 b13)", "Cmaj7"]}}}], "remember": ["Hợp âm mượn: lấy hợp âm của C thứ dùng trong bài C trưởng.", "Hay mượn: Dm7b5, Ebmaj7, Fm7, Abmaj7, Bb7 (và G7).", "Fmaj7 – Fm7 – Cmaj7: câu kết \"Amen\"."], "items": [{"chord": "Dm7b5", "to": "G7"}, {"chord": "G7(b9 b13)", "to": "Cmaj7"}], "quiz": [{"q": "Vì sao trong bài giọng C lại có Abmaj7 và Bb7?", "choices": ["Vì chúng là hợp âm trong giọng của C thứ tự nhiên", "Vì chúng là \"mẹ\" của C", "Vì chúng thuộc âm giai C trưởng", "Vì chúng là hợp âm thay thế của G7"], "answer": "Vì chúng là hợp âm trong giọng của C thứ tự nhiên", "why": "C thứ tự nhiên có Ab và Bb, nên Abmaj7 và Bb7 là hợp âm của C thứ, được mượn sang C trưởng."}]},

  {"id": "p3-20", "part": 3, "src": "Phildave 3 · Bài 20", "title": "Hợp âm thay thế trong giọng thứ", "teach": [{"text": "Ôn lại: giọng C trưởng có ba nhóm thay thế (Cmaj7 với Am7, Em7; Fmaj7 với Dm7; G7 với Bm7b5). Giọng C thứ cũng có một nhóm: Fm7 thay được bằng Dm7b5, Abmaj7 hoặc Bb7.", "play": ["Fm7", "Dm7b5", "Abmaj7", "Bb7"]}, {"text": "Vì sao bốn hợp âm này thay được cho nhau? Cả bốn đều chứa nốt Ab: Ab là bậc 3 của Fm7, bậc 5 của Dm7b5, nốt gốc của Abmaj7 và bậc 7 của Bb7. Ngoài Ab, mỗi hợp âm còn chung ít nhất một nốt nữa với Fm7.", "keys": ["Ab4"], "compare": {"a": {"label": "Fm7", "play": ["Fm7"]}, "b": {"label": "Bb7", "play": ["Bb7"]}}}, {"text": "Mô hình Fm7 – G7 – Cm7 có 4 lựa chọn ở chỗ đầu: Fm7, Dm7b5, Abmaj7, Bb7. Chọn hợp âm nào thì G7 vẫn kéo về Cm7 như cũ, chỉ màu sắc trước đó thay đổi.", "compare": {"a": {"label": "Fm7 – G7 – Cm7", "play": ["Fm7", "G7", "Cm7"]}, "b": {"label": "Abmaj7 – G7 – Cm7", "play": ["Abmaj7", "G7", "Cm7"]}}}, {"text": "Áp vào bài giọng C: coi mỗi hợp âm thứ (Dm7, Em7, Am7) như một chủ nhỏ (tạm coi như hợp âm chủ trong chốc lát), rồi dùng đúng mô hình đó. Trước Am7 ta có Dm7 – E7 – Am7, Bm7b5 – E7 – Am7, Fmaj7 – E7 – Am7 hay G7 – E7 – Am7. Trước Dm7 cũng vậy: Gm7, Em7b5, Bbmaj7 hoặc C7 rồi tới A7.", "compare": {"a": {"label": "Fmaj7 – E7 – Am7", "play": ["Fmaj7", "E7", "Am7"]}, "b": {"label": "Bm7b5 – E7 – Am7", "play": ["Bm7b5", "E7", "Am7"]}}}], "remember": ["Giọng C thứ: Fm7 thay bằng Dm7b5, Abmaj7, Bb7 (cùng có nốt Ab).", "Fm7 – G7 – Cm7: chỗ đầu có 4 lựa chọn."], "items": [{"chord": "Dm7b5", "to": "Fm7", "rel": "sub"}, {"chord": "Abmaj7", "to": "Fm7", "rel": "sub"}, {"chord": "Bb7", "to": "Fm7", "rel": "sub"}], "quiz": [{"q": "Nốt nào có chung trong cả Fm7, Dm7b5, Abmaj7 và Bb7?", "choices": ["Ab", "C", "F", "Eb"], "answer": "Ab", "why": "Ab là bậc 3 của Fm7, bậc 5 của Dm7b5, nốt gốc của Abmaj7, bậc 7 của Bb7."}]},

  {"id": "p3-21", "part": 3, "src": "Phildave 3 · Bài 21", "title": "Nhìn nốt màu là biết hợp âm về đâu", "teach": [{"text": "G7 có thể về C trưởng hoặc C thứ, và khác nhau ở nốt màu. Về C trưởng, nốt màu lấy từ âm giai C trưởng: 9 (A) và 13 (E), tức mixolydian. Về C thứ, nốt màu lấy từ C thứ hoà âm: b9 (Ab) và b13 (Eb), tức altered.", "compare": {"a": {"label": "G13 → C", "play": ["G13", "C"]}, "b": {"label": "G7(b9 b13) → Cm", "play": ["G7(b9 b13)", "Cm"]}}}, {"text": "Thầy đánh số các bộ nốt màu của hợp âm át 7: ① mixolydian (9, 13), ② altered b9 + b13, ③ altered #9 + b13 (② chính là bộ 2, ③ là bộ 1 ở bài 15). Bộ ④ (một biến thể cho đích trưởng) và ⑤ (bộ lai b9 + 13) để dành khi đã quen.", "compare": {"a": {"label": "② E7(b9 b13)", "play": ["E7(b9 b13)", "Am7"]}, "b": {"label": "③ E7(#9 b13)", "play": ["E7(#9 b13)", "Am7"]}}}, {"text": "Quy tắc chọn: hợp âm át 7 về hợp âm trưởng thì chọn ① (hoặc 9, #11, 13 kiểu lydian dominant); về hợp âm thứ thì chọn ② hoặc ③. Ngược lại, nhìn nốt màu là đoán được đích: thấy b9, b13 thì nhiều khả năng đích là hợp âm thứ (về hợp âm trưởng thì đó chỉ là màu biến hoá, ưu tiên 2).", "compare": {"a": {"label": "C13 → Fmaj7", "play": ["C13", "Fmaj7"]}, "b": {"label": "A7(#9 b13) → Dm7", "play": ["A7(#9 b13)", "Dm7"]}}}, {"text": "Có thể nối các bộ thành một đường nốt ở trên cùng. Chơi ① rồi ③ trên G7, tức G13 rồi G7(#9 b13), thì nốt trên rơi xuống nửa cung (B xuống Bb, E xuống Eb), rất hợp cho đoạn kết về C. Đây là lúc dùng màu biến đổi như một lựa chọn thứ hai khi về hợp âm trưởng.", "play": ["G13", "G7(#9 b13)", "C"]}], "remember": ["Về hợp âm trưởng: ① mixolydian (9, 13) hoặc lydian dominant (9, #11, 13).", "Về hợp âm thứ: ② b9 + b13 hoặc ③ #9 + b13 (altered).", "Thấy b9, b13 thì nhiều khả năng đích là hợp âm thứ."], "items": [{"chord": "E7(b9 b13)", "to": "Am7"}, {"chord": "G13", "to": "C"}, {"chord": "A7(#9 b13)", "to": "Dm7"}], "quiz": [{"q": "Thấy E7(b9 b13), bạn đoán hợp âm tiếp theo là gì?", "choices": ["Am", "G", "C", "F"], "answer": "Am", "why": "b9, b13 là màu altered, chủ yếu dùng khi hợp âm át 7 về hợp âm thứ, nên nhiều khả năng E7 về Am."}]},

  {"id": "p3-22", "part": 3, "src": "Phildave 3 · Bài 22", "title": "\"Bạn của mẹ\": hợp âm át thay thế", "teach": [{"text": "Đến giờ, hợp âm thay thế của G7 là Bm7b5. Giờ có thêm Db7, dù nốt gốc Db không nằm trong giọng C. Db7 cũng về C, nhưng bass trượt xuống nửa cung (Db xuống C) thay vì nhảy quãng 5.", "show": "Db7", "compare": {"a": {"label": "G7 → C", "play": ["G7", "C"]}, "b": {"label": "Db7 → C", "play": ["Db7", "C"]}}}, {"text": "Vì sao Db7 thay được G7? Hai hợp âm dùng chung một tritone: bậc 3 của Db7 là F (bậc 7 của G7), bậc 7 của Db7 là Cb, tức B (bậc 3 của G7). Cùng tritone nên cùng lực kéo về C.", "keys": ["B3", "F4"], "compare": {"a": {"label": "G + B–F", "play": [["G2", "B3", "F4"], ["C3", "C4", "E4"]]}, "b": {"label": "Db + B–F", "play": [["Db3", "B3", "F4"], ["C3", "C4", "E4"]]}}}, {"text": "Hợp âm 7 chung tritone với \"mẹ\" và có nốt gốc cao hơn đích nửa cung gọi là hợp âm át thay thế (subV: hợp âm thay cho bậc V), ta gọi vui là \"bạn của mẹ\". G7 và Db7 đều về C. Mẹo tìm: từ nốt gốc của \"mẹ\", đếm một tritone kiểu \"banana\" là ra nốt gốc của \"bạn của mẹ\".", "tip": "Cách nhanh hơn: nốt gốc của \"bạn của mẹ\" là nốt gốc của đích nhích lên nửa cung, đích C thì \"bạn của mẹ\" là Db7.", "play": ["G7", "Db7", "C"]}, {"text": "Bảng cặp chung tritone: G7 với Db7, C7 với Gb7, D7 với Ab7, E7 với Bb7, A7 với Eb7. Mỗi cặp về cùng một đích, ví dụ C7 và Gb7 đều về F.", "compare": {"a": {"label": "C7 → F", "play": ["C7", "F"]}, "b": {"label": "Gb7 → F", "play": ["Gb7", "F"]}}}, {"text": "Màu của \"bạn của mẹ\" là lydian dominant: 9, #11, 13. Trên Db7, #11 là nốt G; tay phải bấm hợp âm Eb (Eb–G–Bb) là có đủ 9, #11, 13, thành Db13(#11). Đệm cho ca sĩ thì dùng #11 cho rõ hợp âm; muốn nghe jazz hơn thì chỉ dùng 9 và 13.", "tip": "Tay phải là hợp âm trưởng cao hơn nốt gốc một cung: Db lên một cung là Eb.", "show": "Db13(#11)", "compare": {"a": {"label": "Db13(#11) → C", "play": ["Db13(#11)", "C"]}, "b": {"label": "Không #11: Db13 → C", "play": ["Db13", "C"]}}}], "remember": ["Hợp âm át thay thế (subV), \"bạn của mẹ\": chung tritone với \"mẹ\", nốt gốc cao hơn đích nửa cung.", "G7 ↔ Db7, C7 ↔ Gb7, D7 ↔ Ab7, E7 ↔ Bb7, A7 ↔ Eb7.", "Màu của \"bạn của mẹ\": 9, #11, 13 (lydian dominant)."], "items": [{"chord": "Db13(#11)", "to": "C"}, {"chord": "Gb13(#11)", "to": "F"}, {"chord": "Ab7", "to": "G7"}], "quiz": [{"q": "Vì sao Db7 thay được G7 để về C?", "choices": ["Hai hợp âm chung tritone B–F", "Hai hợp âm chung nốt gốc", "Db nằm trong giọng C", "Db7 là hợp âm thứ"], "answer": "Hai hợp âm chung tritone B–F", "why": "Bậc 3 và 7 của Db7 (F, Cb = B) chính là bậc 7 và 3 của G7."}, {"q": "Hợp âm át thay thế (subV) của A7 là gì?", "choices": ["Eb7", "E7", "D7", "Bb7"], "answer": "Eb7", "why": "Từ A đọc mẹo banana là ra Eb (hoặc lấy đích D nhích lên nửa cung); Eb7 và A7 chung tritone C#–G."}]},

  {"id": "p3-23", "part": 3, "src": "Phildave 3 · Bài 23", "title": "\"Bạn của mẹ\" cho hợp âm át phụ", "teach": [{"text": "Mỗi hợp âm át phụ cũng có \"bạn của mẹ\" riêng, gọi là hợp âm át thay thế phụ (secondary substitute dominant). Ví dụ A7 về Dm7, thì Eb7 cũng về Dm7; E7 về Am7, thì Bb7 cũng về Am7. Mỗi cặp chung tritone và về cùng một đích.", "tip": "Đích nhích lên nửa cung là ra \"bạn của mẹ\": Dm7 → Eb7, Am7 → Bb7, Em7 → F7.", "show": "Eb7", "compare": {"a": {"label": "A7 → Dm7", "play": ["A7", "Dm7"]}, "b": {"label": "Eb7 → Dm7", "play": ["Eb7", "Dm7"]}}}, {"text": "Bảng đầy đủ trong giọng C: C7, Gb7 → Fmaj7; D7, Ab7 → G7; E7, Bb7 → Am7; A7, Eb7 → Dm7; B7, F7 → Em7; G7, Db7 → Cmaj7. \"Mẹ\" về đích bằng bước quãng 5 xuống, còn \"bạn của mẹ\" về đích bằng bước nửa cung xuống.", "compare": {"a": {"label": "B7 → Em7", "play": ["B7", "Em7"]}, "b": {"label": "F7 → Em7", "play": ["F7", "Em7"]}}}, {"text": "Nối \"mẹ\" rồi \"bạn của mẹ\" nghe rất hay: G7 – Db7 – C, hay D7 – Ab7 – G7. Bass nhảy một tritone (G xuống Db) rồi trượt nửa cung vào đích, nên vừa có lực vừa mượt.", "compare": {"a": {"label": "G7 – Db7 – C", "play": ["G7", "Db7", "C"]}, "b": {"label": "D7 – Ab7 – G7", "play": ["D7", "Ab7", "G7"]}}}, {"text": "Bài tập vòng quay lại: Cmaj7 – A7 – Dm7 – G7 đổi thành Em7 – Eb7 – Dm7 – Db7. Em7 thay Cmaj7, Eb7 thay A7, Db7 thay G7, nên bass đi xuống từng nửa cung: E, Eb, D, Db. Vòng vẫn quay về Cmaj7 như cũ.", "compare": {"a": {"label": "Vòng gốc", "play": ["Cmaj7", "A7", "Dm7", "G7", "Cmaj7"]}, "b": {"label": "Bass đi nửa cung", "play": ["Em7", "Eb7", "Dm7", "Db7", "Cmaj7"]}}}, {"text": "Màu của \"bạn của mẹ\" là 9, #11, 13 (hoặc chỉ 9 và 13), dù đích là hợp âm trưởng hay thứ: tay phải bấm hợp âm trưởng cao hơn nốt gốc một cung. Ví dụ Eb7 về Dm7: tay phải hợp âm F trên Eb7, thành Eb13(#11). \"Bạn của mẹ\" không dùng b9, #9, b13.", "show": "Eb13(#11)", "compare": {"a": {"label": "Eb13(#11) → Dm7", "play": ["Eb13(#11)", "Dm7"]}, "b": {"label": "Ab13(#11) → G7", "play": ["Ab13(#11)", "G7"]}}}], "remember": ["Mỗi hợp âm át phụ có một \"bạn của mẹ\" chung tritone, về cùng đích.", "\"Bạn của mẹ\" về đích bằng bước nửa cung xuống, màu 9, #11, 13 cho mọi đích.", "Em7 – Eb7 – Dm7 – Db7: bass đi xuống từng nửa cung."], "items": [{"chord": "Eb13(#11)", "to": "Dm7"}, {"chord": "Bb13(#11)", "to": "Am7"}, {"chord": "Ab13(#11)", "to": "G7"}], "quiz": [{"q": "Trong vòng Em7 – Eb7 – Dm7 – Db7, Eb7 thay cho hợp âm nào của vòng Cmaj7 – A7 – Dm7 – G7?", "choices": ["A7", "Em7", "G7", "Cmaj7"], "answer": "A7", "why": "Eb7 chung tritone (G và Db) với A7 và cùng về Dm7."}]},

  {"id": "p3-24", "part": 3, "src": "Phildave 3 · Bài 24", "title": "Hợp âm giảm đi qua", "teach": [{"text": "Hợp âm giảm 7 (dim7) gồm bốn nốt cách đều nhau một cung rưỡi, ví dụ C#dim7 = C# E G Bb. Hợp âm giảm đi qua (passing diminished) là hợp âm giảm 7 chen giữa hai hợp âm cách nhau một cung, để bass đi lên từng nửa cung. Ví dụ Cmaj7 – C#dim7 – Dm7: bass đi C, C#, D. Kiểu nối này rất hay gặp trong gospel.", "tip": "Bấm dim7 từ nốt gốc: tính cả phím đen, cứ bỏ qua hai phím rồi bấm phím thứ ba, như C#, (bỏ D, D#) E, (bỏ F, F#) G, (bỏ G#, A) Bb.", "show": "C#dim7", "compare": {"a": {"label": "Cmaj7 → Dm7", "play": ["Cmaj7", "Dm7"]}, "b": {"label": "Cmaj7 → C#dim7 → Dm7", "play": ["Cmaj7", "C#dim7", "Dm7"]}}}, {"text": "Cả chuỗi: Cmaj7 – C#dim7 – Dm7 – D#dim7 – Em7 – Edim7 – Fmaj7 – F#dim7 – G7 – G#dim7 – Am7. Mỗi hợp âm dim7 có nốt gốc thấp hơn hợp âm sau nửa cung, nên kéo lên rất tự nhiên. Riêng Em7 và Fmaj7 vốn chỉ cách nửa cung, nên Edim7 giữ nguyên bass E, chỉ đổi màu.", "tip": "Tìm hợp âm giảm đi qua: lấy nốt gốc của đích lùi nửa cung, D lùi nửa cung là C#, nên C#dim7 dẫn vào Dm7.", "play": ["Cmaj7", "C#dim7", "Dm7", "D#dim7", "Em7"]}, {"text": "Vì sao C#dim7 kéo về Dm7? C#dim7 thực chất là A7(b9) bỏ nốt gốc A, với C# ở bass, tức một \"mẹ\" của Dm7 trá hình. Hợp âm dim7 lại đối xứng: C#dim7 có cùng bốn nốt với Edim7, Gdim7, Bbdim7.", "compare": {"a": {"label": "A7(b9) → Dm7", "play": ["A7(b9)", "Dm7"]}, "b": {"label": "C#dim7 → Dm7", "play": ["C#dim7", "Dm7"]}}}, {"text": "Về Dm7 giờ có ba lựa chọn: A7 (\"mẹ\", thêm màu altered thành A7(#9 b13) hay A7(b9 b13)), C#dim7 (hợp âm giảm đi qua), Eb7 (\"bạn của mẹ\", thêm 9, #11, 13 thành Eb13(#11)). Tương tự, trước Em7 thì B7 đổi được thành D#dim7 hoặc F7.", "compare": {"a": {"label": "C#dim7 → Dm7", "play": ["C#dim7", "Dm7"]}, "b": {"label": "Eb13(#11) → Dm7", "play": ["Eb13(#11)", "Dm7"]}}}, {"text": "Với dim7, thầy dặn chia nốt cho hai tay, không bấm trùng nốt. Cách dễ nhất trong app: tay trái bấm nốt gốc C#, tay phải bấm hợp âm ba nốt Edim (hợp âm ba nốt giảm E–G–Bb) ngay phía trên.", "show": "C#dim7", "play": ["C#dim7", "Dm7"]}], "remember": ["Hợp âm giảm đi qua: dim7 thấp hơn đích nửa cung (C#dim7 → Dm7).", "C#dim7 = A7(b9) bỏ nốt A.", "Về Dm7: A7, C#dim7 hoặc Eb7."], "items": [{"chord": "C#dim7", "to": "Dm7"}, {"chord": "D#dim7", "to": "Em7"}, {"chord": "G#dim7", "to": "Am7"}], "quiz": [{"q": "Vì sao C#dim7 kéo về Dm7?", "choices": ["Nó là A7(b9) bỏ nốt A", "Nó là hợp âm trong giọng C", "Nó có cùng nốt gốc với Dm7", "Nó là Dm7 hạ bậc 5"], "answer": "Nó là A7(b9) bỏ nốt A", "why": "A7(b9) = A C# E G Bb; bỏ A còn C# E G Bb, chính là C#dim7, một \"mẹ\" trá hình của Dm7."}, {"q": "C#dim7 có cùng bốn nốt với hợp âm nào?", "choices": ["Edim7", "Ddim7", "Cdim7", "Ebdim7"], "answer": "Edim7", "why": "Dim7 đối xứng: C#dim7, Edim7, Gdim7, Bbdim7 có cùng 4 nốt."}]},

  {"id": "p3-25", "part": 3, "src": "Phildave 3 · Bài 25", "title": "II liên quan: \"chị\"", "teach": [{"text": "II liên quan (related II) là hợp âm m7 (hợp âm thứ có thêm bậc 7, như Dm7) đứng ngay trước \"mẹ\", ta gọi vui là \"chị\". Coi \"mẹ\" là bậc V thì \"chị\" nằm ở bậc II, nên cặp này gọi là II–V, ví dụ Dm7 – G7. Thầy dặn: hãy coi Dm7 – G7 là một bộ.", "tip": "Nốt 7 của m7 cũng là nốt gốc lùi một cung: Dm7 = hợp âm Dm (D F A) + C.", "show": "Dm7", "play": ["Dm7", "G7", "C"]}, {"text": "Vì sao Dm7 với G7 hợp nhau? G9sus4 là hợp âm F trên bass G, mà hợp âm F (F–A–C) chính là Dm7 (D–F–A–C) bỏ nốt D. Tức là trong G7 treo đã có sẵn bóng của Dm7.", "compare": {"a": {"label": "G9sus4 → C", "play": ["G9sus4", "C"]}, "b": {"label": "Dm7 → G7 → C", "play": ["Dm7", "G7", "C"]}}}, {"text": "Điểm mạnh lớn nhất: đặt được cặp II–V ở nhiều chỗ, trước hợp âm át phụ và trước \"bạn của mẹ\". \"Chị\" có sẵn trong giọng (Dm7 trước G7, Em7 trước A7) thì không hấp dẫn lắm. \"Chị\" nằm ngoài giọng C mới hay: Gm7 – C7 về F, Bbm7 – Eb7 về Dm, Abm7 – Db7 về Cmaj7.", "compare": {"a": {"label": "Gm7 – C7 – Fmaj7", "play": ["Gm7", "C7", "Fmaj7"]}, "b": {"label": "Abm7 – Db7 – Cmaj7", "play": ["Abm7", "Db7", "Cmaj7"]}}}, {"text": "Đích là hợp âm thứ thì \"chị\" dùng m7b5 và \"mẹ\" dùng màu altered, vì trong giọng thứ, hợp âm bậc II là m7b5 (như Dm7b5 trong C thứ, bài 18). Ví dụ về Em: F#m7b5 – B7(b9) – Em7.", "show": "F#m7b5", "play": ["F#m7b5", "B7(b9)", "Em7"]}, {"text": "Mẹo tìm \"chị\": coi \"mẹ\" là bậc 5, đếm xuống theo âm giai trưởng: từ bậc 5 xuống bậc 4 một cung, xuống bậc 3 thêm nửa cung, xuống bậc 2 thêm một cung. Ví dụ Eb7: Eb, Db, C, Bb, nên \"chị\" là Bbm7.", "tip": "Hoặc đếm lên: từ nốt gốc của \"mẹ\" đếm lên 5 tên nốt (Eb, F, G, Ab, Bb) là ra nốt gốc của \"chị\".", "play": [["Eb4"], ["Db4"], ["C4"], ["Bb3"], "Bbm7", "Eb7", "Dm7"]}, {"text": "Ví dụ của thầy: Fmaj7 – G7 – Cmaj7 – C7 – Fmaj7 thành Dm7 – G7 – Dbm7 – Gb7 – Fmaj7. C7 được đổi thành \"bạn của mẹ\" Gb7, và chỗ Cmaj7 nhường cho \"chị\" của Gb7 là Dbm7. Mỗi \"mẹ\" hay \"bạn của mẹ\" đều có \"chị\" đi trước, nên cả vòng chảy thành từng cặp II–V.", "compare": {"a": {"label": "Bản gốc", "play": ["Fmaj7", "G7", "Cmaj7", "C7", "Fmaj7"]}, "b": {"label": "Có \"chị\"", "play": ["Dm7", "G7", "Dbm7", "Gb7", "Fmaj7"]}}}], "remember": ["II liên quan (related II), \"chị\": hợp âm m7 đứng trước \"mẹ\", thành cặp II–V.", "Đích thứ: \"chị\" m7b5 + \"mẹ\" altered (F#m7b5 – B7(b9) – Em7).", "Tìm \"chị\": từ nốt gốc của \"mẹ\" đếm lên 5 tên nốt (Eb7: Eb, F, G, Ab, Bb → Bbm7)."], "items": [{"chord": "F#m7b5", "to": "B7(b9)"}, {"chord": "B7(b9)", "to": "Em7"}, {"chord": "Abm7", "to": "Db7"}], "quiz": [{"q": "Dùng mẹo đếm, \"chị\" (related II) của Eb7 là gì?", "choices": ["Bbm7", "Fm7", "Abm7", "Cm7"], "answer": "Bbm7", "why": "Từ Eb đếm lên 5 tên nốt: Eb, F, G, Ab, Bb, nên \"chị\" là Bbm7 (đếm xuống theo cách của thầy cũng ra Bb: Db, C, Bb)."}, {"q": "Đích là hợp âm thứ (Em) thì \"chị\" dùng loại hợp âm nào?", "choices": ["m7b5", "maj7", "7", "m7"], "answer": "m7b5", "why": "Đích thứ thì \"chị\" dùng m7b5 và \"mẹ\" dùng màu altered: F#m7b5 – B7(b9) – Em7."}]},

  {"id": "p4-01", "part": 4, "src": "Phildave 4 · Bài 1", "title": "Flat nine, Fm mượn và nốt trên cùng", "teach": [{"text": "Cả khoá Phildave 4 xoay quanh một ý: tìm hợp âm đích của câu hát, rồi chọn cách đi vào đích đó. Có hai đường chính: tiến hành đi qua (passing progression), bass đi liền bậc vào đích; và hợp âm 7 đặt ngay trước đích. Bài này lấy bài thánh ca \"입술의 모든 말\" (Mọi lời trên môi con), giọng C; chữ \"나의\" đi vào đích C.", "compare": {"a": {"label": "Đi qua: C – C/Bb – A7(b9)", "play": ["C", "C/Bb", "A7(b9)"]}, "b": {"label": "Hợp âm 7: F/G – G7(b9) – C", "play": ["F/G", "G7(b9)", "C"]}}}, {"text": "Flat nine (플렛나인): ở chữ \"나의\", thầy đi F/G → G7(b9) → C. F/G chính là G9sus4 ở P3 (G7 9sus4), thầy bấm G2 F3 | A3 C4; G7(b9) bấm G2 F3 | Ab3 B3 D4. Nốt Ab là màu biến đổi (altered tension), khác với nốt màu tự nhiên (natural tension) như 9, 13 lấy từ giọng C; Ab muốn đi xuống G (nốt 5 của C), nên kéo rất mạnh về C.", "tip": "Từ F/G sang G7(b9): tay trái giữ nguyên G và F; tay phải đưa A xuống Ab, C xuống B, rồi thêm D.", "keys": ["G2", "F3", "Ab3", "B3", "D4"], "play": [["G2", "F3", "A3", "C4"], ["G2", "F3", "Ab3", "B3", "D4"], "C"]}, {"text": "Modal (모달): F/G → Fm/G. Fm là hợp âm IV của C thứ, mượn sang giọng C, nên đây là kiểu kết Amen (Amen cadence) F → Fm trên nốt bass giữ nguyên (pedal point) G. Modal 2: Fm7 → Bb7, thầy bấm F2 Eb3 | Ab3 C4 → Bb2 Ab3 | C4 D4; trông như II–V về Eb nhưng không về Eb mà vẫn nghe tự nhiên, vì hợp âm mượn chỉ để tô màu, không bắt buộc giải quyết.", "tip": "Từ F/G sang Fm/G chỉ cần hạ A xuống Ab ở tay phải, bass G đứng yên.", "compare": {"a": {"label": "F/G → Fm/G", "play": ["F/G", "Fm/G"]}, "b": {"label": "Fm7 → Bb7", "play": [["F2", "Eb3", "|", "Ab3", "C4"], ["Bb2", "Ab3", "|", "C4", "D4"]]}}}, {"text": "Top note (탑노트 4음): câu \"입술의 모든 말\" đứng ở C, nhưng nốt giai điệu F không thuộc hợp âm C. Thầy chọn hợp âm theo nốt trên cùng (top note): Dm có nốt F và là hợp âm thay thế của F, đặt trên bass C thành C – Dm/C – C. Hợp âm C thêm nốt 2 (add2) cho sáng hơn: tay trái C2 C3, tay phải G3 D4 E4.", "tip": "Hợp âm thêm nốt 2 (add2): thêm nốt gốc lên một cung vào hợp âm, C lên một cung là D, nên Cadd2 (sổ tay ghi C2) = C D E G.", "keys": ["C2", "C3", "G3", "D4", "E4"], "play": [["C2", "C3", "G3", "D4", "E4"], "Dm/C", ["C2", "C3", "G3", "D4", "E4"]]}, {"text": "Modal, lần lặp: câu này hát lại thì phải đổi màu. Lần 1 Dm/C nghe màu cổ điển (classical); lần 2 thầy dùng C – Dm7(b5)/C – C, bấm C2 C3 | Ab3 D4 F4. Dm7(b5) là cách sổ tay ghi Dm7b5 ở P3, mượn từ C thứ: vẫn giữ F trên cùng nhưng Ab làm màu tối đi.", "tip": "Từ Dm/C sang Dm7(b5)/C: giữ D và F, chỉ hạ A xuống Ab.", "keys": ["C2", "C3", "Ab3", "D4", "F4"], "compare": {"a": {"label": "Lần 1: Dm/C", "play": ["C", "Dm/C", "C"]}, "b": {"label": "Lần 2: Dm7(b5)/C", "play": ["C", ["C2", "C3", "|", "Ab3", "D4", "F4"], "C"]}}}, {"text": "Tiến hành đi qua dẫn vào hợp âm 7 (도미넌트를 위한 경과적진행): C – C/Bb – A7(b9), bass đi xuống C, Bb, A. Bass Bb báo trước nốt b9 của A7 (chính là Bb), nên vào A7(b9) rất mượt. C#dim7 (sổ tay ghi C#°7) nằm sẵn trong A7(b9): C#, E, G, Bb, nên hai hợp âm thay cho nhau được.", "tip": "Nốt b9 của A7 là nốt gốc A nhích lên nửa cung, tức Bb: đặt Bb ở bass ngay trước là đã chuẩn bị sẵn.", "keys": ["Bb2"], "play": ["C", "C/Bb", "A7(b9)"]}], "remember": ["Tìm hợp âm đích của câu rồi chọn đường vào: tiến hành đi qua (bass liền bậc) hoặc hợp âm 7 đặt ngay trước đích.", "F/G → G7(b9): tay trái giữ G F, tay phải A C xuống Ab B rồi thêm D; Fm/G, Fm7, Bb7, Dm7(b5) là hợp âm mượn từ C thứ.", "Nốt giai điệu không thuộc hợp âm thì chọn hợp âm theo nốt trên cùng (C – Dm/C – C); hát lại thì đổi màu."], "items": [{"chord": "G7(b9)", "to": "C", "prog": ["F/G", "G7(b9)", "C"]}, {"chord": "Fm/G", "rel": "modal", "prog": ["F/G", "Fm/G"]}, {"chord": "C/Bb", "to": "A7(b9)", "prog": ["C", "C/Bb", "A7(b9)"]}], "quiz": [{"q": "Vì sao C/Bb dẫn vào A7(b9) rất mượt?", "choices": ["Bass Bb báo trước nốt b9 của A7", "C/Bb là \"mẹ\" của A7", "Bb là nốt gốc củ
