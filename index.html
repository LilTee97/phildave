        frame(`<p>${renderTeachText(t.text)}</p>${t.tip ? `<div class="tip">💡 Mẹo: ${renderTeachText(t.tip)}</div>` : ''}${demoBtns ? `<div class="row">${demoBtns}</div>` : ''}${bk()}<button class="b pri" data-next>Tiếp →</button>`); wire();
        const go = pl => () => { if (run === lessonRun) playSeq(demoSeq(pl)); };
        const bind = (sel, pl) => { const e = $('main').querySelector(sel); if (e) e.onclick = go(pl); };
        if (t.play) bind('[data-play]', t.play);
        if (t.compare) { bind('[data-play-a]', t.compare.a.play); bind('[data-play-b]', t.compare.b.play); }
        if (t.show) showChord(parseSymbol(t.show), 'Ví dụ');
        else if (t.keys) showNotes(notesChord(t.keys), 'Ví dụ');
      } else if (st.k === 'rem') {
        resetPanel();
        frame(`<h3>Ghi nhớ</h3><ul class="remember">${lesson.remember.map(r => `<li>${renderTeachText(r)}</li>`).join('')}</ul>${bk()}<button class="b pri" data-next>Tiếp →</button>`); wire();
      } else if (st.k === 'try') {
        resetPanel();
        frame(`<h3>${esc(st.c.name)}</h3><p>Bấm thử trên đàn hoặc chạm phím rồi nhấn Kiểm tra.</p>
          ${bk()}<button class="b" data-skip>Bỏ qua</button>`); wire();
        const r = lessonRun, at = i; setTarget(st.c, () => { if (r === lessonRun && i === at) advance(); });
      } else if (st.q.choices) {
        const q = st.q; resetPanel();
        frame(`<h3>${renderTeachText(q.prompt)}</h3><div class="choices">${q.choices.map(c =>
          `<button class="b" data-n="${esc(c)}" data-answer="${esc(q.answer)}">${esc(c)}</button>`).join('')}</div><div id="qnext"></div>${i > 0 ? `<div id="qback" style="margin-top:10px">${bk()}</div>` : ''}`);
        const markDone = (b) => {
          b.classList.add('right'); answered.add(i);
          $('main').querySelectorAll('.choices [data-n]').forEach(x => { x.disabled = true; x.removeAttribute('data-answer'); });
          $('qnext').innerHTML = `<p class="why">${renderTeachText(q.why || '')}</p>${bk()}<button class="b pri" data-next style="margin-top:10px">Tiếp →</button>`;
          const qb = $('qback'); if (qb) qb.remove(); wire();
        };
        wire();
        (wrongs.get(i) || []).forEach(n => { const w = [...$('main').querySelectorAll('.choices [data-n]')].find(x => x.dataset.n === n); if (w) { w.classList.add('wrong'); w.disabled = true; } });
        if (answered.has(i)) markDone([...$('main').querySelectorAll('.choices [data-n]')].find(x => x.dataset.n === q.answer));
        $('main').querySelectorAll('.choices [data-n]').forEach(b => b.onclick = () => {
          if (b.disabled) return;
          stopPlay();
          if (b.dataset.n === q.answer) markDone(b);
          else {
            b.classList.add('wrong'); b.disabled = true;   // bấm lại nút sai không đếm thêm lỗi
            wrongs.set(i, [...(wrongs.get(i) || []), b.dataset.n]);
            progress.wrong[q.key] = (Number(progress.wrong[q.key]) || 0) + 1; persist();
          }
        });
      } else {
        const q = st.q; resetPanel();
        frame(`<h3>${renderTeachText(q.prompt)}</h3><p class="why">${renderTeachText(q.why || '')}</p><p>Bấm trên đàn hoặc chạm phím rồi nhấn Kiểm tra.</p>${bk()}<button class="b" data-skip>Bỏ qua</button>`);
        skip = () => { if (!resolved.has(i)) { resolved.add(i); progress.wrong[q.key] = (Number(progress.wrong[q.key]) || 0) + 1; persist(); } advance(); };
        wire();
        const r = lessonRun, at = i; setTarget(q.chord, () => { if (r === lessonRun && i === at) { resolved.add(at); advance(); } });
      }
    }
    show();
  }

  // ---- Tab Đố ----
  let prog = ['C','Am','F','G'];
  function quiz() {
    const cs = prog.map(parseChord).filter(Boolean);
    const i = 1 + Math.floor(Math.random() * (cs.length - 1));
    const tgt = cs[i], right = suggest(tgt)[0];
    const wrongTension = chord(tgt.root + 7, tgt.type === 'min' ? 'dom9' : 'domb9');
    const pool = [right.c, wrongTension, chord(tgt.root + 9, 'dom7'), chord(tgt.root + 5, 'maj')];
    const opts = [...new Map(pool.map(c => [c.name, c])).values()].sort(() => Math.random() - 0.5);
    const line = cs.map((c, k) => k === i ? `<span class="q">?</span> | ${c.name}` : c.name).join(' | ');
    $('main').innerHTML = `<div class="card"><div class="mut">Vòng: ${prog.join(' ')} · ô "?" là 2 phách cuối trước ${tgt.name}</div>
      <div class="prog">${line}</div><h3>Hợp âm gì kéo về ${tgt.name}?</h3>
      <div class="choices">${opts.map(c => `<button class="b" data-n="${c.name}">${c.name}</button>`).join('')}</div>
      <p id="fb"></p></div>`;
    $('main').querySelectorAll('[data-n]').forEach(b => b.onclick = () => {
      if (b.dataset.n === right.c.name) {
        b.classList.add('right');
        $('main').querySelectorAll('[data-n]').forEach(x => x.disabled = true);
        $('fb').innerHTML = `<span class="ok">✓ ${right.c.name}</span> — ${right.why}<br><span class="mut">Giờ bấm thử thế tay bên dưới.</span>`;
        setTarget(inContext(right.c, cs[i - 1]), quiz);
      } else {
        b.classList.add('wrong'); b.disabled = true;
        $('fb').innerHTML = `<span class="bad">Chưa đúng.</span> Gợi ý: bass cao hơn ${tgt.name} một quãng 5 (từ ${nm(tgt.root)} đếm lên 5 tên nốt, nốt thứ năm là bass), và ${tgt.name} là hợp âm ${tgt.type === 'min' ? 'thứ' : 'trưởng'}.`;
      }
    });
  }

  // Nghe một chuỗi hợp âm. seq = [[chord, số phách, id nút hoặc null], ...]
  let timers = [];
  function stopPlay() { timers.forEach(clearTimeout); timers = []; oscs.forEach(o => { try { o.stop(); } catch (e) {} }); oscs = [];
    document.querySelectorAll('.playing').forEach(e => e.classList.remove('playing')); }
  function playSeq(seq) {
    stopPlay();
    const beat = 60 / settings.bpm; let t = 0;
    for (const [c, beats, id] of seq) {
      const v = c.demo ? c.v : voicing(c);
      play([...v.lh, ...v.rh], beats * beat * 0.95, t);
      timers.push(setTimeout(() => {
        document.querySelectorAll('.playing').forEach(e => e.classList.remove('playing'));
        const el = id != null && document.querySelector(`[data-c="${id}"]`); if (el) el.classList.add('playing');
        showChord(c);
      }, t * 1000));
      t += beats * beat;
    }
    timers.push(setTimeout(stopPlay, t * 1000));
  }

  // ---- Tab Tái hoà âm ----
  let picks = null, bp = [], lastB, endSel = 0;
  // Kiểu kết: vòng chạy 1 lần rồi về hợp âm chủ (hợp âm đầu vòng)
  const ENDINGS = [
    { label: 'Về chủ', make: h => [[chord(h.root, h.type === 'min' ? 'm9' : 'maj9'), 4]] },
    { label: 'Mẹ b9 → chủ', make: h => [[chord(h.root + 7, 'domb9'), 2], [chord(h.root, h.type === 'min' ? 'm9' : 'maj9'), 4]] },
    { label: 'Bạn của mẹ → chủ', make: h => [[chord(h.root + 1, 'lyd'), 2], [chord(h.root, h.type === 'min' ? 'm9' : 'maj9'), 4]] },
    { label: '9sus4 → mẹ → chủ', make: h => [[chord(h.root + 7, h.type === 'min' ? 'sus4b9' : 'sus9'), 2],
                                            [chord(h.root + 7, h.type === 'min' ? 'domb9' : 'dom13'), 2],
                                            [chord(h.root, h.type === 'min' ? 'm9' : 'maj9'), 4]] },
  ];   // picks null = chưa chọn gì; bp = màu hợp âm gốc
  function reharm() {
    $('main').innerHTML = `<div class="card"><h3>Nhập vòng hợp âm</h3>
      <input id="pin" value="${prog.join(' ')}" placeholder="VD: C Am F G">
      <button class="b pri" id="go">Gợi ý</button><span class="mut"> (hợp âm ba nốt, cách nhau bằng dấu cách)</span></div><div id="out"></div>`;
    let cs = [], curBars = () => [];
    const render = () => {
      const n = cs.length, CL = colored(cs, bp, lastB), S = CL.tgts.map(suggest);
      let top = '<p class="mut">Đổi màu một hợp âm gốc, hoặc nhấn "Chọn" ở một hợp âm chèn: cả vòng sẽ được tái hoà âm cho hợp.</p>', all = [];
      const bars = picks ? reharmAll(cs, picks, bp, lastB) : [];
      const flatV = picks ? voiceSeq(bars.flatMap(b => [b.base, ...b.slot])) : [];
      // hợp âm đứng ngay trước ô chèn i (= hợp âm cuối của ô nhịp trước) và trước hợp âm gốc j
      const beforeSlot = i => picks ? bars[(i - 1 + n) % n].base : null;
      const beforeBase = j => { if (!picks) return null; const b = bars[(j - 1 + n) % n]; return b.slot.length ? b.slot[b.slot.length - 1] : b.base; };
      if (picks) {
        all = bars.flatMap(b => [b.base, ...b.slot]);
        let idx = 0;
        const chip = (c, cls) => `<button class="b ${cls}" data-c="${idx++}" style="margin:2px">${c.name}</button>`;
        top = `<div class="card"><h3>Vòng mới</h3>` + bars.map((b, j) =>
          `<div class="row"><span class="mut" style="width:28px">${j + 1}.</span>${chip(b.base, '')}${b.slot.map(c => chip(c, 'pri')).join('')}</div>`).join('') +
          `<p class="mut">Mỗi dòng là 1 ô nhịp: hợp âm gốc 2 phách, hợp âm màu (cam) chia nhau 2 phách cuối. Chạm hợp âm để bấm thử.</p>
          <button class="b pri" id="playNew">▶ Nghe vòng mới</button><button class="b" id="playBase">▶ Chỉ hợp âm gốc đã đổi màu</button>
          <button class="b" id="playOld">▶ Vòng gốc</button>
          <div class="row" style="margin-top:6px"><button class="b pri" id="playEnd">▶ Nghe có kết</button>
          <select id="endSel" class="b">${ENDINGS.map((e, q) => `<option value="${q}" ${q === endSel ? 'selected' : ''}>${e.label}</option>`).join('')}</select></div>
          <div class="row" style="margin-top:6px"><label>Nhịp: <b id="bpmv">${settings.bpm}</b> phách/phút <input type="range" id="bpm" min="50" max="120" step="2" value="${settings.bpm}"></label></div>
          <button class="b" id="stop">■ Dừng</button><button class="b" id="reset">Bỏ chọn</button>
          <p class="mut" style="font-size:11px">Âm piano: FluidR3_GM (Frank Wen), CC BY 3.0</p></div>`;
      }
      const key = cs[0].type === 'min' ? (cs[0].root + 3) % 12 : cs[0].root;
      const BO = cs.map((c, j) => baseOptions(c, cs[(j + 1) % n], key));
      const baseCard = `<div class="card"><h3>Đổi màu hợp âm gốc</h3>` + cs.map((c, j) => {
        const want = bp[j] ?? 0, got = CL.bases[j].name;
        const sel = BO[j].findIndex(o => o.c.name === got);
        const auto = got !== BO[j][want].c.name ? `<div class="mut" style="color:var(--rh)">→ Tự đổi thành ${got} cho hợp với hợp âm bên cạnh.</div>` : '';
        return `<div style="margin:8px 0"><b>${c.name}</b> → ` +
          BO[j].map((o, q) => `<button class="b ${q === sel ? 'pri' : ''}" data-b="${j}-${q}">${o.c.name}</button>`).join('') +
          `<div class="mut">${BO[j][want].why}</div>${auto}</div>`;
      }).join('') + '</div>';
      $('out').innerHTML = top + baseCard + '<h3 style="margin:14px 2px 6px">Chèn hợp âm màu</h3>' + cs.map((tgt, i) => {
        const CB = CL.bases, prev = CB[(i - 1 + n) % n].name;
        return `<div class="card"><h3>${prev} → <span class="q">?</span> → ${CB[i].name}</h3>` +
          S[i].map((s, k) => `<div class="sug ${picks && picks[i] === k ? 'sel' : ''}"><div><b>${s.c.name}</b> — ${s.why}</div>
            <button class="b pri" data-p="${i}-${k}">Chọn</button><button class="b" data-s="${i}-${k}">Bấm thử</button></div>`).join('') + '</div>';
      }).join('');
      const ik = (b, key) => b.dataset[key].split('-').map(Number);
      $('out').querySelectorAll('[data-c]').forEach(b => b.onclick = () => setTarget(all[b.dataset.c]));
      // Bấm thử: hợp âm đang nằm trong vòng thì dùng đúng hợp âm đó; không thì bấm theo hợp âm đứng trước
      const fromBars = (i, name) => picks && bars[(i - 1 + n) % n].slot.find(c => c.name === name);
      $('out').querySelectorAll('[data-s]').forEach(b => b.onclick = () => {
        const [i, k] = ik(b, 's'), c = S[i][k].c; setTarget(fromBars(i, c.name) || inContext(c, beforeSlot(i)));
      });
      $('out').querySelectorAll('[data-p]').forEach(b => b.onclick = () => {
        const [i, k] = ik(b, 'p');
        picks = picks || cs.map(() => null); picks[i] = k;
        render(); $('main').scrollTop = 0;
      });
      $('out').querySelectorAll('[data-b]').forEach(b => b.onclick = () => {
        const [j, q] = ik(b, 'b'); bp[j] = q; lastB = j; picks = picks || cs.map(() => null);
        render(); setTarget(curBars()[j].base);
      });
      curBars = () => bars;
      if (picks) {
        $('reset').onclick = () => { stopPlay(); picks = null; bp = []; render(); };
        $('stop').onclick = stopPlay;
        $('bpm').oninput = e => {
          settings.bpm = clampBpm(+e.target.value); $('bpmv').textContent = settings.bpm; persist();
          if (timers.length) stopPlay();
        };
        // mỗi ô 4 phách: hợp âm gốc 2 phách, hợp âm màu chia nhau 2 phách (không có màu thì gốc giữ 4 phách)
        const seq = seqOf(bars), baseSeq = seq.filter(([c]) => bars.some(b => b.base === c)).map(([c, , id]) => [c, 4, id]);
        $('playBase').onclick = () => playSeq([...baseSeq, ...baseSeq]);
        $('endSel').onchange = e => { endSel = +e.target.value; };
        $('playEnd').onclick = () => {
          const home = cs[0], endC = ENDINGS[endSel].make(home), last = seq[seq.length - 1][0];
          voiceSeq(endC.map(([c]) => c), voicing(last));
          playSeq([...seq, ...endC.map(([c, beats]) => [c, beats, null])]);
        };
        $('playNew').onclick = () => playSeq([...seq, ...seq]);
        $('playOld').onclick = () => playSeq([...cs, ...cs].map(c => [c, 4, null]));
      }
    };
    $('go').onclick = () => {
      const raw = $('pin').value.split(/\s+/).filter(Boolean), parsed = raw.map(parseChord);
      if (parsed.some(c => !c) || parsed.length < 2) { $('out').innerHTML = '<p class="bad">Không đọc được vòng hợp âm.</p>'; return; }
      prog = raw; cs = parsed; picks = null; bp = []; render();
    };
    $('go').click();
  }

  const TABS = { learn, quiz, reharm };
  document.querySelectorAll('nav button').forEach(b => b.onclick = () => {

  learn(); drawKb();
  if (!TEST_MODE) loadPiano();
  // Chạy offline: đăng ký service worker; lỗi gì cũng bỏ qua, app vẫn chạy
  try {
    if (!TEST_MODE && shouldRegisterSW(location.protocol)) {
      navigator.serviceWorker.register('./sw.js').catch(e => console.warn('SW:', e));
      // Lần mở đầu, mẫu âm tải trước khi SW kịp chạy nên SW chưa lưu: tự lưu mẫu vào cache để lần sau chạy offline
      navigator.serviceWorker.ready.then(() => caches.open('phildave-v1')).then(c => {
        for (let n = 36; n <= 84; n++) c.match(SAMPLE_URL(n)).then(hit => hit || c.add(SAMPLE_URL(n))).catch(() => {});
      }).catch(() => {});

  } catch (e) { console.warn('SW:', e); }
  // Chrome/Edge tạo AudioContext ở trạng thái suspended khi chưa có thao tác người dùng
  const wake = () => { if (ac && ac.state === 'suspended') ac.resume(); };
  ['pointerdown', 'keydown'].forEach(ev => document.addEventListener(ev, wake, { once: true }));

  // ---- Test giao diện (chạy khi mở trang với ?test, ví dụ http://localhost:8000/?test) ----
  const click = sel => { const e = document.querySelector(sel); ok(e, 'không thấy ' + sel); e.click(); };
  // từ màn đầu của bài, bấm Tiếp tới bước bấm thử đầu tiên
  const toTry = () => { let g = 0; while (!document.querySelector('[data-skip]') && g++ < 12) click('[data-next]'); ok(document.querySelector('[data-skip]'), 'chưa tới bước bấm thử'); };
  const DOMTESTS = [
    { name:'Mẹo thực tế: màn giảng có tip hiện khung «💡 Mẹo», có thuật ngữ chạm được, không có HTML lạ', fn() {

          ok(!$('main').querySelector('.tip'), 'màn không có mẹo vẫn hiện khung'); }
        TABS.learn(); } },
    { name:'GĐ2-T4: đi hết một bài có thầy giảng, có giải thích sau câu hỏi, có bài kế tiếp', fn() {
        const keep = JSON.stringify(progress); progress.done = {}; progress.wrong = {};

        const lb = n => [...document.querySelectorAll('#kb > div')][n - 36].textContent;

    { name:'GĐ2-T4: đang nghe ví dụ mà bấm Tiếp hoặc đổi tab thì dừng', fn() {
        TABS.learn(); click('[data-lesson="p3-01"]');
        const btn = document.querySelector('[data-play]'); ok(btn, 'màn giảng đầu không có nút Nghe'); btn.click();
        ok(timers.length > 0, 'không phát'); click('[data-next]'); eq(timers.length, 0);
        document.querySelector('[data-play]') && document.querySelector('[data-play]').click();
        document.querySelector('nav button[data-t="quiz"]').click(); eq(timers.length, 0); TABS.learn(); } },
    { name:'GĐ2-T4: danh sách đếm theo phần, tô bài kế tiếp', fn() {
        const keep = JSON.stringify(progress); progress.done = { 'p3-01': true };
        TABS.learn(); const h = [...document.querySelectorAll('#main .card h3')].find(e => e.textContent.includes('Phildave 3'));
        ok(h && h.textContent.includes('1/25'), 'phần Phildave 3 không hiện 1/25');
        ok(document.querySelector('[data-lesson="p3-02"]').classList.contains('next'), 'p3-02 chưa được tô');
        ok(!document.querySelector('[data-lesson="p3-03"]').classList.contains('next'), 'tô nhầm p3-03');
        Object.assign(progress, JSON.parse(keep)); TABS.learn(); } },
    { name:'GĐ2-T2b: chạm thuật ngữ hiện giải thích', fn() {
      TABS.learn(); click('[data-lesson="p3-01"]'); const t = document.querySelector('[data-term]'); ok(t, 'màn giảng đầu không có thuật ngữ gạch chân'); t.click();
      ok(document.querySelector('.term-pop'), 'không hiện khung giải thích'); ok(t.getAttribute('tabindex') === '0' && t.getAttribute('role') === 'button', 'thuật ngữ không bấm được bằng bàn phím');
      document.dispatchEvent(new KeyboardEvent('keydown', { key: 'Escape' })); ok(!document.querySelector('.term-pop'), 'Escape không đóng');
      t.dispatchEvent(new KeyboardEvent('keydown', { key: 'Enter', bubbles: true })); ok(document.querySelector('.term-pop[role="dialog"]'), 'Enter không mở'); closeTerm(); TABS.learn(); } },
    { name: 'GĐ1-T7: play đánh thức AudioContext đang suspended', fn() {
      const keep = ac; let resumed = 0;
      const node = () => ({ frequency: {}, gain: { setValueAtTime() {}, exponentialRampToValueAtTime() {}, linearRampToValueAtTime() {} },
        connect: x => x, start() {}, stop() {} });
      ac = { state: 'suspended', currentTime: 0, destination: {}, resume() { resumed++; return Promise.resolve(); },
        createOscillator: node, createGain: node };
      try { play([60]); } finally { ac = keep; }
      eq(resumed, 1); } },
    { name: 'Fix cuối #6: mọi tiếng đi qua gain tổng + nén chung', fn() {
      const real = getAC(); ok(real && real.master instanceof GainNode, 'AudioContext thật thiếu gain tổng');
      const keep = ac, master = { m: 1 }, outs = [];
      const node = () => ({ frequency: {}, gain: { setValueAtTime() {}, exponentialRampToValueAtTime() {}, linearRampToValueAtTime() {} },
        connect(x) { if (x === master || x === fake.destination) outs.push(x); return x; }, start() {}, stop() {} });
      const fake = { state: 'running', currentTime: 0, destination: {}, master, createOscillator: node, createGain: node, createBufferSource: node };
      const kb = pianoBufs[61]; pianoBufs[61] = {};
      try { ac = fake; play([60, 61]); } finally { ac = keep; if (kb) pianoBufs[61] = kb; else delete pianoBufs[61]; }
      eq(outs.length, 2); ok(outs.every(x => x === master), 'có tiếng nối thẳng ra loa'); } },
    { name:'GĐ2-T5 sửa: nhãn tay trên bàn phím viết theo hợp âm (C#dim7 → C#, không phải Db)', fn() {
        try {
          TABS.learn(); click('[data-lesson="p3-24"]'); toTry(); eq(target.name, 'C#dim7'); click('#show');
          eq(document.querySelector('#kblabels .hand.lh').textContent, 'C#'); eq(document.querySelector('#kblabels .hand.rh').textContent, 'Edim');
        } finally { click('nav button[data-t="learn"]'); } } },
    { name:'Lỗi #19: phím có tên nốt + số quãng tám, C to đậm', fn() {
        eq(document.querySelector('#kb [data-n="38"]').textContent, 'D2');
        eq(document.querySelector('#kb [data-n="42"]').textContent, 'F#2');
        ok(document.querySelector('#kb [data-n="48"] .lbl.c'), 'C3 không đậm'); } },
    { name:'Lỗi #20: Đố — chọn sai tô đỏ, chọn đúng tô xanh', fn() {
        TABS.quiz(); let right = false;
        for (const b of $('main').querySelectorAll('.choices [data-n]')) {
          b.click();
          if (b.classList.contains('right')) { right = true; break; }
          ok(b.classList.contains('wrong'), `chọn sai ${b.textContent} mà không tô đỏ`);
        }
        ok(right, 'chọn đúng mà không tô xanh'); } },
    { name:'Lỗi #21: Tái hoà âm có nút "Chọn" và đủ 4 nút nghe', fn() {
        TABS.reharm(); click('[data-p="1-0"]');
        ['playNew','playBase','playOld','playEnd'].forEach(id => ok($(id), 'thiếu nút ' + id)); } },
    { name:'Lỗi #22: nút nghe phát đúng màu đã chọn, bàn phím hiện đúng nốt đang phát', fn() {
        click('[data-b="1-1"]'); click('[data-b="3-2"]');
        const orig = playSeq; let got = null; playSeq = seq => { got = seq; };
        $('playNew').click(); $('playEnd').click(); playSeq = orig;
        const nm2 = got.map(x => x[0].name).join(' ');
        ok(nm2.includes('Am9') && nm2.includes('Db13(#11)') && nm2.endsWith('Cmaj9'), nm2);
        for (const [c] of got) {
          showChord(c);
          const lit = [...document.querySelectorAll('#kb .lh, #kb .rh')].map(e => +e.dataset.n).sort((a, b) => a - b);
          const v = voicing(c); eq(lit.join(), [...v.lh, ...v.rh].sort((a, b) => a - b).join());
        } } },
    { name:'Lỗi #23: "Bấm thử" ở thẻ gợi ý cho cùng thế bấm với hợp âm trong vòng', fn() {
        TABS.reharm(); click('[data-p="1-0"]');
        const chip = [...document.querySelectorAll('[data-c]')].find(e => e.textContent === 'E7(b9)'); chip.click();
        const a = JSON.stringify(voicing(target));
        click('[data-s="1-0"]'); eq(JSON.stringify(voicing(target)), a); } },
    { name:'GĐ1-T6: học xong một bài thì được đánh dấu ✓', fn() {
        const keep = JSON.stringify(progress); progress.done = {}; progress.wrong = {};
        TABS.learn(); click('[data-lesson="p3-01"]');
        let guard = 0;
        while (!document.querySelector('[data-done]') && guard++ < 40) {
          const next = document.querySelector('[data-next]'), skip = document.querySelector('[data-skip]');
          const right = [...$('main').querySelectorAll('.choices [data-n]')].find(b => b.dataset.n === b.dataset.answer);
          (right || next || skip).click();
        }
        ok(document.querySelector('[data-done]'), 'không tới được màn Xong');
        eq(progress.done['p3-01'], true);
        TABS.learn(); ok(document.querySelector('[data-lesson="p3-01"]').textContent.includes('✓'), 'danh sách chưa có ✓');
        Object.assign(progress, JSON.parse(keep)); } },
    { name:'GĐ1-T6 fix: đổi tab giữa bài thì bài bị huỷ, không giành màn hình tab khác', fn() {
        const keep = JSON.stringify(progress);
        TABS.learn(); click('[data-lesson="p3-01"]'); toTry();
        const cb = onDone, lessonChord = target; ok(cb && lessonChord, 'thiếu callback/target của bài');
        click('nav button[data-t="quiz"]');
        ok(target !== lessonChord && !onDone, 'hợp âm của bài còn trên bảng luyện');
        cb();
        ok(!$('main').textContent.includes('Bước'), 'bài cũ giành lại màn hình');
        ok($('main').querySelector('.choices'), 'màn Đố bị ghi đè');
        click('nav button[data-t="learn"]');
        Object.assign(progress, JSON.parse(keep)); } },
    { name:'Fix cuối #1: chấm đúng hai lần (hoặc đúng rồi Bỏ qua) chỉ sang đúng một bước', async fn() {
        const keep = JSON.stringify(progress), wait = ms => new Promise(r => setTimeout(r, ms));
        const stepNo = () => ($('main').textContent.match(/Bước (\d+)\//) || [])[1];
        const tapRight = () => { const v = voicing(target); [...v.lh, ...v.rh].forEach(n => click(`#kb [data-n="${n}"]`)); };
        try {
          TABS.learn(); click('[data-lesson="p3-02"]'); toTry();   // p3-02 có 3 bài tập liền nhau
          const s0 = +stepNo(), st = k => String(s0 + k); tapRight(); click('#checkTap'); click('#checkTap');
          await wait(1100); eq(stepNo(), st(1));
          tapRight(); click('#checkTap'); click('[data-skip]'); eq(stepNo(), st(2));
          await wait(1100); eq(stepNo(), st(2));
          // Đố: đúng rồi đổi tab ngay → câu đố mới không được vẽ đè lên tab khác
          click('nav button[data-t="quiz"]');
          [...$('main').querySelectorAll('.choices [data-n]')].forEach(b => b.click());
          tapRight(); click('#checkTap'); click('nav button[data-t="reharm"]');
          await wait(1100); ok($('pin') && !$('main').querySelector('.choices'), 'câu đố cũ vẽ đè tab Tái hoà âm');
        } finally { click('nav button[data-t="learn"]'); Object.assign(progress, JSON.parse(keep)); } } },
    { name:'Fix cuối (phụ): bấm lại nút sai trong bài không đếm thêm lỗi', fn() {
        const keep = JSON.stringify(progress);
        try {
          progress.wrong = {}; TABS.learn(); click('[data-lesson="p3-01"]');
          let guard = 0;
          while (!$('main').querySelector('.choices') && guard++ < 20) click('[data-next], [data-skip]');
          const bad = [...$('main').querySelectorAll('.choices [data-n]')].find(b => b.dataset.n !== b.dataset.answer);
          bad.click(); bad.click(); bad.click();
          eq(Object.values(progress.wrong).join(), '1'); ok(bad.disabled, 'nút sai chưa bị khoá');
        } finally { click('nav button[data-t="learn"]'); Object.assign(progress, JSON.parse(keep)); } } },
    { name:'Quay lại #1: về bước giảng trước; màn giảng đầu không có nút quay lại', fn() {
        const keep = JSON.stringify(progress);
        try {
          TABS.learn(); click('[data-lesson="p3-01"]');
          ok($('main').textContent.includes('Giảng 1/'), 'không ở Giảng 1'); ok(!$('main').querySelector('[data-back]'), 'màn giảng đầu có nút quay lại');
          click('[data-next]'); ok($('main').textContent.includes('Giảng 2/'), 'không sang Giảng 2');
          click('[data-back]'); ok($('main').textContent.includes('Giảng 1/'), 'không về Giảng 1');
          click('[data-next]'); click('[data-back]'); click('[data-next]'); ok($('main').textContent.includes('Bước 2/'), 'Bước x/y sai sau khi đi lại');
        } finally { click('nav button[data-t="learn"]'); Object.assign(progress, JSON.parse(keep)); } } },
    { name:'Quay lại #2: câu trắc nghiệm đã trả lời hiện lại ở trạng thái đã đáp, không đếm lỗi thêm', fn() {
        const keep = JSON.stringify(progress);
        try {
          progress.wrong = {}; TABS.learn(); click('[data-lesson="p3-01"]');
          let g = 0; while (!$('main').querySelector('.choices') && g++ < 20) click('[data-next], [data-skip]');
          const bs = [...$('main').querySelectorAll('.choices [data-n]')];
          bs.find(b => b.dataset.n !== b.dataset.answer).click(); bs.find(b => b.dataset.n === b.dataset.answer).click();
          const w = JSON.stringify(progress.wrong), head = $('main').querySelector('.lhead').textContent;
          click('[data-next]'); ok($('main').querySelector('.lhead').textContent !== head, 'chưa sang bước sau');
          click('[data-back]');
          ok($('main').querySelector('.choices .right') && $('main').querySelector('.why') && $('main').querySelector('[data-next]'), 'không ở trạng thái đã đáp');
          ok($('main').querySelector('.lhead').textContent === head, 'tiêu đề bước sai');
          ok([...$('main').querySelectorAll('.choices [data-n]')].every(b => b.disabled), 'đáp án chưa khoá');
          eq(JSON.stringify(progress.wrong), w);
        } finally { click('nav button[data-t="learn"]'); Object.assign(progress, JSON.parse(keep)); } } },
    { name:'Quay lại #2b: nút sai đã bấm vẫn khoá sau khi quay lại rồi tiến, không đếm lỗi thêm', fn() {
        const keep = JSON.stringify(progress);
        try {
          progress.wrong = {}; TABS.learn(); click('[data-lesson="p3-01"]');
          let g = 0; while (!$('main').querySelector('.choices') && g++ < 20) click('[data-next], [data-skip]');
          const bad = [...$('main').querySelectorAll('.choices [data-n]')].find(b => b.dataset.n !== b.dataset.answer), n = bad.dataset.n;
          bad.click(); const w = JSON.stringify(progress.wrong);
          click('[data-back]'); click('[data-next], [data-skip]');
          const again = [...$('main').querySelectorAll('.choices [data-n]')].find(b => b.dataset.n === n);
          ok(again && again.disabled && again.classList.contains('wrong'), 'nút sai không bị khoá lại');
          again.click(); eq(JSON.stringify(progress.wrong), w);
        } finally { click('nav button[data-t="learn"]'); Object.assign(progress, JSON.parse(keep)); } } },
    { name:'Quay lại #4: Bỏ qua câu bấm đàn, quay lại, bỏ qua tiếp chỉ đếm lỗi một lần; Xong không có nút quay lại; bài tập đầu → Ghi nhớ', fn() {
        const keep = JSON.stringify(progress); let restoreQ = () => {};
        try {
          const origQ = makeQuiz;   // ép quiz có hai câu bấm đàn liền nhau (dữ liệu thật luôn xếp câu bấm đàn cuối)
          makeQuiz = (l, r) => { const pl = origQ(l, r).find(x => x.kind === 'play'); return [pl, { ...pl, key: pl.key + '#2' }]; };
          restoreQ = () => { makeQuiz = origQ; };
          progress.wrong = {}; TABS.learn(); click('[data-lesson="p3-01"]');
          const head = () => $('main').querySelector('.lhead').textContent;
          const step = () => { const r = [...$('main').querySelectorAll('.choices [data-n]')].find(x => x.dataset.n === x.dataset.answer); if (r) r.click(); (document.querySelector('[data-next]') || document.querySelector('[data-skip]')).click(); };
          let g = 0; while (!head().includes('Bài tập 1/') && g++ < 20) step();
          click('[data-back]'); ok(head().includes('Ghi nhớ'), 'không về Ghi nhớ'); click('[data-next]');
          g = 0; while (!(head().includes('Câu hỏi') && !$('main').querySelector('.choices') && $('main').querySelector('[data-skip]')) && g++ < 20) step();
          click('[data-skip]'); ok(!document.querySelector('[data-done]'), 'câu bấm đàn là câu cuối; cần ≥ 2'); const w = JSON.stringify(progress.wrong); ok(w !== '{}', 'bỏ qua không đếm lỗi');
          click('[data-back]'); click('[data-skip]'); eq(JSON.stringify(progress.wrong), w);
          g = 0; while (!document.querySelector('[data-done]') && g++ < 20) step();
          ok(document.querySelector('[data-done]') && !$('main').querySelector('[data-back]'), 'màn Xong có nút quay lại');
        } finally { restoreQ(); click('nav button[data-t="learn"]'); Object.assign(progress, JSON.parse(keep)); } } },
    { name:'Quay lại #3: đúng bài tập rồi Quay lại ngay thì huỷ tự sang bước sau', async fn() {
        const keep = JSON.stringify(progress), wait = ms => new Promise(r => setTimeout(r, ms));
        const stepNo = () => ($('main').textContent.match(/Bước (\d+)\//) || [])[1];
        try {
          TABS.learn(); click('[data-lesson="p3-02"]'); toTry();
          const s0 = stepNo(); ok($('main').querySelector('[data-back]'), 'bài tập không có nút quay lại');
          const v = voicing(target); [...v.lh, ...v.rh].forEach(n => click(`#kb [data-n="${n}"]`)); click('#checkTap');
          click('[data-back]'); eq(stepNo(), String(s0 - 1)); await wait(1200); eq(stepNo(), String(s0 - 1));
          click('[data-next]'); eq(stepNo(), s0); await wait(1200); eq(stepNo(), s0);
        } finally { stopPlay(); click('nav button[data-t="learn"]'); Object.assign(progress, JSON.parse(keep)); } } },
    { name:'Fix cuối #2: đổi tab/mức tay thì dừng vòng đang phát, không giành bảng luyện', async fn() {
        const wait = ms => new Promise(r => setTimeout(r, ms));
        try {
          click('nav button[data-t="reharm"]'); click('[data-p="1-0"]'); click('#playNew');
          ok(timers.length > 0, 'vòng chưa phát');
          click('nav button[data-t="learn"]'); eq(timers.length, 0);
          click('[data-lesson="p3-01"]'); toTry();
          const lessonChord = target; ok(lessonChord, 'chưa có hợp âm của bài');
          await wait(1500); ok(target === lessonChord, `bảng luyện bị đổi sang ${target && target.name}`);
          click('nav button[data-t="reharm"]'); click('[data-p="1-0"]'); click('#playNew');
          const lv = $('level'); lv.value = String(settings.level); lv.onchange({ target: lv }); eq(timers.length, 0);
        } finally { stopPlay(); click('nav button[data-t="learn"]'); } } },
  ];
  if (/[?&]test/.test(location.search)) {
    $('main').innerHTML = '<div class="card"><h3>Đang chạy test…</h3><p class="mut">Bộ rà chọi mất khoảng 10–20 giây.</p></div>';
    setTimeout(async () => {
      const r = [...await runTests(DOMTESTS), ...await runTests(TESTS)], bad = r.filter(x => !x.ok);
      TABS.learn();
      $('main').innerHTML = `<div class="card"><h3 class="${bad.length ? 'bad' : 'ok'}">Test: ${r.length - bad.length}/${r.length} đạt</h3>` +
        r.map(x => `<p>${x.ok ? '<span class="ok">✓</span>' : '<span class="bad">✗</span>'} ${x.name}${x.info ? ` <span class="mut">— ${x.info}</span>` : ''}</p>`).join('') + '</div>';
      document.title = `TEST ${r.length - bad.length}/${r.length}`;
    }, 50);
  }
}
