        const t = $('out').textContent; ok(t.includes('Thầy dặn: chèn vào Em7 nếu nghe gượng thì đừng dùng.'), 'thiếu lời bậc III');
        eq((t.match(/\(chị – mẹ\)/g) || []).length, 4); eq(document.querySelectorAll('[data-x]').length, 4);   // Dm, Em: lựa chọn 6; F, C: lựa chọn 0 (final review M1)
        eq(document.querySelector('[data-p="3-0"]').closest('.sug').querySelector('b').textContent, 'Gm7 – C9');   // thẻ trước F ghi cả "chị"
        click('[data-x="1"]'); ok(document.querySelector('[data-x="1"]').closest('.sug').classList.contains('sel'), 'Không chèn chưa sáng');
        const row = [...document.querySelectorAll('#out .card .row')].filter(r => r.querySelector('[data-c]'))[0];
        eq(row.querySelectorAll('[data-c]').length, 1);
        click('[data-p="2-6"]'); ok(document.querySelector('[data-p="2-6"]').closest('.sug').classList.contains('sel'), 'chị – mẹ chưa sáng');
        $('keySel').value = '7'; $('keySel').onchange(); ok(!document.querySelector('.sug.sel'), 'đổi giọng mà vẫn giữ lựa chọn');
        $('pin').value = 'C Am F G'; $('keySel').value = ''; $('keySel').onchange(); click('#go'); } },
    { name:'GĐ5-T5: thẻ chèn hiện hợp âm giảm đi qua; Chọn rồi nghe đúng; Bấm thử cùng thế với vòng; hợp âm chủ có nút C6/9', fn() {
        TABS.reharm(); $('pin').value = 'C Dm Em F'; click('#go'); click('[data-p="1-3"]');
        const chip = [...document.querySelectorAll('[data-c]')].find(e => e.textContent === 'C#dim7'); ok(chip, 'không có C#dim7 trong vòng mới'); chip.click();
        const a = JSON.stringify(voicing(target)); click('[data-s="1-3"]'); eq(JSON.stringify(voicing(target)), a);
        const orig = playSeq; let got = null; playSeq = s => { got = s; }; $('playNew').click(); playSeq = orig; ok(got.some(x => x[0].name === 'C#dim7'), 'không phát C#dim7');
        ok([...document.querySelectorAll('[data-b^="0-"]')].some(b => b.textContent === 'C6/9'), 'không có nút C6/9');
        ok(!document.querySelector('[data-p="0-3"]'), 'F → C không cách một cung mà vẫn có hợp âm giảm');
        $('pin').value = 'C Am F G'; click('#go'); } },
    { name:'GĐ5-T5 sửa 1 (I1): thẻ chèn tính từ đúng hợp âm vòng phát; lựa chọn hết hợp (bậc V thành 9sus4) thì bỏ chọn và báo; thẻ sáng = hợp âm đang phát', timeout: 30000, async fn() {
        const rowNames = j => [...document.querySelectorAll('#out .card .row')].filter(r => r.querySelector('[data-c]'))[j];
        const check = (p, what) => { const n = p.split(' ').length;
          document.querySelectorAll('.sug.sel').forEach(el => { if (!el.querySelector('[data-p]')) {   // "Không chèn" sáng: ô đó rỗng
              const i = +el.querySelector('[data-x]').dataset.x; eq(rowNames((i - 1 + n) % n).querySelectorAll('[data-c]').length, 1); return; }
            const i = +el.querySelector('[data-p]').dataset.p.split('-')[0];
            const want = el.querySelector('b').textContent.split(' – '), row = [...rowNames((i - 1 + n) % n).querySelectorAll('[data-c]')].map(x => x.textContent);
            ok(want.every(w => row.includes(w)), `${p} ${what}: thẻ sáng ${want} mà vòng phát ${row}`); });
          const orig = playSeq; let got = null; playSeq = s => { got = s; }; $('playNew').click(); playSeq = orig;
          const shown = [...document.querySelectorAll('#out [data-c]')].map(x => x.textContent);
          eq(got.slice(0, shown.length).map(x => x[0].name).join(' '), shown.join(' ')); };
        TABS.reharm(); $('keySel').value = ''; $('keySel').onchange();
        // ca của review: chọn G9sus4 trước C, rồi F#dim7 trước G → F#dim7 không phát được (G thành G9sus4) nên không được sáng
        $('pin').value = 'C Am F G'; click('#go'); click('[data-p="0-2"]');
        ok(!document.querySelector('[data-p="3-3"]'), 'G đã thành G9sus4 mà thẻ vẫn đưa F#dim7');
        click('#reset'); click('[data-p="3-3"]'); ok(document.querySelector('[data-p="3-3"]').closest('.sug').classList.contains('sel'), 'F#dim7 chưa sáng');
        ok([...document.querySelectorAll('#out [data-c]')].some(x => x.textContent === 'F#dim7'), 'F#dim7 không có trong vòng');
        click('[data-p="0-2"]'); ok(!document.querySelector('.sug.sel [data-p="3-3"]'), 'F#dim7 vẫn sáng sau khi G thành G9sus4');
        ok($('out').textContent.includes('không còn hợp với hợp âm bên cạnh'), 'không báo bỏ chọn'); check('C Am F G', '0-2 sau 3-3');
        for (const p of ['C Am F G', 'Bb Eb F Bb', 'Db Bbm Gb Ab', 'G Em C D', 'Cmaj7 C/E F G7']) {
          $('pin').value = p; click('#go'); const n = p.split(' ').length;
          const opts = [...document.querySelectorAll('[data-p]')].map(b => b.dataset.p).filter(x => +x.split('-')[1] >= 3);
          for (const ik of opts) { const i = +ik.split('-')[0];
            for (const j of [(i + 1) % n, (i - 1 + n) % n]) for (const q of [0, 1, 2]) for (const order of [0, 1]) {
              click('#go'); const a = order ? `${j}-${q}` : ik, b = order ? ik : `${j}-${q}`;
              if (!document.querySelector(`[data-p="${a}"]`)) continue; click(`[data-p="${a}"]`);
              if (!document.querySelector(`[data-p="${b}"]`)) continue; click(`[data-p="${b}"]`); check(p, `${a} rồi ${b}`); }
            await new Promise(r => setTimeout(r, 0)); } }
        $('pin').value = 'C Am F G'; click('#go'); } },
    { name:'GĐ5-T5 sửa 1 (I3): giọng Db ghi "Tự nhận: Db", vòng gõ Gb hiện Gb', fn() {
        TABS.reharm(); $('keySel').value = ''; $('keySel').onchange(); $('pin').value = 'Db Gb Ab Db'; click('#go');
        eq($('keySel').options[0].textContent, 'Tự nhận: Db'); ok($('out').textContent.includes('Giọng: Db trưởng'), $('out').textContent.slice(0, 80));
        ok([...document.querySelectorAll('[data-b^="1-"]')].some(b => b.textContent === 'Gbm6'), 'thiếu Gbm6'); ok(!/[A-G]#/.test($('out').textContent), 'có tên thăng');
        $('pin').value = 'Gb Ebm Abm Db'; click('#go'); eq($('keySel').options[0].textContent, 'Tự nhận: Gb');
        $('pin').value = 'C Am F G'; click('#go'); } },
    { name:'GĐ5-T6: kết (4 kiểu) không chọi sau vòng mới, với giọng chọn tay', timeout: 30000, fn() {
        const NEW = ['Cmaj7 Am7 Dm7 G7','Dm7 G7 Cmaj7 A7','C E7 Am F','F G Em Am','C/E F G C','Am7 D9 Gmaj7 E7(b9)','Bbmaj7 Gm7 Cm7 F7',
                     'C Bm7b5 E7 Am','Ebmaj7 Cm7 Fm7 Bb7','C Fm6 C G','Em Dm C G','C C F G','C G','F# D#m B C#'], bad = [];
        for (const p of NEW) { const cs = parseProg(p).chords;
          for (const sel of [null, (cs[0].root + 5) % 12]) { const key = reharmKey(cs, sel), bars = reharmAll(cs, cs.map(() => 0), [], undefined, key);
            ENDINGS.forEach(e => { const pl = endPlan(bars, endHome(cs, key, sel != null), e, { key, cs }), ch = [pl.body[pl.body.length - 1][0], ...pl.end.map(([c]) => c)];   // đúng chuỗi mà "▶ Nghe có kết" phát
              for (let i = 0; i + 1 < ch.length; i++) if (ch[i].name !== ch[i + 1].name && clashes(ch[i], ch[i + 1]).length) bad.push(`${p} [${sel}] ${e.label}: ${ch[i].name} → ${ch[i + 1].name} (${clashes(ch[i], ch[i + 1])})`); }); } }
        if (bad.length) throw [...new Set(bad)].slice(0, 6).join('; '); } },
    { name:'GĐ5-T6 sửa: A7 → G9sus4, G13 → Gmaj9, C9 → E7(b9) ở chỗ nối vòng với đoạn kết: bỏ hợp âm chèn cuối / đổi màu cùng họ, đủ số phách', fn() {
        for (const [p, e, want] of [['Dm7 G7 Cmaj7 A7', 3, 'A7 G9 Cmaj9'], ['C Fm6 C G', 0, null], ['F G Em Am', 1, null]]) {
          const cs = parseProg(p).chords, key = reharmKey(cs, null), bars = reharmAll(cs, cs.map(() => 0), [], undefined, key), E = ENDINGS[e], home = endHome(cs, key, false);
          const pl = endPlan(bars, home, E, { key, cs }), ch = [pl.body[pl.body.length - 1][0], ...pl.end.map(([c]) => c)];
          ch.forEach((x, i) => { if (i && x.name !== ch[i - 1].name) eq(clashes(ch[i - 1], x).join(), ''); });
          eq(pl.end.reduce((a, [, b]) => a + b, 0), E.make(home, nm).reduce((a, [, b]) => a + b, 0));
          eq(pl.end[pl.end.length - 1][0].root, home.root);
          if (want) eq(ch.map(c => c.name).join(' '), want); } } },
    // Rà đoạn kết (final review I1): vòng gõ × tự nhận + 7 giọng chọn tay × màu gốc và lựa chọn chèn ngẫu nhiên (bỏ lựa chọn không phát được như render) × 4 kiểu kết
    ...(() => {
      const PR = ['C Am F G','C G Am F','C F G C','Am F C G','C Em F G','Dm G C Am','F G Em Am','C Am Dm G','C E Am F','G D Em C','D A Bm G','Bb F Gm Eb',
                  'Cmaj7 Am7 Dm7 G7','Dm7 G7 Cmaj7 A7','C E7 Am F','C/E F G C','Am7 D9 Gmaj7 E7(b9)','Bbmaj7 Gm7 Cm7 F7','C Bm7b5 E7 Am','Ebmaj7 Cm7 Fm7 Bb7',
                  'C Fm6 C G','Em Dm C G','C G','F# D#m B C#','Gb Ebm Abm Db','Db Bbm Gb Ab','Ebm7 Ab7 Dbmaj7','F#m D E C#7','Eb Ab Bb Eb'], PARTS = 4;
      const part = async k => { const bad = []; let plans = 0, tl = Date.now();
        for (const p of PR.filter((_, i) => i % PARTS === k)) { const cs = parseProg(p).chords, n = cs.length, R = seededRng(p.length * 7 + 3);
          for (const sel of [null, 0, 2, 5, 7, 10, 3, 6]) { const key = reharmKey(cs, sel), home = endHome(cs, key, sel != null), O = colored(cs, [], undefined, key).opts;
            for (let r = 0; r < 120; r++) { if (Date.now() - tl > 40) { await new Promise(f => setTimeout(f, 0)); tl = Date.now(); }
              const bp = O.map(o => { const ix = o.map((x, q) => x ? q : -1).filter(q => q >= 0); return ix[Math.floor(R() * ix.length)]; }), last = R() < 0.5 ? undefined : Math.floor(R() * n);
              let RB = reharmAll(cs, cs.map(() => null), bp, last, key);
              const pk = RB.sugs.map(xs => { const ix = xs.map((x, q) => x ? q : -1).filter(q => q >= 0); return ix.length && R() < 0.8 ? ix[Math.floor(R() * ix.length)] : null; });
              RB = reharmAll(cs, pk, bp, last, key); pk.forEach((q, i) => { if (q != null && RB.used[i] !== q) pk[i] = null; }); RB = reharmAll(cs, pk, bp, last, key);
              ENDINGS.forEach(e => { plans++; const pl = endPlan(RB, home, e, { key, cs }), ch = [pl.body[pl.body.length - 1][0], ...pl.end.map(([c]) => c)];
                for (let i = 0; i + 1 < ch.length; i++) if (ch[i].name !== ch[i + 1].name && clashes(ch[i], ch[i + 1]).length && bad.length < 6)
                  bad.push(`${p} [${sel}] bp ${bp} chèn ${pk} ${e.label}: ${ch[i].name} → ${ch[i + 1].name} (${clashes(ch[i], ch[i + 1])})`);
                if (ch[ch.length - 1].root !== home.root && bad.length < 6) bad.push(`${p} [${sel}] ${e.label}: không về ${home.name}`);
                if (pl.end.reduce((a, [, b]) => a + b, 0) !== e.make(home, nm).reduce((a, [, b]) => a + b, 0) && bad.length < 6) bad.push(`${p} [${sel}] ${e.label}: sai số phách`); }); } } }
        if (bad.length) throw bad.join('; ');
        return `${plans} đoạn kết`; };
      return [...Array(PARTS).keys()].map(k => ({ name:`GĐ5 final I1: rà đoạn kết — giọng chọn tay, màu gốc và lựa chọn chèn người dùng chọn, 4 kiểu kết: không chọi, về đúng nhà, đủ phách (phần ${k + 1}/${PARTS})`, timeout: 30000, fn: () => part(k) }));
    })(),
    // GĐ5 M1: hợp âm chèn ô cuối dẫn về hợp âm đầu vòng (cs[0]); khi đoạn kết thay chỗ quay lại đầu vòng thì nó dẫn vào chỗ không có cs[0]
    { name:'CL-T2: đoạn kết: ô cuối không còn chèn dẫn về hợp âm đầu vòng; chỗ nối không chọi (12 giọng × 6 vòng × Không chèn ở ô cuối)', timeout: 30000, async fn() {
        const tr = (p, t) => p.split(' ').map(s => { const m = s.match(/^([A-G][b#]?)(.*)$/); return KEY12[(parseChord(m[1]).root + t) % 12] + m[2]; }).join(' ');
        const bad = []; let plans = 0;
        for (const p0 of ['C Am F G','Dm G C Am','F G Em Am','C F G C','Am Dm E7 Am','C Em F G']) for (let t = 0; t < 12; t++) {
          const p = tr(p0, t), cs = parseProg(p).chords, n = cs.length, key = reharmKey(cs, null), home = endHome(cs, key, false);
          for (const pk of [cs.map(() => null), cs.map((_, s) => s === 0 ? -1 : null)]) {
            const bars = reharmAll(cs, pk, [], undefined, key), tail = new Set(bars[n - 1].slot);
            ENDINGS.forEach(e => { plans++; const pl = endPlan(bars, home, e, { key, cs }), X = pl.body[pl.body.length - 1][0], e0 = pl.end[0][0];
              const ch = [X, ...pl.end.map(([c]) => c)], tag = `${p} chèn ${pk} ${e.label}`;
              // giữ được: cả ô chèn khi đoạn kết bắt đầu bằng đúng cs[0]; chỉ "chị" khi đoạn kết bắt đầu bằng đúng "mẹ" của ô cuối (ii–V–i)
              const me = bars[n - 1].slot[bars[n - 1].slot.length - 1];
              if (tail.has(X) && !(e0.root === cs[0].root && chordFamily(e0) === chordFamily(cs[0])) && !(X !== me && e0.root === me.root))
                bad.push(`${tag}: thân kết bằng ${X.name} (chèn dẫn về ${cs[0].name}) rồi vào ${e0.name}`);
              for (let i = 0; i + 1 < ch.length; i++) if (ch[i].name !== ch[i + 1].name && clashes(ch[i], ch[i + 1]).length)
                bad.push(`${tag}: ${ch[i].name} → ${ch[i + 1].name} (${clashes(ch[i], ch[i + 1])})`);
              if (pk[0] === -1 && bars[n - 1].slot.length) bad.push(`${tag}: Không chèn ở ô 0 mà ô cuối vẫn có ${bars[n - 1].slot.map(c => c.name)}`); }); }
          await new Promise(r => setTimeout(r, 0)); }
        // ý nhạc (final review M6): C F G C · Về chủ giữ "chị – mẹ" về C; Dm G C Am · Mẹ b9 giữ "chị" thành ii–V–i
        const plan = (p, e) => { const cs = parseProg(p).chords, key = reharmKey(cs, null), pl = endPlan(reharmAll(cs, cs.map(() => null), [], undefined, key), endHome(cs, key, false), ENDINGS[e], { key, cs });
          return [...pl.body.slice(-2), ...pl.end].map(([c]) => c.name).join(' '); };
        ok(plan('C F G C', 0) === 'Dm7 G9 Cmaj9', 'C F G C · Về chủ: ' + plan('C F G C', 0));
        ok(plan('Dm G C Am', 1) === 'Am7 Em7b5 A7(b9) Dm9', 'Dm G C Am · Mẹ b9: ' + plan('Dm G C Am', 1));
        if (bad.length) throw `${bad.length} lỗi: ` + bad.slice(0, 20).join('; ');
        return `${plans} đoạn kết`; } },
    { name:'GĐ5 final I2: đoạn kết viết tên theo giọng (Gbmaj9 ở Gb, C#7(b9) trước F#m, Gb13(#11) ở giọng F, Db ở giọng Db)', fn() {
      const E = (p, sel, e) => { const cs = parseProg(p).chords, key = reharmKey(cs, sel), bars = reharmAll(cs, cs.map(() => 0), [], undefined, key);
        return endPlan(bars, endHome(cs, key, sel != null), ENDINGS[e], { key, cs }).end.map(([c]) => c.name).join(' '); };
      for (let e = 0; e < 4; e++) { ok(!/F#|C#|G#/.test(E('Gb Ebm Abm Db', null, e)), E('Gb Ebm Abm Db', null, e)); ok(E('Gb Ebm Abm Db', null, e).endsWith('Gbmaj9') || /Gb(maj7|6\/9)?$/.test(E('Gb Ebm Abm Db', null, e)), E('Gb Ebm Abm Db', null, e));
        ok(!/Db|Gb|Ab/.test(E('F# D#m B C#', null, e)), E('F# D#m B C#', null, e)); ok(!/F#|C#|G#|D#|A#/.test(E('Db Bbm Gb Ab', null, e)), E('Db Bbm Gb Ab', null, e)); }
      eq(E('F# D#m B C#', null, 1).split(' ')[0].slice(0, 2), 'C#'); ok(E('F#m D E C#7', null, 1).startsWith('C#7(b9)'), E('F#m D E C#7', null, 1));
      ok(!/F#/.test(E('C Am F G', 5, 2)) && E('C Am F G', 5, 2).includes('Gb13(#11)'), E('C Am F G', 5, 2)); } },
    { name:'GĐ5-T6: Tái hoà âm vừa màn hình điện thoại (không tràn ngang khi đã chọn chèn và đổi màu)', fn() {
        TABS.reharm(); $('pin').value = 'Cmaj7 Am7 Dm7 G7(b9)'; click('#go');
        const k = Math.max(...[...document.querySelectorAll('[data-p^="0-"]')].map(b => +b.dataset.p.split('-')[1])); ok(k >= 3, 'thẻ đầu chỉ có lựa chọn ' + k);
        click(`[data-p="0-${k}"]`); click('[data-b="0-1"]');
        ok(document.documentElement.scrollWidth <= window.innerWidth + 1, `rộng ${document.documentElement.scrollWidth} > ${window.innerWidth}`);
        $('pin').value = 'C Am F G'; $('keySel').value = ''; $('keySel').onchange(); click('#go'); } },
  ];
  if (/[?&]test/.test(location.search)) {
    $('main').innerHTML = '<div class="card"><h3>Đang chạy test…</h3><p class="mut">Bộ test mất khoảng 30 giây trên máy tính, lâu hơn trên điện thoại (trang vẫn phản hồi trong lúc chạy).</p></div>';
    setTimeout(async () => {
      const r = [...await runTests(DOMTESTS), ...await runTests(TESTS)], bad = r.filter(x => !x.ok);
      TABS.learn();
      $('main').innerHTML = `<div class="card"><h3 class="${bad.length ? 'bad' : 'ok'}">Test: ${r.length - bad.length}/${r.length} đạt</h3>` +
        r.map(x => `<p>${x.ok ? '<span class="ok">✓</span>' : '<span class="bad">✗</span>'} ${x.name}${x.info ? ` <span class="mut">— ${x.info}</span>` : ''} <span class="mut">⏱ ${x.ms} ms</span></p>`).join('') + '</div>';
      document.title = `TEST ${r.length - bad.length}/${r.length}`;
    }, 50);
  }
}
