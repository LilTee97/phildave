a A7", "C/Bb có cùng bốn nốt với A7"], "answer": "Bass Bb báo trước nốt b9 của A7", "why": "Nốt b9 của A7 là Bb (A nhích lên nửa cung); bass Bb đứng trước nên tai đã nghe sẵn nốt này, rồi bass đi tiếp xuống A."}, {"q": "Câu \"입술의 모든 말\" có nốt giai điệu F trên hợp âm C. Thầy xử lý thế nào?", "choices": ["Đổi sang Dm trên bass C (Dm/C), vì Dm có nốt F", "Bỏ nốt F khỏi giai điệu", "Đổi sang G7 trên bass C", "Giữ C và thêm b9"], "answer": "Đổi sang Dm trên bass C (Dm/C), vì Dm có nốt F", "why": "F không thuộc hợp âm C; Dm có F và là hợp âm thay thế của F, nên đặt Dm trên bass C để nốt giai điệu nằm trên cùng."}, {"q": "Fm7 → Bb7 trông như II–V về Eb nhưng không về Eb. Vì sao vẫn nghe tự nhiên?", "choices": ["Vì đó là hợp âm mượn: tô màu, không bắt buộc giải quyết", "Vì Bb7 là \"bạn của mẹ\" của C", "Vì Fm7 là hợp âm trong giọng C", "Vì Eb là hợp âm chủ của bài"], "answer": "Vì đó là hợp âm mượn: tô màu, không bắt buộc giải quyết", "why": "Fm7 và Bb7 đều mượn từ C thứ; hợp âm mượn chỉ để tô màu nên không cần về Eb."}]},

  {"id": "p4-02", "part": 4, "src": "Phildave 4 · Bài 2", "title": "Át phụ, C#°7, G7+, cliché và \"bạn của mẹ\"", "teach": [{"text": "Secondary dominant 7 (세컨더리 도미넌트 쎄븐): ở chữ \"과 나의\", thầy đi G(sus4) – G7(9) – A7(b9), và A7(b9) là \"mẹ\" của Dm. G7 là hợp âm 7 gốc của giọng C; A7, D7, E7, B7 là hợp âm át phụ. Hợp âm treo (sus4) không đi chung với bậc 3: G(sus4) có C mà không có B, rồi giải quyết từ bậc 4 về bậc 3 (C xuống B); G7(9) chính là G9 ở P3, A7(b9) thầy bấm A2 G3 | Bb3 C#4 E4.", "tip": "A7(b9): nốt 7 là A lùi một cung (G), nốt b9 là A nhích lên nửa cung (Bb).", "keys": ["A2", "G3", "Bb3", "C#4", "E4"], "play": ["G(sus4)", "G7(9)", ["A2", "G3", "Bb3", "C#4", "E4"]]}, {"text": "Thay thế V7 thứ cấp (세컨더리 V7의 대리코드): F/G – C#°7 – Dm7, C#°7 thay cho A7 vì nó nằm sẵn trong A7(b9). F/G là hợp âm ba nốt F đặt dưới nốt giai điệu, nên nốt trên cùng quyết định màu nghe.", "tip": "Bấm C#dim7: tay trái C#, tay phải hợp âm Edim (E G Bb).", "play": ["F/G", "C#°7", "Dm7"]}, {"text": "Đảo V7 thứ cấp (세컨더리 V7의 전위): G/B – A/C#, bass đi liền bậc B lên C#. Đây là đảo hợp âm (inversion): G/B và A/C# là đảo 1, bậc 3 nằm ở bass. Đảo 1 của hợp âm trưởng thì tay phải tránh bấm lại bậc 3 (đã có ở bass), thay nốt đó bằng 9.", "tip": "Bậc 3 của hợp âm trưởng là nốt gốc đếm lên 3 tên nốt: G, A, B ra B, nên G/B có B ở bass.", "play": ["G/B", "A/C#"]}, {"text": "Augmented dominant (도미넌트쎄븐의 오그먼트): Dm7 – G7+, thầy bấm G2 F3 | B3 Eb4. G7+ là hợp âm 7 có bậc 5 nâng lên nửa cung, kiểu hợp âm tăng (augmented): D thành D#. Sổ tay viết Eb vì #5 và b13 là cùng một phím, chỉ khác tên (D# = Eb); nốt này căng, muốn đi tiếp lên.", "tip": "#5 là nốt 5 nhích lên nửa cung: G7 có D, nhích lên nửa cung là phím đen D#, cũng là Eb.", "keys": ["G2", "F3", "B3", "Eb4"], "compare": {"a": {"label": "Dm7 – G7", "play": ["Dm7", "G7"]}, "b": {"label": "Dm7 – G7+", "play": ["Dm7", ["G2", "F3", "|", "B3", "Eb4"]]}}}, {"text": "Cliché chromatic (반음씩 움직이는 클리셰): Dm – Dm(M7) – F/G – Fm/G. Nốt thấp nhất của tay phải rơi từng nửa cung (chromatic): D, C#, rồi C (nằm trong F/G); sau đó nốt trên cùng A xuống Ab là bước kết Amen. Dm(M7) là hợp âm thứ – 7 trưởng (minor-major 7): Dm thêm C#. Kiểu rơi này giống dòng đàn dây (string line) trong nhạc cổ điển: Dm – Dm(M7) – Dm7 – Dm6, gọi là cliché.", "tip": "Tay trái giữ D, tay phải giữ F A; chỉ một ngón đi xuống từng phím: D, C#, C, B. Nốt 7 của Dm(M7) là D lùi nửa cung (C#).", "compare": {"a": {"label": "Dm – Dm(M7) – F/G – Fm/G", "play": ["Dm", "Dm(M7)", "F/G", "Fm/G"]}, "b": {"label": "Dm – Dm(M7) – Dm7 – Dm6", "play": [["D2", "D4", "F4", "A4"], ["D2", "C#4", "F4", "A4"], ["D2", "C4", "F4", "A4"], ["D2", "B3", "F4", "A4"]]}}}, {"text": "SubV (도미넌트의 대리코드 썹파이브): Dm7 – Bb7(9 #11 13), thầy bấm Bb2 D3 | Ab3 C4 E4 G4. Bb7 là \"bạn của mẹ\" (subV) của E7, nên nó đi về Am, mà Am là hợp âm thay thế của C. Bb7(9 #11 13) là cách sổ tay ghi Bb13(#11) ở P3.", "tip": "Bb7(9 #11 13): tay phải hợp âm C, là hợp âm ba nốt cao hơn nốt gốc một cung (Bb lên một cung là C).", "keys": ["Bb2", "D3", "Ab3", "C4", "E4", "G4"], "play": ["Dm7", ["Bb2", "D3", "Ab3", "C4", "E4", "G4"], "Am"]}], "remember": ["Vào Dm: A7(b9) (\"mẹ\"), hoặc C#°7 nằm sẵn trong A7(b9); đảo 1 hợp âm trưởng thì thay bậc 3 ở tay phải bằng 9.", "G7+ = G7 nâng bậc 5 lên nửa cung: #5 và b13 cùng một phím (D# = Eb).", "Cliché: Dm – Dm(M7) – Dm7 – Dm6, một ngón đi xuống D, C#, C, B; Bb7(9 #11 13) đi về Am."], "items": [{"chord": "C#°7", "to": "Dm7", "prog": ["F/G", "C#°7", "Dm7"]}, {"chord": "Dm(M7)", "to": "Dm7", "rel": "line", "prog": ["Dm", "Dm(M7)", "Dm7", "Dm6"]}, {"chord": "Bb7(9 #11 13)", "to": "Am", "prog": ["Dm7", "Bb7(9 #11 13)", "Am"]}], "quiz": [{"q": "Vì sao C#°7 thay được A7 trước Dm7?", "choices": ["C#°7 nằm sẵn trong A7(b9): C#, E, G, Bb", "C#°7 là hợp âm trong giọng C", "C#°7 có cùng nốt gốc với A7", "C#°7 là \"bạn của mẹ\" của Dm7"], "answer": "C#°7 nằm sẵn trong A7(b9): C#, E, G, Bb", "why": "A7(b9) = A C# E G Bb; bỏ nốt A còn C# E G Bb, chính là C#°7, nên nó kéo về Dm7 như A7."}, {"q": "Sổ tay bấm G7+ là G F | B Eb. Vì sao viết Eb mà vẫn gọi là #5?", "choices": ["#5 (D#) và b13 (Eb) là cùng một phím, chỉ khác tên", "Eb là nốt 9 của G7", "Eb là nốt gốc của hợp âm", "Eb là bậc 3 của G7"], "answer": "#5 (D#) và b13 (Eb) là cùng một phím, chỉ khác tên", "why": "Nốt 5 của G7 là D; nhích lên nửa cung là phím đen D#, cũng là Eb, tức b13."}, {"q": "Bb7(9 #11 13) sau Dm7 đi về đâu, vì sao?", "choices": ["Về Am, vì Bb7 là \"bạn của mẹ\" của E7", "Về Eb, vì Bb7 là \"mẹ\" của Eb", "Về C, vì Bb7 là \"mẹ\" của C", "Về F, vì Bb7 có nốt F"], "answer": "Về Am, vì Bb7 là \"bạn của mẹ\" của E7", "why": "Bb7 chung tritone với E7 (\"bạn của mẹ\"), nên về cùng đích Am, hợp âm thay thế của C."}]},

  {"id": "p4-03", "part": 4, "src": "Phildave 4 · Bài 3", "title": "Đảo hợp âm trong giọng, Fm6 và Nashville IV", "teach": [{"text": "Đảo diatonic (다이어토닉의 전위): ở chữ \"이 주께\", thầy đi C – F/A – G/B, bass đi lên liền bậc A, B. Đảo 1 hợp âm trưởng thì bỏ bậc 3 bị nhân đôi ở tay phải, thêm 9: G/B thầy bấm B2 | G3 A3 D4. Hợp âm thứ thì được nhân đôi bậc 3.", "tip": "G/B: tay trái B, tay phải G A D; A là nốt 9 của G (G lên một cung).", "keys": ["B2", "G3", "A3", "D4"], "play": ["C", "F/A", ["B2", "G3", "A3", "D4"]]}, {"text": "Cliché & modal (클리셰와 모달): C – F#m7(b5) – Fm6. F#m7(b5) (F# A C E) chung ba nốt A, C, E với Am, mà Am là hợp âm thay thế của C; bass đi từng nửa cung F# xuống F, rồi Fm6 mượn từ C thứ. Fm6 là hợp âm thứ thêm 6 (minor 6): Fm (F Ab C) thêm D. Thầy còn giải thích thêm về âm bồi, cơ sở của hợp âm thay thế.", "tip": "Nốt 6 là nốt 5 lên một cung: Fm6 có C, lên một cung là D.", "keys": ["A3", "C4", "E4"], "play": ["C", "F#m7(b5)", "Fm6"]}, {"text": "Modal & pedal point (모달과 페달포인트): C/G – Fm6/G, bass G đứng yên (pedal point), tay phải đổi từ hợp âm C sang Fm6. Fm6 mượn từ C thứ, nên đây cũng là màu kết Amen, đặt trên bass G.", "tip": "Tay trái giữ G suốt; chỉ tay phải đổi hợp âm.", "keys": ["G2"], "play": ["C/G", "Fm6/G"]}, {"text": "Nashville IV maj7 (내슐빌 4도 메이저쎄븐): C/G – Dm7 – C/F. C/F (tay trái F, tay phải hợp âm C) chính là Fmaj7 bỏ bậc 3 (A); thầy gọi là Nashville IV. Khối âm này không gọi tên rõ theo hoà âm cổ điển nhưng rất đẹp, và thầy nói áp dụng được cho C, F, G.", "tip": "Tay phải là hợp âm trưởng của nốt 5: từ F đếm lên 5 tên nốt (F, G, A, Bb, C) ra C, nên bấm hợp âm C trên bass F.", "compare": {"a": {"label": "Fmaj7", "play": ["Fmaj7"]}, "b": {"label": "C/F (Nashville IV)", "play": ["C/F"]}}, "play": ["C/G", "Dm7", "C/F"]}], "remember": ["Đảo 1 hợp âm trưởng (F/A, G/B): bỏ bậc 3 bị nhân đôi, thay bằng 9; hợp âm thứ thì nhân đôi bậc 3 được.", "F#m7(b5) chung A, C, E với Am (hợp âm thay thế của C), bass F# xuống F vào Fm6; Fm6/G đặt trên bass G đứng yên.", "Nashville IV: C/F = Fmaj7 bỏ bậc 3, tay phải hợp âm C trên bass F."], "items": [{"chord": "F/A", "to": "G/B", "prog": ["C", "F/A", "G/B"]}, {"chord": "F#m7(b5)", "to": "C", "rel": "sub", "prog": ["C", "F#m7(b5)", "Fm6"], "why": "F#m7(b5) chung ba nốt A, C, E với Am, mà Am là hợp âm thay thế của C, nên đứng được ở chỗ C."}, {"chord": "C/F", "to": "F", "rel": "sub", "prog": ["C/G", "Dm7", "C/F"], "why": "C/F là Fmaj7 bỏ bậc 3 (A), vẫn giữ bass F, nên đứng được ở chỗ F."}], "quiz": [{"q": "Khi bấm G/B, vì sao tay phải không bấm thêm B?", "choices": ["B là bậc 3 đã nằm ở bass, nên thay nốt đó bằng 9 (A)", "B không thuộc hợp âm G", "B là nốt gốc của G/B", "Vì G/B là hợp âm thứ"], "answer": "B là bậc 3 đã nằm ở bass, nên thay nốt đó bằng 9 (A)", "why": "Đảo 1 hợp âm trưởng tránh nhân đôi bậc 3: B đã ở bass, tay phải bấm G A D, với A là nốt 9."}, {"q": "Vì sao F#m7(b5) thay được cho C hay Am?", "choices": ["Chung ba nốt A, C, E với Am", "Cùng nốt gốc với C", "F#m7(b5) là \"mẹ\" của C", "F#m7(b5) là hợp âm trong giọng C"], "answer": "Chung ba nốt A, C, E với Am", "why": "F#m7(b5) = F# A C E, chung A, C, E với Am; Am lại là hợp âm thay thế của C, nên F#m7(b5) đứng được ở chỗ của C."}, {"q": "C/F chính là hợp âm nào bỏ bậc 3?", "choices": ["Fmaj7", "F7", "Cmaj7", "Fm7"], "answer": "Fmaj7", "why": "C/F gồm F, C, E, G: nốt gốc F, bậc 5 C, bậc 7 E và nốt 9 G, tức Fmaj7 không có bậc 3 (A)."}]},

  {"id": "p4-04", "part": 4, "src": "Phildave 4 · Bài 4", "title": "Sus4, II–V về F và \"bạn của mẹ\" của C7", "teach": [{"text": "Sus4 (써스포): ở chữ \"를 원하\", thầy đi G(sus4) – G7. Thầy phát triển dần: sus4 → 9sus4 → thêm b9, và bản đủ màu thầy bấm G2 F3 | Ab3 B3 E4, tức G7(b9) có thêm nốt 13 (E). Treo trước rồi mới giải quyết thì câu có chỗ chờ, nghe có hướng hơn.", "tip": "Từ G(sus4) sang G7: đưa C xuống B, thêm F (G lùi một cung là F).", "keys": ["G2", "F3", "Ab3", "B3", "E4"], "play": ["G(sus4)", "G7", "G9sus4", ["G2", "F3", "Ab3", "B3", "E4"]]}, {"text": "Sus4 + modal (써스포 모달): G(sus4) – Bb7(9 #11 13). Bb7 ở đây có hai vai: vừa là \"bạn của mẹ\" (subV) của E7, vừa là hợp âm 7 trên bậc bVII mượn từ C thứ. Vì vậy nó vào được ngay sau chỗ treo mà vẫn nghe hợp lý.", "tip": "Bb7 mượn từ C thứ dễ nhận: nốt gốc Bb và nốt 7 Ab đều là phím đen không có trong giọng C.", "play": ["G(sus4)", "Bb7(9 #11 13)"]}, {"text": "II–V về bậc IV (4도를 위한 투파이브원): C – Gm7 – Bb/C, mục tiêu là đi vào F thật hay. Gm7 – C7 là \"chị\" và \"mẹ\" của F, và Bb/C chính là C7 9sus4 (C9sus4): hợp âm Bb trên bass C.", "tip": "Giống G9sus4 = F/G: tay phải là hợp âm trưởng của nốt gốc lùi một cung (C lùi một cung là Bb).", "play": ["C", "Gm7", "Bb/C", "F"]}, {"text": "SubV của C7 (C7의 썹파이브): C – Gm7 – Gb7(#11) – F. Gb7 thay C7 vì hai hợp âm chung tritone E–Bb; tìm bằng mẹo \"banana pineapple\": từ C đọc bảy âm tiết, mỗi âm tiết bấm một phím liền nhau, tính cả phím đen; âm tiết thứ bảy rơi vào Gb. Gb7(#11) là hợp âm 7 thêm #11; trong app nó được bấm đủ 9, #11, 13 như Gb13(#11) ở P3.", "tip": "Gb7(#11): tay phải hợp âm Ab, là hợp âm ba nốt cao hơn nốt gốc một cung (Gb lên một cung là Ab).", "compare": {"a": {"label": "Gm7 – C7 – F", "play": ["Gm7", "C7", "F"]}, "b": {"label": "Gm7 – Gb7(#11) – F", "play": ["Gm7", "Gb7(#11)", "F"]}}}, {"text": "Tiến hành đi qua đi lên (상행 경과적진행): C – Bb/D – C/E, bass đi lên C, D, E. Thầy dặn nốt trên cùng (nốt giai điệu) nên được đánh cùng hợp âm: giai điệu và hợp âm vang cùng nhau tạo ra màu mà tên hợp âm không ghi hết.", "tip": "Bb/D: tay trái D, tay phải Bb C F; C/E: tay trái E, tay phải C D G. Bass đã có bậc 3 nên tay phải thay nốt đó bằng 9 (nốt gốc lên một cung).", "play": ["C", "Bb/D", "C/E"]}], "remember": ["Sus4 → 9sus4 → thêm b9: G(sus4) treo, đưa C xuống B là về G7.", "Đi vào F: C – Gm7 – Bb/C (Bb/C = C9sus4), hoặc Gm7 – Gb7(#11) (\"bạn của mẹ\" của C7, chung tritone E–Bb).", "Đánh nốt trên cùng cùng với hợp âm: C – Bb/D – C/E, bass đi lên liền bậc."], "items": [{"chord": "G(sus4)", "to": "G7", "rel": "line", "prog": ["G(sus4)", "G7"]}, {"chord": "Gb7(#11)", "to": "F", "prog": ["C", "Gm7", "Gb7(#11)", "F"]}, {"chord": "Bb/D", "to": "C/E", "prog": ["C", "Bb/D", "C/E"]}], "quiz": [{"q": "Vì sao Gb7 thay được C7 để đi vào F?", "choices": ["Hai hợp âm chung tritone E–Bb", "Hai hợp âm chung nốt gốc", "Gb nằm trong giọng C", "Gb7 là hợp âm thứ"], "answer": "Hai hợp âm chung tritone E–Bb", "why": "Bậc 3 và 7 của C7 là E và Bb; của Gb7 là Bb và Fb (tức E): cùng tritone nên cùng kéo về F."}, {"q": "Bb/C là hợp âm nào viết theo cách khác?", "choices": ["C9sus4 (C7 9sus4)", "Bbmaj7", "C7(b9)", "Cm7"], "answer": "C9sus4 (C7 9sus4)", "why": "Hợp âm Bb (Bb D F) trên bass C: Bb là nốt 7, D là 9, F là 4 của C, đúng C9sus4, giống F/G = G9sus4."}, {"q": "Bb7 sau G(sus4) được thầy giải thích thế nào?", "choices": ["Vừa là \"bạn của mẹ\" của E7, vừa là hợp âm mượn từ C thứ", "Là \"mẹ\" của Eb", "Là hợp âm trong giọng C", "Là hợp âm giảm đi qua"], "answer": "Vừa là \"bạn của mẹ\" của E7, vừa là hợp âm mượn từ C thứ", "why": "Bb7 chung tritone với E7 nên là \"bạn của mẹ\" của E7; nó cũng là hợp âm bậc bVII của C thứ, mượn sang giọng C."}]},

  {"id": "p4-05", "part": 4, "src": "Phildave 4 · Bài 5", "title": "Ba cách vào Dm7(9): thay thế, nốt màu, Db7", "teach": [{"text": "Hợp âm thay thế diatonic (다이어토닉 대리코드): ở chữ \"이 되신\", thầy có ba cách phối, cách nào cũng đi vào hợp âm đích Dm7(9) (tức Dm9). Cách 1: Fmaj7 – C/E – Dm7(9) – G7(#5); sổ tay ghi FM7, chính là Fmaj7, còn G7(#5) là G7+ ở bài 2. Chỗ 2 ô nhịp đứng một hợp âm thì phải đổi hợp âm để tạo điểm nhấn nhịp, chứ không chỉ thêm tiết tấu.", "tip": "C/E đứng giữa Fmaj7 và Dm7(9) cho bass đi xuống liền bậc F, E, D.", "play": ["Fmaj7", "C/E", "Dm7(9)", "G7(#5)"]}, {"text": "Tension của dominant 7 (도미넌트쎄븐의 텐션): Fmaj7 – A7(b13 #9) – Dm7(9) – G7(9 #11 13). A7 về Dm là hợp âm thứ nên dùng màu biến đổi; A7(b13 #9) chính là A7(#9 b13) ở P3. G7(9 #11 13) dựng bằng hợp âm ba nốt phía trên (upper structure): tay trái G7 (G2 F3 B3), tay phải hợp âm A (C# E A).", "tip": "G7(9 #11 13): tay phải hợp âm A, là hợp âm ba nốt cao hơn nốt gốc một cung (G lên một cung là A).", "keys": ["G2", "F3", "B3", "C#4", "E4", "A4"], "play": ["Fmaj7", "A7(b13 #9)", "Dm7(9)", ["G2", "F3", "B3", "C#4", "E4", "A4"]]}, {"text": "Hợp âm thay thế dominant (도미넌트의 대리코드): Fmaj7 – D#°7 – Dm7(9) – Db7(9 #11 13) – C. Db7 thay G7 vì bậc 3 và 7 của Db7 (F, Cb tức B) chính là bậc 7 và 3 của G7; D#°7 (D#dim7) cho bass đi xuống nửa cung vào D. Thầy cũng nhắc: piano không bắt buộc đánh nốt giai điệu, ca sĩ hát còn piano lo hợp âm.", "tip": "Db7(9 #11 13): tay phải hợp âm Eb, là hợp âm ba nốt cao hơn nốt gốc một cung (Db lên một cung là Eb).", "compare": {"a": {"label": "G7 → C", "play": ["G7", "C"]}, "b": {"label": "Db7(9 #11 13) → C", "play": ["Db7(9 #11 13)", "C"]}}, "play": ["Fmaj7", "D#°7", "Dm7(9)", "Db7(9 #11 13)", "C"]}], "remember": ["Một hợp âm đứng 2 ô nhịp thì đổi hợp âm để có điểm nhấn (Fmaj7 – C/E – Dm7(9)).", "Về Dm7(9): A7(b13 #9) màu biến đổi; G7(9 #11 13) = tay trái G7 + tay phải hợp âm A.", "Db7 thay G7: bậc 3, 7 của Db7 là bậc 7, 3 của G7; piano không bắt buộc đánh giai điệu."], "items": [{"chord": "A7(b13 #9)", "to": "Dm7(9)", "prog": ["Fmaj7", "A7(b13 #9)", "Dm7(9)", "G7(9 #11 13)"]}, {"chord": "Db7(9 #11 13)", "to": "C", "prog": ["Fmaj7", "D#°7", "Dm7(9)", "Db7(9 #11 13)", "C"]}, {"chord": "C/E", "to": "Dm7(9)", "prog": ["Fmaj7", "C/E", "Dm7(9)", "G7(#5)"]}], "quiz": [{"q": "G7(9 #11 13) theo sổ tay bấm thế nào?", "choices": ["Tay trái G7 (G F B), tay phải hợp âm A", "Tay trái G, tay phải hợp âm F", "Tay trái G7, tay phải hợp âm Db", "Tay trái G B, tay phải hợp âm Dm"], "answer": "Tay trái G7 (G F B), tay phải hợp âm A", "why": "Hợp âm A (C# E A) trên G7 cho đủ 9 (A), #11 (C#), 13 (E)."}, {"q": "Chỗ một hợp âm đứng 2 ô nhịp, thầy làm gì?", "choices": ["Đổi hợp âm để tạo điểm nhấn nhịp", "Chỉ thêm tiết tấu", "Đánh to hơn", "Để trống cho ca sĩ"], "answer": "Đổi hợp âm để tạo điểm nhấn nhịp", "why": "Thầy dặn phải đổi hợp âm (như Fmaj7 – C/E), chứ không chỉ thêm tiết tấu."}]},

  {"id": "p4-06", "part": 4, "src": "Phildave 4 · Bài 6", "title": "Chèn hợp âm giữa C, Am, F", "teach": [{"text": "Passing progression + 9sus4 (경과적진행과 나인써스포): ở chữ \"주 반석\", thầy đi C – G/B – Am7(9) – Bb/C – F. C, Am, F là hợp âm trong giọng C; giữa chúng có thể chèn hợp âm đẹp. G/B cho bass đi xuống C, B, A vào Am7(9) (tức Am9), còn Bb/C (C9sus4, bài 4) dẫn vào F.", "tip": "Bb/C: tay trái C, tay phải hợp âm Bb, là hợp âm trưởng của nốt gốc lùi một cung (C lùi một cung là Bb).", "compare": {"a": {"label": "C – Am – F", "play": ["C", "Am", "F"]}, "b": {"label": "C – G/B – Am7(9) – Bb/C – F", "play": ["C", "G/B", "Am7(9)", "Bb/C", "F"]}}}, {"text": "Dominant 7 trước hợp âm đích (목적지앞에 도미넌트쎄븐을): C – E7(b13 #9) – Am7(9) – A7(b13 #9) – F. E7 là \"mẹ\" của Am; A7 lẽ ra về Dm nhưng lại đi về F. Được, vì Dm và F cùng họ thay thế.", "tip": "E7(b13 #9) dễ bấm: tay trái E G# D, tay phải hợp âm C (C E G).", "play": ["C", "E7(b13 #9)", "Am7(9)", "A7(b13 #9)", "F"]}, {"text": "SubV + altered tension (썹파이브와 얼터드텐션): C – Bb7(9 #11 13) – Am7(9) – Eb7(9 #11 13). Đổi hai hợp âm 7 ở màn trước thành \"bạn của mẹ\": Bb7 thay E7 (về Am), Eb7 thay A7. Màu 9, #11, 13 trên \"bạn của mẹ\" nghe đúng như màu biến đổi của \"mẹ\": C và G trên Bb7 chính là b13 và #9 của E7, nên tên mục gọi là altered tension.", "tip": "Tay phải là hợp âm ba nốt cao hơn nốt gốc một cung: Bb7 bấm hợp âm C, Eb7 bấm hợp âm F.", "compare": {"a": {"label": "\"Mẹ\": E7, A7", "play": ["C", "E7(b13 #9)", "Am7(9)", "A7(b13 #9)"]}, "b": {"label": "\"Bạn của mẹ\": Bb7, Eb7", "play": ["C", "Bb7(9 #11 13)", "Am7(9)", "Eb7(9 #11 13)"]}}}], "remember": ["Giữa các hợp âm trong giọng C, Am, F có thể chèn hợp âm: G/B nối C xuống Am, Bb/C dẫn vào F.", "Trước Am7(9): E7(b13 #9) (\"mẹ\", màu biến đổi) hoặc Bb7(9 #11 13) (\"bạn của mẹ\").", "A7 về F vẫn được, vì Dm và F cùng họ thay thế."], "items": [{"chord": "E7(b13 #9)", "to": "Am7(9)", "prog": ["C", "E7(b13 #9)", "Am7(9)", "A7(b13 #9)"]}, {"chord": "Bb7(9 #11 13)", "to": "Am7(9)", "prog": ["C", "Bb7(9 #11 13)", "Am7(9)", "Eb7(9 #11 13)"]}, {"chord": "Bb/C", "to": "F", "prog": ["C", "G/B", "Am7(9)", "Bb/C", "F"]}], "quiz": [{"q": "A7 lẽ ra về Dm, vì sao đi về F vẫn được?", "choices": ["Dm và F cùng họ thay thế", "A7 là \"mẹ\" của F", "F là hợp âm thứ", "A7 có nốt F"], "answer": "Dm và F cùng họ thay thế", "why": "Dm (D F A) và F (F A C) chung F và A, nên F đứng được ở chỗ của Dm."}, {"q": "Eb7(9 #11 13) là \"bạn của mẹ\" của hợp âm nào?", "choices": ["A7", "E7", "Bb7", "G7"], "answer": "A7", "why": "Eb7 chung tritone với A7 và cùng về Dm; đích Dm nhích lên nửa cung là Eb."}]},

  {"id": "p4-07", "part": 4, "src": "Phildave 4 · Bài 7", "title": "Giảm đi qua, G7(13) và giai điệu riêng", "teach": [{"text": "Diminished (디미니쉬): Fmaj7 – F#°7 – G, bass đi từng nửa cung F, F#, G. F#°7 (F#dim7) là hợp âm giảm đi qua: nốt gốc là G lùi nửa cung, nên kéo lên G rất tự nhiên.", "tip": "Bấm F#dim7: tay trái F#, tay phải hợp âm Adim (A C Eb).", "play": ["Fmaj7", "F#°7", "G"]}, {"text": "Passing progression (경과적진행): Fmaj7 – C/E – Dm7 – G7(13) – C, bass đi xuống F, E, D rồi sang G. G7(13) chính là G13 ở P3. Chỉ cần nốt 13 tự nhiên, với quãng 4 đúng giữa bậc 3 (B) và nốt 13 (E) nghe hơi \"gai gai\", là đã rất jazz.", "tip": "Nốt 13 là nốt 6 tính từ nốt gốc, đặt cao lên: G, A, B, C, D, E ra E.", "keys": ["G2", "F3", "B3", "E4"], "compare": {"a": {"label": "G7 → C", "play": ["Fmaj7", "C/E", "Dm7", "G7", "C"]}, "b": {"label": "G7(13) → C", "play": ["Fmaj7", "C/E", "Dm7", ["G2", "F3", "B3", "E4"], "C"]}}}, {"text": "Dominant & subV (도미넌트와 썹파이브): Fmaj7 – B7 – Dm7(9) – Db7(9 #11 13) – C, Db7 là \"bạn của mẹ\" của C. Thầy dặn: nếu không đánh giai điệu gốc thì piano phải có giai điệu riêng đẹp. Ví dụ của thầy: trên bản nhạc có hai nốt Bb và Ab; thầy nối chúng bằng một cây cầu giai điệu đi từng bậc, Bb – A – Ab, gọi là nốt nối (approach note).", "tip": "Bb và Ab cách nhau một cung; phím A nằm ngay giữa, nên đi Bb → A → Ab là liền từng phím.", "compare": {"a": {"label": "Giai điệu nối: Bb – A – Ab", "play": [["Bb4"], ["A4"], ["Ab4"]]}, "b": {"label": "Cả tiến hành", "play": ["Fmaj7", "B7", "Dm7(9)", "Db7(9 #11 13)", "C"]}}}], "remember": ["Hợp âm giảm đi qua: F#°7 nối Fmaj7 lên G, bass F, F#, G.", "Chỉ cần nốt 13 tự nhiên (G7(13) = G13) là đã rất jazz.", "Không đánh giai điệu gốc thì tay phải phải có giai điệu riêng đẹp."], "items": [{"chord": "F#°7", "to": "G", "prog": ["Fmaj7", "F#°7", "G"]}, {"chord": "G7(13)", "to": "C", "prog": ["Fmaj7", "C/E", "Dm7", "G7(13)", "C"]}, {"chord": "Db7(9 #11 13)", "to": "C", "prog": ["Fmaj7", "B7", "Dm7(9)", "Db7(9 #11 13)", "C"]}], "quiz": [{"q": "Vì sao F#°7 đặt được giữa Fmaj7 và G?", "choices": ["Bass đi từng nửa cung F, F#, G và F#°7 kéo lên G", "F#°7 là hợp âm trong giọng C", "F#°7 có cùng nốt gốc với G", "F#°7 là \"bạn của mẹ\" của G"], "answer": "Bass đi từng nửa cung F, F#, G và F#°7 kéo lên G", "why": "F#°7 là hợp âm giảm đi qua: nốt gốc F# là G lùi nửa cung, nên kéo lên G."}, {"q": "Nếu piano không đánh giai điệu gốc thì thầy dặn gì?", "choices": ["Tay phải phải có một giai điệu riêng đẹp", "Chỉ đánh nốt bass", "Đánh to hơn ca sĩ", "Bỏ hết nốt màu"], "answer": "Tay phải phải có một giai điệu riêng đẹp", "why": "Piano không đánh giai điệu gốc thì phải tự có đường nốt riêng, như cây cầu giai điệu Bb – A – Ab."}]},

  {"id": "p4-08", "part": 4, "src": "Phildave 4 · Bài 8", "title": "Chia hợp âm dài, \"chị\" và hợp âm mượn kiểu 2", "teach": [{"text": "Đảo Amen cadence (아멘종지의 전위): ở chữ \"주 나의\", bản gốc 8 phách chỉ có G7sus4, đứng lâu quá nên cần chia ra. Thầy đi G(sus4) – Dm7 – Fm/Ab: Dm7 là \"chị\" của G7, nên chen vào chỗ G đứng lâu được; Fm/Ab là Fm đảo 1 (bass Ab), một kết Amen đảo, mượn từ C thứ.", "tip": "Fm/Ab: tay trái Ab, tay phải hợp âm Fm (F Ab C).", "compare": {"a": {"label": "Bản gốc: G7sus4 cả 8 phách", "play": [["G2", "F3", "C4", "D4"]]}, "b": {"label": "Chia ra: G(sus4) – Dm7 – Fm/Ab", "play": ["G(sus4)", "Dm7", "Fm/Ab"]}}}, {"text": "Related II minor (릴레이티드 투마이너): G(sus4) – Abm7 – Db7(9 #11 13) – F/G. Mọi hợp âm 7 đều có một II thứ đi kèm (\"chị\"), kéo ra dùng bất cứ lúc nào; ở đây Abm7 là \"chị\" của Db7. Db7 không về C mà đi sang F/G, chỗ G treo tiếp.", "tip": "Tìm \"chị\": từ nốt gốc của \"mẹ\" đếm lên 5 tên nốt, Db, Eb, F, Gb, Ab ra Abm7.", "play": ["G(sus4)", "Abm7", "Db7(9 #11 13)", "F/G"]}, {"text": "Modal interchange kiểu 2 (모달인터체인지): Ebmaj7 – Abmaj7 – Dbmaj7 – F/G. Ebmaj7 và Abmaj7 lấy từ C thứ tự nhiên, Dbmaj7 lấy từ âm giai thứ có Db (C Phrygian); thầy nói còn mượn được cả từ thứ hoà âm (harmonic minor) và thứ giai điệu (jazz minor). Ebmaj7 nghe hợp vì bậc 3 (G) và bậc 7 (D) của nó nằm trong giọng C.", "tip": "Nốt 7 của maj7 là nốt gốc lùi nửa cung: Eb lùi nửa cung là D.", "keys": ["G4", "D5"], "play": ["Ebmaj7", "Abmaj7", "Dbmaj7", "F/G"]}], "remember": ["Hợp âm đứng lâu (8 phách G7sus4) thì chia ra: G(sus4) – Dm7 – Fm/Ab.", "Hợp âm 7 nào cũng có \"chị\" đi kèm: Abm7 – Db7.", "Ebmaj7, Abmaj7, Dbmaj7 là hợp âm mượn; Ebmaj7 có bậc 3, 7 (G, D) nằm trong giọng C."], "items": [{"chord": "Abm7", "to": "Db7(9 #11 13)", "prog": ["G(sus4)", "Abm7", "Db7(9 #11 13)", "F/G"]}, {"chord": "Dbmaj7", "rel": "modal", "prog": ["Ebmaj7", "Abmaj7", "Dbmaj7", "F/G"]}], "quiz": [{"q": "Vì sao Ebmaj7 nghe hợp trong bài giọng C?", "choices": ["Bậc 3 (G) và bậc 7 (D) của nó nằm trong giọng C", "Nốt gốc Eb nằm trong giọng C", "Nó là \"mẹ\" của C", "Nó là hợp âm giảm đi qua"], "answer": "Bậc 3 (G) và bậc 7 (D) của nó nằm trong giọng C", "why": "Ebmaj7 = Eb G Bb D; hai nốt định hướng G và D đều là phím trắng của giọng C."}, {"q": "Abm7 đứng trước Db7 là gì của Db7?", "choices": ["\"Chị\" (II liên quan)", "\"Mẹ\"", "\"Bạn của mẹ\"", "Hợp âm giảm đi qua"], "answer": "\"Chị\" (II liên quan)", "why": "Coi Db7 là bậc V thì Abm7 nằm ở bậc II: từ Db đếm lên 5 tên nốt ra Ab."}]},

  {"id": "p4-09", "part": 4, "src": "Phildave 4 · Bài 9", "title": "Thực chiến: phối cả bài \"Mọi lời trên môi con\"", "teach": [{"text": "Phối cả bài \"입술의 모든 말\" (Mọi lời trên môi con), thầy dùng hai cách tiến hành lớn: tiến hành đi qua (bass liền bậc nối C, Am, F) và hợp âm 7 trước đích. Hai cách kết hợp được, ví dụ C – E7/B – Am: bass đi liền bậc C, B, A, mà E7 lại là \"mẹ\" của Am.", "tip": "E7/B giữ được bass B vì B có sẵn trong E7 (E G# B D).", "compare": {"a": {"label": "C – Am", "play": ["C", "Am"]}, "b": {"label": "C – E7/B – Am", "play": ["C", "E7/B", "Am"]}}}, {"text": "Đầu bài dùng hợp âm trong giọng đơn giản, càng về sau càng phức tạp; ô nhịp 17–20 có số hợp âm gấp đôi lần đầu. Cùng một chỗ lặp lại thì phải đổi màu hợp âm, như câu \"입술의 모든 말\" ở bài 1.", "compare": {"a": {"label": "Lần đầu: Dm/C", "play": ["C", "Dm/C", "C"]}, "b": {"label": "Lặp lại: Dm7(b5)/C", "play": ["C", ["C2", "C3", "Ab3", "D4", "F4"], "C"]}}}, {"text": "F#m7(b5) cùng họ với Am, vì có ba nốt A, C, E của Am, mà Am là hợp âm thay thế của C. Sau F#m7(b5), bass không bắt buộc về C: bass F# đi lên nửa cung về G (C/G) cũng được.", "tip": "F#m7(b5) = F# A C E: bỏ F# là còn đúng hợp âm Am.", "keys": ["A3", "C4", "E4"], "compare": {"a": {"label": "F#m7(b5) → C", "play": ["F#m7(b5)", "C"]}, "b": {"label": "F#m7(b5) → C/G", "play": ["F#m7(b5)", "C/G"]}}}, {"text": "Hợp âm 7 không cần nốt gốc, chỉ cần bậc 3 và bậc 7. Hai nốt này là tritone, quyết định hợp âm, nên một mình chúng đã kéo về đích.", "tip": "E7: bậc 3 là G#, bậc 7 là E lùi một cung (D).", "keys": ["G#3", "D4"], "compare": {"a": {"label": "E7 → Am", "play": ["E7", "Am"]}, "b": {"label": "Chỉ G# và D → Am", "play": [["G#3", "D4"], "Am"]}}}, {"text": "Bb7 trước C là hợp âm mượn (modal) từ C thứ, không phải \"bạn của mẹ\" (subV) của E7. \"Bạn của mẹ\" của E7 phải đi về Am, còn ở đây Bb7 đi thẳng về C.", "tip": "Nhìn hợp âm đứng sau: Bb7 → Am là \"bạn của mẹ\", Bb7 → C là hợp âm mượn.", "compare": {"a": {"label": "Bb7 → C (mượn)", "play": ["Bb7", "C"]}, "b": {"label": "Bb7 → Am (\"bạn của mẹ\" của E7)", "play": ["Bb7", "Am"]}}}, {"text": "Đoạn kết (ending) chơi tự do. Thầy khuyên viết ra giấy các phương án cho từng ô nhịp, rồi chọn; ví dụ cùng chữ \"나의\" có thể là F/G – G7(b9) – C hoặc F/G – Fm/G.", "compare": {"a": {"label": "Phương án 1", "play": ["F/G", "G7(b9)", "C"]}, "b": {"label": "Phương án 2", "play": ["F/G", "Fm/G"]}}}], "remember": ["Hai đường lớn: tiến hành đi qua (bass liền bậc) và hợp âm 7 trước đích; kết hợp được: C – E7/B – Am.", "Đầu bài đơn giản, về sau phức tạp; chỗ lặp lại phải đổi màu; viết ra giấy phương án cho từng ô nhịp.", "Hợp âm 7 chỉ cần bậc 3 và 7; Bb7 trước C là hợp âm mượn, không phải \"bạn của mẹ\" của E7."], "items": [{"chord": "E7/B", "to": "Am", "prog": ["C", "E7/B", "Am"]}, {"chord": "Bb7", "rel": "modal", "prog": ["Bb7", "C"]}], "quiz": [{"q": "Bb7 đứng ngay trước C trong bài là gì?", "choices": ["Hợp âm mượn từ C thứ", "\"Bạn của mẹ\" của E7", "\"Mẹ\" của C", "Hợp âm trong giọng C"], "answer": "Hợp âm mượn từ C thứ", "why": "\"Bạn của mẹ\" của E7 phải về Am; Bb7 đi về C nên đây là hợp âm mượn từ C thứ."}, {"q": "Khi đệm hợp âm 7, piano cần giữ những nốt nào?", "choices": ["Bậc 3 và bậc 7", "Nốt gốc và bậc 5", "Chỉ nốt gốc", "Bậc 5 và nốt 9"], "answer": "Bậc 3 và bậc 7", "why": "Bậc 3 và 7 là tritone quyết định hợp âm 7; nốt gốc có thể bỏ."}, {"q": "C – E7/B – Am kết hợp hai cách nào?", "choices": ["Bass đi liền bậc và hợp âm 7 trước đích", "Hợp âm mượn và hợp âm giảm", "Hai hợp âm treo liền nhau", "\"Bạn của mẹ\" và \"chị\""], "answer": "Bass đi liền bậc và hợp âm 7 trước đích", "why": "Bass C, B, A đi liền bậc (tiến hành đi qua), và E7 là \"mẹ\" của Am."}]},

  {"id": "p4-10", "part": 4, "src": "Phildave 4 · Bài 10", "title": "C#°7, A7 treo và Eb7: các đường vào Dm7", "teach": [{"text": "Gốc của diminished (디미니쉬의 원형을 알자): phần 2 là bài \"사랑하는 나의 아버지\" (Cha yêu dấu của con), giọng C. Ở chữ \"Yêu dấu…\", thầy đi C – C#°7 – Dm7: C#°7 là cây cầu nối hai hợp âm trong giọng C và Dm7, hợp âm đích của câu. Dạng gốc của C#°7 là A7: A7(b9) bỏ nốt gốc A còn C# E G Bb, nên chỗ này chơi A7 cũng được. C#dim7, Edim7, Gdim7, Bbdim7 là cùng một họ, cùng một âm thanh; còn m7(b5) (nửa giảm) là hợp âm khác hẳn.", "tip": "C#dim7, Edim7, Gdim7, Bbdim7 bấm chung bốn phím C# E G Bb, chỉ đổi nốt nằm dưới.", "compare": {"a": {"label": "C – C#°7 – Dm7", "play": ["C", "C#°7", "Dm7"]}, "b": {"label": "C – A7(b9) – Dm7", "play": ["C", "A7(b9)", "Dm7"]}}}, {"text": "Các hợp âm thay thế dominant (도미넌트의 대리코드들): A7 trước Dm7 làm được rất nhiều kiểu: A7(b9), A7 có #9 và b13, hay A7sus4 rồi giải quyết. Khi giải quyết A7sus4, mỗi nốt treo đi xuống một bước: bậc 4 về 3, bậc 8 (nốt gốc ở trên) về 7, nốt 9 về b9. Ba nốt cùng đi xuống một bước (A xuống G một cung, B xuống Bb và D xuống C# nửa cung) nên vào A7(b9) rất mượt, rồi về Dm7.", "tip": "Tay phải A B D đi xuống G Bb C#: A xuống G (8 về 7), B xuống Bb (9 về b9), D xuống C# (4 về 3).", "keys": ["A2", "A3", "B3", "D4"], "play": ["C", ["A2", "A3", "B3", "D4"], ["A2", "G3", "Bb3", "C#4"], "Dm7"]}, {"text": "9sus4 và giải quyết (나인써스포와 해결): C – G/A – A7(b9) – Dm7 – Dm(M7). G/A chính là A7 9sus4, giống F/G là G7 9sus4; treo trước rồi mới giải quyết về A7(b9) thì câu có chỗ chờ. Sau Dm7, thầy thêm Dm(M7): hợp âm thứ – 7 trưởng dùng được cho mọi hợp âm thứ, kể cả trong giọng thứ.", "tip": "G/A: tay trái A, tay phải hợp âm G (A lùi một cung là G).", "play": ["C", "G/A", "A7(b9)", "Dm7", "Dm(M7)"]}, {"text": "Hai cách hiểu (두가지 경우의 해석): C – Eb7 – Dm7 – Dm(M7). Chỗ trước Dm7 hiểu được hai cách: A7 là \"mẹ\" của Dm, còn Eb7 là \"bạn của mẹ\" của A7 (thầy gọi là secondary substitute dominant), vì hai hợp âm chung tritone C#–G. Màu đúng cho Eb7 là hợp âm F đặt trên Eb7, cho đủ 9, #11, 13.", "tip": "Eb7: tay trái Eb Db G (nốt gốc, 7, 3), tay phải hợp âm F, là hợp âm ba nốt cao hơn nốt gốc một cung (Eb lên một cung là F).", "keys": ["Eb2", "Db3", "G3", "F4", "A4", "C5"], "compare": {"a": {"label": "C – A7 – Dm7", "play": ["C", "A7", "Dm7"]}, "b": {"label": "C – Eb7 – Dm7 – Dm(M7)", "play": ["C", ["Eb2", "Db3", "G3", "F4", "A4", "C5"], "Dm7", "Dm(M7)"]}}}], "remember": ["Vào Dm7: C#°7 (nằm sẵn trong A7(b9)), A7, hoặc Eb7 (\"bạn của mẹ\" của A7, tay phải hợp âm F).", "A7sus4 giải quyết: bậc 4 về 3, 8 về 7, 9 về b9; G/A là A7 9sus4.", "C#dim7, Edim7, Gdim7, Bbdim7 cùng bốn phím; Dm(M7) dùng được cho mọi hợp âm thứ."], "items": [{"chord": "C#°7", "to": "Dm7", "prog": ["C", "C#°7", "Dm7"]}, {"chord": "G/A", "to": "A7(b9)", "rel": "line", "prog": ["C", "G/A", "A7(b9)", "Dm7", "Dm(M7)"]}, {"chord": "Eb7", "to": "Dm7", "prog": ["C", "Eb7", "Dm7", "Dm(M7)"]}], "quiz": [{"q": "Khi giải quyết A7sus4 về A7(b9), các nốt treo đi thế nào?", "choices": ["Bậc 4 về 3, 8 về 7, 9 về b9", "Bậc 4 lên 5, 9 lên 3", "Chỉ đổi nốt bass", "Bậc 3 lên bậc 4"], "answer": "Bậc 4 về 3, 8 về 7, 9 về b9", "why": "Mỗi nốt đi xuống một bước: D về C# (4 về 3), A về G (8 về 7), B về Bb (9 về b9)."}, {"q": "Eb7 trước Dm7 lấy màu đúng bằng cách nào?", "choices": ["Tay phải hợp âm F trên Eb7, cho đủ 9, #11, 13", "Tay phải hợp âm Eb, cho b9 và b13", "Tay phải hợp âm Dm, vì đích là Dm", "Tay phải hợp âm Bb, cho 9sus4"], "answer": "Tay phải hợp âm F trên Eb7, cho đủ 9, #11, 13", "why": "Eb7 là \"bạn của mẹ\", nên dùng 9, #11, 13: hợp âm F (F A C) là hợp âm ba nốt cao hơn nốt gốc một cung."}, {"q": "C#dim7, Edim7, Gdim7, Bbdim7 có gì chung?", "choices": ["Cùng bốn phím C# E G Bb, cùng một âm thanh", "Cùng nốt gốc C#", "Đều là hợp âm nửa giảm m7(b5)", "Đều đi về C"], "answer": "Cùng bốn phím C# E G Bb, cùng một âm thanh", "why": "Hợp âm giảm 7 xếp đều nhau, nên bốn tên này chỉ là bốn cách đảo của cùng bốn phím C# E G Bb."}]},

  {"id": "p4-11", "part": 4, "src": "Phildave 4 · Bài 11", "title": "Nốt chính, nốt màu và đổi 13 sang b13 lệch thời điểm", "teach": [{"text": "Nhìn tension là biết bản chất (텐션을 보면 정체를 안다): C – Bb7(13) – Dm7 – A7(b13). Nốt chính của hợp âm (chord tone) tính đến bậc 7: Bb7 có Bb, D, F, Ab; các nốt 9, 11, 13 xen thêm là nốt màu, như G là 13 của Bb7. Nốt màu nằm sẵn trong âm giai của hợp âm là nốt màu tự nhiên; hạ hay nâng nửa cung ra khỏi âm giai thì thành màu biến đổi.", "tip": "Nốt 13 là nốt 6 tính từ nốt gốc, đặt cao lên: Bb, C, D, Eb, F, G ra G.", "keys": ["Bb2", "D3", "F3", "Ab3", "G4"], "play": [["Bb2", "D3", "F3", "Ab3", "G4"]]}, {"text": "Cũng câu đó, nhìn nốt màu và đích là biết từng hợp âm làm gì. Bb7 nếu là \"bạn của mẹ\" của E7 thì phải về Am, nhưng ở đây đích là Dm, nên Bb7 chỉ là hợp âm mượn (modal) từ C thứ. A7 đi về Dm, mà Dm là hợp âm thứ, nên A7 dùng màu biến đổi b13.", "tip": "b13 của A7 là F (nốt 6 tính từ A là F#, hạ nửa cung ra F), cũng chính là bậc 3 của Dm.", "play": ["C", "Bb7(13)", "Dm7", "A7(b13)", "Dm7"]}, {"text": "Tiến hành I–VI–II–V (1-6-2-5 진행): F/G – F/G – C – Am7 – Dm7 – G7. Ô nhịp thứ hai chia 4 hợp âm C – Am7 – Dm7 – G7, chỉ ghép các hợp âm trong giọng mà vẫn rất dễ nghe. Am thay thế cho C, rồi nốt gốc rơi theo vòng quãng 5: A xuống D, D xuống G. Đây là nền để các bài sau phát triển tiếp.", "tip": "Từ A đếm xuống 5 tên nốt (A, G, F, E, D) ra D; từ D đếm xuống 5 tên nốt ra G.", "play": ["F/G", "F/G", "C", "Am7", "Dm7", "G7"]}, {"text": "Tension & subV (텐션과 썹파이브): F/G – G7(13) – G7(b13) – C – Am7 – Dm7 – Db7(#11). Nốt trên cùng ở chữ \"danh\" là nốt 13 của G7 (E): thường chỉ chọn E (13 tự nhiên) hoặc Eb (b13), nhưng thầy dùng cả hai, đánh E trước rồi hạ xuống Eb. Đó là đổi màu lệch thời điểm (time-shifted tension): nốt trên cùng đi từng nửa cung nên nghe rất đẹp. Db7(#11) ở cuối là \"bạn của mẹ\" của G7, chung tritone B–F.", "tip": "Giữ G F B, chỉ hạ ngón trên cùng từ E xuống Eb.", "keys": ["G2", "F3", "B3", "E4"], "compare": {"a": {"label": "G7(13) → G7(b13) → C", "play": ["F/G", ["G2", "F3", "B3", "E4"], ["G2", "F3", "B3", "Eb4"], "C"]}, "b": {"label": "Cả câu, kết bằng Db7(#11)", "play": ["F/G", ["G2", "F3", "B3", "E4"], ["G2", "F3", "B3", "Eb4"], "C", "Am7", "Dm7", "Db7(#11)"]}}}], "remember": ["Nốt chính của hợp âm tính đến bậc 7; 9, 11, 13 là nốt màu (tự nhiên nếu nằm trong âm giai, biến đổi nếu bị hạ/nâng).", "Nhìn đích: Bb7 về Dm là hợp âm mượn; A7 về Dm (thứ) dùng b13 (F, bậc 3 của Dm).", "Đổi màu lệch thời điểm: G7(13) rồi G7(b13), nốt 13 (E) hạ xuống Eb."], "items": [{"chord": "Bb7(13)", "rel": "modal", "prog": ["C", "Bb7(13)", "Dm7", "A7(b13)"]}, {"chord": "G7(13)", "to": "G7(b13)", "rel": "line", "prog": ["F/G", "G7(13)", "G7(b13)", "C"], "why": "G7(13) và G7(b13) giữ chung G, B, F; chỉ nốt 13 (E) hạ nửa cung xuống b13 (Eb), tức đổi màu lệch thời điểm."}, {"chord": "G7(b13)", "to": "C", "prog": ["F/G", "G7(13)", "G7(b13)", "C"]}], "quiz": [{"q": "Nốt chính của hợp âm (chord tone) của G7 gồm những nốt nào?", "choices": ["G, B, D, F", "G, A, B, D", "B, F, A, E", "G, D, A, E"], "answer": "G, B, D, F", "why": "Nốt chính tính đến bậc 7: nốt gốc G, bậc 3 B, bậc 5 D, bậc 7 F; A, E là nốt màu 9, 13."}, {"q": "G7(13) → G7(b13) trước C là làm gì?", "choices": ["Đánh 13 tự nhiên (E) trước rồi hạ xuống b13 (Eb)", "Đổi nốt bass G sang Gb", "Bỏ nốt 7 của G7", "Đổi G7 thành \"bạn của mẹ\""], "answer": "Đánh 13 tự nhiên (E) trước rồi hạ xuống b13 (Eb)", "why": "Đây là đổi màu lệch thời điểm: dùng cả 13 và b13 nối tiếp, nốt trên cùng đi E xuống Eb."}]},

  {"id": "p4-12", "part": 4, "src": "Phildave 4 · Bài 12", "title": "Kết Amen trên 9sus4, G7+ và chia hợp âm tối đa", "teach": [{"text": "Amen cadence trên 9sus4 (나인써스포에 아멘종지적용): ở chữ \"Con nâng cao danh Ngài\", thầy đi F/G – Fm/G – C – F/G. F/G trông như hợp âm F nhưng thật ra là hợp âm G: F là bậc 7, A là nốt 9, C là bậc 4 (sus4) của G. Lẽ ra sus4 phải giải quyết, nhưng thầy đổi F thành Fm trên bass G theo kiểu kết Amen rồi mới về C.", "tip": "Nhìn từ G: F là G lùi một cung (nốt 7), A là G lên một cung (nốt 9), C là nốt 4.", "play": ["F/G", "Fm/G", "C", "F/G"]}, {"text": "Augmented & flat 13 (오그먼트와 플렛썰틴): F/G – G7+ – C – Fm/G. Như bài 2, G7+ nâng bậc 5 lên nửa cung (D thành D#); còn hạ nốt 13 (E) xuống nửa cung thì gọi là b13 (Eb). Hai tên khác nhau nhưng cùng một phím, cùng một màu âm, và nốt này muốn đi tiếp lên E của hợp âm C.", "tip": "G7+: tay trái G F, tay phải B Eb; sang C thì Eb nhích lên nửa cung thành E, bậc 3 của C.", "compare": {"a": {"label": "F/G – G7 – C", "play": ["F/G", "G7", "C"]}, "b": {"label": "F/G – G7+ – C – Fm/G", "play": ["F/G", "G7+", "C", "Fm/G"]}}}, {"text": "Chia hợp âm tối đa (코드는 최대한 많이 나눈다): C – A7(13) – A7(b13) – Dm7 – Dm(M7) – Dm7. A7 đi về Dm (hợp âm thứ) nên đúng ra dùng b13; ở chữ \"vương quốc Chúa\" thầy cố ý đánh 13 tự nhiên trước, nghe hơi lạ như một chút khiêu khích, rồi mới hạ xuống b13, cũng là đổi màu lệch thời điểm. Nhịp 4/4 thì một ô nhịp chia được tới 4 hợp âm: Dm7 – Dm(M7) – Dm7 qua lại như nhạc cổ điển.", "tip": "Giữ A G C#, chỉ hạ ngón trên cùng từ F# xuống F; F lại là bậc 3 của Dm.", "keys": ["A2", "G3", "C#4", "F#4"], "play": ["C", ["A2", "G3", "C#4", "F#4"], ["A2", "G3", "C#4", "F4"], "Dm7", "Dm(M7)", "Dm7"]}, {"text": "Báo trước tension (뒤에 나올 텐션의 예비음): C – Gm/Bb – A7(b9) – Dm7 – Dm(M7) – Dm7, bass đi xuống C, Bb, A. Nốt Bb đến trước chính là b9 của A7 phía sau, nên tai đã nghe sẵn và A7(b9) vào rất tự nhiên. Thầy nói Gm/Bb cũng có thể nhìn đơn giản là C/Bb như ở bài 1.", "tip": "Gm/Bb: tay trái Bb, tay phải hợp âm Gm (G Bb D); sang A7(b9), Bb ở tay phải giữ nguyên thành b9.", "play": ["C", "Gm/Bb", "A7(b9)", "Dm7", "Dm(M7)", "Dm7"]}], "remember": ["F/G là hợp âm G: F, A, C là bậc 7, nốt 9 và sus4; đổi sang Fm/G là kết Amen trên bass G.", "G7+ và G7(b13) cùng một phím (D# = Eb), muốn đi lên E của C.", "A7 → Dm: 13 trước, b13 sau; bass C – Bb – A báo trước b9 của A7; chia tới 4 hợp âm một ô nhịp."], "items": [{"chord": "Fm/G", "to": "C", "prog": ["F/G", "Fm/G", "C", "F/G"]}, {"chord": "G7+", "to": "C", "prog": ["F/G", "G7+", "C", "Fm/G"]}, {"chord": "Gm/Bb", "to": "A7(b9)", "prog": ["C", "Gm/Bb", "A7(b9)", "Dm7"]}], "quiz": [{"q": "F/G nhìn từ hợp âm G thì F, A, C là những nốt nào?", "choices": ["Bậc 7, nốt 9 và bậc 4 (sus4)", "Nốt gốc, bậc 3 và bậc 5", "Nốt 9, 11 và 13", "Bậc 3, 5 và 7"], "answer": "Bậc 7, nốt 9 và bậc 4 (sus4)", "why": "F là G lùi một cung (nốt 7), A là G lên một cung (nốt 9), C là nốt 4; ba nốt gom lại thành hợp âm F."}, {"q": "Ở chữ \"vương quốc Chúa\", thầy đánh A7(13) rồi mới A7(b13). Nốt 13 tự nhiên (F#) ở đó nghe thế nào?", "choices": ["Hơi lạ, như một chút khiêu khích, rồi hạ xuống b13 (F)", "Sai luật, nên thầy bỏ ngay", "Là màu chuẩn nhất khi về hợp âm thứ", "Biến A7 thành hợp âm mượn"], "answer": "Hơi lạ, như một chút khiêu khích, rồi hạ xuống b13 (F)", "why": "Về Dm (hợp âm thứ) thì đúng ra là b13; thầy cố ý đánh 13 trước cho hơi lạ tai, rồi hạ F# xuống F, cũng là đổi màu lệch thời điểm."}, {"q": "Trong nhịp 4/4, thầy dặn chia hợp âm thế nào?", "choices": ["Chia càng nhiều càng tốt, tới 4 hợp âm một ô nhịp", "Mỗi ô nhịp chỉ một hợp âm", "Chỉ đổi hợp âm ở cuối câu", "Chỉ chia khi ca sĩ nghỉ"], "answer": "Chia càng nhiều càng tốt, tới 4 hợp âm một ô nhịp", "why": "Nhịp 4/4 có 4 phách nên chia được tới 4 hợp âm, như Dm7 – Dm(M7) – Dm7 qua lại."}]},

  {"id": "p4-13", "part": 4, "src": "Phildave 4 · Bài 13", "title": "9sus4 thực tế, hợp âm theo nốt trên cùng, tên hợp âm giảm", "teach": [{"text": "9sus4 trong thực tế (나인써스포의 생활화): ở chữ \"ngợi khen Chúa\", giai điệu chạy nhanh nhiều nốt nhưng thầy giữ nguyên F/G – F/G – C – F/G. Nốt F là nốt chính của hợp âm (nằm trong hợp âm F của 9sus4), các nốt khác chỉ lướt qua. Thầy dặn học 9sus4 như một hợp âm ba nốt, đừng đếm 7, 9, sus4 từng nốt, vì đổi thế đảo là rối; cách này dùng cho mọi hợp âm 7, kể cả hợp âm át phụ.", "tip": "9sus4 của hợp âm 7 nào cũng là hợp âm trưởng của nốt gốc lùi một cung: G7 bấm hợp âm F, A7 bấm hợp âm G.", "compare": {"a": {"label": "G7 9sus4 = F/G", "play": ["F/G", "G7"]}, "b": {"label": "A7 9sus4 = G/A", "play": ["G/A", "A7"]}}}, {"text": "Augmented (오그먼트 코드): ở chữ \"lời ngợi khen của con\", thầy đi F/G – C – G7+. Sau C, G7+ (bậc 5 nâng lên, cũng là b13) làm câu không dừng hẳn mà muốn đi tiếp về C.", "tip": "Từ C sang G7+: tay phải C E G thành B Eb, C xuống B, E xuống Eb, mỗi ngón lùi nửa cung.", "play": ["F/G", "C", ["G2", "F3", "B3", "Eb4"]]}, {"text": "Hợp âm theo top note (탑노트에 맞는 코드): C – Em7 – G/F – F. Các tập nhạc khác chỉ ghi F, nhưng muốn nốt giai điệu ở chữ \"khen\" nổi lên thì thầy chơi hợp âm G trên bass F (G/F) rồi mới về F. Không có hợp âm nào cố định: miễn là hợp âm trong giọng (C, Dm, F, G…) và nốt giai điệu nằm trên cùng.", "tip": "G/F: tay trái giữ F, tay phải bấm hợp âm G; rồi tay phải về hợp âm F.", "compare": {"a": {"label": "Sách khác: C – Em7 – F", "play": ["C", "Em7", "F"]}, "b": {"label": "Theo nốt trên cùng: C – Em7 – G/F – F", "play": ["C", "Em7", "G/F", "F"]}}}, {"text": "Đảo 1 dùng augmented: C – C+/E – G/F – F. Đảo 1 của C thường thay bậc 3 ở tay phải bằng 9 (bài 3); lần này thầy dùng hợp âm tăng C+ trên bass E; tay phải vẫn không lặp lại E: C G# C. Nốt G# căng cùng nốt giai điệu trên cùng cho một màu rất phức tạp, rồi bass đi lên E, F vào G/F – F.", "tip": "C+ là hợp âm C nâng bậc 5 lên nửa cung: G thành G#.", "play": ["C", "C+/E", "G/F", "F"]}, {"text": "Hướng đi của diminished (디미니쉬의 진행방향): câu lặp lại thì thầy thêm F#°7 sau F (C – C+/E – G/F – F – F#°7) để đổi màu. Với hợp âm giảm, hướng đi rất quan trọng: cùng bốn phím, bass đi lên từ F lên G thì gọi F#dim7, bass đi xuống từ G xuống F thì gọi Gbdim7. Đặt tên như vậy là báo trước bass sẽ đi về đâu.", "tip": "Đi lên dùng dấu thăng (F#), đi xuống dùng dấu giáng (Gb); F# và Gb là cùng một phím đen.", "compare": {"a": {"label": "Đi lên: F – F#°7 – G", "play": ["F", "F#°7", "G"]}, "b": {"label": "Đi xuống: G – Gb°7 – F", "play": ["G", "Gb°7", "F"]}}}], "remember": ["Giai điệu chạy nhanh: nốt nào là nốt chính của hợp âm thì giữ hợp âm, nốt lướt qua thì thôi; học 9sus4 như hợp âm ba nốt (G7 → F/G, A7 → G/A).", "Chọn hợp âm theo nốt trên cùng: G/F thay cho F để nốt giai điệu nổi lên.", "Hợp âm giảm gọi theo hướng bass: đi lên là F#dim7, đi xuống là Gbdim7."], "items": [{"chord": "G/F", "to": "F", "rel": "line", "prog": ["C", "Em7", "G/F", "F"]}, {"chord": "C+/E", "to": "G/F", "prog": ["C", "C+/E", "G/F", "F", "F#°7"]}, {"chord": "Em7", "to": "C", "rel": "sub", "prog": ["C", "Em7", "G/F", "F"]}], "quiz": [{"q": "Bass đi từ G xuống F qua một hợp âm giảm. Gọi tên hợp âm đó thế nào?", "choices": ["Gbdim7", "F#dim7", "Gdim7", "Fdim7"], "answer": "Gbdim7", "why": "Bass đi xuống thì dùng dấu giáng: G xuống Gb rồi F, nên gọi Gbdim7 (cùng phím với F#dim7)."}, {"q": "Giai điệu chạy nhanh trên F/G, vì sao thầy vẫn giữ F/G?", "choices": ["Nốt F là nốt chính của hợp âm, các nốt khác chỉ lướt qua", "Vì F/G là hợp âm chủ", "Vì giai điệu không có nốt F", "Vì đổi hợp âm sẽ sai nhịp"], "answer": "Nốt F là nốt chính của hợp âm, các nốt khác chỉ lướt qua", "why": "F nằm trong hợp âm F của 9sus4; các nốt còn lại chỉ đi ngang qua nên không cần đổi hợp âm."}, {"q": "Từ C sang G7+, tay phải đi thế nào?", "choices": ["C xuống B, E xuống Eb: mỗi ngón lùi nửa cung", "C lên D, E lên F", "Giữ nguyên C E G, chỉ đổi bass", "C xuống A, E xuống D"], "answer": "C xuống B, E xuống Eb: mỗi ngón lùi nửa cung", "why": "G7+ bấm G F | B Eb: từ hợp âm C, C lùi nửa cung thành B (bậc 3 của G7), E lùi nửa cung thành Eb (#5 của G7)."}]},

  {"id": "p4-14", "part": 4, "src": "Phildave 4 · Bài 14", "title": "Hợp âm theo giai điệu, vào đúng phách và 9sus4 đi qua", "teach": [{"text": "Hợp âm theo top note: ở chữ \"Đức Chúa Trời toàn năng\", thầy đi C – G/A – G/F – F. Chỗ này vốn là Am, nhưng nốt giai điệu là B, mà B không phải nốt chính của Am; nên thầy chơi hợp âm G (có B) trên bass A. G/A ở đây không phải 9sus4, chỉ là hợp âm G làm nổi nốt B; bass đi A xuống F mà nốt trên cùng vẫn là B.", "tip": "Tay phải giữ hợp âm G với B trên cùng (D G B); tay trái đổi bass từ A xuống F.", "keys": ["A2", "D4", "G4", "B4"], "play": ["C", ["A2", "D4", "G4", "B4"], ["F2", "D4", "G4", "B4"], "F"]}, {"text": "Giải quyết bằng hợp âm thay thế (대리코드로 해결): C – G/A – A7(b13 #9) – G/F – F – F#°7. Ô nhịp chỉ có một hợp âm thì đặt hợp âm thay thế ở phách 3 để chia đôi, như C rồi G/A (thay cho Am, hợp âm thay thế của C). A7 lẽ ra về Dm, nhưng Dm là hợp âm thay thế của F nên đi về F cũng được: thầy gọi Dm là phương án 1, F là phương án 2. Nốt giai điệu C chạm bậc 3 (C#) của A7, nên dùng A7(b13 #9): C chính là nốt #9.", "tip": "A7(b13 #9) dễ bấm: tay trái A C# G, tay phải hợp âm F (F A C).", "play": ["C", "G/A", "A7(b13 #9)", "G/F", "F", "F#°7"]}, {"text": "Đổi tension lệch thời điểm (텐션의 변화로 시간차 공격): F/G – G7(13) – G7(b13) – C – F/G, lại là 13 rồi b13 trên G7 như bài 11. Lần này thầy dặn mỗi hợp âm phải vào đúng phách, và phách 4 là nghỉ. Đánh hợp âm vào nốt móc đơn lướt qua thì nó chỉ thành tiết tấu của giai điệu, nghe không hay.", "tip": "Đếm to 1, 2, 3, 4: mỗi lần đổi hợp âm đặt tay xuống đúng số đếm, tới 4 thì nhấc tay nghỉ.", "play": ["F/G", ["G2", "F3", "B3", "E4"], ["G2", "F3", "B3", "Eb4"], "C", "F/G"]}, {"text": "9sus4 & passing progression (나인써스포와 경과적진행): F/G – G/F – C/E – Am7 – G7+. F/G giải quyết xuống G/F: tay phải về hợp âm G, bass G xuống F, thành G7 đảo 3 (nốt 7 ở bass). Bass F đi tiếp xuống E vào C/E, đảo 1 của hợp âm kế tiếp, nên vừa giải quyết vừa là tiến hành đi qua: bass G, F, E, nghe rất cổ điển.", "tip": "G/F: tay trái F (G lùi một cung, nốt 7 của G7), tay phải hợp âm G; C/E: tay trái E, tay phải C D G.", "play": ["F/G", "G/F", "C/E", "Am7", "G7+"]}], "remember": ["Nốt giai điệu không phải nốt chính của hợp âm thì đổi hợp âm theo nó: giai điệu B trên chỗ Am thì chơi G/A.", "A7 về Dm là phương án 1, về F là phương án 2; giai điệu C trên A7 thì dùng #9.", "Hợp âm vào đúng phách; F/G → G/F → C/E vừa giải quyết vừa cho bass đi xuống G, F, E."], "items": [{"chord": "G/A", "to": "Am", "rel": "sub", "prog": ["C", "G/A", "G/F", "F"]}, {"chord": "G7(b13)", "to": "C", "prog": ["F/G", "G7(13)", "G7(b13)", "C", "F/G"]}, {"chord": "G/F", "to": "C/E", "prog": ["F/G", "G/F", "C/E", "Am7", "G7+"]}], "quiz": [{"q": "Chỗ vốn là Am nhưng nốt giai điệu là B, thầy chơi gì?", "choices": ["G/A: hợp âm G có B, đặt trên bass A", "Am9sus4", "Em/A", "A7(b9)"], "answer": "G/A: hợp âm G có B, đặt trên bass A", "why": "B không phải nốt chính của Am; hợp âm G có B nên thầy đặt hợp âm G trên bass A cho nốt B nổi lên."}, {"q": "Nốt giai điệu C chạm bậc 3 (C#) của A7. Thầy xử lý thế nào?", "choices": ["Dùng A7(b13 #9): C chính là nốt #9", "Bỏ A7, chơi Am", "Đổi bass sang C", "Dùng A7(13)"], "answer": "Dùng A7(b13 #9): C chính là nốt #9", "why": "Nốt #9 của A7 là C (cùng phím với B#), nên giai điệu C trở thành nốt màu của A7."}, {"q": "F/G → G/F → C/E: bass đi thế nào?", "choices": ["Đi xuống liền bậc G, F, E", "Đi lên G, A, B", "Đứng yên ở G", "Nhảy G lên C"], "answer": "Đi xuống liền bậc G, F, E", "why": "F/G giải quyết xuống G/F (G7 đảo 3), rồi bass F xuống E vào C/E: vừa giải quyết vừa đi qua."}]},

  {"id": "p4-15", "part": 4, "src": "Phildave 4 · Bài 15", "title": "II–V về F, Bb/C \"sâu\" và hai \"bạn của mẹ\"", "teach": [{"text": "Top note của minor 7 (마이너쇬븐의 탑노트): ở chữ \"원히 다스리네\", thầy đi Dm7 – F/G – G7 – C – Gm7 – C7. Phần sau bắt đầu bằng F, nên cuối câu thầy làm II–V về F: Gm7 là \"chị\", C7 là \"mẹ\" của F. Thầy cũng nói Dm7 thêm nốt 9 (Dm7(9)) nghe giàu hơn hẳn Dm7.", "tip": "Tìm \"chị\" của C7: từ C đếm lên 5 tên nốt (C, D, E, F, G) ra Gm7.", "play": ["Dm7", "F/G", "G7", "C", "Gm7", "C7", "F"]}, {"text": "9sus4 cảm giác sâu (깊은 느낌의 나인써스포): Dm7(9) – F/G – G7 – C – Bb/C – C7. Bb/C (C7 9sus4, bài 4) thêm nốt A trên cùng thì nghe sâu hơn. Nhìn từ Bb, tay phải là Bbmaj7 (Bb D F A); nhìn từ C, đó là C7 9sus4 có thêm 13 (A).", "tip": "A là nốt 13 của C (C, D, E, F, G, A ra A), cũng là Bb lùi nửa cung, tức nốt 7 của Bbmaj7.", "keys": ["C2", "Bb3", "D4", "F4", "A4"], "compare": {"a": {"label": "Bb/C", "play": ["C", "Bb/C", "C7"]}, "b": {"label": "Bb/C thêm A trên cùng", "play": ["C", ["C2", "Bb3", "D4", "F4", "A4"], "C7"]}}}, {"text": "Minor 9 cảm giác sâu (깊은 느낌의 마이너나인): Dm7(9) – F/G – G7 – C – Gm7(9) – Gb7(#11). Gm7(9) (tức Gm9) cho màu sâu, rồi Gb7(#11), \"bạn của mẹ\" của C7, đi về F. Thầy còn chỉ một màu đẹp: màu biến đổi đi cùng nốt màu tự nhiên trên một hợp âm 7, như C7 có cả b9 (Db) và 13 (A). Thường màu biến đổi đi với màu biến đổi; cặp b9 với 13 này hiếm hơn nhưng rất đẹp, nên hãy tận dụng.", "tip": "C7 có b9 và 13: tay trái C Bb, tay phải hợp âm A (A C# E), với C# chính là Db.", "compare": {"a": {"label": "Gm7(9) – Gb7(#11) – F", "play": ["Gm7(9)", "Gb7(#11)", "F"]}, "b": {"label": "C7 có b9 và 13 → F", "play": ["C7(b9 13)", "F"]}}}, {"text": "SubV (썹파이브): Dm7(9) – F/G – Db7 – C – Gm7 – Gb7(#11). Lần này Db7 đứng ở chỗ của G7: Db7 là \"bạn của mẹ\" của G7, chung tritone F–B. Cả câu có hai \"bạn của mẹ\": Db7 về C và Gb7(#11) về F, bass đều đi xuống nửa cung vào đích.", "tip": "Nốt gốc của \"bạn của mẹ\" là đích nhích lên nửa cung: C lên nửa cung là Db, F lên nửa cung là Gb.", "play": ["Dm7(9)", "F/G", "Db7", "C", "Gm7", "Gb7(#11)", "F"]}], "remember": ["Câu sau bắt đầu bằng F thì cuối câu trước làm II–V về F: Gm7 – C7 hoặc Gm7 – Gb7(#11).", "Bb/C thêm A trên cùng = C7 9sus4 có 13; C7 có b9 và 13 = tay trái C Bb, tay phải hợp âm A.", "\"Bạn của mẹ\" thay \"mẹ\": Db7 về C, Gb7(#11) về F; các cách trong bài thay qua lại được."], "items": [{"chord": "Gm7", "to": "C7", "prog": ["C", "Gm7", "C7"]}, {"chord": "Bb/C", "to": "C7", "rel": "line", "prog": ["C", "Bb/C", "C7"]}, {"chord": "Db7", "to": "C", "prog": ["Dm7(9)", "F/G", "Db7", "C"]}], "quiz": [{"q": "Bb/C thêm nốt A trên cùng. Nhìn từ C thì đó là gì?", "choices": ["C7 9sus4 có thêm 13", "Cmaj7", "C7(b9)", "Cm7"], "answer": "C7 9sus4 có thêm 13", "why": "Bb là nốt 7, D là 9, F là 4 của C (C7 9sus4); A là nốt 13 của C."}, {"q": "Vì sao cuối câu thầy làm II–V về F?", "choices": ["Vì phần sau bắt đầu bằng F", "Vì F là hợp âm chủ của bài", "Vì C7 là hợp âm mượn", "Vì Gm7 là hợp âm trong giọng C"], "answer": "Vì phần sau bắt đầu bằng F", "why": "Phần sau mở bằng F, nên Gm7 – C7 (hoặc Gm7 – Gb7(#11)) dẫn thẳng vào F."}, {"q": "Trong Dm7(9) – F/G – Db7 – C, Db7 thay cho hợp âm nào?", "choices": ["G7, vì là \"bạn của mẹ\" của G7", "Dm7, vì là \"chị\"", "C, vì cùng họ thay thế", "F/G, vì cùng bass"], "answer": "G7, vì là \"bạn của mẹ\" của G7", "why": "Db7 chung tritone F–B với G7 nên đứng ở chỗ G7 và về C, bass Db xuống nửa cung vào C."}]},

  {"id": "p4-16", "part": 4, "src": "Phildave 4 · Bài 16", "title": "Bridge: E/G#, bass giữ nguyên và dòng bass căng", "teach": [{"text": "Thử mọi cách (모든것들을 시도하자): ở đoạn bridge \"하늘 높이 올린 깃발처럼\" (Lên thật cao…), thầy đi F – G – E/G# – Am, hợp âm đích là Am. E/G# không chỉ là hợp âm E đảo 1 mà là E7 đảo 1, \"mẹ\" của Am, nên thay được bằng G#dim7 (G#°7), như C#°7 thay A7. Bass đi lên liền bậc F, G, G#, A.", "tip": "Đảo 1 của hợp âm 7 thay được bằng hợp âm giảm trên chính nốt bass đó: E7 → G#dim7, A7 → C#dim7, D7 → F#dim7.", "compare": {"a": {"label": "F – G – E/G# – Am", "play": ["F", "G", "E/G#", "Am"]}, "b": {"label": "F – G – G#°7 – Am", "play": ["F", "G", "G#°7", "Am"]}}}, {"text": "Pedal point (페달포인트): F – G/F – E(sus4) – E/G# – Am. Bass F đứng yên dưới F rồi G/F; thầy nói bass cứ muốn giữ lại là đến lúc sẽ rơi xuống. Rồi bass rơi xuống E (E(sus4)), lên G# (E/G#) vào Am.", "tip": "G/F: tay trái giữ F, tay phải đổi từ hợp âm F sang hợp âm G.", "play": ["F", "G/F", "E(sus4)", "E/G#", "Am"]}, {"text": "Thêm 9sus4 (나인써스포 추가): … Am9 – Bb/C – F. Ở phách cuối, Bb/C (C7 9sus4) dẫn vào F. Không có thời gian đưa sus4 về bậc 3, nên thầy đi thẳng về F; C7 là \"mẹ\" của F nên vẫn nghe về đích.", "tip": "Bb/C: tay trái C, tay phải hợp âm Bb (C lùi một cung là Bb).", "play": ["Am9", "Bb/C", "F"]}, {"text": "String line kịch tính (극적인 스트링라인): F – G/F – E(sus4)/B – E7 – Am7(9) – C7/G. Bass giữ F rồi rơi xuống B chứ không phải E: bass không phải nốt gốc nên dòng nghe rất căng. Cuối câu, C7/G cho bass đi xuống A, G như tiến hành đi qua, và C7 là \"mẹ\" của F ở câu sau.", "tip": "Dòng bass: F, F, B, E, A, G; thầy dặn tự tìm đường bass trước rồi mới đặt hợp âm lên.", "play": ["F", "G/F", "E(sus4)/B", "E7", "Am7(9)", "C7/G"]}], "remember": ["E/G# là E7 đảo 1, thay được bằng G#dim7; tương tự A7 → C#dim7, D7 → F#dim7.", "Bass giữ nguyên (F dưới F, G/F) rồi rơi xuống; bass không phải nốt gốc (E(sus4)/B) làm dòng căng.", "Bb/C ở phách cuối không cần giải quyết sus4, đi thẳng về F."], "items": [{"chord": "E/G#", "to": "Am", "prog": ["F", "G", "E/G#", "Am"]}, {"chord": "E(sus4)/B", "to": "E7", "rel": "line", "prog": ["F", "G/F", "E(sus4)/B", "E7", "Am7(9)", "C7/G"]}, {"chord": "Bb/C", "to": "F", "prog": ["Am9", "Bb/C", "F"]}], "quiz": [{"q": "E/G# trước Am thay được bằng hợp âm giảm nào?", "choices": ["G#dim7", "C#dim7", "Adim7", "Gm7"], "answer": "G#dim7", "why": "E/G# là E7 đảo 1; hợp âm giảm trên nốt bass G# (G# B D F) nằm sẵn trong E7(b9) nên thay được."}, {"q": "Vì sao Bb/C ở phách cuối đi thẳng về F, không giải quyết sus4?", "choices": ["Không có thời gian; C7 là \"mẹ\" của F nên vẫn về F được", "Vì Bb/C là hợp âm chủ", "Vì sus4 không bao giờ cần giải quyết", "Vì F là \"bạn của mẹ\" của C7"], "answer": "Không có thời gian; C7 là \"mẹ\" của F nên vẫn về F được", "why": "Ở phách cuối không còn chỗ đưa bậc 4 về 3; Bb/C vẫn là C7 9sus4 nên kéo thẳng về F."}, {"q": "Dòng bass F – G/F – E(sus4)/B nghe căng vì sao?", "choices": ["Bass rơi xuống B, không phải nốt gốc E", "Vì bass đứng yên mãi", "Vì có hợp âm mượn", "Vì E(sus4) là hợp âm thứ"], "answer": "Bass rơi xuống B, không phải nốt gốc E", "why": "Bass đi trên nốt không phải nốt gốc (B dưới E(sus4)) tạo đường bass như dòng đàn dây rất căng."}]},

  {"id": "p4-17", "part": 4, "src": "Phildave 4 · Bài 17", "title": "Đảo 3, #9 với b13, và chỉ nghĩ đến hợp âm đích", "teach": [{"text": "Đảo 3 của dominant (도미넌트의 3전위): ở chữ \"cao tận trời\", thầy đi F – G/F – E(sus4)/B – E7(b13 #9) – Am7(9) – C7/G. G/F là G7 đảo 3 (nốt 7 F ở bass): bass F cố giữ lại rồi mới bật đi. Lần này E7 có thêm #9 và b13, cho một cách diễn đạt rất kịch tính.", "tip": "#9 và b13 của E7 là G và C, chính là hai nốt của hợp âm C ở tay phải.", "play": ["F", "G/F", "E(sus4)/B", "E7(b13 #9)", "Am7(9)", "C7/G"]}, {"text": "Thầy dặn: muốn nốt màu có nghĩa thì màu hợp âm 7 phải rõ, tức bậc 3 và 7 (tritone). Có bass đánh nốt gốc thì piano bỏ nốt gốc cũng được: C7 chỉ còn E, Bb cùng #9 (Eb) và b13 (Ab) vẫn nghe ra C7, mà sắc và tinh tế hơn.", "tip": "Bậc 7 của C7 là C lùi một cung (Bb); #9 là D nâng nửa cung (D#, cùng phím Eb), b13 là A hạ nửa cung (Ab).", "keys": ["E3", "Bb3", "Eb4", "Ab4"], "compare": {"a": {"label": "Có nốt gốc C", "play": [["C2", "E3", "Bb3", "Eb4", "Ab4"]]}, "b": {"label": "Bỏ nốt gốc", "play": [["E3", "Bb3", "Eb4", "Ab4"]]}}}, {"text": "Chỉ nghĩ đến hợp âm đích (목적지코드만 생각해라): F – G – E(sus4)/B – Bb7(#11) – Am7(9) – Bb/C. Ở chỗ E7, thầy đặt Bb7(#11), \"bạn của mẹ\" của E7: bậc 3 và 7 của E7 (G#, D) chính là bậc 7 và 3 của Bb7 (Ab, D). Đừng coi Bb7 ở đây là hợp âm mượn; điều quan trọng là đích đến Am7(9). Bass đi F, G, B rồi xuống nửa cung Bb, A, nghe rất êm.", "tip": "Bb7(#11): tay phải hợp âm C, là hợp âm ba nốt cao hơn nốt gốc một cung (Bb lên một cung là C).", "compare": {"a": {"label": "\"Mẹ\": E7 → Am7(9)", "play": ["F", "G", "E(sus4)/B", "E7", "Am7(9)"]}, "b": {"label": "\"Bạn của mẹ\": Bb7(#11) → Am7(9)", "play": ["F", "G", "E(sus4)/B", "Bb7(#11)", "Am7(9)", "Bb/C"]}}}], "remember": ["G/F là G7 đảo 3 (nốt 7 ở bass); E7(b13 #9) cho đoạn cao trào kịch tính.", "Nốt màu chỉ có nghĩa khi bậc 3 và 7 rõ; có bass đánh gốc thì piano bỏ gốc được.", "Chỉ nghĩ đến đích Am: E7 hay Bb7(#11) (\"bạn của mẹ\") đều được, bass B xuống Bb rồi A."], "items": [{"chord": "E7(b13 #9)", "to": "Am7(9)", "prog": ["F", "G/F", "E(sus4)/B", "E7(b13 #9)", "Am7(9)", "C7/G"]}, {"chord": "Bb7(#11)", "to": "Am7(9)", "prog": ["F", "G", "E(sus4)/B", "Bb7(#11)", "Am7(9)", "Bb/C"]}], "quiz": [{"q": "Bb7(#11) đứng ở chỗ E7 trước Am7(9) là gì?", "choices": ["\"Bạn của mẹ\" của E7", "Hợp âm mượn từ C thứ", "\"Chị\" của Am", "Hợp âm giảm đi qua"], "answer": "\"Bạn của mẹ\" của E7", "why": "Bb7 chung tritone với E7 (G#–D) nên thay E7 và cùng về Am; thầy dặn đừng coi nó là hợp âm mượn ở đây."}, {"q": "G/F trong F – G/F – E(sus4)/B là gì?", "choices": ["G7 đảo 3: nốt 7 (F) ở bass", "Fmaj7", "G7 đảo 1", "Hợp âm mượn"], "answer": "G7 đảo 3: nốt 7 (F) ở bass", "why": "Hợp âm G trên bass F: F là nốt 7 của G7, nên đây là G7 đảo 3."}]},

  {"id": "p4-18", "part": 4, "src": "Phildave 4 · Bài 18", "title": "Thực chiến: phối cả bài \"Cha yêu dấu của con\"", "teach": [{"text": "Phối cả bài \"사랑하는 나의 아버지\" (Cha yêu dấu của con): đầu bài, trước Dm có thể dùng C#dim7, A7 hoặc Eb7 đều được. Thầy cố ý chơi đơn giản ở phần mở đầu, không vừa vào đã nhồi đầy màu.", "tip": "Ba lựa chọn cùng về Dm: C#dim7 nằm sẵn trong A7(b9), Eb7 là \"bạn của mẹ\" của A7.", "compare": {"a": {"label": "C – C#°7 – Dm", "play": ["C", "C#°7", "Dm"]}, "b": {"label": "C – Eb7 – Dm", "play": ["C", "Eb7", "Dm"]}}}, {"text": "Bass đi xuống chuẩn bị b9 của A7: trong tiến hành đi qua, nốt Bb đến trước chính là b9 của A7 phía sau, như C – C/Bb – A7(b9) ở bài 1 và C – Gm/Bb – A7(b9) ở bài 12.", "tip": "b9 của A7 là A nhích lên nửa cung (Bb): đặt Bb ở bass ngay trước A7.", "play": ["C", "Gm/Bb", "A7(b9)", "Dm"]}, {"text": "Sau A7 lẽ ra về Dm, nhưng thầy \"đổi ý\", thêm một hợp âm 7 nữa: D7, \"mẹ\" của G, rồi tới G7. Hợp âm 7 nối hợp âm 7 như vậy là một chuỗi hợp âm 7; chỉ cần D7 không chọi quá với nốt giai điệu là dùng được.", "tip": "Mỗi hợp âm 7 là \"mẹ\" của hợp âm kế tiếp: A7 → D7 → G7, nốt gốc đi xuống quãng 5 (A, G, F, E, D ra D).", "play": ["A7", "D7", "G7"]}, {"text": "Trong vòng I–VI–II–V (bài 11), chỗ Am có thể đổi thành A7, \"mẹ\" của Dm. Trước G7 lúc nào cũng chèn được Dm, \"chị\" của G7, nên đi Dm rồi mới qua G.", "tip": "Am7 thành A7 chỉ cần nâng C lên C# (bậc 3 trưởng).", "compare": {"a": {"label": "C – Am7 – Dm7 – G7", "play": ["C", "Am7", "Dm7", "G7"]}, "b": {"label": "C – A7 – Dm7 – G7", "play": ["C", "A7", "Dm7", "G7"]}}}, {"text": "Bản nhạc ghi C, nhưng thầy dùng F#m7(b5) ở chỗ đó để bass đi lên nửa cung về G. Nói chính xác nhất thì bass về G là đúng, nhưng về C cũng không sao.", "tip": "F#m7(b5) = F# A C E: bỏ F# là còn đúng hợp âm Am.", "compare": {"a": {"label": "F#m7(b5) → C/G", "play": ["F#m7(b5)", "C/G"]}, "b": {"label": "F#m7(b5) → C", "play": ["F#m7(b5)", "C"]}}}, {"text": "Điệp khúc (chorus) phía sau vào F, nên cuối đoạn thầy tạo một II–V đẹp về F: Gm7 – C7, hoặc Gm7 – Gb7(#11) (\"bạn của mẹ\" của C7, màu #11). Đoạn kết (ending) thì dùng các mẫu có sẵn trong sách.", "tip": "Gb7(#11): tay phải hợp âm Ab, là hợp âm ba nốt cao hơn nốt gốc một cung (Gb lên một cung là Ab).", "compare": {"a": {"label": "Gm7 – C7 – F", "play": ["Gm7", "C7", "F"]}, "b": {"label": "Gm7 – Gb7(#11) – F", "play": ["Gm7", "Gb7(#11)", "F"]}}}], "remember": ["Đầu bài đơn giản: trước Dm chọn C#dim7, A7 hoặc Eb7; bass Bb đi trước báo b9 của A7.", "Đổi ý được: A7 → D7 → G7 (chuỗi hợp âm 7); Am thành A7; trước G7 chèn Dm.", "F#m7(b5) dẫn bass lên G; điệp khúc vào F thì làm Gm7 – C7 hoặc Gm7 – Gb7(#11)."], "items": [{"chord": "A7", "to": "D7", "prog": ["A7", "D7", "G7"]}, {"chord": "Eb7", "to": "Dm", "prog": ["C", "Eb7", "Dm"]}, {"chord": "Gb7(#11)", "to": "F", "prog": ["Gm7", "Gb7(#11)", "F"]}], "quiz": [{"q": "Sau A7, thầy \"đổi ý\" thêm D7. D7 đi về đâu?", "choices": ["Về G (G7), vì D7 là \"mẹ\" của G", "Về Dm, vì D7 là \"chị\" của Dm", "Về C, vì D7 là \"bạn của mẹ\" của C", "Về A, vì cùng nốt gốc"], "answer": "Về G (G7), vì D7 là \"mẹ\" của G", "why": "D7 là hợp âm át phụ của G, nên A7 → D7 → G7 là chuỗi hợp âm 7, mỗi hợp âm là \"mẹ\" của hợp âm sau."}, {"q": "Bản nhạc ghi C, thầy đặt F#m7(b5) ở đó. Sau F#m7(b5), bass đi đâu là chuẩn nhất?", "choices": ["Lên nửa cung về G (C/G)", "Xuống nửa cung về F", "Đứng yên ở F#", "Nhảy xuống Bb"], "answer": "Lên nửa cung về G (C/G)", "why": "Thầy nói chính xác nhất thì bass F# đi lên nửa cung về G; về C cũng không sao."}, {"q": "Vì sao đầu bài thầy cố ý chơi đơn giản?", "choices": ["Phần mở đầu chưa nên nhồi màu; càng về sau càng phức tạp", "Vì đầu bài không có hợp âm", "Vì ca sĩ chưa hát", "Vì hợp âm giảm không dùng được ở đầu bài"], "answer": "Phần mở đầu chưa nên nhồi màu; càng về sau càng phức tạp", "why": "Thầy nói đây là phần mở đầu nên chơi hơi đơn giản; màu tinh tế để dành cho các đoạn sau."}]},

  {"id": "p4-19", "part": 4, "src": "Phildave 4 · Bài 19", "title": "Vào Am: đi qua G/B, \"mẹ\" E7(b13 #9) và \"bạn của mẹ\" Bb7", "teach": [{"text": "Phần 3 là bài \"목마른 사슴\" (Như nai khát nước). Câu đầu đi từ C xuống Am (bản đơn giản: C – G/B – Am), nên hợp âm đích là Am. Cả phần này luyện đi vào Am và vào F bằng bốn đường: tiến hành đi qua, \"mẹ\", \"bạn của mẹ\" và hợp âm mượn.", "tip": "Gặp câu nào cũng tìm hợp âm đích trước, rồi mới chọn đường đi vào.", "compare": {"a": {"label": "Bản gốc: C – G/B – Am", "play": ["C", "G/B", "Am"]}, "b": {"label": "Tái hoà âm: C – E7(b13 #9) – Bb7(#11) – Am", "play": ["C", "E7(b13 #9)", "Bb7(#11)", "Am"]}}}, {"text": "Tiến hành đi qua đi xuống (경과적 하행 진행): C – G/B – Am. Đây là tiến hành tiêu biểu nhất và chỉ dùng hợp âm trong giọng: bass đi liền bậc C, B, A nên tự nó đã dẫn vào Am.", "tip": "G/B: tay trái B, tay phải G A D; bass đã có bậc 3 (B) nên tay phải thay B bằng 9 (G lên một cung là A).", "play": ["C", "G/B", "Am"]}, {"text": "Đi bằng hợp âm 7 (도미넌트 쇬븐진행): C – E7(b13 #9) – Am. Đích là Am nên đặt ngay \"mẹ\" của Am là E7. Về hợp âm thứ nên E7 mang màu biến đổi #9 và b13, nghe căng rồi về Am rất đẹp.", "tip": "Tay trái E G# D, tay phải hợp âm C: C là b13, G là #9 của E7.", "play": ["C", "E7(b13 #9)", "Am"]}, {"text": "Kết hợp hai cách (2가지 진행방식 혼용): C – G/B – E7(b13) – Am. Bass đi xuống C, B như tiến hành đi qua, rồi E7(b13) là \"mẹ\" kéo về Am. b13 của E7 cũng chính là #5, nên E7(b13) còn gọi là E7 tăng (augmented).", "tip": "b13 của E7 là C: bậc 5 (B) nhích lên nửa cung là B#, cùng phím với C.", "play": ["C", "G/B", "E7(b13)", "Am"]}, {"text": "\"Bạn của mẹ\" (썹파이브): C – E7(b13 #9) – Bb7(#11) – Am. E7 và Bb7 chung tritone G#–D: bậc 3 và 7 của E7 (G#, D) chính là bậc 7 và 3 của Bb7 (Ab, D). Vì vậy Bb7 cũng kéo về Am, và bass Bb xuống A chỉ nửa cung.", "tip": "Bb7(#11): tay phải hợp âm C, là hợp âm ba nốt cao hơn nốt gốc một cung (Bb lên một cung là C). G# và Ab là cùng một phím đen.", "keys": ["Ab3", "D4"], "play": ["C", "E7(b13 #9)", "Bb7(#11)", "Am"]}], "remember": ["Đích là Am: đi qua C – G/B – Am, hoặc đặt \"mẹ\" E7 (màu #9, b13) ngay trước Am.", "b13 của E7 là C, cũng là #5: E7(b13) là E7 tăng.", "Bb7(#11) là \"bạn của mẹ\" thay E7 (chung G#–D), tay phải bấm hợp âm C."], "items": [{"chord": "G/B", "to": "Am", "prog": ["C", "G/B", "Am"]}, {"chord": "E7(b13)", "to": "Am", "prog": ["C", "G/B", "E7(b13)", "Am"]}, {"chord": "Bb7(#11)", "to": "Am", "prog": ["C", "E7(b13 #9)", "Bb7(#11)", "Am"]}], "quiz": [{"q": "Vì sao Bb7 kéo về Am được như E7?", "choices": ["Bb7 chung tritone G#–D với E7", "Bb7 là hợp âm trong giọng C", "Bb7 là \"chị\" của Am", "Bb7 có đủ ba nốt của Am"], "answer": "Bb7 chung tritone G#–D với E7", "why": "Bậc 3 và 7 của E7 (G#, D) chính là bậc 7 và 3 của Bb7 (Ab, D), nên Bb7 cũng kéo về Am."}, {"q": "Trong E7(b13), nốt b13 là nốt nào?", "choices": ["C", "C#", "B", "G"], "answer": "C", "why": "b13 của E7 là C, cũng là #5: B nhích lên nửa cung là B#, cùng phím với C."}, {"q": "Vì sao C – G/B – Am là tiến hành đi qua?", "choices": ["Bass đi liền bậc C, B, A, chỉ dùng hợp âm trong giọng", "Vì có hợp âm mượn", "Vì G/B là \"mẹ\" của Am", "Vì có hợp âm giảm"], "answer": "Bass đi liền bậc C, B, A, chỉ dùng hợp âm trong giọng", "why": "G/B nằm trong giọng C; bass đi từng bậc C, B, A nên tự nó dẫn vào Am."}]},

  {"id": "p4-20", "part": 4, "src": "Phildave 4 · Bài 20", "title": "Vào F: II–V, chia V làm hai, Fm6 và Bb7 mượn", "teach": [{"text": "Vị trí của II–V–I (투파이브원의 위치): ở chữ \"시냇물을 찾아\" (tìm dòng suối nước), câu đi về F, nên hợp âm đích là F. Thầy đặt II–V của F: Gm7 là II, C7 là V. Ở đây C7 viết thành Bb/C, tức C7 9sus4.", "tip": "Bb/C: tay trái C, tay phải hợp âm Bb (C lùi một cung là Bb).", "compare": {"a": {"label": "Am7(9) – Gm7 – C7 – F", "play": ["Am7(9)", "Gm7", "C7", "F"]}, "b": {"label": "Am7(9) – Gm7 – Bb/C – F", "play": ["Am7(9)", "Gm7", "Bb/C", "F"]}}}, {"text": "Chia V làm hai (파이브를 둘로 나눈다): Am7(9) – Bb/C – Gb7(#11) – F. Lần này không dùng II, chỉ dùng V nhưng chia làm hai: trước là C7 9sus4 (Bb/C), sau là Gb7, \"bạn của mẹ\" thay C7. Thầy nói cả hai đều là \"C7\": Gb7 chung tritone E–Bb với C7, chỉ đổi nốt gốc.", "tip": "Gb7(#11): tay phải hợp âm Ab, là hợp âm ba nốt cao hơn nốt gốc một cung (Gb lên một cung là Ab).", "play": ["Am7(9)", "Bb/C", "Gb7(#11)", "F"]}, {"text": "Kết Amen xuất hiện (아멘종지 출현): ở chữ \"헤매이듯\" (như đang lang thang), thầy đi F – Fm/G. F đổi sang Fm là bước kết Amen, mượn từ C thứ; Fm/G vừa có màu Fm, vừa có bass G của hợp âm V.", "tip": "Từ F sang Fm/G: tay phải chỉ hạ A xuống Ab, tay trái đổi F lên G.", "play": ["F", "Fm/G"]}, {"text": "Hợp âm mượn (모달인터체인지 코드): F – Fm6. Cùng chỗ đó, thầy thử Fm6, một hợp âm mượn khác từ C thứ. Fm6 có nốt Ab của C thứ nên nghe tối và ấm hơn F.", "tip": "Fm6 = F Ab C D: từ F, tay phải hạ A xuống Ab, còn F đổi thành D (nốt 6: C lên một cung là D).", "play": ["F", "Fm6"]}, {"text": "Hợp âm thay thế modal (모달의 대리코드): F – Bb7(#11). Ở đây Bb7 không phải \"bạn của mẹ\" của E7, mà dùng như hợp âm mượn từ C thứ. Bb7 có nốt Ab, nốt đặc trưng của C thứ, nên đứng chung nhóm với Fm.", "tip": "Bb7(#11): tay trái Bb D Ab, tay phải hợp âm C, là hợp âm ba nốt cao hơn nốt gốc một cung (Bb lên một cung là C).", "play": ["F", "Bb7(#11)"]}], "remember": ["Vào F: II–V là Gm7 – C7; C7 viết thành Bb/C (9sus4).", "Chỉ dùng V cũng được: Bb/C rồi Gb7(#11), cả hai đều là \"C7\".", "Ở chỗ F: Fm/G (kết Amen), Fm6 hay Bb7(#11), đều mượn từ C thứ."], "items": [{"chord": "Gb7(#11)", "to": "F", "prog": ["Am7(9)", "Bb/C", "Gb7(#11)", "F"]}, {"chord": "Fm6", "rel": "modal", "prog": ["F", "Fm6"]}, {"chord": "Bb7(#11)", "rel": "modal", "prog": ["F", "Bb7(#11)"]}], "quiz": [{"q": "Trong Am7(9) – Bb/C – Gb7(#11) – F, vì sao nói Bb/C và Gb7 đều là \"C7\"?", "choices": ["Bb/C là C7 9sus4, còn Gb7 chung tritone E–Bb với C7", "Vì cả hai có nốt gốc C", "Vì cả hai là hợp âm mượn", "Vì cả hai là hợp âm trong giọng F"], "answer": "Bb/C là C7 9sus4, còn Gb7 chung tritone E–Bb với C7", "why": "Bb/C là C7 có 9 và sus4; Gb7 là \"bạn của mẹ\" thay C7. Cả hai cùng làm việc của V về F."}, {"q": "F – Fm6: Fm6 làm màu F đổi thế nào, vì sao?", "choices": ["Tối và ấm hơn, vì có nốt Ab của C thứ", "Sáng hơn, vì có nốt A", "Căng như hợp âm 7, vì có tritone", "Không đổi, vì cùng nốt gốc F"], "answer": "Tối và ấm hơn, vì có nốt Ab của C thứ", "why": "Fm6 = F Ab C D: Ab là nốt của C thứ, nên Fm6 là hợp âm mượn, làm màu F tối và ấm đi."}]},

  {"id": "p4-21", "part": 4, "src": "Phildave 4 · Bài 21", "title": "Đoạn A': hợp âm mượn có Ab, Ab/Bb và Abm7 – Db7(#11)", "teach": [{"text": "Các hợp âm thay thế modal (모달코드의 대리코드들): đoạn A' hát lại giai điệu của đoạn A, nên phải đổi màu. Đoạn A đã rơi C – G/B – Am, lần này thầy đi hướng khác: C – Fm/G, theo màu C thứ. Thầy dặn nhớ bốn hợp âm mượn thay nhau được: Dm7(b5), Fm, Abmaj7, Bb7; cả bốn đều có nốt Ab.", "tip": "Ab là A hạ nửa cung: thấy phím Ab trong hợp âm là biết hợp âm đó mượn từ C thứ.", "compare": {"a": {"label": "Đoạn A: C – G/B – Am", "play": ["C", "G/B", "Am"]}, "b": {"label": "Đoạn A': C – Fm/G", "play": ["C", "Fm/G"]}}}, {"text": "Nốt trên cùng với hợp âm mượn (모달코드의 탑노트 사용법): C – Dbmaj7 – Fm7. Thầy nói đã vào màu Fm thì cứ đi theo âm giai F thứ tự nhiên: Dbmaj7 và Fm7 đều lấy nốt trong âm giai này. Nốt giai điệu trên cùng cũng chọn trong âm giai đó, nên cả câu liền một màu.", "tip": "Âm giai F thứ tự nhiên: F G Ab Bb C Db Eb, tức đi phím trắng từ F nhưng hạ A, B, D, E xuống phím đen.", "play": ["C", "Dbmaj7", "Fm7"]}, {"text": "Hợp âm hai tính chất (두가지 성질의 코드): C – Fm7 – Ab/Bb. Fm7 – Bb7 trông như II–V, nhưng câu không đi về Eb, nên đây chỉ là hai hợp âm mượn. Fm7 đi cặp với Abmaj7 hoặc Bb7; Bb7 viết thành 9sus4 là Ab/Bb.", "tip": "Ab/Bb: tay trái Bb, tay phải hợp âm Ab (Bb lùi một cung là Ab), tức Bb7 9sus4.", "play": ["C", "Fm7", "Ab/Bb"]}, {"text": "Nốt màu quyết định câu kết (텐션에 따라 결론이 다르다): C – Fm7 – Bb7(#11). Cùng Fm7 – Bb7, nhưng đổi nốt màu của Bb7 thì câu nghe khác hẳn: tay trái Bb7, tay phải hợp âm C cho ra 9, #11, 13.", "tip": "Bb7(#11): tay phải hợp âm C, là hợp âm ba nốt cao hơn nốt gốc một cung (Bb lên một cung là C); C, E, G là 9, #11, 13.", "compare": {"a": {"label": "Bb7 9sus4: C – Fm7 – Ab/Bb", "play": ["C", "Fm7", "Ab/Bb"]}, "b": {"label": "Bb7(#11): C – Fm7 – Bb7(#11)", "play": ["C", "Fm7", "Bb7(#11)"]}}}, {"text": "II liên quan (릴레이티드 투 마이너): C – Abm7 – Db7(#11). Db7 là \"bạn của mẹ\" thay G7 (chung tritone F–B). Hợp âm 7 nào cũng có \"chị\" riêng, nên trước Db7 đặt được Abm7, \"chị\" của Db7.", "tip": "Tìm \"chị\": từ Db đếm lên 5 tên nốt (Db, Eb, F, Gb, Ab) ra Ab, nên \"chị\" là Abm7. Db7(#11): tay phải hợp âm Eb, là hợp âm ba nốt cao hơn nốt gốc một cung.", "play": ["C", "Abm7", "Db7(#11)"]}], "remember": ["Đoạn A' phải khác đoạn A: đi theo màu C thứ; Dm7(b5), Fm, Abmaj7, Bb7 đều có Ab và thay nhau được.", "Đã vào Fm thì chọn nốt theo âm giai F thứ tự nhiên (F G Ab Bb C Db Eb).", "Bb7 9sus4 là Ab/Bb; Bb7(#11) là Bb7 + hợp âm C; trước Db7 đặt \"chị\" Abm7."], "items": [{"chord": "Dbmaj7", "rel": "modal", "prog": ["C", "Dbmaj7", "Fm7"]}, {"chord": "Bb7(#11)", "rel": "modal", "prog": ["C", "Fm7", "Bb7(#11)"]}, {"chord": "Abm7", "to": "Db7(#11)", "prog": ["C", "Abm7", "Db7(#11)"]}], "quiz": [{"q": "Mẹo nhận hợp âm mượn từ C thứ trong bài giọng C là gì?", "choices": ["Có nốt Ab", "Có nốt B", "Có nốt gốc C", "Có nốt màu 9"], "answer": "Có nốt Ab", "why": "Ab là màu rõ nhất của C thứ; Dm7(b5), Fm, Abmaj7, Bb7 đều có Ab."}, {"q": "Đã vào màu Fm, thầy chọn hợp âm và nốt trên cùng theo âm giai nào?", "choices": ["Âm giai F thứ tự nhiên (F G Ab Bb C Db Eb)", "Âm giai C trưởng (toàn phím trắng)", "Âm giai F trưởng (F G A Bb C D E)", "Đi từng nửa cung (chromatic)"], "answer": "Âm giai F thứ tự nhiên (F G Ab Bb C Db Eb)", "why": "Thầy nói đã vào màu Fm thì cứ đi theo âm giai F thứ tự nhiên: Dbmaj7, Fm7 và nốt trên cùng đều lấy từ đó, nên cả câu liền một màu."}, {"q": "Vì sao Abm7 đứng trước Db7?", "choices": ["Abm7 là \"chị\" (II liên quan) của Db7", "Abm7 là hợp âm trong giọng C", "Abm7 là \"mẹ\" của Db7", "Abm7 là hợp âm giảm"], "answer": "Abm7 là \"chị\" (II liên quan) của Db7", "why": "Hợp âm 7 nào cũng có \"chị\" riêng; từ Db đếm lên 5 tên nốt ra Ab, nên \"chị\" của Db7 là Abm7."}]},

  {"id": "p4-22", "part": 4, "src": "Phildave 4 · Bài 22", "title": "\"Bạn của mẹ\" mang #11, #9 đi cùng b13 và màu của II–V–I", "teach": [{"text": "Nhìn nốt màu là biết \"bạn của mẹ\" (썹파이브는 텐션을 보면 안다): ở chữ \"내 영혼 주를\" (Linh hồn con… Chúa), thầy đi C – G/B – Bb7(#11) – Am, hợp âm đích là Am. Bb7 là \"bạn của mẹ\" thay E7, và \"bạn của mẹ\" luôn mang #11. Bass rơi từng nửa cung C, B, Bb, A, nghe rất hay.", "tip": "#11 của Bb7 là E: nốt 4 tính từ Bb (Eb) nâng nửa cung; E cũng là nốt gốc của E7 mà Bb7 thay.", "compare": {"a": {"label": "C – G/B – Am", "play": ["C", "G/B", "Am"]}, "b": {"label": "C – G/B – Bb7(#11) – Am", "play": ["C", "G/B", "Bb7(#11)", "Am"]}}}, {"text": "Một chỗ, nhiều hợp âm (코드를 보면 여러코드가): chỗ trước Am đặt được nhiều hợp âm mà vẫn về Am. Ngoài Bb7(#11), thầy thử E/G# (E7 đảo 1), E7(b13 #9), và cả hợp âm giảm G#°7. Thầy còn nói: sau \"bạn của mẹ\" cũng dùng được hợp âm giảm 7; cái gì cũng được, miễn là về Am.", "tip": "G#°7 = G# B D F, chính là E7(b9) bỏ nốt gốc E; bass G# đi lên A nên viết bằng dấu thăng.", "compare": {"a": {"label": "C – G/B – E7(b13 #9) – Am", "play": ["C", "G/B", "E7(b13 #9)", "Am"]}, "b": {"label": "C – G/B – G#°7 – Am", "play": ["C", "G/B", "G#°7", "Am"]}}}, {"text": "Đổi màu lệch thời điểm (텐션의 시간차 변화): C – E7(b13 #9) – E7(13). Giai điệu là G, nên E7 dùng #9 (chính là G) để khỏi chọi; #9 luôn đi cùng b13 (cặp màu biến đổi: #9 với b13, hoặc b9 với b13). Về hợp âm thứ thì màu biến đổi hợp nhất, nhưng đánh muộn một chút thì 13 tự nhiên (C#) vẫn vào được.", "tip": "Tay phải C E G nhích lên thành C# F# G#: C lên C# là b13 đổi thành 13.", "play": ["C", "E7(b13 #9)", "E7(13)"]}, {"text": "Nốt màu của II–V–I (투파이브원의 텐션들): ở chữ \"찾기에 갈급\", thầy đi Am7(9) – Gm7(9) – C7(b13) – F. Thêm 9 vào Gm7 nghe giàu hơn hẳn; C7 mang b13, mà b13 cũng là #5 như hợp âm tăng.", "tip": "C7(b13): tay trái C Bb, tay phải E Ab; Ab là G nhích lên nửa cung (#5), rồi đi tiếp lên A, bậc 3 của F.", "compare": {"a": {"label": "Am7(9) – Gm7 – C7 – F", "play": ["Am7(9)", "Gm7", "C7", "F"]}, "b": {"label": "Am7(9) – Gm7(9) – C7(b13) – F", "play": ["Am7(9)", "Gm7(9)", "C7(b13)", "F"]}}}], "remember": ["\"Bạn của mẹ\" luôn mang #11: Bb7(#11) thay E7, bass C, B, Bb, A rơi từng nửa cung.", "Chỗ trước Am đặt được nhiều hợp âm: E/G#, E7(b13 #9), G#°7, Bb7(#11).", "#9 luôn đi cùng b13; đánh muộn một chút thì đổi sang 13 tự nhiên được."], "items": [{"chord": "Bb7(#11)", "to": "Am", "prog": ["C", "G/B", "Bb7(#11)", "Am"]}, {"chord": "E7(b13 #9)", "to": "E7(13)", "rel": "line", "prog": ["C", "E7(b13 #9)", "E7(13)"], "why": "E7(b13 #9) và E7(13) giữ chung nốt gốc E; tay phải C E G nhích lên C# F# G#, nên b13 (C) thành 13 (C#)."}, {"chord": "C7(b13)", "to": "F", "prog": ["Am7(9)", "Gm7(9)", "C7(b13)", "F"]}], "quiz": [{"q": "Vì sao E7 ở đây dùng #9?", "choices": ["Giai điệu là G, mà #9 của E7 chính là G nên không chọi", "Vì E7 về hợp âm trưởng", "Vì #9 đi cùng 13 tự nhiên", "Vì E7 là hợp âm mượn"], "answer": "Giai điệu là G, mà #9 của E7 chính là G nên không chọi", "why": "Nốt giai điệu G nằm sẵn trong E7(b13 #9) (là #9), nên hợp âm và giai điệu không va nhau."}, {"q": "Nốt màu nào luôn có trên \"bạn của mẹ\"?", "choices": ["#11", "b9", "#9", "b13"], "answer": "#11", "why": "\"Bạn của mẹ\" như Bb7 luôn mang #11 (E), cũng là nốt gốc của E7 mà nó thay."}, {"q": "#9 thường đi cặp với nốt màu nào?", "choices": ["b13", "13", "9", "#11"], "answer": "b13", "why": "Màu biến đổi đi với màu biến đổi: #9 đi cùng b13 (hoặc b9 đi cùng b13)."}]},

  {"id": "p4-23", "part": 4, "src": "Phildave 4 · Bài 23", "title": "9sus4, Fm/G đủ ba nốt, sus4 về b9 và chọn Fm6 hay Fm7", "teach": [{"text": "9sus4 (나인써스포): ở chữ \"하나이\" (Con khát khao Ngài), bản gốc ghi F – G(sus4). Vì đây là G7 nên thầy làm thành 9sus4: F – F/G. F/G có thêm nốt 7 (F) và 9 (A) của G7, nên giàu hơn G(sus4) mà vẫn treo.", "tip": "F/G: tay trái G, tay phải hợp âm F (G lùi một cung là F).", "compare": {"a": {"label": "Bản gốc: F – G(sus4)", "play": ["F", "G(sus4)"]}, "b": {"label": "F – F/G (G7 9sus4)", "play": ["F", "F/G"]}}}, {"text": "Những hợp âm có thể nghĩ tới (상상할 수 있는 여러코드들): F – Fm/G, dùng Fm mượn từ C thứ. Thầy dặn Fm phải bấm đủ ba nốt (gốc, bậc 3, bậc 5) rồi đặt nốt giai điệu lên trên cùng; đủ ba nốt thì tai mới nghe rõ màu Fm.", "tip": "Fm/G: tay trái G, tay phải đủ hợp âm Fm (F Ab C); Ab là A hạ nửa cung.", "play": ["F", "Fm/G"]}, {"text": "Trung thành với cơ bản (기본에도 충실하자): F – G(sus4) – G7(b9). Đưa bậc 4 (C) về bậc 3 (B) là cách giải quyết sus4 cơ bản nhất; thêm b9 cho G7 căng hơn.", "tip": "C (bậc 4) xuống B (bậc 3), còn G trên cùng nhích lên nửa cung thành Ab (b9).", "play": ["F", ["G2", "C4", "D4", "G4"], ["G2", "F3", "B3", "D4", "Ab4"]]}, {"text": "\"Bạn của mẹ\" hoặc hợp âm mượn (썹파이브 또는 모달): F – Bb7(#11). Bb7 có thể hiểu là \"bạn của mẹ\" của E7, nhưng ở đây thầy dùng như hợp âm mượn: Fm và Bb7 là một cặp mượn từ C thứ, đi cùng nhau.", "tip": "Bb7(#11): tay trái Bb D Ab, tay phải hợp âm C, là hợp âm ba nốt cao hơn nốt gốc một cung (Bb lên một cung là C).", "play": ["F", "Bb7(#11)"]}, {"text": "Giai điệu quyết định chọn Fm6 hay Fm7: ở đây giai điệu là E. Fm7 có Eb, chỉ cách E nửa cung, nên chọi; Fm6 thay Eb bằng D nên nghe êm. Fm6 = F Ab C D cũng chính là Dm7(b5) (D F Ab C) có F ở bass, nên vẫn là hợp âm mượn.", "tip": "Nốt 6 của Fm6 là D (C lên một cung); nốt 7 của Fm7 là Eb (F lùi một cung).", "compare": {"a": {"label": "Fm7 với giai điệu E", "play": [["F2", "Ab3", "C4", "Eb4", "E5"]]}, "b": {"label": "Fm6 với giai điệu E", "play": [["F2", "Ab3", "C4", "D4", "E5"]]}}}], "remember": ["Bản gốc ghi sus4 mà là G7 thì làm thành 9sus4: F/G.", "Fm/G: bấm đủ ba nốt Fm, nốt giai điệu ở trên; G(sus4) – G7(b9): C xuống B, G lên Ab.", "Fm và Bb7 là cặp mượn từ C thứ; giai điệu E thì chọn Fm6 (D), không chọn Fm7 (Eb)."], "items": [{"chord": "G(sus4)", "to": "G7(b9)", "rel": "line", "prog": ["F", "G(sus4)", "G7(b9)"]}, {"chord": "Fm/G", "rel": "modal", "prog": ["F", "Fm/G"]}, {"chord": "Bb7(#11)", "rel": "modal", "prog": ["F", "Bb7(#11)"]}], "quiz": [{"q": "Giai điệu là E. Vì sao thầy chọn Fm6 thay vì Fm7?", "choices": ["Eb của Fm7 cách E nửa cung nên chọi; Fm6 có D thay Eb", "Vì Fm6 là hợp âm trong giọng C", "Vì Fm7 không phải hợp âm mượn", "Vì Fm6 có nốt E"], "answer": "Eb của Fm7 cách E nửa cung nên chọi; Fm6 có D thay Eb", "why": "Fm6 = F Ab C D không có Eb, nên không va với nốt giai điệu E."}, {"q": "Bản gốc ghi G(sus4). Vì sao thầy chơi F/G?", "choices": ["Đó là G7, nên làm thành 9sus4 (thêm nốt 7 F và 9 A)", "Vì F/G là hợp âm mượn", "Vì G(sus4) bấm sai", "Vì F/G là \"bạn của mẹ\" của C"], "answer": "Đó là G7, nên làm thành 9sus4 (thêm nốt 7 F và 9 A)", "why": "F/G = G + F A C: có nốt 7 và 9 của G7, bậc 4 (C) vẫn treo, nên là G7 9sus4."}]},

  {"id": "p4-24", "part": 4, "src": "Phildave 4 · Bài 24", "title": "II–V vào giọng thứ: Bm7(b5) – E7 màu biến đổi và biến thể", "teach": [{"text": "II–V vào giọng thứ: đoạn \"능력\" (năng lực) là điểm nhấn lớn của bài, phải vào Am thật đẹp bằng II–V, nên hợp âm đích là Am. Về giọng trưởng thì II là hợp âm m7 và V mang nốt màu tự nhiên (9, 13). Về giọng thứ thì II là m7(b5), V mang màu biến đổi; khung 1–3–7 của V vẫn giữ nguyên.", "tip": "Bm7(b5) là Bm7 hạ bậc 5 nửa cung: F# xuống F, nên chỉ dùng phím trắng B D F A.", "compare": {"a": {"label": "Vào C: Dm7 – G7(13) – C", "play": ["Dm7", "G7(13)", "C"]}, "b": {"label": "Vào Am: Bm7(b5) – E7(b9) – Am", "play": ["Bm7(b5)", "E7(b9)", "Am"]}}}, {"text": "Ba line màu biến đổi (얼터드 텐션 라인 1–3): C – Bm7(b5) rồi E7(b9), E7(b13 #9) hoặc E7(b13); mỗi line đều về Am. Ba line chỉ khác nốt màu của E7; nút Nghe phát ba line nối nhau. Thầy dặn học thuộc cả ba, rồi có thể đổi màu lệch thời điểm.", "tip": "Nốt màu của E7: b9 là F (E nhích lên nửa cung), #9 là G, b13 là C.", "play": ["Bm7(b5)", "E7(b9)", "Am", "Bm7(b5)", "E7(b13 #9)", "Am", "Bm7(b5)", "E7(b13)", "Am"]}, {"text": "Nốt màu tự nhiên (내추럴텐션): C – Bm7(b5) – E7(13) – Am. Lẽ ra E7 mang màu biến đổi, nhưng thầy dùng 13 tự nhiên (C#, màu của mixolydian) và nghe vẫn rất đẹp. Đây là một biến thể, không phải cách chuẩn.", "tip": "13 của E7 là C#: đếm 6 tên nốt từ E theo giọng E (E, F#, G#, A, B, C#).", "play": ["C", "Bm7(b5)", "E7(13)", "Am"]}, {"text": "II là hợp âm m7 (투(마이너쇬븐)): C – Bm7 – E7(b9) – Am. Lần đầu dùng Bm7(b5) là chuẩn; đến lần hát lại sau dấu quay lại, ai cũng chờ câu cũ, nên thầy đổi thành Bm7 cho câu có biến hoá.", "tip": "Bm7 khác Bm7(b5) đúng một nốt: F# thay cho F.", "compare": {"a": {"label": "Lần đầu: C – Bm7(b5) – E7(b9) – Am", "play": ["C", "Bm7(b5)", "E7(b9)", "Am"]}, "b": {"label": "Lần lặp: C – Bm7 – E7(b9) – Am", "play": ["C", "Bm7", "E7(b9)", "Am"]}}}, {"text": "Lực kéo về chủ và tiến hành đi qua (도미넌트모션과 경과적진행): C – Bm7 – Bb7(#11) – Am. Bb7, \"bạn của
